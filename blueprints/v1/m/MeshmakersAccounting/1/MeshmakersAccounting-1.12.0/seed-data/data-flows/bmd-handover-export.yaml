            # -- 3d) pruefprotokoll.txt: the readiness protocol (AB#5088) ---------------
            # The June 2026 package was exported on 4.8.; four documents of that period
            # were only captured on 16./26./27.8., six June/July payments had no document
            # at all and one document existed as a record with no file behind it. Nothing
            # warned. This protocol is computed from the data the two CSVs already collected
            # - no extra entity load - and ships INSIDE the package, so the tax advisor sees
            # the same picture as Gerald. It always ships, also when it finds nothing: an
            # absent protocol would be indistinguishable from an unchecked export.
            #
            # Six sections, each count + rows (date, counterparty/vendor, amount, number):
            #   1) payments of the period without a linked document
            #   1b) payments whose linked documents cover clearly less than the payment —
            #       gap > 15,- AND gap > 2 % of the payment. Section 1 is blind to these:
            #       a 4218,85 "Dienstreise Australien" backed by one 118,79 taxi receipt
            #       passed as fully documented. Its own two exemptions on top of Ignored
            #       and the receiptless category types: a Dauerbeleg among the linked
            #       documents (GrossTotal 0 covers nothing by design) and a document shared
            #       with 3+ payments (the payroll journal's gross is the whole month, not a
            #       cover for one salary payment).
            #   2) documents of the period without a stored original (cover sheet only)
            #   3a/3b) cross-period cases (document outside / payment outside)
            #   4) documents of the period captured after the period end
            #
            # The three legitimate outlier shapes are excluded, verified against all 1657
            # matched-with-document rows on prod-1/meshmakers (28.9.2026) - without them the
            # check reports hundreds of CORRECT links and is noise instead of signal:
            #   - receiptless payments: a cost category of type PERSONNEL(2), BANKFEES(9),
            #     VAT(15) or TAXES(16), MatchState Ignored (any ExclusionReason), and PayPal
            #     funding legs (the EUR leg PayPal collects from the giro account, and the
            #     card marker "PAYPAL *<merchant>" - the receipt sits on the ledger leg,
            #     AB#4509/AB#4596)
            #   - Dauerbelege (DocumentState RECURRING=4): GrossTotal 0 and a DocumentDate at
            #     the end of the validity, deliberately far from the debits they settle
            #   - collective documents / executed payment orders: one document with 3 or more
            #     linked payments (the payroll journal of AB#4539 is this shape)
