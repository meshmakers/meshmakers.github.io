                                      targetValueWriteMode: Overwrite
                                    - type: Flatten@1
                                      description: Collect the new document links
                                      path: $.key._csChecks[*]._assoc
                                      targetPath: $.key._csAssocs
                                      targetValueKind: Simple
                                      targetValueWriteMode: Overwrite
                                    - type: If@1
                                      description: The subset really resolved to at least two loaded documents (defensive — an id no candidate carries would settle nothing)
                                      path: $.key._csMemberCount
                                      operator: GreaterEqualsThan
                                      value: 2
                                      valueType: Double
                                      transformations:
                                        # The subset size is bounded to 2..4, so the three
                                        # possible comments are enumerated (default first,
                                        # then overwrite) instead of formatted —
                                        # FormatString@1 would render the aggregated count
