                                  operator: GreaterEqualThan
                                  comparisonValuePath: $.key._detDocMinDate
                                - attributePath: DocumentDate
                                  operator: LessEqualThan
                                  comparisonValuePath: $.key._detDocMaxDate
                        - type: If@1
                          description: At least TWO open documents of this counterparty — a single one is the exact pass's business
                          path: $._csCands.TotalCount
                          operator: GreaterEqualsThan
                          value: 2
                          valueType: Int64
                          transformations:
                            - type: If@1
                              description: …and at most 12 — a larger set is refused outright so the subset search stays bounded AND the ambiguity check stays complete
                              path: $._csCands.TotalCount
                              operator: LessEqualsThan
                              value: 12
                              valueType: Int64
                              transformations:
                                # The ONE bounded search. Returns null (no hit, ambiguous,
                                # or outside the accepted band) or the compact JSON
                                # {"clar":0|1,"ids":["<rtId>",…]} — clar 1 means the sum
                                # differs from the payment inside the 15 EUR fee cap, the
                                # AB#5087 case that is settled but flagged. Amounts are
                                # compared in integer CENTS, so a sum of doubles cannot
                                # miss by a rounding bit. A candidate with a PaidAmount is
                                # skipped (it is settled by several transactions).
                                - type: ExecuteCSharp@1
                                  description: Subset of 2..4 candidate documents whose gross totals sum to the payment (AB#5093)
                                  code: 'if (docs == null || docs.Length < 2) return null; var ids = new List<string>(); var cents = new List<long>(); foreach (var o in docs) { if (!(o is JsonElement)) continue; var e = (JsonElement)o; if (e.ValueKind != JsonValueKind.Object) continue; JsonElement idEl; if (!e.TryGetProperty("RtId", out idEl)) continue; var id = idEl.ValueKind == JsonValueKind.String ? idEl.GetString() : idEl.ToString(); if (string.IsNullOrWhiteSpace(id)) continue; JsonElement at; if (!e.TryGetProperty("Attributes", out at) || at.ValueKind != JsonValueKind.Object) continue; JsonElement g; if (!at.TryGetProperty("GrossTotal", out g) || g.ValueKind != JsonValueKind.Number) continue; var gross = g.GetDouble(); if (gross <= 0.0) continue; JsonElement pd; if (at.TryGetProperty("PaidAmount", out pd) && pd.ValueKind == JsonValueKind.Number && pd.GetDouble() > 0.0) continue; ids.Add(id); cents.Add((long)Round(gross * 100.0, MidpointRounding.AwayFromZero)); } var n = ids.Count; if (n < 2 || n > 12) return null; var pay = (long)Round(payAmount * 100.0, MidpointRounding.AwayFromZero); if (pay <= 0L) return null; var strictMask = -1; var feeMask = -1; var strictCount = 0; var feeCount = 0; var limit = 1 << n; for (var mask = 3; mask < limit; mask++) { var k = 0; var sum = 0L; for (var i = 0; i < n; i++) { if ((mask & (1 << i)) == 0) continue; k = k + 1; if (k > 4) break; sum = sum + cents[i]; } if (k < 2 || k > 4) continue; if (sum == pay) { strictCount = strictCount + 1; if (strictMask < 0) strictMask = mask; } else if (sum < pay && pay - sum <= 1500L) { feeCount = feeCount + 1; if (feeMask < 0) feeMask = mask; } } if (strictCount > 1) return null; if (strictCount == 0 && feeCount != 1) return null; var hit = strictCount == 1 ? strictMask : feeMask; var picked = new List<string>(); for (var i = 0; i < n; i++) { if ((hit & (1 << i)) != 0) picked.Add("\"" + ids[i] + "\""); } return "{\"clar\":" + (strictCount == 1 ? "0" : "1") + ",\"ids\":[" + string.Join(",", picked) + "]}";'
                                  usings:
                                    - System
                                    - System.Collections.Generic
                                    - System.Text.Json
                                  returnType: String
                                  arguments:
                                    - name: payAmount
                                      valuePath: $.key._docAmount
                                      dataType: Double
                                    - name: docs
                                      valuePath: $._csCands.Items
                                      dataType: RecordArray
                                  targetPath: $.key._csSubset
                                - type: If@1
                                  description: A subset was chosen — settle the whole group against this debit
                                  path: $.key._csSubset
                                  operator: RegexMatch
                                  value: .+
                                  valueType: String
                                  transformations:
                                    - type: Logger@1
