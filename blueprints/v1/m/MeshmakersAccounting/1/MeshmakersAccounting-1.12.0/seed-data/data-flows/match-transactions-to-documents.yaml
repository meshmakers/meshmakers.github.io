                                        - type: If@1
                                          description: Three documents
                                          path: $.key._csMemberCount
                                          operator: Equals
                                          value: 3
                                          valueType: Double
                                          transformations:
                                            - type: SetPrimitiveValue@1
                                              targetPath: $.key._csComment
                                              value: Auto-matched as collective payment of 3 documents (auto)
                                              valueType: String
                                        - type: If@1
                                          description: Four documents
                                          path: $.key._csMemberCount
                                          operator: Equals
                                          value: 4
                                          valueType: Double
                                          transformations:
                                            - type: SetPrimitiveValue@1
                                              targetPath: $.key._csComment
                                              value: Auto-matched as collective payment of 4 documents (auto)
