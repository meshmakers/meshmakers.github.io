                                        #     needing a second update node.
                                        - type: If@1
                                          description: The subset sum differs from the payment inside the fee tolerance
                                          path: $.key._csSubset
                                          operator: Contains
                                          value: '"clar":1'
                                          valueType: String
                                          transformations:
                                            - type: SetPrimitiveValue@1
                                              description: Default clarification note for this pass
                                              targetPath: $.key._csClarNote
                                              value: "Match outside strict band: collective payment differs from the sum of its documents (auto)"
                                              valueType: String
                                            - type: If@1
                                              description: An existing non-empty note is never overwritten
                                              path: $.key.Attributes.ClarificationNote
                                              operator: RegexMatch
                                              value: '\S'
                                              valueType: String
                                              transformations:
                                                - type: SetPrimitiveValue@1
                                                  targetPath: $.key._csClarNote
                                                  valuePath: $.key.Attributes.ClarificationNote
                                                  valueType: String
                                            - type: SetPrimitiveValue@1
                                              targetPath: $.key._csInClar
                                              value: true
                                              valueType: Boolean
                                        - type: CreateUpdateInfo@1
                                          description: Transaction is matched (collective payment of several documents)
                                          targetPath: $.key._csUpdates
                                          targetValueKind: Array
                                          targetValueWriteMode: Append
                                          updateKind: Update
                                          ckTypeId: Basic.Accounting/BankTransaction
                                          rtIdPath: $.key.RtId
                                          attributeUpdates:
                                            - attributeName: MatchState
                                              attributeValueType: Enum
                                              value: Matched
                                            - attributeName: MatchComment
                                              attributeValueType: String
                                              valuePath: $.key._csComment
                                            - attributeName: InClarification
                                              attributeValueType: Boolean
                                              valuePath: $.key._csInClar
                                            - attributeName: ClarificationNote
                                              attributeValueType: String
                                              valuePath: $.key._csClarNote
                                        - type: ApplyChanges@2
                                          entityUpdatesPath: $.key._csUpdates
                                          associationUpdatesPath: $.key._csAssocs
                                        # The tolerance pass below (and its amount+date
                                        # fallback) is gated on $._candidates.TotalCount
                                        # == 0. This debit is settled now, so raise the
                                        # count — otherwise the tolerance pass could link
                                        # a SECOND, unrelated document to the same debit.
                                        - type: SetPrimitiveValue@1
                                          description: Suppress the tolerance pass for this transaction — it is already settled
                                          targetPath: $._candidates.TotalCount
                                          value: 1
                                          valueType: Int
                - type: If@1
                  # Tolerance pass: no document had the EXACT amount. Cross-border
                  # transfers frequently add a small fee to the SAME booking, so the
                  # paid amount is a few euro above the invoice gross total (e.g. an
                  # AZV fee of ~8 EUR). Anchor on the bank ACCOUNT HOLDER — the invoice
                  # bank section's account name (Vendor/Customer.AccountName) equals the
                  # transaction's CounterpartName even when the letterhead company name
                  # differs — and accept the unique open document whose GrossTotal lies
                  # in [payment - feeCap, payment]. Runs only when the exact pass found
                  # nothing, so an exact match always wins.
                  description: Tolerance pass — same account holder, payment exceeds invoice by a small transfer fee
                  path: $._candidates.TotalCount
                  operator: Equals
                  value: 0
                  valueType: Int64
                  transformations:
                    - type: Math@1
                      description: Lower bound = payment minus the maximum tolerated transfer fee (15 EUR)
                      path: $.key
                      itemPath: $._docAmount
                      itemTargetPath: $._docAmountFloor
                      operation: Subtract
                      value: 15
                    - type: SetPrimitiveValue@1
                      description: Not yet settled by the account-holder pass (drives the amount+date fallback)
                      targetPath: $._tolSettled
                      value: false
                      valueType: Boolean
                    - type: If@1
                      # Only anchor when the transaction carries a counterpart name;
                      # otherwise the identity filter would match null-account-holder
                      # documents. RegexMatch '.+' is a null/empty guard.
                      description: Transaction has a counterpart name to anchor on
                      path: $.key.Attributes.CounterpartName
                      operator: RegexMatch
                      value: .+
                      valueType: String
                      transformations:
                        - type: If@1
                          description: INCOMING invoice — the vendor is the account holder
                          path: $._wantedDocType
                          operator: Equals
                          value: 0
                          valueType: Int
                          transformations:
                            - type: GetRtEntitiesByType@1
                              description: Open incoming docs, same vendor account holder, gross within fee tolerance
                              ckTypeId: Meshmakers.Accounting/AccountingDocument
                              targetPath: $._tolCandidates
                              take: 5
                              fieldFilters:
                                - attributePath: DocumentState
                                  operator: Equals
                                  comparisonValue: 0
                                - attributePath: DocumentType
                                  operator: Equals
                                  comparisonValue: 0
                                - attributePath: Vendor.AccountName
                                  operator: Equals
                                  comparisonValuePath: $.key.Attributes.CounterpartName
                                - attributePath: GrossTotal
                                  operator: LessEqualThan
                                  comparisonValuePath: $.key._docAmount
                                - attributePath: GrossTotal
                                  operator: GreaterEqualThan
                                  comparisonValuePath: $.key._docAmountFloor
                        - type: If@1
                          description: OUTGOING invoice — the customer is the account holder
                          path: $._wantedDocType
                          operator: Equals
                          value: 1
                          valueType: Int
                          transformations:
                            - type: GetRtEntitiesByType@1
                              description: Open outgoing docs, same customer account holder, gross within fee tolerance
                              ckTypeId: Meshmakers.Accounting/AccountingDocument
                              targetPath: $._tolCandidates
                              take: 5
                              fieldFilters:
                                - attributePath: DocumentState
                                  operator: Equals
                                  comparisonValue: 0
                                - attributePath: DocumentType
                                  operator: Equals
                                  comparisonValue: 1
                                - attributePath: Customer.AccountName
                                  operator: Equals
                                  comparisonValuePath: $.key.Attributes.CounterpartName
                                - attributePath: GrossTotal
                                  operator: LessEqualThan
                                  comparisonValuePath: $.key._docAmount
                                - attributePath: GrossTotal
                                  operator: GreaterEqualThan
                                  comparisonValuePath: $.key._docAmountFloor
                        # --- AB#5091: the card transaction date is a first-class matching key -------
                        #     771 of 1755 matched transactions on prod-1/meshmakers carry a card
                        #     purpose, and the date printed there ("K2 18.07.") is the date of the
                        #     RECEIPT, while the booking date is one to three days later. So a
                        #     candidate whose DocumentDate equals the transaction's CardTransactionDate
                        #     beats every other candidate of this pass: when exactly ONE of the loaded
                        #     candidates carries that day, the candidate set is REPLACED by it and the
                        #     unchanged uniqueness branch below settles precisely that document. Every
                        #     guard after this point (date window, rival guard, fee band) stays in
                        #     force. Two candidates on the card day answer null on purpose - the pass
                        #     then behaves exactly as before and the ambiguity is left to the AI pass.
                        - type: ExecuteCSharp@1
                          description: Candidate document dated on the transaction's card transaction date (tolerance pass)
                          code: 'if (string.IsNullOrWhiteSpace(cardDate) || docs == null) return null; if (cardDate.Length < 10) return null; var day = cardDate.Substring(0, 10); string hit = null; var n = 0; foreach (var o in docs) { if (!(o is JsonElement)) continue; var e = (JsonElement)o; if (e.ValueKind != JsonValueKind.Object) continue; JsonElement idEl; if (!e.TryGetProperty("RtId", out idEl)) continue; JsonElement at; if (!e.TryGetProperty("Attributes", out at) || at.ValueKind != JsonValueKind.Object) continue; JsonElement dd; if (!at.TryGetProperty("DocumentDate", out dd) || dd.ValueKind != JsonValueKind.String) continue; var s = dd.GetString(); if (s == null || s.Length < 10 || s.Substring(0, 10) != day) continue; n = n + 1; hit = idEl.ValueKind == JsonValueKind.String ? idEl.GetString() : idEl.ToString(); } return n == 1 ? hit : null;'
                          usings:
                            - System
                            - System.Text.Json
                          returnType: String
                          arguments:
                            - name: cardDate
                              valuePath: $.key.Attributes.CardTransactionDate
                              dataType: String
                            - name: docs
                              valuePath: $._tolCandidates.Items
                              dataType: RecordArray
                          targetPath: $.key._cardWinner
                        - type: If@1
                          description: A candidate carries the card transaction date - it wins outright over the others
                          path: $.key._cardWinner
                          operator: RegexMatch
                          value: .+
                          valueType: String
                          transformations:
                            - type: Logger@1
                              message: "AB#5091 tolerance pass: candidate selected by the card transaction date"
                            - type: SetPrimitiveValue@1
                              description: GetRtEntitiesById@1 reads rtIdsPath as an ARRAY, so wrap the single id (AB#5348)
                              targetPath: $.key._cardWinnerIds
                              valuePath: $.key._cardWinner
                              valueType: String
                              targetValueKind: Array
                            - type: GetRtEntitiesById@1
                              description: Reduce the candidate set to the card-date winner
                              ckTypeId: Meshmakers.Accounting/AccountingDocument
                              rtIdsPath: $.key._cardWinnerIds
                              targetPath: $._tolCandidates
                              targetValueKind: Simple
                              targetValueWriteMode: Overwrite
                        # --- AB#5087: POS vendor plausibility ---------------------------------------
                        #     A card purpose names the merchant after the card date
                        #     ("K1 15.07. 12:01 SPAR 2361"). A candidate whose vendor/customer name
                        #     shares no word of at least 4 letters with that merchant token is not a
                        #     plausible receipt for this purchase - that is how SPAR was matched to a
                        #     Drei invoice and Rechenwirt to a BAUHAUS one. Comparison is
                        #     case-insensitive with folded umlauts (ae/oe/ue/ss) and accepts a
                        #     truncated merchant token as a prefix. A purpose without a merchant token,
                        #     or a document with no usable party name, is not judged - the gate answers
                        #     true and nothing changes. Same code in every place that uses it.
                        #     Defence in depth only: this branch requires a CounterpartName, which a card
                        - type: ExecuteCSharp@1
                          description: Card merchant shares a name with the candidate's party (tolerance pass)
                          code: 'Func<string,string> F = s => string.IsNullOrEmpty(s) ? "" : s.ToLowerInvariant().Replace("ä","a").Replace("ö","o").Replace("ü","u").Replace("ß","ss"); Func<string,HashSet<string>> W = s => { var set = new HashSet<string>(StringComparer.Ordinal); foreach (Match wm in Regex.Matches(F(s), @"[a-z]{4,}")) { set.Add(wm.Value); } return set; }; Func<string,string,string,bool> POS = (pp, vn, cn) => { if (string.IsNullOrWhiteSpace(pp)) return true; var pm = Regex.Match(pp, @"\bK\d\s+\d{2}\.\d{2}\.\s+\d{2}:\d{2}\s+(.+)$"); if (!pm.Success) return true; var merch = W(pm.Groups[1].Value); if (merch.Count == 0) return true; var party = W(vn); foreach (var w in W(cn)) { party.Add(w); } if (party.Count == 0) return true; foreach (var a in party) { foreach (var b in merch) { if (a == b || a.StartsWith(b) || b.StartsWith(a)) return true; } } return false; }; return POS(purpose, vendorName, customerName);'
                          usings:
                            - System
                            - System.Collections.Generic
                            - System.Text.RegularExpressions
                          returnType: Boolean
                          arguments:
                            - name: purpose
                              valuePath: $.key.Attributes.Purpose
                              dataType: String
                            - name: vendorName
                              valuePath: $._tolCandidates.Items[0].Attributes.Vendor.Attributes.CompanyName
                              dataType: String
                            - name: customerName
                              valuePath: $._tolCandidates.Items[0].Attributes.Customer.Attributes.CompanyName
                              dataType: String
                          targetPath: $.key._posOk
                        - type: If@1
                          description: Card merchant does not match the candidate's party - do not settle
                          path: $.key._posOk
                          operator: Equals
                          value: false
                          valueType: Boolean
                          transformations:
                            - type: Logger@1
                              message: "AB#5087 tolerance pass: card merchant shares no name with the candidate party - left open"
                            - type: SetPrimitiveValue@1
                              description: Veto - an empty candidate set is what the uniqueness branch below reads
                              targetPath: $._tolCandidates.TotalCount
                              value: 0
                              valueType: Int64
                        - type: If@1
                          description: Exactly one account-holder match within tolerance — settle it
                          path: $._tolCandidates.TotalCount
                          operator: Equals
                          value: 1
                          valueType: Int64
                          transformations:
                            - type: GetAssociationTargets@1
                              description: Existing tx links on this document (idempotency guard, AB#4398)
                              originRtIdPath: $._tolCandidates.Items[0].RtId
                              originCkTypeId: Meshmakers.Accounting/AccountingDocument
                              targetCkTypeId: Basic.Accounting/BankTransaction
                              associationRoleId: Meshmakers.Accounting/TransactionToDocument
                              graphDirection: Outbound
                              targetPath: $._tolExisting
                            - type: If@1
                              description: Create the link only when the document is not already linked (a stale link still settles via the existing one)
                              path: $._tolExisting[0].TotalCount
                              operator: Equals
                              value: 0
                              valueType: Int64
                              transformations:
                                - type: CreateAssociationUpdate@1
                                  description: Link document to transaction
                                  targetPath: $._tolAssocs
                                  targetValueKind: Array
                                  targetValueWriteMode: Append
                                  updateKind: Create
                                  originRtIdPath: $._tolCandidates.Items[0].RtId
                                  originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                  targetRtIdPath: $.key.RtId
                                  targetCkTypeId: Basic.Accounting/BankTransaction
                                  associationRoleId: Meshmakers.Accounting/TransactionToDocument
                            - type: CreateUpdateInfo@1
                              description: Document is paid — PaidAmount is the invoice total; the extra paid is the transfer fee
                              targetPath: $._tolUpdates
                              targetValueKind: Array
                              targetValueWriteMode: Append
                              updateKind: Update
                              ckTypeId: Meshmakers.Accounting/AccountingDocument
                              rtIdPath: $._tolCandidates.Items[0].RtId
                              attributeUpdates:
                                - attributeName: DocumentState
                                  attributeValueType: Enum
                                  value: PAID
                                - attributeName: PaidAmount
                                  attributeValueType: Double
                                  valuePath: $._tolCandidates.Items[0].Attributes.GrossTotal
                            # --- AB#5087 amount gate (tolerance pass) -----------------------------------
                            #     Already enforced by the candidate query: GrossTotal must lie in
                            #     [payment - 15 EUR, payment], i.e. payment >= document gross and at most
                            #     the file's own transfer-fee cap above it. No new constant is introduced.
                            # --- AB#5087: surface, do not hide ------------------------------------------
                            #     The match is inside this pass's accepted tolerance but outside the strict
                            #     band, so it is flagged for a human instead of being settled silently. An
                            #     existing non-empty note always wins: default first, then overwrite only
                            #     when the stored note is absent or blank (RegexMatch is null-safe, so an
                            #     unset attribute simply does not match). Deliberately NOT SelectByPath@1
                            #     here: it would also copy a stored EMPTY note over the default.
                            - type: SetPrimitiveValue@1
                              description: Default clarification note for this pass
                              targetPath: $.key._clarNote
                              value: "Match outside strict band: payment exceeds the document gross by up to the 15 EUR transfer-fee tolerance (auto)"
                              valueType: String
                            - type: If@1
                              description: An existing non-empty note is never overwritten
                              path: $.key.Attributes.ClarificationNote
                              operator: RegexMatch
                              value: '\S'
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.key._clarNote
                                  valuePath: $.key.Attributes.ClarificationNote
                                  valueType: String
                            - type: CreateUpdateInfo@1
                              description: Transaction is matched (payment includes a transfer fee)
                              targetPath: $._tolUpdates
                              targetValueKind: Array
                              targetValueWriteMode: Append
                              updateKind: Update
                              ckTypeId: Basic.Accounting/BankTransaction
                              rtIdPath: $.key.RtId
                              attributeUpdates:
                                - attributeName: MatchState
                                  attributeValueType: Enum
                                  value: Matched
                                - attributeName: MatchComment
                                  attributeValueType: String
                                  value: Auto-matched incl. transfer fee (payment exceeds invoice)
                                - attributeName: InClarification
                                  attributeValueType: Boolean
                                  value: true
                                - attributeName: ClarificationNote
                                  attributeValueType: String
                                  valuePath: $.key._clarNote
                            - type: ApplyChanges@2
                              entityUpdatesPath: $._tolUpdates
                              associationUpdatesPath: $._tolAssocs
                            - type: SetPrimitiveValue@1
                              description: Settled by the account-holder pass — skip the amount+date fallback
                              targetPath: $._tolSettled
                              value: true
                              valueType: Boolean
                    - type: If@1
                      # AB#4433: the anonymous fallback below is designed for
                      # transactions WITHOUT an identity anchor. A transaction that
                      # carries a counterpart name (e.g. a SEPA debit from
                      # "Salzburger Nachrichten") must never be fee-band-matched to
                      # an unrelated vendor's invoice. Mark such transactions as
                      # settled so the fallback is skipped. RegexMatch is null-safe:
                      # a null counterpart name simply does not match.
                      description: Counterpart name present — identity anchor exists, skip the anonymous fallback
                      path: $.key.Attributes.CounterpartName
                      operator: RegexMatch
                      value: ".+"
                      valueType: String
                      transformations:
                        - type: SetPrimitiveValue@1
                          description: Named counterpart — the anonymous amount+date fallback must not fire
                          targetPath: $._tolSettled
                          value: true
                          valueType: Boolean
                    - type: If@1
                      # Last-resort fallback for documents WITHOUT an extracted account
                      # holder name (e.g. historical documents parsed before accountName
                      # existed): no identity anchor, so it is deliberately conservative —
                      # it accepts a document only when it is the UNIQUE open document of
                      # the right type whose GrossTotal is in [payment - feeCap, payment]
                      # AND the transaction booked on/after the document date (a payment
                      # never precedes its invoice). Runs only when the account-holder
                      # pass did not settle this transaction.
                      description: Amount+date fallback — unique open doc by amount band and booking date
                      path: $._tolSettled
                      operator: Equals
                      value: false
                      valueType: Boolean
                      transformations:
                        - type: GetRtEntitiesByType@1
                          description: Open docs of the right type, gross within the fee tolerance band
                          ckTypeId: Meshmakers.Accounting/AccountingDocument
                          targetPath: $._fbCandidates
                          take: 5
                          fieldFilters:
                            - attributePath: DocumentState
                              operator: Equals
                              comparisonValue: 0
                            - attributePath: DocumentType
                              operator: Equals
                              comparisonValuePath: $._wantedDocType
                            - attributePath: GrossTotal
                              operator: LessEqualThan
                              comparisonValuePath: $.key._docAmount
                            - attributePath: GrossTotal
                              operator: GreaterEqualThan
                              comparisonValuePath: $.key._docAmountFloor
                        # --- AB#5091: the card transaction date is a first-class matching key -------
                        #     771 of 1755 matched transactions on prod-1/meshmakers carry a card
                        #     purpose, and the date printed there ("K2 18.07.") is the date of the
                        #     RECEIPT, while the booking date is one to three days later. So a
                        #     candidate whose DocumentDate equals the transaction's CardTransactionDate
                        #     beats every other candidate of this pass: when exactly ONE of the loaded
                        #     candidates carries that day, the candidate set is REPLACED by it and the
                        #     unchanged uniqueness branch below settles precisely that document. Every
                        #     guard after this point (date window, rival guard, fee band) stays in
                        #     force. Two candidates on the card day answer null on purpose - the pass
                        #     then behaves exactly as before and the ambiguity is left to the AI pass.
                        - type: ExecuteCSharp@1
                          description: Candidate document dated on the transaction's card transaction date (amount+date fallback)
                          code: 'if (string.IsNullOrWhiteSpace(cardDate) || docs == null) return null; if (cardDate.Length < 10) return null; var day = cardDate.Substring(0, 10); string hit = null; var n = 0; foreach (var o in docs) { if (!(o is JsonElement)) continue; var e = (JsonElement)o; if (e.ValueKind != JsonValueKind.Object) continue; JsonElement idEl; if (!e.TryGetProperty("RtId", out idEl)) continue; JsonElement at; if (!e.TryGetProperty("Attributes", out at) || at.ValueKind != JsonValueKind.Object) continue; JsonElement dd; if (!at.TryGetProperty("DocumentDate", out dd) || dd.ValueKind != JsonValueKind.String) continue; var s = dd.GetString(); if (s == null || s.Length < 10 || s.Substring(0, 10) != day) continue; n = n + 1; hit = idEl.ValueKind == JsonValueKind.String ? idEl.GetString() : idEl.ToString(); } return n == 1 ? hit : null;'
                          usings:
                            - System
                            - System.Text.Json
                          returnType: String
                          arguments:
                            - name: cardDate
                              valuePath: $.key.Attributes.CardTransactionDate
                              dataType: String
                            - name: docs
                              valuePath: $._fbCandidates.Items
                              dataType: RecordArray
                          targetPath: $.key._cardWinner
                        - type: If@1
                          description: A candidate carries the card transaction date - it wins outright over the others
                          path: $.key._cardWinner
                          operator: RegexMatch
                          value: .+
                          valueType: String
                          transformations:
                            - type: Logger@1
                              message: "AB#5091 amount+date fallback: candidate selected by the card transaction date"
                            - type: SetPrimitiveValue@1
                              description: GetRtEntitiesById@1 reads rtIdsPath as an ARRAY, so wrap the single id (AB#5348)
                              targetPath: $.key._cardWinnerIds
                              valuePath: $.key._cardWinner
                              valueType: String
                              targetValueKind: Array
                            - type: GetRtEntitiesById@1
                              description: Reduce the candidate set to the card-date winner
                              ckTypeId: Meshmakers.Accounting/AccountingDocument
                              rtIdsPath: $.key._cardWinnerIds
                              targetPath: $._fbCandidates
                              targetValueKind: Simple
                              targetValueWriteMode: Overwrite
                        # --- AB#5091: no candidate carried the card date -----------------------------
                        #     Taking the leftover anyway is exactly how the AB#5092 displacement chain
                        #     started: a card purchase whose own receipt was not open yet claimed the
                        #     receipt of a neighbouring purchase, which then claimed the next one. When
                        #     the transaction HAS a card date, this pass may only settle a candidate
                        #     whose document date is within 3 days of it; otherwise the transaction is
                        #     left open for the next run (or the AI pass, which sees the purpose text).
                        #     A transaction without a card date, or a candidate without a document
                        #     date, is not judged here - the gate answers true and nothing changes.
                        - type: ExecuteCSharp@1
                          description: Card date within 3 days of the candidate's document date (amount+date fallback)
                          code: 'if (string.IsNullOrWhiteSpace(cardDate) || cardDate.Length < 10) return true; if (string.IsNullOrWhiteSpace(docDate) || docDate.Length < 10) return true; DateTime c; DateTime d; var f = "yyyy-MM-dd"; var iv = CultureInfo.InvariantCulture; var ns = DateTimeStyles.None; if (!DateTime.TryParseExact(cardDate.Substring(0, 10), f, iv, ns, out c)) return true; if (!DateTime.TryParseExact(docDate.Substring(0, 10), f, iv, ns, out d)) return true; return Abs((d - c).TotalDays) <= 3.0;'
                          usings:
                            - System
                            - System.Globalization
                          returnType: Boolean
                          arguments:
                            - name: cardDate
                              valuePath: $.key.Attributes.CardTransactionDate
                              dataType: String
                            - name: docDate
                              valuePath: $._fbCandidates.Items[0].Attributes.DocumentDate
                              dataType: String
                          targetPath: $.key._cardNear
                        - type: If@1
                          description: Card date too far from the candidate's document date - do not settle
                          path: $.key._cardNear
                          operator: Equals
                          value: false
                          valueType: Boolean
                          transformations:
                            - type: Logger@1
                              message: "AB#5091 amount+date fallback: candidate more than 3 days from the card transaction date - left open"
                            - type: SetPrimitiveValue@1
                              description: Veto - an empty candidate set is what the uniqueness branch below reads
                              targetPath: $._fbCandidates.TotalCount
                              value: 0
                              valueType: Int64
                        # --- AB#5087: POS vendor plausibility ---------------------------------------
                        #     A card purpose names the merchant after the card date
                        #     ("K1 15.07. 12:01 SPAR 2361"). A candidate whose vendor/customer name
                        #     shares no word of at least 4 letters with that merchant token is not a
                        #     plausible receipt for this purchase - that is how SPAR was matched to a
                        #     Drei invoice and Rechenwirt to a BAUHAUS one. Comparison is
                        #     case-insensitive with folded umlauts (ae/oe/ue/ss) and accepts a
                        #     truncated merchant token as a prefix. A purpose without a merchant token,
                        #     or a document with no usable party name, is not judged - the gate answers
                        #     true and nothing changes. Same code in every place that uses it.
                        - type: ExecuteCSharp@1
                          description: Card merchant shares a name with the candidate's party (amount+date fallback)
                          code: 'Func<string,string> F = s => string.IsNullOrEmpty(s) ? "" : s.ToLowerInvariant().Replace("ä","a").Replace("ö","o").Replace("ü","u").Replace("ß","ss"); Func<string,HashSet<string>> W = s => { var set = new HashSet<string>(StringComparer.Ordinal); foreach (Match wm in Regex.Matches(F(s), @"[a-z]{4,}")) { set.Add(wm.Value); } return set; }; Func<string,string,string,bool> POS = (pp, vn, cn) => { if (string.IsNullOrWhiteSpace(pp)) return true; var pm = Regex.Match(pp, @"\bK\d\s+\d{2}\.\d{2}\.\s+\d{2}:\d{2}\s+(.+)$"); if (!pm.Success) return true; var merch = W(pm.Groups[1].Value); if (merch.Count == 0) return true; var party = W(vn); foreach (var w in W(cn)) { party.Add(w); } if (party.Count == 0) return true; foreach (var a in party) { foreach (var b in merch) { if (a == b || a.StartsWith(b) || b.StartsWith(a)) return true; } } return false; }; return POS(purpose, vendorName, customerName);'
                          usings:
                            - System
                            - System.Collections.Generic
                            - System.Text.RegularExpressions
                          returnType: Boolean
                          arguments:
                            - name: purpose
                              valuePath: $.key.Attributes.Purpose
                              dataType: String
                            - name: vendorName
                              valuePath: $._fbCandidates.Items[0].Attributes.Vendor.Attributes.CompanyName
                              dataType: String
                            - name: customerName
                              valuePath: $._fbCandidates.Items[0].Attributes.Customer.Attributes.CompanyName
                              dataType: String
                          targetPath: $.key._posOk
                        - type: If@1
                          description: Card merchant does not match the candidate's party - do not settle
                          path: $.key._posOk
                          operator: Equals
                          value: false
                          valueType: Boolean
                          transformations:
                            - type: Logger@1
                              message: "AB#5087 amount+date fallback: card merchant shares no name with the candidate party - left open"
                            - type: SetPrimitiveValue@1
                              description: Veto - an empty candidate set is what the uniqueness branch below reads
                              targetPath: $._fbCandidates.TotalCount
                              value: 0
                              valueType: Int64
                        - type: If@1
                          description: Exactly one amount-band candidate
                          path: $._fbCandidates.TotalCount
                          operator: Equals
                          value: 1
                          valueType: Int64
                          transformations:
                            # AB#4433: without an identity anchor, amount-band proximity
                            # alone is not enough — an Amazon payment 4.7 months after an
                            # unrelated NordVPN invoice landed in the band. Anonymous
                            # matches must also be CLOSE IN TIME: booking date within
                            # [document date - 1 day, document date + 14 days].
                            - type: DateTime@1
                              description: Date-window floor = document date - 1 day
                              operation: AddDays
                              path: $._fbCandidates.Items[0].Attributes.DocumentDate
                              value: -1
                              targetPath: $._fbMinDate
                            - type: DateTime@1
                              description: Date-window cap = document date + 14 days
                              operation: AddDays
                              path: $._fbCandidates.Items[0].Attributes.DocumentDate
                              value: 14
                              targetPath: $._fbMaxDate
                            - type: If@1
                              description: Transaction booked no earlier than one day before the document date
                              path: $.key.Attributes.BookingDate
                              operator: GreaterEqualsThan
                              valuePath: $._fbMinDate
                              valueType: DateTime
                              transformations:
                                - type: If@1
                                  description: …and no later than 14 days after the document date
                                  path: $.key.Attributes.BookingDate
                                  operator: LessEqualsThan
                                  valuePath: $._fbMaxDate
                                  valueType: DateTime
                                  transformations:
                                    # AB#4512 pattern ported to the anonymous fallback: the one-sided
                                    # "exactly one doc candidate" check is order-dependent — a Booking.com
                                    # debit (-374.95) claimed a Bierheuriger invoice (366.30) that a second
                                    # pending POS debit (-380.00, incl. tip) matched just as well. Require
                                    # TWO-SIDED uniqueness: this transaction must be the only pending
                                    # transaction whose amount lies in the document's fee band and whose
                                    # booking date lies in the document's date window; ambiguous clusters
                                    # fall through to the AI pass, which sees the purpose text.
                                    - type: SetPrimitiveValue@1
                                      description: Candidate gross total, copied to the transaction scope for Math
                                      targetPath: $.key._fbGross
                                      valuePath: $._fbCandidates.Items[0].Attributes.GrossTotal
                                      valueType: Double
                                    - type: Math@1
                                      description: Band cap = gross total + the maximum tolerated transfer fee (15 EUR)
                                      path: $.key
                                      itemPath: $._fbGross
                                      itemTargetPath: $._fbGrossCap
                                      operation: Add
                                      value: 15
                                    - type: SetPrimitiveValue@1
                                      description: Signed rival band lower bound (Credit default = gross total)
                                      targetPath: $.key._fbRivLow
                                      valuePath: $.key._fbGross
                                      valueType: Double
                                    - type: SetPrimitiveValue@1
                                      description: Signed rival band upper bound (Credit default = gross total + fee cap)
                                      targetPath: $.key._fbRivHigh
                                      valuePath: $.key._fbGrossCap
                                      valueType: Double
                                    - type: If@1
                                      description: Debit — amounts are negative, the signed band is the negated mirror
                                      path: $.key.Attributes.Direction
                                      operator: Equals
                                      value: 1
                                      valueType: Int64
                                      transformations:
                                        - type: Math@1
                                          description: Lower bound = -(gross total + fee cap)
                                          path: $.key
                                          itemPath: $._fbGrossCap
                                          itemTargetPath: $._fbRivLow
                                          operation: Multiply
                                          value: -1
                                        - type: Math@1
                                          description: Upper bound = -(gross total)
                                          path: $.key
                                          itemPath: $._fbGross
                                          itemTargetPath: $._fbRivHigh
                                          operation: Multiply
                                          value: -1
                                    - type: GetRtEntitiesByType@1
                                      # AB#4542: window-filtered in the query itself —
                                      # same take:50 truncation issue as the exact-pass
                                      # rival guard (90+ pending same-amount
                                      # transactions pushed the transaction under test
                                      # out of the returned page).
                                      description: Pending transactions whose amount lies in the same fee band, booked inside the document's date window (rival candidates)
                                      ckTypeId: Basic.Accounting/BankTransaction
                                      targetPath: $.key._fbRivals
                                      take: 50
                                      fieldFilters:
                                        - attributePath: MatchState
                                          operator: In
                                          comparisonValue:
                                            - 0
                                            - 2
                                        - attributePath: Direction
                                          operator: Equals
                                          comparisonValuePath: $.key.Attributes.Direction
                                        - attributePath: Amount
                                          operator: GreaterEqualThan
                                          comparisonValuePath: $.key._fbRivLow
                                        - attributePath: Amount
                                          operator: LessEqualThan
                                          comparisonValuePath: $.key._fbRivHigh
                                        - attributePath: BookingDate
                                          operator: GreaterEqualThan
                                          comparisonValuePath: $._fbMinDate
                                        - attributePath: BookingDate
                                          operator: LessEqualThan
                                          comparisonValuePath: $._fbMaxDate
                                    - type: ForEach@1
                                      description: Flag every rival booked inside the document's date window (the transaction itself counts once)
                                      iterationPath: $.key._fbRivals.Items
                                      targetPath: $.key._fbRivalChecks
                                      targetValueKind: Simple
                                      targetValueWriteMode: Overwrite
                                      maxDegreeOfParallelism: 1
                                      transformations:
                                        - type: SetPrimitiveValue@1
                                          description: Rival outside the window (default)
                                          targetPath: $.key._inWindow
                                          value: 0
                                          valueType: Int
                                        - type: If@1
                                          description: Rival booked no earlier than the window floor
                                          path: $.key.Attributes.BookingDate
                                          operator: GreaterEqualsThan
                                          valuePath: $.full._fbMinDate
                                          valueType: DateTime
                                          transformations:
                                            - type: If@1
                                              description: …and no later than the window cap
                                              path: $.key.Attributes.BookingDate
                                              operator: LessEqualsThan
                                              valuePath: $.full._fbMaxDate
                                              valueType: DateTime
                                              transformations:
                                                - type: SetPrimitiveValue@1
                                                  targetPath: $.key._inWindow
                                                  value: 1
                                                  valueType: Int
                                    - type: SumAggregation@1
                                      description: Count rivals inside the window
                                      targetPath: $.key._fbRivalsInWindow
                                      aggregations:
                                        - path: $.key._fbRivalChecks[*]
                                          aggregationPath: $._inWindow
                                          value: 1
                                          filterPath: null
                                          comparisonValue: null
                                    - type: If@1
                                      description: The transaction is the only in-window rival — unambiguous, apply the match
                                      path: $.key._fbRivalsInWindow
                                      operator: Equals
                                      value: 1
                                      valueType: Double
                                      transformations:
                                        - type: GetAssociationTargets@1
                                          description: Existing tx links on this document (idempotency guard, AB#4398)
                                          originRtIdPath: $._fbCandidates.Items[0].RtId
                                          originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                          targetCkTypeId: Basic.Accounting/BankTransaction
                                          associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                          graphDirection: Outbound
                                          targetPath: $._fbExisting
                                        - type: If@1
                                          description: Create the link only when the document is not already linked (a stale link still settles via the existing one)
                                          path: $._fbExisting[0].TotalCount
                                          operator: Equals
                                          value: 0
                                          valueType: Int64
                                          transformations:
                                            - type: CreateAssociationUpdate@1
                                              description: Link document to transaction
                                              targetPath: $._fbAssocs
                                              targetValueKind: Array
                                              targetValueWriteMode: Append
                                              updateKind: Create
                                              originRtIdPath: $._fbCandidates.Items[0].RtId
                                              originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                              targetRtIdPath: $.key.RtId
                                              targetCkTypeId: Basic.Accounting/BankTransaction
                                              associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                        - type: CreateUpdateInfo@1
                                          description: Document is paid — PaidAmount is the invoice total; the extra paid is the transfer fee
                                          targetPath: $._fbUpdates
                                          targetValueKind: Array
                                          targetValueWriteMode: Append
                                          updateKind: Update
                                          ckTypeId: Meshmakers.Accounting/AccountingDocument
                                          rtIdPath: $._fbCandidates.Items[0].RtId
                                          attributeUpdates:
                                            - attributeName: DocumentState
                                              attributeValueType: Enum
                                              value: PAID
                                            - attributeName: PaidAmount
                                              attributeValueType: Double
                                              valuePath: $._fbCandidates.Items[0].Attributes.GrossTotal
                                        # --- AB#5087 amount gate (amount+date fallback) -----------------------------
                                        #     Already enforced by the candidate query plus the two-sided rival guard
                                        #     above: GrossTotal in [payment - 15 EUR, payment] and this transaction is
                                        #     the only pending one in that band inside the document's date window.
                                        # --- AB#5087: surface, do not hide ------------------------------------------
                                        #     The match is inside this pass's accepted tolerance but outside the strict
                                        #     band, so it is flagged for a human instead of being settled silently. An
                                        #     existing non-empty note always wins: default first, then overwrite only
                                        #     when the stored note is absent or blank (RegexMatch is null-safe, so an
                                        #     unset attribute simply does not match). Deliberately NOT SelectByPath@1
                                        #     here: it would also copy a stored EMPTY note over the default.
                                        - type: SetPrimitiveValue@1
                                          description: Default clarification note for this pass
                                          targetPath: $.key._clarNote
                                          value: "Match outside strict band: amount band and date window only, no identity anchor (auto)"
                                          valueType: String
                                        - type: If@1
                                          description: An existing non-empty note is never overwritten
                                          path: $.key.Attributes.ClarificationNote
                                          operator: RegexMatch
                                          value: '\S'
                                          valueType: String
                                          transformations:
                                            - type: SetPrimitiveValue@1
                                              targetPath: $.key._clarNote
                                              valuePath: $.key.Attributes.ClarificationNote
                                              valueType: String
                                        - type: CreateUpdateInfo@1
                                          description: Transaction is matched (amount+date; payment includes a transfer fee)
                                          targetPath: $._fbUpdates
                                          targetValueKind: Array
                                          targetValueWriteMode: Append
                                          updateKind: Update
                                          ckTypeId: Basic.Accounting/BankTransaction
                                          rtIdPath: $.key.RtId
                                          attributeUpdates:
                                            - attributeName: MatchState
                                              attributeValueType: Enum
                                              value: Matched
                                            - attributeName: MatchComment
                                              attributeValueType: String
                                              value: Auto-matched by amount and date incl. transfer fee (no account-holder name)
                                            - attributeName: InClarification
                                              attributeValueType: Boolean
                                              value: true
                                            - attributeName: ClarificationNote
                                              attributeValueType: String
                                              valuePath: $.key._clarNote
                                        - type: ApplyChanges@2
                                          entityUpdatesPath: $._fbUpdates
                                          associationUpdatesPath: $._fbAssocs
            # --- Foreign-currency card pass (AB#4590) — foreign-currency card
            #     purchases ("E-COMM 24,00 USD ... SPESEN: 1,25 KURS: 1,160408")
            #     are booked in EUR: 24 USD becomes 21,93 EUR incl. the forex
            #     surcharge, so the EUR Amount never equals the invoice
            #     GrossTotal, which the AI stores as the ORIGINAL foreign amount
            #     (24). The exact pass (EUR amount == gross) and the tolerance
            #     pass (payment >= invoice, but here the EUR payment is BELOW the
            #     foreign gross) therefore both miss them, and these card debits
            #     carry no CounterpartName to anchor on. This pass reads the
            #     printed foreign amount out of the purpose (TransformString
            #     RegexExtract, German number -> JSON number) and settles the
            #     UNIQUE open incoming document whose GrossTotal equals it inside
            #     the document's date window. Gated to purposes carrying the
            #     all-caps "SPESEN:" surcharge (MatchRegEx is CASE-SENSITIVE, so
            #     it hits only genuine foreign-currency card purchases) — domestic
            #     EUR card debits (no SPESEN, EUR amount == gross) stay with the
            #     exact pass and its AB#4512 rival guard, so the same-amount
            #     collision cannot reappear here. No tx-side rival guard is
            #     needed: the doc-side uniqueness (exactly one in-window gross),
            #     the sequential settle (maxDegreeOfParallelism 1 flips the doc to
            #     PAID before the next iteration) and the existing-link guard make
            #     a double match impossible.
            - type: GetRtEntitiesByType@1
              description: Pending foreign-currency card debits (purpose carries the all-caps SPESEN surcharge)
              ckTypeId: Basic.Accounting/BankTransaction
              targetPath: $.fxPending
              take: 500
              fieldFilters:
                - attributePath: MatchState
                  operator: In
                  comparisonValue:
                    - 0
                    - 2
                - attributePath: Direction
                  operator: Equals
                  comparisonValue: 1
                - attributePath: Purpose
                  operator: MatchRegEx
                  comparisonValue: "SPESEN:"
            - type: ForEach@1
              description: Foreign-currency card pass — match the printed foreign amount to a unique open incoming document
              iterationPath: $.fxPending.Items
              targetPath: $.fxResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                # Presence guard first (string), so a non-conforming purpose never
                # reaches a numeric node as null (RegexMatch is null-safe; the
                # guarded value is a string, never a number — cf. the
                # RegexMatch-on-number trap). Pattern: the amount printed right
                # after "E-COMM" followed by its currency token ("E-COMM 24,00 USD",
                # "E-COMM 1.234,56 US"). No inline (?i): the token is upper-case.
                - type: TransformString@1
                  description: Foreign amount as text (presence probe)
                  path: $.key
                  sourcePath: $.Attributes.Purpose
                  targetPath: $._fxAmountStr
                  operation: RegexExtract
                  pattern: '^E-COMM\s+([0-9.]+,[0-9]{2})\s+[A-Z]'
                - type: If@1
                  description: A foreign amount was extracted from the purpose
                  path: $.key._fxAmountStr
                  operator: RegexMatch
                  value: .+
                  valueType: String
                  transformations:
                    # Same capture, coerced to a JSON number (strip "." grouping,
                    # "," -> "."), so the GrossTotal Equals filter can compare it.
                    - type: TransformString@1
                      description: Foreign amount as number for the gross-total filter
                      path: $.key
                      sourcePath: $.Attributes.Purpose
                      targetPath: $._fxAmount
                      operation: RegexExtract
                      pattern: '^E-COMM\s+([0-9.]+,[0-9]{2})\s+[A-Z]'
                      asDecimal: true
                      groupSeparator: "."
                      decimalSeparator: ","
                    - type: DateTime@1
                      description: Earliest document date whose match window still contains this booking date
                      operation: AddDays
                      path: $.key.Attributes.BookingDate
                      value: -14
                      targetPath: $.key._fxDocMinDate
                    - type: DateTime@1
                      description: Latest document date whose match window still contains this booking date
                      operation: AddDays
                      path: $.key.Attributes.BookingDate
                      value: 1
                      targetPath: $.key._fxDocMaxDate
                    - type: GetRtEntitiesByType@1
                      description: Open incoming documents whose gross total equals the printed foreign amount, dated so their window contains this booking date
                      ckTypeId: Meshmakers.Accounting/AccountingDocument
                      targetPath: $._fxCands
                      take: 5
                      fieldFilters:
                        - attributePath: DocumentState
                          operator: Equals
                          comparisonValue: 0
                        - attributePath: DocumentType
                          operator: Equals
                          comparisonValue: 0
                        - attributePath: GrossTotal
                          operator: Equals
                          comparisonValuePath: $.key._fxAmount
                        - attributePath: DocumentDate
                          operator: GreaterEqualThan
                          comparisonValuePath: $.key._fxDocMinDate
                        - attributePath: DocumentDate
                          operator: LessEqualThan
                          comparisonValuePath: $.key._fxDocMaxDate
                    - type: If@1
                      description: Exactly one open incoming document with that foreign gross in-window — settle it
                      path: $._fxCands.TotalCount
                      operator: Equals
                      value: 1
                      valueType: Int64
                      transformations:
                        - type: GetAssociationTargets@1
                          description: Existing tx links on this document (idempotency guard, AB#4398)
                          originRtIdPath: $._fxCands.Items[0].RtId
                          originCkTypeId: Meshmakers.Accounting/AccountingDocument
                          targetCkTypeId: Basic.Accounting/BankTransaction
                          associationRoleId: Meshmakers.Accounting/TransactionToDocument
                          graphDirection: Outbound
                          targetPath: $._fxExisting
                        - type: If@1
                          description: Create the link only when the document is not already linked
                          path: $._fxExisting[0].TotalCount
                          operator: Equals
                          value: 0
                          valueType: Int64
                          transformations:
                            - type: CreateAssociationUpdate@1
                              description: Link document to transaction
                              targetPath: $._fxAssocs
                              targetValueKind: Array
                              targetValueWriteMode: Append
                              updateKind: Create
                              originRtIdPath: $._fxCands.Items[0].RtId
                              originCkTypeId: Meshmakers.Accounting/AccountingDocument
                              targetRtIdPath: $.key.RtId
                              targetCkTypeId: Basic.Accounting/BankTransaction
                              associationRoleId: Meshmakers.Accounting/TransactionToDocument
                        - type: CreateUpdateInfo@1
                          description: Document is paid (foreign-currency card purchase)
                          targetPath: $._fxUpdates
                          targetValueKind: Array
                          targetValueWriteMode: Append
                          updateKind: Update
                          ckTypeId: Meshmakers.Accounting/AccountingDocument
                          rtIdPath: $._fxCands.Items[0].RtId
                          attributeUpdates:
                            - attributeName: DocumentState
                              attributeValueType: Enum
                              value: PAID
                            - attributeName: PaidAmount
                              attributeValueType: Double
                              valuePath: $._fxCands.Items[0].Attributes.GrossTotal
                        - type: CreateUpdateInfo@1
                          description: Transaction is matched
                          targetPath: $._fxUpdates
                          targetValueKind: Array
                          targetValueWriteMode: Append
                          updateKind: Update
                          ckTypeId: Basic.Accounting/BankTransaction
                          rtIdPath: $.key.RtId
                          attributeUpdates:
                            - attributeName: MatchState
                              attributeValueType: Enum
                              value: Matched
                            - attributeName: MatchComment
                              attributeValueType: String
                              value: Auto-matched by foreign-currency amount (auto)
                        - type: ApplyChanges@2
                          entityUpdatesPath: $._fxUpdates
                          associationUpdatesPath: $._fxAssocs
            - type: GetRtEntitiesByType@1
              description: 'AB#4590 FX card pass: pending EUR debits that mention a foreign currency code in the purpose (direct card charges)'
              ckTypeId: Basic.Accounting/BankTransaction
              targetPath: $.fxcPending
              take: 500
              fieldFilters:
              - attributePath: MatchState
                operator: In
                comparisonValue:
                - 0
                - 2
              - attributePath: Direction
                operator: Equals
                comparisonValue: 1
              - attributePath: Currency
                operator: Equals
                comparisonValue: EUR
              - attributePath: Purpose
                operator: MatchRegEx
                comparisonValue: (USD|GBP|CHF|CAD|AUD|SEK|NOK|DKK|PLN|CZK|HKD|JPY|SGD)
            - type: ForEach@1
              description: For each foreign-currency card debit, find the unique invoice by original amount + currency
              iterationPath: $.fxcPending.Items
              targetPath: $.fxcResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
              - type: Logger@1
                message: FXCARD-DIAG-A pending EUR card debit
              - type: SetPrimitiveValue@1
                description: Initialise extraction slots so the paths always exist
                targetPath: $.key._fxCur
                value: ''
                valueType: String
              - type: SetPrimitiveValue@1
                targetPath: $.key._fxAmt
                value: 0
                valueType: Double
              - type: TransformString@1
                description: Extract the original foreign amount from the purpose (e.g. "36,00 USD" -> 36.00)
                sourcePath: $.key.Attributes.Purpose
                targetPath: $.key._fxAmt
                operation: RegexExtract
                pattern: ([0-9][0-9.]*,[0-9]{2})\s+(USD|GBP|CHF|CAD|AUD|SEK|NOK|DKK|PLN|CZK|HKD|JPY|SGD)
                groupIndex: 1
                asDecimal: true
                groupSeparator: .
                decimalSeparator: ','
              - type: TransformString@1
                description: Extract the currency code from the purpose (group 2)
                sourcePath: $.key.Attributes.Purpose
                targetPath: $.key._fxCur
                operation: RegexExtract
                pattern: ([0-9][0-9.]*,[0-9]{2})\s+(USD|GBP|CHF|CAD|AUD|SEK|NOK|DKK|PLN|CZK|HKD|JPY|SGD)
                groupIndex: 2
                asDecimal: false
              - type: If@1
                description: A valid foreign currency code was extracted
                path: $.key._fxCur
                operator: RegexMatch
                value: ^(USD|GBP|CHF|CAD|AUD|SEK|NOK|DKK|PLN|CZK|HKD|JPY|SGD)$
                valueType: String
                transformations:
                - type: Logger@1
                  message: FXCARD-DIAG-B foreign amount+currency extracted
                - type: GetAssociationTargets@1
                  description: Documents already linked to this transaction (idempotency + uniqueness guard)
                  originRtIdPath: $.key.RtId
                  originCkTypeId: Basic.Accounting/BankTransaction
                  targetCkTypeId: Meshmakers.Accounting/AccountingDocument
                  associationRoleId: Meshmakers.Accounting/TransactionToDocument
                  graphDirection: Inbound
                  targetPath: $.key._fxTxDocs
                - type: If@1
                  description: Transaction not yet linked to any document
                  path: $.key._fxTxDocs[0].TotalCount
                  operator: Equals
                  value: 0
                  valueType: Int64
                  transformations:
                  - type: DateTime@1
                    description: Window floor = booking date - 45 days (card charge may precede the invoice)
                    operation: AddDays
                    path: $.key.Attributes.BookingDate
                    value: -45
                    targetPath: $.key._fxMinDate
                  - type: DateTime@1
                    description: Window cap = booking date + 10 days
                    operation: AddDays
                    path: $.key.Attributes.BookingDate
                    value: 10
                    targetPath: $.key._fxMaxDate
                  - type: GetRtEntitiesByType@1
                    description: Candidate invoices with the same currency and gross total (date window checked in-pipeline)
                    ckTypeId: Meshmakers.Accounting/AccountingDocument
                    targetPath: $._fxDocs
                    take: 20
                    fieldFilters:
                    - attributePath: Currency
                      operator: Equals
                      comparisonValuePath: $.key._fxCur
                    - attributePath: GrossTotal
                      operator: Equals
                      comparisonValuePath: $.key._fxAmt
                    - attributePath: DocumentState
                      operator: In
                      comparisonValue:
                      - 0
                      - 2
                  - type: ForEach@1
                    description: For each candidate invoice, link it when in the date window and still unmatched
                    iterationPath: $._fxDocs.Items
                    targetPath: $._fxScan
                    targetValueKind: Simple
                    targetValueWriteMode: Overwrite
                    maxDegreeOfParallelism: 1
                    transformations:
                    - type: If@1
                      description: Document date on/after window floor
                      path: $.key.Attributes.DocumentDate
                      operator: GreaterEqualsThan
                      valuePath: $.full.key._fxMinDate
                      valueType: DateTime
                      transformations:
                      - type: If@1
                        description: Document date on/before window cap
                        path: $.key.Attributes.DocumentDate
                        operator: LessEqualsThan
                        valuePath: $.full.key._fxMaxDate
                        valueType: DateTime
                        transformations:
                        - type: GetAssociationTargets@1
                          description: Transactions already linked to this document (skip if already paid)
                          originRtIdPath: $.key.RtId
                          originCkTypeId: Meshmakers.Accounting/AccountingDocument
                          targetCkTypeId: Basic.Accounting/BankTransaction
                          associationRoleId: Meshmakers.Accounting/TransactionToDocument
                          graphDirection: Outbound
                          targetPath: $._fxDocTxs
                        - type: If@1
                          description: Document not yet linked to any transaction
                          path: $._fxDocTxs[0].TotalCount
                          operator: Equals
                          value: 0
                          valueType: Int64
                          transformations:
                          - type: GetAssociationTargets@1
                            description: Re-check the transaction is still unlinked (first-candidate-wins)
                            originRtIdPath: $.full.key.RtId
                            originCkTypeId: Basic.Accounting/BankTransaction
                            targetCkTypeId: Meshmakers.Accounting/AccountingDocument
                            associationRoleId: Meshmakers.Accounting/TransactionToDocument
                            graphDirection: Inbound
                            targetPath: $._fxTxRecheck
                          - type: If@1
                            description: Transaction still unlinked — book the match
                            path: $._fxTxRecheck[0].TotalCount
                            operator: Equals
                            value: 0
                            valueType: Int64
                            transformations:
                            - type: Logger@1
                              message: FXCARD-DIAG-D linking invoice to foreign-currency card debit
                            - type: CreateAssociationUpdate@1
                              description: Link the invoice to the card debit
                              targetPath: $._fxAssocs
                              targetValueKind: Array
                              targetValueWriteMode: Overwrite
                              updateKind: Create
                              originRtIdPath: $.key.RtId
                              originCkTypeId: Meshmakers.Accounting/AccountingDocument
                              targetRtIdPath: $.full.key.RtId
                              targetCkTypeId: Basic.Accounting/BankTransaction
                              associationRoleId: Meshmakers.Accounting/TransactionToDocument
                            - type: CreateUpdateInfo@1
                              description: Card debit becomes the matched booking leg
                              targetPath: $._fxUpdates
                              targetValueKind: Array
                              targetValueWriteMode: Overwrite
                              updateKind: Update
                              ckTypeId: Basic.Accounting/BankTransaction
                              rtIdPath: $.full.key.RtId
                              attributeUpdates:
                              - attributeName: MatchState
                                attributeValueType: Enum
                                value: Matched
                              - attributeName: MatchComment
                                attributeValueType: String
                                value: Foreign-currency card charge, matched by original amount and currency in purpose (auto)
                            - type: CreateUpdateInfo@1
                              description: Invoice is paid (in its own foreign currency), currency stamped
                              targetPath: $._fxUpdates
                              targetValueKind: Array
                              targetValueWriteMode: Append
                              updateKind: Update
                              ckTypeId: Meshmakers.Accounting/AccountingDocument
                              rtIdPath: $.key.RtId
                              attributeUpdates:
                              - attributeName: DocumentState
                                attributeValueType: Enum
                                value: PAID
                              - attributeName: PaidAmount
                                attributeValueType: Double
                                valuePath: $.full.key._fxAmt
                              - attributeName: Currency
                                attributeValueType: String
                                valuePath: $.full.key._fxCur
                            - type: ApplyChanges@2
                              description: Persist the foreign-currency card match
                              entityUpdatesPath: $._fxUpdates
                              associationUpdatesPath: $._fxAssocs

            # --- Cross-currency PayPal funding pass (AB#4596) — a purchase paid
            #     through PayPal in a foreign currency (e.g. GitHub, 306.69 USD)
            #     lands twice, across two own accounts: as the original-currency
            #     debit on the PayPal-ledger account (USD — carries the vendor and
            #     the invoice) and, two-ish days later, as the EUR SEPA direct debit
            #     "…/PAYPAL" that PayPal collects from the giro account (counterpart
            #     "PayPal Europe…", 281 EUR). The EUR giro leg is the amount that
            #     actually left the bank, so it — not the USD ledger leg — is the
            #     accounting-relevant expense. But the AB#4509 settlement pass pairs
            #     legs only on an EQUAL signed amount (306.69 USD != 281 EUR) and
            #     the giro leg carries no vendor to match a document, so both legs
            #     stay unresolved. This pass bridges them by FX band: for a pending
            #     EUR giro debit whose counterpart is PayPal, it finds the UNIQUE
            #     foreign-currency debit on another own account, booked just before,
            #     whose magnitude is within [1.00, 1.25]x the EUR magnitude (implied
            #     EUR/foreign rate 0.80–1.00). It then makes the EUR giro leg the
            #     booking leg — moves the invoice onto it — and ignores the foreign
            #     ledger leg as a clearing duplicate, so the expense is counted once,
            #     in EUR, on the leg that can then be categorised. Uniqueness
            #     (exactly one in-band twin) plus the PayPal counterpart gate make a
            #     false pair impossible; verified 21/21 clean on prod-1, 0 ambiguous.
            #     The band is expressed as magnitude bounds on the (negative) foreign
            #     amount to avoid a dynamic division. Runs AFTER the deterministic
            #     passes so the foreign leg already carries its invoice, and only
            #     acts when it does (nothing to book otherwise). PaidAmount lives on
            #     the document, not the transaction, so the EUR value needs no write —
            #     it is the giro leg's own Amount. Idempotent: matching the giro leg
            #     and moving the invoice off the twin removes the pair from the
            #     candidate sets. Standard nodes only (no RegexExtract) — deployable
            #     without an adapter release, like the AB#4590 bank-fee vocab.
            - type: GetRtEntitiesByType@1
              description: Pending EUR debits collected by PayPal (potential foreign-purchase funding legs)
              ckTypeId: Basic.Accounting/BankTransaction
              targetPath: $.ppfxPending
              take: 500
              fieldFilters:
                - attributePath: MatchState
                  operator: In
                  comparisonValue:
                    - 0
                    - 2
                - attributePath: Direction
                  operator: Equals
                  comparisonValue: 1
                - attributePath: Currency
                  operator: Equals
                  comparisonValue: EUR
                - attributePath: CounterpartName
                  operator: MatchRegEx
                  comparisonValue: "(?i)paypal"
            - type: ForEach@1
              description: Bridge each PayPal EUR funding leg to its unique foreign-currency twin
              iterationPath: $.ppfxPending.Items
              targetPath: $.ppfxResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                # FX band as magnitude bounds on the (negative) foreign amount:
                # |foreign| in [|eur|, 1.25*|eur|] == rate in [0.80, 1.00]. In signed
                # debit space the foreign amount sits in [1.25*eurAmount, eurAmount]
                # (eurAmount is the less-negative, upper bound).
                - type: SetPrimitiveValue@1
                  description: Copy the EUR amount to a single-segment key under $.key (Math bases must be relative-to-path — AB#4433/AB#4590 convention)
                  valuePath: $.key.Attributes.Amount
                  targetPath: $.key._ppfxAmt
                  valueType: Double
                - type: Math@1
                  description: Lower (more negative) foreign bound = 1.25 * EUR amount
                  path: $.key
                  itemPath: $._ppfxAmt
                  itemTargetPath: $._ppfxLo
                  operation: Multiply
                  value: 1.25
                - type: DateTime@1
                  description: Twin window floor = booking date - 8 days
                  operation: AddDays
                  path: $.key.Attributes.BookingDate
                  value: -8
                  targetPath: $.key._ppfxMinDate
                - type: DateTime@1
                  description: Twin window cap = booking date + 1 day
                  operation: AddDays
                  path: $.key.Attributes.BookingDate
                  value: 1
                  targetPath: $.key._ppfxMaxDate
                - type: GetRtEntitiesByType@1
                  description: Foreign-currency debits in the FX amount band (date window checked in-pipeline — field-filter dates do not coerce, AB#4389/AB#4509)
                  ckTypeId: Basic.Accounting/BankTransaction
                  targetPath: $._ppfxTwins
                  take: 50
                  fieldFilters:
                    - attributePath: Direction
                      operator: Equals
                      comparisonValue: 1
                    - attributePath: Currency
                      operator: NotEquals
                      comparisonValue: EUR
                    - attributePath: Amount
                      operator: GreaterEqualThan
                      comparisonValuePath: $.key._ppfxLo
                    - attributePath: Amount
                      operator: LessEqualThan
                      comparisonValuePath: $.key.Attributes.Amount
                # Date window + uniqueness are decided in-pipeline: field-filter
                # DateTime comparisons do not coerce (AB#4389), so the AB#4509
                # settlement pass established this If-based pattern. Count the twins
                # booked inside [bookingDate-8, bookingDate+1] and capture the last
                # one's RtId; act only when exactly one survives.
                - type: ForEach@1
                  description: For each in-window foreign twin, book the EUR leg and ignore the clearing leg
                  iterationPath: $._ppfxTwins.Items
                  targetPath: $._ppfxScan
                  targetValueKind: Simple
                  targetValueWriteMode: Overwrite
                  maxDegreeOfParallelism: 1
                  transformations:
                    - type: If@1
                      description: Twin booked no earlier than 8 days before the collection
                      path: $.key.Attributes.BookingDate
                      operator: GreaterEqualsThan
                      valuePath: $.full.key._ppfxMinDate
                      valueType: DateTime
                      transformations:
                        - type: If@1
                          description: …and no later than 1 day after it
                          path: $.key.Attributes.BookingDate
                          operator: LessEqualsThan
                          valuePath: $.full.key._ppfxMaxDate
                          valueType: DateTime
                          transformations:
                            # Act INSIDE the loop: ApplyChanges persists to the DB,
                            # whereas nested-ForEach context state does not survive the
                            # loop (AB#4509 pattern). First-in-window-twin-wins: only
                            # act while the giro leg carries no document yet — prevents
                            # a double move if two twins ever fall in-window, and pairs
                            # with the ppfxPending In[0,2] gate for cross-run idempotency
                            # (a matched giro leg leaves the candidate set).
                            - type: GetAssociationTargets@1
                              description: Documents already on the EUR giro leg
                              originRtIdPath: $.full.key.RtId
                              originCkTypeId: Basic.Accounting/BankTransaction
                              targetCkTypeId: Meshmakers.Accounting/AccountingDocument
                              associationRoleId: Meshmakers.Accounting/TransactionToDocument
                              graphDirection: Inbound
                              targetPath: $._ppfxGiroDocs
                            - type: If@1
                              description: Giro leg not yet booked to a document
                              path: $._ppfxGiroDocs[0].TotalCount
                              operator: Equals
                              value: 0
                              valueType: Int64
                              transformations:
                                # Both account lookups are TotalCount-guarded before the
                                # RtId compare (an If with a valuePath THROWS on a missing
                                # path — the AB#4433 Part C incident).
                                - type: GetAssociationTargets@1
                                  description: Account of the EUR giro leg
                                  originRtIdPath: $.full.key.RtId
                                  originCkTypeId: Basic.Accounting/BankTransaction
                                  targetCkTypeId: Basic.Accounting/BankAccount
                                  associationRoleId: System/ParentChild
                                  graphDirection: Outbound
                                  targetPath: $._ppfxGiroAcc
                                - type: GetAssociationTargets@1
                                  description: Account of the foreign twin
                                  originRtIdPath: $.key.RtId
                                  originCkTypeId: Basic.Accounting/BankTransaction
                                  targetCkTypeId: Basic.Accounting/BankAccount
                                  associationRoleId: System/ParentChild
                                  graphDirection: Outbound
                                  targetPath: $._ppfxTwinAcc
                                - type: If@1
                                  description: Giro leg has a resolved account
                                  path: $._ppfxGiroAcc[0].TotalCount
                                  operator: GreaterThan
                                  value: 0
                                  valueType: Int64
                                  transformations:
                                    - type: If@1
                                      description: Twin has a resolved account
                                      path: $._ppfxTwinAcc[0].TotalCount
                                      operator: GreaterThan
                                      value: 0
                                      valueType: Int64
                                      transformations:
                                        - type: If@1
                                          description: Twin lives on a DIFFERENT own account (never the EUR giro account)
                                          path: $._ppfxTwinAcc[0].Items[0].RtId
                                          operator: NotEquals
                                          valuePath: $._ppfxGiroAcc[0].Items[0].RtId
                                          valueType: String
                                          transformations:
                                            - type: GetAssociationTargets@1
                                              description: Documents currently linked to the foreign twin
                                              originRtIdPath: $.key.RtId
                                              originCkTypeId: Basic.Accounting/BankTransaction
                                              targetCkTypeId: Meshmakers.Accounting/AccountingDocument
                                              associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                              graphDirection: Inbound
                                              targetPath: $._ppfxTwinDocs
                                            # Only act when the foreign leg carries exactly
                                            # one invoice to move — leave 0 or >1 for manual.
                                            - type: If@1
                                              description: The foreign twin carries exactly one invoice
                                              path: $._ppfxTwinDocs[0].TotalCount
                                              operator: Equals
                                              value: 1
                                              valueType: Int64
                                              transformations:
                                                - type: CreateAssociationUpdate@1
                                                  description: Link the invoice to the EUR giro leg (the booking leg)
                                                  targetPath: $._ppfxAssocs
                                                  targetValueKind: Array
                                                  targetValueWriteMode: Overwrite
                                                  updateKind: Create
                                                  originRtIdPath: $._ppfxTwinDocs[0].Items[0].RtId
                                                  originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                                  targetRtIdPath: $.full.key.RtId
                                                  targetCkTypeId: Basic.Accounting/BankTransaction
                                                  associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                                - type: CreateAssociationUpdate@1
                                                  description: Unlink the invoice from the foreign clearing leg
                                                  targetPath: $._ppfxAssocs
                                                  targetValueKind: Array
                                                  targetValueWriteMode: Append
                                                  updateKind: Delete
                                                  originRtIdPath: $._ppfxTwinDocs[0].Items[0].RtId
                                                  originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                                  targetRtIdPath: $.key.RtId
                                                  targetCkTypeId: Basic.Accounting/BankTransaction
                                                  associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                                - type: CreateUpdateInfo@1
                                                  description: EUR giro leg becomes the matched booking leg (its Amount is the real EUR value)
                                                  targetPath: $._ppfxUpdates
                                                  targetValueKind: Array
                                                  targetValueWriteMode: Overwrite
                                                  updateKind: Update
                                                  ckTypeId: Basic.Accounting/BankTransaction
                                                  rtIdPath: $.full.key.RtId
                                                  attributeUpdates:
                                                    - attributeName: MatchState
                                                      attributeValueType: Enum
                                                      value: Matched
                                                    - attributeName: MatchComment
                                                      attributeValueType: String
                                                      value: PayPal foreign-currency purchase, booked in EUR (auto)
                                                - type: CreateUpdateInfo@1
                                                  description: Foreign PayPal-ledger leg is a clearing duplicate
                                                  targetPath: $._ppfxUpdates
                                                  targetValueKind: Array
                                                  targetValueWriteMode: Append
                                                  updateKind: Update
                                                  ckTypeId: Basic.Accounting/BankTransaction
                                                  rtIdPath: $.key.RtId
                                                  attributeUpdates:
                                                    - attributeName: MatchState
                                                      attributeValueType: Enum
                                                      value: Ignored
                                                    - attributeName: MatchComment
                                                      attributeValueType: String
                                                      value: PayPal foreign-currency clearing leg, booked on the EUR giro leg (auto)
                                                # Stamp the invoice with the foreign leg's currency so foreign
                                                # invoices are not summed as EUR (AB#4612). Requires the adapter
                                                # to carry model >=1.10.0 (Currency attribute); a stale CK cache
                                                # silently drops the write (AB#4456) — restart the adapter after
                                                # the model bump.
                                                - type: CreateUpdateInfo@1
                                                  description: Stamp the invoice currency from the foreign clearing leg
                                                  targetPath: $._ppfxUpdates
                                                  targetValueKind: Array
                                                  targetValueWriteMode: Append
                                                  updateKind: Update
                                                  ckTypeId: Meshmakers.Accounting/AccountingDocument
                                                  rtIdPath: $._ppfxTwinDocs[0].Items[0].RtId
                                                  attributeUpdates:
                                                    - attributeName: Currency
                                                      attributeValueType: String
                                                      valuePath: $.key.Attributes.Currency
                                                - type: ApplyChanges@2
                                                  description: Persist the cross-currency bridge
                                                  entityUpdatesPath: $._ppfxUpdates
                                                  associationUpdatesPath: $._ppfxAssocs
            # --- Document-number pass (AB#4542) — the transfer purpose often
            #     carries the exact document number, the strongest deterministic
            #     signal there is. It covers what the amount passes cannot see:
            #     payments made weeks after the document date and net-of-VAT
            #     transfers (invoice gross 7.68, transferred 6.40 = net, purpose
            #     "150418325"). Doc-driven: for every OPEN document with a
            #     sufficiently distinctive number, accept the SINGLE pending
            #     transaction of the right direction whose purpose contains that
            #     number — but only when the paid amount equals the document's
            #     gross OR net total. The amount guard keeps interest bookings
            #     and collective transfers that merely REFERENCE the number from
            #     settling the document. Deliberately no date window: purpose +
            #     amount + direction anchors harder than booking proximity.
            - type: GetRtEntitiesByType@1
              description: Open documents for the document-number pass
              ckTypeId: Meshmakers.Accounting/AccountingDocument
              targetPath: $.dnDocs
              take: 500
              fieldFilters:
                - attributePath: DocumentState
                  operator: Equals
                  comparisonValue: 0
            - type: ForEach@1
              description: Document-number pass — unique pending transaction whose purpose contains the document number
              iterationPath: $.dnDocs.Items
              targetPath: $.dnResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                # Number guards: at least 5 characters, only literal characters
                # that are safe inside the Like filter (Like builds an UNESCAPED
                # regex server-side), and at least one run of 4 digits so short
                # generic tokens ("2025", "A-1") can never anchor a match.
                # RegexMatch is null-safe — numberless documents fall through.
                - type: If@1
                  description: Document number has at least 5 characters
                  path: $.key.Attributes.DocumentNumber
                  operator: RegexMatch
                  value: .{5,}
                  valueType: String
                  transformations:
                    - type: If@1
                      description: …contains only literal characters safe for the Like filter
                      path: $.key.Attributes.DocumentNumber
                      operator: RegexMatch
                      value: ^[A-Za-z0-9 ./_-]+$
                      valueType: String
                      transformations:
                        - type: If@1
                          description: …and carries a run of at least 4 digits
                          path: $.key.Attributes.DocumentNumber
                          operator: RegexMatch
                          value: '[0-9]{4}'
                          valueType: String
                          transformations:
                            - type: SetPrimitiveValue@1
                              description: An INCOMING document is paid by a Debit (default)
                              targetPath: $.key._dnWantedDir
                              value: 1
                              valueType: Int
                            - type: If@1
                              description: OUTGOING document — expect an incoming Credit
                              path: $.key.Attributes.DocumentType
                              operator: Equals
                              value: 1
                              valueType: Int64
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.key._dnWantedDir
                                  value: 0
                                  valueType: Int
                            - type: GetRtEntitiesByType@1
                              description: Pending transactions of the right direction whose purpose contains the document number
                              ckTypeId: Basic.Accounting/BankTransaction
                              targetPath: $.key._dnTxs
                              take: 5
                              fieldFilters:
                                - attributePath: MatchState
                                  operator: In
                                  comparisonValue:
                                    - 0
                                    - 2
                                - attributePath: Direction
                                  operator: Equals
                                  comparisonValuePath: $.key._dnWantedDir
                                - attributePath: Purpose
                                  operator: Like
                                  comparisonValuePath: $.key.Attributes.DocumentNumber
                            - type: If@1
                              description: At least one pending transaction references the document number
                              path: $.key._dnTxs.TotalCount
                              operator: GreaterEqualsThan
                              value: 1
                              valueType: Int64
                              transformations:
                                # The paid total is the SUM over all purpose hits:
                                # split payments (net first, VAT transferred
                                # separately weeks later — troii case) settle as a
                                # whole when the parts add up to the gross total.
                                - type: SumAggregation@1
                                  description: Signed sum over all purpose hits
                                  targetPath: $.key._dnSumSigned
                                  aggregations:
                                    - path: $.key._dnTxs.Items[*]
                                      aggregationPath: $.Attributes.Amount
                                      value: 1
                                      filterPath: null
                                      comparisonValue: null
                                - type: Math@1
                                  description: Paid total (Credit default = signed sum)
                                  path: $.key
                                  itemPath: $._dnSumSigned
                                  itemTargetPath: $._dnPaidAbs
                                  operation: Multiply
                                  value: 1
                                - type: If@1
                                  description: Debit — invert the sign to get the positive paid total
                                  path: $.key._dnWantedDir
                                  operator: Equals
                                  value: 1
                                  valueType: Int
                                  transformations:
                                    - type: Math@1
                                      path: $.key
                                      itemPath: $._dnSumSigned
                                      itemTargetPath: $._dnPaidAbs
                                      operation: Multiply
                                      value: -1
                                - type: SetPrimitiveValue@1
                                  description: Amount not plausible yet (default)
                                  targetPath: $.key._dnAmountOk
                                  value: 0
                                  valueType: Int
                                # Float-safe amount check — a sum of doubles (6.40
                                # + 1.28) need not be bit-equal to 7.68, so the
                                # paid total must lie within ±0.005 of the target.
                                # GreaterThan on a Double path is null-safe (a
                                # null/missing GrossTotal simply fails the
                                # comparison — RegexMatch would THROW on numeric
                                # attributes) and keeps the GrossTotal-0
                                # extraction defect from ever matching.
                                - type: If@1
                                  description: Document carries a positive gross total
                                  path: $.key.Attributes.GrossTotal
                                  operator: GreaterThan
                                  value: 0
                                  valueType: Double
                                  transformations:
                                    - type: Math@1
                                      description: Gross band floor
                                      path: $.key
                                      itemPath: $.Attributes.GrossTotal
                                      itemTargetPath: $._dnGrossLo
                                      operation: Subtract
                                      value: 0.005
                                    - type: Math@1
                                      description: Gross band cap
                                      path: $.key
                                      itemPath: $.Attributes.GrossTotal
                                      itemTargetPath: $._dnGrossHi
                                      operation: Add
                                      value: 0.005
                                    - type: If@1
                                      description: Paid total no less than the gross band floor
                                      path: $.key._dnPaidAbs
                                      operator: GreaterEqualsThan
                                      valuePath: $.key._dnGrossLo
                                      valueType: Double
                                      transformations:
                                        - type: If@1
                                          description: …and no more than the gross band cap — amount plausible
                                          path: $.key._dnPaidAbs
                                          operator: LessEqualsThan
                                          valuePath: $.key._dnGrossHi
                                          valueType: Double
                                          transformations:
                                            - type: SetPrimitiveValue@1
                                              targetPath: $.key._dnAmountOk
                                              value: 1
                                              valueType: Int
                                # A SINGLE transaction paying exactly the net total
                                # is also plausible (transfer without VAT, e.g.
                                # reverse charge) — never accepted for multiple
                                # hits, where only the gross sum counts.
                                - type: If@1
                                  description: Exactly one hit — also accept the net total
                                  path: $.key._dnTxs.TotalCount
                                  operator: Equals
                                  value: 1
                                  valueType: Int64
                                  transformations:
                                    - type: If@1
                                      description: Document carries a positive net total (null-safe numeric guard)
                                      path: $.key.Attributes.NetTotal
                                      operator: GreaterThan
                                      value: 0
                                      valueType: Double
                                      transformations:
                                        - type: Math@1
                                          description: Net band floor
                                          path: $.key
                                          itemPath: $.Attributes.NetTotal
                                          itemTargetPath: $._dnNetLo
                                          operation: Subtract
                                          value: 0.005
                                        - type: Math@1
                                          description: Net band cap
                                          path: $.key
                                          itemPath: $.Attributes.NetTotal
                                          itemTargetPath: $._dnNetHi
                                          operation: Add
                                          value: 0.005
                                        - type: If@1
                                          description: Paid amount no less than the net band floor
                                          path: $.key._dnPaidAbs
                                          operator: GreaterEqualsThan
                                          valuePath: $.key._dnNetLo
                                          valueType: Double
                                          transformations:
                                            - type: If@1
                                              description: …and no more than the net band cap — amount plausible
                                              path: $.key._dnPaidAbs
                                              operator: LessEqualsThan
                                              valuePath: $.key._dnNetHi
                                              valueType: Double
                                              transformations:
                                                - type: SetPrimitiveValue@1
                                                  targetPath: $.key._dnAmountOk
                                                  value: 1
                                                  valueType: Int
                                - type: If@1
                                  description: Amount plausible — settle the document and all referenced transactions
                                  path: $.key._dnAmountOk
                                  operator: Equals
                                  value: 1
                                  valueType: Int64
                                  transformations:
                                    - type: GetAssociationTargets@1
                                      description: Existing tx links on this document (idempotency guard, AB#4398)
                                      originRtIdPath: $.key.RtId
                                      originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                      targetCkTypeId: Basic.Accounting/BankTransaction
                                      associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                      graphDirection: Outbound
                                      targetPath: $.key._dnExisting
                                    - type: ForEach@1
                                      description: Mark every referenced transaction matched, link it when the document is not already linked
                                      iterationPath: $.key._dnTxs.Items
                                      targetPath: $.key._dnLinkResults
                                      targetValueKind: Simple
                                      targetValueWriteMode: Overwrite
                                      maxDegreeOfParallelism: 1
                                      transformations:
                                        - type: CreateUpdateInfo@1
                                          description: Transaction is matched (document number found in the transfer purpose)
                                          targetPath: $.key._upd
                                          updateKind: Update
                                          ckTypeId: Basic.Accounting/BankTransaction
                                          rtIdPath: $.key.RtId
                                          attributeUpdates:
                                            - attributeName: MatchState
                                              attributeValueType: Enum
                                              value: Matched
                                            - attributeName: MatchComment
                                              attributeValueType: String
                                              value: Auto-matched by document number in transfer purpose
                                        - type: If@1
                                          description: Create the link only when the document is not already linked (a stale link still settles via the existing one)
                                          path: $.full.key._dnExisting[0].TotalCount
                                          operator: Equals
                                          value: 0
                                          valueType: Int64
                                          transformations:
                                            - type: CreateAssociationUpdate@1
                                              description: Link document to transaction
                                              targetPath: $.key._assoc
                                              updateKind: Create
                                              originRtIdPath: $.full.key.RtId
                                              originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                              targetRtIdPath: $.key.RtId
                                              targetCkTypeId: Basic.Accounting/BankTransaction
                                              associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                    - type: Flatten@1
                                      description: Collect the transaction updates
                                      path: $.key._dnLinkResults[*]._upd
                                      targetPath: $.key._dnUpdates
                                      targetValueKind: Simple
                                      targetValueWriteMode: Overwrite
                                    - type: If@1
                                      description: Collect the new links (only produced when the document had none)
                                      path: $.key._dnExisting[0].TotalCount
                                      operator: Equals
                                      value: 0
                                      valueType: Int64
                                      transformations:
                                        - type: Flatten@1
                                          path: $.key._dnLinkResults[*]._assoc
                                          targetPath: $.key._dnAssocs
                                          targetValueKind: Simple
                                          targetValueWriteMode: Overwrite
                                    - type: CreateUpdateInfo@1
                                      description: Document is paid — PaidAmount is the total actually transferred (net-of-VAT transfers stay visible)
                                      targetPath: $.key._dnUpdates
                                      targetValueKind: Array
                                      targetValueWriteMode: Append
                                      updateKind: Update
                                      ckTypeId: Meshmakers.Accounting/AccountingDocument
                                      rtIdPath: $.key.RtId
                                      attributeUpdates:
                                        - attributeName: DocumentState
                                          attributeValueType: Enum
                                          value: PAID
                                        - attributeName: PaidAmount
                                          attributeValueType: Double
                                          valuePath: $.key._dnPaidAbs
                                    - type: ApplyChanges@2
                                      entityUpdatesPath: $.key._dnUpdates
                                      associationUpdatesPath: $.key._dnAssocs
            # --- Global group assignment (AB#5092) — every pass above decides ONE
            #     transaction at a time, so whoever is processed first takes the first
            #     acceptable candidate and the next transaction takes what is left. On
            #     prod-1/meshmakers a single missing invoice (December 2025) therefore
            #     produced ELEVEN consecutive wrong links over eight months: three
            #     parallel Anthropic subscriptions all charge exactly 182.44 EUR and
            #     differ only in their billing day (series KVACBXHA on the 1st, D6AD715F
            #     on the 18th, A89A7MLL on the 30th), so every charge found "an" open
            #     182.44 invoice and the whole series slid by one. Every one of those
            #     links reported Matched, so nothing surfaced.
            #     This pass decides a GROUP of mutually ambiguous candidates in one go:
            #     it scores every transaction/document pair of the group once, solves the
            #     assignment over the WHOLE group, and leaves a transaction UNMATCHED
            #     when its best remaining candidate is not acceptable — it never hands it
            #     the leftover. The leftover take is exactly how the displacement chain
            #     started.
            #     Placement: AFTER every anchored pass (exact amount + rival guard, the
            #     collective-payment subset AB#5093, tolerance/fallback, both currency
            #     passes and the document-number pass) — an unambiguous deterministic
            #     match always wins before any group logic runs — and BEFORE the
            #     recurring-merchant series pass, which is the greedy oldest-first pass
            #     this one exists to keep away from ambiguous groups.
            #     A group is anchored on ONE open document and consists of the open
            #     documents that share its party name, its DocumentType and its
            #     GrossTotal to the cent and are dated within ±16 days of it, plus the
            #     pending transactions of exactly the matching signed amount booked in
            #     [anchor − 23 d, anchor + 30 d] — the document window widened by the
            #     [−7, +14] charge window the series pass uses. Identity is enforced on
            #     the document side by the party name (a card charge carries no
            #     CounterpartName at all) and on the transaction side by the AB#5087 POS
            #     vendor check inside the scorer.
            #     Bounds, deliberately hard: at most 8 documents AND at most 8
            #     transactions (also the queries' take), and at least three members in
            #     total — a 1:1 pair is not ambiguous and belongs to the deterministic
            #     pass. A group beyond the bound is SKIPPED, which leaves today's
            #     behaviour untouched.
            #     Each group is settled under its own anchor with its own ApplyChanges
            #     and every query reads live state, so the next anchor of the same group
            #     sees what was just settled and drops below the bound — the group is
            #     decided once per run, not once per member.
            - type: GetRtEntitiesByType@1
              description: Open documents for the group-assignment pass, oldest first
              ckTypeId: Meshmakers.Accounting/AccountingDocument
              targetPath: $.gaDocs
              take: 500
              sortOrders:
                - attributeName: DocumentDate
                  sortOrder: Ascending
              fieldFilters:
                - attributePath: DocumentState
                  operator: Equals
                  comparisonValue: 0
            - type: ForEach@1
              description: Group assignment — one group of mutually ambiguous candidates decided globally
              iterationPath: $.gaDocs.Items
              targetPath: $.gaResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                - type: If@1
                  description: Anchor carries a positive gross total (a Dauerbeleg carries 0 and belongs to the recurring pass)
                  path: $.key.Attributes.GrossTotal
                  operator: GreaterThan
                  value: 0
                  valueType: Double
                  transformations:
                    - type: If@1
                      description: Anchor carries a document date
                      path: $.key.Attributes.DocumentDate
                      operator: RegexMatch
                      value: .+
                      valueType: String
                      transformations:
                        - type: DateTime@1
                          description: Group document window floor = anchor document date - 16 days
                          operation: AddDays
                          path: $.key.Attributes.DocumentDate
                          value: -16
                          targetPath: $.key._gaDocMin
                        - type: DateTime@1
                          description: Group document window cap = anchor document date + 16 days
                          operation: AddDays
                          path: $.key.Attributes.DocumentDate
                          value: 16
                          targetPath: $.key._gaDocMax
                        - type: DateTime@1
                          description: Group charge window floor = document window floor - 7 days (a card charge may precede its invoice)
                          operation: AddDays
                          path: $.key.Attributes.DocumentDate
                          value: -23
                          targetPath: $.key._gaTxMin
                        - type: DateTime@1
                          description: Group charge window cap = document window cap + 14 days
                          operation: AddDays
                          path: $.key.Attributes.DocumentDate
                          value: 30
                          targetPath: $.key._gaTxMax
                        - type: Math@1
                          description: Expected signed amount (INCOMING default = negative gross)
                          path: $.key
                          itemPath: $.Attributes.GrossTotal
                          itemTargetPath: $._gaAmount
                          operation: Multiply
                          value: -1
                        - type: If@1
                          description: OUTGOING document — expect an incoming Credit (positive amount)
                          path: $.key.Attributes.DocumentType
                          operator: Equals
                          value: 1
                          valueType: Int64
                          transformations:
                            - type: Math@1
                              path: $.key
                              itemPath: $.Attributes.GrossTotal
                              itemTargetPath: $._gaAmount
                              operation: Multiply
                              value: 1
                        # Default-then-overwrite: an empty group so the TotalCount gates
                        # below never read a missing path when the anchor has no usable
                        # party name at all.
                        - type: WriteJson@1
                          description: No group documents yet
                          targetPath: $.key._gaDocs
                          jsonString: '{"Items":[],"TotalCount":0}'
                        - type: WriteJson@1
                          description: No group transactions yet
                          targetPath: $.key._gaTxs
                          jsonString: '{"Items":[],"TotalCount":0}'
                        # Nested-record shape: an RtRecord attribute serializes as
                        # { CkRecordId, Attributes: {...} } in the data context, so the
                        # company name lives one level deeper than the fieldFilter path
                        # (Vendor.CompanyName) suggests.
                        - type: If@1
                          description: INCOMING anchor — the group is the vendor's documents of exactly this gross total
                          path: $.key.Attributes.DocumentType
                          operator: Equals
                          value: 0
                          valueType: Int64
                          transformations:
                            - type: If@1
                              description: Anchor names a vendor to group on (null/blank guard)
                              path: $.key.Attributes.Vendor.Attributes.CompanyName
                              operator: RegexMatch
                              value: '\S'
                              valueType: String
                              transformations:
                                - type: GetRtEntitiesByType@1
                                  description: Open incoming documents of the same vendor, same gross total, inside the group document window
                                  ckTypeId: Meshmakers.Accounting/AccountingDocument
                                  targetPath: $.key._gaDocs
                                  take: 8
                                  fieldFilters:
                                    - attributePath: DocumentState
                                      operator: Equals
                                      comparisonValue: 0
                                    - attributePath: DocumentType
                                      operator: Equals
                                      comparisonValue: 0
                                    - attributePath: Vendor.CompanyName
                                      operator: Equals
                                      comparisonValuePath: $.key.Attributes.Vendor.Attributes.CompanyName
                                    - attributePath: GrossTotal
                                      operator: Equals
                                      comparisonValuePath: $.key.Attributes.GrossTotal
                                    - attributePath: DocumentDate
                                      operator: GreaterEqualThan
                                      comparisonValuePath: $.key._gaDocMin
                                    - attributePath: DocumentDate
                                      operator: LessEqualThan
                                      comparisonValuePath: $.key._gaDocMax
                        - type: If@1
                          description: OUTGOING anchor — the group is the customer's documents of exactly this gross total
                          path: $.key.Attributes.DocumentType
                          operator: Equals
                          value: 1
                          valueType: Int64
                          transformations:
                            - type: If@1
                              description: Anchor names a customer to group on (null/blank guard)
                              path: $.key.Attributes.Customer.Attributes.CompanyName
                              operator: RegexMatch
                              value: '\S'
                              valueType: String
                              transformations:
                                - type: GetRtEntitiesByType@1
                                  description: Open outgoing documents of the same customer, same gross total, inside the group document window
                                  ckTypeId: Meshmakers.Accounting/AccountingDocument
                                  targetPath: $.key._gaDocs
                                  take: 8
                                  fieldFilters:
                                    - attributePath: DocumentState
                                      operator: Equals
                                      comparisonValue: 0
                                    - attributePath: DocumentType
                                      operator: Equals
                                      comparisonValue: 1
                                    - attributePath: Customer.CompanyName
                                      operator: Equals
                                      comparisonValuePath: $.key.Attributes.Customer.Attributes.CompanyName
                                    - attributePath: GrossTotal
                                      operator: Equals
                                      comparisonValuePath: $.key.Attributes.GrossTotal
                                    - attributePath: DocumentDate
                                      operator: GreaterEqualThan
                                      comparisonValuePath: $.key._gaDocMin
                                    - attributePath: DocumentDate
                                      operator: LessEqualThan
                                      comparisonValuePath: $.key._gaDocMax
                        # The bound is checked on TotalCount, not on the returned page:
                        # take caps the payload, TotalCount reports the real size, so a
                        # group that is too large is SKIPPED instead of silently decided
                        # on its first 8 members.
                        - type: If@1
                          description: The group has at least one open document
                          path: $.key._gaDocs.TotalCount
                          operator: GreaterEqualsThan
                          value: 1
                          valueType: Int64
                          transformations:
                            - type: If@1
                              description: …and stays inside the 8-document bound
                              path: $.key._gaDocs.TotalCount
                              operator: LessEqualsThan
                              value: 8
                              valueType: Int64
                              transformations:
                                - type: GetRtEntitiesByType@1
                                  description: Pending transactions of exactly the matching signed amount inside the group charge window
                                  ckTypeId: Basic.Accounting/BankTransaction
                                  targetPath: $.key._gaTxs
                                  take: 8
                                  fieldFilters:
                                    - attributePath: MatchState
                                      operator: In
                                      comparisonValue:
                                        - 0
                                        - 2
                                    - attributePath: Amount
                                      operator: Equals
                                      comparisonValuePath: $.key._gaAmount
                                    - attributePath: BookingDate
                                      operator: GreaterEqualThan
                                      comparisonValuePath: $.key._gaTxMin
                                    - attributePath: BookingDate
                                      operator: LessEqualThan
                                      comparisonValuePath: $.key._gaTxMax
                                - type: If@1
                                  description: The group has at least one pending transaction
                                  path: $.key._gaTxs.TotalCount
                                  operator: GreaterEqualsThan
                                  value: 1
                                  valueType: Int64
                                  transformations:
                                    - type: If@1
                                      description: …and stays inside the 8-transaction bound
                                      path: $.key._gaTxs.TotalCount
                                      operator: LessEqualsThan
                                      value: 8
                                      valueType: Int64
                                      transformations:
                                        # --- The ONE bounded scorer + solver ---------------------------------------
                                        #     Scoring, per transaction/document pair, in whole integers so the
                                        #     ordering is exact and the search provably terminates:
                                        #       tier 0   the transaction's CardTransactionDate IS the document date —
                                        #                the strongest signal this file has (AB#5091), cost 0;
                                        #       tier 1   everything else, cost 1 000 000;
                                        #       + 10 000 per whole day of distance between the pair's effective date
                                        #                (the card date when present, else the booking date — the
                                        #                AB#5087 discipline) and the document date;
                                        #       +    100 per cent of amount distance. Zero by construction inside a
                                        #                group (both queries filter on the exact amount), and any
                                        #                pair that still differs by a cent is rejected outright — the
                                        #                term is the pair's own re-check, so the cost function states
                                        #                the whole documented ordering;
                                        #       +      1 when the identity could not be CONFIRMED, i.e. the purpose
                                        #                carries no POS merchant token or the document has no usable
                                        #                party name. A confirmed vendor overlap therefore outranks an
                                        #                unjudged one at equal dates.
                                        #     A pair is not in the graph at all (cost infinite) when it fails the
                                        #     AB#5087 POS vendor check, when the cents differ, when its effective
                                        #     date lies outside [document date − 7 d, +14 d] (the series pass's
                                        #     window, which is what this pass has to be able to decide), or when the
                                        #     transaction HAS a card date that is more than 3 days off while no
                                        #     candidate carries the document date (AB#5091 rule 3, verbatim: a card
                                        #     charge never takes a neighbouring purchase's leftover). Documents that
                                        #     already carry a PaidAmount (settled by SEVERAL transactions, AB#5093)
                                        #     and recurring masters are not group members at all.
                                        #     Solving: leaving a transaction unmatched costs 1 150 000, which is more
                                        #     than any ACCEPTABLE pair and less than any rejected one — so the solver
                                        #     takes an acceptable link and refuses an unacceptable one, instead of
                                        #     ever handing out the leftover. The assignment itself is an exhaustive
                                        #     branch-and-bound over the at most 8×8 acceptable pairs, cheapest branch
                                        #     first, pruned with an admissible suffix bound and hard-capped at
                                        #     200 000 visited nodes; exceeding the cap REFUSES the group rather than
                                        #     returning a half-searched answer.
                                        #     Refusing a guess: the node emits only the pairs that occur in EVERY
                                        #     cost-optimal assignment. Two equidistant documents produce two optima
                                        #     that disagree, so that pair is dropped while the unambiguous pairs of
                                        #     the same group are still settled.
                                        #     Returns null (nothing to do / refused) or the compact
                                        #     {"Items":[{"t":"<txRtId>","d":"<docRtId>","c":"0|1"}],"TotalCount":N},
                                        #     parsed back into the data context by WriteJson@1 below. c = "1" marks a
                                        #     pair settled inside the accepted window but outside the strict AB#4512
                                        #     band (the charge was booked before the document date).
                                        - type: ExecuteCSharp@1
