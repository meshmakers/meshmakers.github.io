$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
  - Meshmakers.Accounting-[3.0.0,4.0)
  - System.Communication-[3.0,4.0)
  - System.Reporting-[2.0,3.0)
  - System.Identity-[2.12.0,3.0)
  - System.UI-[2.2,3.0)
entities:
  # --- Pipelines: match-transactions ---
  - rtId: 67d4a2f0b2e4d8c3a1f00100
    ckTypeId: System.Communication/DataFlow
    attributes:
      - id: System/Name
        value: Match Transactions to Documents
      - id: System/Description
        value: Cyclically matches unreviewed bank transactions to open accounting documents — deterministic amount/type matching first, AI fallback for ambiguous cases
  - rtId: 67d4a2f0b2e4d8c3a1f00101
    ckTypeId: System.Communication/Pipeline
    associations:
      - roleId: System/ParentChild
        targetRtId: 67d4a2f0b2e4d8c3a1f00100
        targetCkTypeId: System.Communication/DataFlow
      - roleId: System.Communication/Executes
        targetRtId: "670000000000000000000002"
        targetCkTypeId: System.Communication/Adapter
      # AI configuration lookup requires BOTH the apiKeyConfigurationName on the
      # node AND this Uses association (the adapter resolves the config through
      # the association, the name is validated against it).
      - roleId: System.Communication/Uses
        targetRtId: 67f0c00ec4ff02221e0b7003
        targetCkTypeId: System.Communication/AiConfiguration
    attributes:
      - id: System.Communication/DeploymentState
        value: 0
      - id: System/Name
        value: Match Transactions Pipeline
      - id: System/Enabled
        value: true
      - id: System.Communication/PipelineDefinition
        value: >-
          triggers:
            # Cron PipelineTrigger (67d4a2f0b2e4d8c3a1f00102) instead of FromPolling:
            # the adapter runs OnDemand (scale-to-zero, AB#4984) and an in-process
            # poller would silently stop while the workload is hibernated.
            - type: FromPipelineTriggerEvent@1
            - type: FromHttpRequest@2
              path: /matchTransactions
              method: POST
              allowAnonymous: false
              requiredRoles:
                - AccountingManagement
          transformations:
            # --- Recurring documents (Dauerbeleg) pass — runs FIRST so a
            #     recurring debit is claimed by its standing document before the
            #     deterministic amount pass and the AI fallback (both of which
            #     only ever consider OPEN documents, DocumentState 0) get to it.
            #     A recurring document carries exactly one match type + value, so
            #     at most one of the three lookups below fires — no ambiguity.
            - type: GetRtEntitiesByType@1
              description: Load recurring master documents (Dauerbelege)
              ckTypeId: Meshmakers.Accounting/AccountingDocument
              targetPath: $.recurringDocs
              take: 200
              fieldFilters:
                - attributePath: DocumentState
                  operator: Equals
                  comparisonValue: 4
            - type: ForEach@1
              description: For each recurring document, match its unreviewed debits by SEPA key
              iterationPath: $.recurringDocs.Items
              targetPath: $.recResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                # Init to an empty result set so the inner ForEach never sees a
                # missing array (ForEach throws PathMustBeArray otherwise) when a
                # document has no match type set.
                - type: WriteJson@1
                  targetPath: $.key._recTxs
                  jsonString: '{"Items":[],"TotalCount":0}'
                - type: If@1
                  description: Match by SEPA Creditor Id
                  path: $.key.Attributes.RecurrenceMatchType
                  operator: Equals
                  value: 0
                  valueType: Int64
                  transformations:
                    - type: GetRtEntitiesByType@1
                      ckTypeId: Basic.Accounting/BankTransaction
                      targetPath: $.key._recTxs
                      take: 100
                      fieldFilters:
                        # Reconsider BOTH unreviewed (0) and previously unmatched (2)
                        # transactions (AB#4473): a recurring document configured
                        # AFTER its debits were imported must still pick up the
                        # burned ones on the next cycle. Safe against the null-key
                        # bulk-match incident (AB#4397) because every branch also
                        # requires the transaction key to be present (MatchRegEx
                        # below). Ignored (3) stays excluded.
                        - attributePath: MatchState
                          operator: In
                          comparisonValue: [0, 2]
                        - attributePath: CreditorId
                          operator: Equals
                          comparisonValuePath: $.key.Attributes.RecurrenceMatchValue
                        # Null-guard: require the transaction to actually carry a
                        # CreditorId. A Dauerbeleg with a null/empty
                        # RecurrenceMatchValue would otherwise degenerate to
                        # "CreditorId Equals null" and bulk-match every transaction
                        # whose CreditorId is also null. "key present AND key Equals
                        # null" is empty, so misconfigured documents match nothing.
                        # Filtered on the transaction key (not RecurrenceMatchValue)
                        # so it resolves even when the adapter has an older CK model
                        # cached — a field filter on RecurrenceMatchValue would fail
                        # to resolve there.
                        - attributePath: CreditorId
                          operator: MatchRegEx
                          comparisonValue: .+
                - type: If@1
                  description: Match by SEPA mandate reference
                  path: $.key.Attributes.RecurrenceMatchType
                  operator: Equals
                  value: 1
                  valueType: Int64
                  transformations:
                    - type: GetRtEntitiesByType@1
                      ckTypeId: Basic.Accounting/BankTransaction
                      targetPath: $.key._recTxs
                      take: 100
                      fieldFilters:
                        # In [0, 2]: see the CreditorId branch (AB#4473).
                        - attributePath: MatchState
                          operator: In
                          comparisonValue: [0, 2]
                        - attributePath: MandateReference
                          operator: Equals
                          comparisonValuePath: $.key.Attributes.RecurrenceMatchValue
                        # Null-guard: require the transaction to carry a MandateReference
                        # (see the CreditorId branch above for the rationale).
                        - attributePath: MandateReference
                          operator: MatchRegEx
                          comparisonValue: .+
                - type: If@1
                  description: Match by counterpart IBAN
                  path: $.key.Attributes.RecurrenceMatchType
                  operator: Equals
                  value: 2
                  valueType: Int64
                  transformations:
                    - type: GetRtEntitiesByType@1
                      ckTypeId: Basic.Accounting/BankTransaction
                      targetPath: $.key._recTxs
                      take: 100
                      fieldFilters:
                        # In [0, 2]: see the CreditorId branch (AB#4473).
                        - attributePath: MatchState
                          operator: In
                          comparisonValue: [0, 2]
                        - attributePath: CounterpartIban
                          operator: Equals
                          comparisonValuePath: $.key.Attributes.RecurrenceMatchValue
                        # Null-guard: require the transaction to carry a CounterpartIban
                        # (see the CreditorId branch above for the rationale).
                        - attributePath: CounterpartIban
                          operator: MatchRegEx
                          comparisonValue: .+
                - type: If@1
                  description: Match by a token in the transaction purpose (Verwendungszweck)
                  path: $.key.Attributes.RecurrenceMatchType
                  operator: Equals
                  value: 3
                  valueType: Int64
                  transformations:
                    # Guard against a null/empty RecurrenceMatchValue. Unlike the
                    # SEPA branches (where "Equals null" is empty), the purpose
                    # branch matches with a regex — an empty pattern matches EVERY
                    # non-null purpose and would bulk-link every transaction to the
                    # document. So only run the query when a non-empty value is
                    # configured. Checked on the document DataContext (not a field
                    # filter) so it resolves regardless of the adapter's CK cache.
                    - type: If@1
                      description: Only match when a non-empty purpose token is configured
                      path: $.key.Attributes.RecurrenceMatchValue
                      operator: RegexMatch
                      value: .+
                      valueType: String
                      transformations:
                        - type: GetRtEntitiesByType@1
                          ckTypeId: Basic.Accounting/BankTransaction
                          targetPath: $.key._recTxs
                          take: 100
                          fieldFilters:
                            # In [0, 2]: see the CreditorId branch (AB#4473).
                            - attributePath: MatchState
                              operator: In
                              comparisonValue: [0, 2]
                            # Case-sensitive substring match: the token (e.g. an
                            # insurance policy number) appears anywhere in the
                            # free-text purpose. Mirrors the CategorizationRule
                            # PURPOSE pass. A null purpose never matches a non-empty
                            # pattern, so no extra null-guard is needed here.
                            - attributePath: Purpose
                              operator: MatchRegEx
                              comparisonValuePath: $.key.Attributes.RecurrenceMatchValue
                - type: ForEach@1
                  description: Link every matched debit to this recurring document
                  iterationPath: $.key._recTxs.Items
                  targetPath: $.key._recTxResults
                  targetValueKind: Simple
                  targetValueWriteMode: Overwrite
                  maxDegreeOfParallelism: 1
                  transformations:
                    - type: CreateAssociationUpdate@1
                      description: Recurring document -> transaction
                      targetPath: $.key._recAssoc
                      targetValueKind: Array
                      targetValueWriteMode: Append
                      updateKind: Create
                      originRtIdPath: $.full.key.RtId
                      originCkTypeId: Meshmakers.Accounting/AccountingDocument
                      targetRtIdPath: $.key.RtId
                      targetCkTypeId: Basic.Accounting/BankTransaction
                      associationRoleId: Meshmakers.Accounting/TransactionToDocument
                    - type: CreateUpdateInfo@1
                      description: Transaction is matched to its recurring document
                      targetPath: $.key._recUpd
                      targetValueKind: Array
                      targetValueWriteMode: Append
                      updateKind: Update
                      ckTypeId: Basic.Accounting/BankTransaction
                      rtIdPath: $.key.RtId
                      attributeUpdates:
                        - attributeName: MatchState
                          attributeValueType: Enum
                          value: Matched
                        - attributeName: MatchComment
                          attributeValueType: String
                          value: Auto-matched to recurring document
            - type: Flatten@1
              description: Collect recurring transaction updates across all documents and debits
              path: $.recResults[*]._recTxResults[*]._recUpd[*]
              targetPath: $._recEntityUpdates
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
            - type: Flatten@1
              description: Collect recurring association updates
              path: $.recResults[*]._recTxResults[*]._recAssoc[*]
              targetPath: $._recAssocUpdates
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
            - type: ApplyChanges@2
              description: Persist recurring matches (transactions + document links)
              entityUpdatesPath: $._recEntityUpdates
              associationUpdatesPath: $._recAssocUpdates
            # --- Executed payment-order pass (AB#4888) — the app creates ONE
            #     Basic.Accounting/PaymentOrder over the TOTAL of several expense
            #     documents (collective reimbursement, AB#4887; single-document
            #     orders via "Mark for transfer" too). Once the SEPA file is
            #     imported at the bank the order is Executed, and the later bank
            #     debit matches NO single document's GrossTotal — the debit is
            #     the group sum — so the amount-anchored passes below can never
            #     settle it. This pass anchors on the ORDER instead: a pending
            #     debit whose absolute amount and counterpart IBAN equal a
            #     UNIQUE Executed order's Amount and RecipientIban settles every
            #     linked document (DocumentToPaymentOrder) that is still OPEN
            #     and unlinked — each paid with its OWN gross total. Runs right
            #     after the recurring pass and BEFORE the auto-categorization
            #     pass: the reimbursement purpose the app writes ("Spesen
            #     <numbers>") collides with the bank-fee rule's "Spesen" token,
            #     which would otherwise terminally claim the debit as a bank
            #     fee — an executed order over exactly this amount to exactly
            #     this IBAN is the stronger deterministic anchor. Orders
            #     without linked documents (e.g. vendor orders created before
            #     AB#4887) never fire and the transaction flows on to the later
            #     passes unchanged. Idempotent via the MatchState In [0,2] gate
            #     plus the per-document OPEN/unlinked guards; a second identical
            #     debit against the same order finds no settleable document and
            #     falls through.
            - type: GetRtEntitiesByType@1
              description: Pending debits with a counterpart IBAN (payment-order candidates)
              ckTypeId: Basic.Accounting/BankTransaction
              targetPath: $.poPending
              take: 500
              fieldFilters:
                - attributePath: MatchState
                  operator: In
                  comparisonValue:
                    - 0
                    - 2
                - attributePath: Direction
                  operator: Equals
                  comparisonValue: 1
                # Null-guard: the RecipientIban filter below compares against the
                # transaction's counterpart IBAN — only consider transactions
                # that actually carry one.
                - attributePath: CounterpartIban
                  operator: MatchRegEx
                  comparisonValue: .+
            - type: ForEach@1
              description: Executed payment-order pass — settle the order's linked documents against the debit
              iterationPath: $.poPending.Items
              targetPath: $.poResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                - type: Math@1
                  description: Expected order amount = absolute value of the debit amount
                  path: $.key
                  itemPath: $.Attributes.Amount
                  itemTargetPath: $._poAmount
                  operation: Multiply
                  value: -1
                - type: GetRtEntitiesByType@1
                  description: Executed payment orders over exactly this amount to this recipient IBAN
                  ckTypeId: Basic.Accounting/PaymentOrder
                  targetPath: $.key._poOrders
                  take: 5
                  fieldFilters:
                    - attributePath: Status
                      operator: Equals
                      comparisonValue: 2
                    - attributePath: Amount
                      operator: Equals
                      comparisonValuePath: $.key._poAmount
                    - attributePath: RecipientIban
                      operator: Equals
                      comparisonValuePath: $.key.Attributes.CounterpartIban
                - type: If@1
                  description: Exactly ONE matching executed order — unambiguous
                  path: $.key._poOrders.TotalCount
                  operator: Equals
                  value: 1
                  valueType: Int64
                  transformations:
                    - type: GetAssociationTargets@1
                      description: Documents linked to the order (DocumentToPaymentOrder is declared on the document side)
                      originRtIdPath: $.key._poOrders.Items[0].RtId
                      originCkTypeId: Basic.Accounting/PaymentOrder
                      targetCkTypeId: Meshmakers.Accounting/AccountingDocument
                      associationRoleId: Meshmakers.Accounting/DocumentToPaymentOrder
                      graphDirection: Inbound
                      targetPath: $.key._poDocs
                    - type: If@1
                      description: The order carries at least one linked document (vendor orders without documents never fire)
                      path: $.key._poDocs[0].TotalCount
                      operator: GreaterEqualsThan
                      value: 1
                      valueType: Int64
                      transformations:
                        - type: ForEach@1
                          description: Check every linked document — settle it when still OPEN and unlinked
                          iterationPath: $.key._poDocs[0].Items
                          targetPath: $.key._poDocChecks
                          targetValueKind: Simple
                          targetValueWriteMode: Overwrite
                          maxDegreeOfParallelism: 1
                          transformations:
                            - type: SetPrimitiveValue@1
                              description: Document not settled by this pass (default)
                              targetPath: $.key._settled
                              value: 0
                              valueType: Int
                            - type: GetRtEntitiesByType@1
                              description: Load the linked document (state and gross total needed)
                              ckTypeId: Meshmakers.Accounting/AccountingDocument
                              targetPath: $.poDoc
                              take: 1
                              fieldFilters:
                                - attributePath: RtId
                                  operator: Equals
                                  comparisonValuePath: $.key.RtId
                            - type: If@1
                              description: Document resolved
                              path: $.poDoc.TotalCount
                              operator: GreaterEqualsThan
                              value: 1
                              valueType: Int64
                              transformations:
                                - type: If@1
                                  description: Document is still OPEN
                                  path: $.poDoc.Items[0].Attributes.DocumentState
                                  operator: Equals
                                  value: 0
                                  valueType: Int64
                                  transformations:
                                    - type: GetAssociationTargets@1
                                      description: Existing transaction links of the document (idempotency guard, AB#4398)
                                      originRtIdPath: $.key.RtId
                                      originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                      targetCkTypeId: Basic.Accounting/BankTransaction
                                      associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                      graphDirection: Outbound
                                      targetPath: $.poDocLinks
                                    - type: If@1
                                      description: Document not yet linked to any transaction
                                      path: $.poDocLinks[0].TotalCount
                                      operator: Equals
                                      value: 0
                                      valueType: Int64
                                      transformations:
                                        - type: CreateUpdateInfo@1
                                          description: Document is paid with its OWN gross total (the debit covers the group sum)
                                          targetPath: $.key._upd
                                          updateKind: Update
                                          ckTypeId: Meshmakers.Accounting/AccountingDocument
                                          rtIdPath: $.key.RtId
                                          attributeUpdates:
                                            - attributeName: DocumentState
                                              attributeValueType: Enum
                                              value: PAID
                                            - attributeName: PaidAmount
                                              attributeValueType: Double
                                              valuePath: $.poDoc.Items[0].Attributes.GrossTotal
                                        - type: CreateAssociationUpdate@1
                                          description: Link the document to the settling transaction
                                          targetPath: $.key._assoc
                                          updateKind: Create
                                          originRtIdPath: $.key.RtId
                                          originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                          targetRtIdPath: $.full.key.RtId
                                          targetCkTypeId: Basic.Accounting/BankTransaction
                                          associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                        - type: SetPrimitiveValue@1
                                          targetPath: $.key._settled
                                          value: 1
                                          valueType: Int
                        - type: SumAggregation@1
                          description: Documents settled by this pass
                          targetPath: $.key._poSettledCount
                          aggregations:
                            - path: $.key._poDocChecks[*]
                              aggregationPath: $._settled
                              value: 1
                              filterPath: null
                              comparisonValue: null
                        - type: If@1
                          description: At least one document settled — commit the group and match the transaction
                          path: $.key._poSettledCount
                          operator: GreaterThan
                          value: 0
                          valueType: Double
                          transformations:
                            - type: Flatten@1
                              description: Collect the document updates
                              path: $.key._poDocChecks[*]._upd
                              targetPath: $.key._poUpdates
                              targetValueKind: Simple
                              targetValueWriteMode: Overwrite
                            - type: Flatten@1
                              description: Collect the document links
                              path: $.key._poDocChecks[*]._assoc
                              targetPath: $.key._poAssocs
                              targetValueKind: Simple
                              targetValueWriteMode: Overwrite
                            - type: CreateUpdateInfo@1
                              description: Transaction is matched (executed payment order)
                              targetPath: $.key._poUpdates
                              targetValueKind: Array
                              targetValueWriteMode: Append
                              updateKind: Update
                              ckTypeId: Basic.Accounting/BankTransaction
                              rtIdPath: $.key.RtId
                              attributeUpdates:
                                - attributeName: MatchState
                                  attributeValueType: Enum
                                  value: Matched
                                - attributeName: MatchComment
                                  attributeValueType: String
                                  value: Auto-matched to executed payment order (collective reimbursement)
                            - type: ApplyChanges@2
                              entityUpdatesPath: $.key._poUpdates
                              associationUpdatesPath: $.key._poAssocs
            # --- Document-category propagation pass (AB#5389) — runs BEFORE the
            #     rule stage so a category a person put on the RECEIPT reaches the
            #     transactions matched to it before any rule gets to guess. On
            #     prod-1/meshmakers 495 of the 596 uncategorized FY 2025/26 rows are
            #     Matched to a document; rules only cover the recurring counterparts,
            #     and the receipt is exactly what says what the long tail was for.
            #     Traversal is category -> documents -> transactions, NOT a scan over
            #     transactions: neither GetRtEntitiesByType nor a field filter can
            #     select "has a document but no category" (no association traversal),
            #     so a transaction-driven load would be an arbitrary `take` over the
            #     whole set and re-scan the same rows forever. Categories are few
            #     (~17 per fiscal year), DocumentToCategory (CK 2.4.0, declared on
            #     CostCategory like TransactionToCategory) lists exactly the
            #     categorized documents, and TransactionToDocument lists exactly the
            #     transactions each one settles — the pass is bounded by the real
            #     work set by construction. Per transaction: (1) MatchState In
            #     [0, 1, 2] — Ignored (3) stays out for the same double-counting
            #     reason as in the rule stage; (2) the AB#4433 idempotency guard —
            #     no existing TransactionToCategory, whatever the MatchState; (3) the
            #     fiscal year is the one whose date range contains the BookingDate
            #     (in-pipeline If@1 DateTime, AB#4389), and the target is the
            #     category of the DOCUMENT category's CategoryType under that year
            #     (a receipt from FY 2025 may settle in FY 2026 — the type carries
            #     across years, the rtId does not); exactly one such category, else
            #     nothing. MatchState is never touched (a Matched row keeps its link,
            #     an Unreviewed row stays in the matching queue) and MatchComment is
            #     written ONLY when it is empty, so "Auto-matched …" comments survive:
            #     the comment is defaulted to "" and SelectByPath copies the stored
            #     value over it (skips missing/null), then If@1 compares the copy —
            #     the same absent-path shape the AB#4433 guards use. Changes are
            #     persisted per DOCUMENT: two documents with the same category may
            #     settle the same collective payment, and the guard must see the
            #     first document's assignment before the second one is evaluated —
            #     a repeated TransactionToCategory in one ApplyChanges aborts the
            #     run (AB#4398). take 500 bounds the category load (fiscal years x
            #     ~18 types), the per-document transaction list is the association
            #     itself.
            - type: GetRtEntitiesByType@1
              description: Load cost categories — each one lists the documents it is assigned to (AB#5389)
              ckTypeId: Meshmakers.Accounting/CostCategory
              targetPath: $.docCats
              take: 500
            - type: GetRtEntitiesByType@1
              description: Load fiscal years once for the whole pass to resolve each booking-date year
              ckTypeId: Meshmakers.Accounting/FiscalYear
              targetPath: $.docCatFys
              take: 50
            - type: ForEach@1
              description: Per category, the documents carrying it
              iterationPath: $.docCats.Items
              targetPath: $.docCatResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                # Init empty so the inner ForEach never hits a missing array.
                - type: WriteJson@1
                  targetPath: $.key._dcDocs
                  jsonString: '[{"Items":[],"TotalCount":0}]'
                - type: GetAssociationTargets@1
                  description: Documents assigned to this category (DocumentToCategory, declared on CostCategory)
                  originRtIdPath: $.key.RtId
                  originCkTypeId: Meshmakers.Accounting/CostCategory
                  targetCkTypeId: Meshmakers.Accounting/AccountingDocument
                  associationRoleId: Meshmakers.Accounting/DocumentToCategory
                  graphDirection: Outbound
                  targetPath: $.key._dcDocs
                - type: ForEach@1
                  description: Per document, the transactions matched to it
                  iterationPath: $.key._dcDocs[0].Items
                  targetPath: $.key._dcDocResults
                  targetValueKind: Simple
                  targetValueWriteMode: Overwrite
                  maxDegreeOfParallelism: 1
                  transformations:
                    - type: WriteJson@1
                      targetPath: $.key._dcTxs
                      jsonString: '[{"Items":[],"TotalCount":0}]'
                    - type: WriteJson@1
                      targetPath: $.key._dcTxResults
                      jsonString: '[]'
                    - type: GetAssociationTargets@1
                      description: Transactions matched to this document, Ignored (3) excluded
                      originRtIdPath: $.key.RtId
                      originCkTypeId: Meshmakers.Accounting/AccountingDocument
                      targetCkTypeId: Basic.Accounting/BankTransaction
                      associationRoleId: Meshmakers.Accounting/TransactionToDocument
                      graphDirection: Outbound
                      fieldFilters:
                        - attributePath: MatchState
                          operator: In
                          comparisonValue:
                            - 0
                            - 1
                            - 2
                      targetPath: $.key._dcTxs
                    - type: ForEach@1
                      description: Per matched transaction — guard, resolve the year's category, build the edge
                      iterationPath: $.key._dcTxs[0].Items
                      targetPath: $.key._dcTxResults
                      targetValueKind: Simple
                      targetValueWriteMode: Overwrite
                      maxDegreeOfParallelism: 1
                      transformations:
                        - type: GetAssociationTargets@1
                          description: Existing category on this transaction (idempotency guard, AB#4433 — a repeated TransactionToCategory aborts the run, cf. AB#4398)
                          originRtIdPath: $.key.RtId
                          originCkTypeId: Basic.Accounting/BankTransaction
                          targetCkTypeId: Meshmakers.Accounting/CostCategory
                          associationRoleId: Meshmakers.Accounting/TransactionToCategory
                          graphDirection: Inbound
                          targetPath: $.key._dcExisting
                        - type: If@1
                          description: Only a transaction without a category gets the document's (never overwrite)
                          path: $.key._dcExisting[0].TotalCount
                          operator: Equals
                          value: 0
                          valueType: Int64
                          transformations:
                            # Context levels inside the fiscal-year loop below: $.key = fiscal
                            # year, $.full.key = transaction, $.full.full.key = document,
                            # $.full.full.full.key = the category being propagated,
                            # $.full.full.full.full = the root (fiscal years loaded once).
                            - type: ForEach@1
                              description: Find the fiscal year containing the booking date, then its category of the document category's type
                              iterationPath: $.full.full.full.docCatFys.Items
                              targetPath: $.key._dcFyResults
                              targetValueKind: Simple
                              targetValueWriteMode: Overwrite
                              maxDegreeOfParallelism: 1
                              transformations:
                                - type: If@1
                                  description: Booking date on/after fiscal-year start
                                  path: $.full.key.Attributes.BookingDate
                                  operator: GreaterEqualsThan
                                  valuePath: $.key.Attributes.StartDate
                                  valueType: DateTime
                                  transformations:
                                    - type: If@1
                                      description: Booking date on/before fiscal-year end
                                      path: $.full.key.Attributes.BookingDate
                                      operator: LessEqualsThan
                                      valuePath: $.key.Attributes.EndDate
                                      valueType: DateTime
                                      transformations:
                                        - type: GetAssociationTargets@1
                                          description: Category of the document category's type under this fiscal year
                                          originRtIdPath: $.key.RtId
                                          originCkTypeId: Meshmakers.Accounting/FiscalYear
                                          targetCkTypeId: Meshmakers.Accounting/CostCategory
                                          associationRoleId: System/ParentChild
                                          graphDirection: Inbound
                                          fieldFilters:
                                            - attributePath: CategoryType
                                              operator: Equals
                                              comparisonValuePath: $.full.full.full.key.Attributes.CategoryType
                                          targetPath: $.key._dcCatGroups
                                        - type: If@1
                                          description: Exactly one matching category — assign it
                                          path: $.key._dcCatGroups[0].TotalCount
                                          operator: Equal
                                          value: 1
                                          valueType: Int64
                                          transformations:
                                            - type: CreateAssociationUpdate@1
                                              description: Cost category -> transaction
                                              targetPath: $.key._dcAssoc
                                              targetValueKind: Array
                                              targetValueWriteMode: Append
                                              updateKind: Create
                                              originRtIdPath: $.key._dcCatGroups[0].Items[0].RtId
                                              originCkTypeId: Meshmakers.Accounting/CostCategory
                                              targetRtIdPath: $.full.key.RtId
                                              targetCkTypeId: Basic.Accounting/BankTransaction
                                              associationRoleId: Meshmakers.Accounting/TransactionToCategory
                                            # MatchComment only when empty: default "", copy the stored
                                            # value over it (SelectByPath skips a missing/null source),
                                            # compare the copy. A Matched row keeps "Auto-matched …".
                                            - type: SetPrimitiveValue@1
                                              description: Default — no comment yet
                                              targetPath: $.key._dcMc
                                              value: ""
                                              valueType: String
                                            - type: SelectByPath@1
                                              description: Copy the transaction's MatchComment when present
                                              selectPath:
                                                - path: $.full.key.Attributes.MatchComment
                                                  targetPath: $.key._dcMc
                                            - type: If@1
                                              description: Empty comment — say where the category came from
                                              path: $.key._dcMc
                                              operator: Equal
                                              value: ""
                                              valueType: String
                                              transformations:
                                                - type: CreateUpdateInfo@1
                                                  targetPath: $.key._dcUpd
                                                  targetValueKind: Array
                                                  targetValueWriteMode: Append
                                                  updateKind: Update
                                                  ckTypeId: Basic.Accounting/BankTransaction
                                                  rtIdPath: $.full.key.RtId
                                                  attributeUpdates:
                                                    - attributeName: MatchComment
                                                      attributeValueType: String
                                                      value: Categorized from document (auto)
                    # Persist per document (see the pass comment): the next document's
                    # guard must see this one's assignments.
                    - type: Flatten@1
                      description: Collect category association updates for this document
                      path: $.key._dcTxResults[*]._dcFyResults[*]._dcAssoc[*]
                      targetPath: $.key._dcAssocUpdates
                      targetValueKind: Simple
                      targetValueWriteMode: Overwrite
                    - type: Flatten@1
                      description: Collect comment updates for this document
                      path: $.key._dcTxResults[*]._dcFyResults[*]._dcUpd[*]
                      targetPath: $.key._dcEntityUpdates
                      targetValueKind: Simple
                      targetValueWriteMode: Overwrite
                    - type: ApplyChanges@2
                      description: Persist this document's category propagation
                      entityUpdatesPath: $.key._dcEntityUpdates
                      associationUpdatesPath: $.key._dcAssocUpdates
                    # Release the per-document loads before the next iteration is merged
                    # into $.key._dcDocResults — the merge keeps every iteration's $.key.
                    - type: SetPrimitiveValue@1
                      targetPath: $.key._dcTxs
                      value: ""
                      valueType: String
                    - type: SetPrimitiveValue@1
                      targetPath: $.key._dcTxResults
                      value: ""
                      valueType: String
            - type: SetPrimitiveValue@1
              description: Release the category pass results
              targetPath: $.docCatResults
              value: ""
              valueType: String
            # --- Auto-categorization pass (rule-based) — runs after the recurring and
            #     payment-order passes (AB#4888: the reimbursement purpose "Spesen …"
            #     must not be claimed by the bank-fee rule first) and before the
            #     document/AI passes so receiptless costs (bank fees ->
            #     MATCHED, private -> IGNORED) are resolved before AI spend. Each
            #     CategorizationRule matches transactions on exactly ONE field
            #     (case-SENSITIVE regex: FieldFilterResolver passes MatchRegEx to Mongo
            #     without options, only Like gets "i") and assigns a cost category of its target
            #     type. The target category is resolved per transaction as the category
            #     of the rule's type under the FiscalYear whose date range contains the
            #     BookingDate (AB#4407) — so a rule works across fiscal years. Date field
            #     filters on dynamic CK attributes do not coerce (AB#4389), so the
            #     fiscal-year test is done in-pipeline with If@1 valueType DateTime; the
            #     category is then resolved with GetAssociationTargets (association-
            #     traversal is NOT supported by GetRtEntitiesByType field filters).
            #     Rules see MATCHED transactions too (AB#5388). The five loads below
            #     filter on Basic.Accounting/TransactionMatchState In [0, 1, 2] —
            #     Unreviewed (0), Matched (1), Unmatched (2). Until AB#5388 the set was
            #     [0, 2], so a transaction matched to a document — which carries no
            #     category either — was never categorized: on prod-1/meshmakers 774 of
            #     the 875 uncategorized 2025/26 transactions sat in state 1 and a run
            #     with new rules assigned NOTHING. Ignored (3) stays OUT on purpose: the
            #     actuals recompute sums every TransactionToCategory target without a
            #     MatchState filter, and the Ignored set holds the AB#4509 PayPal
            #     funding legs ("PAYPAL *GITHUB"), so a category on an Ignored row
            #     would count the purchase twice. Idempotency for the widened set is
            #     the per-transaction guard below (AB#4433): the category is assigned
            #     only when the transaction has none yet, whatever its MatchState; the
            #     terminal MatchState/MatchComment write is additionally gated on the
            #     transaction NOT being Matched, so a document-matched one keeps its
            #     link and comment and only gets the category. Keep rules terminal all
            #     the same (AB#4407); a non-terminal rule re-evaluates each cycle,
            #     guarded. Rule precedence is RulePriority ascending (sortOrders on
            #     the rule load, AB#5388) — before that it was Mongo natural order,
            #     which only happened to match the seed order and put every custom
            #     rule after all seeded ones. take 5000: a payroll rule matches far
            #     more than 500 rows on a tenant with 3,000+ transactions even though
            #     most are already categorized, and a hit cap silently skipped the rest.
            - type: GetRtEntitiesByType@1
              description: Load enabled categorization rules
              ckTypeId: Meshmakers.Accounting/CategorizationRule
              targetPath: $.catRules
              take: 200
              sortOrders:
                - attributeName: RulePriority
                  sortOrder: Ascending
              fieldFilters:
                - attributePath: RuleEnabled
                  operator: Equals
                  comparisonValue: true
            - type: ForEach@1
              description: Apply each categorization rule
              iterationPath: $.catRules.Items
              targetPath: $.catResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                # Init empty so downstream Flatten/ForEach never hit a missing array.
                - type: WriteJson@1
                  targetPath: $.key._catTxs
                  jsonString: '{"Items":[],"TotalCount":0}'
                - type: WriteJson@1
                  targetPath: $.key._catTxResults
                  jsonString: '[]'
                - type: If@1
                  description: Match on Purpose
                  path: $.key.Attributes.RuleMatchField
                  operator: Equal
                  value: 0
                  valueType: Enum
                  transformations:
                    - type: GetRtEntitiesByType@1
                      ckTypeId: Basic.Accounting/BankTransaction
                      targetPath: $.key._catTxs
                      take: 5000
                      fieldFilters:
                        - attributePath: MatchState
                          operator: In
                          comparisonValue:
                            - 0
                            - 1
                            - 2
                        - attributePath: Purpose
                          operator: MatchRegEx
                          comparisonValuePath: $.key.Attributes.RuleMatchValue
                - type: If@1
                  description: Match on CounterpartIban
                  path: $.key.Attributes.RuleMatchField
                  operator: Equal
                  value: 1
                  valueType: Enum
                  transformations:
                    - type: GetRtEntitiesByType@1
                      ckTypeId: Basic.Accounting/BankTransaction
                      targetPath: $.key._catTxs
                      take: 5000
                      fieldFilters:
                        - attributePath: MatchState
                          operator: In
                          comparisonValue:
                            - 0
                            - 1
                            - 2
                        - attributePath: CounterpartIban
                          operator: MatchRegEx
                          comparisonValuePath: $.key.Attributes.RuleMatchValue
                - type: If@1
                  description: Match on CreditorId
                  path: $.key.Attributes.RuleMatchField
                  operator: Equal
                  value: 2
                  valueType: Enum
                  transformations:
                    - type: GetRtEntitiesByType@1
                      ckTypeId: Basic.Accounting/BankTransaction
                      targetPath: $.key._catTxs
                      take: 5000
                      fieldFilters:
                        - attributePath: MatchState
                          operator: In
                          comparisonValue:
                            - 0
                            - 1
                            - 2
                        - attributePath: CreditorId
                          operator: MatchRegEx
                          comparisonValuePath: $.key.Attributes.RuleMatchValue
                - type: If@1
                  description: Match on CounterpartName
                  path: $.key.Attributes.RuleMatchField
                  operator: Equal
                  value: 3
                  valueType: Enum
                  transformations:
                    - type: GetRtEntitiesByType@1
                      ckTypeId: Basic.Accounting/BankTransaction
                      targetPath: $.key._catTxs
                      take: 5000
                      fieldFilters:
                        - attributePath: MatchState
                          operator: In
                          comparisonValue:
                            - 0
                            - 1
                            - 2
                        - attributePath: CounterpartName
                          operator: MatchRegEx
                          comparisonValuePath: $.key.Attributes.RuleMatchValue
                - type: If@1
                  description: Match on BankTransactionCode
                  path: $.key.Attributes.RuleMatchField
                  operator: Equal
                  value: 4
                  valueType: Enum
                  transformations:
                    - type: GetRtEntitiesByType@1
                      ckTypeId: Basic.Accounting/BankTransaction
                      targetPath: $.key._catTxs
                      take: 5000
                      fieldFilters:
                        - attributePath: MatchState
                          operator: In
                          comparisonValue:
                            - 0
                            - 1
                            - 2
                        - attributePath: BankTransactionCode
                          operator: MatchRegEx
                          comparisonValuePath: $.key.Attributes.RuleMatchValue
                - type: GetRtEntitiesByType@1
                  description: Load fiscal years once per rule to resolve each booking-date year (AB#5388)
                  ckTypeId: Meshmakers.Accounting/FiscalYear
                  targetPath: $.key._fys
                  take: 50
                - type: ForEach@1
                  description: Assign category (+ optional terminal state) per matched transaction
                  iterationPath: $.key._catTxs.Items
                  targetPath: $.key._catTxResults
                  targetValueKind: Simple
                  targetValueWriteMode: Overwrite
                  maxDegreeOfParallelism: 1
                  transformations:
                    # Direction guard: ANY, or DEBIT (Direction 1), or CREDIT (Direction 0).
                    - type: SetPrimitiveValue@1
                      targetPath: $.key._dirOk
                      value: 0
                      valueType: Int
                    - type: If@1
                      path: $.full.key.Attributes.RuleDirectionFilter
                      operator: Equal
                      value: 0
                      valueType: Enum
                      transformations:
                        - type: SetPrimitiveValue@1
                          targetPath: $.key._dirOk
                          value: 1
                          valueType: Int
                    # AB#4539: these two guards were nested inside the ANY branch
                    # above, so direction-filtered rules never set _dirOk and
                    # assigned nothing. They must be siblings of the ANY check.
                    - type: If@1
                      path: $.full.key.Attributes.RuleDirectionFilter
                      operator: Equal
                      value: 1
                      valueType: Enum
                      transformations:
                        - type: If@1
                          path: $.key.Attributes.Direction
                          operator: Equal
                          value: 1
                          valueType: Int64
                          transformations:
                            - type: SetPrimitiveValue@1
                              targetPath: $.key._dirOk
                              value: 1
                              valueType: Int
                    - type: If@1
                      path: $.full.key.Attributes.RuleDirectionFilter
                      operator: Equal
                      value: 2
                      valueType: Enum
                      transformations:
                        - type: If@1
                          path: $.key.Attributes.Direction
                          operator: Equal
                          value: 0
                          valueType: Int64
                          transformations:
                            - type: SetPrimitiveValue@1
                              targetPath: $.key._dirOk
                              value: 1
                              valueType: Int
                    - type: If@1
                      description: Direction allowed — resolve fiscal year + category
                      path: $.key._dirOk
                      operator: Equal
                      value: 1
                      valueType: Int64
                      transformations:
                        # The fiscal years are loaded ONCE per rule ($.full.key._fys, AB#5388)
                        # instead of once per transaction; ForEach@1 deep-clones every
                        # iteration item, so the writes below land on this transaction's
                        # own copy of the year, never on the shared list.
                        - type: ForEach@1
                          description: Find the fiscal year containing the booking date, then its category
                          iterationPath: $.full.key._fys.Items
                          targetPath: $.key._fyResults
                          targetValueKind: Simple
                          targetValueWriteMode: Overwrite
                          maxDegreeOfParallelism: 1
                          transformations:
                            - type: If@1
                              description: Booking date on/after fiscal-year start
                              path: $.full.key.Attributes.BookingDate
                              operator: GreaterEqualsThan
                              valuePath: $.key.Attributes.StartDate
                              valueType: DateTime
                              transformations:
                                - type: If@1
                                  description: Booking date on/before fiscal-year end
                                  path: $.full.key.Attributes.BookingDate
                                  operator: LessEqualsThan
                                  valuePath: $.key.Attributes.EndDate
                                  valueType: DateTime
                                  transformations:
                                    - type: GetAssociationTargets@1
                                      description: Category of the rule's type under this fiscal year
                                      originRtIdPath: $.key.RtId
                                      originCkTypeId: Meshmakers.Accounting/FiscalYear
                                      targetCkTypeId: Meshmakers.Accounting/CostCategory
                                      associationRoleId: System/ParentChild
                                      graphDirection: Inbound
                                      fieldFilters:
                                        - attributePath: CategoryType
                                          operator: Equals
                                          comparisonValuePath: $.full.full.key.Attributes.RuleTargetCategoryType
                                      targetPath: $.key._catGroups
                                    - type: If@1
                                      description: Exactly one matching category — assign it
                                      path: $.key._catGroups[0].TotalCount
                                      operator: Equal
                                      value: 1
                                      valueType: Int64
                                      transformations:
                                        - type: GetAssociationTargets@1
                                          description: Existing category on this transaction (idempotency guard, AB#4433 — the category add is not idempotent; a repeated TransactionToCategory aborts the run, cf. AB#4398)
                                          originRtIdPath: $.full.key.RtId
                                          originCkTypeId: Basic.Accounting/BankTransaction
                                          targetCkTypeId: Meshmakers.Accounting/CostCategory
                                          associationRoleId: Meshmakers.Accounting/TransactionToCategory
                                          graphDirection: Inbound
                                          targetPath: $.key._existingCat
                                        - type: If@1
                                          description: Assign the category only when the transaction has none yet (idempotent, AB#4433)
                                          path: $.key._existingCat[0].TotalCount
                                          operator: Equals
                                          value: 0
                                          valueType: Int64
                                          transformations:
                                            - type: CreateAssociationUpdate@1
                                              description: Cost category -> transaction
                                              targetPath: $.key._catAssoc
                                              targetValueKind: Array
                                              targetValueWriteMode: Append
                                              updateKind: Create
                                              originRtIdPath: $.key._catGroups[0].Items[0].RtId
                                              originCkTypeId: Meshmakers.Accounting/CostCategory
                                              targetRtIdPath: $.full.key.RtId
                                              targetCkTypeId: Basic.Accounting/BankTransaction
                                              associationRoleId: Meshmakers.Accounting/TransactionToCategory
                                        # AB#5388: the terminal state is for a transaction the rules meet for the
                                        # FIRST time — Unreviewed (0) or Unmatched (2). Matched (1) keeps its
                                        # document link and MatchComment and got only the category above;
                                        # Ignored (3) never reaches this point (load filter In [0, 1, 2]).
                                        # A missing MatchState passes (NotEquals treats null as different),
                                        # which reads it as Unreviewed — the same as the rest of the pipeline.
                                        - type: If@1
                                          description: Terminal state only when the transaction is not Matched (1)
                                          path: $.full.key.Attributes.MatchState
                                          operator: NotEquals
                                          value: 1
                                          valueType: Enum
                                          transformations:
                                            - type: If@1
                                              path: $.full.full.key.Attributes.RuleTerminalState
                                              operator: Equal
                                              value: 1
                                              valueType: Enum
                                              transformations:
                                                - type: CreateUpdateInfo@1
                                                  targetPath: $.key._catUpd
                                                  targetValueKind: Array
                                                  targetValueWriteMode: Append
                                                  updateKind: Update
                                                  ckTypeId: Basic.Accounting/BankTransaction
                                                  rtIdPath: $.full.key.RtId
                                                  attributeUpdates:
                                                    - attributeName: MatchState
                                                      attributeValueType: Enum
                                                      value: Matched
                                                    - attributeName: MatchComment
                                                      attributeValueType: String
                                                      valuePath: $.full.full.key.Attributes.RuleCommentTemplate
                                            # AB#5390: a rule-driven Ignored carries ExclusionReason OTHER —
                                            # the rule's comment template IS the free text OTHER requires,
                                            # and CategorizationRule has no reason attribute of its own.
                                            - type: If@1
                                              path: $.full.full.key.Attributes.RuleTerminalState
                                              operator: Equal
                                              value: 2
                                              valueType: Enum
                                              transformations:
                                                - type: CreateUpdateInfo@1
                                                  targetPath: $.key._catUpd
                                                  targetValueKind: Array
                                                  targetValueWriteMode: Append
                                                  updateKind: Update
                                                  ckTypeId: Basic.Accounting/BankTransaction
                                                  rtIdPath: $.full.key.RtId
                                                  attributeUpdates:
                                                    - attributeName: MatchState
                                                      attributeValueType: Enum
                                                      value: Ignored
                                                    - attributeName: ExclusionReason
                                                      attributeValueType: Enum
                                                      value: OTHER
                                                    - attributeName: MatchComment
                                                      attributeValueType: String
                                                      valuePath: $.full.full.key.Attributes.RuleCommentTemplate
                # Persist this rule's assignments before the next rule runs so the next
                # rule's load filter (MatchState) and per-transaction category guard see
                # them.
                - type: Flatten@1
                  description: Collect category association updates for this rule
                  path: $.key._catTxResults[*]._fyResults[*]._catAssoc[*]
                  targetPath: $.key._catAssocUpdates
                  targetValueKind: Simple
                  targetValueWriteMode: Overwrite
                - type: Flatten@1
                  description: Collect transaction state updates for this rule
                  path: $.key._catTxResults[*]._fyResults[*]._catUpd[*]
                  targetPath: $.key._catEntityUpdates
                  targetValueKind: Simple
                  targetValueWriteMode: Overwrite
                - type: ApplyChanges@2
                  description: Persist this rule's category assignments
                  entityUpdatesPath: $.key._catEntityUpdates
                  associationUpdatesPath: $.key._catAssocUpdates
            # --- PayPal/credit-card settlement pass (AB#4509) — runs BEFORE the
            #     deterministic pass so a pass-through leg is never matched to a
            #     still-open document (which would double-count the expense).
            #     A purchase paid via PayPal appears once per involved own
            #     account: as the PayPal-ledger payment to the merchant AND as
            #     the card/bank funding debit ("PAYPAL *…"). Whichever leg the
            #     other passes match to the document first, the remaining leg is
            #     a settlement duplicate: a pending Debit with the SAME signed
            #     amount on a DIFFERENT own account, booked within ±7 days of a
            #     Matched twin. Guard: at least one of the two legs must carry a
            #     PayPal marker in Purpose or CounterpartName, so two unrelated
            #     same-amount purchases on different accounts are never
            #     conflated. Since AB#5390 the leg also carries ExclusionReason
            #     SETTLEMENTDUPLICATE (Basic.Accounting 1.7.0) — the structured
            #     twin of the comment. The comment reuses the fixed 'Credit card/PayPal
            #     payment' prefix of the manual mark action in the transactions
            #     list, with an (auto) suffix — same convention as the bank-fee
            #     (auto)/(manual) marks. Idempotent: ignoring the leg removes it
            #     from the In [0, 2] candidate set. Credit (refund) chains are
            #     deliberately out of scope. The finAPI PayPal history gap is
            #     handled implicitly: a leg whose twin was never imported finds
            #     no Matched twin and stays available for direct matching.
            - type: GetRtEntitiesByType@1
              description: Pending debits — potential settlement duplicates of a matched twin
              ckTypeId: Basic.Accounting/BankTransaction
              targetPath: $.ppPending
              take: 500
              fieldFilters:
                - attributePath: MatchState
                  operator: In
                  comparisonValue:
                    - 0
                    - 2
                - attributePath: Direction
                  operator: Equals
                  comparisonValue: 1
            - type: ForEach@1
              description: Ignore each pending leg whose matched twin lives on another account
              iterationPath: $.ppPending.Items
              targetPath: $.ppResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                - type: GetAssociationTargets@1
                  description: Account of the pending leg (transactions are children of their bank account)
                  originRtIdPath: $.key.RtId
                  originCkTypeId: Basic.Accounting/BankTransaction
                  targetCkTypeId: Basic.Accounting/BankAccount
                  associationRoleId: System/ParentChild
                  graphDirection: Outbound
                  targetPath: $.key._ppOwnAcc
                - type: DateTime@1
                  description: Twin window floor = booking date - 7 days
                  operation: AddDays
                  path: $.key.Attributes.BookingDate
                  value: -7
                  targetPath: $.key._ppMinDate
                - type: DateTime@1
                  description: Twin window cap = booking date + 7 days
                  operation: AddDays
                  path: $.key.Attributes.BookingDate
                  value: 7
                  targetPath: $.key._ppMaxDate
                - type: GetRtEntitiesByType@1
                  description: Matched debits with the same signed amount (twin candidates)
                  ckTypeId: Basic.Accounting/BankTransaction
                  targetPath: $.key._ppTwins
                  take: 20
                  fieldFilters:
                    - attributePath: MatchState
                      operator: Equals
                      comparisonValue: 1
                    - attributePath: Direction
                      operator: Equals
                      comparisonValue: 1
                    - attributePath: Amount
                      operator: Equals
                      comparisonValuePath: $.key.Attributes.Amount
                - type: ForEach@1
                  description: Check each twin — booked close in time, PayPal marker, different account
                  iterationPath: $.key._ppTwins.Items
                  targetPath: $.key._ppTwinResults
                  targetValueKind: Simple
                  targetValueWriteMode: Overwrite
                  maxDegreeOfParallelism: 1
                  transformations:
                    - type: If@1
                      description: Twin booked no earlier than 7 days before the pending leg
                      path: $.key.Attributes.BookingDate
                      operator: GreaterEqualsThan
                      valuePath: $.full.key._ppMinDate
                      valueType: DateTime
                      transformations:
                        - type: If@1
                          description: …and no later than 7 days after it
                          path: $.key.Attributes.BookingDate
                          operator: LessEqualsThan
                          valuePath: $.full.key._ppMaxDate
                          valueType: DateTime
                          transformations:
                            # PayPal marker on EITHER leg. If@1 has no OR, so the
                            # four checks raise a flag. RegexMatch is null-safe: a
                            # null purpose/counterpart simply does not match.
                            - type: SetPrimitiveValue@1
                              description: No PayPal marker found yet
                              targetPath: $.key._ppMarker
                              value: false
                              valueType: Boolean
                            - type: If@1
                              description: Twin purpose mentions PayPal
                              path: $.key.Attributes.Purpose
                              operator: RegexMatch
                              value: (?i)paypal
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.key._ppMarker
                                  value: true
                                  valueType: Boolean
                            - type: If@1
                              description: Twin counterpart mentions PayPal
                              path: $.key.Attributes.CounterpartName
                              operator: RegexMatch
                              value: (?i)paypal
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.key._ppMarker
                                  value: true
                                  valueType: Boolean
                            - type: If@1
                              description: Pending leg purpose mentions PayPal
                              path: $.full.key.Attributes.Purpose
                              operator: RegexMatch
                              value: (?i)paypal
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.key._ppMarker
                                  value: true
                                  valueType: Boolean
                            - type: If@1
                              description: Pending leg counterpart mentions PayPal
                              path: $.full.key.Attributes.CounterpartName
                              operator: RegexMatch
                              value: (?i)paypal
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.key._ppMarker
                                  value: true
                                  valueType: Boolean
                            - type: If@1
                              description: PayPal marker present on at least one leg
                              path: $.key._ppMarker
                              operator: Equals
                              value: true
                              valueType: Boolean
                              transformations:
                                - type: GetAssociationTargets@1
                                  description: Account of the twin
                                  originRtIdPath: $.key.RtId
                                  originCkTypeId: Basic.Accounting/BankTransaction
                                  targetCkTypeId: Basic.Accounting/BankAccount
                                  associationRoleId: System/ParentChild
                                  graphDirection: Outbound
                                  targetPath: $.key._ppTwinAcc
                                # Both account lookups must have resolved — If@1
                                # with a valuePath THROWS on a missing path (the
                                # AB#4433 Part C incident), so guard on the
                                # always-present TotalCount before comparing.
                                - type: If@1
                                  description: Pending leg has a resolved account
                                  path: $.full.key._ppOwnAcc[0].TotalCount
                                  operator: GreaterThan
                                  value: 0
                                  valueType: Int64
                                  transformations:
                                    - type: If@1
                                      description: Twin has a resolved account
                                      path: $.key._ppTwinAcc[0].TotalCount
                                      operator: GreaterThan
                                      value: 0
                                      valueType: Int64
                                      transformations:
                                        - type: If@1
                                          description: Twin lives on a DIFFERENT own account — the pending leg is the settlement duplicate
                                          path: $.key._ppTwinAcc[0].Items[0].RtId
                                          operator: NotEquals
                                          valuePath: $.full.key._ppOwnAcc[0].Items[0].RtId
                                          valueType: String
                                          transformations:
                                            - type: CreateUpdateInfo@1
                                              description: Ignore the pending leg as a PayPal/card settlement pass-through (ExclusionReason SETTLEMENTDUPLICATE)
                                              targetPath: $._ppUpdates
                                              targetValueKind: Array
                                              targetValueWriteMode: Append
                                              updateKind: Update
                                              ckTypeId: Basic.Accounting/BankTransaction
                                              rtIdPath: $.full.key.RtId
                                              attributeUpdates:
                                                - attributeName: MatchState
                                                  attributeValueType: Enum
                                                  value: Ignored
                                                - attributeName: ExclusionReason
                                                  attributeValueType: Enum
                                                  value: SETTLEMENTDUPLICATE
                                                - attributeName: MatchComment
                                                  attributeValueType: String
                                                  value: Credit card/PayPal payment (auto)
                                            - type: ApplyChanges@2
                                              entityUpdatesPath: $._ppUpdates
            # --- Own-account transfer pass (AB#4511) — credit card statement
            #     settlement and any other transfer between own accounts. The
            #     monthly card statement books twice: the settlement debit on
            #     the checking account (CounterpartIban = the OWN card
            #     account's IBAN) and the balancing EINZUGSBETRAG credit on the
            #     card account (no counterpart IBAN). Neither leg ever needs a
            #     document — the individual purchases are imported separately.
            #     Step 1 anchors on the counterpart IBAN: a pending transaction
            #     whose CounterpartIban equals the IBAN of ANOTHER own account
            #     is by definition an own transfer — no amount/date heuristics.
            #     Step 2 catches the mirror credit: a pending credit on own
            #     account A that pairs with a debit elsewhere pointing at A's
            #     IBAN with the same absolute amount within ±3 days (regardless
            #     of that debit's match state — it may already be Ignored).
            #     Runs before the deterministic pass so a transfer leg can
            #     never claim an open document. Idempotent via the In [0, 2]
            #     gate. PayPal accounts carry no IBAN — those chains are
            #     handled by the AB#4509 twin-leg pass above. Both legs carry
            #     ExclusionReason TRANSFER since AB#5390.
            - type: GetRtEntitiesByType@1
              description: Own bank accounts that carry an IBAN
              ckTypeId: Basic.Accounting/BankAccount
              targetPath: $.otAccounts
              take: 50
              fieldFilters:
                - attributePath: Iban
                  operator: MatchRegEx
                  comparisonValue: .+
            - type: ForEach@1
              description: Per own IBAN account — ignore transfer legs in both directions
              iterationPath: $.otAccounts.Items
              targetPath: $.otResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                # Step 1: pending transactions ANYWHERE whose counterpart is
                # this own account — transfers to/from it, e.g. the checking
                # account's card settlement debit.
                - type: GetRtEntitiesByType@1
                  description: Pending transactions whose counterpart IBAN is this own account
                  ckTypeId: Basic.Accounting/BankTransaction
                  targetPath: $.key._otAnchored
                  take: 200
                  fieldFilters:
                    - attributePath: MatchState
                      operator: In
                      comparisonValue:
                        - 0
                        - 2
                    - attributePath: CounterpartIban
                      operator: Equals
                      comparisonValuePath: $.key.Attributes.Iban
                - type: ForEach@1
                  description: Ignore each anchored transfer leg (unless it sits on the counterpart account itself)
                  iterationPath: $.key._otAnchored.Items
                  targetPath: $.key._otAnchoredResults
                  targetValueKind: Simple
                  targetValueWriteMode: Overwrite
                  maxDegreeOfParallelism: 1
                  transformations:
                    - type: GetAssociationTargets@1
                      description: Account of this transaction (self-reference guard)
                      originRtIdPath: $.key.RtId
                      originCkTypeId: Basic.Accounting/BankTransaction
                      targetCkTypeId: Basic.Accounting/BankAccount
                      associationRoleId: System/ParentChild
                      graphDirection: Outbound
                      targetPath: $.key._otTxAcc
                    - type: If@1
                      description: Transaction has a resolved account
                      path: $.key._otTxAcc[0].TotalCount
                      operator: GreaterThan
                      value: 0
                      valueType: Int64
                      transformations:
                        - type: If@1
                          description: Not a self-reference — the leg belongs to a different account than its counterpart
                          path: $.key._otTxAcc[0].Items[0].RtId
                          operator: NotEquals
                          valuePath: $.full.key.RtId
                          valueType: String
                          transformations:
                            - type: CreateUpdateInfo@1
                              description: Ignore the transfer leg (own counterpart IBAN; ExclusionReason TRANSFER)
                              targetPath: $._otUpdates
                              targetValueKind: Array
                              targetValueWriteMode: Append
                              updateKind: Update
                              ckTypeId: Basic.Accounting/BankTransaction
                              rtIdPath: $.key.RtId
                              attributeUpdates:
                                - attributeName: MatchState
                                  attributeValueType: Enum
                                  value: Ignored
                                - attributeName: ExclusionReason
                                  attributeValueType: Enum
                                  value: TRANSFER
                                - attributeName: MatchComment
                                  attributeValueType: String
                                  value: Own-account transfer (auto)
                            - type: ApplyChanges@2
                              entityUpdatesPath: $._otUpdates
                # Step 2: pending credits ON this account (e.g. EINZUGSBETRAG,
                # no counterpart IBAN) — pair with a debit elsewhere that
                # points at this account's IBAN, same absolute amount, ±3 days.
                - type: GetAssociationTargets@1
                  description: Pending credits on this own account (mirror-leg candidates)
                  originRtIdPath: $.key.RtId
                  originCkTypeId: Basic.Accounting/BankAccount
                  targetCkTypeId: Basic.Accounting/BankTransaction
                  associationRoleId: System/ParentChild
                  graphDirection: Inbound
                  fieldFilters:
                    - attributePath: MatchState
                      operator: In
                      comparisonValue:
                        - 0
                        - 2
                    - attributePath: Direction
                      operator: Equals
                      comparisonValue: 0
                  targetPath: $.key._otCredits
                - type: ForEach@1
                  description: Pair each pending credit with a debit pointing at this account
                  iterationPath: $.key._otCredits[0].Items
                  targetPath: $.key._otCreditResults
                  targetValueKind: Simple
                  targetValueWriteMode: Overwrite
                  maxDegreeOfParallelism: 1
                  transformations:
                    - type: Math@1
                      description: Expected debit amount = negative credit amount
                      path: $.key
                      itemPath: $.Attributes.Amount
                      itemTargetPath: $._otNegAmount
                      operation: Multiply
                      value: -1
                    - type: DateTime@1
                      description: Pair window floor = booking date - 3 days
                      operation: AddDays
                      path: $.key.Attributes.BookingDate
                      value: -3
                      targetPath: $.key._otMinDate
                    - type: DateTime@1
                      description: Pair window cap = booking date + 3 days
                      operation: AddDays
                      path: $.key.Attributes.BookingDate
                      value: 3
                      targetPath: $.key._otMaxDate
                    - type: GetRtEntitiesByType@1
                      description: Debits pointing at this account with the matching amount (any match state)
                      ckTypeId: Basic.Accounting/BankTransaction
                      targetPath: $.key._otDebits
                      take: 10
                      fieldFilters:
                        - attributePath: Direction
                          operator: Equals
                          comparisonValue: 1
                        - attributePath: CounterpartIban
                          operator: Equals
                          comparisonValuePath: $.full.key.Attributes.Iban
                        - attributePath: Amount
                          operator: Equals
                          comparisonValuePath: $.key._otNegAmount
                    - type: ForEach@1
                      description: Ignore the credit when a debit twin books within the window
                      iterationPath: $.key._otDebits.Items
                      targetPath: $.key._otDebitResults
                      targetValueKind: Simple
                      targetValueWriteMode: Overwrite
                      maxDegreeOfParallelism: 1
                      transformations:
                        - type: If@1
                          description: Debit booked no earlier than 3 days before the credit
                          path: $.key.Attributes.BookingDate
                          operator: GreaterEqualsThan
                          valuePath: $.full.key._otMinDate
                          valueType: DateTime
                          transformations:
                            - type: If@1
                              description: …and no later than 3 days after it
                              path: $.key.Attributes.BookingDate
                              operator: LessEqualsThan
                              valuePath: $.full.key._otMaxDate
                              valueType: DateTime
                              transformations:
                                - type: CreateUpdateInfo@1
                                  description: Ignore the mirror credit of the own-account transfer (ExclusionReason TRANSFER)
                                  targetPath: $._otMirrorUpdates
                                  targetValueKind: Array
                                  targetValueWriteMode: Append
                                  updateKind: Update
                                  ckTypeId: Basic.Accounting/BankTransaction
                                  rtIdPath: $.full.key.RtId
                                  attributeUpdates:
                                    - attributeName: MatchState
                                      attributeValueType: Enum
                                      value: Ignored
                                    - attributeName: ExclusionReason
                                      attributeValueType: Enum
                                      value: TRANSFER
                                    - attributeName: MatchComment
                                      attributeValueType: String
                                      value: Own-account transfer (auto)
                                - type: ApplyChanges@2
                                  entityUpdatesPath: $._otMirrorUpdates
            - type: GetRtEntitiesByType@1
              # The deterministic pass reconsiders BOTH unreviewed (0) and
              # previously unmatched (2) transactions. Bank transactions and
              # accounting documents arrive asynchronously (bank sync vs. document
              # upload/analysis), so a transaction is often burned to Unmatched
              # before its document exists as an OPEN candidate. Re-including
              # Unmatched here lets a document parsed later still match its
              # transaction. take is raised so the whole in-scope backlog is
              # re-checked each cycle instead of starving behind the first page.
              # The AI fallback below stays gated on Unreviewed (0) only, so AI
              # tokens are spent at most once per transaction.
              description: Load unreviewed and previously unmatched bank transactions
              ckTypeId: Basic.Accounting/BankTransaction
              targetPath: $.pending
              take: 3000
              fieldFilters:
                - attributePath: MatchState
                  operator: In
                  comparisonValue:
                    - 0
                    - 2
            - type: ForEach@1
              description: Deterministic pass — unique open document with the exact amount and matching type
              iterationPath: $.pending.Items
              targetPath: $.detResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                - type: SetPrimitiveValue@1
                  description: Debit pays an INCOMING document (default)
                  targetPath: $._wantedDocType
                  value: 0
                  valueType: Int
                - type: Math@1
                  description: Default document amount = transaction amount (Credit)
                  path: $.key
                  itemPath: $.Attributes.Amount
                  itemTargetPath: $._docAmount
                  operation: Multiply
                  value: 1
                - type: If@1
                  description: Debit — invert the sign to get the positive document gross total
                  path: $.key.Attributes.Direction
                  operator: Equals
                  value: 1
                  valueType: Int64
                  transformations:
                    - type: Math@1
                      path: $.key
                      itemPath: $.Attributes.Amount
                      itemTargetPath: $._docAmount
                      operation: Multiply
                      value: -1
                - type: If@1
                  description: Credit is a payment we receive — match OUTGOING documents
                  path: $.key.Attributes.Direction
                  operator: Equals
                  value: 0
                  valueType: Int64
                  transformations:
                    - type: SetPrimitiveValue@1
                      targetPath: $._wantedDocType
                      value: 1
                      valueType: Int
                # AB#4542: the candidate query is restricted to documents whose
                # own date window [document date - 1 day, document date + 14
                # days] contains this booking date (inverted below: the document
                # date must lie in [booking date - 14 days, booking date + 1
                # day]). Without the date filters, recurring same-amount invoice
                # series (e.g. a monthly retainer) made TotalCount N>1 forever
                # and every series member stayed OPEN, even though each
                # transaction's window singles out exactly one member. With the
                # filters, TotalCount==1 means "exactly one IN-WINDOW candidate"
                # and out-of-window or undated documents no longer block the
                # pass (undated documents simply drop out of the query).
                - type: DateTime@1
                  description: Earliest document date whose match window still contains this booking date
                  operation: AddDays
                  path: $.key.Attributes.BookingDate
                  value: -14
                  targetPath: $.key._detDocMinDate
                - type: DateTime@1
                  description: Latest document date whose match window still contains this booking date
                  operation: AddDays
                  path: $.key.Attributes.BookingDate
                  value: 1
                  targetPath: $.key._detDocMaxDate
                - type: GetRtEntitiesByType@1
                  description: Open documents with exactly this gross total and type, dated so their match window contains this booking date
                  ckTypeId: Meshmakers.Accounting/AccountingDocument
                  targetPath: $._candidates
                  take: 5
                  fieldFilters:
                    - attributePath: DocumentState
                      operator: Equals
                      comparisonValue: 0
                    - attributePath: DocumentType
                      operator: Equals
                      comparisonValuePath: $._wantedDocType
                    - attributePath: GrossTotal
                      operator: Equals
                      comparisonValuePath: $.key._docAmount
                    - attributePath: DocumentDate
                      operator: GreaterEqualThan
                      comparisonValuePath: $.key._detDocMinDate
                    - attributePath: DocumentDate
                      operator: LessEqualThan
                      comparisonValuePath: $.key._detDocMaxDate
                # --- AB#5087 amount gate (deterministic pass) -------------------------------
                #     This pass needs no gate of its own: its candidate query filters
                #     GrossTotal EQUALS the signed payment, so payment == document gross by
                #     construction - the strictest band in this file - and the AB#4512 window
                #     plus the two-sided rival guard below already bound the date and the
                #     ambiguity. Nothing here can produce the AB#5087 prod case
                #     (334.63 against 694.12).
                # --- AB#5091: the card transaction date is a first-class matching key -------
                #     771 of 1755 matched transactions on prod-1/meshmakers carry a card
                #     purpose, and the date printed there ("K2 18.07.") is the date of the
                #     RECEIPT, while the booking date is one to three days later. So a
                #     candidate whose DocumentDate equals the transaction's CardTransactionDate
                #     beats every other candidate of this pass: when exactly ONE of the loaded
                #     candidates carries that day, the candidate set is REPLACED by it and the
                #     unchanged uniqueness branch below settles precisely that document. Every
                #     guard after this point (date window, rival guard, fee band) stays in
                #     force. Two candidates on the card day answer null on purpose - the pass
                #     then behaves exactly as before and the ambiguity is left to the AI pass.
                - type: ExecuteCSharp@1
                  description: Candidate document dated on the transaction's card transaction date (exact pass)
                  code: 'if (string.IsNullOrWhiteSpace(cardDate) || docs == null) return null; if (cardDate.Length < 10) return null; var day = cardDate.Substring(0, 10); string hit = null; var n = 0; foreach (var o in docs) { if (!(o is JsonElement)) continue; var e = (JsonElement)o; if (e.ValueKind != JsonValueKind.Object) continue; JsonElement idEl; if (!e.TryGetProperty("RtId", out idEl)) continue; JsonElement at; if (!e.TryGetProperty("Attributes", out at) || at.ValueKind != JsonValueKind.Object) continue; JsonElement dd; if (!at.TryGetProperty("DocumentDate", out dd) || dd.ValueKind != JsonValueKind.String) continue; var s = dd.GetString(); if (s == null || s.Length < 10 || s.Substring(0, 10) != day) continue; n = n + 1; hit = idEl.ValueKind == JsonValueKind.String ? idEl.GetString() : idEl.ToString(); } return n == 1 ? hit : null;'
                  usings:
                    - System
                    - System.Text.Json
                  returnType: String
                  arguments:
                    - name: cardDate
                      valuePath: $.key.Attributes.CardTransactionDate
                      dataType: String
                    - name: docs
                      valuePath: $._candidates.Items
                      dataType: RecordArray
                  targetPath: $.key._cardWinner
                - type: If@1
                  description: A candidate carries the card transaction date - it wins outright over the others
                  path: $.key._cardWinner
                  operator: RegexMatch
                  value: .+
                  valueType: String
                  transformations:
                    - type: Logger@1
                      message: "AB#5091 exact pass: candidate selected by the card transaction date"
                    - type: SetPrimitiveValue@1
                      description: GetRtEntitiesById@1 reads rtIdsPath as an ARRAY, so wrap the single id (AB#5348)
                      targetPath: $.key._cardWinnerIds
                      valuePath: $.key._cardWinner
                      valueType: String
                      targetValueKind: Array
                    - type: GetRtEntitiesById@1
                      description: Reduce the candidate set to the card-date winner
                      ckTypeId: Meshmakers.Accounting/AccountingDocument
                      rtIdsPath: $.key._cardWinnerIds
                      targetPath: $._candidates
                      targetValueKind: Simple
                      targetValueWriteMode: Overwrite
                - type: If@1
                  description: Exactly one in-window candidate — deterministic match
                  path: $._candidates.TotalCount
                  operator: Equals
                  value: 1
                  valueType: Int64
                  transformations:
                    # AB#4512: exact amount + unique open document is NOT enough.
                    # A monthly 9.99 subscription invoice was claimed by an
                    # unrelated 9.99 debit booked 103 days later (Tesla invoice,
                    # Apple transaction) — common subscription amounts collide
                    # across vendors, and card debits carry no CounterpartName to
                    # anchor on. Guard the exact pass like the AB#4433 fallback:
                    # (a) the booking date must lie in [document date - 1 day,
                    # document date + 14 days] (kept under ~28 days so monthly
                    # recurring invoices stay discriminable; later payments are
                    # left to the AI pass and its 90-day rule), and (b) the
                    # transaction must be the ONLY pending one with this amount
                    # and direction inside that window — otherwise the assignment
                    # is ambiguous (iteration order would decide the winner) and
                    # is left to the AI pass / manual review. The DocumentDate
                    # null-guard uses RegexMatch (null-safe); DateTime@1 would
                    # throw on a null date and poison every cycle.
                    - type: If@1
                      description: Candidate document carries a document date
                      path: $._candidates.Items[0].Attributes.DocumentDate
                      operator: RegexMatch
                      value: .+
                      valueType: String
                      transformations:
                        - type: DateTime@1
                          description: Date-window floor = document date - 1 day
                          operation: AddDays
                          path: $._candidates.Items[0].Attributes.DocumentDate
                          value: -1
                          targetPath: $.key._detMinDate
                        - type: DateTime@1
                          description: Date-window cap = document date + 14 days
                          operation: AddDays
                          path: $._candidates.Items[0].Attributes.DocumentDate
                          value: 14
                          targetPath: $.key._detMaxDate
                        - type: If@1
                          description: Transaction booked no earlier than one day before the document date
                          path: $.key.Attributes.BookingDate
                          operator: GreaterEqualsThan
                          valuePath: $.key._detMinDate
                          valueType: DateTime
                          transformations:
                            - type: If@1
                              description: …and no later than 14 days after the document date
                              path: $.key.Attributes.BookingDate
                              operator: LessEqualsThan
                              valuePath: $.key._detMaxDate
                              valueType: DateTime
                              transformations:
                                - type: GetRtEntitiesByType@1
                                  # AB#4542: the rival query is window-filtered in the
                                  # QUERY itself. Without the date filters, take:50
                                  # truncated the rival set — with 90+ pending
                                  # transactions of a popular amount (61.48 weekly
                                  # subscription) the transaction under test was often
                                  # not among the returned 50, the in-window sum came
                                  # out 0 instead of 1 and the match was wrongly
                                  # skipped. Window-filtering keeps the set tiny and
                                  # the count exact regardless of volume.
                                  description: Pending transactions with the same amount and direction booked inside the document's date window (rival candidates)
                                  ckTypeId: Basic.Accounting/BankTransaction
                                  targetPath: $.key._detRivals
                                  take: 50
                                  fieldFilters:
                                    - attributePath: MatchState
                                      operator: In
                                      comparisonValue:
                                        - 0
                                        - 2
                                    - attributePath: Amount
                                      operator: Equals
                                      comparisonValuePath: $.key.Attributes.Amount
                                    - attributePath: Direction
                                      operator: Equals
                                      comparisonValuePath: $.key.Attributes.Direction
                                    - attributePath: BookingDate
                                      operator: GreaterEqualThan
                                      comparisonValuePath: $.key._detMinDate
                                    - attributePath: BookingDate
                                      operator: LessEqualThan
                                      comparisonValuePath: $.key._detMaxDate
                                - type: ForEach@1
                                  description: Flag every rival booked inside the document's date window (the transaction itself counts once)
                                  iterationPath: $.key._detRivals.Items
                                  targetPath: $.key._detRivalChecks
                                  targetValueKind: Simple
                                  targetValueWriteMode: Overwrite
                                  maxDegreeOfParallelism: 1
                                  transformations:
                                    - type: SetPrimitiveValue@1
                                      description: Rival outside the window (default)
                                      targetPath: $.key._inWindow
                                      value: 0
                                      valueType: Int
                                    - type: If@1
                                      description: Rival booked no earlier than the window floor
                                      path: $.key.Attributes.BookingDate
                                      operator: GreaterEqualsThan
                                      valuePath: $.full.key._detMinDate
                                      valueType: DateTime
                                      transformations:
                                        - type: If@1
                                          description: …and no later than the window cap
                                          path: $.key.Attributes.BookingDate
                                          operator: LessEqualsThan
                                          valuePath: $.full.key._detMaxDate
                                          valueType: DateTime
                                          transformations:
                                            - type: SetPrimitiveValue@1
                                              targetPath: $.key._inWindow
                                              value: 1
                                              valueType: Int
                                - type: SumAggregation@1
                                  description: Count rivals inside the window
                                  targetPath: $.key._detRivalsInWindow
                                  aggregations:
                                    - path: $.key._detRivalChecks[*]
                                      aggregationPath: $._inWindow
                                      value: 1
                                      filterPath: null
                                      comparisonValue: null
                                - type: If@1
                                  description: The transaction is the only in-window rival — unambiguous, apply the match
                                  path: $.key._detRivalsInWindow
                                  operator: Equals
                                  value: 1
                                  valueType: Double
                                  transformations:
                                    - type: GetAssociationTargets@1
                                      description: Existing tx links on this document (idempotency guard, AB#4398)
                                      originRtIdPath: $._candidates.Items[0].RtId
                                      originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                      targetCkTypeId: Basic.Accounting/BankTransaction
                                      associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                      graphDirection: Outbound
                                      targetPath: $._detExisting
                                    - type: If@1
                                      description: Create the link only when the document is not already linked (a stale link still settles via the existing one)
                                      path: $._detExisting[0].TotalCount
                                      operator: Equals
                                      value: 0
                                      valueType: Int64
                                      transformations:
                                        - type: CreateAssociationUpdate@1
                                          description: Link document to transaction
                                          targetPath: $._detAssocs
                                          targetValueKind: Array
                                          targetValueWriteMode: Append
                                          updateKind: Create
                                          originRtIdPath: $._candidates.Items[0].RtId
                                          originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                          targetRtIdPath: $.key.RtId
                                          targetCkTypeId: Basic.Accounting/BankTransaction
                                          associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                    - type: CreateUpdateInfo@1
                                      description: Document is paid
                                      targetPath: $._detUpdates
                                      targetValueKind: Array
                                      targetValueWriteMode: Append
                                      updateKind: Update
                                      ckTypeId: Meshmakers.Accounting/AccountingDocument
                                      rtIdPath: $._candidates.Items[0].RtId
                                      attributeUpdates:
                                        - attributeName: DocumentState
                                          attributeValueType: Enum
                                          value: PAID
                                        - attributeName: PaidAmount
                                          attributeValueType: Double
                                          # The candidate query filters GrossTotal EQUALS this payment, so the two
                                          # are identical here — read it off the DOCUMENT all the same, so every
                                          # writer in this file states the same invariant: PaidAmount is the
                                          # document's own gross, never the transaction total (AB#5093).
                                          valuePath: $._candidates.Items[0].Attributes.GrossTotal
                                    - type: CreateUpdateInfo@1
                                      description: Transaction is matched
                                      targetPath: $._detUpdates
                                      targetValueKind: Array
                                      targetValueWriteMode: Append
                                      updateKind: Update
                                      ckTypeId: Basic.Accounting/BankTransaction
                                      rtIdPath: $.key.RtId
                                      attributeUpdates:
                                        - attributeName: MatchState
                                          attributeValueType: Enum
                                          value: Matched
                                    - type: ApplyChanges@2
                                      entityUpdatesPath: $._detUpdates
                                      associationUpdatesPath: $._detAssocs
                # --- Collective-payment subset pass (AB#5093) — ONE plain bank debit
                #     settles SEVERAL invoices of the same counterparty. Until now that
                #     was only recognised when the payment went through a PaymentOrder
                #     (AB#4888) or when the invoices came out of ONE multi-invoice upload
                #     (AB#4543): a normal transfer over the sum of two LinkedIn invoices
                #     (337.09 + 694.12 = 1031.21) equals no single GrossTotal, so the
                #     amount-anchored passes miss it and the transaction stays pending.
                #     Placement: AFTER the exact pass above (an exact single-document
                #     match must always win) and BEFORE the tolerance pass below — both
                #     are gated on $._candidates.TotalCount, so this pass runs exactly
                #     when the exact pass found nothing, and it raises that count on a
                #     hit to keep the tolerance pass from linking a SECOND document to
                #     the already-settled debit.
                #     Bounds, deliberately hard: at most 12 candidate documents (also the
                #     query's take) and only subsets of SIZE 2..4, evaluated in ONE
                #     ExecuteCSharp@1 over at most 4096 bit masks — the search can never
                #     grow with the backlog.
                #     Refusals — every one of them leaves the transaction PENDING for the
                #     later passes and manual review rather than reporting it settled:
                #     no counterpart name to anchor the group on; fewer than 2 or more
                #     than 12 candidates; MORE THAN ONE subset that sums to the payment
                #     (ambiguous — iteration order would pick the winner); a subset that
                #     exceeds the payment or falls short of it by more than this file's
                #     15 EUR fee cap (a partial cover is NOT a settlement); a candidate
                #     that already carries a PaidAmount (it is being settled by several
                #     transactions, so its gross is not what is outstanding).
                - type: If@1
                  description: Collective-payment pass (AB#5093) — no single open document carries the exact amount
                  path: $._candidates.TotalCount
                  operator: Equals
                  value: 0
                  valueType: Int64
                  transformations:
                    - type: If@1
                      description: The transaction names a counterparty to anchor the group on (null/empty guard)
                      path: $.key.Attributes.CounterpartName
                      operator: RegexMatch
                      value: .+
                      valueType: String
                      transformations:
                        # Default-then-overwrite: an empty result so the TotalCount
                        # gates below never read a missing path.
                        - type: WriteJson@1
                          description: No collective candidates yet
                          targetPath: $._csCands
                          jsonString: '{"Items":[],"TotalCount":0}'
                        - type: If@1
                          description: A debit pays INCOMING invoices — the vendor is the account holder
                          path: $._wantedDocType
                          operator: Equals
                          value: 0
                          valueType: Int
                          transformations:
                            - type: GetRtEntitiesByType@1
                              description: Open incoming docs of this account holder, each strictly below the payment, dated inside the pass's own window
                              ckTypeId: Meshmakers.Accounting/AccountingDocument
                              targetPath: $._csCands
                              take: 12
                              fieldFilters:
                                - attributePath: DocumentState
                                  operator: Equals
                                  comparisonValue: 0
                                - attributePath: DocumentType
                                  operator: Equals
                                  comparisonValue: 0
                                - attributePath: Vendor.AccountName
                                  operator: Equals
                                  comparisonValuePath: $.key.Attributes.CounterpartName
                                - attributePath: GrossTotal
                                  operator: LessThan
                                  comparisonValuePath: $.key._docAmount
                                - attributePath: DocumentDate
                                  operator: GreaterEqualThan
                                  comparisonValuePath: $.key._detDocMinDate
                                - attributePath: DocumentDate
                                  operator: LessEqualThan
                                  comparisonValuePath: $.key._detDocMaxDate
                        - type: If@1
                          description: A credit pays OUTGOING invoices — the customer is the account holder
                          path: $._wantedDocType
                          operator: Equals
                          value: 1
                          valueType: Int
                          transformations:
                            - type: GetRtEntitiesByType@1
                              description: Open outgoing docs of this account holder, each strictly below the payment, dated inside the pass's own window
                              ckTypeId: Meshmakers.Accounting/AccountingDocument
                              targetPath: $._csCands
                              take: 12
                              fieldFilters:
                                - attributePath: DocumentState
                                  operator: Equals
                                  comparisonValue: 0
                                - attributePath: DocumentType
                                  operator: Equals
                                  comparisonValue: 1
                                - attributePath: Customer.AccountName
                                  operator: Equals
                                  comparisonValuePath: $.key.Attributes.CounterpartName
                                - attributePath: GrossTotal
                                  operator: LessThan
                                  comparisonValuePath: $.key._docAmount
