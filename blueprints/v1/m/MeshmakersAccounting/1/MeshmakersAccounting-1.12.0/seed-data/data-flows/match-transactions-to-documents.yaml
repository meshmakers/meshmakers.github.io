                                      transformations:
                                        - type: SetPrimitiveValue@1
                                          description: Candidate is not part of the chosen subset (default)
                                          targetPath: $.key._csMember
                                          value: 0
                                          valueType: Int
                                        - type: If@1
                                          description: The chosen id list names this candidate (an rtId is a 24-character hex string, so plain containment is exact)
                                          path: $.full.key._csSubset
                                          operator: Contains
                                          valuePath: $.key.RtId
                                          valueType: String
                                          transformations:
                                            - type: SetPrimitiveValue@1
                                              targetPath: $.key._csMember
                                              value: 1
                                              valueType: Int
                                            - type: CreateUpdateInfo@1
                                              description: Document is paid with its OWN gross total — never the transaction total (AB#5093)
                                              targetPath: $.key._upd
                                              updateKind: Update
                                              ckTypeId: Meshmakers.Accounting/AccountingDocument
                                              rtIdPath: $.key.RtId
                                              attributeUpdates:
                                                - attributeName: DocumentState
                                                  attributeValueType: Enum
                                                  value: PAID
                                                - attributeName: PaidAmount
                                                  attributeValueType: Double
                                                  valuePath: $.key.Attributes.GrossTotal
                                            - type: GetAssociationTargets@1
                                              description: Existing tx links on this document (idempotency guard, AB#4398)
                                              originRtIdPath: $.key.RtId
                                              originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                              targetCkTypeId: Basic.Accounting/BankTransaction
                                              associationRoleId: Meshmakers.Accounting/TransactionToDocument
