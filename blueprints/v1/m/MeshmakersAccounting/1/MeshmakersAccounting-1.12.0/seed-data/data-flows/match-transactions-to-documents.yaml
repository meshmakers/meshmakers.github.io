                                              value: 0
                                              valueType: Int64
                                              transformations:
                                                - type: CreateAssociationUpdate@1
                                                  description: Link the document to the collective debit
                                                  targetPath: $.key._assoc
                                                  updateKind: Create
                                                  originRtIdPath: $.key.RtId
                                                  originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                                  targetRtIdPath: $.full.key.RtId
                                                  targetCkTypeId: Basic.Accounting/BankTransaction
                                                  associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                    - type: SumAggregation@1
                                      description: Documents of the chosen subset (2..4 by construction)
                                      targetPath: $.key._csMemberCount
                                      aggregations:
                                        - path: $.key._csChecks[*]
                                          aggregationPath: $._csMember
                                          value: 1
                                          filterPath: null
                                          comparisonValue: null
                                    - type: Flatten@1
                                      description: Collect the document updates
                                      path: $.key._csChecks[*]._upd
                                      targetPath: $.key._csUpdates
