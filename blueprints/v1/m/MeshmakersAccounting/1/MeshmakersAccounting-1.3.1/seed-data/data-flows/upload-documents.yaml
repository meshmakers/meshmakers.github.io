$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
  - Meshmakers.Accounting-[1.0,2.0)
  - System.Communication-[3.0,4.0)
  - System.Reporting-[2.0,3.0)
  - System.Identity-[2.12.0,3.0)
  - System.UI-[2.2,3.0)
entities:
  - rtId: 67d4a2f0b2e4d8c3a1f000f0
    ckTypeId: System.Communication/DataFlow
    attributes:
      - id: System/Name
        value: Upload Documents
      - id: System/Description
        value: Processes multiple uploaded PDF documents via AI extraction and creates AccountingDocument entities
  - rtId: 67d4a2f0b2e4d8c3a1f000f1
    ckTypeId: System.Communication/Pipeline
    associations:
      - roleId: System/ParentChild
        targetRtId: 67d4a2f0b2e4d8c3a1f000f0
        targetCkTypeId: System.Communication/DataFlow
      - roleId: System.Communication/Executes
        targetRtId: "670000000000000000000002"
        targetCkTypeId: System.Communication/Adapter
    attributes:
      - id: System.Communication/DeploymentState
        value: 0
      - id: System/Name
        value: Upload Documents Pipeline
      - id: System/Enabled
        value: true
      - id: System.Communication/PipelineDefinition
        value: >-
          triggers:
            - type: FromHttpRequest@2
              path: /uploadDocuments
              method: POST
              allowAnonymous: false
              # AccountingShareholder is deliberately NOT listed: that role sees the
              # finance cockpit only and has no inbox, so it must not be able to push
              # documents into the analysis pipeline. Without requiredRoles ANY
              # authenticated tenant user - shareholders included - could upload.
              requiredRoles:
                - AccountingManagement
                - AccountingEmployee
          transformations:
            # Resolve the display identity of the verified caller ONCE for the
            # whole request: prefer the email claim, fall back to name/
            # preferred_username (cross-tenant shadow users may carry no email).
            # Absent both, $.uploader stays unset and SourceSender is skipped.
            - type: SetPrimitiveValue@1
              description: Uploader fallback from the principal name claim
              targetPath: $.uploader
              valuePath: $.principal.name
              valueType: String
            - type: If@1
              description: Prefer the principal email claim when present
              path: $.principal.email
              operator: NotEquals
              valueType: String
              transformations:
                - type: SetPrimitiveValue@1
                  targetPath: $.uploader
                  valuePath: $.principal.email
                  valueType: String
            - type: ForEach@1
              description: Stage each uploaded file for asynchronous analysis
              iterationPath: $.files
              targetPath: $.results
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              # AB#5347: was 2. The loop body keeps ALL of its working state at ROOT paths -
              # $.fileHash, $.isDuplicate, $.fileSystemItem, $.updates, $.isDuplicateKey - not
              # under $.key, so two iterations in flight overwrite each other's. That was
              # survivable while the outcome was only a redundant duplicate check; it is not
              # once the duplicate-key branch below DELETES the file at $.fileSystemItem.RtId,
              # because the loser of the race would delete the other iteration's file. One at a
              # time is the cheap, local fix; moving the state under $.key would be the other.
              # Raising this again REQUIRES doing that first.
              maxDegreeOfParallelism: 1
              transformations:
                - type: If@1
                  # Accept PDFs AND images (jpg/png) — the shared Document Analysis
                  # pipeline runs OCR on both (same as the Signal channel). A missing
                  # content type is the only thing rejected here; the frontend file
                  # picker already restricts selection to pdf/jpg/png. NotEquals with
                  # no value = "content type is present" (null-check).
                  description: Only process files that carry a content type (PDF or image)
                  path: $.key.contentType
                  operator: NotEquals
                  valueType: String
                  transformations:
                    - type: If@1
                      description: Reject files above the 10 MB analysis limit with a speaking error
                      path: $.key.length
                      operator: GreaterThan
                      value: 10000000
                      valueType: Int64
                      transformations:
                        - type: SetPrimitiveValue@1
                          targetPath: $.key._resultType
                          value: "error"
                          valueType: String
                        - type: SetPrimitiveValue@1
                          targetPath: $.key._errorMessage
                          value: "File too large (max 10 MB). Please reduce the file size."
                          valueType: String
                    - type: If@1
                      description: Within the size limit - stage the upload
                      path: $.key.length
                      operator: LessEqualsThan
                      value: 10000000
                      valueType: Int64
                      transformations:
                        - type: ComputeFileHash@1
                          description: Compute SHA-256 hash of uploaded file
                          path: $.key.data
                          targetPath: $.fileHash
                        - type: CheckDuplicate@1
                          description: Check if this document was already uploaded
                          ckTypeId: Meshmakers.Accounting/UploadedDocument
                          attributeName: FileHash
                          valuePath: $.fileHash
                          targetPath: $.isDuplicate
                          existingEntityPath: $.existingUpload
                        - type: If@1
                          description: Document already uploaded - skip
                          path: $.isDuplicate
                          operator: Equals
                          value: true
                          valueType: Boolean
                          transformations:
                            - type: SetPrimitiveValue@1
                              targetPath: $.key._resultType
                              value: "duplicate"
                              valueType: String
                        - type: If@1
                          description: New document - store the file and stage it
                          path: $.isDuplicate
                          operator: NotEquals
                          value: true
                          valueType: Boolean
                          transformations:
                            - type: DateTime@1
                              description: Upload timestamp
                              operation: Now
                              targetPath: $.uploadedAt
                            - type: SetPrimitiveValue@1
                              description: Default staging state - the analysis pipeline picks up NEW uploads
                              targetPath: $.stageState
                              value: "NEW"
                              valueType: String
                            - type: SetPrimitiveValue@1
                              targetPath: $.stageNote
                              value: ""
                              valueType: String
                            - type: If@1
                              description: Privacy skip requested (AB#4540) - stage as INCOMPLETE so the analysis pipeline (pickup <= PROCESSING) never touches the content; the user enters the details manually from the inbox
                              path: $.full.formData.skipAnalysis
                              operator: Equals
                              value: "true"
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.stageState
                                  value: "INCOMPLETE"
                                  valueType: String
                                - type: SetPrimitiveValue@1
                                  targetPath: $.stageNote
                                  value: "AI analysis skipped on upload - enter the document details manually."
                                  valueType: String
                            # Image receipts (JPG/PNG) -> wrap into a single-page PDF so
                            # the stored Beleg is ALWAYS a PDF: the document/inbox preview
                            # renders it and the BMD handover can merge it (MergePdf@1
                            # needs PDF originals). OCR is unaffected (PdfOcrExtraction
                            # reads the image inside the PDF). The dedup hash above was
                            # taken on the ORIGINAL bytes, so conversion never changes
                            # duplicate detection. PDFs pass through untouched.
                            - type: If@1
                              description: Convert image uploads to PDF (PDFs pass through)
                              path: $.key.contentType
                              operator: NotEquals
                              value: "application/pdf"
                              valueType: String
                              transformations:
                                - type: FormatString@1
                                  description: Wrap the image as a full-width data-URI in minimal HTML
                                  format: '<!DOCTYPE html><html><body style="margin:0;padding:0"><img src="data:{$.key.contentType};base64,{$.key.data}" style="display:block;width:100%;height:auto"></body></html>'
                                  targetPath: $.imageHtml
                                - type: RenderHtmlPdf@1
                                  description: Render the image HTML to a single-page PDF
                                  path: $.imageHtml
                                  targetPath: $.imagePdf
                                  contentLengthTargetPath: $.imagePdfLen
                                - type: SetPrimitiveValue@1
                                  description: Replace the stored bytes with the rendered PDF
                                  targetPath: $.key.data
                                  valuePath: $.imagePdf
                                  valueType: String
                                - type: SetPrimitiveValue@1
                                  targetPath: $.key.contentType
                                  value: "application/pdf"
                                  valueType: String
                                - type: SetPrimitiveValue@1
                                  targetPath: $.key.length
                                  valuePath: $.imagePdfLen
                                  valueType: Int64
                            - type: CreateFileSystemUpdate@1
                              description: Store the uploaded file (always a PDF after image conversion)
                              targetPath: $.fileSystemItem
                              path: $.key.data
                              generateRtId: true
                              fileNamePath: $.key.fileName
                              contentTypePath: $.key.contentType
                              contentLengthPath: $.key.length
                              rootFolderWellKnownName: "Documents"
                            - type: CreateUpdateInfo@1
                              description: Stage the upload for the analysis pipeline
                              targetPath: $.updates._items
                              targetValueKind: Array
                              targetValueWriteMode: Overwrite
                              updateKind: Insert
                              ckTypeId: Meshmakers.Accounting/UploadedDocument
                              rtIdPath: $.uploadRtId
                              generateRtId: true
                              attributeUpdates:
                                - attributeName: OriginalFileName
                                  attributeValueType: String
                                  valuePath: $.key.fileName
                                - attributeName: FileRtId
                                  attributeValueType: String
                                  valuePath: $.fileSystemItem.RtId
                                - attributeName: FileHash
                                  attributeValueType: String
                                  valuePath: $.fileHash
                                - attributeName: UploadedAt
                                  attributeValueType: DateTime
                                  valuePath: $.uploadedAt
                                - attributeName: ProcessingState
                                  attributeValueType: Enum
                                  valuePath: $.stageState
                                - attributeName: ProcessingError
                                  attributeValueType: String
                                  valuePath: $.stageNote
                                - attributeName: SourceChannel
                                  attributeValueType: Enum
                                  value: UPLOAD
                                - attributeName: SourceSender
                                  attributeValueType: String
                                  # AB#4975: the verified caller from the authenticated trigger —
                                  # the client-supplied formData.uploadedBy is no longer trusted
                                  # (still sent by older frontends, deliberately ignored).
                                  # $.uploader = principal email, falling back to name/
                                  # preferred_username (resolved once at the pipeline top).
                                  valuePath: $.full.uploader
                                - attributeName: OwnerUserId
                                  attributeValueType: String
                                  # AB#5007: the verified caller's subject is the authoritative
                                  # owner for manual uploads (future OwnedOnly owner attribute,
                                  # AB#5009). Channel imports resolve theirs in the Document
                                  # Analysis pipeline via Contact/identity matching instead.
                                  valuePath: $.full.principal.subjectId
                                - attributeName: SourceReceivedAt
                                  attributeValueType: DateTime
                                  valuePath: $.uploadedAt
                            - type: CreateAssociationUpdate@1
                              description: Link the staged upload to the stored file
                              targetPath: $.updates._assocItems
                              targetValueKind: Array
                              targetValueWriteMode: Overwrite
                              updateKind: Create
                              originRtIdPath: $.updates._items[0].RtEntity.RtId
                              originCkTypeIdPath: $.updates._items[0].RtEntity.CkTypeId
                              targetRtIdPath: $.fileSystemItem.RtId
                              targetCkTypeIdPath: $.fileSystemItem.CkTypeId
                              associationRoleId: System/Related
                            # AB#5347: the unique index on UploadedDocument/FileHash is the real duplicate
                            # guard. CheckDuplicate@1 above reads in its own transaction and this node writes
                            # in another, and this loop runs two files at a time (and a second browser tab
                            # runs its own execution), so in a race both pass the check. Report instead of
                            # Throw: losing the race means the file IS on file, which is a result the caller
                            # can be told, not a 500.
                            - type: ApplyChanges@2
                              description: Insert the staged upload; the unique index on FileHash arbitrates the race (AB#5347)
                              entityUpdatesPath: $.updates._items
                              associationUpdatesPath: $.updates._assocItems
                              onDuplicateKey: Report
                              duplicateKeyTargetPath: $.isDuplicateKey
                            - type: If@1
                              description: Lost the race - the unique index refused the insert (AB#5347)
                              path: $.isDuplicateKey
                              operator: Equals
                              value: true
                              valueType: Boolean
                              transformations:
                                # CreateFileSystemUpdate@1 above commits its OWN transaction, so the stored
                                # file survives the rollback of the refused insert with nothing referencing it.
                                # Deleted here rather than storing the file after the entity: FileRtId is a
                                # required attribute, so the other order needs a placeholder id and a second
                                # write, and it would leave an inbox entry whose file is not there yet for the
                                # analysis pipeline to pick up and fail on. Same idiom as edit-document.yaml.
                                - type: CreateUpdateInfo@1
                                  description: Delete the file stored before the refused insert (AB#5347)
                                  targetPath: $.orphanFileDeletes._items
                                  targetValueKind: Array
                                  targetValueWriteMode: Overwrite
                                  updateKind: Delete
                                  ckTypeId: System.Reporting/FileSystemItem
                                  rtIdPath: $.fileSystemItem.RtId
                                - type: ApplyChanges@2
                                  description: Commit the orphan file deletion
                                  entityUpdatesPath: $.orphanFileDeletes._items
                                # Same answer the fast path gives when CheckDuplicate@1 caught it.
                                - type: SetPrimitiveValue@1
                                  targetPath: $.key._resultType
                                  value: "duplicate"
                                  valueType: String
                            - type: If@1
                              description: The insert went through - report the stored upload (AB#5347)
                              path: $.isDuplicateKey
                              operator: NotEquals
                              value: true
                              valueType: Boolean
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.key._resultType
                                  value: "uploaded"
                                  valueType: String
                                - type: If@1
                                  description: Report the privacy-skip staging distinctly (AB#4540)
                                  path: $.full.formData.skipAnalysis
                                  operator: Equals
                                  value: "true"
                                  valueType: String
                                  transformations:
                                    - type: SetPrimitiveValue@1
                                      targetPath: $.key._resultType
                                      value: "stored"
                                      valueType: String
                - type: Project@1
                  description: Remove base64 data from response
                  path: $.key
                  fields:
                    - path: data
                    - path: encoding
            - type: Project@1
              clear: true
              fields:
                - path: $.results
                  inclusion: true
      - id: System.Communication/StatusMessage
