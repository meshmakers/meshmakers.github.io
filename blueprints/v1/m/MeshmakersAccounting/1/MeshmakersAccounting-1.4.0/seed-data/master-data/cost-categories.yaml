  # AB#4584: VAT (Umsatzsteuer) settlement to the tax office. Kept as its own
  # line so it does not inflate Personnel — mixed Finanzamt payments (wage
  # levies + VAT) are split (AB#4545) and the VAT part lands here.
  - rtId: aa00000000000000000000c0
    ckTypeId: Meshmakers.Accounting/CostCategory
    associations:
      - roleId: System/ParentChild
        targetRtId: aa0000000000000000000100
        targetCkTypeId: Meshmakers.Accounting/FiscalYear
    attributes:
      - id: Meshmakers.Accounting/Name
        value: Umsatzsteuer
      - id: Meshmakers.Accounting/CategoryType
        value: VAT
      - id: Meshmakers.Accounting/CategoryKind
        value: EXPENSE
      - id: Meshmakers.Accounting/CategoryDescription
        value: Value-added tax (Umsatzsteuer) settlement paid to the tax office
  # AB#4585: general taxes & levies other than VAT (corporate income tax,
  # chamber levy, penalties). No auto-rule — no reliable purpose pattern, so
  # these are assigned manually (few per year).
  - rtId: aa00000000000000000000c1
    ckTypeId: Meshmakers.Accounting/CostCategory
    associations:
      - roleId: System/ParentChild
        targetRtId: aa0000000000000000000100
        targetCkTypeId: Meshmakers.Accounting/FiscalYear
    attributes:
      - id: Meshmakers.Accounting/Name
        value: Steuern & Abgaben
      - id: Meshmakers.Accounting/CategoryType
        value: TAXES
      - id: Meshmakers.Accounting/CategoryKind
        value: EXPENSE
      - id: Meshmakers.Accounting/CategoryDescription
        value: "Taxes and levies other than VAT: corporate income tax (Körperschaftsteuer), chamber levy (Kammerumlage), penalties"
