                - System.Collections.Generic
              returnType: String
              arguments:
                - name: tx
                  valuePath: $.payTx.Items
                  dataType: RecordArray
                - name: links
                  valuePath: $.payLinkLines
                  dataType: StringArray
                - name: pFrom
                  valuePath: $.txFrom
                  dataType: String
                - name: pTo
                  valuePath: $.txTo
                  dataType: String
              targetPath: $.zahlungenB64
            - type: If@1
              description: Append the payment index only when there is at least one row
              path: $.zahlungenB64
              operator: NotEquals
              valueType: String
              transformations:
                - type: FormatString@1
                  description: Verbatim zip entry for the payment index (base64 is JSON-safe)
                  format: '{"fileName":"zahlungen.csv","contentBase64":"{$.zahlungenB64}","verbatim":true}'
                  targetPath: $.zahlungenEntryJson
                - type: WriteJson@1
                  description: Append the entry to the zip entries
                  jsonStringPath: $.zahlungenEntryJson
                  targetPath: $.zipEntries
                  targetValueKind: Array
                  targetValueWriteMode: Append
            - type: FormatString@1
              description: ZIP file name
              nullValue: handover
              format: 'handover-{$.query.fiscalYearId}.zip'
              targetPath: $.zip.fileName
            # Stream each entry's merged PDF from the scratch space into the ZIP (also on the
            # scratch space) and persist it directly as a FileSystemItem — no whole-ZIP byte[]
            # or base64 on the heap, and no separate CreateFileSystemUpdate round-trip (AB#4642).
            - type: CreateZipArchive@1
              description: Stream merged PDFs into the handover ZIP and persist it as a FileSystemItem
              path: $.zipEntries
              persistAsFileSystemItem: true
              rootFolderWellKnownName: Documents
              fileNamePath: $.zip.fileName
              contentType: application/zip
              generateRtId: true
              # Unique file names ({date}_{party}_{NNN}.pdf) + belege.csv index in the
              # ZIP root listing every document's parsed data and its final path.
              appendSequenceNumber: true
              manifestFileName: belege.csv
              manifestFileNameColumn: Dateiname
              targetPath: $.zip.itemRtId

            # -- 4) Return { fileSystemItem: <rtId> } -----------------------------------
            # The HTTP response body is the final data context. Put the id at the root so
            # the body is a flat { "fileSystemItem": "<rtId>" } (the frontend reads
            # response.fileSystemItem directly).
            - type: SetPrimitiveValue@1
              description: Response id at root
              targetPath: $.fileSystemItem
              valuePath: $.zip.itemRtId
              valueType: String
            - type: SetPipelineExecutionResult@1
              path: $.fileSystemItem
            # Project the context down to just the id so the HTTP body is clean.
            - type: Project@1
              clear: true
              fields:
                - path: $.fileSystemItem
                  inclusion: true
