            # context holds the transactions plus a few hundred short strings.
            - type: ExecuteCSharp@1
              description: Build zahlungen.csv (classification + document columns) as base64
              code: 'Func<object,string> S = o => { if (o == null) return ""; if (o is JsonElement e) { if (e.ValueKind == JsonValueKind.String) return e.GetString() ?? ""; if (e.ValueKind == JsonValueKind.Null || e.ValueKind == JsonValueKind.Undefined) return ""; return e.ToString(); } return o.ToString() ?? ""; }; Func<string,string> D10 = v => (v ?? "").Length >= 10 ? v.Substring(0, 10) : (v ?? ""); Func<string,string> W = v => Regex.Replace(v ?? "", @"\s+", " ").Trim(); var map = new Dictionary<string, List<string[]>>(StringComparer.Ordinal); object linksObj = links; var lst = new List<string>(); if (linksObj is JsonElement lj && lj.ValueKind == JsonValueKind.Array) { foreach (var el in lj.EnumerateArray()) { if (el.ValueKind == JsonValueKind.String) { var s0 = el.GetString(); if (!string.IsNullOrWhiteSpace(s0)) lst.Add(s0); } } } else if (linksObj is System.Collections.IEnumerable lseq) { foreach (var o in lseq) { var s0 = o == null ? null : (o is JsonElement je2 ? (je2.ValueKind == JsonValueKind.String ? je2.GetString() : je2.ToString()) : o.ToString()); if (!string.IsNullOrWhiteSpace(s0)) lst.Add(s0); } } foreach (var s1 in lst) { try { var a = JsonSerializer.Deserialize<string[]>(s1); if (a == null || a.Length < 5) continue; var head = new string[] { a[0], a[1], a[2], a[3] }; for (var i = 4; i < a.Length; i++) { var k = a[i]; if (string.IsNullOrWhiteSpace(k)) continue; List<string[]> l; if (!map.TryGetValue(k, out l)) { l = new List<string[]>(); map[k] = l; } l.Add(head); } } catch { } } object fromObj = pFrom; object toObj = pTo; var dFrom = D10(fromObj as string ?? ""); var dTo = D10(toObj as string ?? ""); var rows = new List<string[]>(); object txObj = tx; var txEls = new List<JsonElement>(); if (txObj is JsonElement te && te.ValueKind == JsonValueKind.Array) { foreach (var el in te.EnumerateArray()) txEls.Add(el); } else if (txObj is System.Collections.IEnumerable tseq) { foreach (var o in tseq) { if (o is JsonElement oe) txEls.Add(oe); else if (o != null) { try { txEls.Add(JsonSerializer.Deserialize<JsonElement>(JsonSerializer.Serialize(o))); } catch { } } } } { foreach (var t in txEls) { if (t.ValueKind != JsonValueKind.Object) continue; JsonElement pid; var rtid = t.TryGetProperty("RtId", out pid) ? S(pid) : ""; JsonElement at; if (!t.TryGetProperty("Attributes", out at) || at.ValueKind != JsonValueKind.Object) continue; Func<string,string> A = n => { JsonElement v; return at.TryGetProperty(n, out v) ? S(v) : ""; }; var bd = D10(A("BookingDate")); if (dFrom.Length > 0 && string.CompareOrdinal(bd, dFrom) < 0) continue; if (dTo.Length > 0 && string.CompareOrdinal(bd, dTo) > 0) continue; double amount = 0; JsonElement pa; if (at.TryGetProperty("Amount", out pa) && pa.ValueKind == JsonValueKind.Number) amount = pa.GetDouble(); int ms = 0; JsonElement pm; if (at.TryGetProperty("MatchState", out pm) && pm.ValueKind == JsonValueKind.Number) ms = pm.GetInt32(); JsonElement pc; var incl = at.TryGetProperty("InClarification", out pc) && pc.ValueKind == JsonValueKind.True; var pur = W(A("Purpose")); var up = pur.ToUpperInvariant(); string art; if (up.Contains("E-COMM")) art = "Kartenzahlung online"; else if (Regex.IsMatch(up, @"\bPOS\b")) art = "Kartenzahlung POS"; else if (up.Contains("PAYPAL")) art = "PayPal"; else if (up.Contains("SEPA-LASTSCHRIFT") || up.StartsWith("EINZUG")) art = "SEPA-Lastschrift"; else if (up.StartsWith("GEHALT") || up.Contains("LOHN")) art = "Gehalt/Lohn"; else art = "Ueberweisung"; var mk = Regex.Match(pur, @"\bK(\d)\b"); var karte = mk.Success ? "K" + mk.Groups[1].Value : ""; var md = Regex.Match(pur, @"\bK\d\s+(\d{2}\.\d{2}\.)"); if (!md.Success) md = Regex.Match(pur, @"(\d{2}\.\d{2}\.\d{2})\s+\d{2}:\d{2}\s+K\d"); var kartendatum = md.Success ? md.Groups[1].Value : ""; var status = ms == 1 ? "Zugeordnet" : ms == 2 ? "Ohne Beleg" : ms == 3 ? "Ignoriert" : "Offen"; List<string[]> docs; if (!map.TryGetValue(rtid, out docs)) docs = new List<string[]>(); var nums = docs.Select(x => x[1]).Where(x =>