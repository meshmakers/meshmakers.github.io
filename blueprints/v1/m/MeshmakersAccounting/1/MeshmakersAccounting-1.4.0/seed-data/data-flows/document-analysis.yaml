$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
  - Meshmakers.Accounting-[2.2.0,3.0)
  - System.Communication-[3.0,4.0)
  - System.Reporting-[2.0,3.0)
  - System.Identity-[2.12.0,3.0)
  - System.UI-[2.2,3.0)
entities:
  # --- Pipelines: document analysis (asynchronous OCR + AI extraction) ---
  # Picks up staged uploads (ProcessingState NEW) every 5 minutes, or on demand
  # via POST /processDocuments (the app's "Analyze now" button). Each document
  # is marked PROCESSING first so a run that outlasts the polling interval is
  # not picked up twice; the result is COMPLETED (one AccountingDocument created
  # and linked per invoice found in the PDF — a single file may contain several
  # independent invoices, AB#4543) or INCOMPLETE (manual follow-up in the inbox,
  # replaces the former Todo mechanism).
  - rtId: aa0000000000000000000300
    ckTypeId: System.Communication/DataFlow
    attributes:
      - id: System/Name
        value: Document Analysis
      - id: System/Description
        value: Analyzes staged uploads asynchronously via OCR + AI extraction and creates accounting documents
  - rtId: aa0000000000000000000301
    ckTypeId: System.Communication/Pipeline
    associations:
      - roleId: System/ParentChild
        targetRtId: aa0000000000000000000300
        targetCkTypeId: System.Communication/DataFlow
      - roleId: System.Communication/Executes
        targetRtId: "670000000000000000000002"
        targetCkTypeId: System.Communication/Adapter
      # AI configuration lookup requires BOTH the apiKeyConfigurationName on the
      # node AND this Uses association (the adapter resolves the config through
      # the association, the name is validated against it).
      - roleId: System.Communication/Uses
        targetRtId: 67f0c00ec4ff02221e0b7003
        targetCkTypeId: System.Communication/AiConfiguration
    attributes:
      - id: System.Communication/DeploymentState
        value: 0
      - id: System/Name
        value: Document Analysis Pipeline
      - id: System/Enabled
        value: true
      - id: System.Communication/PipelineDefinition
        value: >-
          triggers:
            # Cron PipelineTrigger (aa...304) instead of FromPolling: the adapter
            # runs OnDemand (scale-to-zero, AB#4984) and an in-process poller would
            # silently stop while the workload is hibernated. The trigger event is
            # wake-capable (durable queue + lifecycle co-wake, AB#4918).
            - type: FromPipelineTriggerEvent@1
            - type: FromHttpRequest@2
              path: /processDocuments
              method: POST
              allowAnonymous: false
              requiredRoles:
                - AccountingManagement
                - AccountingEmployee
          transformations:
            - type: GetRtEntitiesByType@1
              description: Fetch uploads waiting for analysis (and reclaim orphans)
              ckTypeId: Meshmakers.Accounting/UploadedDocument
              # Smaller batch caps peak memory + run duration so an adapter OOM
              # restart orphans fewer in-flight uploads (the real memory fix is
              # requests/limits on the adapter container — infra, octo-helm-core).
              take: 5
              fieldFilters:
                # Self-healing: pick up NEW(0) AND reclaim uploads orphaned in
                # PROCESSING(1) by a crash/OOM restart (or, pre-fix, a poison
                # FatalError). The mark-as-PROCESSING commit outlives the dead run,
                # and the old Equals-0 filter never retried them, so they sat
                # forever "in progress" in the Inbox. Runs of this polling pipeline
                # do not overlap (duration < 5-min interval), so at run start a
                # PROCESSING upload is genuinely orphaned; the only concurrent path
                # is the manual "Analyze now" trigger, and AB#4452 duplicate
                # detection neutralizes any resulting double-create.
                - attributePath: ProcessingState
                  operator: LessEqualThan
                  comparisonValue: 1
              targetPath: $.pending
            - type: ForEach@1
              description: Analyze each staged upload
              iterationPath: $.pending.Items
              targetPath: $.processed
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              # A single poisoned upload (e.g. dangling FileRtId) must not starve the
              # rest of the queue: isolate iteration failures, keep processing the
              # remaining documents, and fail the run with an aggregated error at the
              # end so the failure stays visible.
              continueOnError: true
              transformations:
                - type: CreateUpdateInfo@1
                  description: Mark as processing (guards against double pickup)
                  targetPath: $.marks
                  targetValueKind: Array
                  targetValueWriteMode: Overwrite
                  updateKind: Update
                  ckTypeId: Meshmakers.Accounting/UploadedDocument
                  rtIdPath: $.key.RtId
                  attributeUpdates:
                    - attributeName: ProcessingState
                      attributeValueType: Enum
                      value: PROCESSING
                - type: ApplyChanges@2
                  entityUpdatesPath: $.marks
                # --- Submitter attribution (AB#5007) --------------------------
                # Resolve who brought this document in. Runs idempotently on
                # every pickup and persists BEFORE the OCR/AI stage, so even a
                # failing analysis keeps its attribution. Precedence is built by
                # OVERWRITING: identity-user-by-email first, then contact-by-
                # phone, contact-by-email, and finally the linked contact of an
                # already-verified owner (manual uploads). A matching contact
                # WITHOUT LinkedUserId deliberately clears the owner: an
                # external submitter (freelancer without platform account) must
                # not inherit an identity match.
                - type: If@1
                  description: Sender-based lookups need a sender
                  path: $.key.Attributes.SourceSender
                  operator: NotEquals
                  valueType: String
                  transformations:
                    - type: TransformString@1
                      description: Normalize the sender the way identity does (upper-case invariant)
                      sourcePath: $.key.Attributes.SourceSender
                      targetPath: $.key._senderUpper
                      operation: ToUpper
                    - type: GetRtEntitiesByType@1
                      description: Identity user by normalized email (cross-tenant shadow users carry a valid email)
                      ckTypeId: System.Identity/User
                      take: 1
                      fieldFilters:
                        - attributePath: NormalizedEmail
                          operator: Equals
                          comparisonValuePath: $.key._senderUpper
                      targetPath: $.key._userMatch
                    - type: If@1
                      path: $.key._userMatch.TotalCount
                      operator: GreaterThan
                      value: 0
                      valueType: Int
                      transformations:
                        - type: SetPrimitiveValue@1
                          targetPath: $.key._res.owner
                          valuePath: $.key._userMatch.Items[0].RtId
                          valueType: String
                        - type: SetPrimitiveValue@1
                          targetPath: $.key._res.display
                          valuePath: $.key._userMatch.Items[0].Attributes.UserName
                          valueType: String
                    - type: GetRtEntitiesByType@1
                      description: Contact by phone (Signal sender numbers; an e-mail sender never matches)
                      ckTypeId: Meshmakers.Accounting/Contact
                      take: 1
                      fieldFilters:
                        - attributePath: Phone
                          operator: Equals
                          comparisonValuePath: $.key.Attributes.SourceSender
                      targetPath: $.key._contactByPhone
                    - type: If@1
                      path: $.key._contactByPhone.TotalCount
                      operator: GreaterThan
                      value: 0
                      valueType: Int
                      transformations:
                        - type: SetPrimitiveValue@1
                          targetPath: $.key._res.contact
                          valuePath: $.key._contactByPhone.Items[0].RtId
                          valueType: String
                        - type: SetPrimitiveValue@1
                          targetPath: $.key._res.display
                          valuePath: $.key._contactByPhone.Items[0].Attributes.DisplayName
                          valueType: String
                        - type: SetPrimitiveValue@1
                          targetPath: $.key._res.owner
                          valuePath: $.key._contactByPhone.Items[0].Attributes.LinkedUserId
                          valueType: String
                    - type: GetRtEntitiesByType@1
                      description: Contact by normalized email (the designed matching key, AB#4887)
                      ckTypeId: Meshmakers.Accounting/Contact
                      take: 1
                      fieldFilters:
                        - attributePath: NormalizedEmail
                          operator: Equals
                          comparisonValuePath: $.key._senderUpper
                      targetPath: $.key._contactByEmail
                    - type: If@1
                      path: $.key._contactByEmail.TotalCount
                      operator: GreaterThan
                      value: 0
                      valueType: Int
                      transformations:
                        - type: SetPrimitiveValue@1
                          targetPath: $.key._res.contact
                          valuePath: $.key._contactByEmail.Items[0].RtId
                          valueType: String
                        - type: SetPrimitiveValue@1
                          targetPath: $.key._res.display
                          valuePath: $.key._contactByEmail.Items[0].Attributes.DisplayName
                          valueType: String
                        - type: SetPrimitiveValue@1
                          targetPath: $.key._res.owner
                          valuePath: $.key._contactByEmail.Items[0].Attributes.LinkedUserId
                          valueType: String
                - type: If@1
                  description: Manual uploads carry the verified owner - keep it authoritative, resolve their contact for display
                  path: $.key.Attributes.OwnerUserId
                  operator: NotEquals
                  valueType: String
                  transformations:
                    - type: SetPrimitiveValue@1
                      targetPath: $.key._res.owner
                      valuePath: $.key.Attributes.OwnerUserId
                      valueType: String
                    - type: GetRtEntitiesByType@1
                      description: Linked contact of the verified owner
                      ckTypeId: Meshmakers.Accounting/Contact
                      take: 1
                      fieldFilters:
                        - attributePath: LinkedUserId
                          operator: Equals
                          comparisonValuePath: $.key.Attributes.OwnerUserId
                      targetPath: $.key._contactByUser
                    - type: If@1
                      path: $.key._contactByUser.TotalCount
                      operator: GreaterThan
                      value: 0
                      valueType: Int
                      transformations:
                        - type: SetPrimitiveValue@1
                          targetPath: $.key._res.contact
                          valuePath: $.key._contactByUser.Items[0].RtId
                          valueType: String
                        - type: SetPrimitiveValue@1
                          targetPath: $.key._res.display
                          valuePath: $.key._contactByUser.Items[0].Attributes.DisplayName
                          valueType: String
                - type: CreateUpdateInfo@1
                  description: Persist the resolved submitter (absent fields skip)
                  targetPath: $.key._resUpdate
                  targetValueKind: Array
                  targetValueWriteMode: Overwrite
                  updateKind: Update
                  ckTypeId: Meshmakers.Accounting/UploadedDocument
                  rtIdPath: $.key.RtId
                  attributeUpdates:
                    - attributeName: OwnerUserId
                      attributeValueType: String
                      valuePath: $.key._res.owner
                    - attributeName: SubmitterContactId
                      attributeValueType: String
                      valuePath: $.key._res.contact
                    - attributeName: SubmitterDisplayName
                      attributeValueType: String
                      valuePath: $.key._res.display
                - type: ApplyChanges@2
                  entityUpdatesPath: $.key._resUpdate
                # --- End submitter attribution --------------------------------
                - type: GetFileSystemContent@1
                  description: Load the stored PDF
                  rtIdPath: $.key.Attributes.FileRtId
                  targetPath: $.pdf.data
                - type: PdfOcrExtraction@1
                  description: Extract text from PDF
                  path: $.pdf.data
                  targetPath: $.ocr.result
                  language: de
                  maxFileSizeBytes: 10000000
                  continueOnError: true
                # Load OUR OWN company master data so the AI can tell apart an
                # incoming (someone bills us) from an outgoing (we bill a client)
                # invoice by matching a party against it. CompanyProfile is a
                # user-created singleton (well-known name 'CompanyProfile'); it is
                # NOT seeded, so this is a plain type query that returns an empty
                # result set when the tenant has not filled in Settings → General —
                # the AI then falls back to INCOMING. (GetPipelineConfigByWellKnownName
                # is unusable here: it throws when absent and needs a Uses association
                # to a fixed rtId, but the profile's rtId is generated at runtime.)
                - type: GetRtEntitiesByType@1
                  description: Load our own company profile for invoice direction detection
                  ckTypeId: Meshmakers.Accounting/CompanyProfile
                  take: 1
                  targetPath: $.company
                - type: AnthropicAiQuery@1
                  description: Extract document metadata + detect direction
                  apiKeyConfigurationName: AnthropicAiConfig
                  path: $.ocr.result
                  dataPaths:
                    - $.company
                  responseFormat: json
                  temperature: 0.1
                  question: >-
                    Extract accounting document information from the text in "Main Content". "Additional Context" contains OUR OWN company master data (name, address, VAT id, email) — the company this bookkeeping is done for; it may be empty. The file may contain ONE invoice or SEVERAL independent invoices concatenated into a single PDF (typical: an Amazon marketplace order produces one invoice per seller for the same order; a scan batch combines several receipts). A new invoice starts ONLY where a new invoice number appears — a multi-page invoice is still ONE invoice; never split by page. Output "invoices" as an array with exactly one element per invoice found and "invoiceCount" as the number of elements. Per invoice also output "pageFrom" and "pageTo" (the 1-based first and last PDF page of that invoice) when the page boundaries are recognizable from the text (page markers, "Seite X von Y", repeated per-invoice headers); OMIT both keys when unsure. Apply ALL of the following rules to EACH invoice element independently. Every invoice has two parties: the ISSUER/SELLER (who sent the invoice and receives the money) and the RECIPIENT/BUYER (who is billed). ALWAYS put the issuer/seller into "vendor" and the recipient/buyer into "customer", regardless of which one is us. Determine "documentType": if OUR company (from Additional Context) is the issuer/seller, set it to "OUTGOING"; if OUR company is the recipient/buyer, set it to "INCOMING"; if Additional Context is empty or you cannot decide, use "INCOMING". Output documentType as exactly "INCOMING" or "OUTGOING". Set "extractionComplete" to true ONLY if you could extract documentNumber AND documentDate AND grossTotal for that invoice; otherwise false. Determine the ISO 4217 currency code of the invoice amounts (from the currency symbol or code printed next to the totals, e.g. "$"/"USD", "£"/"GBP", "CHF") and output it as "currency" ONLY when it is NOT euro; OMIT "currency" entirely for euro (€/EUR) invoices. IMPORTANT for date fields (documentDate, dueDate): use ISO format yyyy-MM-dd, and if a date is not present on the document, OMIT that key entirely — never output an empty string "" for a date. Apply this postal-address rule to BOTH vendor and customer independently: if street, zipcode AND city are clearly present for that party, put them in that party's "address" object and set that party's "addressComplete" to true. For address.countryCode use the ISO 3166-1 alpha-2 country code printed on the document; if none is printed, INFER it from the address, language or currency (default "AT" for an Austrian address) — whenever you emit an address you MUST also output a non-empty 2-letter countryCode, never leave it blank. If street, zipcode OR city is missing for a party, OMIT that party's "address" object entirely (set its addressComplete to false). Additionally, for the VENDOR only, when its address is incomplete put the full sender address exactly as printed on the document into "vendor.addressNotes" (omit vendor.addressNotes too if no address is visible at all). Emit "iban" for a party only when an IBAN is printed for it (this is usually the vendor's). Additionally, from the payment/bank-details section (the IBAN block, typically labelled "Account name", "Kontoinhaber" or "Konto lautend auf"), extract the bank ACCOUNT HOLDER name into that party's "accountName". This is the name under which the bank account is held; it is often a trading or brand name that DIFFERS from the letterhead companyName and it is what shows up on the bank statement as the counterpart. Omit "accountName" if no account holder name is printed in the bank section. For BOTH parties independently, extract the printed VAT identification number (UID, USt-IdNr., VAT Reg No, e.g. "ATU12345678", "DE123456789") into that party's "vatId" WITHOUT inner spaces; assign each VAT id to the correct party (the vendor's UID is usually in its letterhead, footer or legal block; the customer's next to the billing address); OMIT "vatId" when none is printed for that party. The amounts of ONE invoice must be internally consistent: netTotal + taxTotal MUST equal grossTotal, and netTotal * (1 + taxRate/100) MUST equal grossTotal. NEVER combine a net, tax or gross figure read on one page of the file with figures read on another page — an image-only PDF assembled from several phone photos puts a different receipt on every page. Read the total block of ONE invoice as a unit, and OMIT a figure you cannot find in that same block rather than substituting one from elsewhere in the file.
                  jsonFormatSample: '{ "invoiceCount": 1, "invoices": [ { "extractionComplete": true, "documentType": "INCOMING", "documentNumber": "RE-2026-001", "documentDate": "2026-03-01", "dueDate": "2026-03-31", "pageFrom": 1, "pageTo": 2, "vendor": { "companyName": "Supplier GmbH", "iban": "AT123456789012345678", "accountName": "Supplier Trading Ltd", "vatId": "ATU12345678", "address": { "street": "Hauptstrasse 1", "zipcode": "5020", "city": "Salzburg", "countryCode": "AT" }, "addressComplete": true }, "customer": { "companyName": "Our Company GmbH", "address": { "street": "Firmianstrasse 31A", "zipcode": "5020", "city": "Salzburg", "countryCode": "AT" }, "addressComplete": true }, "grossTotal": 1200.00, "netTotal": 1000.00, "taxTotal": 200.00, "taxRate": 20.0, "currency": "USD" } ] }'
                  targetPath: $.ai.result
                  continueOnError: true
                - type: DateTime@1
                  description: Analysis timestamp
                  operation: Now
                  targetPath: $.processedAt
                # Stage 1: persist the extraction on the UploadedDocument itself,
                # For multi-invoice PDFs (AB#4543) the staging record holds the
                # FIRST invoice only (manual-create pre-fill); per-invoice data is
                # carried into the documents created below.
                # ALWAYS (even when incomplete) so nothing the AI found is lost
                # and the manual "Create Document" form can pre-fill from it.
                # Dates are stored as String here (no parse), so an empty/invalid
                # date can never fail this write-back. Absent AI fields skip.
                - type: CreateUpdateInfo@1
                  description: Write extraction back to the uploaded document
                  targetPath: $.extractionUpdate
                  targetValueKind: Array
                  targetValueWriteMode: Overwrite
                  updateKind: Update
                  ckTypeId: Meshmakers.Accounting/UploadedDocument
                  rtIdPath: $.key.RtId
                  attributeUpdates:
                    - attributeName: Extraction.DocumentNumber
                      attributeValueType: String
                      valuePath: $.ai.result.invoices[0].documentNumber
                    - attributeName: Extraction.DocumentDate
                      attributeValueType: String
                      valuePath: $.ai.result.invoices[0].documentDate
                    - attributeName: Extraction.DueDate
                      attributeValueType: String
                      valuePath: $.ai.result.invoices[0].dueDate
                    - attributeName: Extraction.GrossTotal
                      attributeValueType: Double
                      valuePath: $.ai.result.invoices[0].grossTotal
                    - attributeName: Extraction.NetTotal
                      attributeValueType: Double
                      valuePath: $.ai.result.invoices[0].netTotal
                    - attributeName: Extraction.TaxTotal
                      attributeValueType: Double
                      valuePath: $.ai.result.invoices[0].taxTotal
                    - attributeName: Extraction.TaxRate
                      attributeValueType: Double
                      valuePath: $.ai.result.invoices[0].taxRate
                    - attributeName: Extraction.VendorCompanyName
                      attributeValueType: String
                      valuePath: $.ai.result.invoices[0].vendor.companyName
                    - attributeName: Extraction.VendorIban
                      attributeValueType: String
                      valuePath: $.ai.result.invoices[0].vendor.iban
                    - attributeName: Extraction.VendorTaxId
                      attributeValueType: String
                      valuePath: $.ai.result.invoices[0].vendor.vatId
                    - attributeName: Extraction.VendorStreet
                      attributeValueType: String
                      valuePath: $.ai.result.invoices[0].vendor.address.street
                    - attributeName: Extraction.VendorZipcode
                      attributeValueType: String
                      valuePath: $.ai.result.invoices[0].vendor.address.zipcode
                    - attributeName: Extraction.VendorCity
                      attributeValueType: String
                      valuePath: $.ai.result.invoices[0].vendor.address.city
                    - attributeName: Extraction.VendorCountryCode
                      attributeValueType: String
                      valuePath: $.ai.result.invoices[0].vendor.address.countryCode
                    - attributeName: Extraction.AddressNotes
                      attributeValueType: String
                      valuePath: $.ai.result.invoices[0].vendor.addressNotes
                    - attributeName: Extraction.AddressComplete
                      attributeValueType: Boolean
                      valuePath: $.ai.result.invoices[0].vendor.addressComplete
                - type: ApplyChanges@2
                  entityUpdatesPath: $.extractionUpdate
                # Stage 2: document creation (AB#4543). The AI reports every
                # invoice found in the PDF as one element of $.ai.result.invoices —
                # a single PDF may carry several independent invoices that are
                # settled by ONE bank transaction (e.g. an Amazon marketplace
                # order with one invoice per seller). Each element runs the full
                # per-invoice gate/duplicate/create logic below; a single-invoice
                # PDF is simply the 1-element case. Inside the loop $.key is the
                # invoice element and $.full.key the UploadedDocument entity.
                # Guard (poison-item fix): the AI can claim extractionComplete
                # while omitting documentNumber (mandatory on AccountingDocument).
                # Such an item would fail ApplyChanges and abort the whole ForEach
                # run every poll, blocking all queued uploads. Gate creation per
                # invoice on docOk = extractionComplete AND non-empty documentNumber.
                - type: SetPrimitiveValue@1
                  description: Default - no invoice reported by the AI
                  targetPath: $.invCount
                  valueType: Int
                  value: 0
                - type: If@1
                  description: AI reported at least one invoice
                  path: $.ai.result.invoiceCount
                  operator: GreaterThan
                  value: 0
                  valueType: Int64
                  transformations:
                    - type: SetPrimitiveValue@1
                      targetPath: $.invCount
                      valueType: Int
                      valuePath: $.ai.result.invoiceCount
                - type: If@1
                  description: Gate, duplicate-check and create each reported invoice
                  path: $.invCount
                  operator: GreaterThan
                  value: 0
                  valueType: Int64
                  transformations:
                    - type: ForEach@1
                      description: One accounting document per invoice in the PDF
                      iterationPath: $.ai.result.invoices
                      targetPath: $.invoiceResults
                      targetValueKind: Simple
                      targetValueWriteMode: Overwrite
                      maxDegreeOfParallelism: 1
                      transformations:
                        - type: SetPrimitiveValue@1
                          description: Default - document not creatable
                          targetPath: $.docOk
                          valueType: Boolean
                          value: false
                        # AB#5259: reason for an arithmetic-implausibility demotion. Kept apart
                        # from the generic "extraction incomplete" note so the inbox states WHY
                        # the figures were rejected; defaulted here (outside the completeness
                        # gate) because the reporting block below reads it unconditionally.
                        - type: SetPrimitiveValue@1
                          description: Default - totals are arithmetically plausible
                          targetPath: $.plausNote
                          valueType: String
                          value: ""
                        - type: If@1
                          description: Extraction claims complete
                          path: $.key.extractionComplete
                          operator: Equals
                          value: true
                          valueType: Boolean
                          transformations:
                            - type: SetPrimitiveValue@1
                              targetPath: $.docOk
                              valueType: Boolean
                              value: true
                            - type: If@1
                              description: documentNumber missing - demote to incomplete
                              path: $.key.documentNumber
                              operator: Equals
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.docOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: documentNumber empty - demote to incomplete
                              path: $.key.documentNumber
                              operator: Equals
                              value: ""
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.docOk
                                  valueType: Boolean
                                  value: false
                            # Poison-item guard (prod incident 2026-07-26): the AI can claim
                            # extractionComplete while omitting documentDate or grossTotal —
                            # both are MANDATORY on AccountingDocument, so the create would
                            # FatalError ApplyChanges and abort the whole upload ForEach every
                            # poll, stranding all queued uploads (a city-fee notice without a
                            # recognizable invoice date blocked a 233-upload batch). Demote such
                            # invoices to INCOMPLETE instead. String guards for the date
                            # (absent + empty); the gross total uses the null-safe numeric
                            # pattern (comparisons on an absent/null number are false, so
                            # only a real number of either sign sets $.grossOk).
                            - type: If@1
                              description: documentDate missing - demote to incomplete
                              path: $.key.documentDate
                              operator: Equals
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.docOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: documentDate empty - demote to incomplete
                              path: $.key.documentDate
                              operator: Equals
                              value: ""
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.docOk
                                  valueType: Boolean
                                  value: false
                            # AB#5282: a digit swap in the YEAR passes every guard here -
                            # the date is present, well-formed and the totals add up - and
                            # then silently falls out of every fiscal year, so the receipt
                            # reaches no tax-advisor handover and nobody notices for months
                            # ("19.06.2086" for "19.06.2026" on a 10,80 EUR receipt). Bound
                            # the year instead. The window is deliberately lopsided: old
                            # receipts are imported late all the time, so the lower bound is
                            # generous, while a document dated far in the future is never
                            # real and is exactly what a year typo produces. An unparseable
                            # but non-empty date is rejected here too: nothing else checks
                            # it, and writing it to the DateTime attribute FatalErrors
                            # ApplyChanges and aborts the whole upload ForEach - the poison
                            # item of the 2026-07-26 incident. Absent/empty dates never
                            # reach this node's demotion path in a way that matters, the
                            # guards above already cleared docOk for them.
                            - type: ExecuteCSharp@1
                              description: Document date inside a plausible window (year-typo guard)
                              code: 'DateTime.TryParse(d, System.Globalization.CultureInfo.InvariantCulture, System.Globalization.DateTimeStyles.None, out var dt) && dt <= DateTime.UtcNow.AddMonths(12) && dt >= DateTime.UtcNow.AddYears(-15)'
                              usings:
                                - System
                              returnType: Boolean
                              arguments:
                                - name: d
                                  valuePath: $.key.documentDate
                                  dataType: String
                              targetPath: $.dateOk
                            - type: If@1
                              description: documentDate implausible or unreadable - demote to incomplete
                              path: $.dateOk
                              operator: Equals
                              value: false
                              valueType: Boolean
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.docOk
                                  valueType: Boolean
                                  value: false
                                # Reuses the AB#5259 plausibility channel, so the inbox states
                                # WHY the document was held back and the reporting block below
                                # needs no new branch. Only for a date that is actually THERE:
                                # an absent or empty date also fails the parse, but it already
                                # has its own reason from the two guards above, and this text
                                # would be wrong for it. A missing path does not fire an If,
                                # and "" fails NotEqual "", so both are skipped here.
                                - type: If@1
                                  description: A date was extracted, it is just not usable
                                  path: $.key.documentDate
                                  operator: NotEqual
                                  value: ""
                                  valueType: String
                                  transformations:
                                    - type: SetPrimitiveValue@1
                                      targetPath: $.plausNote
                                      valueType: String
                                      value: "The extracted document date is not usable - it is either unreadable or implausibly far in the future or past, which is what a digit swap in the year looks like. No document was created - please correct the date and process the document manually."
                            - type: SetPrimitiveValue@1
                              description: Default - gross total not a number
                              targetPath: $.grossOk
                              valueType: Boolean
                              value: false
                            - type: If@1
                              description: Gross total is a non-negative number
                              path: $.key.grossTotal
                              operator: GreaterEqualsThan
                              value: 0
                              valueType: Double
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.grossOk
                                  valueType: Boolean
                                  value: true
                            - type: If@1
                              description: Gross total is a negative number (credit note)
                              path: $.key.grossTotal
                              operator: LessThan
                              value: 0
                              valueType: Double
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.grossOk
                                  valueType: Boolean
                                  value: true
                            - type: If@1
                              description: grossTotal missing - demote to incomplete
                              path: $.grossOk
                              operator: NotEquals
                              value: true
                              valueType: Boolean
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.docOk
                                  valueType: Boolean
                                  value: false
                            # --- AB#5259: arithmetic plausibility of the extracted totals ---
                            # A 3-page image-only PDF (three phone screenshots merged by the iOS
                            # Quartz PDF writer, "Parkticket CDK Marcel.pdf") made the AI take
                            # the figures from DIFFERENT pages of the same file: grossTotal 13.88
                            # with netTotal 10.83 + taxTotal 2.17 = 13.00. The document was marked
                            # COMPLETED and flowed on into transaction matching with a wrong gross
                            # total - a silent success is worse than a visible failure. Verify the
                            # identities the totals must satisfy and demote to INCOMPLETE on a
                            # mismatch so the document lands in the inbox for review instead.
                            # Presence-gated throughout: a shop receipt that yields only a gross
                            # total (no net, no tax, no rate - the normal case) must never be
                            # demoted by this check. A taxRate of 0 is a genuine 0% invoice and a
                            # NUMBER; an absent taxRate is not - the null-safe >=0 / <0 pattern of
                            # the grossTotal guard above is what tells the two apart.
                            # Every Math@1 below sits INSIDE those gates on purpose: a valuePath
                            # pointing at an absent value makes the node throw ValueNotSet, which
                            # would abort the whole upload ForEach.
                            - type: SetPrimitiveValue@1
                              description: Default - net total not a number
                              targetPath: $.netOk
                              valueType: Boolean
                              value: false
                            - type: If@1
                              description: Net total is a non-negative number
                              path: $.key.netTotal
                              operator: GreaterEqualsThan
                              value: 0
                              valueType: Double
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.netOk
                                  valueType: Boolean
                                  value: true
                            - type: If@1
                              description: Net total is a negative number (credit note)
                              path: $.key.netTotal
                              operator: LessThan
                              value: 0
                              valueType: Double
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.netOk
                                  valueType: Boolean
                                  value: true
                            - type: SetPrimitiveValue@1
                              description: Default - tax total not a number
                              targetPath: $.taxOk
                              valueType: Boolean
                              value: false
                            - type: If@1
                              description: Tax total is a non-negative number
                              path: $.key.taxTotal
                              operator: GreaterEqualsThan
                              value: 0
                              valueType: Double
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.taxOk
                                  valueType: Boolean
                                  value: true
                            - type: If@1
                              description: Tax total is a negative number (credit note)
                              path: $.key.taxTotal
                              operator: LessThan
                              value: 0
                              valueType: Double
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.taxOk
                                  valueType: Boolean
                                  value: true
                            - type: SetPrimitiveValue@1
                              description: Default - tax rate not reported
                              targetPath: $.rateOk
                              valueType: Boolean
                              value: false
                            - type: If@1
                              description: Tax rate is a number (0% invoices included)
                              path: $.key.taxRate
                              operator: GreaterEqualsThan
                              value: 0
                              valueType: Double
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.rateOk
                                  valueType: Boolean
                                  value: true
                            - type: SetPrimitiveValue@1
                              description: Default - no arithmetic contradiction found
                              targetPath: $.totalsMismatch
                              valueType: Boolean
                              value: false
                            - type: If@1
                              description: Gross total present - the totals can be cross-checked
                              path: $.grossOk
                              operator: Equals
                              value: true
                              valueType: Boolean
                              transformations:
                                - type: If@1
                                  description: Net total present
                                  path: $.netOk
                                  operator: Equals
                                  value: true
                                  valueType: Boolean
                                  transformations:
                                    # (a) netTotal + taxTotal == grossTotal. The strong identity:
                                    # it holds for every invoice, mixed tax rates included.
                                    - type: If@1
                                      description: Tax total present - check netTotal + taxTotal against grossTotal
                                      path: $.taxOk
                                      operator: Equals
                                      value: true
                                      valueType: Boolean
                                      transformations:
                                        - type: Math@1
                                          description: netTotal + taxTotal
                                          path: $.key
                                          itemPath: $.netTotal
                                          itemTargetPath: $._plausSum
                                          operation: Add
                                          valuePath: $.key.taxTotal
                                        - type: Math@1
                                          description: (netTotal + taxTotal) - grossTotal
                                          path: $.key
                                          itemPath: $._plausSum
                                          itemTargetPath: $._plausSumDiff
                                          operation: Subtract
                                          valuePath: $.key.grossTotal
                                        # Tolerance 0.02: an invoice with many positions rounds
                                        # every line, so the sum may legitimately drift a cent or
                                        # two against the printed gross total. The prod evidence
                                        # was off by 0.88 - three orders of magnitude clear of it.
                                        - type: If@1
                                          description: Sum exceeds the gross total beyond rounding
                                          path: $.key._plausSumDiff
                                          operator: GreaterThan
                                          value: 0.02
                                          valueType: Double
                                          transformations:
                                            - type: SetPrimitiveValue@1
                                              targetPath: $.totalsMismatch
                                              valueType: Boolean
                                              value: true
                                        - type: If@1
                                          description: Sum falls short of the gross total beyond rounding
                                          path: $.key._plausSumDiff
                                          operator: LessThan
                                          value: -0.02
                                          valueType: Double
                                          transformations:
                                            - type: SetPrimitiveValue@1
                                              targetPath: $.totalsMismatch
                                              valueType: Boolean
                                              value: true
                                    # (b) netTotal * (1 + taxRate/100) == grossTotal, used ONLY
                                    # when (a) is not decidable because no taxTotal was reported.
                                    # With a taxTotal present, (a) is both stronger and always
                                    # true, whereas (b) legitimately fails on a MIXED-RATE
                                    # document (a restaurant bill: 10% food + 20% drinks) where
                                    # the AI can report only one rate - running it there would
                                    # demote perfectly good invoices.
                                    - type: If@1
                                      description: No tax total - fall back to the tax-rate identity
                                      path: $.taxOk
                                      operator: NotEquals
                                      value: true
                                      valueType: Boolean
                                      transformations:
                                        - type: If@1
                                          description: Tax rate reported (0 is a rate, absent is not)
                                          path: $.rateOk
                                          operator: Equals
                                          value: true
                                          valueType: Boolean
                                          transformations:
                                            - type: Math@1
                                              description: taxRate / 100
                                              path: $.key
                                              itemPath: $.taxRate
                                              itemTargetPath: $._plausRate
                                              operation: Divide
                                              value: 100
                                            - type: Math@1
                                              description: 1 + taxRate/100
                                              path: $.key
                                              itemPath: $._plausRate
                                              itemTargetPath: $._plausFactor
                                              operation: Add
                                              value: 1
                                            - type: Math@1
                                              description: netTotal * (1 + taxRate/100)
                                              path: $.key
                                              itemPath: $.netTotal
                                              itemTargetPath: $._plausGross
                                              operation: Multiply
                                              valuePath: $.key._plausFactor
                                            - type: Math@1
                                              description: netTotal * (1 + taxRate/100) - grossTotal
                                              path: $.key
                                              itemPath: $._plausGross
                                              itemTargetPath: $._plausRateDiff
                                              operation: Subtract
                                              valuePath: $.key.grossTotal
                                            # Wider tolerance than (a): the reported rate carries
                                            # less precision than a printed tax amount, and the
                                            # net total is itself rounded to cents before it is
                                            # multiplied by the factor.
                                            - type: If@1
                                              description: Computed gross exceeds the reported one beyond rounding
                                              path: $.key._plausRateDiff
                                              operator: GreaterThan
                                              value: 0.05
                                              valueType: Double
                                              transformations:
                                                - type: SetPrimitiveValue@1
                                                  targetPath: $.totalsMismatch
                                                  valueType: Boolean
                                                  value: true
                                            - type: If@1
                                              description: Computed gross falls short of the reported one beyond rounding
                                              path: $.key._plausRateDiff
                                              operator: LessThan
                                              value: -0.05
                                              valueType: Double
                                              transformations:
                                                - type: SetPrimitiveValue@1
                                                  targetPath: $.totalsMismatch
                                                  valueType: Boolean
                                                  value: true
                            - type: If@1
                              description: Totals contradict each other - demote instead of matching a wrong gross total
                              path: $.totalsMismatch
                              operator: Equals
                              value: true
                              valueType: Boolean
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.docOk
                                  valueType: Boolean
                                  value: false
                                - type: SetPrimitiveValue@1
                                  targetPath: $.plausNote
                                  valueType: String
                                  value: "The extracted amounts are arithmetically inconsistent - net, tax and gross total do not add up. This typically happens when a multi-page file mixes figures from different pages. No document was created - please verify the amounts and process the document manually."
                        # AB#4452: semantic duplicate detection. The SHA-256 FileHash check
                        # only catches byte-identical files - the same invoice arriving via
                        # two channels (e-mail receipt vs. portal export) passes it, and
                        # Apple even issues DIFFERENT invoice numbers per channel for the
                        # same charge. Checks before creating the document:
                        #   1. hard: an existing AccountingDocument matches the extracted
                        #      DocumentNumber AND (the same vendor OR the same
                        #      GrossTotal+DocumentDate) -> genuine re-import, never create a
                        #      second one. DocumentNumber ALONE is not enough: external
                        #      reference numbers (customer/case numbers) are echoed across
                        #      different vendors' documents - e.g. an OeAMTC customer number
                        #      printed on a lawyer's dunning letter would otherwise wrongly
                        #      block the (different) lawyer invoice (prod false-positive,
                        #      salzburgdev 2026-07-24).
                        #   2. soft: ONLY when the extraction carries no document
                        #      number of its own. A numberless document whose
                        #      GrossTotal AND DocumentDate match an existing one is a
                        #      suspected twin -> do not create silently, flag for
                        #      manual review. A document that DOES carry a number is
                        #      never soft-blocked: a same-number re-import is already
                        #      caught by check 1, and two genuinely different invoices
                        #      from one vendor on one day for one amount legitimately
                        #      differ only by number (sequential Lufthansa tickets
                        #      ...260/...261, an invoice + its credit note INV/RINV) -
                        #      blocking those on amount+date alone was a confirmed prod
                        #      false-positive (prod-1, 2026-07-30).
                        - type: SetPrimitiveValue@1
                          description: Default - no duplicate detected
                          targetPath: $.dupNote
                          valueType: String
                          value: ""
                        - type: If@1
                          description: Extraction valid - run the duplicate checks
                          path: $.docOk
                          operator: Equals
                          value: true
                          valueType: Boolean
                          transformations:
                            # Hard-duplicate candidates: an existing document must share the
                            # DocumentNumber AND either the vendor or the amount+date. A bare
                            # DocumentNumber collision is NOT a duplicate (shared external
                            # reference numbers across vendors).
                            - type: GetRtEntitiesByType@1
                              description: Same document number AND same vendor (genuine re-import)
                              ckTypeId: Meshmakers.Accounting/AccountingDocument
                              targetPath: $._dupByNumberVendor
                              take: 1
                              fieldFilters:
                                - attributePath: DocumentNumber
                                  operator: Equals
                                  comparisonValuePath: $.key.documentNumber
                                - attributePath: Vendor.CompanyName
                                  operator: Equals
                                  comparisonValuePath: $.key.vendor.companyName
                            - type: GetRtEntitiesByType@1
                              description: Same document number AND same amount+date (same invoice, vendor-name variant)
                              ckTypeId: Meshmakers.Accounting/AccountingDocument
                              targetPath: $._dupByNumberAmountDate
                              take: 1
                              fieldFilters:
                                - attributePath: DocumentNumber
                                  operator: Equals
                                  comparisonValuePath: $.key.documentNumber
                                - attributePath: GrossTotal
                                  operator: Equals
                                  comparisonValuePath: $.key.grossTotal
                                - attributePath: DocumentDate
                                  operator: Equals
                                  comparisonValuePath: $.key.documentDate
                            - type: If@1
                              description: Hard duplicate - number + vendor match
                              path: $._dupByNumberVendor.TotalCount
                              operator: GreaterThan
                              value: 0
                              valueType: Int64
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.docOk
                                  valueType: Boolean
                                  value: false
                                - type: SetPrimitiveValue@1
                                  description: Duplicate reason shown in the Inbox
                                  targetPath: $.dupNote
                                  valueType: String
                                  value: "Duplicate: an accounting document with the same number and vendor already exists. No document was created."
                            - type: If@1
                              description: Hard duplicate - number + amount+date match (vendor name may differ per channel)
                              path: $._dupByNumberAmountDate.TotalCount
                              operator: GreaterThan
                              value: 0
                              valueType: Int64
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.docOk
                                  valueType: Boolean
                                  value: false
                                - type: SetPrimitiveValue@1
                                  description: Duplicate reason shown in the Inbox
                                  targetPath: $.dupNote
                                  valueType: String
                                  value: "Duplicate: an accounting document with the same number, amount and date already exists. No document was created."
                            - type: If@1
                              description: Not a hard duplicate - a same-amount/same-date twin is only a soft suspect when THIS document has no distinctive number of its own
                              path: $.docOk
                              operator: Equals
                              value: true
                              valueType: Boolean
                              transformations:
                                # Does the extraction carry a document number? Null-safe,
                                # mirroring the documentDate guard above (absent + empty).
                                - type: SetPrimitiveValue@1
                                  description: Assume the document has a number
                                  targetPath: $.hasDocumentNumber
                                  valueType: Boolean
                                  value: true
                                - type: If@1
                                  description: documentNumber missing
                                  path: $.key.documentNumber
                                  operator: Equals
                                  valueType: String
                                  transformations:
                                    - type: SetPrimitiveValue@1
                                      targetPath: $.hasDocumentNumber
                                      valueType: Boolean
                                      value: false
                                - type: If@1
                                  description: documentNumber empty
                                  path: $.key.documentNumber
                                  operator: Equals
                                  value: ""
                                  valueType: String
                                  transformations:
                                    - type: SetPrimitiveValue@1
                                      targetPath: $.hasDocumentNumber
                                      valueType: Boolean
                                      value: false
                                # Only numberless documents fall back to the amount+date
                                # soft suspect. A numbered document is created: an actual
                                # re-import (same number) was already caught by the hard
                                # checks, so a surviving amount+date twin with a different
                                # number is a genuinely distinct invoice.
                                - type: If@1
                                  description: No distinctive number - fall back to the amount+date soft-duplicate suspect
                                  path: $.hasDocumentNumber
                                  operator: Equals
                                  value: false
                                  valueType: Boolean
                                  transformations:
                                    - type: GetRtEntitiesByType@1
                                      description: Existing document with identical gross total and document date
                                      ckTypeId: Meshmakers.Accounting/AccountingDocument
                                      targetPath: $._dupByAmountDate
                                      take: 1
                                      fieldFilters:
                                        - attributePath: GrossTotal
                                          operator: Equals
                                          comparisonValuePath: $.key.grossTotal
                                        - attributePath: DocumentDate
                                          operator: Equals
                                          comparisonValuePath: $.key.documentDate
                                    - type: If@1
                                      description: Suspected duplicate - flag for manual review instead of creating silently
                                      path: $._dupByAmountDate.TotalCount
                                      operator: GreaterThan
                                      value: 0
                                      valueType: Int64
                                      transformations:
                                        - type: SetPrimitiveValue@1
                                          targetPath: $.docOk
                                          valueType: Boolean
                                          value: false
                                        - type: SetPrimitiveValue@1
                                          description: Suspected-duplicate reason shown in the Inbox
                                          targetPath: $.dupNote
                                          valueType: String
                                          value: "Possible duplicate: an accounting document with the same amount and document date already exists (invoice numbers may differ per channel). No document was created - please verify and process manually."
                        # --- AB#5382: direction consistency check ---------------------
                        # The extractor sometimes labels an ordinary supplier invoice OUTGOING
                        # although it put OUR company into "customer" (with our VAT id) and the
                        # supplier into "vendor" - 19 of 341 gastroacker documents, all e-mail
                        # imports sent from the supplier's own address. The party fields are
                        # more reliable than the verdict, but not reliable enough to overwrite
                        # it blindly, and vendor/customer are never modified. The C# node
                        # derives an EXPECTATION from the parties: VAT id equality after
                        # removing ALL whitespace and upper-casing (a profile typed "ATU 123"
                        # must not make the check inert); exact normalised name equality
                        # (lower-case, trimmed, whitespace collapsed, ONE trailing legal-form
                        # token stripped) ONLY for a party without a VAT id, never Contains
                        # (salzburgdev's profile says "salzburgdev", its documents "Gerald
                        # Lochner / SALZBURGDEV.AT" - that miss is intended); "" when nothing
                        # is known or both parties look like us. On a contradiction with the
                        # model's documentType: e-mail import AND expected INCOMING (the
                        # supplier-mail shape) -> $.dirOverride, applied inside the create
                        # branch so $.docType stays the single source of truth for the write
                        # and the re-arm direction, traced in the document's Comment; every
                        # other contradiction -> $.docOk=false + $.dupNote, the
                        # duplicate-branch mechanism that parks the upload INCOMPLETE in the
                        # Inbox with a reason. Deliberate consequence: an UPLOAD is never
                        # overridden, so the self-billing / grant documents (FERCHAU, top
                        # itservices, FFG: we are the customer of a correct OUTGOING document)
                        # and ISPIM (the extractor names us as the vendor of a correct
                        # INCOMING one, without a VAT id) are parked INCOMPLETE on EVERY
                        # upload and stay a recurring manual step for those senders until a
                        # sender allow-list exists.
                        # Absent paths: ExecuteCSharp@1 coalesces an absent argument to null
                        # and If@1 reads an absent path as null (so an "is set" gate has to
                        # stay: null Equals null is TRUE); SetPrimitiveValue@1 and
                        # FormatString@1 throw on an undefined path, so every value they read
                        # is defaulted first.
                        - type: SetPrimitiveValue@1
                          description: Default - no direction override
                          targetPath: $.dirOverride
                          valueType: Boolean
                          value: false
                        - type: SetPrimitiveValue@1
                          description: Default - no expectation (the model's verdict stands)
                          targetPath: $.dir.expected
                          valueType: String
                          value: ""
                        - type: If@1
                          description: Direction check only for a document that is about to be created (a duplicate keeps its own reason)
                          path: $.docOk
                          operator: Equals
                          value: true
                          valueType: Boolean
                          transformations:
                            - type: If@1
                              description: CompanyProfile exists (user-created singleton, may be absent)
                              path: $.company.TotalCount
                              operator: GreaterThan
                              value: 0
                              valueType: Int64
                              transformations:
                                - type: ExecuteCSharp@1
                                  description: Expected direction from the parties - INCOMING, OUTGOING or "" (VAT id equality without any whitespace; exact normalised name only for a party WITHOUT a VAT id; never Contains)
                                  code: 'string Vat(string s) { return s == null ? "" : Regex.Replace(s, @"\s+", "").ToUpperInvariant(); } string Nm(string s) { if (s == null) return ""; var n = Regex.Replace(s.ToLowerInvariant().Trim(), @"\s+", " "); n = Regex.Replace(n, @"[\s.,]+$", ""); foreach (var f in new[] { "gmbh & co. kg", "gmbh & co kg", "ges.m.b.h", "gesmbh", "gmbh", "limited", "s.r.o", "sarl", "sas", "ltd", "inc", "llc", "plc", "e.u", "ag", "kg", "og", "sa", "bv", "nv", "se", "ug" }) { if (n.EndsWith(" " + f)) { n = n.Substring(0, n.Length - f.Length - 1).TrimEnd(); break; } } return n; } var ov = Vat(ownVat); var on = Nm(ownName); var vv = Vat(vendorVat); var cv = Vat(customerVat); var vendorIsUs = vv.Length > 0 ? ov.Length > 0 && vv == ov : on.Length > 0 && Nm(vendorName) == on; var customerIsUs = cv.Length > 0 ? ov.Length > 0 && cv == ov : on.Length > 0 && Nm(customerName) == on; if (customerIsUs && !vendorIsUs) return "INCOMING"; if (vendorIsUs && !customerIsUs) return "OUTGOING"; return "";'
                                  usings:
                                    - System
                                    - System.Text.RegularExpressions
                                  returnType: String
                                  arguments:
                                    - name: ownVat
                                      valuePath: $.company.Items[0].Attributes.VatId
                                      dataType: String
                                    - name: ownName
                                      valuePath: $.company.Items[0].Attributes.Name
                                      dataType: String
                                    - name: vendorVat
                                      valuePath: $.key.vendor.vatId
                                      dataType: String
                                    - name: vendorName
                                      valuePath: $.key.vendor.companyName
                                      dataType: String
                                    - name: customerVat
                                      valuePath: $.key.customer.vatId
                                      dataType: String
                                    - name: customerName
                                      valuePath: $.key.customer.companyName
                                      dataType: String
                                  targetPath: $.dir.expected
                            - type: If@1
                              description: An expectation exists - compare it with the model's verdict
                              path: $.dir.expected
                              operator: NotEquals
                              value: ""
                              valueType: String
                              transformations:
                                # The model's verdict, normalised exactly like the create branch does
                                # (anything but an exact OUTGOING is INCOMING); $.docType itself is only
                                # derived inside that branch, which runs after this check.
                                - type: SetPrimitiveValue@1
                                  targetPath: $.dir.model
                                  valueType: String
                                  value: INCOMING
                                - type: If@1
                                  path: $.key.documentType
                                  operator: Equals
                                  value: OUTGOING
                                  valueType: String
                                  transformations:
                                    - type: SetPrimitiveValue@1
                                      targetPath: $.dir.model
                                      valueType: String
                                      value: OUTGOING
                                - type: If@1
                                  description: Contradiction - override (e-mail + expected INCOMING) or park in the Inbox
                                  path: $.dir.expected
                                  operator: NotEquals
                                  valuePath: $.dir.model
                                  valueType: String
                                  transformations:
                                    # Identifying details for the note - defaulted, then copied under an
                                    # "is set" gate; the sender clause is omitted when there is no sender.
                                    - type: SetPrimitiveValue@1
                                      targetPath: $.dir.docNo
                                      valueType: String
                                      value: "(no number)"
                                    - type: SetPrimitiveValue@1
                                      targetPath: $.dir.vendorLabel
                                      valueType: String
                                      value: "(unknown vendor)"
                                    - type: SetPrimitiveValue@1
                                      targetPath: $.dir.senderClause
                                      valueType: String
                                      value: ""
                                    - type: If@1
                                      path: $.key.documentNumber
                                      operator: NotEquals
                                      valueType: String
                                      transformations:
                                        - type: SetPrimitiveValue@1
                                          targetPath: $.dir.docNo
                                          valuePath: $.key.documentNumber
                                          valueType: String
                                    - type: If@1
                                      path: $.key.vendor.companyName
                                      operator: NotEquals
                                      valueType: String
                                      transformations:
                                        - type: SetPrimitiveValue@1
                                          targetPath: $.dir.vendorLabel
                                          valuePath: $.key.vendor.companyName
                                          valueType: String
                                    - type: If@1
                                      path: $.full.key.Attributes.SourceSender
                                      operator: NotEquals
                                      valueType: String
                                      transformations:
                                        - type: FormatString@1
                                          format: ", sender {$.full.key.Attributes.SourceSender}"
                                          targetPath: $.dir.senderClause
                                    # Channel of the upload: DocumentSource EMAIL = 1, read as the enum's
                                    # int key (an unset SourceChannel reads null and counts as "not e-mail").
                                    - type: SetPrimitiveValue@1
                                      targetPath: $.dir.isEmail
                                      valueType: Boolean
                                      value: false
                                    - type: If@1
                                      description: Upload came in through the e-mail import
                                      path: $.full.key.Attributes.SourceChannel
                                      operator: Equals
                                      value: 1
                                      valueType: Int64
                                      transformations:
                                        - type: SetPrimitiveValue@1
                                          targetPath: $.dir.isEmail
                                          valueType: Boolean
                                          value: true
                                    - type: If@1
                                      description: E-mail import AND expected INCOMING - the supplier-mail shape, override
                                      path: $.dir.isEmail
                                      operator: Equals
                                      value: true
                                      valueType: Boolean
                                      transformations:
                                        - type: If@1
                                          path: $.dir.expected
                                          operator: Equals
                                          value: INCOMING
                                          valueType: String
                                          transformations:
                                            - type: SetPrimitiveValue@1
                                              targetPath: $.dirOverride
                                              valueType: Boolean
                                              value: true
                                            # Per-document trace, written to the AccountingDocument's Comment
                                            # (the internal note, not handed over to the tax advisor). The
                                            # vendor's addressNotes share that attribute and are appended, so
                                            # the override does not drop them.
                                            - type: SetPrimitiveValue@1
                                              targetPath: $.dir.addrSuffix
                                              valueType: String
                                              value: ""
                                            - type: If@1
                                              path: $.key.vendor.addressNotes
                                              operator: NotEquals
                                              valueType: String
                                              transformations:
                                                - type: FormatString@1
                                                  format: " Vendor address as printed: {$.key.vendor.addressNotes}"
                                                  targetPath: $.dir.addrSuffix
                                            - type: FormatString@1
                                              description: Override note for the document's Comment
                                              format: "Direction corrected from OUTGOING to INCOMING by the consistency check (AB#5382): document {$.dir.docNo} from {$.dir.vendorLabel}{$.dir.senderClause}.{$.dir.addrSuffix}"
                                              targetPath: $.dir.overrideNote
                                            - type: Logger@1
                                              message: "AB#5382 direction override: e-mail import - the extractor labelled the invoice OUTGOING, but our company is the CUSTOMER (VAT id / name match) and the vendor is a third party; the document is created as INCOMING and carries the details (document number, vendor, sender) in its Comment - Logger@1 cannot interpolate data-context values."
                                    - type: If@1
                                      description: Every other contradiction - do not create silently, park the upload in the Inbox
                                      path: $.dirOverride
                                      operator: Equals
                                      value: false
                                      valueType: Boolean
                                      transformations:
                                        - type: SetPrimitiveValue@1
                                          description: Reason for expected INCOMING (we are the customer, model says OUTGOING)
                                          targetPath: $.dir.reason
                                          valueType: String
                                          value: "Direction check: the extractor says OUTGOING but our company appears as the customer - please verify the direction and the parties, then create the document manually."
                                        - type: If@1
                                          description: Reason for expected OUTGOING (we are the vendor, model says INCOMING)
                                          path: $.dir.expected
                                          operator: Equals
                                          value: OUTGOING
                                          valueType: String
                                          transformations:
                                            - type: SetPrimitiveValue@1
                                              targetPath: $.dir.reason
                                              valueType: String
                                              value: "Direction check: the extractor says INCOMING but our company appears as the vendor - please verify the direction and the parties, then create the document manually."
                                        # Reuses the duplicate-branch path: the "Invoice not created" block
                                        # after the create gate copies a non-empty $.dupNote into
                                        # ProcessingError, and the upload ends INCOMPLETE after the loop.
                                        - type: FormatString@1
                                          description: Inbox reason with the identifying details
                                          format: "{$.dir.reason} (Document {$.dir.docNo} from {$.dir.vendorLabel}{$.dir.senderClause}.)"
                                          targetPath: $.dupNote
                                        - type: SetPrimitiveValue@1
                                          targetPath: $.docOk
                                          valueType: Boolean
                                          value: false
                                        - type: Logger@1
                                          message: "AB#5382 direction conflict: the extractor's documentType contradicts the parties (our company is on the other side of the document) and this is not the e-mail-import/INCOMING shape - no document created; the upload is parked INCOMPLETE in the Inbox, ProcessingError carries document number, vendor and sender."
                        - type: If@1
                          description: Extraction successful - create AccountingDocument
                          path: $.docOk
                          operator: Equals
                          value: true
                          valueType: Boolean
                          transformations:
                            # Normalize the AI-detected direction to a guaranteed enum name
                            # before the write: default INCOMING, promote to OUTGOING only on
                            # an exact match. Guards against a missing/variant documentType
                            # breaking the Enum attribute conversion.
                            - type: SetPrimitiveValue@1
                              description: Default document direction
                              targetPath: $.docType
                              valueType: String
                              value: INCOMING
                            - type: If@1
                              description: Our company is the issuer — outgoing invoice
                              path: $.key.documentType
                              operator: Equals
                              value: OUTGOING
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.docType
                                  valueType: String
                                  value: OUTGOING
                            # AB#5382: apply the override decided by the direction consistency
                            # check above (e-mail import, our company is the customer, the extractor
                            # said OUTGOING). Applied here so $.docType remains the single source of
                            # truth for the DocumentType write and the re-arm direction below.
                            - type: If@1
                              description: AB#5382 - direction override to INCOMING
                              path: $.dirOverride
                              operator: Equals
                              value: true
                              valueType: Boolean
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.docType
                                  valueType: String
                                  value: INCOMING
                            # AB#4542: a zero-total invoice (voucher/credit-settled, e.g.
                            # HelloFresh voucher weeks, provider credit notes) will never
                            # see a payment — create it as PAID with NoTransactionExpected
                            # instead of leaving it OPEN forever. $.noTxExpected stays
                            # absent for normal documents; an absent valuePath skips the
                            # attribute in CreateUpdateInfo.
                            - type: SetPrimitiveValue@1
                              description: New documents await a payment (default)
                              targetPath: $.docState
                              valueType: String
                              value: OPEN
                            - type: If@1
                              description: Zero gross total — voucher/credit-settled, no payment expected
                              path: $.key.grossTotal
                              operator: Equals
                              value: 0
                              valueType: Double
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.docState
                                  valueType: String
                                  value: PAID
                                - type: SetPrimitiveValue@1
                                  targetPath: $.noTxExpected
                                  valueType: Boolean
                                  value: true
                            # --- Sanitize party addresses (poison-item fix) -------------
                            # The Basic Address record has MANDATORY Street + CityTown. The
                            # AI is asked to emit an address all-or-nothing, but occasionally
                            # returns a PARTIAL address (e.g. only zipcode/countryCode); that
                            # partial object still materializes the embedded Address record,
                            # whose missing Street/CityTown then FatalError ApplyChanges and
                            # abort the ENTIRE ForEach — stranding every queued upload. Do not
                            # trust the AI's structural omission: copy each party's address
                            # into a sanitized staging path ($.san.*) ONLY when BOTH mandatory
                            # fields (street + city) are present and non-empty; otherwise the
                            # staging paths stay absent and NO Address record is materialized
                            # (the raw sender address is still kept in Comment via addressNotes).
                            - type: SetPrimitiveValue@1
                              targetPath: $.vendorAddrOk
                              valueType: Boolean
                              value: true
                            - type: If@1
                              description: Vendor street absent — no address
                              path: $.key.vendor.address.street
                              operator: Equals
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.vendorAddrOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: Vendor street empty — no address
                              path: $.key.vendor.address.street
                              operator: Equals
                              value: ""
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.vendorAddrOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: Vendor city absent — no address
                              path: $.key.vendor.address.city
                              operator: Equals
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.vendorAddrOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: Vendor city empty — no address
                              path: $.key.vendor.address.city
                              operator: Equals
                              value: ""
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.vendorAddrOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: Vendor address complete — stage the fields for the write
                              path: $.vendorAddrOk
                              operator: Equals
                              value: true
                              valueType: Boolean
                              transformations:
                                - type: SetPrimitiveValue@1
                                  valuePath: $.key.vendor.address.street
                                  targetPath: $.san.vendor.address.street
                                  valueType: String
                                - type: SetPrimitiveValue@1
                                  valuePath: $.key.vendor.address.zipcode
                                  targetPath: $.san.vendor.address.zipcode
                                  valueType: String
                                - type: SetPrimitiveValue@1
                                  valuePath: $.key.vendor.address.city
                                  targetPath: $.san.vendor.address.city
                                  valueType: String
                                - type: SetPrimitiveValue@1
                                  valuePath: $.key.vendor.address.countryCode
                                  targetPath: $.san.vendor.address.countryCode
                                  valueType: String
                            - type: SetPrimitiveValue@1
                              targetPath: $.customerAddrOk
                              valueType: Boolean
                              value: true
                            - type: If@1
                              description: Customer street absent — no address
                              path: $.key.customer.address.street
                              operator: Equals
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.customerAddrOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: Customer street empty — no address
                              path: $.key.customer.address.street
                              operator: Equals
                              value: ""
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.customerAddrOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: Customer city absent — no address
                              path: $.key.customer.address.city
                              operator: Equals
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.customerAddrOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: Customer city empty — no address
                              path: $.key.customer.address.city
                              operator: Equals
                              value: ""
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.customerAddrOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: Customer address complete — stage the fields for the write
                              path: $.customerAddrOk
                              operator: Equals
                              value: true
                              valueType: Boolean
                              transformations:
                                - type: SetPrimitiveValue@1
                                  valuePath: $.key.customer.address.street
                                  targetPath: $.san.customer.address.street
                                  valueType: String
                                - type: SetPrimitiveValue@1
                                  valuePath: $.key.customer.address.zipcode
                                  targetPath: $.san.customer.address.zipcode
                                  valueType: String
                                - type: SetPrimitiveValue@1
                                  valuePath: $.key.customer.address.city
                                  targetPath: $.san.customer.address.city
                                  valueType: String
                                - type: SetPrimitiveValue@1
                                  valuePath: $.key.customer.address.countryCode
                                  targetPath: $.san.customer.address.countryCode
                                  valueType: String
                            - type: CreateUpdateInfo@1
                              targetPath: $.updates._items
                              targetValueKind: Array
                              targetValueWriteMode: Overwrite
                              updateKind: Insert
                              ckTypeId: Meshmakers.Accounting/AccountingDocument
                              rtIdPath: $.documentRtId
                              generateRtId: true
                              rtWellKnownNamePath: $.key.documentNumber
                              attributeUpdates:
                                - attributeName: DocumentNumber
                                  attributeValueType: String
                                  valuePath: $.key.documentNumber
                                - attributeName: DocumentDate
                                  attributeValueType: DateTime
                                  valuePath: $.key.documentDate
                                - attributeName: DueDate
                                  attributeValueType: DateTime
                                  valuePath: $.key.dueDate
                                - attributeName: DocumentType
                                  attributeValueType: Enum
                                  valuePath: $.docType
                                - attributeName: DocumentState
                                  attributeValueType: Enum
                                  valuePath: $.docState
                                - attributeName: NoTransactionExpected
                                  attributeValueType: Boolean
                                  valuePath: $.noTxExpected
                                - attributeName: Vendor.LegalEntityType
                                  attributeValueType: Enum
                                  value: COMPANY
                                - attributeName: Vendor.CompanyName
                                  attributeValueType: String
                                  valuePath: $.key.vendor.companyName
                                - attributeName: Vendor.IBAN
                                  attributeValueType: String
                                  valuePath: $.key.vendor.iban
                                - attributeName: Vendor.AccountName
                                  attributeValueType: String
                                  valuePath: $.key.vendor.accountName
                                # UID (VAT id) — the tax advisor keys vendors on it (BMD).
                                - attributeName: Vendor.TaxIdentificationNumber
                                  attributeValueType: String
                                  valuePath: $.key.vendor.vatId
                                # Address is written from the SANITIZED staging path
                                # ($.san.*), populated above only when the party's mandatory
                                # Street + CityTown are both present. This prevents a partial
                                # AI address (e.g. countryCode only) from materializing the
                                # Basic Address record without its mandatory fields, which
                                # would FatalError ApplyChanges and abort the whole ForEach.
                                # A partial/absent address instead lands in Comment via
                                # addressNotes.
                                - attributeName: Vendor.Address.Street
                                  attributeValueType: String
                                  valuePath: $.san.vendor.address.street
                                - attributeName: Vendor.Address.Zipcode
                                  attributeValueType: String
                                  valuePath: $.san.vendor.address.zipcode
                                - attributeName: Vendor.Address.CityTown
                                  attributeValueType: String
                                  valuePath: $.san.vendor.address.city
                                - attributeName: Vendor.Address.NationalCode
                                  attributeValueType: String
                                  valuePath: $.san.vendor.address.countryCode
                                # Customer (invoice recipient/buyer). All fields are written
                                # via valuePath only — no static value — so when the AI emits
                                # no customer, every path is absent and NO Customer record is
                                # materialized (LegalEntityType is optional on Contact). Address
                                # from the sanitized staging path, same as the vendor.
                                - attributeName: Customer.CompanyName
                                  attributeValueType: String
                                  valuePath: $.key.customer.companyName
                                - attributeName: Customer.IBAN
                                  attributeValueType: String
                                  valuePath: $.key.customer.iban
                                - attributeName: Customer.AccountName
                                  attributeValueType: String
                                  valuePath: $.key.customer.accountName
                                - attributeName: Customer.TaxIdentificationNumber
                                  attributeValueType: String
                                  valuePath: $.key.customer.vatId
                                - attributeName: Customer.Address.Street
                                  attributeValueType: String
                                  valuePath: $.san.customer.address.street
                                - attributeName: Customer.Address.Zipcode
                                  attributeValueType: String
                                  valuePath: $.san.customer.address.zipcode
                                - attributeName: Customer.Address.CityTown
                                  attributeValueType: String
                                  valuePath: $.san.customer.address.city
                                - attributeName: Customer.Address.NationalCode
                                  attributeValueType: String
                                  valuePath: $.san.customer.address.countryCode
                                - attributeName: Comment
                                  attributeValueType: String
                                  valuePath: $.key.vendor.addressNotes
                                # AB#5382: the override trace. A later entry with the same name
                                # wins, an absent valuePath skips it - so this replaces the
                                # addressNotes above only for an overridden document, and the
                                # note already carries them.
                                - attributeName: Comment
                                  attributeValueType: String
                                  valuePath: $.dir.overrideNote
                                - attributeName: GrossTotal
                                  attributeValueType: Double
                                  valuePath: $.key.grossTotal
                                - attributeName: NetTotal
                                  attributeValueType: Double
                                  valuePath: $.key.netTotal
                                - attributeName: TaxTotal
                                  attributeValueType: Double
                                  valuePath: $.key.taxTotal
                                - attributeName: TaxRate
                                  attributeValueType: Double
                                  valuePath: $.key.taxRate
                                # ISO 4217 currency of the amounts; AI omits it for EUR (missing = EUR, AB#4612)
                                - attributeName: Currency
                                  attributeValueType: String
                                  valuePath: $.key.currency
                                - attributeName: FileHash
                                  attributeValueType: String
                                  valuePath: $.full.key.Attributes.FileHash
                                - attributeName: PageFrom
                                  attributeValueType: Int
                                  valuePath: $.key.pageFrom
                                - attributeName: PageTo
                                  attributeValueType: Int
                                  valuePath: $.key.pageTo
                                # AB#5043: carry the submitter through to the receipt.
                                # AccountingDocument declares ownerAttributePath
                                # OwnerUserId (CK >= 1.26.0), so this value — not
                                # rtCreatedBy — decides ownership; rtCreatedBy here is
                                # this pipeline's system/service-account identity and
                                # would leave every generated receipt owned by nobody.
                                # $.full.key is the UploadedDocument entity of the outer
                                # ForEach, and _res.owner is the submitter resolved at
                                # the top of that iteration (identity user by e-mail,
                                # contact by phone/e-mail, or the verified owner of a
                                # manual upload) — the same value written back to
                                # UploadedDocument.OwnerUserId, so upload and receipt
                                # always agree. Reading _res instead of
                                # $.full.key.Attributes.OwnerUserId is deliberate: the
                                # in-memory entity still carries the pre-resolution
                                # snapshot, which is empty for every channel import.
                                # Unresolved submitter = absent path = attribute skipped
                                # = ownerless, which is the intended default.
                                - attributeName: OwnerUserId
                                  attributeValueType: String
                                  valuePath: $.full.key._res.owner
                            - type: CreateAssociationUpdate@1
                              description: Link the document to the stored file
                              targetPath: $.updates._assocItems
                              targetValueKind: Array
                              targetValueWriteMode: Overwrite
                              updateKind: Create
                              originRtIdPath: $.updates._items[0].RtEntity.RtId
                              originCkTypeIdPath: $.updates._items[0].RtEntity.CkTypeId
                              targetRtIdPath: $.full.key.Attributes.FileRtId
                              targetCkTypeId: System.Reporting/FileSystemItem
                              associationRoleId: System/Related
                            - type: CreateAssociationUpdate@1
                              description: Link the staged upload to the created document
                              targetPath: $.updates._assocItems
                              targetValueKind: Array
                              targetValueWriteMode: Append
                              updateKind: Create
                              originRtIdPath: $.full.key.RtId
                              originCkTypeId: Meshmakers.Accounting/UploadedDocument
                              targetRtIdPath: $.updates._items[0].RtEntity.RtId
                              targetCkTypeIdPath: $.updates._items[0].RtEntity.CkTypeId
                              associationRoleId: Meshmakers.Accounting/UploadedToDocument
                            - type: ApplyChanges@2
                              entityUpdatesPath: $.updates._items
                              associationUpdatesPath: $.updates._assocItems
                            # --- AB#4433: re-arm plausibly-matching Unmatched transactions ---
                            # A transaction synced (finAPI) before its document existed is often
                            # burned to Unmatched(2) before an OPEN candidate document exists.
                            # The AI matching pass only reconsiders MatchState=Unreviewed(0)
                            # (the recurring pass re-checks In [0, 2] since AB#4473), so such
                            # a transaction is never re-matched once its document finally
                            # arrives. Reset the plausible
                            # candidates for THIS freshly-created OPEN document back to
                            # Unreviewed so the next Match Transactions run (<=15 min poll, or
                            # the manual "Run matching") reconsiders them, including the AI
                            # fallback that alone can resolve masked/ambiguous payees (e.g.
                            # PayPal). Scope: transaction direction (Debit pays an incoming
                            # document, Credit settles an outgoing one), |amount| within
                            # [GrossTotal, GrossTotal + 15 EUR transfer fee], and BookingDate on/
                            # after the DocumentDate. Idempotent: only MatchState=Unmatched(2)
                            # rows are touched (Matched/Ignored are left untouched). The explicit
                            # PendingDocument state that would remove the re-arm churn is the
                            # deferred part B of AB#4433 (needs a shared Basic.Accounting change).
                            - type: SetPrimitiveValue@1
                              description: Copy the AI gross total under $.key so all Math bases are $.key (Math itemTargetPath is relative to path — AB#4433 fix)
                              valuePath: $.key.grossTotal
                              targetPath: $.key._rearmGross
                              valueType: Double
                            # AB#4590: widen the re-arm band below the gross total so a
                            # freshly-created OPEN document also reconsiders payments that
                            # came in BELOW its gross — foreign-currency wires and cash
                            # discount (Skonto) — down to 85% of the gross, on top of the
                            # existing +15 EUR transfer-fee headroom above. The AI fallback
                            # still makes the final call, so a wider re-arm only triggers a
                            # reconsider, never a wrong match. (Card-currency purchases are
                            # already handled deterministically by the foreign-currency card
                            # pass; this covers the non-card FX/Skonto tail.)
                            - type: Math@1
                              description: 0.85 * GrossTotal (lower magnitude bound for FX/Skonto)
                              path: $.key
                              itemPath: $._rearmGross
                              itemTargetPath: $._rearmGross85
                              operation: Multiply
                              value: 0.85
                            - type: Math@1
                              description: -GrossTotal (Debit upper bound)
                              path: $.key
                              itemPath: $._rearmGross
                              itemTargetPath: $._rearmNegGross
                              operation: Multiply
                              value: -1
                            - type: Math@1
                              description: -(GrossTotal + 15) = -GrossTotal - 15 (Debit lower bound)
                              path: $.key
                              itemPath: $._rearmNegGross
                              itemTargetPath: $._rearmLo
                              operation: Subtract
                              value: 15
                            - type: SetPrimitiveValue@1
                              description: Default = Debit(1) pays an incoming document
                              targetPath: $.key._rearmDir
                              value: 1
                              valueType: Int
                            - type: Math@1
                              description: Debit upper bound = -(0.85 * GrossTotal) — allow payment below gross (FX/Skonto)
                              path: $.key
                              itemPath: $._rearmGross85
                              itemTargetPath: $._rearmHi
                              operation: Multiply
                              value: -1
                            - type: If@1
                              description: Outgoing document is settled by a Credit(0) — positive amount band
                              path: $.docType
                              operator: Equals
                              value: OUTGOING
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.key._rearmDir
                                  value: 0
                                  valueType: Int
                                - type: SetPrimitiveValue@1
                                  description: Credit lower bound = 0.85 * GrossTotal (allow payment below gross — FX/Skonto)
                                  valuePath: $.key._rearmGross85
                                  targetPath: $.key._rearmLo
                                  valueType: Double
                                - type: Math@1
                                  description: Credit upper bound = GrossTotal + 15 (Subtract -15 = +15)
                                  path: $.key
                                  itemPath: $._rearmGross
                                  itemTargetPath: $._rearmHi
                                  operation: Subtract
                                  value: -15
                            # AB#4590: allow a payment booked up to 14 days BEFORE the
                            # document date to re-arm too — invoices dated at month-end
                            # but paid earlier, and prepayments, were previously never
                            # reconsidered because the filter demanded BookingDate on/after
                            # the document date.
                            - type: DateTime@1
                              description: Earliest booking date that still re-arms (document date - 14 days)
                              operation: AddDays
                              path: $.key.documentDate
                              value: -14
                              targetPath: $.key._rearmMinDate
                            - type: GetRtEntitiesByType@1
                              description: Unmatched transactions plausibly paying this document (amount band incl. below-gross + direction + booked within the document's ±window)
                              ckTypeId: Basic.Accounting/BankTransaction
                              targetPath: $._rearmCandidates
                              take: 50
                              fieldFilters:
                                - attributePath: MatchState
                                  operator: Equals
                                  comparisonValue: 2
                                - attributePath: Direction
                                  operator: Equals
                                  comparisonValuePath: $.key._rearmDir
                                - attributePath: Amount
                                  operator: GreaterEqualThan
                                  comparisonValuePath: $.key._rearmLo
                                - attributePath: Amount
                                  operator: LessEqualThan
                                  comparisonValuePath: $.key._rearmHi
                                - attributePath: BookingDate
                                  operator: GreaterEqualThan
                                  comparisonValuePath: $.key._rearmMinDate
                            - type: ForEach@1
                              description: Re-arm each candidate transaction to Unreviewed so matching reconsiders it
                              iterationPath: $._rearmCandidates.Items
                              targetPath: $._rearmApplied
                              targetValueKind: Simple
                              targetValueWriteMode: Overwrite
                              maxDegreeOfParallelism: 1
                              transformations:
                                - type: CreateUpdateInfo@1
                                  description: Reset the transaction to Unreviewed
                                  targetPath: $._rearmUpdates
                                  targetValueKind: Array
                                  targetValueWriteMode: Overwrite
                                  updateKind: Update
                                  ckTypeId: Basic.Accounting/BankTransaction
                                  rtIdPath: $.key.RtId
                                  attributeUpdates:
                                    - attributeName: MatchState
                                      attributeValueType: Enum
                                      value: Unreviewed
                                - type: ApplyChanges@2
                                  entityUpdatesPath: $._rearmUpdates
                        - type: If@1
                          description: Invoice not created - record the reason on the upload (final state is decided after the loop)
                          path: $.docOk
                          operator: NotEquals
                          value: true
                          valueType: Boolean
                          transformations:
                            - type: SetPrimitiveValue@1
                              description: Default manual-follow-up reason
                              targetPath: $.procError
                              valueType: String
                              value: "OCR or AI extraction did not produce a complete result. Please process the document manually."
                            - type: If@1
                              description: Duplicate detection produced a specific reason (AB#4452)
                              path: $.dupNote
                              operator: NotEquals
                              value: ""
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.procError
                                  valueType: String
                                  valuePath: $.dupNote
                            # AB#5259: the plausibility gate is evaluated BEFORE the duplicate
                            # checks and clears docOk, so those never run and dupNote stays empty
                            # when it fires - the two reasons cannot collide.
                            - type: If@1
                              description: Totals failed the arithmetic plausibility check (AB#5259)
                              path: $.plausNote
                              operator: NotEquals
                              value: ""
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.procError
                                  valueType: String
                                  valuePath: $.plausNote
                            - type: CreateUpdateInfo@1
                              targetPath: $.invoiceError
                              targetValueKind: Array
                              targetValueWriteMode: Overwrite
                              updateKind: Update
                              ckTypeId: Meshmakers.Accounting/UploadedDocument
                              rtIdPath: $.full.key.RtId
                              attributeUpdates:
                                - attributeName: ProcessingError
                                  attributeValueType: String
                                  valuePath: $.procError
                            - type: ApplyChanges@2
                              entityUpdatesPath: $.invoiceError
                # Upload final state (AB#4543): COMPLETED only when every
                # reported invoice has a linked result document (links from
                # previous runs count, so re-analysis stays idempotent);
                # otherwise INCOMPLETE. Per-invoice failure reasons were already
                # written to ProcessingError inside the loop; the no-invoice
                # case gets the generic message here.
                - type: GetAssociationTargets@1
                  description: Result documents linked to this upload
                  originRtIdPath: $.key.RtId
                  originCkTypeId: Meshmakers.Accounting/UploadedDocument
                  targetCkTypeId: Meshmakers.Accounting/AccountingDocument
                  associationRoleId: Meshmakers.Accounting/UploadedToDocument
                  graphDirection: Outbound
                  targetPath: $.linkedDocs
                - type: SetPrimitiveValue@1
                  description: Default - upload not fully processed
                  targetPath: $.uploadDone
                  valueType: Boolean
                  value: false
                - type: If@1
                  description: At least one invoice was reported
                  path: $.invCount
                  operator: GreaterThan
                  value: 0
                  valueType: Int64
                  transformations:
                    - type: If@1
                      description: Every reported invoice has a linked document
                      path: $.linkedDocs[0].TotalCount
                      operator: Equals
                      valuePath: $.invCount
                      valueType: Int64
                      transformations:
                        - type: SetPrimitiveValue@1
                          targetPath: $.uploadDone
                          valueType: Boolean
                          value: true
                - type: If@1
                  description: All invoices created - mark the upload as completed
                  path: $.uploadDone
                  operator: Equals
                  value: true
                  valueType: Boolean
                  transformations:
                    - type: CreateUpdateInfo@1
                      targetPath: $.finals
                      targetValueKind: Array
                      targetValueWriteMode: Overwrite
                      updateKind: Update
                      ckTypeId: Meshmakers.Accounting/UploadedDocument
                      rtIdPath: $.key.RtId
                      attributeUpdates:
                        - attributeName: ProcessingState
                          attributeValueType: Enum
                          value: COMPLETED
                        - attributeName: ProcessedAt
                          attributeValueType: DateTime
                          valuePath: $.processedAt
                        # Clear a leftover per-invoice note from a previous run
                        # (e.g. a duplicate re-analysis that now completes).
                        - attributeName: ProcessingError
                          attributeValueType: String
                          value: ""
                    - type: ApplyChanges@2
                      entityUpdatesPath: $.finals
                - type: If@1
                  description: Extraction incomplete, duplicate or no invoice found - flag for manual follow-up
                  path: $.uploadDone
                  operator: NotEquals
                  value: true
                  valueType: Boolean
                  transformations:
                    - type: If@1
                      description: No invoice reported at all - write the generic reason (per-invoice reasons were written in the loop)
                      path: $.invCount
                      operator: LessEqualsThan
                      value: 0
                      valueType: Int64
                      transformations:
                        - type: SetPrimitiveValue@1
                          targetPath: $.noInvoiceNote
                          valueType: String
                          value: "OCR or AI extraction did not produce a complete result. Please process the document manually."
                    - type: CreateUpdateInfo@1
                      targetPath: $.finals
                      targetValueKind: Array
                      targetValueWriteMode: Overwrite
                      updateKind: Update
                      ckTypeId: Meshmakers.Accounting/UploadedDocument
                      rtIdPath: $.key.RtId
                      attributeUpdates:
                        - attributeName: ProcessingState
                          attributeValueType: Enum
                          value: INCOMPLETE
                        - attributeName: ProcessedAt
                          attributeValueType: DateTime
                          valuePath: $.processedAt
                        - attributeName: ProcessingError
                          attributeValueType: String
                          valuePath: $.noInvoiceNote
                    - type: ApplyChanges@2
                      entityUpdatesPath: $.finals
                - type: SetPrimitiveValue@1
                  valuePath: $.key.RtId
                  valueType: String
                  targetPath: $.key._processedRtId
                - type: Project@1
                  description: Keep only the processed id in the loop result
                  path: $.key
                  fields:
                    - path: Attributes
            # --- AB#5348: a crashed iteration has to fail VISIBLY, exactly once ---
            # The ForEach above isolates a failing iteration, but the iteration
            # dies wherever it throws, so nothing INSIDE it can still write a
            # terminal state. The upload therefore keeps the PROCESSING(1) its
            # first node committed, and the pickup filter above (ProcessingState
            # <= 1, deliberately reclaiming uploads orphaned by an adapter
            # crash) picks it up again five minutes later: a deterministically
            # poisoned document burns a full OCR + AI pass on every run forever
            # and shows the user nothing - not COMPLETED(2), not INCOMPLETE(3),
            # just permanently "in progress" with an empty ProcessedAt. That is
            # the state "Rechnung Dorfaeusl 59.pdf" was wedged in.
            # This sweep runs AFTER the loop, where a terminal state can still
            # be written. It walks the uploads THIS run picked up - deliberately
            # not "everything at PROCESSING", which would also flag the in-flight
            # documents of a concurrent manual /processDocuments run - re-reads
            # each one and flags the ones that never left PROCESSING. An
            # iteration that succeeded has already moved to COMPLETED or
            # INCOMPLETE and cannot match, so the sweep hits exactly the crashed
            # ones. Five point reads per run.
            # Orphan reclaim after an adapter restart is untouched: the process
            # is gone in that case and this node never runs, so the <= 1 filter
            # still rescues those uploads on the next poll.
            # The run still turns red - ForEach@1 raises its aggregated
            # iteration error AFTER the downstream nodes have run (no errorsPath
            # is configured, and none must be added), so the failure stays in the
            # execution history too.
            - type: DateTime@1
              description: Timestamp for the failure flag
              operation: Now
              targetPath: $.sweptAt
            - type: ForEach@1
              description: Flag every upload whose analysis iteration crashed
              iterationPath: $.pending.Items
              targetPath: $.swept
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              # One upload that cannot be flagged must not stop the others from
              # being flagged - and the run is failing anyway.
              continueOnError: true
              transformations:
                # rtIdsPath is READ AS AN ARRAY (GetRtEntitiesByIdNode ->
                # IDataContext.GetArray<string>), so it is wrapped explicitly -
                # the house pattern, see notify-todo-inbound.yaml ("RtIdsPath
                # needs an array"). A bare scalar path does currently work (the
                # data context widens a scalar to a one-element array), but the
                # contract the property states is the array, and a path that
                # resolves to something the widening does not cover - a wildcard
                # like $.pending.Items[*].RtId, or an absent path - yields null
                # and the node throws "No RtIds found at path". Writing the array
                # the property asks for keeps this out of the widening's hands.
                - type: SetPrimitiveValue@1
                  description: Wrap the single rtId into an array for GetRtEntitiesById
                  targetPath: $.key._sweepRtIds
                  valuePath: $.key.RtId
                  valueType: String
                  targetValueKind: Array
                # Read UNFILTERED on purpose: the current ProcessingState is what
                # decides, and an unfiltered read must always come back with
                # exactly this upload. That makes the read self-checking - see the
                # empty-result branch below.
                - type: GetRtEntitiesById@1
                  description: Re-read this upload - its CURRENT state decides
                  ckTypeId: Meshmakers.Accounting/UploadedDocument
                  rtIdsPath: $.key._sweepRtIds
                  targetPath: $.current
                # The sweep's own failure mode is silence: if the re-read ever
                # stops returning the upload, nothing is flagged, the document
                # stays PROCESSING and is retried every five minutes - exactly
                # the defect this sweep exists to remove, and just as invisible.
                # An upload we marked PROCESSING moments ago must be readable by
                # its own rtId, so an empty result is either a delete during the
                # run or a broken sweep, and both belong in the execution log.
                - type: If@1
                  description: Re-read came back empty - the sweep cannot do its job
                  path: $.current.TotalCount
                  operator: Equals
                  value: 0
                  valueType: Int64
                  transformations:
                    - type: Logger@1
                      message: "AB#5348 sweep: re-reading a just-processed upload by its own rtId returned nothing. Either the upload was deleted during this run, or the sweep's re-read is broken - in which case a crashed analysis is no longer flagged INCOMPLETE and the document is retried every five minutes at full OCR and AI cost. Check GetRtEntitiesById@1 / rtIdsPath in the Document Analysis pipeline."
                - type: If@1
                  description: Still PROCESSING after the loop - this upload's iteration crashed
                  path: $.current.Items[0].Attributes.ProcessingState
                  operator: Equals
                  value: 1
                  valueType: Int64
                  transformations:
                    - type: CreateUpdateInfo@1
                      targetPath: $.failMark
                      targetValueKind: Array
                      targetValueWriteMode: Overwrite
                      updateKind: Update
                      ckTypeId: Meshmakers.Accounting/UploadedDocument
                      rtIdPath: $.key.RtId
                      attributeUpdates:
                        - attributeName: ProcessingState
                          attributeValueType: Enum
                          value: INCOMPLETE
                        # Stamped so the document stops looking in-flight. An
                        # empty ProcessedAt on a PROCESSING upload was the only
                        # outward sign this defect ever gave.
                        - attributeName: ProcessedAt
                          attributeValueType: DateTime
                          valuePath: $.full.sweptAt
                        - attributeName: ProcessingError
                          attributeValueType: String
                          value: "The automatic analysis of this document failed unexpectedly and was stopped. It is not retried automatically - see the pipeline execution history for the error, then start the analysis again from the inbox."
                    - type: ApplyChanges@2
                      entityUpdatesPath: $.failMark
            - type: Project@1
              clear: true
              fields:
                - path: $.processed
                  inclusion: true
      - id: System.Communication/StatusMessage
  # Cron trigger for the Document Analysis pipeline — replaces the former in-process
  # FromPolling (00:05:00). Scheduled by the Bot/Hangfire scheduler, so it survives
  # adapter hibernation (scale-to-zero co-wake, AB#4918/4984).
  - rtId: aa0000000000000000000304
    ckTypeId: System.Communication/PipelineTrigger
    associations:
      - roleId: System/ParentChild
        targetRtId: aa0000000000000000000300
        targetCkTypeId: System.Communication/DataFlow
      - roleId: System.Communication/Triggers
        targetRtId: aa0000000000000000000301
        targetCkTypeId: System.Communication/Pipeline
    attributes:
      - id: System/Name
        value: Document Analysis Schedule
      - id: System/Description
        value: Runs the document analysis pipeline every 5 minutes.
      - id: System/Enabled
        value: true
      - id: System.Bot/CronExpression
        value: "0 */5 * * * ?"
