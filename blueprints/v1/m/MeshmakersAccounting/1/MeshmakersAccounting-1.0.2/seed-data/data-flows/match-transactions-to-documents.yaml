                            - type: DateTime@1
                              description: Date-window floor = document date - 1 day
                              operation: AddDays
                              path: $._fbCandidates.Items[0].Attributes.DocumentDate
                              value: -1
                              targetPath: $._fbMinDate
                            - type: DateTime@1
                              description: Date-window cap = document date + 14 days
                              operation: AddDays
                              path: $._fbCandidates.Items[0].Attributes.DocumentDate
                              value: 14
                              targetPath: $._fbMaxDate
                            - type: If@1
                              description: Transaction booked no earlier than one day before the document date
                              path: $.key.Attributes.BookingDate
                              operator: GreaterEqualsThan
                              valuePath: $._fbMinDate
                              valueType: DateTime
                              transformations:
                                - type: If@1
                                  description: …and no later than 14 days after the document date
                                  path: $.key.Attributes.BookingDate
                                  operator: LessEqualsThan
                                  valuePath: $._fbMaxDate
                                  valueType: DateTime
                                  transformations:
                                    # AB#4512 pattern ported to the anonymous fallback: the one-sided
                                    # "exactly one doc candidate" check is order-dependent — a Booking.com
                                    # debit (-374.95) claimed a Bierheuriger invoice (366.30) that a second
                                    # pending POS debit (-380.00, incl. tip) matched just as well. Require
                                    # TWO-SIDED uniqueness: this transaction must be the only pending
                                    # transaction whose amount lies in the document's fee band and whose
                                    # booking date lies in the document's date window; ambiguous clusters
                                    # fall through to the AI pass, which sees the purpose text.
                                    - type: SetPrimitiveValue@1
                                      description: Candidate gross total, copied to the transaction scope for Math
                                      targetPath: $.key._fbGross
                                      valuePath: $._fbCandidates.Items[0].Attributes.GrossTotal
                                      valueType: Double
                                    - type: Math@1
                                      description: Band cap = gross total + the maximum tolerated transfer fee (15 EUR)
                                      path: $.key
                                      itemPath: $._fbGross
                                      itemTargetPath: $._fbGrossCap
                                      operation: Add
                                      value: 15
                                    - type: SetPrimitiveValue@1
                                      description: Signed rival band lower bound (Credit default = gross total)
                                      targetPath: $.key._fbRivLow
                                      valuePath: $.key._fbGross
                                      valueType: Double
                                    - type: SetPrimitiveValue@1
                                      description: Signed rival band upper bound (Credit default = gross total + fee cap)
                                      targetPath: $.key._fbRivHigh
                                      valuePath: $.key._fbGrossCap
                                      valueType: Double
                                    - type: If@1
                                      description: Debit — amounts are negative, the signed band is the negated mirror
                                      path: $.key.Attributes.Direction
                                      operator: Equals
                                      value: 1
                                      valueType: Int64
                                      transformations:
                                        - type: Math@1
                                          description: Lower bound = -(gross total + fee cap)
                                          path: $.key
                                          itemPath: $._fbGrossCap
                                          itemTargetPath: $._fbRivLow
                                          operation: Multiply
                                          value: -1
                                        - type: Math@1
                                          description: Upper bound = -(gross total)
                                          path: $.key
                                          itemPath: $._fbGross
                                          itemTargetPath: $._fbRivHigh
                                          operation: Multiply
                                          value: -1
                                    - type: GetRtEntitiesByType@1
                                      # AB#4542: window-filtered in the query itself —
                                      # same take:50 truncation issue as the exact-pass
                                      # rival guard (90+ pending same-amount
                                      # transactions pushed the transaction under test
                                      # out of the returned page).
                                      description: Pending transactions whose amount lies in the same fee band, booked inside the document's date window (rival candidates)
                                      ckTypeId: Basic.Accounting/BankTransaction
                                      targetPath: $.key._fbRivals
                                      take: 50
                                      fieldFilters:
                                        - attributePath: MatchState
                                          operator: In
                                          comparisonValue:
                                            - 0
                                            - 2
                                        - attributePath: Direction
                                          operator: Equals
                                          comparisonValuePath: $.key.Attributes.Direction
                                        - attributePath: Amount
                                          operator: GreaterEqualThan
                                          comparisonValuePath: $.key._fbRivLow
                                        - attributePath: Amount
                                          operator: LessEqualThan
                                          comparisonValuePath: $.key._fbRivHigh
                                        - attributePath: BookingDate
                                          operator: GreaterEqualThan
                                          comparisonValuePath: $._fbMinDate
                                        - attributePath: BookingDate
                                          operator: LessEqualThan
                                          comparisonValuePath: $._fbMaxDate
                                    - type: ForEach@1
                                      description: Flag every rival booked inside the document's date window (the transaction itself counts once)
                                      iterationPath: $.key._fbRivals.Items
                                      targetPath: $.key._fbRivalChecks
                                      targetValueKind: Simple
                                      targetValueWriteMode: Overwrite
                                      maxDegreeOfParallelism: 1
                                      transformations:
                                        - type: SetPrimitiveValue@1
                                          description: Rival outside the window (default)
                                          targetPath: $.key._inWindow
                                          value: 0
                                          valueType: Int
                                        - type: If@1
                                          description: Rival booked no earlier than the window floor
                                          path: $.key.Attributes.BookingDate
                                          operator: GreaterEqualsThan
                                          valuePath: $.full._fbMinDate
                                          valueType: DateTime
                                          transformations:
                                            - type: If@1
                                              description: …and no later than the window cap
                                              path: $.key.Attributes.BookingDate
                                              operator: LessEqualsThan
                                              valuePath: $.full._fbMaxDate
                                              valueType: DateTime
                                              transformations:
                                                - type: SetPrimitiveValue@1
                                                  targetPath: $.key._inWindow
                                                  value: 1
                                                  valueType: Int
                                    - type: SumAggregation@1
                                      description: Count rivals inside the window
                                      targetPath: $.key._fbRivalsInWindow
                                      aggregations:
                                        - path: $.key._fbRivalChecks[*]
                                          aggregationPath: $._inWindow
                                          value: 1
                                          filterPath: null
                                          comparisonValue: null
                                    - type: If@1
                                      description: The transaction is the only in-window rival — unambiguous, apply the match
                                      path: $.key._fbRivalsInWindow
                                      operator: Equals
                                      value: 1
                                      valueType: Double
                                      transformations:
                                        - type: GetAssociationTargets@1
                                          description: Existing tx links on this document (idempotency guard, AB#4398)
                                          originRtIdPath: $._fbCandidates.Items[0].RtId
                                          originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                          targetCkTypeId: Basic.Accounting/BankTransaction
                                          associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                          graphDirection: Outbound
                                          targetPath: $._fbExisting
                                        - type: If@1
                                          description: Create the link only when the document is not already linked (a stale link still settles via the existing one)
                                          path: $._fbExisting[0].TotalCount
                                          operator: Equals
                                          value: 0
                                          valueType: Int64
                                          transformations:
                                            - type: CreateAssociationUpdate@1
                                              description: Link document to transaction
                                              targetPath: $._fbAssocs
                                              targetValueKind: Array
                                              targetValueWriteMode: Append
                                              updateKind: Create
                                              originRtIdPath: $._fbCandidates.Items[0].RtId
                                              originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                              targetRtIdPath: $.key.RtId
                                              targetCkTypeId: Basic.Accounting/BankTransaction
                                              associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                        - type: CreateUpdateInfo@1
                                          description: Document is paid — PaidAmount is the invoice total; the extra paid is the transfer fee
                                          targetPath: $._fbUpdates
                                          targetValueKind: Array
                                          targetValueWriteMode: Append
                                          updateKind: Update
                                          ckTypeId: Meshmakers.Accounting/AccountingDocument
                                          rtIdPath: $._fbCandidates.Items[0].RtId
                                          attributeUpdates:
                                            - attributeName: DocumentState
                                              attributeValueType: Enum
                                              value: PAID
                                            - attributeName: PaidAmount
                                              attributeValueType: Double
                                              valuePath: $._fbCandidates.Items[0].Attributes.GrossTotal
                                        - type: CreateUpdateInfo@1
                                          description: Transaction is matched (amount+date; payment includes a transfer fee)
                                          targetPath: $._fbUpdates
                                          targetValueKind: Array
                                          targetValueWriteMode: Append
                                          updateKind: Update
                                          ckTypeId: Basic.Accounting/BankTransaction
                                          rtIdPath: $.key.RtId
                                          attributeUpdates:
                                            - attributeName: MatchState
                                              attributeValueType: Enum
                                              value: Matched
                                            - attributeName: MatchComment
                                              attributeValueType: String
                                              value: Auto-matched by amount and date incl. transfer fee (no account-holder name)
                                        - type: ApplyChanges@2
                                          entityUpdatesPath: $._fbUpdates
                                          associationUpdatesPath: $._fbAssocs
            # --- Foreign-currency card pass (AB#4590) — foreign-currency card
            #     purchases ("E-COMM 24,00 USD ... SPESEN: 1,25 KURS: 1,160408")
            #     are booked in EUR: 24 USD becomes 21,93 EUR incl. the forex
            #     surcharge, so the EUR Amount never equals the invoice
            #     GrossTotal, which the AI stores as the ORIGINAL foreign amount
            #     (24). The exact pass (EUR amount == gross) and the tolerance
            #     pass (payment >= invoice, but here the EUR payment is BELOW the
            #     foreign gross) therefore both miss them, and these card debits
            #     carry no CounterpartName to anchor on. This pass reads the
            #     printed foreign amount out of the purpose (TransformString
            #     RegexExtract, German number -> JSON number) and settles the
            #     UNIQUE open incoming document whose GrossTotal equals it inside
            #     the document's date window. Gated to purposes carrying the
            #     all-caps "SPESEN:" surcharge (MatchRegEx is CASE-SENSITIVE, so
            #     it hits only genuine foreign-currency card purchases) — domestic
            #     EUR card debits (no SPESEN, EUR amount == gross) stay with the
            #     exact pass and its AB#4512 rival guard, so the same-amount
            #     collision cannot reappear here. No tx-side rival guard is
            #     needed: the doc-side uniqueness (exactly one in-window gross),
            #     the sequential settle (maxDegreeOfParallelism 1 flips the doc to
            #     PAID before the next iteration) and the existing-link guard make
            #     a double match impossible.
            - type: GetRtEntitiesByType@1
              description: Pending foreign-currency card debits (purpose carries the all-caps SPESEN surcharge)
              ckTypeId: Basic.Accounting/BankTransaction
              targetPath: $.fxPending
              take: 500
              fieldFilters:
                - attributePath: MatchState
                  operator: In
                  comparisonValue:
                    - 0
                    - 2
                - attributePath: Direction
                  operator: Equals
                  comparisonValue: 1
                - attributePath: Purpose
                  operator: MatchRegEx
                  comparisonValue: "SPESEN:"
            - type: ForEach@1
              description: Foreign-currency card pass — match the printed foreign amount to a unique open incoming document
              iterationPath: $.fxPending.Items
              targetPath: $.fxResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                # Presence guard first (string), so a non-conforming purpose never
                # reaches a numeric node as null (RegexMatch is null-safe; the
                # guarded value is a string, never a number — cf. the
                # RegexMatch-on-number trap). Pattern: the amount printed right
                # after "E-COMM" followed by its currency token ("E-COMM 24,00 USD",
                # "E-COMM 1.234,56 US"). No inline (?i): the token is upper-case.
                - type: TransformString@1
                  description: Foreign amount as text (presence probe)
                  path: $.key
                  sourcePath: $.Attributes.Purpose
                  targetPath: $._fxAmountStr
                  operation: RegexExtract
                  pattern: '^E-COMM\s+([0-9.]+,[0-9]{2})\s+[A-Z]'
                - type: If@1
                  description: A foreign amount was extracted from the purpose
                  path: $.key._fxAmountStr
                  operator: RegexMatch
                  value: .+
                  valueType: String
                  transformations:
                    # Same capture, coerced to a JSON number (strip "." grouping,
                    # "," -> "."), so the GrossTotal Equals filter can compare it.
                    - type: TransformString@1
                      description: Foreign amount as number for the gross-total filter
                      path: $.key
                      sourcePath: $.Attributes.Purpose
                      targetPath: $._fxAmount
                      operation: RegexExtract
                      pattern: '^E-COMM\s+([0-9.]+,[0-9]{2})\s+[A-Z]'
                      asDecimal: true
                      groupSeparator: "."
                      decimalSeparator: ","
                    - type: DateTime@1
                      description: Earliest document date whose match window still contains this booking date
                      operation: AddDays
                      path: $.key.Attributes.BookingDate
                      value: -14
                      targetPath: $.key._fxDocMinDate
                    - type: DateTime@1
                      description: Latest document date whose match window still contains this booking date
                      operation: AddDays
                      path: $.key.Attributes.BookingDate
                      value: 1
                      targetPath: $.key._fxDocMaxDate
                    - type: GetRtEntitiesByType@1
                      description: Open incoming documents whose gross total equals the printed foreign amount, dated so their window contains this booking date
                      ckTypeId: Meshmakers.Accounting/AccountingDocument
                      targetPath: $._fxCands
                      take: 5
                      fieldFilters:
                        - attributePath: DocumentState
                          operator: Equals
                          comparisonValue: 0
                        - attributePath: DocumentType
                          operator: Equals
                          comparisonValue: 0
                        - attributePath: GrossTotal
                          operator: Equals
                          comparisonValuePath: $.key._fxAmount
                        - attributePath: DocumentDate
                          operator: GreaterEqualThan
                          comparisonValuePath: $.key._fxDocMinDate
                        - attributePath: DocumentDate
                          operator: LessEqualThan
                          comparisonValuePath: $.key._fxDocMaxDate
                    - type: If@1
                      description: Exactly one open incoming document with that foreign gross in-window — settle it
                      path: $._fxCands.TotalCount
                      operator: Equals
                      value: 1
                      valueType: Int64
                      transformations:
                        - type: GetAssociationTargets@1
                          description: Existing tx links on this document (idempotency guard, AB#4398)
                          originRtIdPath: $._fxCands.Items[0].RtId
                          originCkTypeId: Meshmakers.Accounting/AccountingDocument
                          targetCkTypeId: Basic.Accounting/BankTransaction
                          associationRoleId: Meshmakers.Accounting/TransactionToDocument
                          graphDirection: Outbound
                          targetPath: $._fxExisting
                        - type: If@1
                          description: Create the link only when the document is not already linked
                          path: $._fxExisting[0].TotalCount
                          operator: Equals
                          value: 0
                          valueType: Int64
                          transformations:
                            - type: CreateAssociationUpdate@1
                              description: Link document to transaction
                              targetPath: $._fxAssocs
                              targetValueKind: Array
                              targetValueWriteMode: Append
                              updateKind: Create
                              originRtIdPath: $._fxCands.Items[0].RtId
                              originCkTypeId: Meshmakers.Accounting/AccountingDocument
                              targetRtIdPath: $.key.RtId
                              targetCkTypeId: Basic.Accounting/BankTransaction
                              associationRoleId: Meshmakers.Accounting/TransactionToDocument
                        - type: CreateUpdateInfo@1
                          description: Document is paid (foreign-currency card purchase)
                          targetPath: $._fxUpdates
                          targetValueKind: Array
                          targetValueWriteMode: Append
                          updateKind: Update
                          ckTypeId: Meshmakers.Accounting/AccountingDocument
                          rtIdPath: $._fxCands.Items[0].RtId
                          attributeUpdates:
                            - attributeName: DocumentState
                              attributeValueType: Enum
                              value: PAID
                            - attributeName: PaidAmount
                              attributeValueType: Double
                              valuePath: $._fxCands.Items[0].Attributes.GrossTotal
                        - type: CreateUpdateInfo@1
                          description: Transaction is matched
                          targetPath: $._fxUpdates
                          targetValueKind: Array
                          targetValueWriteMode: Append
                          updateKind: Update
                          ckTypeId: Basic.Accounting/BankTransaction
                          rtIdPath: $.key.RtId
                          attributeUpdates:
                            - attributeName: MatchState
                              attributeValueType: Enum
                              value: Matched
                            - attributeName: MatchComment
                              attributeValueType: String
                              value: Auto-matched by foreign-currency amount (auto)
                        - type: ApplyChanges@2
                          entityUpdatesPath: $._fxUpdates
                          associationUpdatesPath: $._fxAssocs
            - type: GetRtEntitiesByType@1
              description: 'AB#4590 FX card pass: pending EUR debits that mention a foreign currency code in the purpose (direct card charges)'
              ckTypeId: Basic.Accounting/BankTransaction
              targetPath: $.fxcPending
              take: 500
              fieldFilters:
              - attributePath: MatchState
                operator: In
                comparisonValue:
                - 0
                - 2
              - attributePath: Direction
                operator: Equals
                comparisonValue: 1
              - attributePath: Currency
                operator: Equals
                comparisonValue: EUR
              - attributePath: Purpose
                operator: MatchRegEx
                comparisonValue: (USD|GBP|CHF|CAD|AUD|SEK|NOK|DKK|PLN|CZK|HKD|JPY|SGD)
            - type: ForEach@1
              description: For each foreign-currency card debit, find the unique invoice by original amount + currency
              iterationPath: $.fxcPending.Items
              targetPath: $.fxcResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
              - type: Logger@1
                message: FXCARD-DIAG-A pending EUR card debit
              - type: SetPrimitiveValue@1
                description: Initialise extraction slots so the paths always exist
                targetPath: $.key._fxCur
                value: ''
                valueType: String
              - type: SetPrimitiveValue@1
                targetPath: $.key._fxAmt
                value: 0
                valueType: Double
              - type: TransformString@1
                description: Extract the original foreign amount from the purpose (e.g. "36,00 USD" -> 36.00)
                sourcePath: $.key.Attributes.Purpose
                targetPath: $.key._fxAmt
                operation: RegexExtract
                pattern: ([0-9][0-9.]*,[0-9]{2})\s+(USD|GBP|CHF|CAD|AUD|SEK|NOK|DKK|PLN|CZK|HKD|JPY|SGD)
                groupIndex: 1
                asDecimal: true
                groupSeparator: .
                decimalSeparator: ','
              - type: TransformString@1
                description: Extract the currency code from the purpose (group 2)
                sourcePath: $.key.Attributes.Purpose
                targetPath: $.key._fxCur
                operation: RegexExtract
                pattern: ([0-9][0-9.]*,[0-9]{2})\s+(USD|GBP|CHF|CAD|AUD|SEK|NOK|DKK|PLN|CZK|HKD|JPY|SGD)
                groupIndex: 2
                asDecimal: false
              - type: If@1
                description: A valid foreign currency code was extracted
                path: $.key._fxCur
                operator: RegexMatch
                value: ^(USD|GBP|CHF|CAD|AUD|SEK|NOK|DKK|PLN|CZK|HKD|JPY|SGD)$
                valueType: String
                transformations:
                - type: Logger@1
                  message: FXCARD-DIAG-B foreign amount+currency extracted
                - type: GetAssociationTargets@1
                  description: Documents already linked to this transaction (idempotency + uniqueness guard)
                  originRtIdPath: $.key.RtId
                  originCkTypeId: Basic.Accounting/BankTransaction
                  targetCkTypeId: Meshmakers.Accounting/AccountingDocument
                  associationRoleId: Meshmakers.Accounting/TransactionToDocument
                  graphDirection: Inbound
                  targetPath: $.key._fxTxDocs
                - type: If@1
                  description: Transaction not yet linked to any document
                  path: $.key._fxTxDocs[0].TotalCount
                  operator: Equals
                  value: 0
                  valueType: Int64
                  transformations:
                  - type: DateTime@1
                    description: Window floor = booking date - 45 days (card charge may precede the invoice)
                    operation: AddDays
                    path: $.key.Attributes.BookingDate
                    value: -45
                    targetPath: $.key._fxMinDate
                  - type: DateTime@1
                    description: Window cap = booking date + 10 days
                    operation: AddDays
                    path: $.key.Attributes.BookingDate
                    value: 10
                    targetPath: $.key._fxMaxDate
                  - type: GetRtEntitiesByType@1
                    description: Candidate invoices with the same currency and gross total (date window checked in-pipeline)
                    ckTypeId: Meshmakers.Accounting/AccountingDocument
                    targetPath: $._fxDocs
                    take: 20
                    fieldFilters:
                    - attributePath: Currency
                      operator: Equals
                      comparisonValuePath: $.key._fxCur
                    - attributePath: GrossTotal
                      operator: Equals
                      comparisonValuePath: $.key._fxAmt
                    - attributePath: DocumentState
                      operator: In
                      comparisonValue:
                      - 0
                      - 2
                  - type: ForEach@1
                    description: For each candidate invoice, link it when in the date window and still unmatched
                    iterationPath: $._fxDocs.Items
                    targetPath: $._fxScan
                    targetValueKind: Simple
                    targetValueWriteMode: Overwrite
                    maxDegreeOfParallelism: 1
                    transformations:
                    - type: If@1
                      description: Document date on/after window floor
                      path: $.key.Attributes.DocumentDate
                      operator: GreaterEqualsThan
                      valuePath: $.full.key._fxMinDate
                      valueType: DateTime
                      transformations:
                      - type: If@1
                        description: Document date on/before window cap
                        path: $.key.Attributes.DocumentDate
                        operator: LessEqualsThan
                        valuePath: $.full.key._fxMaxDate
                        valueType: DateTime
                        transformations:
                        - type: GetAssociationTargets@1
                          description: Transactions already linked to this document (skip if already paid)
                          originRtIdPath: $.key.RtId
                          originCkTypeId: Meshmakers.Accounting/AccountingDocument
                          targetCkTypeId: Basic.Accounting/BankTransaction
                          associationRoleId: Meshmakers.Accounting/TransactionToDocument
                          graphDirection: Outbound
                          targetPath: $._fxDocTxs
                        - type: If@1
                          description: Document not yet linked to any transaction
                          path: $._fxDocTxs[0].TotalCount
                          operator: Equals
                          value: 0
                          valueType: Int64
                          transformations:
                          - type: GetAssociationTargets@1
                            description: Re-check the transaction is still unlinked (first-candidate-wins)
                            originRtIdPath: $.full.key.RtId
                            originCkTypeId: Basic.Accounting/BankTransaction
                            targetCkTypeId: Meshmakers.Accounting/AccountingDocument
                            associationRoleId: Meshmakers.Accounting/TransactionToDocument
                            graphDirection: Inbound
                            targetPath: $._fxTxRecheck
                          - type: If@1
                            description: Transaction still unlinked — book the match
                            path: $._fxTxRecheck[0].TotalCount
                            operator: Equals
                            value: 0
                            valueType: Int64
                            transformations:
                            - type: Logger@1
                              message: FXCARD-DIAG-D linking invoice to foreign-currency card debit
                            - type: CreateAssociationUpdate@1
                              description: Link the invoice to the card debit
                              targetPath: $._fxAssocs
                              targetValueKind: Array
                              targetValueWriteMode: Overwrite
                              updateKind: Create
                              originRtIdPath: $.key.RtId
                              originCkTypeId: Meshmakers.Accounting/AccountingDocument
                              targetRtIdPath: $.full.key.RtId
                              targetCkTypeId: Basic.Accounting/BankTransaction
                              associationRoleId: Meshmakers.Accounting/TransactionToDocument
                            - type: CreateUpdateInfo@1
                              description: Card debit becomes the matched booking leg
                              targetPath: $._fxUpdates
                              targetValueKind: Array
                              targetValueWriteMode: Overwrite
                              updateKind: Update
                              ckTypeId: Basic.Accounting/BankTransaction
                              rtIdPath: $.full.key.RtId
                              attributeUpdates:
                              - attributeName: MatchState
                                attributeValueType: Enum
                                value: Matched
                              - attributeName: MatchComment
                                attributeValueType: String
                                value: Foreign-currency card charge, matched by original amount and currency in purpose (auto)
                            - type: CreateUpdateInfo@1
                              description: Invoice is paid (in its own foreign currency), currency stamped
                              targetPath: $._fxUpdates
                              targetValueKind: Array
                              targetValueWriteMode: Append
                              updateKind: Update
                              ckTypeId: Meshmakers.Accounting/AccountingDocument
                              rtIdPath: $.key.RtId
                              attributeUpdates:
                              - attributeName: DocumentState
                                attributeValueType: Enum
                                value: PAID
                              - attributeName: PaidAmount
                                attributeValueType: Double
                                valuePath: $.full.key._fxAmt
                              - attributeName: Currency
                                attributeValueType: String
                                valuePath: $.full.key._fxCur
                            - type: ApplyChanges@2
                              description: Persist the foreign-currency card match
                              entityUpdatesPath: $._fxUpdates
                              associationUpdatesPath: $._fxAssocs

            # --- Cross-currency PayPal funding pass (AB#4596) — a purchase paid
            #     through PayPal in a foreign currency (e.g. GitHub, 306.69 USD)
            #     lands twice, across two own accounts: as the original-currency
            #     debit on the PayPal-ledger account (USD — carries the vendor and
            #     the invoice) and, two-ish days later, as the EUR SEPA direct debit
            #     "…/PAYPAL" that PayPal collects from the giro account (counterpart
            #     "PayPal Europe…", 281 EUR). The EUR giro leg is the amount that
            #     actually left the bank, so it — not the USD ledger leg — is the
            #     accounting-relevant expense. But the AB#4509 settlement pass pairs
            #     legs only on an EQUAL signed amount (306.69 USD != 281 EUR) and
            #     the giro leg carries no vendor to match a document, so both legs
            #     stay unresolved. This pass bridges them by FX band: for a pending
            #     EUR giro debit whose counterpart is PayPal, it finds the UNIQUE
            #     foreign-currency debit on another own account, booked just before,
            #     whose magnitude is within [1.00, 1.25]x the EUR magnitude (implied
            #     EUR/foreign rate 0.80–1.00). It then makes the EUR giro leg the
            #     booking leg — moves the invoice onto it — and ignores the foreign
            #     ledger leg as a clearing duplicate, so the expense is counted once,
            #     in EUR, on the leg that can then be categorised. Uniqueness
            #     (exactly one in-band twin) plus the PayPal counterpart gate make a
            #     false pair impossible; verified 21/21 clean on prod-1, 0 ambiguous.
            #     The band is expressed as magnitude bounds on the (negative) foreign
            #     amount to avoid a dynamic division. Runs AFTER the deterministic
            #     passes so the foreign leg already carries its invoice, and only
            #     acts when it does (nothing to book otherwise). PaidAmount lives on
            #     the document, not the transaction, so the EUR value needs no write —
            #     it is the giro leg's own Amount. Idempotent: matching the giro leg
            #     and moving the invoice off the twin removes the pair from the
            #     candidate sets. Standard nodes only (no RegexExtract) — deployable
            #     without an adapter release, like the AB#4590 bank-fee vocab.
            - type: GetRtEntitiesByType@1
              description: Pending EUR debits collected by PayPal (potential foreign-purchase funding legs)
              ckTypeId: Basic.Accounting/BankTransaction
              targetPath: $.ppfxPending
              take: 500
              fieldFilters:
                - attributePath: MatchState
                  operator: In
                  comparisonValue:
                    - 0
                    - 2
                - attributePath: Direction
                  operator: Equals
                  comparisonValue: 1
                - attributePath: Currency
                  operator: Equals
                  comparisonValue: EUR
                - attributePath: CounterpartName
                  operator: MatchRegEx
                  comparisonValue: "(?i)paypal"
            - type: ForEach@1
              description: Bridge each PayPal EUR funding leg to its unique foreign-currency twin
              iterationPath: $.ppfxPending.Items
              targetPath: $.ppfxResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                # FX band as magnitude bounds on the (negative) foreign amount:
                # |foreign| in [|eur|, 1.25*|eur|] == rate in [0.80, 1.00]. In signed
                # debit space the foreign amount sits in [1.25*eurAmount, eurAmount]
                # (eurAmount is the less-negative, upper bound).
                - type: SetPrimitiveValue@1
                  description: Copy the EUR amount to a single-segment key under $.key (Math bases must be relative-to-path — AB#4433/AB#4590 convention)
                  valuePath: $.key.Attributes.Amount
                  targetPath: $.key._ppfxAmt
                  valueType: Double
                - type: Math@1
                  description: Lower (more negative) foreign bound = 1.25 * EUR amount
                  path: $.key
                  itemPath: $._ppfxAmt
                  itemTargetPath: $._ppfxLo
                  operation: Multiply
                  value: 1.25
                - type: DateTime@1
                  description: Twin window floor = booking date - 8 days
                  operation: AddDays
                  path: $.key.Attributes.BookingDate
                  value: -8
                  targetPath: $.key._ppfxMinDate
                - type: DateTime@1
                  description: Twin window cap = booking date + 1 day
                  operation: AddDays
                  path: $.key.Attributes.BookingDate
                  value: 1
                  targetPath: $.key._ppfxMaxDate
                - type: GetRtEntitiesByType@1
                  description: Foreign-currency debits in the FX amount band (date window checked in-pipeline — field-filter dates do not coerce, AB#4389/AB#4509)
                  ckTypeId: Basic.Accounting/BankTransaction
                  targetPath: $._ppfxTwins
                  take: 50
                  fieldFilters:
                    - attributePath: Direction
                      operator: Equals
                      comparisonValue: 1
                    - attributePath: Currency
                      operator: NotEquals
                      comparisonValue: EUR
                    - attributePath: Amount
                      operator: GreaterEqualThan
                      comparisonValuePath: $.key._ppfxLo
                    - attributePath: Amount
                      operator: LessEqualThan
                      comparisonValuePath: $.key.Attributes.Amount
                # Date window + uniqueness are decided in-pipeline: field-filter
                # DateTime comparisons do not coerce (AB#4389), so the AB#4509
                # settlement pass established this If-based pattern. Count the twins
                # booked inside [bookingDate-8, bookingDate+1] and capture the last
                # one's RtId; act only when exactly one survives.
                - type: ForEach@1
                  description: For each in-window foreign twin, book the EUR leg and ignore the clearing leg
                  iterationPath: $._ppfxTwins.Items
                  targetPath: $._ppfxScan
                  targetValueKind: Simple
                  targetValueWriteMode: Overwrite
                  maxDegreeOfParallelism: 1
                  transformations:
                    - type: If@1
                      description: Twin booked no earlier than 8 days before the collection
                      path: $.key.Attributes.BookingDate
                      operator: GreaterEqualsThan
                      valuePath: $.full.key._ppfxMinDate
                      valueType: DateTime
                      transformations:
                        - type: If@1
                          description: …and no later than 1 day after it
                          path: $.key.Attributes.BookingDate
                          operator: LessEqualsThan
                          valuePath: $.full.key._ppfxMaxDate
                          valueType: DateTime
                          transformations:
                            # Act INSIDE the loop: ApplyChanges persists to the DB,
                            # whereas nested-ForEach context state does not survive the
                            # loop (AB#4509 pattern). First-in-window-twin-wins: only
                            # act while the giro leg carries no document yet — prevents
                            # a double move if two twins ever fall in-window, and pairs
                            # with the ppfxPending In[0,2] gate for cross-run idempotency
                            # (a matched giro leg leaves the candidate set).
                            - type: GetAssociationTargets@1
                              description: Documents already on the EUR giro leg
                              originRtIdPath: $.full.key.RtId
                              originCkTypeId: Basic.Accounting/BankTransaction
                              targetCkTypeId: Meshmakers.Accounting/AccountingDocument
                              associationRoleId: Meshmakers.Accounting/TransactionToDocument
                              graphDirection: Inbound
                              targetPath: $._ppfxGiroDocs
                            - type: If@1
                              description: Giro leg not yet booked to a document
                              path: $._ppfxGiroDocs[0].TotalCount
                              operator: Equals
                              value: 0
                              valueType: Int64
                              transformations:
                                # Both account lookups are TotalCount-guarded before the
                                # RtId compare (an If with a valuePath THROWS on a missing
                                # path — the AB#4433 Part C incident).
                                - type: GetAssociationTargets@1
                                  description: Account of the EUR giro leg
                                  originRtIdPath: $.full.key.RtId
                                  originCkTypeId: Basic.Accounting/BankTransaction
                                  targetCkTypeId: Basic.Accounting/BankAccount
                                  associationRoleId: System/ParentChild
                                  graphDirection: Outbound
                                  targetPath: $._ppfxGiroAcc
                                - type: GetAssociationTargets@1
                                  description: Account of the foreign twin
                                  originRtIdPath: $.key.RtId
                                  originCkTypeId: Basic.Accounting/BankTransaction
                                  targetCkTypeId: Basic.Accounting/BankAccount
                                  associationRoleId: System/ParentChild
                                  graphDirection: Outbound
                                  targetPath: $._ppfxTwinAcc
                                - type: If@1
                                  description: Giro leg has a resolved account
                                  path: $._ppfxGiroAcc[0].TotalCount
                                  operator: GreaterThan
                                  value: 0
                                  valueType: Int64
                                  transformations:
                                    - type: If@1
                                      description: Twin has a resolved account
                                      path: $._ppfxTwinAcc[0].TotalCount
                                      operator: GreaterThan
                                      value: 0
                                      valueType: Int64
                                      transformations:
                                        - type: If@1
                                          description: Twin lives on a DIFFERENT own account (never the EUR giro account)
                                          path: $._ppfxTwinAcc[0].Items[0].RtId
                                          operator: NotEquals
                                          valuePath: $._ppfxGiroAcc[0].Items[0].RtId
                                          valueType: String
                                          transformations:
                                            - type: GetAssociationTargets@1
                                              description: Documents currently linked to the foreign twin
                                              originRtIdPath: $.key.RtId
                                              originCkTypeId: Basic.Accounting/BankTransaction
                                              targetCkTypeId: Meshmakers.Accounting/AccountingDocument
                                              associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                              graphDirection: Inbound
                                              targetPath: $._ppfxTwinDocs
                                            # Only act when the foreign leg carries exactly
                                            # one invoice to move — leave 0 or >1 for manual.
                                            - type: If@1
                                              description: The foreign twin carries exactly one invoice
                                              path: $._ppfxTwinDocs[0].TotalCount
                                              operator: Equals
                                              value: 1
                                              valueType: Int64
                                              transformations:
                                                - type: CreateAssociationUpdate@1
                                                  description: Link the invoice to the EUR giro leg (the booking leg)
                                                  targetPath: $._ppfxAssocs
                                                  targetValueKind: Array
                                                  targetValueWriteMode: Overwrite
                                                  updateKind: Create
                                                  originRtIdPath: $._ppfxTwinDocs[0].Items[0].RtId
                                                  originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                                  targetRtIdPath: $.full.key.RtId
                                                  targetCkTypeId: Basic.Accounting/BankTransaction
                                                  associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                                - type: CreateAssociationUpdate@1
                                                  description: Unlink the invoice from the foreign clearing leg
                                                  targetPath: $._ppfxAssocs
                                                  targetValueKind: Array
                                                  targetValueWriteMode: Append
                                                  updateKind: Delete
                                                  originRtIdPath: $._ppfxTwinDocs[0].Items[0].RtId
                                                  originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                                  targetRtIdPath: $.key.RtId
                                                  targetCkTypeId: Basic.Accounting/BankTransaction
                                                  associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                                - type: CreateUpdateInfo@1
                                                  description: EUR giro leg becomes the matched booking leg (its Amount is the real EUR value)
                                                  targetPath: $._ppfxUpdates
                                                  targetValueKind: Array
                                                  targetValueWriteMode: Overwrite
                                                  updateKind: Update
                                                  ckTypeId: Basic.Accounting/BankTransaction
                                                  rtIdPath: $.full.key.RtId
                                                  attributeUpdates:
                                                    - attributeName: MatchState
                                                      attributeValueType: Enum
                                                      value: Matched
                                                    - attributeName: MatchComment
                                                      attributeValueType: String
                                                      value: PayPal foreign-currency purchase, booked in EUR (auto)
                                                - type: CreateUpdateInfo@1
                                                  description: Foreign PayPal-ledger leg is a clearing duplicate
                                                  targetPath: $._ppfxUpdates
                                                  targetValueKind: Array
                                                  targetValueWriteMode: Append
                                                  updateKind: Update
                                                  ckTypeId: Basic.Accounting/BankTransaction
                                                  rtIdPath: $.key.RtId
                                                  attributeUpdates:
                                                    - attributeName: MatchState
                                                      attributeValueType: Enum
                                                      value: Ignored
                                                    - attributeName: MatchComment
                                                      attributeValueType: String
                                                      value: PayPal foreign-currency clearing leg, booked on the EUR giro leg (auto)
                                                # Stamp the invoice with the foreign leg's currency so foreign
                                                # invoices are not summed as EUR (AB#4612). Requires the adapter
                                                # to carry model >=1.10.0 (Currency attribute); a stale CK cache
                                                # silently drops the write (AB#4456) — restart the adapter after
                                                # the model bump.
                                                - type: CreateUpdateInfo@1
                                                  description: Stamp the invoice currency from the foreign clearing leg
                                                  targetPath: $._ppfxUpdates
                                                  targetValueKind: Array
                                                  targetValueWriteMode: Append
                                                  updateKind: Update
                                                  ckTypeId: Meshmakers.Accounting/AccountingDocument
                                                  rtIdPath: $._ppfxTwinDocs[0].Items[0].RtId
                                                  attributeUpdates:
                                                    - attributeName: Currency
                                                      attributeValueType: String
                                                      valuePath: $.key.Attributes.Currency
                                                - type: ApplyChanges@2
                                                  description: Persist the cross-currency bridge
                                                  entityUpdatesPath: $._ppfxUpdates
                                                  associationUpdatesPath: $._ppfxAssocs
            # --- Document-number pass (AB#4542) — the transfer purpose often
            #     carries the exact document number, the strongest deterministic
            #     signal there is. It covers what the amount passes cannot see:
            #     payments made weeks after the document date and net-of-VAT
            #     transfers (invoice gross 7.68, transferred 6.40 = net, purpose
            #     "150418325"). Doc-driven: for every OPEN document with a
            #     sufficiently distinctive number, accept the SINGLE pending
            #     transaction of the right direction whose purpose contains that
            #     number — but only when the paid amount equals the document's
            #     gross OR net total. The amount guard keeps interest bookings
            #     and collective transfers that merely REFERENCE the number from
            #     settling the document. Deliberately no date window: purpose +
            #     amount + direction anchors harder than booking proximity.
            - type: GetRtEntitiesByType@1
              description: Open documents for the document-number pass
              ckTypeId: Meshmakers.Accounting/AccountingDocument
              targetPath: $.dnDocs
              take: 500
              fieldFilters:
                - attributePath: DocumentState
                  operator: Equals
                  comparisonValue: 0
            - type: ForEach@1
              description: Document-number pass — unique pending transaction whose purpose contains the document number
              iterationPath: $.dnDocs.Items
              targetPath: $.dnResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                # Number guards: at least 5 characters, only literal characters
                # that are safe inside the Like filter (Like builds an UNESCAPED
                # regex server-side), and at least one run of 4 digits so short
                # generic tokens ("2025", "A-1") can never anchor a match.
                # RegexMatch is null-safe — numberless documents fall through.
                - type: If@1
                  description: Document number has at least 5 characters
                  path: $.key.Attributes.DocumentNumber
                  operator: RegexMatch
                  value: .{5,}
                  valueType: String
                  transformations:
                    - type: If@1
                      description: …contains only literal characters safe for the Like filter
                      path: $.key.Attributes.DocumentNumber
                      operator: RegexMatch
                      value: ^[A-Za-z0-9 ./_-]+$
                      valueType: String
                      transformations:
                        - type: If@1
                          description: …and carries a run of at least 4 digits
                          path: $.key.Attributes.DocumentNumber
                          operator: RegexMatch
                          value: '[0-9]{4}'
                          valueType: String
                          transformations:
                            - type: SetPrimitiveValue@1
                              description: An INCOMING document is paid by a Debit (default)
                              targetPath: $.key._dnWantedDir
                              value: 1
                              valueType: Int
                            - type: If@1
                              description: OUTGOING document — expect an incoming Credit
                              path: $.key.Attributes.DocumentType
                              operator: Equals
                              value: 1
                              valueType: Int64
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.key._dnWantedDir
                                  value: 0
                                  valueType: Int
                            - type: GetRtEntitiesByType@1
                              description: Pending transactions of the right direction whose purpose contains the document number
                              ckTypeId: Basic.Accounting/BankTransaction
                              targetPath: $.key._dnTxs
                              take: 5
                              fieldFilters:
                                - attributePath: MatchState
                                  operator: In
                                  comparisonValue:
                                    - 0
                                    - 2
                                - attributePath: Direction
                                  operator: Equals
                                  comparisonValuePath: $.key._dnWantedDir
                                - attributePath: Purpose
                                  operator: Like
                                  comparisonValuePath: $.key.Attributes.DocumentNumber
                            - type: If@1
                              description: At least one pending transaction references the document number
                              path: $.key._dnTxs.TotalCount
                              operator: GreaterEqualsThan
                              value: 1
                              valueType: Int64
                              transformations:
                                # The paid total is the SUM over all purpose hits:
                                # split payments (net first, VAT transferred
                                # separately weeks later — troii case) settle as a
                                # whole when the parts add up to the gross total.
                                - type: SumAggregation@1
                                  description: Signed sum over all purpose hits
                                  targetPath: $.key._dnSumSigned
                                  aggregations:
                                    - path: $.key._dnTxs.Items[*]
                                      aggregationPath: $.Attributes.Amount
                                      value: 1
                                      filterPath: null
                                      comparisonValue: null
                                - type: Math@1
                                  description: Paid total (Credit default = signed sum)
                                  path: $.key
                                  itemPath: $._dnSumSigned
                                  itemTargetPath: $._dnPaidAbs
                                  operation: Multiply
                                  value: 1
                                - type: If@1
                                  description: Debit — invert the sign to get the positive paid total
                                  path: $.key._dnWantedDir
                                  operator: Equals
                                  value: 1
                                  valueType: Int
                                  transformations:
                                    - type: Math@1
                                      path: $.key
                                      itemPath: $._dnSumSigned
                                      itemTargetPath: $._dnPaidAbs
                                      operation: Multiply
                                      value: -1
                                - type: SetPrimitiveValue@1
                                  description: Amount not plausible yet (default)
                                  targetPath: $.key._dnAmountOk
                                  value: 0
                                  valueType: Int
                                # Float-safe amount check — a sum of doubles (6.40
                                # + 1.28) need not be bit-equal to 7.68, so the
                                # paid total must lie within ±0.005 of the target.
                                # GreaterThan on a Double path is null-safe (a
                                # null/missing GrossTotal simply fails the
                                # comparison — RegexMatch would THROW on numeric
                                # attributes) and keeps the GrossTotal-0
                                # extraction defect from ever matching.
                                - type: If@1
                                  description: Document carries a positive gross total
                                  path: $.key.Attributes.GrossTotal
                                  operator: GreaterThan
                                  value: 0
                                  valueType: Double
                                  transformations:
                                    - type: Math@1
                                      description: Gross band floor
                                      path: $.key
                                      itemPath: $.Attributes.GrossTotal
                                      itemTargetPath: $._dnGrossLo
                                      operation: Subtract
                                      value: 0.005
                                    - type: Math@1
                                      description: Gross band cap
                                      path: $.key
                                      itemPath: $.Attributes.GrossTotal
                                      itemTargetPath: $._dnGrossHi
                                      operation: Add
                                      value: 0.005
                                    - type: If@1
                                      description: Paid total no less than the gross band floor
                                      path: $.key._dnPaidAbs
                                      operator: GreaterEqualsThan
                                      valuePath: $.key._dnGrossLo
                                      valueType: Double
                                      transformations:
                                        - type: If@1
                                          description: …and no more than the gross band cap — amount plausible
                                          path: $.key._dnPaidAbs
                                          operator: LessEqualsThan
                                          valuePath: $.key._dnGrossHi
                                          valueType: Double
                                          transformations:
                                            - type: SetPrimitiveValue@1
                                              targetPath: $.key._dnAmountOk
                                              value: 1
                                              valueType: Int
                                # A SINGLE transaction paying exactly the net total
                                # is also plausible (transfer without VAT, e.g.
                                # reverse charge) — never accepted for multiple
                                # hits, where only the gross sum counts.
                                - type: If@1
                                  description: Exactly one hit — also accept the net total
                                  path: $.key._dnTxs.TotalCount
                                  operator: Equals
                                  value: 1
                                  valueType: Int64
                                  transformations:
                                    - type: If@1
                                      description: Document carries a positive net total (null-safe numeric guard)
                                      path: $.key.Attributes.NetTotal
                                      operator: GreaterThan
                                      value: 0
                                      valueType: Double
                                      transformations:
                                        - type: Math@1
                                          description: Net band floor
                                          path: $.key
                                          itemPath: $.Attributes.NetTotal
                                          itemTargetPath: $._dnNetLo
                                          operation: Subtract
                                          value: 0.005
                                        - type: Math@1
                                          description: Net band cap
                                          path: $.key
                                          itemPath: $.Attributes.NetTotal
                                          itemTargetPath: $._dnNetHi
                                          operation: Add
                                          value: 0.005
                                        - type: If@1
                                          description: Paid amount no less than the net band floor
                                          path: $.key._dnPaidAbs
                                          operator: GreaterEqualsThan
                                          valuePath: $.key._dnNetLo
                                          valueType: Double
                                          transformations:
                                            - type: If@1
                                              description: …and no more than the net band cap — amount plausible
                                              path: $.key._dnPaidAbs
                                              operator: LessEqualsThan
                                              valuePath: $.key._dnNetHi
                                              valueType: Double
                                              transformations:
                                                - type: SetPrimitiveValue@1
                                                  targetPath: $.key._dnAmountOk
                                                  value: 1
                                                  valueType: Int
                                - type: If@1
                                  description: Amount plausible — settle the document and all referenced transactions
                                  path: $.key._dnAmountOk
                                  operator: Equals
                                  value: 1
                                  valueType: Int64
                                  transformations:
                                    - type: GetAssociationTargets@1
                                      description: Existing tx links on this document (idempotency guard, AB#4398)
                                      originRtIdPath: $.key.RtId
                                      originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                      targetCkTypeId: Basic.Accounting/BankTransaction
                                      associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                      graphDirection: Outbound
                                      targetPath: $.key._dnExisting
                                    - type: ForEach@1
                                      description: Mark every referenced transaction matched, link it when the document is not already linked
                                      iterationPath: $.key._dnTxs.Items
                                      targetPath: $.key._dnLinkResults
                                      targetValueKind: Simple
                                      targetValueWriteMode: Overwrite
                                      maxDegreeOfParallelism: 1
                                      transformations:
                                        - type: CreateUpdateInfo@1
                                          description: Transaction is matched (document number found in the transfer purpose)
                                          targetPath: $.key._upd
                                          updateKind: Update
                                          ckTypeId: Basic.Accounting/BankTransaction
                                          rtIdPath: $.key.RtId
                                          attributeUpdates:
                                            - attributeName: MatchState
                                              attributeValueType: Enum
                                              value: Matched
                                            - attributeName: MatchComment
                                              attributeValueType: String
                                              value: Auto-matched by document number in transfer purpose
                                        - type: If@1
                                          description: Create the link only when the document is not already linked (a stale link still settles via the existing one)
                                          path: $.full.key._dnExisting[0].TotalCount
                                          operator: Equals
                                          value: 0
                                          valueType: Int64
                                          transformations:
                                            - type: CreateAssociationUpdate@1
                                              description: Link document to transaction
                                              targetPath: $.key._assoc
                                              updateKind: Create
                                              originRtIdPath: $.full.key.RtId
                                              originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                              targetRtIdPath: $.key.RtId
                                              targetCkTypeId: Basic.Accounting/BankTransaction
                                              associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                    - type: Flatten@1
                                      description: Collect the transaction updates
                                      path: $.key._dnLinkResults[*]._upd
                                      targetPath: $.key._dnUpdates
                                      targetValueKind: Simple
                                      targetValueWriteMode: Overwrite
                                    - type: If@1
                                      description: Collect the new links (only produced when the document had none)
                                      path: $.key._dnExisting[0].TotalCount
                                      operator: Equals
                                      value: 0
                                      valueType: Int64
                                      transformations:
                                        - type: Flatten@1
                                          path: $.key._dnLinkResults[*]._assoc
                                          targetPath: $.key._dnAssocs
                                          targetValueKind: Simple
                                          targetValueWriteMode: Overwrite
                                    - type: CreateUpdateInfo@1
                                      description: Document is paid — PaidAmount is the total actually transferred (net-of-VAT transfers stay visible)
                                      targetPath: $.key._dnUpdates
                                      targetValueKind: Array
                                      targetValueWriteMode: Append
                                      updateKind: Update
                                      ckTypeId: Meshmakers.Accounting/AccountingDocument
                                      rtIdPath: $.key.RtId
                                      attributeUpdates:
                                        - attributeName: DocumentState
                                          attributeValueType: Enum
                                          value: PAID
                                        - attributeName: PaidAmount
                                          attributeValueType: Double
                                          valuePath: $.key._dnPaidAbs
                                    - type: ApplyChanges@2
                                      entityUpdatesPath: $.key._dnUpdates
                                      associationUpdatesPath: $.key._dnAssocs
            # --- Recurring-merchant series pass (AB#4542) — card-charging
            #     subscription vendors (HelloFresh & co) debit a few days
            #     BEFORE the invoice date and repeat identical amounts weekly.
            #     The exact pass cannot settle these: the charge lies outside
            #     its [-1,+14] window (charge precedes invoice), or several
            #     identical charges share one window (rival guard, by design).
            #     This pass compensates with a STRONGER anchor: the charge must
            #     carry the vendor-name prefix in its purpose AND match the
            #     gross total exactly, inside a [-7,+14] day window around the
            #     document date. Documents iterate OLDEST-FIRST with a
            #     per-document ApplyChanges, so a weekly chain unravels
            #     greedily: the earliest open document claims the earliest
            #     anchored charge, the next document the next one. Worst case
            #     within one merchant series is a swap of adjacent same-amount
            #     weeks — immaterial for bookkeeping.
            - type: GetRtEntitiesByType@1
              description: Open documents for the series pass, oldest first
              ckTypeId: Meshmakers.Accounting/AccountingDocument
              targetPath: $.srDocs
              take: 500
              sortOrders:
                - attributeName: DocumentDate
                  sortOrder: Ascending
              fieldFilters:
                - attributePath: DocumentState
                  operator: Equals
                  comparisonValue: 0
            - type: ForEach@1
              description: Series pass — earliest purpose-anchored charge settles the earliest open document
              iterationPath: $.srDocs.Items
              targetPath: $.srResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                # Guards: positive gross (GreaterThan/Double is null-safe — a
                # RegexMatch on a numeric attribute would throw), a document
                # date for the window, and a vendor name whose first 8
                # characters are Like-safe (Like builds an UNESCAPED regex) —
                # that prefix is the purpose anchor ("HelloFre" matches
                # "...HELLOFRESH BERLIN...", case-insensitively).
                - type: If@1
                  description: Document carries a positive gross total
                  path: $.key.Attributes.GrossTotal
                  operator: GreaterThan
                  value: 0
                  valueType: Double
                  transformations:
                    - type: If@1
                      description: Document carries a document date
                      path: $.key.Attributes.DocumentDate
                      operator: RegexMatch
                      value: .+
                      valueType: String
                      transformations:
                        # Nested-record shape: an RtRecord attribute serializes
                        # as { CkRecordId, Attributes: {...} } in the data
                        # context — the company name lives one level deeper than
                        # the fieldFilter path (Vendor.CompanyName) suggests.
                        - type: If@1
                          description: Vendor name is at least 8 Like-safe characters
                          path: $.key.Attributes.Vendor.Attributes.CompanyName
                          operator: RegexMatch
                          value: ^[A-Za-z0-9][A-Za-z0-9 .-]{7,}
                          valueType: String
                          transformations:
                            - type: TransformString@1
                              description: Purpose anchor = first 8 characters of the vendor name
                              path: $.key
                              sourcePath: $.Attributes.Vendor.Attributes.CompanyName
                              targetPath: $._srPrefix
                              operation: SubstringFromStart
                              length: 8
                            - type: Math@1
                              description: Expected signed charge (INCOMING default = negative gross)
                              path: $.key
                              itemPath: $.Attributes.GrossTotal
                              itemTargetPath: $._srAmount
                              operation: Multiply
                              value: -1
                            - type: If@1
                              description: OUTGOING document — expect an incoming Credit (positive amount)
                              path: $.key.Attributes.DocumentType
                              operator: Equals
                              value: 1
                              valueType: Int64
                              transformations:
                                - type: Math@1
                                  path: $.key
                                  itemPath: $.Attributes.GrossTotal
                                  itemTargetPath: $._srAmount
                                  operation: Multiply
                                  value: 1
                            - type: DateTime@1
                              description: Window floor = document date - 7 days (card charges precede the invoice)
                              operation: AddDays
                              path: $.key.Attributes.DocumentDate
                              value: -7
                              targetPath: $.key._srMin
                            - type: DateTime@1
                              description: Window cap = document date + 14 days
                              operation: AddDays
                              path: $.key.Attributes.DocumentDate
                              value: 14
                              targetPath: $.key._srMax
                            - type: GetRtEntitiesByType@1
                              description: Pending charges of the exact amount, purpose-anchored to the vendor, inside the window, earliest first
                              ckTypeId: Basic.Accounting/BankTransaction
                              targetPath: $.key._srTxs
                              take: 5
                              sortOrders:
                                - attributeName: BookingDate
                                  sortOrder: Ascending
                              fieldFilters:
                                - attributePath: MatchState
                                  operator: In
                                  comparisonValue:
                                    - 0
                                    - 2
                                - attributePath: Amount
                                  operator: Equals
                                  comparisonValuePath: $.key._srAmount
                                - attributePath: BookingDate
                                  operator: GreaterEqualThan
                                  comparisonValuePath: $.key._srMin
                                - attributePath: BookingDate
                                  operator: LessEqualThan
                                  comparisonValuePath: $.key._srMax
                                - attributePath: Purpose
                                  operator: Like
                                  comparisonValuePath: $.key._srPrefix
                            - type: If@1
                              description: At least one anchored charge — the earliest settles this document
                              path: $.key._srTxs.TotalCount
                              operator: GreaterEqualsThan
                              value: 1
                              valueType: Int64
                              transformations:
                                - type: GetAssociationTargets@1
                                  description: Existing tx links on this document (idempotency guard, AB#4398)
                                  originRtIdPath: $.key.RtId
                                  originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                  targetCkTypeId: Basic.Accounting/BankTransaction
                                  associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                  graphDirection: Outbound
                                  targetPath: $.key._srExisting
                                - type: If@1
                                  description: Create the link only when the document is not already linked (a stale link still settles via the existing one)
                                  path: $.key._srExisting[0].TotalCount
                                  operator: Equals
                                  value: 0
                                  valueType: Int64
                                  transformations:
                                    - type: CreateAssociationUpdate@1
                                      description: Link document to the earliest anchored charge
                                      targetPath: $.key._srAssocs
                                      targetValueKind: Array
                                      targetValueWriteMode: Append
                                      updateKind: Create
                                      originRtIdPath: $.key.RtId
                                      originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                      targetRtIdPath: $.key._srTxs.Items[0].RtId
                                      targetCkTypeId: Basic.Accounting/BankTransaction
                                      associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                - type: CreateUpdateInfo@1
                                  description: Document is paid
                                  targetPath: $.key._srUpdates
                                  targetValueKind: Array
                                  targetValueWriteMode: Append
                                  updateKind: Update
                                  ckTypeId: Meshmakers.Accounting/AccountingDocument
                                  rtIdPath: $.key.RtId
                                  attributeUpdates:
                                    - attributeName: DocumentState
                                      attributeValueType: Enum
                                      value: PAID
                                    - attributeName: PaidAmount
                                      attributeValueType: Double
                                      valuePath: $.key.Attributes.GrossTotal
                                - type: CreateUpdateInfo@1
                                  description: Transaction is matched (recurring merchant series)
                                  targetPath: $.key._srUpdates
                                  targetValueKind: Array
                                  targetValueWriteMode: Append
                                  updateKind: Update
                                  ckTypeId: Basic.Accounting/BankTransaction
                                  rtIdPath: $.key._srTxs.Items[0].RtId
                                  attributeUpdates:
                                    - attributeName: MatchState
                                      attributeValueType: Enum
                                      value: Matched
                                    - attributeName: MatchComment
                                      attributeValueType: String
                                      value: Auto-matched by recurring merchant series (vendor purpose anchor, exact amount)
                                - type: ApplyChanges@2
                                  entityUpdatesPath: $.key._srUpdates
                                  associationUpdatesPath: $.key._srAssocs
            # --- Multi-invoice upload sum pass (AB#4543) — one uploaded PDF can
            #     contain SEVERAL independent invoices (e.g. an Amazon marketplace
            #     order with one invoice per seller) that are settled by ONE
            #     payment over the total. The counterpart/purpose ("AMZN MKTP...")
            #     has no textual relation to the per-seller vendor names, so the
            #     purpose-anchored passes cannot link these, and the AI pass is
            #     unreliable here (no textual anchor, and its inline candidate
            #     list is take-capped). The upload itself is the deterministic
            #     anchor: for every OPEN document that came out of a multi-invoice
            #     upload, settle ALL sibling documents against the SINGLE pending
            #     transaction whose amount equals the sibling gross sum inside a
            #     [-7,+14] day window around the document date. All-or-nothing:
            #     the pass only fires while every sibling is still OPEN and
            #     unlinked, and the whole group commits in one ApplyChanges —
            #     re-runs skip settled groups, ambiguity (several candidate
            #     transactions) falls through to the AI/manual path.
            - type: GetRtEntitiesByType@1
              description: Open documents for the multi-invoice upload sum pass
              ckTypeId: Meshmakers.Accounting/AccountingDocument
              targetPath: $.miDocs
              take: 500
              fieldFilters:
                - attributePath: DocumentState
                  operator: Equals
                  comparisonValue: 0
            - type: ForEach@1
              description: Multi-invoice upload sum pass — settle all sibling documents of one upload against the single transaction over their sum
              iterationPath: $.miDocs.Items
              targetPath: $.miResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                - type: GetAssociationTargets@1
                  description: Upload (staging entity) this document came from
                  originRtIdPath: $.key.RtId
                  originCkTypeId: Meshmakers.Accounting/AccountingDocument
                  targetCkTypeId: Meshmakers.Accounting/UploadedDocument
                  associationRoleId: Meshmakers.Accounting/UploadedToDocument
                  graphDirection: Inbound
                  targetPath: $.key._miUpload
                - type: If@1
                  description: Document originates from an upload
                  path: $.key._miUpload[0].TotalCount
                  operator: GreaterEqualsThan
                  value: 1
                  valueType: Int64
                  transformations:
                    - type: GetAssociationTargets@1
                      description: All sibling documents of that upload (including this one)
                      originRtIdPath: $.key._miUpload[0].Items[0].RtId
                      originCkTypeId: Meshmakers.Accounting/UploadedDocument
                      targetCkTypeId: Meshmakers.Accounting/AccountingDocument
                      associationRoleId: Meshmakers.Accounting/UploadedToDocument
                      graphDirection: Outbound
                      targetPath: $.key._miSibs
                    - type: If@1
                      description: The upload produced SEVERAL documents — a multi-invoice PDF
                      path: $.key._miSibs[0].TotalCount
                      operator: GreaterThan
                      value: 1
                      valueType: Int64
                      transformations:
                        - type: ForEach@1
                          description: Check every sibling — open, unlinked, and collect its gross total
                          iterationPath: $.key._miSibs[0].Items
                          targetPath: $.key._miSibChecks
                          targetValueKind: Simple
                          targetValueWriteMode: Overwrite
                          maxDegreeOfParallelism: 1
                          transformations:
                            - type: SetPrimitiveValue@1
                              description: Sibling not settleable (default)
                              targetPath: $.key._open
                              value: 0
                              valueType: Int
                            - type: SetPrimitiveValue@1
                              targetPath: $.key._gross
                              value: 0
                              valueType: Double
                            - type: SetPrimitiveValue@1
                              description: Existing transaction links (default)
                              targetPath: $.key._links
                              value: 0
                              valueType: Int
                            - type: GetRtEntitiesByType@1
                              description: Load the sibling document (association targets carry no attributes)
                              ckTypeId: Meshmakers.Accounting/AccountingDocument
                              targetPath: $.sib
                              take: 1
                              fieldFilters:
                                - attributePath: RtId
                                  operator: Equals
                                  comparisonValuePath: $.key.RtId
                            - type: If@1
                              description: Sibling resolved
                              path: $.sib.TotalCount
                              operator: GreaterEqualsThan
                              value: 1
                              valueType: Int64
                              transformations:
                                - type: If@1
                                  description: Sibling is OPEN
                                  path: $.sib.Items[0].Attributes.DocumentState
                                  operator: Equals
                                  value: 0
                                  valueType: Int64
                                  transformations:
                                    - type: SetPrimitiveValue@1
                                      targetPath: $.key._open
                                      value: 1
                                      valueType: Int
                                - type: If@1
                                  description: Sibling carries a positive gross total (null-safe numeric guard)
                                  path: $.sib.Items[0].Attributes.GrossTotal
                                  operator: GreaterThan
                                  value: 0
                                  valueType: Double
                                  transformations:
                                    - type: SetPrimitiveValue@1
                                      targetPath: $.key._gross
                                      valuePath: $.sib.Items[0].Attributes.GrossTotal
                                      valueType: Double
                            - type: GetAssociationTargets@1
                              description: Existing transaction links of the sibling (idempotency guard, AB#4398)
                              originRtIdPath: $.key.RtId
                              originCkTypeId: Meshmakers.Accounting/AccountingDocument
                              targetCkTypeId: Basic.Accounting/BankTransaction
                              associationRoleId: Meshmakers.Accounting/TransactionToDocument
                              graphDirection: Outbound
                              targetPath: $.sibLinks
                            - type: SetPrimitiveValue@1
                              targetPath: $.key._links
                              valuePath: $.sibLinks[0].TotalCount
                              valueType: Int
                        - type: SumAggregation@1
                          description: Open siblings in the group
                          targetPath: $.key._miOpenCount
                          aggregations:
                            - path: $.key._miSibChecks[*]
                              aggregationPath: $._open
                              value: 1
                              filterPath: null
                              comparisonValue: null
                        - type: SumAggregation@1
                          description: Gross sum over the group
                          targetPath: $.key._miGrossSum
                          aggregations:
                            - path: $.key._miSibChecks[*]
                              aggregationPath: $._gross
                              value: 1
                              filterPath: null
                              comparisonValue: null
                        - type: SumAggregation@1
                          description: Pre-existing transaction links over the group
                          targetPath: $.key._miLinkSum
                          aggregations:
                            - path: $.key._miSibChecks[*]
                              aggregationPath: $._links
                              value: 1
                              filterPath: null
                              comparisonValue: null
                        - type: If@1
                          description: Every sibling is still OPEN — the group is settleable as a whole
                          path: $.key._miOpenCount
                          operator: Equals
                          valuePath: $.key._miSibs[0].TotalCount
                          valueType: Double
                          transformations:
                            - type: If@1
                              description: No sibling is linked to a transaction yet
                              path: $.key._miLinkSum
                              operator: Equals
                              value: 0
                              valueType: Double
                              transformations:
                                - type: If@1
                                  description: Group gross sum is positive
                                  path: $.key._miGrossSum
                                  operator: GreaterThan
                                  value: 0
                                  valueType: Double
                                  transformations:
                                    - type: If@1
                                      description: Document carries a document date for the window
                                      path: $.key.Attributes.DocumentDate
                                      operator: RegexMatch
                                      value: .+
                                      valueType: String
                                      transformations:
                                        - type: SetPrimitiveValue@1
                                          description: An INCOMING group is paid by a Debit (default)
                                          targetPath: $.key._miDir
                                          value: 1
                                          valueType: Int
                                        - type: Math@1
                                          description: Expected signed amount (Debit = negative gross sum)
                                          path: $.key
                                          itemPath: $._miGrossSum
                                          itemTargetPath: $._miAmt
                                          operation: Multiply
                                          value: -1
                                        - type: If@1
                                          description: OUTGOING group — expect an incoming Credit over the positive sum
                                          path: $.key.Attributes.DocumentType
                                          operator: Equals
                                          value: 1
                                          valueType: Int64
                                          transformations:
                                            - type: SetPrimitiveValue@1
                                              targetPath: $.key._miDir
                                              value: 0
                                              valueType: Int
                                            - type: Math@1
                                              path: $.key
                                              itemPath: $._miGrossSum
                                              itemTargetPath: $._miAmt
                                              operation: Multiply
                                              value: 1
                                        - type: Math@1
                                          description: Float-safe amount band floor
                                          path: $.key
                                          itemPath: $._miAmt
                                          itemTargetPath: $._miAmtLo
                                          operation: Subtract
                                          value: 0.005
                                        - type: Math@1
                                          description: Float-safe amount band cap
                                          path: $.key
                                          itemPath: $._miAmt
                                          itemTargetPath: $._miAmtHi
                                          operation: Add
                                          value: 0.005
                                        - type: DateTime@1
                                          description: Window floor = document date - 7 days (card charges can precede the invoice)
                                          operation: AddDays
                                          path: $.key.Attributes.DocumentDate
                                          value: -7
                                          targetPath: $.key._miMinDate
                                        - type: DateTime@1
                                          description: Window cap = document date + 14 days
                                          operation: AddDays
                                          path: $.key.Attributes.DocumentDate
                                          value: 14
                                          targetPath: $.key._miMaxDate
                                        - type: GetRtEntitiesByType@1
                                          description: Pending transactions matching the group sum inside the window
                                          ckTypeId: Basic.Accounting/BankTransaction
                                          targetPath: $.key._miTxs
                                          take: 5
                                          fieldFilters:
                                            - attributePath: MatchState
                                              operator: In
                                              comparisonValue:
                                                - 0
                                                - 2
                                            - attributePath: Direction
                                              operator: Equals
                                              comparisonValuePath: $.key._miDir
                                            - attributePath: Amount
                                              operator: GreaterEqualThan
                                              comparisonValuePath: $.key._miAmtLo
                                            - attributePath: Amount
                                              operator: LessEqualThan
                                              comparisonValuePath: $.key._miAmtHi
                                            - attributePath: BookingDate
                                              operator: GreaterEqualThan
                                              comparisonValuePath: $.key._miMinDate
                                            - attributePath: BookingDate
                                              operator: LessEqualThan
                                              comparisonValuePath: $.key._miMaxDate
                                        - type: If@1
                                          description: Exactly ONE candidate transaction — unambiguous, settle the whole group
                                          path: $.key._miTxs.TotalCount
                                          operator: Equals
                                          value: 1
                                          valueType: Int64
                                          transformations:
                                            - type: ForEach@1
                                              description: Settle every sibling document against the group transaction
                                              iterationPath: $.key._miSibChecks
                                              targetPath: $.key._miApply
                                              targetValueKind: Simple
                                              targetValueWriteMode: Overwrite
                                              maxDegreeOfParallelism: 1
                                              transformations:
                                                - type: CreateUpdateInfo@1
                                                  description: Sibling document is paid with its own gross total
                                                  targetPath: $.key._upd
                                                  updateKind: Update
                                                  ckTypeId: Meshmakers.Accounting/AccountingDocument
                                                  rtIdPath: $.key.RtId
                                                  attributeUpdates:
                                                    - attributeName: DocumentState
                                                      attributeValueType: Enum
                                                      value: PAID
                                                    - attributeName: PaidAmount
                                                      attributeValueType: Double
                                                      valuePath: $.key._gross
                                                - type: CreateAssociationUpdate@1
                                                  description: Link the sibling document to the group transaction
                                                  targetPath: $.key._assoc
                                                  updateKind: Create
                                                  originRtIdPath: $.key.RtId
                                                  originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                                  targetRtIdPath: $.full.key._miTxs.Items[0].RtId
                                                  targetCkTypeId: Basic.Accounting/BankTransaction
                                                  associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                            - type: Flatten@1
                                              description: Collect the sibling updates
                                              path: $.key._miApply[*]._upd
                                              targetPath: $.key._miUpdates
                                              targetValueKind: Simple
                                              targetValueWriteMode: Overwrite
                                            - type: Flatten@1
                                              description: Collect the sibling links
                                              path: $.key._miApply[*]._assoc
                                              targetPath: $.key._miAssocs
                                              targetValueKind: Simple
                                              targetValueWriteMode: Overwrite
                                            - type: CreateUpdateInfo@1
                                              description: Transaction is matched (multi-invoice upload sum)
                                              targetPath: $.key._miUpdates
                                              targetValueKind: Array
                                              targetValueWriteMode: Append
                                              updateKind: Update
                                              ckTypeId: Basic.Accounting/BankTransaction
                                              rtIdPath: $.key._miTxs.Items[0].RtId
                                              attributeUpdates:
                                                - attributeName: MatchState
                                                  attributeValueType: Enum
                                                  value: Matched
                                                - attributeName: MatchComment
                                                  attributeValueType: String
                                                  value: Auto-matched by multi-invoice upload sum (one PDF, several invoices)
                                            - type: ApplyChanges@2
                                              entityUpdatesPath: $.key._miUpdates
                                              associationUpdatesPath: $.key._miAssocs
            - type: GetRtEntitiesByType@1
              description: Transactions still unreviewed after the deterministic pass
              ckTypeId: Basic.Accounting/BankTransaction
              targetPath: $.aiTransactions
              take: 25
              fieldFilters:
                - attributePath: MatchState
                  operator: Equals
                  comparisonValue: 0
            - type: If@1
              description: AI fallback for the ambiguous rest
              path: $.aiTransactions.TotalCount
              operator: GreaterThan
              value: 0
              valueType: Int64
              transformations:
                - type: GetRtEntitiesByType@1
                  description: Candidate documents for the AI (all open)
                  ckTypeId: Meshmakers.Accounting/AccountingDocument
                  targetPath: $.openDocs
                  take: 200
                  # AB#4544: newest documents first — with more OPEN documents than
                  # the page size (bulk-upload days) the natural order dropped exactly
                  # the newest documents, which are the likeliest matches for pending
                  # transactions. Undated documents sort last.
                  sortOrders:
                    - sortOrder: Descending
                      attributeName: DocumentDate
                  fieldFilters:
                    - attributePath: DocumentState
                      operator: Equals
                      comparisonValue: 0
                # path MUST point at a concrete value: the node treats path "$"
                # as "no main content" (MCP-only mode) and silently skips the AI
                # call when no MCP server is configured.
                - type: AnthropicAiQuery@1
                  apiKeyConfigurationName: AnthropicAiConfig
                  description: Match remaining transactions against open documents
                  path: $.aiTransactions
                  dataPaths:
                    - $.openDocs
                  responseFormat: json
                  # AB#4544: 4000 was too tight for a full 25-transaction batch —
                  # responses of ~8k characters were cut mid-JSON ("No JSON block
                  # found in response"), which is exactly the degraded case the
                  # guards below catch. 8000 gives the answer room to finish.
                  maxTokens: 8000
                  temperature: 0.0
                  question: >-
                    Match each bank transaction in the main content (aiTransactions, Items array)
                    to the open accounting document(s) from $.openDocs (Items array) that it pays.
                    Every transaction must appear in exactly one of the two result lists.
                  systemPrompt: >-
                    You are a bank reconciliation assistant. The main content holds the bank
                    transactions (Items array); the additional context from $.openDocs holds the
                    open accounting documents (Items array).

                    RULES:
                    1. A Debit transaction (Direction 1, negative Amount) pays INCOMING documents; a Credit transaction (Direction 0) settles OUTGOING documents.
                    2. Single match: abs(transaction Amount) equals the document GrossTotal (allow small deviations only for obvious bank fees) AND the counterpart name or purpose plausibly relates to the document vendor/customer, AND the BookingDate is within 90 days of the DocumentDate.
                    3. Collective match (AB#4510): one transaction may settle SEVERAL documents at once — a typical case is an expense reimbursement transfer to an employee covering many receipts. Put multiple documents into documentRtIds ONLY when the SUM of their GrossTotals equals abs(transaction Amount) (allow small deviations only for obvious bank fees) AND all documents plausibly belong to that one payment (e.g. the purpose hints at a reimbursement or collective transfer, or all documents share the counterpart). Each document must still satisfy the 90-day date rule.
                    4. Only match when you are confident. When several assignments are equally plausible, do NOT match.
                    5. transactionRtId and every entry of documentRtIds MUST be the exact 24-character hex RtId values from the input items — never invent or modify them. documentRtIds MUST be a non-empty array (a single match is an array with one entry).
                    6. Every transaction from aiTransactions.Items must appear either in matches or in unmatched.
                    7. NEVER output duplicates: each transactionRtId appears at most once across the whole result, and each document RtId is used at most once across ALL documentRtIds arrays. A document already paid by one transaction cannot pay another. When in doubt, put the transaction in unmatched.
                  jsonFormatSample: '{"matches": [{"transactionRtId": "69b858129a7ae6defef1ba39", "documentRtIds": ["69b858129a7ae6defef1ba40"], "reason": "Amount 90.00 matches invoice R-2026-014 from Anthropic"}, {"transactionRtId": "69b858129a7ae6defef1ba42", "documentRtIds": ["69b858129a7ae6defef1ba43", "69b858129a7ae6defef1ba44"], "reason": "Reimbursement 145.50 = 100.00 + 45.50, purpose Spesen Mueller"}], "unmatched": ["69b858129a7ae6defef1ba41"]}'
                  targetPath: $.ai
                # AB#4544: a degraded AI response (API error, refusal, malformed or
                # truncated JSON) carries no matches/unmatched arrays — the ForEach
                # nodes below would then FAIL the whole run ('the value in the
                # pipeline is not an array'), nothing of the batch would be committed
                # and the same 25 transactions would loop forever. Guard each loop on
                # its first element (RegexMatch is null-safe; the guarded values are
                # strings, never numbers — cf. the RegexMatch-on-number trap): an
                # empty or missing list simply skips the loop, the batch stays
                # Unreviewed and is retried on the next run — same degraded-mode
                # philosophy as AB#4541.
                - type: If@1
                  description: AI returned a usable matches list (degraded-response guard, AB#4544)
                  path: $.ai.matches[0].transactionRtId
                  operator: RegexMatch
                  value: ".+"
                  valueType: String
                  transformations:
                    - type: ForEach@1
                      description: Apply AI matches
                      iterationPath: $.ai.matches
                      targetPath: $.aiApplied
                      targetValueKind: Simple
                      targetValueWriteMode: Overwrite
                      maxDegreeOfParallelism: 1
                      transformations:
                        # AB#4510: a match carries a documentRtIds LIST — a collective
                        # transfer (e.g. an expense reimbursement) settles several
                        # documents with one transaction. Link and settle each document
                        # in turn, then mark the transaction matched once.
                        - type: ForEach@1
                          description: Link and settle every document of this match
                          iterationPath: $.key.documentRtIds
                          targetPath: $.key._aiDocResults
                          targetValueKind: Simple
                          targetValueWriteMode: Overwrite
                          maxDegreeOfParallelism: 1
                          transformations:
                            - type: GetAssociationTargets@1
                              # Idempotency (AB#4398): the AI can repeat a document across
                              # matches despite the prompt, and a prior pass may already have
                              # linked this document. ApplyChanges runs per iteration, so the
                              # first commit is visible here — create the link only when the
                              # document is not already linked; the PAID update below runs
                              # regardless (idempotent).
                              description: Existing tx links on this document (idempotency guard, AB#4398)
                              originRtIdPath: $.key
                              originCkTypeId: Meshmakers.Accounting/AccountingDocument
                              targetCkTypeId: Basic.Accounting/BankTransaction
                              associationRoleId: Meshmakers.Accounting/TransactionToDocument
                              graphDirection: Outbound
                              targetPath: $._aiExisting
                            - type: If@1
                              description: Create the link only when the document is not already linked
                              path: $._aiExisting[0].TotalCount
                              operator: Equals
                              value: 0
                              valueType: Int64
                              transformations:
                                - type: CreateAssociationUpdate@1
                                  description: Link document to transaction
                                  targetPath: $._aiAssocs
                                  targetValueKind: Array
                                  targetValueWriteMode: Append
                                  updateKind: Create
                                  originRtIdPath: $.key
                                  originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                  targetRtIdPath: $.full.key.transactionRtId
                                  targetCkTypeId: Basic.Accounting/BankTransaction
                                  associationRoleId: Meshmakers.Accounting/TransactionToDocument
                            - type: GetRtEntitiesById@1
                              description: Load the matched document to read its gross total for PaidAmount (AB#4433)
                              rtIdsPath: $.key
                              ckTypeId: Meshmakers.Accounting/AccountingDocument
                              targetPath: $._aiDoc
                            - type: CreateUpdateInfo@1
                              description: Document is paid
                              targetPath: $._aiUpdates
                              targetValueKind: Array
                              targetValueWriteMode: Append
                              updateKind: Update
                              ckTypeId: Meshmakers.Accounting/AccountingDocument
                              rtIdPath: $.key
                              attributeUpdates:
                                - attributeName: DocumentState
                                  attributeValueType: Enum
                                  value: PAID
                                # AB#4433: mirror the deterministic/tolerance passes —
                                # PaidAmount is the document's own gross total (for a
                                # collective transfer each document carries its share).
                                - attributeName: PaidAmount
                                  attributeValueType: Double
                                  valuePath: $._aiDoc.Items[0].Attributes.GrossTotal
                            - type: ApplyChanges@2
                              entityUpdatesPath: $._aiUpdates
                              associationUpdatesPath: $._aiAssocs
                        - type: CreateUpdateInfo@1
                          description: Transaction is matched
                          targetPath: $._aiTxUpdates
                          targetValueKind: Array
                          targetValueWriteMode: Append
                          updateKind: Update
                          ckTypeId: Basic.Accounting/BankTransaction
                          rtIdPath: $.key.transactionRtId
                          attributeUpdates:
                            - attributeName: MatchState
                              attributeValueType: Enum
                              value: Matched
                        - type: ApplyChanges@2
                          entityUpdatesPath: $._aiTxUpdates
                - type: If@1
                  description: AI returned a usable unmatched list (degraded-response guard, AB#4544)
                  path: $.ai.unmatched[0]
                  operator: RegexMatch
                  value: ".+"
                  valueType: String
                  transformations:
                    - type: ForEach@1
                      description: Mark transactions the AI could not assign
                      iterationPath: $.ai.unmatched
                      targetPath: $.aiUnmatched
                      targetValueKind: Simple
                      targetValueWriteMode: Overwrite
                      maxDegreeOfParallelism: 1
                      transformations:
                        - type: CreateUpdateInfo@1
                          description: Transaction could not be assigned
                          targetPath: $._unmatchedUpdates
                          targetValueKind: Array
                          targetValueWriteMode: Append
                          updateKind: Update
                          ckTypeId: Basic.Accounting/BankTransaction
                          rtIdPath: $.key
                          attributeUpdates:
                            - attributeName: MatchState
                              attributeValueType: Enum
                              value: Unmatched
                        - type: ApplyChanges@2
                          entityUpdatesPath: $._unmatchedUpdates
                - type: If@1
                  # AB#4544: If@1 'Equals' with no configured value compares against
                  # null — true only when the path yields nothing. Both lists
                  # empty/missing although transactions were pending means the
                  # response was degraded (prompt rule 6: every transaction must
                  # appear in exactly one of the two lists).
                  description: Degraded AI response — no matches list (AB#4544)
                  path: $.ai.matches[0].transactionRtId
                  operator: Equals
                  valueType: String
                  transformations:
                    - type: If@1
                      description: ...and no unmatched list — batch stays Unreviewed for the next run
                      path: $.ai.unmatched[0]
                      operator: Equals
                      valueType: String
                      transformations:
                        # This branch is the remaining SOFT-degraded case: the model
                        # answered but returned neither a matches nor an unmatched array
                        # (a refusal or JSON that could not be parsed as the expected
                        # shape). HARD token/API failures — output truncated at
                        # max_tokens, a rate-limit / token-quota 429, an overloaded 529,
                        # or an input over the context window — now fail the AnthropicAiQuery
                        # node with a specific message that is recorded on the pipeline
                        # execution (Status=Failed, ErrorMessage), so those causes are
                        # visible in the audit trail rather than folded into this log line.
                        - type: Logger@1
                          message: AI match pass received a soft-degraded AI response (model answered but with no usable matches/unmatched arrays — refusal or unparseable JSON) — leaving the batch Unreviewed for the next run. Hard token-limit / rate-limit / API errors instead fail the execution with a specific ErrorMessage in the pipeline execution audit trail (AB#4544).
            # --- Fiscal-year assignment pass (AB#4395) — runs LAST, after all
            #     matching passes, so a PAYMENTDATE-based document can follow a
            #     payment that was linked earlier in this very run. Assigns every
            #     document WITHOUT a DocumentToFiscalYear link to the fiscal year
            #     determined by that year's own PeriodBasis: DOCUMENTDATE (0,
            #     also the default when the attribute is unset) = DocumentDate in
            #     [StartDate, EndDate]; PAYMENTDATE (1) = a linked payment's
            #     BookingDate in range — an unpaid document then deliberately
            #     stays unassigned until it is matched. Fiscal years are iterated
            #     ascending by StartDate with first-match-wins, so for partial
            #     payments across a year boundary the earliest payment's year
            #     wins. A document whose date falls into no fiscal year stays
            #     unassigned (surfaced on the Handover page). Idempotency and
            #     manual override: the association is only ever CREATED when the
            #     document has none — an existing (manual or earlier) assignment
            #     is never touched (association adds are not idempotent, cf.
            #     AB#4433) and is re-checked inside each iteration because
            #     ApplyChanges persists immediately (this also prevents a double
            #     assignment when a DOCUMENTDATE year and a PAYMENTDATE year
            #     both contain the document). Date tests run in-pipeline with
            #     If@1 valueType DateTime — date field filters on dynamic CK
            #     attributes do not coerce (AB#4389). RECURRING master documents
            #     (state 4) are templates, not receipts, and are excluded (the
            #     NotEquals filter also matches documents without a state).
            #     Caps (AB#4702): 50 fiscal years, 2000 documents per run. The
            #     document load is sorted RtId DESCENDING (newest first), so
            #     newly created documents are always inside the window and the
            #     cap only ever cuts off the oldest (long-assigned) tail. There
            #     is NO paging — a run never revisits documents beyond the cap
            #     (an association-absence filter is not available in ad-hoc
            #     runtime queries), so the cap breach below is logged loudly
            #     instead of being silently ignored (which un-assigned 250+
            #     documents when the tenant crossed 1000 documents in 2026-08).
            - type: GetRtEntitiesByType@1
              description: Load fiscal years ascending by start date (first match wins)
              ckTypeId: Meshmakers.Accounting/FiscalYear
              targetPath: $.fyYears
              take: 50
              sortOrders:
                - sortOrder: Ascending
                  attributeName: StartDate
            - type: GetRtEntitiesByType@1
              description: Load documents newest-first (recurring masters excluded)
              ckTypeId: Meshmakers.Accounting/AccountingDocument
              targetPath: $.fyDocs
              take: 2000
              sortOrders:
                - sortOrder: Descending
                  attributeName: RtId
              fieldFilters:
                - attributePath: DocumentState
                  operator: NotEquals
                  comparisonValue: 4
            - type: If@1
              description: Document count exceeds the load cap — never skip silently (AB#4702)
              path: $.fyDocs.TotalCount
              operator: GreaterThan
              value: 2000
              valueType: Int64
              transformations:
                - type: Logger@1
                  message: FY assignment pass cap exceeded — more than 2000 non-recurring documents; documents beyond the 2000 newest are NOT checked this run. Raise the take cap or add paging (AB#4702).
            - type: ForEach@1
              description: Assign each unassigned document to its fiscal year
              iterationPath: $.fyDocs.Items
              targetPath: $.fyAssignResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                - type: GetAssociationTargets@1
                  description: Existing fiscal-year assignment (manual or auto — never overwritten)
                  originRtIdPath: $.key.RtId
                  originCkTypeId: Meshmakers.Accounting/AccountingDocument
                  targetCkTypeId: Meshmakers.Accounting/FiscalYear
                  associationRoleId: Meshmakers.Accounting/DocumentToFiscalYear
                  graphDirection: Outbound
                  targetPath: $.key._fyExisting
                - type: If@1
                  description: Unassigned — find the fiscal year by period basis
                  path: $.key._fyExisting[0].TotalCount
                  operator: Equals
                  value: 0
                  valueType: Int64
                  transformations:
                    - type: ForEach@1
                      description: Test each fiscal year by its own period basis
                      iterationPath: $.full.fyYears.Items
                      targetPath: $.key._fyLoop
                      targetValueKind: Simple
                      targetValueWriteMode: Overwrite
                      maxDegreeOfParallelism: 1
                      transformations:
                        # Normalize the optional PeriodBasis: seed the DOCUMENTDATE
                        # default, then copy the attribute over it when present —
                        # SelectByPath skips missing paths instead of throwing
                        # (FormatString errors on a missing path, nullValue only
                        # covers present-but-null).
                        - type: SetPrimitiveValue@1
                          description: Default period basis DOCUMENTDATE
                          targetPath: $.key._basis
                          value: 0
                          valueType: Int
                        - type: SelectByPath@1
                          description: Copy the fiscal year's PeriodBasis when present
                          selectPath:
                            - path: $.key.Attributes.PeriodBasis
                              targetPath: $.key._basis
                        - type: If@1
                          description: DOCUMENTDATE basis — the document date decides
                          path: $.key._basis
                          operator: NotEquals
                          value: 1
                          valueType: Int64
                          transformations:
                            - type: If@1
                              description: Document date on/after fiscal-year start
                              path: $.full.key.Attributes.DocumentDate
                              operator: GreaterEqualsThan
                              valuePath: $.key.Attributes.StartDate
                              valueType: DateTime
                              transformations:
                                - type: If@1
                                  description: Document date on/before fiscal-year end
                                  path: $.full.key.Attributes.DocumentDate
                                  operator: LessEqualsThan
                                  valuePath: $.key.Attributes.EndDate
                                  valueType: DateTime
                                  transformations:
                                    - type: GetAssociationTargets@1
                                      description: Re-check — an earlier fiscal-year iteration may have assigned already
                                      originRtIdPath: $.full.key.RtId
                                      originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                      targetCkTypeId: Meshmakers.Accounting/FiscalYear
                                      associationRoleId: Meshmakers.Accounting/DocumentToFiscalYear
                                      graphDirection: Outbound
                                      targetPath: $.key._fyRecheck
                                    - type: If@1
                                      description: Still unassigned — link document to this fiscal year
                                      path: $.key._fyRecheck[0].TotalCount
                                      operator: Equals
                                      value: 0
                                      valueType: Int64
                                      transformations:
                                        - type: CreateAssociationUpdate@1
                                          description: Document -> FiscalYear by document date
                                          targetPath: $.key._fyAssoc
                                          targetValueKind: Array
                                          targetValueWriteMode: Append
                                          updateKind: Create
                                          originRtIdPath: $.full.key.RtId
                                          originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                          targetRtIdPath: $.key.RtId
                                          targetCkTypeId: Meshmakers.Accounting/FiscalYear
                                          associationRoleId: Meshmakers.Accounting/DocumentToFiscalYear
                                        - type: ApplyChanges@2
                                          description: Persist the fiscal-year assignment
                                          associationUpdatesPath: $.key._fyAssoc
                        - type: If@1
                          description: PAYMENTDATE basis — a linked payment decides; unmatched documents stay unassigned
                          path: $.key._basis
                          operator: Equals
                          value: 1
                          valueType: Int64
                          transformations:
                            - type: GetAssociationTargets@1
                              description: Payments linked to the document
                              originRtIdPath: $.full.key.RtId
                              originCkTypeId: Meshmakers.Accounting/AccountingDocument
                              targetCkTypeId: Basic.Accounting/BankTransaction
                              associationRoleId: Meshmakers.Accounting/TransactionToDocument
                              graphDirection: Outbound
                              targetPath: $.key._fyTxs
                            - type: ForEach@1
                              description: Assign when a payment's booking date falls into this fiscal year
                              iterationPath: $.key._fyTxs[0].Items
                              targetPath: $.key._fyTxLoop
                              targetValueKind: Simple
                              targetValueWriteMode: Overwrite
                              maxDegreeOfParallelism: 1
                              transformations:
                                - type: If@1
                                  description: Booking date on/after fiscal-year start
                                  path: $.key.Attributes.BookingDate
                                  operator: GreaterEqualsThan
                                  valuePath: $.full.key.Attributes.StartDate
                                  valueType: DateTime
                                  transformations:
                                    - type: If@1
                                      description: Booking date on/before fiscal-year end
                                      path: $.key.Attributes.BookingDate
                                      operator: LessEqualsThan
                                      valuePath: $.full.key.Attributes.EndDate
                                      valueType: DateTime
                                      transformations:
                                        - type: GetAssociationTargets@1
                                          description: Re-check — an earlier payment or fiscal-year iteration may have assigned already
                                          originRtIdPath: $.full.full.key.RtId
                                          originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                          targetCkTypeId: Meshmakers.Accounting/FiscalYear
                                          associationRoleId: Meshmakers.Accounting/DocumentToFiscalYear
                                          graphDirection: Outbound
                                          targetPath: $.key._fyRecheck
                                        - type: If@1
                                          description: Still unassigned — link document to this fiscal year
                                          path: $.key._fyRecheck[0].TotalCount
                                          operator: Equals
                                          value: 0
                                          valueType: Int64
                                          transformations:
                                            - type: CreateAssociationUpdate@1
                                              description: Document -> FiscalYear by payment date
                                              targetPath: $.key._fyAssoc
                                              targetValueKind: Array
                                              targetValueWriteMode: Append
                                              updateKind: Create
                                              originRtIdPath: $.full.full.key.RtId
                                              originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                              targetRtIdPath: $.full.key.RtId
                                              targetCkTypeId: Meshmakers.Accounting/FiscalYear
                                              associationRoleId: Meshmakers.Accounting/DocumentToFiscalYear
                                            - type: ApplyChanges@2
                                              description: Persist the fiscal-year assignment
                                              associationUpdatesPath: $.key._fyAssoc
            # Security: the HTTP response body is the whole data context. Reduce
            # it to a minimal acknowledgement so it can never echo the caller's
            # request headers/Authorization or internal entity data.
            - type: SetPrimitiveValue@1
              targetPath: $.done
              value: true
              valueType: Boolean
            - type: Project@1
              clear: true
              fields:
                - path: $.done
                  inclusion: true
  # Cron trigger for the Match Transactions pipeline — replaces the former in-process
  # FromPolling (00:15:00). Scheduled by the Bot/Hangfire scheduler, so it survives
  # adapter hibernation (scale-to-zero co-wake, AB#4918/4984).
  - rtId: 67d4a2f0b2e4d8c3a1f00102
    ckTypeId: System.Communication/PipelineTrigger
    associations:
      - roleId: System/ParentChild
        targetRtId: 67d4a2f0b2e4d8c3a1f00100
        targetCkTypeId: System.Communication/DataFlow
      - roleId: System.Communication/Triggers
        targetRtId: 67d4a2f0b2e4d8c3a1f00101
        targetCkTypeId: System.Communication/Pipeline
    attributes:
      - id: System/Name
        value: Match Transactions Schedule
      - id: System/Description
        value: Runs the transaction matching pipeline every 15 minutes.
      - id: System/Enabled
        value: true
      - id: System.Bot/CronExpression
        value: "0 */15 * * * ?"
