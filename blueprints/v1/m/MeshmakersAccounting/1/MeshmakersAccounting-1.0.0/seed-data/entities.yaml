        value: Complete Web Form Import Pipeline
      - id: System/Enabled
        value: true
      - id: System.Communication/PipelineDefinition
        value: >-
          triggers:
            - type: FromHttpRequest@1
              path: /completeWebFormImport
              method: POST
          transformations:
            - type: GetPipelineConfigByWellKnownName@1
              wellKnownName: FinApiConfiguration
              targetPath: $.config
            - type: FinApiSetConfig@1
              baseUrlPath: $.config.baseUrl
              clientIdPath: $.config.clientId
              clientSecretPath: $.config.clientSecret
            - type: FinApiAuth@1
              description: Authenticate with finAPI (user token)
              targetPath: $.auth.accessToken
              targetValueWriteMode: Overwrite
              targetValueKind: Simple
              documentMode: Extend
              usernamePath: $.config.username
              passwordPath: $.config.password
            - type: FinApiGetWebFormStatus@1
              description: Check Web Form completion status
              accessTokenPath: $.auth.accessToken
              webFormIdPath: $.body.webFormId
              targetPath: $.webFormResult
              targetValueWriteMode: Overwrite
              targetValueKind: Simple
              documentMode: Extend
            - type: CreateUpdateInfo@1
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: Update
              ckTypeId: Basic.Accounting/BankConnection
              rtIdPath: $.body.bankConnectionRtId
              attributeUpdates:
                - attributeName: ExternalId
                  valuePath: $.finApiBankConnectionId
                  attributeValueType: String
                - attributeName: AccountIds
                  valuePath: $.finApiAccountIds
                  attributeValueType: IntArray
                - attributeName: SyncStatus
                  value: Connected
                  attributeValueType: String
                - attributeName: LastSuccessfulSync
                  attributeValueType: DateTime
                  valuePath: $.completedAt
            - type: ApplyChanges@2
              description: Persist BankConnection update
              entityUpdatesPath: $._updateItems
            # Security: reduce the HTTP response to just the web-form status
            # result (the status/accountIds it read) so it can never leak
            # finApiConfig (clientSecret/password/clientId/username), the finAPI
            # access token, or the caller's request headers/Authorization.
            - type: Project@1
              clear: true
              fields:
                - path: $.webFormResult
                  inclusion: true
  # --- Pipelines: sync-transactions ---
  - rtId: 67c9a1f0b2e4d8c3a1f00051
    ckTypeId: System.Communication/Pipeline
    associations:
      - roleId: System/ParentChild
        targetRtId: 67c9a1f0b2e4d8c3a1f00001
        targetCkTypeId: System.Communication/DataFlow
      - roleId: System.Communication/Executes
        targetRtId: 67e10c0bfe3e19891bbfd261
        targetCkTypeId: System.Communication/Adapter
      # finAPI credentials — the GlobalConfiguration is built from Uses associations.
      - roleId: System.Communication/Uses
        targetRtId: 67f0c00ec4ff02221e0b7004
        targetCkTypeId: System.Communication/FinApiConfiguration
    attributes:
      - id: System.Communication/DeploymentState
        value: 0
      - id: System/Name
        value: Sync Transactions Pipeline
      - id: System/Enabled
        value: true
      - id: System.Communication/PipelineDefinition
        value: >-
          triggers:
            - type: FromPolling@1
              interval: 01:00:00
            - type: FromHttpRequest@1
              path: /syncTransactions
              method: POST
          transformations:
            - type: GetPipelineConfigByWellKnownName@1
              wellKnownName: FinApiConfiguration
              targetPath: $.config
            - type: FinApiSetConfig@1
              baseUrlPath: $.config.baseUrl
              clientIdPath: $.config.clientId
              clientSecretPath: $.config.clientSecret
            - type: FinApiAuth@1
              description: Authenticate with finAPI (user token)
              targetPath: $.auth.accessToken
              targetValueWriteMode: Overwrite
              targetValueKind: Simple
              documentMode: Extend
              usernamePath: $.config.username
              passwordPath: $.config.password
            # --- Refresh finAPI's own data from the banks BEFORE fetching:
            # finAPI has no auto-update on our mandator, so without this the
            # fetch nodes only re-read whatever the last web-form interaction
            # left behind. The task-based background update completes headless
            # within a valid AIS consent window.
            - type: FinApiSyncBankConnection@1
              description: Update all bank connections at finAPI (background update task)
              accessTokenPath: $.auth.accessToken
            # --- Ensure BankAccount entities exist BEFORE importing transactions:
            # the transaction -> account ParentChild association is mandatory
            # (minimum multiplicity One), so an unknown account would make every
            # insert fail. Same upsert logic as the Sync Accounts pipeline.
            - type: FinApiFetchAccounts@1
              description: Fetch all bank accounts from finAPI
              accessTokenPath: $.auth.accessToken
              targetPath: $.finapi.accounts
              targetValueWriteMode: Append
              targetValueKind: Array
              documentMode: Extend
            - type: ForEach@1
              description: Upsert one BankAccount per finAPI account (idempotent by ExternalId)
              iterationPath: $.finapi.accounts
              targetPath: $.accountResult
              # Extend, NOT Replace — the config/auth/body context is still
              # needed by the transaction import steps after this loop.
              documentMode: Extend
              mergePath: $._accUpdates
              maxDegreeOfParallelism: 1
              transformations:
                - type: ConvertDataType@1
                  description: finAPI account id (number) as string for the ExternalId lookup
                  path: $.key.id
                  targetPath: $._externalId
                  valueType: String
                - type: GetOrCreateRtEntitiesByType@1
                  description: Resolve the existing BankAccount by ExternalId or generate a new id
                  ckTypeId: Basic.Accounting/BankAccount
                  fieldFilters:
                    - attributePath: ExternalId
                      operator: Equals
                      comparisonValuePath: $._externalId
                  rtIdTargetPath: $._accountRtId
                  ckTypeIdTargetPath: $._accountCkTypeId
                  modOperationPath: $._accountModOp
                - type: CreateUpdateInfo@1
                  description: Map finAPI account to BankAccount entity
                  targetPath: $._accUpdates._accountUpdate
                  updateKindPath: $._accountModOp
                  rtIdPath: $._accountRtId
                  ckTypeId: Basic.Accounting/BankAccount
                  attributeUpdates:
                    - attributeName: Name
                      valuePath: $.key.accountName
                      attributeValueType: String
                    - attributeName: ExternalId
                      valuePath: $._externalId
                      attributeValueType: String
                    - attributeName: Iban
                      valuePath: $.key.iban
                      attributeValueType: String
                    - attributeName: AccountNumber
                      valuePath: $.key.accountNumber
                      attributeValueType: String
                    - attributeName: AccountHolder
                      valuePath: $.key.accountName
                      attributeValueType: String
                    - attributeName: Currency
                      valuePath: $.key.accountCurrency
                      attributeValueType: String
                    - attributeName: Balance
                      valuePath: $.key.balance
                      attributeValueType: Double
                    - attributeName: Overdraft
                      valuePath: $.key.overdraft
                      attributeValueType: Double
                    - attributeName: AvailableFunds
                      valuePath: $.key.availableFunds
                      attributeValueType: Double
            - type: Flatten@1
              path: $.accountResult[*]._accountUpdate
              targetPath: $._accountUpdateItems
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
            - type: ApplyChanges@2
              description: Persist account updates before importing transactions
              entityUpdatesPath: $._accountUpdateItems
            # Stamp the REAL bank-data freshness, not the pipeline run time:
            # LastSuccessfulSync = newest OK bank update at finAPI, SyncStatus
            # honest (Connected / ActionRequired / Error). A connection whose
            # update fails (SCA required, bank down) keeps its old timestamp
            # so the UI shows how stale the data actually is.
            - type: FinApiFetchBankConnections@1
              description: Fetch per-connection bank-data freshness from finAPI
              accessTokenPath: $.auth.accessToken
              targetPath: $.finapi.connections
              targetValueWriteMode: Append
              targetValueKind: Array
              documentMode: Extend
            - type: ForEach@1
              description: Stamp bank-data freshness on each BankConnection
              iterationPath: $.finapi.connections
              targetPath: $.connResult
              documentMode: Extend
              mergePath: $._connUpdates
              maxDegreeOfParallelism: 1
              transformations:
                - type: ConvertDataType@1
                  description: finAPI connection id (number) as string for the ExternalId lookup
                  path: $.key.id
                  targetPath: $._connExternalId
                  valueType: String
                - type: GetRtEntitiesByType@1
                  description: Find the BankConnection imported for this finAPI connection
                  ckTypeId: Basic.Accounting/BankConnection
                  targetPath: $._conn
                  take: 1
                  fieldFilters:
                    - attributePath: ExternalId
                      operator: Equals
                      comparisonValuePath: $._connExternalId
                - type: If@1
                  description: Stamp only connections known to the tenant
                  path: $._conn.TotalCount
                  operator: GreaterThan
                  value: 0
                  valueType: Int64
                  transformations:
                    - type: If@1
                      description: Freshness known - stamp timestamp and status
                      path: $.key.hasSuccessfulUpdate
                      operator: Equals
                      value: true
                      valueType: Boolean
                      transformations:
                        - type: CreateUpdateInfo@1
                          targetPath: $._connUpdates._connUpdate
                          updateKind: Update
                          ckTypeId: Basic.Accounting/BankConnection
                          rtIdPath: $._conn.Items[0].RtId
                          attributeUpdates:
                            - attributeName: LastSuccessfulSync
                              attributeValueType: DateTime
                              valuePath: $.key.lastSuccessfulUpdate
                            - attributeName: SyncStatus
                              attributeValueType: String
                              valuePath: $.key.syncStatus
                            - attributeName: ConsentExpiresAt
                              attributeValueType: DateTime
                              valuePath: $.key.consentExpiresAt
                    - type: If@1
                      description: Never updated - stamp status only, keep old timestamp
                      path: $.key.hasSuccessfulUpdate
                      operator: Equals
                      value: false
                      valueType: Boolean
                      transformations:
                        - type: CreateUpdateInfo@1
                          targetPath: $._connUpdates._connUpdate
                          updateKind: Update
                          ckTypeId: Basic.Accounting/BankConnection
                          rtIdPath: $._conn.Items[0].RtId
                          attributeUpdates:
                            - attributeName: SyncStatus
                              attributeValueType: String
                              valuePath: $.key.syncStatus
                            - attributeName: ConsentExpiresAt
                              attributeValueType: DateTime
                              valuePath: $.key.consentExpiresAt
            - type: Flatten@1
              path: $.connResult[*]._connUpdate
              targetPath: $._connUpdateItems
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
            - type: ApplyChanges@2
              description: Persist connection sync timestamps
              entityUpdatesPath: $._connUpdateItems
            - type: FinApiFetchTransactions@1
              description: Fetch transactions of ALL accounts of the tenant finAPI user
              accessTokenPath: $.auth.accessToken
              minBookingDatePath: $.body.minBookingDate
              maxBookingDatePath: $.body.maxBookingDate
              targetPath: $.transactions
              targetValueWriteMode: Append
              targetValueKind: Array
              documentMode: Extend
            - type: ForEach@1
              description: Upsert one BankTransaction per finAPI booking (idempotent by TransactionId)
              iterationPath: $.transactions
              targetPath: $.result
              documentMode: Replace
              mergePath: $._updates
              maxDegreeOfParallelism: 1
              transformations:
                - type: ConvertDataType@1
                  description: finAPI transaction id (number) as string for the duplicate lookup
                  path: $.key.id
                  targetPath: $._txId
                  valueType: String
                - type: GetOrCreateRtEntitiesByType@1
                  description: Resolve the existing BankTransaction by TransactionId or generate a new id
                  ckTypeId: Basic.Accounting/BankTransaction
                  fieldFilters:
                    - attributePath: TransactionId
                      operator: Equals
                      comparisonValuePath: $._txId
                  rtIdTargetPath: $._txRtId
                  ckTypeIdTargetPath: $._txCkTypeId
                  modOperationPath: $._txModOp
                - type: If@1
                  description: Only insert new transactions — bookings are immutable and existing ones keep their MatchState
                  path: $._txModOp
                  operator: Equals
                  value: 0
                  valueType: Enum
                  transformations:
                    - type: ConvertDataType@1
                      description: finAPI account id (number) as string for the BankAccount lookup
                      path: $.key.accountId
                      targetPath: $._accountExternalId
                      valueType: String
                    - type: GetRtEntitiesByType@1
                      description: Find the BankAccount imported for this finAPI account
                      ckTypeId: Basic.Accounting/BankAccount
                      targetPath: $._account
                      take: 1
                      fieldFilters:
                        - attributePath: ExternalId
                          operator: Equals
                          comparisonValuePath: $._accountExternalId
                    # The ParentChild association to the BankAccount is MANDATORY
                    # (minimum multiplicity One) — never create a transaction
                    # without its account, the insert would fail.
                    - type: If@1
                      description: Insert only when the bank account is known
                      path: $._account.TotalCount
                      operator: GreaterThan
                      value: 0
                      valueType: Int64
                      transformations:
                        - type: CreateUpdateInfo@1
                          description: Map finAPI transaction to a new BankTransaction
                          targetPath: $._updates._txUpdate
                          updateKind: Insert
                          rtIdPath: $._txRtId
                          ckTypeId: Basic.Accounting/BankTransaction
                          attributeUpdates:
                            - attributeName: TransactionId
                              valuePath: $._txId
                              attributeValueType: String
                            - attributeName: Amount
                              valuePath: $.key.amount
                              attributeValueType: Double
                            - attributeName: Currency
                              valuePath: $.key.currency
                              attributeValueType: String
                            - attributeName: BookingDate
                              valuePath: $.key.bankBookingDate
                              attributeValueType: DateTime
                            - attributeName: ValueDate
                              valuePath: $.key.valueDate
                              attributeValueType: DateTime
                            - attributeName: Purpose
                              valuePath: $.key.purpose
                              attributeValueType: String
                            - attributeName: CounterpartName
                              valuePath: $.key.counterpartName
                              attributeValueType: String
                            - attributeName: CounterpartIban
                              valuePath: $.key.counterpartIban
                              attributeValueType: String
                            - attributeName: CounterpartBic
                              valuePath: $.key.counterpartBic
                              attributeValueType: String
                            - attributeName: EndToEndReference
                              valuePath: $.key.endToEndReference
                              attributeValueType: String
                            - attributeName: MandateReference
                              valuePath: $.key.mandateReference
                              attributeValueType: String
                            - attributeName: CreditorId
                              valuePath: $.key.creditorId
                              attributeValueType: String
                            - attributeName: BankTransactionCode
                              valuePath: $.key.bankTransactionCode
                              attributeValueType: String
                            - attributeName: Direction
                              valuePath: $.key.direction
                              attributeValueType: Int
                            - attributeName: MatchState
                              attributeValueType: Enum
                              value: Unreviewed
                        - type: CreateAssociationUpdate@1
                          description: BankTransaction -> BankAccount via ParentChild (mandatory)
                          targetPath: $._updates._assocUpdate
                          updateKind: Create
                          originRtIdPath: $._txRtId
                          originCkTypeId: Basic.Accounting/BankTransaction
                          targetRtIdPath: $._account.Items[0].RtId
                          targetCkTypeId: Basic.Accounting/BankAccount
                          associationRoleId: System/ParentChild
            - type: Flatten@1
              path: $.result[*]._txUpdate
              targetPath: $._flatUpdateItems
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
            - type: Flatten@1
              path: $.result[*]._assocUpdate
              targetPath: $._flatAssocItems
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
            - type: ApplyChanges@2
              description: Persist transaction inserts and account links to OctoMesh
              entityUpdatesPath: $._flatUpdateItems
              associationUpdatesPath: $._flatAssocItems
            - type: DateTime@1
              description: Sync completion timestamp
              operation: Now
              targetPath: $.syncTime
            # Security: reduce the HTTP response to just the sync completion
            # timestamp so it can never leak finApiConfig (clientSecret/password/
            # clientId/username), the finAPI access token, or the caller's
            # request headers/Authorization.
            - type: Project@1
              clear: true
              fields:
                - path: $.syncTime
                  inclusion: true
  # --- Pipelines: import-csv-transactions ---
  - rtId: 67d4a2f0b2e4d8c3a1f00050
    ckTypeId: System.Communication/DataFlow
    attributes:
      - id: System/Name
        value: CSV Transaction Import
      - id: System/Description
        value: Imports bank transactions from Austrian bank CSV exports (UTF-16LE, comma-delimited, German date/number format)
  - rtId: 67d4a2f0b2e4d8c3a1f00051
    ckTypeId: System.Communication/Pipeline
    associations:
      - roleId: System/ParentChild
        targetRtId: 67d4a2f0b2e4d8c3a1f00050
        targetCkTypeId: System.Communication/DataFlow
      - roleId: System.Communication/Executes
        targetRtId: "670000000000000000000002"
        targetCkTypeId: System.Communication/Adapter
    attributes:
      - id: System.Communication/DeploymentState
        value: 0
      - id: System/Name
        value: CSV Transaction Import Pipeline
      - id: System/Enabled
        value: true
      - id: System.Communication/PipelineDefinition
        value: >-
          triggers:
            - type: FromHttpRequest@1
              path: /importCsvTransactions
              method: POST
          transformations:
            - type: ImportFromCsv@1
              description: Parse uploaded CSV file with Austrian bank format
              fileIndex: 0
              delimiter: ","
              encoding: utf-16le
              hasHeaderRow: true
              targetPath: $.csvRows
              targetValueWriteMode: Overwrite
              targetValueKind: Simple
              documentMode: Extend
              columnMappings:
                - sourceColumn: Buchungsdatum
                  targetProperty: bookingDate
                  dataType: DateTime
                  dateFormat: dd.MM.yyyy
                - sourceColumn: Valutadatum
                  targetProperty: valueDate
                  dataType: DateTime
                  dateFormat: dd.MM.yyyy
                - sourceColumn: Betrag
                  targetProperty: amount
                  dataType: Double
                  numberCulture: de-AT
                - sourceColumn: "W\u00E4hrung"
                  targetProperty: currency
                  dataType: String
                - sourceColumn: Buchungs-Details
                  targetProperty: purpose
                  dataType: String
                - sourceColumn: Buchungsreferenz
                  targetProperty: transactionId
                  dataType: String
                - sourceColumn: Partnername
                  targetProperty: counterpartName
                  dataType: String
                - sourceColumn: Partner IBAN
                  targetProperty: counterpartIban
                  dataType: String
                - sourceColumn: BIC/SWIFT
                  targetProperty: counterpartBic
                  dataType: String
                - sourceColumn: Zahlungsreferenz
                  targetProperty: paymentReference
                  dataType: String
                - sourceColumn: Mandats ID
                  targetProperty: mandateReference
                  dataType: String
                - sourceColumn: Creditor ID
                  targetProperty: creditorId
                  dataType: String
                - sourceColumn: Eigene IBAN
                  targetProperty: ownerIban
                  dataType: String
            - type: ForEach@1
              description: Upsert BankTransaction entities from CSV rows (idempotent by TransactionId)
              iterationPath: $.csvRows
              targetPath: $._updateItems
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                - type: GetOrCreateRtEntitiesByType@1
                  description: Resolve the existing BankTransaction by TransactionId or generate a new id
                  ckTypeId: Basic.Accounting/BankTransaction
                  fieldFilters:
                    - attributePath: TransactionId
                      operator: Equals
                      comparisonValuePath: $.key.transactionId
                  rtIdTargetPath: $._txRtId
                  ckTypeIdTargetPath: $._txCkTypeId
                  modOperationPath: $._txModOp
                - type: If@1
                  description: Only insert new transactions — re-importing the same CSV is a no-op
                  path: $._txModOp
                  operator: Equals
                  value: 0
                  valueType: Enum
                  transformations:
                    - type: SetPrimitiveValue@1
                      description: Default direction Credit (incoming)
                      targetPath: $._direction
                      value: 0
                      valueType: Int
                    - type: If@1
                      description: Negative amount means Debit (outgoing)
                      path: $.key.amount
                      operator: LessThan
                      value: 0
                      valueType: Double
                      transformations:
                        - type: SetPrimitiveValue@1
                          targetPath: $._direction
                          value: 1
                          valueType: Int
                    - type: GetRtEntitiesByType@1
                      description: Find the BankAccount by the CSV owner IBAN
                      ckTypeId: Basic.Accounting/BankAccount
                      targetPath: $._account
                      take: 1
                      fieldFilters:
                        - attributePath: Iban
                          operator: Equals
                          comparisonValuePath: $.key.ownerIban
                    - type: CreateUpdateInfo@1
                      targetPath: $._txUpdate
                      targetValueKind: Array
                      targetValueWriteMode: Append
                      updateKind: Insert
                      ckTypeId: Basic.Accounting/BankTransaction
                      rtIdPath: $._txRtId
                      rtWellKnownNamePath: $.key.transactionId
                      attributeUpdates:
                        - attributeName: TransactionId
                          attributeValueType: String
                          valuePath: $.key.transactionId
                        - attributeName: Amount
                          attributeValueType: Double
                          valuePath: $.key.amount
                        - attributeName: Currency
                          attributeValueType: String
                          valuePath: $.key.currency
                        - attributeName: BookingDate
                          attributeValueType: DateTime
                          valuePath: $.key.bookingDate
                        - attributeName: ValueDate
                          attributeValueType: DateTime
                          valuePath: $.key.valueDate
                        - attributeName: Purpose
                          attributeValueType: String
                          valuePath: $.key.purpose
                        - attributeName: CounterpartName
                          attributeValueType: String
                          valuePath: $.key.counterpartName
                        - attributeName: CounterpartIban
                          attributeValueType: String
                          valuePath: $.key.counterpartIban
                        - attributeName: CounterpartBic
                          attributeValueType: String
                          valuePath: $.key.counterpartBic
                        - attributeName: PaymentReference
                          attributeValueType: String
                          valuePath: $.key.paymentReference
                        - attributeName: MandateReference
                          attributeValueType: String
                          valuePath: $.key.mandateReference
                        - attributeName: CreditorId
                          attributeValueType: String
                          valuePath: $.key.creditorId
                        - attributeName: Direction
                          attributeValueType: Int
                          valuePath: $._direction
                        - attributeName: MatchState
                          attributeValueType: Enum
                          value: Unreviewed
                    - type: If@1
                      description: Link the transaction to its bank account when known
                      path: $._account.TotalCount
                      operator: GreaterThan
                      value: 0
                      valueType: Int64
                      transformations:
                        - type: CreateAssociationUpdate@1
                          description: BankTransaction -> BankAccount via ParentChild
                          targetPath: $._assocUpdate
                          targetValueKind: Array
                          targetValueWriteMode: Append
                          updateKind: Create
                          originRtIdPath: $._txRtId
                          originCkTypeId: Basic.Accounting/BankTransaction
                          targetRtIdPath: $._account.Items[0].RtId
                          targetCkTypeId: Basic.Accounting/BankAccount
                          associationRoleId: System/ParentChild
                    - type: ApplyChanges@2
                      description: Persist transaction and association
                      entityUpdatesPath: $._txUpdate
                      associationUpdatesPath: $._assocUpdate
            # Security: the HTTP response body is the whole data context. Reduce
            # it to a minimal acknowledgement so it can never echo the caller's
            # request headers/Authorization or the raw uploaded CSV.
            - type: SetPrimitiveValue@1
              targetPath: $.done
              value: true
              valueType: Boolean
            - type: Project@1
              clear: true
              fields:
                - path: $.done
                  inclusion: true
  # PayPal activity CSV import (AB#4459): PayPal exports have a completely
  # different shape than the Austrian bank CSV above — UTF-8 with BOM,
  # columns Datum/Name/Typ/Status/Betrag/Transaktionscode, and a balancing
  # counter-row ("Allgemeine Gutschrift auf Kreditkarte") next to almost
  # every payment. Only negative completed payment rows are imported. The
  # PayPal account carries no IBAN, so the target BankAccount rtId is passed
  # by the frontend as the multipart form field `accountRtId` (the
  # ParentChild association is mandatory — rows without it would fail).
  - rtId: 67d4a2f0b2e4d8c3a1f00052
    ckTypeId: System.Communication/Pipeline
    associations:
      - roleId: System/ParentChild
        targetRtId: 67d4a2f0b2e4d8c3a1f00050
        targetCkTypeId: System.Communication/DataFlow
      - roleId: System.Communication/Executes
        targetRtId: "670000000000000000000002"
        targetCkTypeId: System.Communication/Adapter
    attributes:
      - id: System.Communication/DeploymentState
        value: 0
      - id: System/Name
        value: PayPal CSV Transaction Import Pipeline
      - id: System/Enabled
        value: true
      - id: System.Communication/PipelineDefinition
        value: >-
          triggers:
            - type: FromHttpRequest@1
              path: /importPayPalCsvTransactions
              method: POST
          transformations:
            - type: ImportFromCsv@1
              description: Parse uploaded PayPal activity CSV (UTF-8, German date/number format)
              fileIndex: 0
              delimiter: ","
              encoding: utf-8
              hasHeaderRow: true
              targetPath: $.csvRows
              targetValueWriteMode: Overwrite
              targetValueKind: Simple
              documentMode: Extend
              columnMappings:
                - sourceColumn: Datum
                  targetProperty: bookingDate
                  dataType: DateTime
                  dateFormat: dd.MM.yyyy
                - sourceColumn: Name
                  targetProperty: counterpartName
                  dataType: String
                - sourceColumn: Typ
                  targetProperty: paymentType
                  dataType: String
                - sourceColumn: Status
                  targetProperty: status
                  dataType: String
                - sourceColumn: "Währung"
                  targetProperty: currency
                  dataType: String
                - sourceColumn: Betrag
                  targetProperty: amount
                  dataType: Double
                  numberCulture: de-AT
                - sourceColumn: Empfangsnummer
                  targetProperty: paymentReference
                  dataType: String
                - sourceColumn: Transaktionscode
                  targetProperty: transactionId
                  dataType: String
                - sourceColumn: Artikelbezeichnung
                  targetProperty: transactionText
                  dataType: String
            - type: ForEach@1
              description: Insert one BankTransaction per completed negative PayPal payment (idempotent by TransactionId)
              iterationPath: $.csvRows
              targetPath: $._rowResults
              documentMode: Extend
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                - type: If@1
                  description: Only completed rows
                  path: $.key.status
                  operator: Equals
                  value: Abgeschlossen
                  valueType: String
                  transformations:
                    - type: If@1
                      description: Skip balancing credit-card funding rows
                      path: $.key.paymentType
                      operator: NotEquals
                      value: Allgemeine Gutschrift auf Kreditkarte
                      valueType: String
                      transformations:
                        - type: If@1
                          description: Skip currency conversion pairs
                          path: $.key.paymentType
                          operator: NotEquals
                          value: "Allgemeine Währungsumrechnung"
                          valueType: String
                          transformations:
                            - type: If@1
                              description: Only outgoing payments (negative amount)
                              path: $.key.amount
                              operator: LessThan
                              value: 0
                              valueType: Double
                              transformations:
                                - type: GetOrCreateRtEntitiesByType@1
                                  description: Resolve the existing BankTransaction by TransactionId or generate a new id
                                  ckTypeId: Basic.Accounting/BankTransaction
                                  fieldFilters:
                                    - attributePath: TransactionId
                                      operator: Equals
                                      comparisonValuePath: $.key.transactionId
                                  rtIdTargetPath: $._txRtId
                                  ckTypeIdTargetPath: $._txCkTypeId
                                  modOperationPath: $._txModOp
                                - type: If@1
                                  description: Only insert new transactions — re-importing the same CSV is a no-op
                                  path: $._txModOp
                                  operator: Equals
                                  value: 0
                                  valueType: Enum
                                  transformations:
                                    - type: CreateUpdateInfo@1
                                      targetPath: $._txUpdate
                                      targetValueKind: Array
                                      targetValueWriteMode: Append
                                      updateKind: Insert
                                      ckTypeId: Basic.Accounting/BankTransaction
                                      rtIdPath: $._txRtId
                                      rtWellKnownNamePath: $.key.transactionId
                                      attributeUpdates:
                                        - attributeName: TransactionId
                                          attributeValueType: String
                                          valuePath: $.key.transactionId
                                        - attributeName: Amount
                                          attributeValueType: Double
                                          valuePath: $.key.amount
                                        - attributeName: Currency
                                          attributeValueType: String
                                          valuePath: $.key.currency
                                        - attributeName: BookingDate
                                          attributeValueType: DateTime
                                          valuePath: $.key.bookingDate
                                        - attributeName: ValueDate
                                          attributeValueType: DateTime
                                          valuePath: $.key.bookingDate
                                        - attributeName: Purpose
                                          attributeValueType: String
                                          valuePath: $.key.paymentType
                                        - attributeName: TransactionText
                                          attributeValueType: String
                                          valuePath: $.key.transactionText
                                        - attributeName: CounterpartName
                                          attributeValueType: String
                                          valuePath: $.key.counterpartName
                                        - attributeName: PaymentReference
                                          attributeValueType: String
                                          valuePath: $.key.paymentReference
                                        - attributeName: Direction
                                          attributeValueType: Int
                                          value: 1
                                        - attributeName: MatchState
                                          attributeValueType: Enum
                                          value: Unreviewed
                                    - type: CreateAssociationUpdate@1
                                      description: BankTransaction -> BankAccount selected in the import dialog
                                      targetPath: $._assocUpdate
                                      targetValueKind: Array
                                      targetValueWriteMode: Append
                                      updateKind: Create
                                      originRtIdPath: $._txRtId
                                      originCkTypeId: Basic.Accounting/BankTransaction
                                      targetRtIdPath: $.full.formData.accountRtId
                                      targetCkTypeId: Basic.Accounting/BankAccount
                                      associationRoleId: System/ParentChild
                                    - type: ApplyChanges@2
                                      description: Persist transaction and association
                                      entityUpdatesPath: $._txUpdate
                                      associationUpdatesPath: $._assocUpdate
            # Security: the HTTP response body is the whole data context. Reduce
            # it to a minimal acknowledgement so it can never echo the caller's
            # request headers/Authorization or the raw uploaded CSV.
            - type: SetPrimitiveValue@1
              targetPath: $.done
              value: true
              valueType: Boolean
            - type: Project@1
              clear: true
              fields:
                - path: $.done
                  inclusion: true
  # --- Pipelines: ai-prompt ---
  - rtId: 67d4a2f0b2e4d8c3a1f000e0
    ckTypeId: System.Communication/DataFlow
    attributes:
      - id: System/Name
        value: AI Prompt
      - id: System/Description
        value: Interactive AI assistant that answers accounting questions and processes document uploads
  - rtId: 67d4a2f0b2e4d8c3a1f000e1
    ckTypeId: System.Communication/Pipeline
    associations:
      - roleId: System/ParentChild
        targetRtId: 67d4a2f0b2e4d8c3a1f000e0
        targetCkTypeId: System.Communication/DataFlow
      - roleId: System.Communication/Executes
        targetRtId: "670000000000000000000002"
        targetCkTypeId: System.Communication/Adapter
      # AI configuration lookup requires BOTH the apiKeyConfigurationName on the
      # node AND this Uses association (the adapter resolves the config through
      # the association, the name is validated against it).
      - roleId: System.Communication/Uses
        targetRtId: 67f0c00ec4ff02221e0b7003
        targetCkTypeId: System.Communication/AiConfiguration
      # AB#4315: MCP auth — the Q&A node's mcpServiceAccountConfigName resolves the
      # service-account credentials through this Uses association (same GlobalConfiguration
      # trap as AnthropicAiConfig: the name alone fails without the association).
      - roleId: System.Communication/Uses
        targetRtId: 67f0c00ec4ff02221e0b7002
        targetCkTypeId: System.Communication/ServiceAccountConfiguration
    attributes:
      - id: System.Communication/DeploymentState
        value: 0
      - id: System/Name
        value: AI Prompt Pipeline
      - id: System/Enabled
        value: true
      - id: System.Communication/PipelineDefinition
        value: >-
          triggers:
            - type: FromHttpRequest@1
              path: /aiPrompt
              method: POST
          transformations:
            - type: If@1
              description: PDF uploaded — process as document
              path: $.files[0].contentType
              operator: Equals
              value: "application/pdf"
              valueType: String
              transformations:
                - type: ComputeFileHash@1
                  description: Compute SHA-256 hash of uploaded file
                  path: $.files[0].data
                  targetPath: $.fileHash
                - type: CheckDuplicate@1
                  description: Check if this document was already uploaded
                  ckTypeId: Meshmakers.Accounting/AccountingDocument
                  attributeName: FileHash
                  valuePath: $.fileHash
                  targetPath: $.isDuplicate
                  existingEntityPath: $.existingDocument
                - type: If@1
                  description: Document already exists — inform user
                  path: $.isDuplicate
                  operator: Equals
                  value: true
                  valueType: Boolean
                  transformations:
                    - type: AnthropicAiQuery@1
                      apiKeyConfigurationName: AnthropicAiConfig
                      description: Inform about duplicate
                      path: $.existingDocument
                      responseFormat: text
                      temperature: 0.3
                      maxTokens: 500
                      question: >-
                        This document has already been uploaded and exists in the system.
                        Tell the user the existing document details (document number, vendor, date, amount).
                        Reply in German.
                      systemPrompt: >-
                        You are an accounting assistant. Inform the user that this is a duplicate.
                      targetPath: $.response
                      continueOnError: true
                - type: If@1
                  description: New document — process normally
                  path: $.isDuplicate
                  operator: NotEquals
                  value: true
                  valueType: Boolean
                  transformations:
                    - type: PdfOcrExtraction@1
                      description: Extract text from uploaded PDF
                      path: $.files[0].data
                      targetPath: $.ocr.result
                      language: de
                      maxFileSizeBytes: 10000000
                    # Load our own company profile so the AI can detect the invoice
                    # direction (see the Document Analysis pipeline for the rationale).
                    - type: GetRtEntitiesByType@1
                      description: Load our own company profile for invoice direction detection
                      ckTypeId: Meshmakers.Accounting/CompanyProfile
                      take: 1
                      targetPath: $.company
                    - type: AnthropicAiQuery@1
                      apiKeyConfigurationName: AnthropicAiConfig
                      description: Extract document metadata + detect direction
                      path: $.ocr.result
                      dataPaths:
                        - $.company
                      responseFormat: json
                      temperature: 0.1
                      question: >-
                        Extract accounting document information from the text in "Main Content". "Additional Context" contains OUR OWN company master data (name, address, VAT id, email) — the company this bookkeeping is done for; it may be empty. Every invoice has two parties: the ISSUER/SELLER (who sent the invoice and receives the money) and the RECIPIENT/BUYER (who is billed). ALWAYS put the issuer/seller into "vendor" and the recipient/buyer into "customer", regardless of which one is us. Determine "documentType": if OUR company (from Additional Context) is the issuer/seller, set it to "OUTGOING"; if OUR company is the recipient/buyer, set it to "INCOMING"; if Additional Context is empty or you cannot decide, use "INCOMING". Output documentType as exactly "INCOMING" or "OUTGOING". Set "extractionComplete" to true ONLY if you could extract documentNumber AND documentDate AND grossTotal; otherwise false. IMPORTANT for date fields (documentDate, dueDate): use ISO format yyyy-MM-dd, and if a date is not present on the document, OMIT that key entirely — never output an empty string "" for a date. Apply this postal-address rule to BOTH vendor and customer independently: if street, zipcode AND city are clearly present for that party, put them in that party's "address" object and set that party's "addressComplete" to true. For address.countryCode use the ISO 3166-1 alpha-2 country code printed on the document; if none is printed, INFER it from the address, language or currency (default "AT" for an Austrian address) — whenever you emit an address you MUST also output a non-empty 2-letter countryCode, never leave it blank. If street, zipcode OR city is missing for a party, OMIT that party's "address" object entirely (set its addressComplete to false). Additionally, for the VENDOR only, when its address is incomplete put the full sender address exactly as printed on the document into "vendor.addressNotes" (omit vendor.addressNotes too if no address is visible at all). Emit "iban" for a party only when an IBAN is printed for it (this is usually the vendor's). Additionally, from the payment/bank-details section (the IBAN block, typically labelled "Account name", "Kontoinhaber" or "Konto lautend auf"), extract the bank ACCOUNT HOLDER name into that party's "accountName". This is the name under which the bank account is held; it is often a trading or brand name that DIFFERS from the letterhead companyName and it is what shows up on the bank statement as the counterpart. Omit "accountName" if no account holder name is printed in the bank section.
                      jsonFormatSample: '{ "extractionComplete": true, "documentType": "INCOMING", "documentNumber": "RE-2026-001", "documentDate": "2026-03-01", "dueDate": "2026-03-31", "vendor": { "companyName": "Supplier GmbH", "iban": "AT123456789012345678", "accountName": "Supplier Trading Ltd", "address": { "street": "Hauptstrasse 1", "zipcode": "5020", "city": "Salzburg", "countryCode": "AT" }, "addressComplete": true }, "customer": { "companyName": "Our Company GmbH", "address": { "street": "Firmianstrasse 31A", "zipcode": "5020", "city": "Salzburg", "countryCode": "AT" }, "addressComplete": true }, "grossTotal": 1200.00, "netTotal": 1000.00, "taxTotal": 200.00, "taxRate": 20.0 }'
                      targetPath: $.ai.result
                      continueOnError: true
                    - type: CheckDuplicate@1
                      description: Check if document number already exists
                      ckTypeId: Meshmakers.Accounting/AccountingDocument
                      attributeName: DocumentNumber
                      valuePath: $.ai.result.documentNumber
                      targetPath: $.isDuplicate
                      existingEntityPath: $.existingDocument
                    - type: If@1
                      description: Document number already exists — inform user
                      path: $.isDuplicate
                      operator: Equals
                      value: true
                      valueType: Boolean
                      transformations:
                        - type: AnthropicAiQuery@1
                          apiKeyConfigurationName: AnthropicAiConfig
                          description: Inform about duplicate by document number
                          path: $.existingDocument
                          responseFormat: text
                          temperature: 0.3
                          maxTokens: 500
                          question: >-
                            A document with this document number already exists in the system. Tell the user the existing document details. Reply in German.
                          systemPrompt: >-
                            You are an accounting assistant. Inform the user that this is a duplicate document.
                          targetPath: $.response
                          continueOnError: true
                    - type: If@1
                      description: Document number is new — continue processing
                      path: $.isDuplicate
                      operator: NotEquals
                      value: true
                      valueType: Boolean
                      transformations:
                        - type: CreateFileSystemUpdate@1
                          description: Store PDF in file system
                          targetPath: $.fileSystemItem
                          path: $.files[0].data
                          generateRtId: true
                          fileNamePath: $.files[0].fileName
                          contentType: application/pdf
                          contentLengthPath: $.files[0].length
                          rootFolderWellKnownName: "Documents"
                        - type: If@1
                          description: Extraction successful — create AccountingDocument
                          path: $.ai.result.extractionComplete
                          operator: Equals
                          value: true
                          valueType: Boolean
                          transformations:
                            # Normalize the AI-detected direction to a guaranteed enum
                            # name (default INCOMING, promote to OUTGOING on exact match).
                            - type: SetPrimitiveValue@1
                              description: Default document direction
                              targetPath: $.docType
                              valueType: String
                              value: INCOMING
                            - type: If@1
                              description: Our company is the issuer — outgoing invoice
                              path: $.ai.result.documentType
                              operator: Equals
                              value: OUTGOING
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.docType
                                  valueType: String
                                  value: OUTGOING
                            # AB#4542: zero-total invoices (voucher/credit-settled)
                            # never see a payment — create them as PAID with
                            # NoTransactionExpected (same rule as the analysis
                            # pipeline; absent valuePath skips the attribute).
                            - type: SetPrimitiveValue@1
                              description: New documents await a payment (default)
                              targetPath: $.docState
                              valueType: String
                              value: OPEN
                            - type: If@1
                              description: Zero gross total — voucher/credit-settled, no payment expected
                              path: $.ai.result.grossTotal
                              operator: Equals
                              value: 0
                              valueType: Double
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.docState
                                  valueType: String
                                  value: PAID
                                - type: SetPrimitiveValue@1
                                  targetPath: $.noTxExpected
                                  valueType: Boolean
                                  value: true
                            # --- Sanitize party addresses (poison-item fix) -------
                            # Copy each party's address into a sanitized staging path
                            # ($.san.*) ONLY when its mandatory Street + CityTown are
                            # both present; otherwise leave it absent so no Basic
                            # Address record is materialized without its mandatory
                            # fields (which would FatalError ApplyChanges).
                            - type: SetPrimitiveValue@1
                              targetPath: $.vendorAddrOk
                              valueType: Boolean
                              value: true
                            - type: If@1
                              description: Vendor street absent — no address
                              path: $.ai.result.vendor.address.street
                              operator: Equals
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.vendorAddrOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: Vendor street empty — no address
                              path: $.ai.result.vendor.address.street
                              operator: Equals
                              value: ""
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.vendorAddrOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: Vendor city absent — no address
                              path: $.ai.result.vendor.address.city
                              operator: Equals
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.vendorAddrOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: Vendor city empty — no address
                              path: $.ai.result.vendor.address.city
                              operator: Equals
                              value: ""
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.vendorAddrOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: Vendor address complete — stage the fields
                              path: $.vendorAddrOk
                              operator: Equals
                              value: true
                              valueType: Boolean
                              transformations:
                                - type: SetPrimitiveValue@1
                                  valuePath: $.ai.result.vendor.address.street
                                  targetPath: $.san.vendor.address.street
                                  valueType: String
                                - type: SetPrimitiveValue@1
                                  valuePath: $.ai.result.vendor.address.zipcode
                                  targetPath: $.san.vendor.address.zipcode
                                  valueType: String
                                - type: SetPrimitiveValue@1
                                  valuePath: $.ai.result.vendor.address.city
                                  targetPath: $.san.vendor.address.city
                                  valueType: String
                                - type: SetPrimitiveValue@1
                                  valuePath: $.ai.result.vendor.address.countryCode
                                  targetPath: $.san.vendor.address.countryCode
                                  valueType: String
                            - type: SetPrimitiveValue@1
                              targetPath: $.customerAddrOk
                              valueType: Boolean
                              value: true
                            - type: If@1
                              description: Customer street absent — no address
                              path: $.ai.result.customer.address.street
                              operator: Equals
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.customerAddrOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: Customer street empty — no address
                              path: $.ai.result.customer.address.street
                              operator: Equals
                              value: ""
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.customerAddrOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: Customer city absent — no address
                              path: $.ai.result.customer.address.city
                              operator: Equals
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.customerAddrOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: Customer city empty — no address
                              path: $.ai.result.customer.address.city
                              operator: Equals
                              value: ""
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.customerAddrOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: Customer address complete — stage the fields
                              path: $.customerAddrOk
                              operator: Equals
                              value: true
                              valueType: Boolean
                              transformations:
                                - type: SetPrimitiveValue@1
                                  valuePath: $.ai.result.customer.address.street
                                  targetPath: $.san.customer.address.street
                                  valueType: String
                                - type: SetPrimitiveValue@1
                                  valuePath: $.ai.result.customer.address.zipcode
                                  targetPath: $.san.customer.address.zipcode
                                  valueType: String
                                - type: SetPrimitiveValue@1
                                  valuePath: $.ai.result.customer.address.city
                                  targetPath: $.san.customer.address.city
                                  valueType: String
                                - type: SetPrimitiveValue@1
                                  valuePath: $.ai.result.customer.address.countryCode
                                  targetPath: $.san.customer.address.countryCode
                                  valueType: String
                            - type: CreateUpdateInfo@1
                              targetPath: $.updates._items
                              targetValueKind: Array
                              targetValueWriteMode: Append
                              updateKind: Insert
                              ckTypeId: Meshmakers.Accounting/AccountingDocument
                              rtIdPath: $.documentRtId
                              generateRtId: true
                              rtWellKnownNamePath: $.ai.result.documentNumber
                              attributeUpdates:
                                - attributeName: DocumentNumber
                                  attributeValueType: String
                                  valuePath: $.ai.result.documentNumber
                                - attributeName: DocumentDate
                                  attributeValueType: DateTime
                                  valuePath: $.ai.result.documentDate
                                - attributeName: DueDate
                                  attributeValueType: DateTime
                                  valuePath: $.ai.result.dueDate
                                - attributeName: DocumentType
                                  attributeValueType: Enum
                                  valuePath: $.docType
                                - attributeName: DocumentState
                                  attributeValueType: Enum
                                  valuePath: $.docState
                                - attributeName: NoTransactionExpected
                                  attributeValueType: Boolean
                                  valuePath: $.noTxExpected
                                - attributeName: Vendor.LegalEntityType
                                  attributeValueType: Enum
                                  value: COMPANY
                                - attributeName: Vendor.CompanyName
                                  attributeValueType: String
                                  valuePath: $.ai.result.vendor.companyName
                                - attributeName: Vendor.IBAN
                                  attributeValueType: String
                                  valuePath: $.ai.result.vendor.iban
                                - attributeName: Vendor.AccountName
                                  attributeValueType: String
                                  valuePath: $.ai.result.vendor.accountName
                                # Address from the SANITIZED staging path ($.san.*),
                                # populated above only when the party's mandatory
                                # Street + CityTown are both present — a partial AI
                                # address would otherwise materialize the Basic Address
                                # record without its mandatory fields and FatalError.
                                - attributeName: Vendor.Address.Street
                                  attributeValueType: String
                                  valuePath: $.san.vendor.address.street
                                - attributeName: Vendor.Address.Zipcode
                                  attributeValueType: String
                                  valuePath: $.san.vendor.address.zipcode
                                - attributeName: Vendor.Address.CityTown
                                  attributeValueType: String
                                  valuePath: $.san.vendor.address.city
                                - attributeName: Vendor.Address.NationalCode
                                  attributeValueType: String
                                  valuePath: $.san.vendor.address.countryCode
                                # Customer (recipient/buyer) — valuePath only, so an
                                # absent customer materializes no record. Address from
                                # the sanitized staging path, same as the vendor.
                                - attributeName: Customer.CompanyName
                                  attributeValueType: String
                                  valuePath: $.ai.result.customer.companyName
                                - attributeName: Customer.IBAN
                                  attributeValueType: String
                                  valuePath: $.ai.result.customer.iban
                                - attributeName: Customer.AccountName
                                  attributeValueType: String
                                  valuePath: $.ai.result.customer.accountName
                                - attributeName: Customer.Address.Street
                                  attributeValueType: String
                                  valuePath: $.san.customer.address.street
                                - attributeName: Customer.Address.Zipcode
                                  attributeValueType: String
                                  valuePath: $.san.customer.address.zipcode
                                - attributeName: Customer.Address.CityTown
                                  attributeValueType: String
                                  valuePath: $.san.customer.address.city
                                - attributeName: Customer.Address.NationalCode
                                  attributeValueType: String
                                  valuePath: $.san.customer.address.countryCode
                                - attributeName: Comment
                                  attributeValueType: String
                                  valuePath: $.ai.result.vendor.addressNotes
                                - attributeName: GrossTotal
                                  attributeValueType: Double
                                  valuePath: $.ai.result.grossTotal
                                - attributeName: NetTotal
                                  attributeValueType: Double
                                  valuePath: $.ai.result.netTotal
                                - attributeName: TaxTotal
                                  attributeValueType: Double
                                  valuePath: $.ai.result.taxTotal
                                - attributeName: TaxRate
                                  attributeValueType: Double
                                  valuePath: $.ai.result.taxRate
                                - attributeName: FileHash
                                  attributeValueType: String
                                  valuePath: $.fileHash
                            - type: CreateAssociationUpdate@1
                              targetPath: $.updates._assocItems
                              targetValueKind: Array
                              targetValueWriteMode: Append
                              updateKind: Create
                              originRtIdPath: $.updates._items[0].RtEntity.RtId
                              originCkTypeIdPath: $.updates._items[0].RtEntity.CkTypeId
                              targetRtIdPath: $.fileSystemItem.RtId
                              targetCkTypeIdPath: $.fileSystemItem.CkTypeId
                              associationRoleId: System/Related
                            - type: ApplyChanges@2
                              entityUpdatesPath: $.updates._items
                              associationUpdatesPath: $.updates._assocItems
                        # Incomplete extractions create no entity here — the document
                        # inbox (UploadedDocument ProcessingState INCOMPLETE) is the
                        # follow-up mechanism; the response below tells the user.
                        - type: AnthropicAiQuery@1
                          apiKeyConfigurationName: AnthropicAiConfig
                          description: Generate response message
                          path: $.ai.result
                          responseFormat: text
                          temperature: 0.3
                          maxTokens: 500
                          question: >-
                            Based on the extraction result, write a brief response. If extractionComplete is true, confirm the document was created with key details. If false, inform that the document could not be fully extracted and ask the user to upload it via the document inbox for manual completion. Reply in German.
                          systemPrompt: >-
                            You are an accounting assistant. Summarize the result briefly.
                          targetPath: $.response
                          continueOnError: true
            - type: If@1
              description: No file — Q&A mode
              path: $.files[0].contentType
              operator: NotEquals
              value: "application/pdf"
              valueType: String
              transformations:
                # Load our own company profile so the assistant knows which company
                # it works for instead of a hard-coded name (tenant-specific).
                - type: GetRtEntitiesByType@1
                  description: Load our own company profile for the assistant context
                  ckTypeId: Meshmakers.Accounting/CompanyProfile
                  take: 1
                  targetPath: $.company
                - type: AnthropicAiQuery@1
                  apiKeyConfigurationName: AnthropicAiConfig
                  # AB#4315: the MCP server enforces auth — authenticate via the
                  # ServiceAccountConfiguration (client accounting-ai-prompt) so the
                  # MCP tools load; without it the handshake is rejected (0 tools).
                  mcpServiceAccountConfigName: ServiceAccountConfig
                  description: Answer user question with MCP tools
                  path: $.body.message
                  dataPaths:
                    - $.company
                  conversationHistoryPath: $.body.history
                  responseFormat: text
                  # AB#4541: no mcpServerUrl here — the node resolves it from the
                  # AnthropicAiConfig entity (McpServerUrl attribute), which carries
                  # the environment-specific URL (local: https://localhost:5017,
                  # prod: https://mcp.prod-1.octo-mesh.com; restored per environment
                  # by scripts/om_set_secrets.ps1). A hardcoded localhost URL here
                  # broke the Q&A chat on every deployed environment. When neither
                  # the config nor the node carries a URL, the node answers without
                  # MCP tools instead of failing.
                  maxToolRounds: 10
                  maxTokens: 2000
                  temperature: 0.3
                  question: >-
                    Answer the user's question using the available tools.
                  systemPrompt: >-
                    You are an accounting assistant for the company whose master data
                    (name, address, VAT id) is provided in the "Additional Context"
                    block — treat that company as "we"/"us". If no company context is
                    present, stay generic and do not invent a company name.
                    You have tools to query live OctoMesh accounting data.

                    IMPORTANT RULES:
                    - Use query_entities_simple with the correct ckTypeId to search data.
                    - DO NOT call get_type_schema or get_available_types unless the user explicitly asks about the data model.
                    - After receiving query results, formulate your answer immediately. Do not make additional tool calls unless absolutely necessary.
                    - If a query returns empty results, tell the user — do not retry with variations.
                    - Vendor and Customer are Record objects (composite), NOT text. Do NOT filter on the bare attribute (Vendor / Customer) — that fails with a cast error. Filter on a record SUB-FIELD using dot notation. A party's name is usually stored WHOLE in CompanyName (this holds for people too, e.g. "Rafael Vidas") and only sometimes split into FirstName/LastName. So to find documents by a party name, use the query_entities tool with the Contains operator (NOT Equals, NOT query_entities_simple) on Vendor.CompanyName; if that returns nothing, also try Customer.CompanyName, then Vendor.LastName / Customer.LastName, then Vendor.AccountName / Customer.AccountName (the bank account holder name, which may be a trading name differing from CompanyName). Search BOTH Vendor (incoming) and Customer (outgoing) unless the user named one. Sub-fields: CompanyName, FirstName, LastName, AccountName, Address, Email, IBAN.

                    Known entity types and their key attributes:
                    - Meshmakers.Accounting/AccountingDocument: DocumentNumber, DocumentDate, DueDate, GrossTotal, NetTotal, TaxTotal, TaxRate, DocumentType, DocumentState; Vendor and Customer are Record objects — filter via a sub-field like Vendor.CompanyName (see rule above), never the bare attribute
                    - Basic.Accounting/BankTransaction: TransactionId, Amount, Currency, BookingDate, ValueDate, Purpose, CounterpartName, CounterpartIban, Direction
                    - Meshmakers.Accounting/CostCategory: Name, CategoryType, CategoryKind (EXPENSE or INCOME; missing = EXPENSE), CategoryDescription
                    - Meshmakers.Accounting/FiscalYear: Name, StartDate, EndDate, IsClosed
                    - Basic.Accounting/BankAccount: Iban, AccountHolder, Balance, Currency

                    Reply in the same language as the user.
                  targetPath: $.response
            - type: Project@1
              clear: true
              fields:
                - path: $.response
                  inclusion: true
  # --- Pipelines: upload-documents ---
  - rtId: 67d4a2f0b2e4d8c3a1f000f0
    ckTypeId: System.Communication/DataFlow
    attributes:
      - id: System/Name
        value: Upload Documents
      - id: System/Description
        value: Processes multiple uploaded PDF documents via AI extraction and creates AccountingDocument entities
  - rtId: 67d4a2f0b2e4d8c3a1f000f1
    ckTypeId: System.Communication/Pipeline
    associations:
      - roleId: System/ParentChild
        targetRtId: 67d4a2f0b2e4d8c3a1f000f0
        targetCkTypeId: System.Communication/DataFlow
      - roleId: System.Communication/Executes
        targetRtId: "670000000000000000000002"
        targetCkTypeId: System.Communication/Adapter
    attributes:
      - id: System.Communication/DeploymentState
        value: 0
      - id: System/Name
        value: Upload Documents Pipeline
      - id: System/Enabled
        value: true
      - id: System.Communication/PipelineDefinition
        value: >-
          triggers:
            - type: FromHttpRequest@1
              path: /uploadDocuments
              method: POST
          transformations:
            - type: ForEach@1
              description: Stage each uploaded file for asynchronous analysis
              iterationPath: $.files
              targetPath: $.results
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 2
              transformations:
                - type: If@1
                  description: Only process PDF files
                  path: $.key.contentType
                  operator: Equals
                  value: "application/pdf"
                  valueType: String
                  transformations:
                    - type: If@1
                      description: Reject files above the 10 MB analysis limit with a speaking error
                      path: $.key.length
                      operator: GreaterThan
                      value: 10000000
                      valueType: Int64
                      transformations:
                        - type: SetPrimitiveValue@1
                          targetPath: $.key._resultType
                          value: "error"
                          valueType: String
                        - type: SetPrimitiveValue@1
                          targetPath: $.key._errorMessage
                          value: "File too large (max 10 MB). Please reduce the file size."
                          valueType: String
                    - type: If@1
                      description: Within the size limit - stage the upload
                      path: $.key.length
                      operator: LessEqualsThan
                      value: 10000000
                      valueType: Int64
                      transformations:
                        - type: ComputeFileHash@1
                          description: Compute SHA-256 hash of uploaded file
                          path: $.key.data
                          targetPath: $.fileHash
                        - type: CheckDuplicate@1
                          description: Check if this document was already uploaded
                          ckTypeId: Meshmakers.Accounting/UploadedDocument
                          attributeName: FileHash
                          valuePath: $.fileHash
                          targetPath: $.isDuplicate
                          existingEntityPath: $.existingUpload
                        - type: If@1
                          description: Document already uploaded - skip
                          path: $.isDuplicate
                          operator: Equals
                          value: true
                          valueType: Boolean
                          transformations:
                            - type: SetPrimitiveValue@1
                              targetPath: $.key._resultType
                              value: "duplicate"
                              valueType: String
                        - type: If@1
                          description: New document - store the file and stage it
                          path: $.isDuplicate
                          operator: NotEquals
                          value: true
                          valueType: Boolean
                          transformations:
                            - type: DateTime@1
                              description: Upload timestamp
                              operation: Now
                              targetPath: $.uploadedAt
                            - type: SetPrimitiveValue@1
                              description: Default staging state - the analysis pipeline picks up NEW uploads
                              targetPath: $.stageState
                              value: "NEW"
                              valueType: String
                            - type: SetPrimitiveValue@1
                              targetPath: $.stageNote
                              value: ""
                              valueType: String
                            - type: If@1
                              description: Privacy skip requested (AB#4540) - stage as INCOMPLETE so the analysis pipeline (pickup <= PROCESSING) never touches the content; the user enters the details manually from the inbox
                              path: $.full.formData.skipAnalysis
                              operator: Equals
                              value: "true"
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.stageState
                                  value: "INCOMPLETE"
                                  valueType: String
                                - type: SetPrimitiveValue@1
                                  targetPath: $.stageNote
                                  value: "AI analysis skipped on upload - enter the document details manually."
                                  valueType: String
                            - type: CreateFileSystemUpdate@1
                              description: Store PDF in file system
                              targetPath: $.fileSystemItem
                              path: $.key.data
                              generateRtId: true
                              fileNamePath: $.key.fileName
                              contentType: application/pdf
                              contentLengthPath: $.key.length
                              rootFolderWellKnownName: "Documents"
                            - type: CreateUpdateInfo@1
                              description: Stage the upload for the analysis pipeline
                              targetPath: $.updates._items
                              targetValueKind: Array
                              targetValueWriteMode: Overwrite
                              updateKind: Insert
                              ckTypeId: Meshmakers.Accounting/UploadedDocument
                              rtIdPath: $.uploadRtId
                              generateRtId: true
                              attributeUpdates:
                                - attributeName: OriginalFileName
                                  attributeValueType: String
                                  valuePath: $.key.fileName
                                - attributeName: FileRtId
                                  attributeValueType: String
                                  valuePath: $.fileSystemItem.RtId
                                - attributeName: FileHash
                                  attributeValueType: String
                                  valuePath: $.fileHash
                                - attributeName: UploadedAt
                                  attributeValueType: DateTime
                                  valuePath: $.uploadedAt
                                - attributeName: ProcessingState
                                  attributeValueType: Enum
                                  valuePath: $.stageState
                                - attributeName: ProcessingError
                                  attributeValueType: String
                                  valuePath: $.stageNote
                                - attributeName: SourceChannel
                                  attributeValueType: Enum
                                  value: UPLOAD
                                - attributeName: SourceSender
                                  attributeValueType: String
                                  valuePath: $.full.formData.uploadedBy
                                - attributeName: SourceReceivedAt
                                  attributeValueType: DateTime
                                  valuePath: $.uploadedAt
                            - type: CreateAssociationUpdate@1
                              description: Link the staged upload to the stored file
                              targetPath: $.updates._assocItems
                              targetValueKind: Array
                              targetValueWriteMode: Overwrite
                              updateKind: Create
                              originRtIdPath: $.updates._items[0].RtEntity.RtId
                              originCkTypeIdPath: $.updates._items[0].RtEntity.CkTypeId
                              targetRtIdPath: $.fileSystemItem.RtId
                              targetCkTypeIdPath: $.fileSystemItem.CkTypeId
                              associationRoleId: System/Related
                            - type: ApplyChanges@2
                              entityUpdatesPath: $.updates._items
                              associationUpdatesPath: $.updates._assocItems
                            - type: SetPrimitiveValue@1
                              targetPath: $.key._resultType
                              value: "uploaded"
                              valueType: String
                            - type: If@1
                              description: Report the privacy-skip staging distinctly (AB#4540)
                              path: $.full.formData.skipAnalysis
                              operator: Equals
                              value: "true"
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.key._resultType
                                  value: "stored"
                                  valueType: String
                - type: Project@1
                  description: Remove base64 data from response
                  path: $.key
                  fields:
                    - path: data
                    - path: encoding
            - type: Project@1
              clear: true
              fields:
                - path: $.results
                  inclusion: true
      - id: System.Communication/StatusMessage
  # --- Pipeline: attach-document-file ---
  # Attaches an original PDF to an EXISTING AccountingDocument that has no stored
  # file yet (a manually created document, or one whose analysis produced no file
  # link). POST /attachDocumentFile as multipart/form-data with the PDF as `file`
  # and the target document's rtId in the `documentRtId` form field. Stores the
  # PDF as a FileSystemItem under the Documents root and links it to the document
  # via System/Related — the same association the analysis pipeline creates and
  # the frontend resolves for the preview — and stamps FileHash for consistency.
  - rtId: 67d4a2f0b2e4d8c3a1f000fa
    ckTypeId: System.Communication/DataFlow
    attributes:
      - id: System/Name
        value: Attach Document File
      - id: System/Description
        value: Attaches an original PDF to an existing accounting document that has no stored file
  - rtId: 67d4a2f0b2e4d8c3a1f000fb
    ckTypeId: System.Communication/Pipeline
    associations:
      - roleId: System/ParentChild
        targetRtId: 67d4a2f0b2e4d8c3a1f000fa
        targetCkTypeId: System.Communication/DataFlow
      - roleId: System.Communication/Executes
        targetRtId: "670000000000000000000002"
        targetCkTypeId: System.Communication/Adapter
    attributes:
      - id: System.Communication/DeploymentState
        value: 0
      - id: System/Name
        value: Attach Document File Pipeline
      - id: System/Enabled
        value: true
      - id: System.Communication/PipelineDefinition
        value: >-
          triggers:
            - type: FromHttpRequest@1
              path: /attachDocumentFile
              method: POST
          transformations:
            - type: If@1
              description: Only accept PDF files
              path: $.files[0].contentType
              operator: Equals
              value: "application/pdf"
              valueType: String
              transformations:
                - type: If@1
                  description: Reject files above the 10 MB limit with a speaking error
                  path: $.files[0].length
                  operator: GreaterThan
                  value: 10000000
                  valueType: Int64
                  transformations:
                    - type: SetPrimitiveValue@1
                      targetPath: $._resultType
                      value: "error"
                      valueType: String
                    - type: SetPrimitiveValue@1
                      targetPath: $._errorMessage
                      value: "File too large (max 10 MB). Please reduce the file size."
                      valueType: String
                - type: If@1
                  description: Within the size limit - store the file and link it
                  path: $.files[0].length
                  operator: LessEqualsThan
                  value: 10000000
                  valueType: Int64
                  transformations:
                    - type: ComputeFileHash@1
                      description: Compute SHA-256 hash of the file
                      path: $.files[0].data
                      targetPath: $.fileHash
                    - type: CreateFileSystemUpdate@1
                      description: Store the PDF in the file system
                      targetPath: $.fileSystemItem
                      path: $.files[0].data
                      generateRtId: true
                      fileNamePath: $.files[0].fileName
                      contentType: application/pdf
                      contentLengthPath: $.files[0].length
                      rootFolderWellKnownName: "Documents"
                    - type: CreateUpdateInfo@1
                      description: Stamp the file hash on the existing document
                      targetPath: $.updates._items
                      targetValueKind: Array
                      targetValueWriteMode: Overwrite
                      updateKind: Update
                      ckTypeId: Meshmakers.Accounting/AccountingDocument
                      rtIdPath: $.formData.documentRtId
                      attributeUpdates:
                        - attributeName: FileHash
                          attributeValueType: String
                          valuePath: $.fileHash
                    - type: CreateAssociationUpdate@1
                      description: Link the document to the stored file
                      targetPath: $.updates._assocItems
                      targetValueKind: Array
                      targetValueWriteMode: Overwrite
                      updateKind: Create
                      originRtIdPath: $.formData.documentRtId
                      originCkTypeId: Meshmakers.Accounting/AccountingDocument
                      targetRtIdPath: $.fileSystemItem.RtId
                      targetCkTypeIdPath: $.fileSystemItem.CkTypeId
                      associationRoleId: System/Related
                    - type: ApplyChanges@2
                      entityUpdatesPath: $.updates._items
                      associationUpdatesPath: $.updates._assocItems
                    - type: SetPrimitiveValue@1
                      targetPath: $._resultType
                      value: "attached"
