  # configuration so a tenant carrying that import is upserted in place.
  #
  # SECRET — the real Anthropic API key is intentionally NOT committed. Set it
  # after install (Refinery Studio -> Configurations -> AnthropicAiConfig).
  # NOTE: every blueprint (re-)apply upserts this entity and RESETS the key to
  # the placeholder — re-enter it after each InstallBlueprint -f / update.
  - rtId: 67f0c00ec4ff02221e0b7003
    ckTypeId: System.Communication/AiConfiguration
    rtWellKnownName: AnthropicAiConfig
    attributes:
      - id: System.Communication/ApiKey
        value: "<anthropic-api-key-here>"
