      - id: System.Communication/StatusMessage
  # --- Pipelines: document analysis (asynchronous OCR + AI extraction) ---
  # Picks up staged uploads (ProcessingState NEW) every 5 minutes, or on demand
  # via POST /processDocuments (the app's "Analyze now" button). Each document
  # is marked PROCESSING first so a run that outlasts the polling interval is
  # not picked up twice; the result is COMPLETED (one AccountingDocument created
  # and linked per invoice found in the PDF — a single file may contain several
  # independent invoices, AB#4543) or INCOMPLETE (manual follow-up in the inbox,
  # replaces the former Todo mechanism).
  - rtId: aa0000000000000000000300
    ckTypeId: System.Communication/DataFlow
    attributes:
      - id: System/Name
        value: Document Analysis
      - id: System/Description
        value: Analyzes staged uploads asynchronously via OCR + AI extraction and creates accounting documents
  - rtId: aa0000000000000000000301
    ckTypeId: System.Communication/Pipeline
    associations:
      - roleId: System/ParentChild
        targetRtId: aa0000000000000000000300
        targetCkTypeId: System.Communication/DataFlow
      - roleId: System.Communication/Executes
        targetRtId: "670000000000000000000002"
        targetCkTypeId: System.Communication/Adapter
      # AI configuration lookup requires BOTH the apiKeyConfigurationName on the
      # node AND this Uses association (the adapter resolves the config through
      # the association, the name is validated against it).
      - roleId: System.Communication/Uses
        targetRtId: 67f0c00ec4ff02221e0b7003
        targetCkTypeId: System.Communication/AiConfiguration
    attributes:
      - id: System.Communication/DeploymentState
        value: 0
      - id: System/Name
        value: Document Analysis Pipeline
      - id: System/Enabled
        value: true
      - id: System.Communication/PipelineDefinition
        value: >-
          triggers:
            - type: FromPolling@1
              interval: 00:05:00
            - type: FromHttpRequest@1
              path: /processDocuments
              method: POST
          transformations:
            - type: GetRtEntitiesByType@1
              description: Fetch uploads waiting for analysis (and reclaim orphans)
              ckTypeId: Meshmakers.Accounting/UploadedDocument
              # Smaller batch caps peak memory + run duration so an adapter OOM
              # restart orphans fewer in-flight uploads (the real memory fix is
              # requests/limits on the adapter container — infra, octo-helm-core).
              take: 5
              fieldFilters:
                # Self-healing: pick up NEW(0) AND reclaim uploads orphaned in
                # PROCESSING(1) by a crash/OOM restart (or, pre-fix, a poison
                # FatalError). The mark-as-PROCESSING commit outlives the dead run,
                # and the old Equals-0 filter never retried them, so they sat
                # forever "in progress" in the Inbox. Runs of this polling pipeline
                # do not overlap (duration < 5-min interval), so at run start a
                # PROCESSING upload is genuinely orphaned; the only concurrent path
                # is the manual "Analyze now" trigger, and AB#4452 duplicate
                # detection neutralizes any resulting double-create.
                - attributePath: ProcessingState
                  operator: LessEqualThan
                  comparisonValue: 1
              targetPath: $.pending
            - type: ForEach@1
              description: Analyze each staged upload
              iterationPath: $.pending.Items
              targetPath: $.processed
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                - type: CreateUpdateInfo@1
                  description: Mark as processing (guards against double pickup)
                  targetPath: $.marks
                  targetValueKind: Array
                  targetValueWriteMode: Overwrite
                  updateKind: Update
                  ckTypeId: Meshmakers.Accounting/UploadedDocument
                  rtIdPath: $.key.RtId
                  attributeUpdates:
                    - attributeName: ProcessingState
                      attributeValueType: Enum
                      value: PROCESSING
                - type: ApplyChanges@2
                  entityUpdatesPath: $.marks
                - type: GetFileSystemContent@1
                  description: Load the stored PDF
                  rtIdPath: $.key.Attributes.FileRtId
                  targetPath: $.pdf.data
                - type: PdfOcrExtraction@1
                  description: Extract text from PDF
                  path: $.pdf.data
                  targetPath: $.ocr.result
                  language: de
                  maxFileSizeBytes: 10000000
                  continueOnError: true
                # Load OUR OWN company master data so the AI can tell apart an
                # incoming (someone bills us) from an outgoing (we bill a client)
                # invoice by matching a party against it. CompanyProfile is a
                # user-created singleton (well-known name 'CompanyProfile'); it is
                # NOT seeded, so this is a plain type query that returns an empty
                # result set when the tenant has not filled in Settings → General —
                # the AI then falls back to INCOMING. (GetPipelineConfigByWellKnownName
                # is unusable here: it throws when absent and needs a Uses association
                # to a fixed rtId, but the profile's rtId is generated at runtime.)
                - type: GetRtEntitiesByType@1
                  description: Load our own company profile for invoice direction detection
                  ckTypeId: Meshmakers.Accounting/CompanyProfile
                  take: 1
                  targetPath: $.company
                - type: AnthropicAiQuery@1
                  description: Extract document metadata + detect direction
                  apiKeyConfigurationName: AnthropicAiConfig
                  path: $.ocr.result
                  dataPaths:
                    - $.company
                  responseFormat: json
                  temperature: 0.1
                  question: >-
                    Extract accounting document information from the text in "Main Content". "Additional Context" contains OUR OWN company master data (name, address, VAT id, email) — the company this bookkeeping is done for; it may be empty. The file may contain ONE invoice or SEVERAL independent invoices concatenated into a single PDF (typical: an Amazon marketplace order produces one invoice per seller for the same order; a scan batch combines several receipts). A new invoice starts ONLY where a new invoice number appears — a multi-page invoice is still ONE invoice; never split by page. Output "invoices" as an array with exactly one element per invoice found and "invoiceCount" as the number of elements. Per invoice also output "pageFrom" and "pageTo" (the 1-based first and last PDF page of that invoice) when the page boundaries are recognizable from the text (page markers, "Seite X von Y", repeated per-invoice headers); OMIT both keys when unsure. Apply ALL of the following rules to EACH invoice element independently. Every invoice has two parties: the ISSUER/SELLER (who sent the invoice and receives the money) and the RECIPIENT/BUYER (who is billed). ALWAYS put the issuer/seller into "vendor" and the recipient/buyer into "customer", regardless of which one is us. Determine "documentType": if OUR company (from Additional Context) is the issuer/seller, set it to "OUTGOING"; if OUR company is the recipient/buyer, set it to "INCOMING"; if Additional Context is empty or you cannot decide, use "INCOMING". Output documentType as exactly "INCOMING" or "OUTGOING". Set "extractionComplete" to true ONLY if you could extract documentNumber AND documentDate AND grossTotal for that invoice; otherwise false. IMPORTANT for date fields (documentDate, dueDate): use ISO format yyyy-MM-dd, and if a date is not present on the document, OMIT that key entirely — never output an empty string "" for a date. Apply this postal-address rule to BOTH vendor and customer independently: if street, zipcode AND city are clearly present for that party, put them in that party's "address" object and set that party's "addressComplete" to true. For address.countryCode use the ISO 3166-1 alpha-2 country code printed on the document; if none is printed, INFER it from the address, language or currency (default "AT" for an Austrian address) — whenever you emit an address you MUST also output a non-empty 2-letter countryCode, never leave it blank. If street, zipcode OR city is missing for a party, OMIT that party's "address" object entirely (set its addressComplete to false). Additionally, for the VENDOR only, when its address is incomplete put the full sender address exactly as printed on the document into "vendor.addressNotes" (omit vendor.addressNotes too if no address is visible at all). Emit "iban" for a party only when an IBAN is printed for it (this is usually the vendor's). Additionally, from the payment/bank-details section (the IBAN block, typically labelled "Account name", "Kontoinhaber" or "Konto lautend auf"), extract the bank ACCOUNT HOLDER name into that party's "accountName". This is the name under which the bank account is held; it is often a trading or brand name that DIFFERS from the letterhead companyName and it is what shows up on the bank statement as the counterpart. Omit "accountName" if no account holder name is printed in the bank section.
                  jsonFormatSample: '{ "invoiceCount": 1, "invoices": [ { "extractionComplete": true, "documentType": "INCOMING", "documentNumber": "RE-2026-001", "documentDate": "2026-03-01", "dueDate": "2026-03-31", "pageFrom": 1, "pageTo": 2, "vendor": { "companyName": "Supplier GmbH", "iban": "AT123456789012345678", "accountName": "Supplier Trading Ltd", "address": { "street": "Hauptstrasse 1", "zipcode": "5020", "city": "Salzburg", "countryCode": "AT" }, "addressComplete": true }, "customer": { "companyName": "Our Company GmbH", "address": { "street": "Firmianstrasse 31A", "zipcode": "5020", "city": "Salzburg", "countryCode": "AT" }, "addressComplete": true }, "grossTotal": 1200.00, "netTotal": 1000.00, "taxTotal": 200.00, "taxRate": 20.0 } ] }'
                  targetPath: $.ai.result
                  continueOnError: true
                - type: DateTime@1
                  description: Analysis timestamp
                  operation: Now
                  targetPath: $.processedAt
                # Stage 1: persist the extraction on the UploadedDocument itself,
                # For multi-invoice PDFs (AB#4543) the staging record holds the
                # FIRST invoice only (manual-create pre-fill); per-invoice data is
                # carried into the documents created below.
                # ALWAYS (even when incomplete) so nothing the AI found is lost
                # and the manual "Create Document" form can pre-fill from it.
                # Dates are stored as String here (no parse), so an empty/invalid
                # date can never fail this write-back. Absent AI fields skip.
                - type: CreateUpdateInfo@1
                  description: Write extraction back to the uploaded document
                  targetPath: $.extractionUpdate
                  targetValueKind: Array
                  targetValueWriteMode: Overwrite
                  updateKind: Update
                  ckTypeId: Meshmakers.Accounting/UploadedDocument
                  rtIdPath: $.key.RtId
                  attributeUpdates:
                    - attributeName: Extraction.DocumentNumber
                      attributeValueType: String
                      valuePath: $.ai.result.invoices[0].documentNumber
                    - attributeName: Extraction.DocumentDate
                      attributeValueType: String
                      valuePath: $.ai.result.invoices[0].documentDate
                    - attributeName: Extraction.DueDate
                      attributeValueType: String
                      valuePath: $.ai.result.invoices[0].dueDate
                    - attributeName: Extraction.GrossTotal
                      attributeValueType: Double
                      valuePath: $.ai.result.invoices[0].grossTotal
                    - attributeName: Extraction.NetTotal
                      attributeValueType: Double
                      valuePath: $.ai.result.invoices[0].netTotal
                    - attributeName: Extraction.TaxTotal
                      attributeValueType: Double
                      valuePath: $.ai.result.invoices[0].taxTotal
                    - attributeName: Extraction.TaxRate
                      attributeValueType: Double
                      valuePath: $.ai.result.invoices[0].taxRate
                    - attributeName: Extraction.VendorCompanyName
                      attributeValueType: String
                      valuePath: $.ai.result.invoices[0].vendor.companyName
                    - attributeName: Extraction.VendorIban
                      attributeValueType: String
                      valuePath: $.ai.result.invoices[0].vendor.iban
                    - attributeName: Extraction.VendorStreet
                      attributeValueType: String
                      valuePath: $.ai.result.invoices[0].vendor.address.street
                    - attributeName: Extraction.VendorZipcode
                      attributeValueType: String
                      valuePath: $.ai.result.invoices[0].vendor.address.zipcode
                    - attributeName: Extraction.VendorCity
                      attributeValueType: String
                      valuePath: $.ai.result.invoices[0].vendor.address.city
                    - attributeName: Extraction.VendorCountryCode
                      attributeValueType: String
                      valuePath: $.ai.result.invoices[0].vendor.address.countryCode
                    - attributeName: Extraction.AddressNotes
                      attributeValueType: String
                      valuePath: $.ai.result.invoices[0].vendor.addressNotes
                    - attributeName: Extraction.AddressComplete
                      attributeValueType: Boolean
                      valuePath: $.ai.result.invoices[0].vendor.addressComplete
                - type: ApplyChanges@2
                  entityUpdatesPath: $.extractionUpdate
                # Stage 2: document creation (AB#4543). The AI reports every
                # invoice found in the PDF as one element of $.ai.result.invoices —
                # a single PDF may carry several independent invoices that are
                # settled by ONE bank transaction (e.g. an Amazon marketplace
                # order with one invoice per seller). Each element runs the full
                # per-invoice gate/duplicate/create logic below; a single-invoice
                # PDF is simply the 1-element case. Inside the loop $.key is the
                # invoice element and $.full.key the UploadedDocument entity.
                # Guard (poison-item fix): the AI can claim extractionComplete
                # while omitting documentNumber (mandatory on AccountingDocument).
                # Such an item would fail ApplyChanges and abort the whole ForEach
                # run every poll, blocking all queued uploads. Gate creation per
                # invoice on docOk = extractionComplete AND non-empty documentNumber.
                - type: SetPrimitiveValue@1
                  description: Default - no invoice reported by the AI
                  targetPath: $.invCount
                  valueType: Int
                  value: 0
                - type: If@1
                  description: AI reported at least one invoice
                  path: $.ai.result.invoiceCount
                  operator: GreaterThan
                  value: 0
                  valueType: Int64
                  transformations:
                    - type: SetPrimitiveValue@1
                      targetPath: $.invCount
                      valueType: Int
                      valuePath: $.ai.result.invoiceCount
                - type: If@1
                  description: Gate, duplicate-check and create each reported invoice
                  path: $.invCount
                  operator: GreaterThan
                  value: 0
                  valueType: Int64
                  transformations:
                    - type: ForEach@1
                      description: One accounting document per invoice in the PDF
                      iterationPath: $.ai.result.invoices
                      targetPath: $.invoiceResults
                      targetValueKind: Simple
                      targetValueWriteMode: Overwrite
                      maxDegreeOfParallelism: 1
                      transformations:
                        - type: SetPrimitiveValue@1
                          description: Default - document not creatable
                          targetPath: $.docOk
                          valueType: Boolean
                          value: false
                        - type: If@1
                          description: Extraction claims complete
                          path: $.key.extractionComplete
                          operator: Equals
                          value: true
                          valueType: Boolean
                          transformations:
                            - type: SetPrimitiveValue@1
                              targetPath: $.docOk
                              valueType: Boolean
                              value: true
                            - type: If@1
                              description: documentNumber missing - demote to incomplete
                              path: $.key.documentNumber
                              operator: Equals
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.docOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: documentNumber empty - demote to incomplete
                              path: $.key.documentNumber
                              operator: Equals
                              value: ""
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.docOk
                                  valueType: Boolean
                                  value: false
                            # Poison-item guard (prod incident 2026-07-26): the AI can claim
                            # extractionComplete while omitting documentDate or grossTotal —
                            # both are MANDATORY on AccountingDocument, so the create would
                            # FatalError ApplyChanges and abort the whole upload ForEach every
                            # poll, stranding all queued uploads (a city-fee notice without a
                            # recognizable invoice date blocked a 233-upload batch). Demote such
                            # invoices to INCOMPLETE instead. String guards for the date
                            # (absent + empty); the gross total uses the null-safe numeric
                            # pattern (comparisons on an absent/null number are false, so
                            # only a real number of either sign sets $.grossOk).
                            - type: If@1
                              description: documentDate missing - demote to incomplete
                              path: $.key.documentDate
                              operator: Equals
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.docOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: documentDate empty - demote to incomplete
                              path: $.key.documentDate
                              operator: Equals
                              value: ""
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.docOk
                                  valueType: Boolean
                                  value: false
                            - type: SetPrimitiveValue@1
                              description: Default - gross total not a number
                              targetPath: $.grossOk
                              valueType: Boolean
                              value: false
                            - type: If@1
                              description: Gross total is a non-negative number
                              path: $.key.grossTotal
                              operator: GreaterEqualsThan
                              value: 0
                              valueType: Double
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.grossOk
                                  valueType: Boolean
                                  value: true
                            - type: If@1
                              description: Gross total is a negative number (credit note)
                              path: $.key.grossTotal
                              operator: LessThan
                              value: 0
                              valueType: Double
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.grossOk
                                  valueType: Boolean
                                  value: true
                            - type: If@1
                              description: grossTotal missing - demote to incomplete
                              path: $.grossOk
                              operator: NotEquals
                              value: true
                              valueType: Boolean
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.docOk
                                  valueType: Boolean
                                  value: false
                        # AB#4452: semantic duplicate detection. The SHA-256 FileHash check
                        # only catches byte-identical files - the same invoice arriving via
                        # two channels (e-mail receipt vs. portal export) passes it, and
                        # Apple even issues DIFFERENT invoice numbers per channel for the
                        # same charge. Checks before creating the document:
                        #   1. hard: an existing AccountingDocument matches the extracted
                        #      DocumentNumber AND (the same vendor OR the same
                        #      GrossTotal+DocumentDate) -> genuine re-import, never create a
                        #      second one. DocumentNumber ALONE is not enough: external
                        #      reference numbers (customer/case numbers) are echoed across
                        #      different vendors' documents - e.g. an OeAMTC customer number
                        #      printed on a lawyer's dunning letter would otherwise wrongly
                        #      block the (different) lawyer invoice (prod false-positive,
                        #      salzburgdev 2026-07-24).
                        #   2. soft: a document with the identical GrossTotal AND
                        #      DocumentDate but a different number exists -> suspected twin;
                        #      do not create silently, flag the upload for manual review.
                        - type: SetPrimitiveValue@1
                          description: Default - no duplicate detected
                          targetPath: $.dupNote
                          valueType: String
                          value: ""
                        - type: If@1
                          description: Extraction valid - run the duplicate checks
                          path: $.docOk
                          operator: Equals
                          value: true
                          valueType: Boolean
                          transformations:
                            # Hard-duplicate candidates: an existing document must share the
                            # DocumentNumber AND either the vendor or the amount+date. A bare
                            # DocumentNumber collision is NOT a duplicate (shared external
                            # reference numbers across vendors).
                            - type: GetRtEntitiesByType@1
                              description: Same document number AND same vendor (genuine re-import)
                              ckTypeId: Meshmakers.Accounting/AccountingDocument
                              targetPath: $._dupByNumberVendor
                              take: 1
                              fieldFilters:
                                - attributePath: DocumentNumber
                                  operator: Equals
                                  comparisonValuePath: $.key.documentNumber
                                - attributePath: Vendor.CompanyName
                                  operator: Equals
                                  comparisonValuePath: $.key.vendor.companyName
                            - type: GetRtEntitiesByType@1
                              description: Same document number AND same amount+date (same invoice, vendor-name variant)
                              ckTypeId: Meshmakers.Accounting/AccountingDocument
                              targetPath: $._dupByNumberAmountDate
                              take: 1
                              fieldFilters:
                                - attributePath: DocumentNumber
                                  operator: Equals
                                  comparisonValuePath: $.key.documentNumber
                                - attributePath: GrossTotal
                                  operator: Equals
                                  comparisonValuePath: $.key.grossTotal
                                - attributePath: DocumentDate
                                  operator: Equals
                                  comparisonValuePath: $.key.documentDate
                            - type: If@1
                              description: Hard duplicate - number + vendor match
                              path: $._dupByNumberVendor.TotalCount
                              operator: GreaterThan
                              value: 0
                              valueType: Int64
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.docOk
                                  valueType: Boolean
                                  value: false
                                - type: SetPrimitiveValue@1
                                  description: Duplicate reason shown in the Inbox
                                  targetPath: $.dupNote
                                  valueType: String
                                  value: "Duplicate: an accounting document with the same number and vendor already exists. No document was created."
                            - type: If@1
                              description: Hard duplicate - number + amount+date match (vendor name may differ per channel)
                              path: $._dupByNumberAmountDate.TotalCount
                              operator: GreaterThan
                              value: 0
                              valueType: Int64
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.docOk
                                  valueType: Boolean
                                  value: false
                                - type: SetPrimitiveValue@1
                                  description: Duplicate reason shown in the Inbox
                                  targetPath: $.dupNote
                                  valueType: String
                                  value: "Duplicate: an accounting document with the same number, amount and date already exists. No document was created."
                            - type: If@1
                              description: Not a hard duplicate - check for a same-amount/same-date twin with a different number (soft suspect)
                              path: $.docOk
                              operator: Equals
                              value: true
                              valueType: Boolean
                              transformations:
                                - type: GetRtEntitiesByType@1
                                  description: Existing document with identical gross total and document date
                                  ckTypeId: Meshmakers.Accounting/AccountingDocument
                                  targetPath: $._dupByAmountDate
                                  take: 1
                                  fieldFilters:
                                    - attributePath: GrossTotal
                                      operator: Equals
                                      comparisonValuePath: $.key.grossTotal
                                    - attributePath: DocumentDate
                                      operator: Equals
                                      comparisonValuePath: $.key.documentDate
                                - type: If@1
                                  description: Suspected duplicate - flag for manual review instead of creating silently
                                  path: $._dupByAmountDate.TotalCount
                                  operator: GreaterThan
                                  value: 0
                                  valueType: Int64
                                  transformations:
                                    - type: SetPrimitiveValue@1
                                      targetPath: $.docOk
                                      valueType: Boolean
                                      value: false
                                    - type: SetPrimitiveValue@1
                                      description: Suspected-duplicate reason shown in the Inbox
                                      targetPath: $.dupNote
                                      valueType: String
                                      value: "Possible duplicate: an accounting document with the same amount and document date already exists (invoice numbers may differ per channel). No document was created - please verify and process manually."
                        - type: If@1
                          description: Extraction successful - create AccountingDocument
                          path: $.docOk
                          operator: Equals
                          value: true
                          valueType: Boolean
                          transformations:
                            # Normalize the AI-detected direction to a guaranteed enum name
                            # before the write: default INCOMING, promote to OUTGOING only on
                            # an exact match. Guards against a missing/variant documentType
                            # breaking the Enum attribute conversion.
                            - type: SetPrimitiveValue@1
                              description: Default document direction
                              targetPath: $.docType
                              valueType: String
                              value: INCOMING
                            - type: If@1
                              description: Our company is the issuer — outgoing invoice
                              path: $.key.documentType
                              operator: Equals
                              value: OUTGOING
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.docType
                                  valueType: String
                                  value: OUTGOING
                            # AB#4542: a zero-total invoice (voucher/credit-settled, e.g.
                            # HelloFresh voucher weeks, provider credit notes) will never
                            # see a payment — create it as PAID with NoTransactionExpected
                            # instead of leaving it OPEN forever. $.noTxExpected stays
                            # absent for normal documents; an absent valuePath skips the
                            # attribute in CreateUpdateInfo.
                            - type: SetPrimitiveValue@1
                              description: New documents await a payment (default)
                              targetPath: $.docState
                              valueType: String
                              value: OPEN
                            - type: If@1
                              description: Zero gross total — voucher/credit-settled, no payment expected
                              path: $.key.grossTotal
                              operator: Equals
                              value: 0
                              valueType: Double
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.docState
                                  valueType: String
                                  value: PAID
                                - type: SetPrimitiveValue@1
                                  targetPath: $.noTxExpected
                                  valueType: Boolean
                                  value: true
                            # --- Sanitize party addresses (poison-item fix) -------------
                            # The Basic Address record has MANDATORY Street + CityTown. The
                            # AI is asked to emit an address all-or-nothing, but occasionally
                            # returns a PARTIAL address (e.g. only zipcode/countryCode); that
                            # partial object still materializes the embedded Address record,
                            # whose missing Street/CityTown then FatalError ApplyChanges and
                            # abort the ENTIRE ForEach — stranding every queued upload. Do not
                            # trust the AI's structural omission: copy each party's address
                            # into a sanitized staging path ($.san.*) ONLY when BOTH mandatory
                            # fields (street + city) are present and non-empty; otherwise the
                            # staging paths stay absent and NO Address record is materialized
                            # (the raw sender address is still kept in Comment via addressNotes).
                            - type: SetPrimitiveValue@1
                              targetPath: $.vendorAddrOk
                              valueType: Boolean
                              value: true
                            - type: If@1
                              description: Vendor street absent — no address
                              path: $.key.vendor.address.street
                              operator: Equals
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.vendorAddrOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: Vendor street empty — no address
                              path: $.key.vendor.address.street
                              operator: Equals
                              value: ""
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.vendorAddrOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: Vendor city absent — no address
                              path: $.key.vendor.address.city
                              operator: Equals
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.vendorAddrOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: Vendor city empty — no address
                              path: $.key.vendor.address.city
                              operator: Equals
                              value: ""
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.vendorAddrOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: Vendor address complete — stage the fields for the write
                              path: $.vendorAddrOk
                              operator: Equals
                              value: true
                              valueType: Boolean
                              transformations:
                                - type: SetPrimitiveValue@1
                                  valuePath: $.key.vendor.address.street
                                  targetPath: $.san.vendor.address.street
                                  valueType: String
                                - type: SetPrimitiveValue@1
                                  valuePath: $.key.vendor.address.zipcode
                                  targetPath: $.san.vendor.address.zipcode
                                  valueType: String
                                - type: SetPrimitiveValue@1
                                  valuePath: $.key.vendor.address.city
                                  targetPath: $.san.vendor.address.city
                                  valueType: String
                                - type: SetPrimitiveValue@1
                                  valuePath: $.key.vendor.address.countryCode
                                  targetPath: $.san.vendor.address.countryCode
                                  valueType: String
                            - type: SetPrimitiveValue@1
                              targetPath: $.customerAddrOk
                              valueType: Boolean
                              value: true
                            - type: If@1
                              description: Customer street absent — no address
                              path: $.key.customer.address.street
                              operator: Equals
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.customerAddrOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: Customer street empty — no address
                              path: $.key.customer.address.street
                              operator: Equals
                              value: ""
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.customerAddrOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: Customer city absent — no address
                              path: $.key.customer.address.city
                              operator: Equals
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.customerAddrOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: Customer city empty — no address
                              path: $.key.customer.address.city
                              operator: Equals
                              value: ""
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.customerAddrOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: Customer address complete — stage the fields for the write
                              path: $.customerAddrOk
                              operator: Equals
                              value: true
                              valueType: Boolean
                              transformations:
                                - type: SetPrimitiveValue@1
                                  valuePath: $.key.customer.address.street
                                  targetPath: $.san.customer.address.street
                                  valueType: String
                                - type: SetPrimitiveValue@1
                                  valuePath: $.key.customer.address.zipcode
                                  targetPath: $.san.customer.address.zipcode
                                  valueType: String
                                - type: SetPrimitiveValue@1
                                  valuePath: $.key.customer.address.city
                                  targetPath: $.san.customer.address.city
                                  valueType: String
                                - type: SetPrimitiveValue@1
                                  valuePath: $.key.customer.address.countryCode
                                  targetPath: $.san.customer.address.countryCode
                                  valueType: String
                            - type: CreateUpdateInfo@1
                              targetPath: $.updates._items
                              targetValueKind: Array
                              targetValueWriteMode: Overwrite
                              updateKind: Insert
                              ckTypeId: Meshmakers.Accounting/AccountingDocument
                              rtIdPath: $.documentRtId
                              generateRtId: true
                              rtWellKnownNamePath: $.key.documentNumber
                              attributeUpdates:
                                - attributeName: DocumentNumber
                                  attributeValueType: String
                                  valuePath: $.key.documentNumber
                                - attributeName: DocumentDate
                                  attributeValueType: DateTime
                                  valuePath: $.key.documentDate
                                - attributeName: DueDate
                                  attributeValueType: DateTime
                                  valuePath: $.key.dueDate
                                - attributeName: DocumentType
                                  attributeValueType: Enum
                                  valuePath: $.docType
                                - attributeName: DocumentState
                                  attributeValueType: Enum
                                  valuePath: $.docState
                                - attributeName: NoTransactionExpected
                                  attributeValueType: Boolean
                                  valuePath: $.noTxExpected
                                - attributeName: Vendor.LegalEntityType
                                  attributeValueType: Enum
                                  value: COMPANY
                                - attributeName: Vendor.CompanyName
                                  attributeValueType: String
                                  valuePath: $.key.vendor.companyName
                                - attributeName: Vendor.IBAN
                                  attributeValueType: String
                                  valuePath: $.key.vendor.iban
                                - attributeName: Vendor.AccountName
                                  attributeValueType: String
                                  valuePath: $.key.vendor.accountName
                                # Address is written from the SANITIZED staging path
                                # ($.san.*), populated above only when the party's mandatory
                                # Street + CityTown are both present. This prevents a partial
                                # AI address (e.g. countryCode only) from materializing the
                                # Basic Address record without its mandatory fields, which
                                # would FatalError ApplyChanges and abort the whole ForEach.
                                # A partial/absent address instead lands in Comment via
                                # addressNotes.
                                - attributeName: Vendor.Address.Street
                                  attributeValueType: String
                                  valuePath: $.san.vendor.address.street
                                - attributeName: Vendor.Address.Zipcode
                                  attributeValueType: String
                                  valuePath: $.san.vendor.address.zipcode
                                - attributeName: Vendor.Address.CityTown
                                  attributeValueType: String
                                  valuePath: $.san.vendor.address.city
                                - attributeName: Vendor.Address.NationalCode
                                  attributeValueType: String
                                  valuePath: $.san.vendor.address.countryCode
                                # Customer (invoice recipient/buyer). All fields are written
                                # via valuePath only — no static value — so when the AI emits
                                # no customer, every path is absent and NO Customer record is
                                # materialized (LegalEntityType is optional on Contact). Address
                                # from the sanitized staging path, same as the vendor.
                                - attributeName: Customer.CompanyName
                                  attributeValueType: String
                                  valuePath: $.key.customer.companyName
                                - attributeName: Customer.IBAN
                                  attributeValueType: String
                                  valuePath: $.key.customer.iban
                                - attributeName: Customer.AccountName
                                  attributeValueType: String
                                  valuePath: $.key.customer.accountName
                                - attributeName: Customer.Address.Street
                                  attributeValueType: String
                                  valuePath: $.san.customer.address.street
                                - attributeName: Customer.Address.Zipcode
                                  attributeValueType: String
                                  valuePath: $.san.customer.address.zipcode
                                - attributeName: Customer.Address.CityTown
                                  attributeValueType: String
                                  valuePath: $.san.customer.address.city
                                - attributeName: Customer.Address.NationalCode
                                  attributeValueType: String
                                  valuePath: $.san.customer.address.countryCode
                                - attributeName: Comment
                                  attributeValueType: String
                                  valuePath: $.key.vendor.addressNotes
                                - attributeName: GrossTotal
                                  attributeValueType: Double
                                  valuePath: $.key.grossTotal
                                - attributeName: NetTotal
                                  attributeValueType: Double
                                  valuePath: $.key.netTotal
                                - attributeName: TaxTotal
                                  attributeValueType: Double
                                  valuePath: $.key.taxTotal
                                - attributeName: TaxRate
                                  attributeValueType: Double
                                  valuePath: $.key.taxRate
                                - attributeName: FileHash
                                  attributeValueType: String
                                  valuePath: $.full.key.Attributes.FileHash
                                - attributeName: PageFrom
                                  attributeValueType: Int
                                  valuePath: $.key.pageFrom
                                - attributeName: PageTo
                                  attributeValueType: Int
                                  valuePath: $.key.pageTo
                            - type: CreateAssociationUpdate@1
                              description: Link the document to the stored file
                              targetPath: $.updates._assocItems
                              targetValueKind: Array
                              targetValueWriteMode: Overwrite
                              updateKind: Create
                              originRtIdPath: $.updates._items[0].RtEntity.RtId
                              originCkTypeIdPath: $.updates._items[0].RtEntity.CkTypeId
                              targetRtIdPath: $.full.key.Attributes.FileRtId
                              targetCkTypeId: System.Reporting/FileSystemItem
                              associationRoleId: System/Related
                            - type: CreateAssociationUpdate@1
                              description: Link the staged upload to the created document
                              targetPath: $.updates._assocItems
                              targetValueKind: Array
                              targetValueWriteMode: Append
                              updateKind: Create
                              originRtIdPath: $.full.key.RtId
                              originCkTypeId: Meshmakers.Accounting/UploadedDocument
                              targetRtIdPath: $.updates._items[0].RtEntity.RtId
                              targetCkTypeIdPath: $.updates._items[0].RtEntity.CkTypeId
                              associationRoleId: Meshmakers.Accounting/UploadedToDocument
                            - type: ApplyChanges@2
                              entityUpdatesPath: $.updates._items
                              associationUpdatesPath: $.updates._assocItems
                            # --- AB#4433: re-arm plausibly-matching Unmatched transactions ---
                            # A transaction synced (finAPI) before its document existed is often
                            # burned to Unmatched(2) before an OPEN candidate document exists.
                            # The AI matching pass only reconsiders MatchState=Unreviewed(0)
                            # (the recurring pass re-checks In [0, 2] since AB#4473), so such
                            # a transaction is never re-matched once its document finally
                            # arrives. Reset the plausible
                            # candidates for THIS freshly-created OPEN document back to
                            # Unreviewed so the next Match Transactions run (<=15 min poll, or
                            # the manual "Run matching") reconsiders them, including the AI
                            # fallback that alone can resolve masked/ambiguous payees (e.g.
                            # PayPal). Scope: transaction direction (Debit pays an incoming
                            # document, Credit settles an outgoing one), |amount| within
                            # [GrossTotal, GrossTotal + 15 EUR transfer fee], and BookingDate on/
                            # after the DocumentDate. Idempotent: only MatchState=Unmatched(2)
                            # rows are touched (Matched/Ignored are left untouched). The explicit
                            # PendingDocument state that would remove the re-arm churn is the
                            # deferred part B of AB#4433 (needs a shared Basic.Accounting change).
                            - type: SetPrimitiveValue@1
                              description: Copy the AI gross total under $.key so all Math bases are $.key (Math itemTargetPath is relative to path — AB#4433 fix)
                              valuePath: $.key.grossTotal
                              targetPath: $.key._rearmGross
                              valueType: Double
                            # AB#4590: widen the re-arm band below the gross total so a
                            # freshly-created OPEN document also reconsiders payments that
                            # came in BELOW its gross — foreign-currency wires and cash
                            # discount (Skonto) — down to 85% of the gross, on top of the
                            # existing +15 EUR transfer-fee headroom above. The AI fallback
                            # still makes the final call, so a wider re-arm only triggers a
                            # reconsider, never a wrong match. (Card-currency purchases are
                            # already handled deterministically by the foreign-currency card
                            # pass; this covers the non-card FX/Skonto tail.)
                            - type: Math@1
                              description: 0.85 * GrossTotal (lower magnitude bound for FX/Skonto)
                              path: $.key
                              itemPath: $._rearmGross
                              itemTargetPath: $._rearmGross85
                              operation: Multiply
                              value: 0.85
                            - type: Math@1
                              description: -GrossTotal (Debit upper bound)
                              path: $.key
                              itemPath: $._rearmGross
                              itemTargetPath: $._rearmNegGross
                              operation: Multiply
                              value: -1
                            - type: Math@1
                              description: -(GrossTotal + 15) = -GrossTotal - 15 (Debit lower bound)
                              path: $.key
                              itemPath: $._rearmNegGross
                              itemTargetPath: $._rearmLo
                              operation: Subtract
                              value: 15
                            - type: SetPrimitiveValue@1
                              description: Default = Debit(1) pays an incoming document
                              targetPath: $.key._rearmDir
                              value: 1
                              valueType: Int
                            - type: Math@1
                              description: Debit upper bound = -(0.85 * GrossTotal) — allow payment below gross (FX/Skonto)
                              path: $.key
                              itemPath: $._rearmGross85
                              itemTargetPath: $._rearmHi
                              operation: Multiply
                              value: -1
                            - type: If@1
                              description: Outgoing document is settled by a Credit(0) — positive amount band
                              path: $.docType
                              operator: Equals
                              value: OUTGOING
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.key._rearmDir
                                  value: 0
                                  valueType: Int
                                - type: SetPrimitiveValue@1
                                  description: Credit lower bound = 0.85 * GrossTotal (allow payment below gross — FX/Skonto)
                                  valuePath: $.key._rearmGross85
                                  targetPath: $.key._rearmLo
                                  valueType: Double
                                - type: Math@1
                                  description: Credit upper bound = GrossTotal + 15 (Subtract -15 = +15)
                                  path: $.key
                                  itemPath: $._rearmGross
                                  itemTargetPath: $._rearmHi
                                  operation: Subtract
                                  value: -15
                            # AB#4590: allow a payment booked up to 14 days BEFORE the
                            # document date to re-arm too — invoices dated at month-end
                            # but paid earlier, and prepayments, were previously never
                            # reconsidered because the filter demanded BookingDate on/after
                            # the document date.
                            - type: DateTime@1
                              description: Earliest booking date that still re-arms (document date - 14 days)
                              operation: AddDays
                              path: $.key.documentDate
                              value: -14
                              targetPath: $.key._rearmMinDate
                            - type: GetRtEntitiesByType@1
                              description: Unmatched transactions plausibly paying this document (amount band incl. below-gross + direction + booked within the document's ±window)
                              ckTypeId: Basic.Accounting/BankTransaction
                              targetPath: $._rearmCandidates
                              take: 50
                              fieldFilters:
                                - attributePath: MatchState
                                  operator: Equals
                                  comparisonValue: 2
                                - attributePath: Direction
                                  operator: Equals
                                  comparisonValuePath: $.key._rearmDir
                                - attributePath: Amount
                                  operator: GreaterEqualThan
                                  comparisonValuePath: $.key._rearmLo
                                - attributePath: Amount
                                  operator: LessEqualThan
                                  comparisonValuePath: $.key._rearmHi
                                - attributePath: BookingDate
                                  operator: GreaterEqualThan
                                  comparisonValuePath: $.key._rearmMinDate
                            - type: ForEach@1
                              description: Re-arm each candidate transaction to Unreviewed so matching reconsiders it
                              iterationPath: $._rearmCandidates.Items
                              targetPath: $._rearmApplied
                              targetValueKind: Simple
                              targetValueWriteMode: Overwrite
                              maxDegreeOfParallelism: 1
                              transformations:
                                - type: CreateUpdateInfo@1
                                  description: Reset the transaction to Unreviewed
                                  targetPath: $._rearmUpdates
                                  targetValueKind: Array
                                  targetValueWriteMode: Overwrite
                                  updateKind: Update
                                  ckTypeId: Basic.Accounting/BankTransaction
                                  rtIdPath: $.key.RtId
                                  attributeUpdates:
                                    - attributeName: MatchState
                                      attributeValueType: Enum
                                      value: Unreviewed
                                - type: ApplyChanges@2
                                  entityUpdatesPath: $._rearmUpdates
                        - type: If@1
                          description: Invoice not created - record the reason on the upload (final state is decided after the loop)
                          path: $.docOk
                          operator: NotEquals
                          value: true
                          valueType: Boolean
                          transformations:
                            - type: SetPrimitiveValue@1
                              description: Default manual-follow-up reason
                              targetPath: $.procError
                              valueType: String
                              value: "OCR or AI extraction did not produce a complete result. Please process the document manually."
                            - type: If@1
                              description: Duplicate detection produced a specific reason (AB#4452)
                              path: $.dupNote
                              operator: NotEquals
                              value: ""
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.procError
                                  valueType: String
                                  valuePath: $.dupNote
                            - type: CreateUpdateInfo@1
                              targetPath: $.invoiceError
                              targetValueKind: Array
                              targetValueWriteMode: Overwrite
                              updateKind: Update
                              ckTypeId: Meshmakers.Accounting/UploadedDocument
                              rtIdPath: $.full.key.RtId
                              attributeUpdates:
                                - attributeName: ProcessingError
                                  attributeValueType: String
                                  valuePath: $.procError
                            - type: ApplyChanges@2
                              entityUpdatesPath: $.invoiceError
                # Upload final state (AB#4543): COMPLETED only when every
                # reported invoice has a linked result document (links from
                # previous runs count, so re-analysis stays idempotent);
                # otherwise INCOMPLETE. Per-invoice failure reasons were already
                # written to ProcessingError inside the loop; the no-invoice
                # case gets the generic message here.
                - type: GetAssociationTargets@1
                  description: Result documents linked to this upload
                  originRtIdPath: $.key.RtId
                  originCkTypeId: Meshmakers.Accounting/UploadedDocument
                  targetCkTypeId: Meshmakers.Accounting/AccountingDocument
                  associationRoleId: Meshmakers.Accounting/UploadedToDocument
                  graphDirection: Outbound
                  targetPath: $.linkedDocs
                - type: SetPrimitiveValue@1
                  description: Default - upload not fully processed
                  targetPath: $.uploadDone
                  valueType: Boolean
                  value: false
                - type: If@1
                  description: At least one invoice was reported
                  path: $.invCount
                  operator: GreaterThan
                  value: 0
                  valueType: Int64
                  transformations:
                    - type: If@1
                      description: Every reported invoice has a linked document
                      path: $.linkedDocs[0].TotalCount
                      operator: Equals
                      valuePath: $.invCount
                      valueType: Int64
                      transformations:
                        - type: SetPrimitiveValue@1
                          targetPath: $.uploadDone
                          valueType: Boolean
                          value: true
                - type: If@1
                  description: All invoices created - mark the upload as completed
                  path: $.uploadDone
                  operator: Equals
                  value: true
                  valueType: Boolean
                  transformations:
                    - type: CreateUpdateInfo@1
                      targetPath: $.finals
                      targetValueKind: Array
                      targetValueWriteMode: Overwrite
                      updateKind: Update
                      ckTypeId: Meshmakers.Accounting/UploadedDocument
                      rtIdPath: $.key.RtId
                      attributeUpdates:
                        - attributeName: ProcessingState
                          attributeValueType: Enum
                          value: COMPLETED
                        - attributeName: ProcessedAt
                          attributeValueType: DateTime
                          valuePath: $.processedAt
                        # Clear a leftover per-invoice note from a previous run
                        # (e.g. a duplicate re-analysis that now completes).
                        - attributeName: ProcessingError
                          attributeValueType: String
                          value: ""
                    - type: ApplyChanges@2
                      entityUpdatesPath: $.finals
                - type: If@1
                  description: Extraction incomplete, duplicate or no invoice found - flag for manual follow-up
                  path: $.uploadDone
                  operator: NotEquals
                  value: true
                  valueType: Boolean
                  transformations:
                    - type: If@1
                      description: No invoice reported at all - write the generic reason (per-invoice reasons were written in the loop)
                      path: $.invCount
                      operator: LessEqualsThan
                      value: 0
                      valueType: Int64
                      transformations:
                        - type: SetPrimitiveValue@1
                          targetPath: $.noInvoiceNote
                          valueType: String
                          value: "OCR or AI extraction did not produce a complete result. Please process the document manually."
                    - type: CreateUpdateInfo@1
                      targetPath: $.finals
                      targetValueKind: Array
                      targetValueWriteMode: Overwrite
                      updateKind: Update
                      ckTypeId: Meshmakers.Accounting/UploadedDocument
                      rtIdPath: $.key.RtId
                      attributeUpdates:
                        - attributeName: ProcessingState
                          attributeValueType: Enum
                          value: INCOMPLETE
                        - attributeName: ProcessedAt
                          attributeValueType: DateTime
                          valuePath: $.processedAt
                        - attributeName: ProcessingError
                          attributeValueType: String
                          valuePath: $.noInvoiceNote
                    - type: ApplyChanges@2
                      entityUpdatesPath: $.finals
                - type: SetPrimitiveValue@1
                  valuePath: $.key.RtId
                  valueType: String
                  targetPath: $.key._processedRtId
                - type: Project@1
                  description: Keep only the processed id in the loop result
                  path: $.key
                  fields:
                    - path: Attributes
            - type: Project@1
              clear: true
              fields:
                - path: $.processed
                  inclusion: true
      - id: System.Communication/StatusMessage
  # --- Pipelines: match-transactions ---
  - rtId: 67d4a2f0b2e4d8c3a1f00100
    ckTypeId: System.Communication/DataFlow
    attributes:
      - id: System/Name
        value: Match Transactions to Documents
      - id: System/Description
        value: Cyclically matches unreviewed bank transactions to open accounting documents — deterministic amount/type matching first, AI fallback for ambiguous cases
  - rtId: 67d4a2f0b2e4d8c3a1f00101
    ckTypeId: System.Communication/Pipeline
    associations:
      - roleId: System/ParentChild
        targetRtId: 67d4a2f0b2e4d8c3a1f00100
        targetCkTypeId: System.Communication/DataFlow
      - roleId: System.Communication/Executes
        targetRtId: "670000000000000000000002"
        targetCkTypeId: System.Communication/Adapter
      # AI configuration lookup requires BOTH the apiKeyConfigurationName on the
      # node AND this Uses association (the adapter resolves the config through
      # the association, the name is validated against it).
      - roleId: System.Communication/Uses
        targetRtId: 67f0c00ec4ff02221e0b7003
        targetCkTypeId: System.Communication/AiConfiguration
    attributes:
      - id: System.Communication/DeploymentState
        value: 0
      - id: System/Name
        value: Match Transactions Pipeline
      - id: System/Enabled
        value: true
      - id: System.Communication/PipelineDefinition
        value: >-
          triggers:
            - type: FromPolling@1
              interval: 00:15:00
            - type: FromHttpRequest@1
              path: /matchTransactions
              method: POST
          transformations:
            # --- Recurring documents (Dauerbeleg) pass — runs FIRST so a
            #     recurring debit is claimed by its standing document before the
            #     deterministic amount pass and the AI fallback (both of which
            #     only ever consider OPEN documents, DocumentState 0) get to it.
            #     A recurring document carries exactly one match type + value, so
            #     at most one of the three lookups below fires — no ambiguity.
            - type: GetRtEntitiesByType@1
              description: Load recurring master documents (Dauerbelege)
              ckTypeId: Meshmakers.Accounting/AccountingDocument
              targetPath: $.recurringDocs
              take: 200
              fieldFilters:
                - attributePath: DocumentState
                  operator: Equals
                  comparisonValue: 4
            - type: ForEach@1
              description: For each recurring document, match its unreviewed debits by SEPA key
              iterationPath: $.recurringDocs.Items
              targetPath: $.recResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                # Init to an empty result set so the inner ForEach never sees a
                # missing array (ForEach throws PathMustBeArray otherwise) when a
                # document has no match type set.
                - type: WriteJson@1
                  targetPath: $.key._recTxs
                  jsonString: '{"Items":[],"TotalCount":0}'
                - type: If@1
                  description: Match by SEPA Creditor Id
                  path: $.key.Attributes.RecurrenceMatchType
                  operator: Equals
                  value: 0
                  valueType: Int64
                  transformations:
                    - type: GetRtEntitiesByType@1
                      ckTypeId: Basic.Accounting/BankTransaction
                      targetPath: $.key._recTxs
                      take: 100
                      fieldFilters:
                        # Reconsider BOTH unreviewed (0) and previously unmatched (2)
                        # transactions (AB#4473): a recurring document configured
                        # AFTER its debits were imported must still pick up the
                        # burned ones on the next cycle. Safe against the null-key
                        # bulk-match incident (AB#4397) because every branch also
                        # requires the transaction key to be present (MatchRegEx
                        # below). Ignored (3) stays excluded.
                        - attributePath: MatchState
                          operator: In
                          comparisonValue: [0, 2]
                        - attributePath: CreditorId
                          operator: Equals
                          comparisonValuePath: $.key.Attributes.RecurrenceMatchValue
                        # Null-guard: require the transaction to actually carry a
                        # CreditorId. A Dauerbeleg with a null/empty
                        # RecurrenceMatchValue would otherwise degenerate to
                        # "CreditorId Equals null" and bulk-match every transaction
                        # whose CreditorId is also null. "key present AND key Equals
                        # null" is empty, so misconfigured documents match nothing.
                        # Filtered on the transaction key (not RecurrenceMatchValue)
                        # so it resolves even when the adapter has an older CK model
                        # cached — a field filter on RecurrenceMatchValue would fail
                        # to resolve there.
                        - attributePath: CreditorId
                          operator: MatchRegEx
                          comparisonValue: .+
                - type: If@1
                  description: Match by SEPA mandate reference
                  path: $.key.Attributes.RecurrenceMatchType
                  operator: Equals
                  value: 1
                  valueType: Int64
                  transformations:
                    - type: GetRtEntitiesByType@1
                      ckTypeId: Basic.Accounting/BankTransaction
                      targetPath: $.key._recTxs
                      take: 100
                      fieldFilters:
                        # In [0, 2]: see the CreditorId branch (AB#4473).
                        - attributePath: MatchState
                          operator: In
                          comparisonValue: [0, 2]
                        - attributePath: MandateReference
                          operator: Equals
                          comparisonValuePath: $.key.Attributes.RecurrenceMatchValue
                        # Null-guard: require the transaction to carry a MandateReference
                        # (see the CreditorId branch above for the rationale).
                        - attributePath: MandateReference
                          operator: MatchRegEx
                          comparisonValue: .+
                - type: If@1
                  description: Match by counterpart IBAN
                  path: $.key.Attributes.RecurrenceMatchType
                  operator: Equals
                  value: 2
                  valueType: Int64
                  transformations:
                    - type: GetRtEntitiesByType@1
                      ckTypeId: Basic.Accounting/BankTransaction
                      targetPath: $.key._recTxs
                      take: 100
                      fieldFilters:
                        # In [0, 2]: see the CreditorId branch (AB#4473).
                        - attributePath: MatchState
                          operator: In
                          comparisonValue: [0, 2]
                        - attributePath: CounterpartIban
                          operator: Equals
                          comparisonValuePath: $.key.Attributes.RecurrenceMatchValue
                        # Null-guard: require the transaction to carry a CounterpartIban
                        # (see the CreditorId branch above for the rationale).
                        - attributePath: CounterpartIban
                          operator: MatchRegEx
                          comparisonValue: .+
                - type: ForEach@1
                  description: Link every matched debit to this recurring document
                  iterationPath: $.key._recTxs.Items
                  targetPath: $.key._recTxResults
                  targetValueKind: Simple
                  targetValueWriteMode: Overwrite
                  maxDegreeOfParallelism: 1
                  transformations:
                    - type: CreateAssociationUpdate@1
                      description: Recurring document -> transaction
                      targetPath: $.key._recAssoc
                      targetValueKind: Array
                      targetValueWriteMode: Append
                      updateKind: Create
                      originRtIdPath: $.full.key.RtId
                      originCkTypeId: Meshmakers.Accounting/AccountingDocument
                      targetRtIdPath: $.key.RtId
                      targetCkTypeId: Basic.Accounting/BankTransaction
                      associationRoleId: Meshmakers.Accounting/TransactionToDocument
                    - type: CreateUpdateInfo@1
                      description: Transaction is matched to its recurring document
                      targetPath: $.key._recUpd
                      targetValueKind: Array
                      targetValueWriteMode: Append
                      updateKind: Update
                      ckTypeId: Basic.Accounting/BankTransaction
                      rtIdPath: $.key.RtId
                      attributeUpdates:
                        - attributeName: MatchState
                          attributeValueType: Enum
                          value: Matched
                        - attributeName: MatchComment
                          attributeValueType: String
                          value: Auto-matched to recurring document
            - type: Flatten@1
              description: Collect recurring transaction updates across all documents and debits
              path: $.recResults[*]._recTxResults[*]._recUpd[*]
              targetPath: $._recEntityUpdates
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
            - type: Flatten@1
              description: Collect recurring association updates
              path: $.recResults[*]._recTxResults[*]._recAssoc[*]
              targetPath: $._recAssocUpdates
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
            - type: ApplyChanges@2
              description: Persist recurring matches (transactions + document links)
              entityUpdatesPath: $._recEntityUpdates
              associationUpdatesPath: $._recAssocUpdates
            # --- Auto-categorization pass (rule-based) — runs after the recurring pass
            #     and before the document/AI passes so receiptless costs (bank fees ->
            #     MATCHED, private -> IGNORED) are resolved before AI spend. Each
            #     CategorizationRule matches transactions on exactly ONE field
            #     (case-insensitive regex) and assigns a cost category of its target
            #     type. The target category is resolved per transaction as the category
            #     of the rule's type under the FiscalYear whose date range contains the
            #     BookingDate (AB#4407) — so a rule works across fiscal years. Date field
            #     filters on dynamic CK attributes do not coerce (AB#4389), so the
            #     fiscal-year test is done in-pipeline with If@1 valueType DateTime; the
            #     category is then resolved with GetAssociationTargets (association-
            #     traversal is NOT supported by GetRtEntitiesByType field filters).
            #     Idempotency: the MatchState In [0,2] gate — a terminal rule moves the
            #     transaction out of that set on first assignment. (Non-terminal,
            #     category-only rules re-assign each cycle; keep rules terminal — see
            #     AB#4407 for the per-transaction category-exists guard.)
            - type: GetRtEntitiesByType@1
              description: Load enabled categorization rules
              ckTypeId: Meshmakers.Accounting/CategorizationRule
              targetPath: $.catRules
              take: 200
              fieldFilters:
                - attributePath: RuleEnabled
                  operator: Equals
                  comparisonValue: true
            - type: ForEach@1
              description: Apply each categorization rule
              iterationPath: $.catRules.Items
              targetPath: $.catResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                # Init empty so downstream Flatten/ForEach never hit a missing array.
                - type: WriteJson@1
                  targetPath: $.key._catTxs
                  jsonString: '{"Items":[],"TotalCount":0}'
                - type: WriteJson@1
                  targetPath: $.key._catTxResults
                  jsonString: '[]'
                - type: If@1
                  description: Match on Purpose
                  path: $.key.Attributes.RuleMatchField
                  operator: Equal
                  value: 0
                  valueType: Enum
                  transformations:
                    - type: GetRtEntitiesByType@1
                      ckTypeId: Basic.Accounting/BankTransaction
                      targetPath: $.key._catTxs
                      take: 500
                      fieldFilters:
                        - attributePath: MatchState
                          operator: In
                          comparisonValue:
                            - 0
                            - 2
                        - attributePath: Purpose
                          operator: MatchRegEx
                          comparisonValuePath: $.key.Attributes.RuleMatchValue
                - type: If@1
                  description: Match on CounterpartIban
                  path: $.key.Attributes.RuleMatchField
                  operator: Equal
                  value: 1
                  valueType: Enum
                  transformations:
                    - type: GetRtEntitiesByType@1
                      ckTypeId: Basic.Accounting/BankTransaction
                      targetPath: $.key._catTxs
                      take: 500
                      fieldFilters:
                        - attributePath: MatchState
                          operator: In
                          comparisonValue:
                            - 0
                            - 2
                        - attributePath: CounterpartIban
                          operator: MatchRegEx
                          comparisonValuePath: $.key.Attributes.RuleMatchValue
                - type: If@1
                  description: Match on CreditorId
                  path: $.key.Attributes.RuleMatchField
                  operator: Equal
                  value: 2
                  valueType: Enum
                  transformations:
                    - type: GetRtEntitiesByType@1
                      ckTypeId: Basic.Accounting/BankTransaction
                      targetPath: $.key._catTxs
                      take: 500
                      fieldFilters:
                        - attributePath: MatchState
                          operator: In
                          comparisonValue:
                            - 0
                            - 2
                        - attributePath: CreditorId
                          operator: MatchRegEx
                          comparisonValuePath: $.key.Attributes.RuleMatchValue
                - type: If@1
                  description: Match on CounterpartName
                  path: $.key.Attributes.RuleMatchField
                  operator: Equal
                  value: 3
                  valueType: Enum
                  transformations:
                    - type: GetRtEntitiesByType@1
                      ckTypeId: Basic.Accounting/BankTransaction
                      targetPath: $.key._catTxs
                      take: 500
                      fieldFilters:
                        - attributePath: MatchState
                          operator: In
                          comparisonValue:
                            - 0
                            - 2
                        - attributePath: CounterpartName
                          operator: MatchRegEx
                          comparisonValuePath: $.key.Attributes.RuleMatchValue
                - type: If@1
                  description: Match on BankTransactionCode
                  path: $.key.Attributes.RuleMatchField
                  operator: Equal
                  value: 4
                  valueType: Enum
                  transformations:
                    - type: GetRtEntitiesByType@1
                      ckTypeId: Basic.Accounting/BankTransaction
                      targetPath: $.key._catTxs
                      take: 500
                      fieldFilters:
                        - attributePath: MatchState
                          operator: In
                          comparisonValue:
                            - 0
                            - 2
                        - attributePath: BankTransactionCode
                          operator: MatchRegEx
                          comparisonValuePath: $.key.Attributes.RuleMatchValue
                - type: ForEach@1
                  description: Assign category (+ optional terminal state) per matched transaction
                  iterationPath: $.key._catTxs.Items
                  targetPath: $.key._catTxResults
                  targetValueKind: Simple
                  targetValueWriteMode: Overwrite
                  maxDegreeOfParallelism: 1
                  transformations:
                    # Direction guard: ANY, or DEBIT (Direction 1), or CREDIT (Direction 0).
                    - type: SetPrimitiveValue@1
                      targetPath: $.key._dirOk
                      value: 0
                      valueType: Int
                    - type: If@1
                      path: $.full.key.Attributes.RuleDirectionFilter
                      operator: Equal
                      value: 0
                      valueType: Enum
                      transformations:
                        - type: SetPrimitiveValue@1
                          targetPath: $.key._dirOk
                          value: 1
                          valueType: Int
                    # AB#4539: these two guards were nested inside the ANY branch
                    # above, so direction-filtered rules never set _dirOk and
                    # assigned nothing. They must be siblings of the ANY check.
                    - type: If@1
                      path: $.full.key.Attributes.RuleDirectionFilter
                      operator: Equal
                      value: 1
                      valueType: Enum
                      transformations:
                        - type: If@1
                          path: $.key.Attributes.Direction
                          operator: Equal
                          value: 1
                          valueType: Int64
                          transformations:
                            - type: SetPrimitiveValue@1
                              targetPath: $.key._dirOk
                              value: 1
                              valueType: Int
                    - type: If@1
                      path: $.full.key.Attributes.RuleDirectionFilter
                      operator: Equal
                      value: 2
                      valueType: Enum
                      transformations:
                        - type: If@1
                          path: $.key.Attributes.Direction
                          operator: Equal
                          value: 0
                          valueType: Int64
                          transformations:
                            - type: SetPrimitiveValue@1
                              targetPath: $.key._dirOk
                              value: 1
                              valueType: Int
                    - type: If@1
                      description: Direction allowed — resolve fiscal year + category
                      path: $.key._dirOk
                      operator: Equal
                      value: 1
                      valueType: Int64
                      transformations:
                        - type: GetRtEntitiesByType@1
                          description: Load fiscal years to resolve the booking-date year
                          ckTypeId: Meshmakers.Accounting/FiscalYear
                          targetPath: $.key._fys
                          take: 50
                        - type: ForEach@1
                          description: Find the fiscal year containing the booking date, then its category
                          iterationPath: $.key._fys.Items
                          targetPath: $.key._fyResults
                          targetValueKind: Simple
                          targetValueWriteMode: Overwrite
                          maxDegreeOfParallelism: 1
                          transformations:
                            - type: If@1
                              description: Booking date on/after fiscal-year start
                              path: $.full.key.Attributes.BookingDate
                              operator: GreaterEqualsThan
                              valuePath: $.key.Attributes.StartDate
                              valueType: DateTime
                              transformations:
                                - type: If@1
                                  description: Booking date on/before fiscal-year end
                                  path: $.full.key.Attributes.BookingDate
                                  operator: LessEqualsThan
                                  valuePath: $.key.Attributes.EndDate
                                  valueType: DateTime
                                  transformations:
                                    - type: GetAssociationTargets@1
                                      description: Category of the rule's type under this fiscal year
                                      originRtIdPath: $.key.RtId
                                      originCkTypeId: Meshmakers.Accounting/FiscalYear
                                      targetCkTypeId: Meshmakers.Accounting/CostCategory
                                      associationRoleId: System/ParentChild
                                      graphDirection: Inbound
                                      fieldFilters:
                                        - attributePath: CategoryType
                                          operator: Equals
                                          comparisonValuePath: $.full.full.key.Attributes.RuleTargetCategoryType
                                      targetPath: $.key._catGroups
                                    - type: If@1
                                      description: Exactly one matching category — assign it
                                      path: $.key._catGroups[0].TotalCount
                                      operator: Equal
                                      value: 1
                                      valueType: Int64
                                      transformations:
                                        - type: GetAssociationTargets@1
                                          description: Existing category on this transaction (idempotency guard, AB#4433 — the category add is not idempotent; a repeated TransactionToCategory aborts the run, cf. AB#4398)
                                          originRtIdPath: $.full.key.RtId
                                          originCkTypeId: Basic.Accounting/BankTransaction
                                          targetCkTypeId: Meshmakers.Accounting/CostCategory
                                          associationRoleId: Meshmakers.Accounting/TransactionToCategory
                                          graphDirection: Inbound
                                          targetPath: $.key._existingCat
                                        - type: If@1
                                          description: Assign the category only when the transaction has none yet (idempotent, AB#4433)
                                          path: $.key._existingCat[0].TotalCount
                                          operator: Equals
                                          value: 0
                                          valueType: Int64
                                          transformations:
                                            - type: CreateAssociationUpdate@1
                                              description: Cost category -> transaction
                                              targetPath: $.key._catAssoc
                                              targetValueKind: Array
                                              targetValueWriteMode: Append
                                              updateKind: Create
                                              originRtIdPath: $.key._catGroups[0].Items[0].RtId
                                              originCkTypeId: Meshmakers.Accounting/CostCategory
                                              targetRtIdPath: $.full.key.RtId
                                              targetCkTypeId: Basic.Accounting/BankTransaction
                                              associationRoleId: Meshmakers.Accounting/TransactionToCategory
                                        - type: If@1
                                          path: $.full.full.key.Attributes.RuleTerminalState
                                          operator: Equal
                                          value: 1
                                          valueType: Enum
                                          transformations:
                                            - type: CreateUpdateInfo@1
                                              targetPath: $.key._catUpd
                                              targetValueKind: Array
                                              targetValueWriteMode: Append
                                              updateKind: Update
                                              ckTypeId: Basic.Accounting/BankTransaction
                                              rtIdPath: $.full.key.RtId
                                              attributeUpdates:
                                                - attributeName: MatchState
                                                  attributeValueType: Enum
                                                  value: Matched
                                                - attributeName: MatchComment
                                                  attributeValueType: String
                                                  valuePath: $.full.full.key.Attributes.RuleCommentTemplate
                                        - type: If@1
                                          path: $.full.full.key.Attributes.RuleTerminalState
                                          operator: Equal
                                          value: 2
                                          valueType: Enum
                                          transformations:
                                            - type: CreateUpdateInfo@1
                                              targetPath: $.key._catUpd
                                              targetValueKind: Array
                                              targetValueWriteMode: Append
                                              updateKind: Update
                                              ckTypeId: Basic.Accounting/BankTransaction
                                              rtIdPath: $.full.key.RtId
                                              attributeUpdates:
                                                - attributeName: MatchState
                                                  attributeValueType: Enum
                                                  value: Ignored
                                                - attributeName: MatchComment
                                                  attributeValueType: String
                                                  valuePath: $.full.full.key.Attributes.RuleCommentTemplate
                # Persist this rule's assignments before the next rule runs so a terminal
                # rule's MatchState change is visible to later rules' In [0,2] gate.
                - type: Flatten@1
                  description: Collect category association updates for this rule
                  path: $.key._catTxResults[*]._fyResults[*]._catAssoc[*]
                  targetPath: $.key._catAssocUpdates
                  targetValueKind: Simple
                  targetValueWriteMode: Overwrite
                - type: Flatten@1
                  description: Collect transaction state updates for this rule
                  path: $.key._catTxResults[*]._fyResults[*]._catUpd[*]
                  targetPath: $.key._catEntityUpdates
                  targetValueKind: Simple
                  targetValueWriteMode: Overwrite
                - type: ApplyChanges@2
                  description: Persist this rule's category assignments
                  entityUpdatesPath: $.key._catEntityUpdates
                  associationUpdatesPath: $.key._catAssocUpdates
            # --- PayPal/credit-card settlement pass (AB#4509) — runs BEFORE the
            #     deterministic pass so a pass-through leg is never matched to a
            #     still-open document (which would double-count the expense).
            #     A purchase paid via PayPal appears once per involved own
            #     account: as the PayPal-ledger payment to the merchant AND as
            #     the card/bank funding debit ("PAYPAL *…"). Whichever leg the
            #     other passes match to the document first, the remaining leg is
            #     a settlement duplicate: a pending Debit with the SAME signed
            #     amount on a DIFFERENT own account, booked within ±7 days of a
            #     Matched twin. Guard: at least one of the two legs must carry a
            #     PayPal marker in Purpose or CounterpartName, so two unrelated
            #     same-amount purchases on different accounts are never
            #     conflated. The comment reuses the fixed 'Credit card/PayPal
            #     payment' prefix of the manual mark action in the transactions
            #     list, with an (auto) suffix — same convention as the bank-fee
            #     (auto)/(manual) marks. Idempotent: ignoring the leg removes it
            #     from the In [0, 2] candidate set. Credit (refund) chains are
            #     deliberately out of scope. The finAPI PayPal history gap is
            #     handled implicitly: a leg whose twin was never imported finds
            #     no Matched twin and stays available for direct matching.
            - type: GetRtEntitiesByType@1
              description: Pending debits — potential settlement duplicates of a matched twin
              ckTypeId: Basic.Accounting/BankTransaction
              targetPath: $.ppPending
              take: 500
              fieldFilters:
                - attributePath: MatchState
                  operator: In
                  comparisonValue:
                    - 0
                    - 2
                - attributePath: Direction
                  operator: Equals
                  comparisonValue: 1
            - type: ForEach@1
              description: Ignore each pending leg whose matched twin lives on another account
              iterationPath: $.ppPending.Items
              targetPath: $.ppResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                - type: GetAssociationTargets@1
                  description: Account of the pending leg (transactions are children of their bank account)
                  originRtIdPath: $.key.RtId
                  originCkTypeId: Basic.Accounting/BankTransaction
                  targetCkTypeId: Basic.Accounting/BankAccount
                  associationRoleId: System/ParentChild
                  graphDirection: Outbound
                  targetPath: $.key._ppOwnAcc
                - type: DateTime@1
                  description: Twin window floor = booking date - 7 days
                  operation: AddDays
                  path: $.key.Attributes.BookingDate
                  value: -7
                  targetPath: $.key._ppMinDate
                - type: DateTime@1
                  description: Twin window cap = booking date + 7 days
                  operation: AddDays
                  path: $.key.Attributes.BookingDate
                  value: 7
                  targetPath: $.key._ppMaxDate
                - type: GetRtEntitiesByType@1
                  description: Matched debits with the same signed amount (twin candidates)
                  ckTypeId: Basic.Accounting/BankTransaction
                  targetPath: $.key._ppTwins
                  take: 20
                  fieldFilters:
                    - attributePath: MatchState
                      operator: Equals
                      comparisonValue: 1
                    - attributePath: Direction
                      operator: Equals
                      comparisonValue: 1
                    - attributePath: Amount
                      operator: Equals
                      comparisonValuePath: $.key.Attributes.Amount
                - type: ForEach@1
                  description: Check each twin — booked close in time, PayPal marker, different account
                  iterationPath: $.key._ppTwins.Items
                  targetPath: $.key._ppTwinResults
                  targetValueKind: Simple
                  targetValueWriteMode: Overwrite
                  maxDegreeOfParallelism: 1
                  transformations:
                    - type: If@1
                      description: Twin booked no earlier than 7 days before the pending leg
                      path: $.key.Attributes.BookingDate
                      operator: GreaterEqualsThan
                      valuePath: $.full.key._ppMinDate
                      valueType: DateTime
                      transformations:
                        - type: If@1
                          description: …and no later than 7 days after it
                          path: $.key.Attributes.BookingDate
                          operator: LessEqualsThan
                          valuePath: $.full.key._ppMaxDate
                          valueType: DateTime
                          transformations:
                            # PayPal marker on EITHER leg. If@1 has no OR, so the
                            # four checks raise a flag. RegexMatch is null-safe: a
                            # null purpose/counterpart simply does not match.
                            - type: SetPrimitiveValue@1
                              description: No PayPal marker found yet
                              targetPath: $.key._ppMarker
                              value: false
                              valueType: Boolean
                            - type: If@1
                              description: Twin purpose mentions PayPal
                              path: $.key.Attributes.Purpose
                              operator: RegexMatch
                              value: (?i)paypal
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.key._ppMarker
                                  value: true
                                  valueType: Boolean
                            - type: If@1
                              description: Twin counterpart mentions PayPal
                              path: $.key.Attributes.CounterpartName
                              operator: RegexMatch
                              value: (?i)paypal
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.key._ppMarker
                                  value: true
                                  valueType: Boolean
                            - type: If@1
                              description: Pending leg purpose mentions PayPal
                              path: $.full.key.Attributes.Purpose
                              operator: RegexMatch
                              value: (?i)paypal
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.key._ppMarker
                                  value: true
                                  valueType: Boolean
                            - type: If@1
                              description: Pending leg counterpart mentions PayPal
                              path: $.full.key.Attributes.CounterpartName
                              operator: RegexMatch
                              value: (?i)paypal
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.key._ppMarker
                                  value: true
                                  valueType: Boolean
                            - type: If@1
                              description: PayPal marker present on at least one leg
                              path: $.key._ppMarker
                              operator: Equals
                              value: true
                              valueType: Boolean
                              transformations:
                                - type: GetAssociationTargets@1
                                  description: Account of the twin
                                  originRtIdPath: $.key.RtId
                                  originCkTypeId: Basic.Accounting/BankTransaction
                                  targetCkTypeId: Basic.Accounting/BankAccount
                                  associationRoleId: System/ParentChild
                                  graphDirection: Outbound
                                  targetPath: $.key._ppTwinAcc
                                # Both account lookups must have resolved — If@1
                                # with a valuePath THROWS on a missing path (the
                                # AB#4433 Part C incident), so guard on the
                                # always-present TotalCount before comparing.
                                - type: If@1
                                  description: Pending leg has a resolved account
                                  path: $.full.key._ppOwnAcc[0].TotalCount
                                  operator: GreaterThan
                                  value: 0
                                  valueType: Int64
                                  transformations:
                                    - type: If@1
                                      description: Twin has a resolved account
                                      path: $.key._ppTwinAcc[0].TotalCount
                                      operator: GreaterThan
                                      value: 0
                                      valueType: Int64
                                      transformations:
                                        - type: If@1
                                          description: Twin lives on a DIFFERENT own account — the pending leg is the settlement duplicate
                                          path: $.key._ppTwinAcc[0].Items[0].RtId
                                          operator: NotEquals
                                          valuePath: $.full.key._ppOwnAcc[0].Items[0].RtId
                                          valueType: String
                                          transformations:
                                            - type: CreateUpdateInfo@1
                                              description: Ignore the pending leg as a PayPal/card settlement pass-through
                                              targetPath: $._ppUpdates
                                              targetValueKind: Array
                                              targetValueWriteMode: Append
                                              updateKind: Update
                                              ckTypeId: Basic.Accounting/BankTransaction
                                              rtIdPath: $.full.key.RtId
                                              attributeUpdates:
                                                - attributeName: MatchState
                                                  attributeValueType: Enum
                                                  value: Ignored
                                                - attributeName: MatchComment
                                                  attributeValueType: String
                                                  value: Credit card/PayPal payment (auto)
                                            - type: ApplyChanges@2
                                              entityUpdatesPath: $._ppUpdates
            # --- Own-account transfer pass (AB#4511) — credit card statement
            #     settlement and any other transfer between own accounts. The
            #     monthly card statement books twice: the settlement debit on
            #     the checking account (CounterpartIban = the OWN card
            #     account's IBAN) and the balancing EINZUGSBETRAG credit on the
            #     card account (no counterpart IBAN). Neither leg ever needs a
            #     document — the individual purchases are imported separately.
            #     Step 1 anchors on the counterpart IBAN: a pending transaction
            #     whose CounterpartIban equals the IBAN of ANOTHER own account
            #     is by definition an own transfer — no amount/date heuristics.
            #     Step 2 catches the mirror credit: a pending credit on own
            #     account A that pairs with a debit elsewhere pointing at A's
            #     IBAN with the same absolute amount within ±3 days (regardless
            #     of that debit's match state — it may already be Ignored).
            #     Runs before the deterministic pass so a transfer leg can
            #     never claim an open document. Idempotent via the In [0, 2]
            #     gate. PayPal accounts carry no IBAN — those chains are
            #     handled by the AB#4509 twin-leg pass above.
            - type: GetRtEntitiesByType@1
              description: Own bank accounts that carry an IBAN
              ckTypeId: Basic.Accounting/BankAccount
              targetPath: $.otAccounts
              take: 50
              fieldFilters:
                - attributePath: Iban
                  operator: MatchRegEx
                  comparisonValue: .+
            - type: ForEach@1
              description: Per own IBAN account — ignore transfer legs in both directions
              iterationPath: $.otAccounts.Items
              targetPath: $.otResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                # Step 1: pending transactions ANYWHERE whose counterpart is
                # this own account — transfers to/from it, e.g. the checking
                # account's card settlement debit.
                - type: GetRtEntitiesByType@1
                  description: Pending transactions whose counterpart IBAN is this own account
                  ckTypeId: Basic.Accounting/BankTransaction
                  targetPath: $.key._otAnchored
                  take: 200
                  fieldFilters:
                    - attributePath: MatchState
                      operator: In
                      comparisonValue:
                        - 0
                        - 2
                    - attributePath: CounterpartIban
                      operator: Equals
                      comparisonValuePath: $.key.Attributes.Iban
                - type: ForEach@1
                  description: Ignore each anchored transfer leg (unless it sits on the counterpart account itself)
                  iterationPath: $.key._otAnchored.Items
                  targetPath: $.key._otAnchoredResults
                  targetValueKind: Simple
                  targetValueWriteMode: Overwrite
                  maxDegreeOfParallelism: 1
                  transformations:
                    - type: GetAssociationTargets@1
                      description: Account of this transaction (self-reference guard)
                      originRtIdPath: $.key.RtId
                      originCkTypeId: Basic.Accounting/BankTransaction
                      targetCkTypeId: Basic.Accounting/BankAccount
                      associationRoleId: System/ParentChild
                      graphDirection: Outbound
                      targetPath: $.key._otTxAcc
                    - type: If@1
                      description: Transaction has a resolved account
                      path: $.key._otTxAcc[0].TotalCount
                      operator: GreaterThan
                      value: 0
                      valueType: Int64
                      transformations:
                        - type: If@1
                          description: Not a self-reference — the leg belongs to a different account than its counterpart
                          path: $.key._otTxAcc[0].Items[0].RtId
                          operator: NotEquals
                          valuePath: $.full.key.RtId
                          valueType: String
                          transformations:
                            - type: CreateUpdateInfo@1
                              description: Ignore the transfer leg (own counterpart IBAN)
                              targetPath: $._otUpdates
                              targetValueKind: Array
                              targetValueWriteMode: Append
                              updateKind: Update
                              ckTypeId: Basic.Accounting/BankTransaction
                              rtIdPath: $.key.RtId
                              attributeUpdates:
                                - attributeName: MatchState
                                  attributeValueType: Enum
                                  value: Ignored
                                - attributeName: MatchComment
                                  attributeValueType: String
                                  value: Own-account transfer (auto)
                            - type: ApplyChanges@2
                              entityUpdatesPath: $._otUpdates
                # Step 2: pending credits ON this account (e.g. EINZUGSBETRAG,
                # no counterpart IBAN) — pair with a debit elsewhere that
                # points at this account's IBAN, same absolute amount, ±3 days.
                - type: GetAssociationTargets@1
                  description: Pending credits on this own account (mirror-leg candidates)
                  originRtIdPath: $.key.RtId
                  originCkTypeId: Basic.Accounting/BankAccount
                  targetCkTypeId: Basic.Accounting/BankTransaction
                  associationRoleId: System/ParentChild
                  graphDirection: Inbound
                  fieldFilters:
                    - attributePath: MatchState
                      operator: In
                      comparisonValue:
                        - 0
                        - 2
                    - attributePath: Direction
                      operator: Equals
                      comparisonValue: 0
                  targetPath: $.key._otCredits
                - type: ForEach@1
                  description: Pair each pending credit with a debit pointing at this account
                  iterationPath: $.key._otCredits[0].Items
                  targetPath: $.key._otCreditResults
                  targetValueKind: Simple
                  targetValueWriteMode: Overwrite
                  maxDegreeOfParallelism: 1
                  transformations:
                    - type: Math@1
                      description: Expected debit amount = negative credit amount
                      path: $.key
                      itemPath: $.Attributes.Amount
                      itemTargetPath: $._otNegAmount
                      operation: Multiply
                      value: -1
                    - type: DateTime@1
                      description: Pair window floor = booking date - 3 days
                      operation: AddDays
                      path: $.key.Attributes.BookingDate
                      value: -3
                      targetPath: $.key._otMinDate
                    - type: DateTime@1
                      description: Pair window cap = booking date + 3 days
                      operation: AddDays
                      path: $.key.Attributes.BookingDate
                      value: 3
                      targetPath: $.key._otMaxDate
                    - type: GetRtEntitiesByType@1
                      description: Debits pointing at this account with the matching amount (any match state)
                      ckTypeId: Basic.Accounting/BankTransaction
                      targetPath: $.key._otDebits
                      take: 10
                      fieldFilters:
                        - attributePath: Direction
                          operator: Equals
                          comparisonValue: 1
                        - attributePath: CounterpartIban
                          operator: Equals
                          comparisonValuePath: $.full.key.Attributes.Iban
                        - attributePath: Amount
                          operator: Equals
                          comparisonValuePath: $.key._otNegAmount
                    - type: ForEach@1
                      description: Ignore the credit when a debit twin books within the window
                      iterationPath: $.key._otDebits.Items
                      targetPath: $.key._otDebitResults
                      targetValueKind: Simple
                      targetValueWriteMode: Overwrite
                      maxDegreeOfParallelism: 1
                      transformations:
                        - type: If@1
                          description: Debit booked no earlier than 3 days before the credit
                          path: $.key.Attributes.BookingDate
                          operator: GreaterEqualsThan
                          valuePath: $.full.key._otMinDate
                          valueType: DateTime
                          transformations:
                            - type: If@1
                              description: …and no later than 3 days after it
                              path: $.key.Attributes.BookingDate
                              operator: LessEqualsThan
                              valuePath: $.full.key._otMaxDate
                              valueType: DateTime
                              transformations:
                                - type: CreateUpdateInfo@1
                                  description: Ignore the mirror credit of the own-account transfer
                                  targetPath: $._otMirrorUpdates
                                  targetValueKind: Array
                                  targetValueWriteMode: Append
                                  updateKind: Update
                                  ckTypeId: Basic.Accounting/BankTransaction
                                  rtIdPath: $.full.key.RtId
                                  attributeUpdates:
                                    - attributeName: MatchState
                                      attributeValueType: Enum
                                      value: Ignored
                                    - attributeName: MatchComment
                                      attributeValueType: String
                                      value: Own-account transfer (auto)
                                - type: ApplyChanges@2
                                  entityUpdatesPath: $._otMirrorUpdates
            - type: GetRtEntitiesByType@1
              # The deterministic pass reconsiders BOTH unreviewed (0) and
              # previously unmatched (2) transactions. Bank transactions and
              # accounting documents arrive asynchronously (bank sync vs. document
              # upload/analysis), so a transaction is often burned to Unmatched
              # before its document exists as an OPEN candidate. Re-including
              # Unmatched here lets a document parsed later still match its
              # transaction. take is raised so the whole in-scope backlog is
              # re-checked each cycle instead of starving behind the first page.
              # The AI fallback below stays gated on Unreviewed (0) only, so AI
              # tokens are spent at most once per transaction.
              description: Load unreviewed and previously unmatched bank transactions
              ckTypeId: Basic.Accounting/BankTransaction
              targetPath: $.pending
              take: 3000
              fieldFilters:
                - attributePath: MatchState
                  operator: In
                  comparisonValue:
                    - 0
                    - 2
            - type: ForEach@1
              description: Deterministic pass — unique open document with the exact amount and matching type
              iterationPath: $.pending.Items
              targetPath: $.detResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                - type: SetPrimitiveValue@1
                  description: Debit pays an INCOMING document (default)
                  targetPath: $._wantedDocType
                  value: 0
                  valueType: Int
                - type: Math@1
                  description: Default document amount = transaction amount (Credit)
                  path: $.key
                  itemPath: $.Attributes.Amount
                  itemTargetPath: $._docAmount
                  operation: Multiply
                  value: 1
                - type: If@1
                  description: Debit — invert the sign to get the positive document gross total
                  path: $.key.Attributes.Direction
                  operator: Equals
                  value: 1
                  valueType: Int64
                  transformations:
                    - type: Math@1
                      path: $.key
                      itemPath: $.Attributes.Amount
                      itemTargetPath: $._docAmount
                      operation: Multiply
                      value: -1
                - type: If@1
                  description: Credit is a payment we receive — match OUTGOING documents
                  path: $.key.Attributes.Direction
                  operator: Equals
                  value: 0
                  valueType: Int64
                  transformations:
                    - type: SetPrimitiveValue@1
                      targetPath: $._wantedDocType
                      value: 1
                      valueType: Int
                # AB#4542: the candidate query is restricted to documents whose
                # own date window [document date - 1 day, document date + 14
                # days] contains this booking date (inverted below: the document
                # date must lie in [booking date - 14 days, booking date + 1
                # day]). Without the date filters, recurring same-amount invoice
                # series (e.g. a monthly retainer) made TotalCount N>1 forever
                # and every series member stayed OPEN, even though each
                # transaction's window singles out exactly one member. With the
                # filters, TotalCount==1 means "exactly one IN-WINDOW candidate"
                # and out-of-window or undated documents no longer block the
                # pass (undated documents simply drop out of the query).
                - type: DateTime@1
                  description: Earliest document date whose match window still contains this booking date
                  operation: AddDays
                  path: $.key.Attributes.BookingDate
                  value: -14
                  targetPath: $.key._detDocMinDate
                - type: DateTime@1
                  description: Latest document date whose match window still contains this booking date
                  operation: AddDays
                  path: $.key.Attributes.BookingDate
                  value: 1
                  targetPath: $.key._detDocMaxDate
                - type: GetRtEntitiesByType@1
                  description: Open documents with exactly this gross total and type, dated so their match window contains this booking date
                  ckTypeId: Meshmakers.Accounting/AccountingDocument
                  targetPath: $._candidates
                  take: 5
                  fieldFilters:
                    - attributePath: DocumentState
                      operator: Equals
                      comparisonValue: 0
                    - attributePath: DocumentType
                      operator: Equals
                      comparisonValuePath: $._wantedDocType
                    - attributePath: GrossTotal
                      operator: Equals
                      comparisonValuePath: $.key._docAmount
                    - attributePath: DocumentDate
                      operator: GreaterEqualThan
                      comparisonValuePath: $.key._detDocMinDate
                    - attributePath: DocumentDate
                      operator: LessEqualThan
                      comparisonValuePath: $.key._detDocMaxDate
                - type: If@1
                  description: Exactly one in-window candidate — deterministic match
                  path: $._candidates.TotalCount
                  operator: Equals
                  value: 1
                  valueType: Int64
                  transformations:
                    # AB#4512: exact amount + unique open document is NOT enough.
                    # A monthly 9.99 subscription invoice was claimed by an
                    # unrelated 9.99 debit booked 103 days later (Tesla invoice,
                    # Apple transaction) — common subscription amounts collide
                    # across vendors, and card debits carry no CounterpartName to
                    # anchor on. Guard the exact pass like the AB#4433 fallback:
                    # (a) the booking date must lie in [document date - 1 day,
                    # document date + 14 days] (kept under ~28 days so monthly
                    # recurring invoices stay discriminable; later payments are
                    # left to the AI pass and its 90-day rule), and (b) the
                    # transaction must be the ONLY pending one with this amount
                    # and direction inside that window — otherwise the assignment
                    # is ambiguous (iteration order would decide the winner) and
                    # is left to the AI pass / manual review. The DocumentDate
                    # null-guard uses RegexMatch (null-safe); DateTime@1 would
                    # throw on a null date and poison every cycle.
                    - type: If@1
                      description: Candidate document carries a document date
                      path: $._candidates.Items[0].Attributes.DocumentDate
                      operator: RegexMatch
                      value: .+
                      valueType: String
                      transformations:
                        - type: DateTime@1
                          description: Date-window floor = document date - 1 day
                          operation: AddDays
                          path: $._candidates.Items[0].Attributes.DocumentDate
                          value: -1
                          targetPath: $.key._detMinDate
                        - type: DateTime@1
                          description: Date-window cap = document date + 14 days
                          operation: AddDays
                          path: $._candidates.Items[0].Attributes.DocumentDate
                          value: 14
                          targetPath: $.key._detMaxDate
                        - type: If@1
                          description: Transaction booked no earlier than one day before the document date
                          path: $.key.Attributes.BookingDate
                          operator: GreaterEqualsThan
                          valuePath: $.key._detMinDate
                          valueType: DateTime
                          transformations:
                            - type: If@1
                              description: …and no later than 14 days after the document date
                              path: $.key.Attributes.BookingDate
                              operator: LessEqualsThan
                              valuePath: $.key._detMaxDate
                              valueType: DateTime
                              transformations:
                                - type: GetRtEntitiesByType@1
                                  # AB#4542: the rival query is window-filtered in the
                                  # QUERY itself. Without the date filters, take:50
                                  # truncated the rival set — with 90+ pending
                                  # transactions of a popular amount (61.48 weekly
                                  # subscription) the transaction under test was often
                                  # not among the returned 50, the in-window sum came
                                  # out 0 instead of 1 and the match was wrongly
                                  # skipped. Window-filtering keeps the set tiny and
                                  # the count exact regardless of volume.
                                  description: Pending transactions with the same amount and direction booked inside the document's date window (rival candidates)
                                  ckTypeId: Basic.Accounting/BankTransaction
                                  targetPath: $.key._detRivals
                                  take: 50
                                  fieldFilters:
                                    - attributePath: MatchState
                                      operator: In
                                      comparisonValue:
                                        - 0
                                        - 2
                                    - attributePath: Amount
                                      operator: Equals
                                      comparisonValuePath: $.key.Attributes.Amount
                                    - attributePath: Direction
                                      operator: Equals
                                      comparisonValuePath: $.key.Attributes.Direction
                                    - attributePath: BookingDate
                                      operator: GreaterEqualThan
                                      comparisonValuePath: $.key._detMinDate
                                    - attributePath: BookingDate
                                      operator: LessEqualThan
                                      comparisonValuePath: $.key._detMaxDate
                                - type: ForEach@1
                                  description: Flag every rival booked inside the document's date window (the transaction itself counts once)
                                  iterationPath: $.key._detRivals.Items
                                  targetPath: $.key._detRivalChecks
                                  targetValueKind: Simple
                                  targetValueWriteMode: Overwrite
                                  maxDegreeOfParallelism: 1
                                  transformations:
                                    - type: SetPrimitiveValue@1
                                      description: Rival outside the window (default)
                                      targetPath: $.key._inWindow
                                      value: 0
                                      valueType: Int
                                    - type: If@1
                                      description: Rival booked no earlier than the window floor
                                      path: $.key.Attributes.BookingDate
                                      operator: GreaterEqualsThan
                                      valuePath: $.full.key._detMinDate
                                      valueType: DateTime
                                      transformations:
                                        - type: If@1
                                          description: …and no later than the window cap
                                          path: $.key.Attributes.BookingDate
                                          operator: LessEqualsThan
                                          valuePath: $.full.key._detMaxDate
                                          valueType: DateTime
                                          transformations:
                                            - type: SetPrimitiveValue@1
                                              targetPath: $.key._inWindow
                                              value: 1
                                              valueType: Int
                                - type: SumAggregation@1
                                  description: Count rivals inside the window
                                  targetPath: $.key._detRivalsInWindow
                                  aggregations:
                                    - path: $.key._detRivalChecks[*]
                                      aggregationPath: $._inWindow
                                      value: 1
                                      filterPath: null
                                      comparisonValue: null
                                - type: If@1
                                  description: The transaction is the only in-window rival — unambiguous, apply the match
                                  path: $.key._detRivalsInWindow
                                  operator: Equals
                                  value: 1
                                  valueType: Double
                                  transformations:
                                    - type: GetAssociationTargets@1
                                      description: Existing tx links on this document (idempotency guard, AB#4398)
                                      originRtIdPath: $._candidates.Items[0].RtId
                                      originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                      targetCkTypeId: Basic.Accounting/BankTransaction
                                      associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                      graphDirection: Outbound
                                      targetPath: $._detExisting
                                    - type: If@1
                                      description: Create the link only when the document is not already linked (a stale link still settles via the existing one)
                                      path: $._detExisting[0].TotalCount
                                      operator: Equals
                                      value: 0
                                      valueType: Int64
                                      transformations:
                                        - type: CreateAssociationUpdate@1
                                          description: Link document to transaction
                                          targetPath: $._detAssocs
                                          targetValueKind: Array
                                          targetValueWriteMode: Append
                                          updateKind: Create
                                          originRtIdPath: $._candidates.Items[0].RtId
                                          originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                          targetRtIdPath: $.key.RtId
                                          targetCkTypeId: Basic.Accounting/BankTransaction
                                          associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                    - type: CreateUpdateInfo@1
                                      description: Document is paid
                                      targetPath: $._detUpdates
                                      targetValueKind: Array
                                      targetValueWriteMode: Append
                                      updateKind: Update
                                      ckTypeId: Meshmakers.Accounting/AccountingDocument
                                      rtIdPath: $._candidates.Items[0].RtId
                                      attributeUpdates:
                                        - attributeName: DocumentState
                                          attributeValueType: Enum
                                          value: PAID
                                        - attributeName: PaidAmount
                                          attributeValueType: Double
                                          valuePath: $.key._docAmount
                                    - type: CreateUpdateInfo@1
                                      description: Transaction is matched
                                      targetPath: $._detUpdates
                                      targetValueKind: Array
                                      targetValueWriteMode: Append
                                      updateKind: Update
                                      ckTypeId: Basic.Accounting/BankTransaction
                                      rtIdPath: $.key.RtId
                                      attributeUpdates:
                                        - attributeName: MatchState
                                          attributeValueType: Enum
                                          value: Matched
                                    - type: ApplyChanges@2
                                      entityUpdatesPath: $._detUpdates
                                      associationUpdatesPath: $._detAssocs
                - type: If@1
                  # Tolerance pass: no document had the EXACT amount. Cross-border
                  # transfers frequently add a small fee to the SAME booking, so the
                  # paid amount is a few euro above the invoice gross total (e.g. an
                  # AZV fee of ~8 EUR). Anchor on the bank ACCOUNT HOLDER — the invoice
                  # bank section's account name (Vendor/Customer.AccountName) equals the
                  # transaction's CounterpartName even when the letterhead company name
                  # differs — and accept the unique open document whose GrossTotal lies
                  # in [payment - feeCap, payment]. Runs only when the exact pass found
                  # nothing, so an exact match always wins.
                  description: Tolerance pass — same account holder, payment exceeds invoice by a small transfer fee
                  path: $._candidates.TotalCount
                  operator: Equals
                  value: 0
                  valueType: Int64
                  transformations:
                    - type: Math@1
                      description: Lower bound = payment minus the maximum tolerated transfer fee (15 EUR)
                      path: $.key
                      itemPath: $._docAmount
                      itemTargetPath: $._docAmountFloor
                      operation: Subtract
                      value: 15
                    - type: SetPrimitiveValue@1
                      description: Not yet settled by the account-holder pass (drives the amount+date fallback)
                      targetPath: $._tolSettled
                      value: false
                      valueType: Boolean
                    - type: If@1
                      # Only anchor when the transaction carries a counterpart name;
                      # otherwise the identity filter would match null-account-holder
                      # documents. RegexMatch '.+' is a null/empty guard.
                      description: Transaction has a counterpart name to anchor on
                      path: $.key.Attributes.CounterpartName
                      operator: RegexMatch
                      value: .+
                      valueType: String
                      transformations:
                        - type: If@1
                          description: INCOMING invoice — the vendor is the account holder
                          path: $._wantedDocType
                          operator: Equals
                          value: 0
                          valueType: Int
                          transformations:
                            - type: GetRtEntitiesByType@1
                              description: Open incoming docs, same vendor account holder, gross within fee tolerance
                              ckTypeId: Meshmakers.Accounting/AccountingDocument
                              targetPath: $._tolCandidates
                              take: 5
                              fieldFilters:
                                - attributePath: DocumentState
                                  operator: Equals
                                  comparisonValue: 0
                                - attributePath: DocumentType
                                  operator: Equals
                                  comparisonValue: 0
                                - attributePath: Vendor.AccountName
                                  operator: Equals
                                  comparisonValuePath: $.key.Attributes.CounterpartName
                                - attributePath: GrossTotal
                                  operator: LessEqualThan
                                  comparisonValuePath: $.key._docAmount
                                - attributePath: GrossTotal
                                  operator: GreaterEqualThan
                                  comparisonValuePath: $.key._docAmountFloor
                        - type: If@1
                          description: OUTGOING invoice — the customer is the account holder
                          path: $._wantedDocType
                          operator: Equals
                          value: 1
                          valueType: Int
                          transformations:
                            - type: GetRtEntitiesByType@1
                              description: Open outgoing docs, same customer account holder, gross within fee tolerance
                              ckTypeId: Meshmakers.Accounting/AccountingDocument
                              targetPath: $._tolCandidates
                              take: 5
                              fieldFilters:
                                - attributePath: DocumentState
                                  operator: Equals
                                  comparisonValue: 0
                                - attributePath: DocumentType
                                  operator: Equals
                                  comparisonValue: 1
                                - attributePath: Customer.AccountName
                                  operator: Equals
                                  comparisonValuePath: $.key.Attributes.CounterpartName
                                - attributePath: GrossTotal
                                  operator: LessEqualThan
                                  comparisonValuePath: $.key._docAmount
                                - attributePath: GrossTotal
                                  operator: GreaterEqualThan
                                  comparisonValuePath: $.key._docAmountFloor
                        - type: If@1
                          description: Exactly one account-holder match within tolerance — settle it
                          path: $._tolCandidates.TotalCount
                          operator: Equals
                          value: 1
                          valueType: Int64
                          transformations:
                            - type: GetAssociationTargets@1
                              description: Existing tx links on this document (idempotency guard, AB#4398)
                              originRtIdPath: $._tolCandidates.Items[0].RtId
                              originCkTypeId: Meshmakers.Accounting/AccountingDocument
                              targetCkTypeId: Basic.Accounting/BankTransaction
                              associationRoleId: Meshmakers.Accounting/TransactionToDocument
                              graphDirection: Outbound
                              targetPath: $._tolExisting
                            - type: If@1
                              description: Create the link only when the document is not already linked (a stale link still settles via the existing one)
                              path: $._tolExisting[0].TotalCount
                              operator: Equals
                              value: 0
                              valueType: Int64
                              transformations:
                                - type: CreateAssociationUpdate@1
                                  description: Link document to transaction
                                  targetPath: $._tolAssocs
                                  targetValueKind: Array
                                  targetValueWriteMode: Append
                                  updateKind: Create
                                  originRtIdPath: $._tolCandidates.Items[0].RtId
                                  originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                  targetRtIdPath: $.key.RtId
                                  targetCkTypeId: Basic.Accounting/BankTransaction
                                  associationRoleId: Meshmakers.Accounting/TransactionToDocument
                            - type: CreateUpdateInfo@1
                              description: Document is paid — PaidAmount is the invoice total; the extra paid is the transfer fee
                              targetPath: $._tolUpdates
                              targetValueKind: Array
                              targetValueWriteMode: Append
                              updateKind: Update
                              ckTypeId: Meshmakers.Accounting/AccountingDocument
                              rtIdPath: $._tolCandidates.Items[0].RtId
                              attributeUpdates:
                                - attributeName: DocumentState
                                  attributeValueType: Enum
                                  value: PAID
                                - attributeName: PaidAmount
                                  attributeValueType: Double
                                  valuePath: $._tolCandidates.Items[0].Attributes.GrossTotal
                            - type: CreateUpdateInfo@1
                              description: Transaction is matched (payment includes a transfer fee)
                              targetPath: $._tolUpdates
                              targetValueKind: Array
                              targetValueWriteMode: Append
                              updateKind: Update
                              ckTypeId: Basic.Accounting/BankTransaction
                              rtIdPath: $.key.RtId
                              attributeUpdates:
                                - attributeName: MatchState
                                  attributeValueType: Enum
                                  value: Matched
                                - attributeName: MatchComment
                                  attributeValueType: String
                                  value: Auto-matched incl. transfer fee (payment exceeds invoice)
                            - type: ApplyChanges@2
                              entityUpdatesPath: $._tolUpdates
                              associationUpdatesPath: $._tolAssocs
                            - type: SetPrimitiveValue@1
                              description: Settled by the account-holder pass — skip the amount+date fallback
                              targetPath: $._tolSettled
                              value: true
                              valueType: Boolean
                    - type: If@1
                      # AB#4433: the anonymous fallback below is designed for
                      # transactions WITHOUT an identity anchor. A transaction that
                      # carries a counterpart name (e.g. a SEPA debit from
                      # "Salzburger Nachrichten") must never be fee-band-matched to
                      # an unrelated vendor's invoice. Mark such transactions as
                      # settled so the fallback is skipped. RegexMatch is null-safe:
                      # a null counterpart name simply does not match.
                      description: Counterpart name present — identity anchor exists, skip the anonymous fallback
                      path: $.key.Attributes.CounterpartName
                      operator: RegexMatch
                      value: ".+"
                      valueType: String
                      transformations:
                        - type: SetPrimitiveValue@1
                          description: Named counterpart — the anonymous amount+date fallback must not fire
                          targetPath: $._tolSettled
                          value: true
                          valueType: Boolean
                    - type: If@1
                      # Last-resort fallback for documents WITHOUT an extracted account
                      # holder name (e.g. historical documents parsed before accountName
                      # existed): no identity anchor, so it is deliberately conservative —
                      # it accepts a document only when it is the UNIQUE open document of
                      # the right type whose GrossTotal is in [payment - feeCap, payment]
                      # AND the transaction booked on/after the document date (a payment
                      # never precedes its invoice). Runs only when the account-holder
                      # pass did not settle this transaction.
                      description: Amount+date fallback — unique open doc by amount band and booking date
                      path: $._tolSettled
                      operator: Equals
                      value: false
                      valueType: Boolean
                      transformations:
                        - type: GetRtEntitiesByType@1
                          description: Open docs of the right type, gross within the fee tolerance band
                          ckTypeId: Meshmakers.Accounting/AccountingDocument
                          targetPath: $._fbCandidates
                          take: 5
                          fieldFilters:
                            - attributePath: DocumentState
                              operator: Equals
                              comparisonValue: 0
                            - attributePath: DocumentType
                              operator: Equals
                              comparisonValuePath: $._wantedDocType
                            - attributePath: GrossTotal
                              operator: LessEqualThan
                              comparisonValuePath: $.key._docAmount
                            - attributePath: GrossTotal
                              operator: GreaterEqualThan
                              comparisonValuePath: $.key._docAmountFloor
                        - type: If@1
                          description: Exactly one amount-band candidate
                          path: $._fbCandidates.TotalCount
                          operator: Equals
                          value: 1
                          valueType: Int64
                          transformations:
                            # AB#4433: without an identity anchor, amount-band proximity
                            # alone is not enough — an Amazon payment 4.7 months after an
                            # unrelated NordVPN invoice landed in the band. Anonymous
                            # matches must also be CLOSE IN TIME: booking date within
                            # [document date - 1 day, document date + 14 days].
                            - type: DateTime@1
                              description: Date-window floor = document date - 1 day
                              operation: AddDays
                              path: $._fbCandidates.Items[0].Attributes.DocumentDate
                              value: -1
                              targetPath: $._fbMinDate
                            - type: DateTime@1
                              description: Date-window cap = document date + 14 days
                              operation: AddDays
                              path: $._fbCandidates.Items[0].Attributes.DocumentDate
                              value: 14
                              targetPath: $._fbMaxDate
                            - type: If@1
                              description: Transaction booked no earlier than one day before the document date
                              path: $.key.Attributes.BookingDate
                              operator: GreaterEqualsThan
                              valuePath: $._fbMinDate
                              valueType: DateTime
                              transformations:
                                - type: If@1
                                  description: …and no later than 14 days after the document date
                                  path: $.key.Attributes.BookingDate
                                  operator: LessEqualsThan
                                  valuePath: $._fbMaxDate
                                  valueType: DateTime
                                  transformations:
                                    # AB#4512 pattern ported to the anonymous fallback: the one-sided
                                    # "exactly one doc candidate" check is order-dependent — a Booking.com
                                    # debit (-374.95) claimed a Bierheuriger invoice (366.30) that a second
                                    # pending POS debit (-380.00, incl. tip) matched just as well. Require
                                    # TWO-SIDED uniqueness: this transaction must be the only pending
                                    # transaction whose amount lies in the document's fee band and whose
                                    # booking date lies in the document's date window; ambiguous clusters
                                    # fall through to the AI pass, which sees the purpose text.
                                    - type: SetPrimitiveValue@1
                                      description: Candidate gross total, copied to the transaction scope for Math
                                      targetPath: $.key._fbGross
                                      valuePath: $._fbCandidates.Items[0].Attributes.GrossTotal
                                      valueType: Double
                                    - type: Math@1
                                      description: Band cap = gross total + the maximum tolerated transfer fee (15 EUR)
                                      path: $.key
                                      itemPath: $._fbGross
                                      itemTargetPath: $._fbGrossCap
                                      operation: Add
                                      value: 15
                                    - type: SetPrimitiveValue@1
                                      description: Signed rival band lower bound (Credit default = gross total)
                                      targetPath: $.key._fbRivLow
                                      valuePath: $.key._fbGross
                                      valueType: Double
                                    - type: SetPrimitiveValue@1
                                      description: Signed rival band upper bound (Credit default = gross total + fee cap)
                                      targetPath: $.key._fbRivHigh
                                      valuePath: $.key._fbGrossCap
                                      valueType: Double
                                    - type: If@1
                                      description: Debit — amounts are negative, the signed band is the negated mirror
                                      path: $.key.Attributes.Direction
                                      operator: Equals
                                      value: 1
                                      valueType: Int64
                                      transformations:
                                        - type: Math@1
                                          description: Lower bound = -(gross total + fee cap)
                                          path: $.key
                                          itemPath: $._fbGrossCap
                                          itemTargetPath: $._fbRivLow
                                          operation: Multiply
                                          value: -1
                                        - type: Math@1
                                          description: Upper bound = -(gross total)
                                          path: $.key
                                          itemPath: $._fbGross
                                          itemTargetPath: $._fbRivHigh
                                          operation: Multiply
                                          value: -1
                                    - type: GetRtEntitiesByType@1
                                      # AB#4542: window-filtered in the query itself —
                                      # same take:50 truncation issue as the exact-pass
                                      # rival guard (90+ pending same-amount
                                      # transactions pushed the transaction under test
                                      # out of the returned page).
                                      description: Pending transactions whose amount lies in the same fee band, booked inside the document's date window (rival candidates)
                                      ckTypeId: Basic.Accounting/BankTransaction
                                      targetPath: $.key._fbRivals
                                      take: 50
                                      fieldFilters:
                                        - attributePath: MatchState
                                          operator: In
                                          comparisonValue:
                                            - 0
                                            - 2
                                        - attributePath: Direction
                                          operator: Equals
                                          comparisonValuePath: $.key.Attributes.Direction
                                        - attributePath: Amount
                                          operator: GreaterEqualThan
                                          comparisonValuePath: $.key._fbRivLow
                                        - attributePath: Amount
                                          operator: LessEqualThan
                                          comparisonValuePath: $.key._fbRivHigh
                                        - attributePath: BookingDate
                                          operator: GreaterEqualThan
                                          comparisonValuePath: $._fbMinDate
                                        - attributePath: BookingDate
                                          operator: LessEqualThan
                                          comparisonValuePath: $._fbMaxDate
                                    - type: ForEach@1
                                      description: Flag every rival booked inside the document's date window (the transaction itself counts once)
                                      iterationPath: $.key._fbRivals.Items
                                      targetPath: $.key._fbRivalChecks
                                      targetValueKind: Simple
                                      targetValueWriteMode: Overwrite
                                      maxDegreeOfParallelism: 1
                                      transformations:
                                        - type: SetPrimitiveValue@1
                                          description: Rival outside the window (default)
                                          targetPath: $.key._inWindow
                                          value: 0
                                          valueType: Int
                                        - type: If@1
                                          description: Rival booked no earlier than the window floor
                                          path: $.key.Attributes.BookingDate
                                          operator: GreaterEqualsThan
                                          valuePath: $.full._fbMinDate
                                          valueType: DateTime
                                          transformations:
                                            - type: If@1
                                              description: …and no later than the window cap
                                              path: $.key.Attributes.BookingDate
                                              operator: LessEqualsThan
                                              valuePath: $.full._fbMaxDate
                                              valueType: DateTime
                                              transformations:
                                                - type: SetPrimitiveValue@1
                                                  targetPath: $.key._inWindow
                                                  value: 1
                                                  valueType: Int
                                    - type: SumAggregation@1
                                      description: Count rivals inside the window
                                      targetPath: $.key._fbRivalsInWindow
                                      aggregations:
                                        - path: $.key._fbRivalChecks[*]
                                          aggregationPath: $._inWindow
                                          value: 1
                                          filterPath: null
                                          comparisonValue: null
                                    - type: If@1
                                      description: The transaction is the only in-window rival — unambiguous, apply the match
                                      path: $.key._fbRivalsInWindow
                                      operator: Equals
                                      value: 1
                                      valueType: Double
                                      transformations:
                                        - type: GetAssociationTargets@1
                                          description: Existing tx links on this document (idempotency guard, AB#4398)
                                          originRtIdPath: $._fbCandidates.Items[0].RtId
                                          originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                          targetCkTypeId: Basic.Accounting/BankTransaction
                                          associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                          graphDirection: Outbound
                                          targetPath: $._fbExisting
                                        - type: If@1
                                          description: Create the link only when the document is not already linked (a stale link still settles via the existing one)
                                          path: $._fbExisting[0].TotalCount
                                          operator: Equals
                                          value: 0
                                          valueType: Int64
                                          transformations:
                                            - type: CreateAssociationUpdate@1
                                              description: Link document to transaction
                                              targetPath: $._fbAssocs
                                              targetValueKind: Array
                                              targetValueWriteMode: Append
                                              updateKind: Create
                                              originRtIdPath: $._fbCandidates.Items[0].RtId
                                              originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                              targetRtIdPath: $.key.RtId
                                              targetCkTypeId: Basic.Accounting/BankTransaction
                                              associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                        - type: CreateUpdateInfo@1
                                          description: Document is paid — PaidAmount is the invoice total; the extra paid is the transfer fee
                                          targetPath: $._fbUpdates
                                          targetValueKind: Array
                                          targetValueWriteMode: Append
                                          updateKind: Update
                                          ckTypeId: Meshmakers.Accounting/AccountingDocument
                                          rtIdPath: $._fbCandidates.Items[0].RtId
                                          attributeUpdates:
                                            - attributeName: DocumentState
                                              attributeValueType: Enum
                                              value: PAID
                                            - attributeName: PaidAmount
                                              attributeValueType: Double
                                              valuePath: $._fbCandidates.Items[0].Attributes.GrossTotal
                                        - type: CreateUpdateInfo@1
                                          description: Transaction is matched (amount+date; payment includes a transfer fee)
                                          targetPath: $._fbUpdates
                                          targetValueKind: Array
                                          targetValueWriteMode: Append
                                          updateKind: Update
                                          ckTypeId: Basic.Accounting/BankTransaction
                                          rtIdPath: $.key.RtId
                                          attributeUpdates:
                                            - attributeName: MatchState
                                              attributeValueType: Enum
                                              value: Matched
                                            - attributeName: MatchComment
                                              attributeValueType: String
                                              value: Auto-matched by amount and date incl. transfer fee (no account-holder name)
                                        - type: ApplyChanges@2
                                          entityUpdatesPath: $._fbUpdates
                                          associationUpdatesPath: $._fbAssocs
            # --- Foreign-currency card pass (AB#4590) — foreign-currency card
            #     purchases ("E-COMM 24,00 USD ... SPESEN: 1,25 KURS: 1,160408")
            #     are booked in EUR: 24 USD becomes 21,93 EUR incl. the forex
            #     surcharge, so the EUR Amount never equals the invoice
            #     GrossTotal, which the AI stores as the ORIGINAL foreign amount
            #     (24). The exact pass (EUR amount == gross) and the tolerance
            #     pass (payment >= invoice, but here the EUR payment is BELOW the
            #     foreign gross) therefore both miss them, and these card debits
            #     carry no CounterpartName to anchor on. This pass reads the
            #     printed foreign amount out of the purpose (TransformString
            #     RegexExtract, German number -> JSON number) and settles the
            #     UNIQUE open incoming document whose GrossTotal equals it inside
            #     the document's date window. Gated to purposes carrying the
            #     all-caps "SPESEN:" surcharge (MatchRegEx is CASE-SENSITIVE, so
            #     it hits only genuine foreign-currency card purchases) — domestic
            #     EUR card debits (no SPESEN, EUR amount == gross) stay with the
            #     exact pass and its AB#4512 rival guard, so the same-amount
            #     collision cannot reappear here. No tx-side rival guard is
            #     needed: the doc-side uniqueness (exactly one in-window gross),
            #     the sequential settle (maxDegreeOfParallelism 1 flips the doc to
            #     PAID before the next iteration) and the existing-link guard make
            #     a double match impossible.
            - type: GetRtEntitiesByType@1
              description: Pending foreign-currency card debits (purpose carries the all-caps SPESEN surcharge)
              ckTypeId: Basic.Accounting/BankTransaction
              targetPath: $.fxPending
              take: 500
              fieldFilters:
                - attributePath: MatchState
                  operator: In
                  comparisonValue:
                    - 0
                    - 2
                - attributePath: Direction
                  operator: Equals
                  comparisonValue: 1
                - attributePath: Purpose
                  operator: MatchRegEx
                  comparisonValue: "SPESEN:"
            - type: ForEach@1
              description: Foreign-currency card pass — match the printed foreign amount to a unique open incoming document
              iterationPath: $.fxPending.Items
              targetPath: $.fxResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                # Presence guard first (string), so a non-conforming purpose never
                # reaches a numeric node as null (RegexMatch is null-safe; the
                # guarded value is a string, never a number — cf. the
                # RegexMatch-on-number trap). Pattern: the amount printed right
                # after "E-COMM" followed by its currency token ("E-COMM 24,00 USD",
                # "E-COMM 1.234,56 US"). No inline (?i): the token is upper-case.
                - type: TransformString@1
                  description: Foreign amount as text (presence probe)
                  path: $.key
                  sourcePath: $.Attributes.Purpose
                  targetPath: $._fxAmountStr
                  operation: RegexExtract
                  pattern: '^E-COMM\s+([0-9.]+,[0-9]{2})\s+[A-Z]'
                - type: If@1
                  description: A foreign amount was extracted from the purpose
                  path: $.key._fxAmountStr
                  operator: RegexMatch
                  value: .+
                  valueType: String
                  transformations:
                    # Same capture, coerced to a JSON number (strip "." grouping,
                    # "," -> "."), so the GrossTotal Equals filter can compare it.
                    - type: TransformString@1
                      description: Foreign amount as number for the gross-total filter
                      path: $.key
                      sourcePath: $.Attributes.Purpose
                      targetPath: $._fxAmount
                      operation: RegexExtract
                      pattern: '^E-COMM\s+([0-9.]+,[0-9]{2})\s+[A-Z]'
                      asDecimal: true
                      groupSeparator: "."
                      decimalSeparator: ","
                    - type: DateTime@1
                      description: Earliest document date whose match window still contains this booking date
                      operation: AddDays
                      path: $.key.Attributes.BookingDate
                      value: -14
                      targetPath: $.key._fxDocMinDate
                    - type: DateTime@1
                      description: Latest document date whose match window still contains this booking date
                      operation: AddDays
                      path: $.key.Attributes.BookingDate
                      value: 1
                      targetPath: $.key._fxDocMaxDate
                    - type: GetRtEntitiesByType@1
                      description: Open incoming documents whose gross total equals the printed foreign amount, dated so their window contains this booking date
                      ckTypeId: Meshmakers.Accounting/AccountingDocument
                      targetPath: $._fxCands
                      take: 5
                      fieldFilters:
                        - attributePath: DocumentState
                          operator: Equals
                          comparisonValue: 0
                        - attributePath: DocumentType
                          operator: Equals
                          comparisonValue: 0
                        - attributePath: GrossTotal
                          operator: Equals
                          comparisonValuePath: $.key._fxAmount
                        - attributePath: DocumentDate
                          operator: GreaterEqualThan
                          comparisonValuePath: $.key._fxDocMinDate
                        - attributePath: DocumentDate
                          operator: LessEqualThan
                          comparisonValuePath: $.key._fxDocMaxDate
                    - type: If@1
                      description: Exactly one open incoming document with that foreign gross in-window — settle it
                      path: $._fxCands.TotalCount
                      operator: Equals
                      value: 1
                      valueType: Int64
                      transformations:
                        - type: GetAssociationTargets@1
                          description: Existing tx links on this document (idempotency guard, AB#4398)
                          originRtIdPath: $._fxCands.Items[0].RtId
                          originCkTypeId: Meshmakers.Accounting/AccountingDocument
                          targetCkTypeId: Basic.Accounting/BankTransaction
                          associationRoleId: Meshmakers.Accounting/TransactionToDocument
                          graphDirection: Outbound
                          targetPath: $._fxExisting
                        - type: If@1
                          description: Create the link only when the document is not already linked
                          path: $._fxExisting[0].TotalCount
                          operator: Equals
                          value: 0
                          valueType: Int64
                          transformations:
                            - type: CreateAssociationUpdate@1
                              description: Link document to transaction
                              targetPath: $._fxAssocs
                              targetValueKind: Array
                              targetValueWriteMode: Append
                              updateKind: Create
                              originRtIdPath: $._fxCands.Items[0].RtId
                              originCkTypeId: Meshmakers.Accounting/AccountingDocument
                              targetRtIdPath: $.key.RtId
                              targetCkTypeId: Basic.Accounting/BankTransaction
                              associationRoleId: Meshmakers.Accounting/TransactionToDocument
                        - type: CreateUpdateInfo@1
                          description: Document is paid (foreign-currency card purchase)
                          targetPath: $._fxUpdates
                          targetValueKind: Array
                          targetValueWriteMode: Append
                          updateKind: Update
                          ckTypeId: Meshmakers.Accounting/AccountingDocument
                          rtIdPath: $._fxCands.Items[0].RtId
                          attributeUpdates:
                            - attributeName: DocumentState
                              attributeValueType: Enum
                              value: PAID
                            - attributeName: PaidAmount
                              attributeValueType: Double
                              valuePath: $._fxCands.Items[0].Attributes.GrossTotal
                        - type: CreateUpdateInfo@1
                          description: Transaction is matched
                          targetPath: $._fxUpdates
                          targetValueKind: Array
                          targetValueWriteMode: Append
                          updateKind: Update
                          ckTypeId: Basic.Accounting/BankTransaction
                          rtIdPath: $.key.RtId
                          attributeUpdates:
                            - attributeName: MatchState
                              attributeValueType: Enum
                              value: Matched
                            - attributeName: MatchComment
                              attributeValueType: String
                              value: Auto-matched by foreign-currency amount (auto)
                        - type: ApplyChanges@2
                          entityUpdatesPath: $._fxUpdates
                          associationUpdatesPath: $._fxAssocs
            # --- Document-number pass (AB#4542) — the transfer purpose often
            #     carries the exact document number, the strongest deterministic
            #     signal there is. It covers what the amount passes cannot see:
            #     payments made weeks after the document date and net-of-VAT
            #     transfers (invoice gross 7.68, transferred 6.40 = net, purpose
            #     "150418325"). Doc-driven: for every OPEN document with a
            #     sufficiently distinctive number, accept the SINGLE pending
            #     transaction of the right direction whose purpose contains that
            #     number — but only when the paid amount equals the document's
            #     gross OR net total. The amount guard keeps interest bookings
            #     and collective transfers that merely REFERENCE the number from
            #     settling the document. Deliberately no date window: purpose +
            #     amount + direction anchors harder than booking proximity.
            - type: GetRtEntitiesByType@1
              description: Open documents for the document-number pass
              ckTypeId: Meshmakers.Accounting/AccountingDocument
              targetPath: $.dnDocs
              take: 500
              fieldFilters:
                - attributePath: DocumentState
                  operator: Equals
                  comparisonValue: 0
            - type: ForEach@1
              description: Document-number pass — unique pending transaction whose purpose contains the document number
              iterationPath: $.dnDocs.Items
              targetPath: $.dnResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                # Number guards: at least 5 characters, only literal characters
                # that are safe inside the Like filter (Like builds an UNESCAPED
                # regex server-side), and at least one run of 4 digits so short
                # generic tokens ("2025", "A-1") can never anchor a match.
                # RegexMatch is null-safe — numberless documents fall through.
                - type: If@1
                  description: Document number has at least 5 characters
                  path: $.key.Attributes.DocumentNumber
                  operator: RegexMatch
                  value: .{5,}
                  valueType: String
                  transformations:
                    - type: If@1
                      description: …contains only literal characters safe for the Like filter
                      path: $.key.Attributes.DocumentNumber
                      operator: RegexMatch
                      value: ^[A-Za-z0-9 ./_-]+$
                      valueType: String
                      transformations:
                        - type: If@1
                          description: …and carries a run of at least 4 digits
                          path: $.key.Attributes.DocumentNumber
                          operator: RegexMatch
                          value: '[0-9]{4}'
                          valueType: String
                          transformations:
                            - type: SetPrimitiveValue@1
                              description: An INCOMING document is paid by a Debit (default)
                              targetPath: $.key._dnWantedDir
                              value: 1
                              valueType: Int
                            - type: If@1
                              description: OUTGOING document — expect an incoming Credit
                              path: $.key.Attributes.DocumentType
                              operator: Equals
                              value: 1
                              valueType: Int64
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.key._dnWantedDir
                                  value: 0
                                  valueType: Int
                            - type: GetRtEntitiesByType@1
                              description: Pending transactions of the right direction whose purpose contains the document number
                              ckTypeId: Basic.Accounting/BankTransaction
                              targetPath: $.key._dnTxs
                              take: 5
                              fieldFilters:
                                - attributePath: MatchState
                                  operator: In
                                  comparisonValue:
                                    - 0
                                    - 2
                                - attributePath: Direction
                                  operator: Equals
                                  comparisonValuePath: $.key._dnWantedDir
                                - attributePath: Purpose
                                  operator: Like
                                  comparisonValuePath: $.key.Attributes.DocumentNumber
                            - type: If@1
                              description: At least one pending transaction references the document number
                              path: $.key._dnTxs.TotalCount
                              operator: GreaterEqualsThan
                              value: 1
                              valueType: Int64
                              transformations:
                                # The paid total is the SUM over all purpose hits:
                                # split payments (net first, VAT transferred
                                # separately weeks later — troii case) settle as a
                                # whole when the parts add up to the gross total.
                                - type: SumAggregation@1
                                  description: Signed sum over all purpose hits
                                  targetPath: $.key._dnSumSigned
                                  aggregations:
                                    - path: $.key._dnTxs.Items[*]
                                      aggregationPath: $.Attributes.Amount
                                      value: 1
                                      filterPath: null
                                      comparisonValue: null
                                - type: Math@1
                                  description: Paid total (Credit default = signed sum)
                                  path: $.key
                                  itemPath: $._dnSumSigned
                                  itemTargetPath: $._dnPaidAbs
                                  operation: Multiply
                                  value: 1
                                - type: If@1
                                  description: Debit — invert the sign to get the positive paid total
                                  path: $.key._dnWantedDir
                                  operator: Equals
                                  value: 1
                                  valueType: Int
                                  transformations:
                                    - type: Math@1
                                      path: $.key
                                      itemPath: $._dnSumSigned
                                      itemTargetPath: $._dnPaidAbs
                                      operation: Multiply
                                      value: -1
                                - type: SetPrimitiveValue@1
                                  description: Amount not plausible yet (default)
                                  targetPath: $.key._dnAmountOk
                                  value: 0
                                  valueType: Int
                                # Float-safe amount check — a sum of doubles (6.40
                                # + 1.28) need not be bit-equal to 7.68, so the
                                # paid total must lie within ±0.005 of the target.
                                # GreaterThan on a Double path is null-safe (a
                                # null/missing GrossTotal simply fails the
                                # comparison — RegexMatch would THROW on numeric
                                # attributes) and keeps the GrossTotal-0
                                # extraction defect from ever matching.
                                - type: If@1
                                  description: Document carries a positive gross total
                                  path: $.key.Attributes.GrossTotal
                                  operator: GreaterThan
                                  value: 0
                                  valueType: Double
                                  transformations:
                                    - type: Math@1
                                      description: Gross band floor
                                      path: $.key
                                      itemPath: $.Attributes.GrossTotal
                                      itemTargetPath: $._dnGrossLo
                                      operation: Subtract
                                      value: 0.005
                                    - type: Math@1
                                      description: Gross band cap
                                      path: $.key
                                      itemPath: $.Attributes.GrossTotal
                                      itemTargetPath: $._dnGrossHi
                                      operation: Add
                                      value: 0.005
                                    - type: If@1
                                      description: Paid total no less than the gross band floor
                                      path: $.key._dnPaidAbs
                                      operator: GreaterEqualsThan
                                      valuePath: $.key._dnGrossLo
                                      valueType: Double
                                      transformations:
                                        - type: If@1
                                          description: …and no more than the gross band cap — amount plausible
                                          path: $.key._dnPaidAbs
                                          operator: LessEqualsThan
                                          valuePath: $.key._dnGrossHi
                                          valueType: Double
                                          transformations:
                                            - type: SetPrimitiveValue@1
                                              targetPath: $.key._dnAmountOk
                                              value: 1
                                              valueType: Int
                                # A SINGLE transaction paying exactly the net total
                                # is also plausible (transfer without VAT, e.g.
                                # reverse charge) — never accepted for multiple
                                # hits, where only the gross sum counts.
                                - type: If@1
                                  description: Exactly one hit — also accept the net total
                                  path: $.key._dnTxs.TotalCount
                                  operator: Equals
                                  value: 1
                                  valueType: Int64
                                  transformations:
                                    - type: If@1
                                      description: Document carries a positive net total (null-safe numeric guard)
                                      path: $.key.Attributes.NetTotal
                                      operator: GreaterThan
                                      value: 0
                                      valueType: Double
                                      transformations:
                                        - type: Math@1
                                          description: Net band floor
                                          path: $.key
                                          itemPath: $.Attributes.NetTotal
                                          itemTargetPath: $._dnNetLo
                                          operation: Subtract
                                          value: 0.005
                                        - type: Math@1
                                          description: Net band cap
                                          path: $.key
                                          itemPath: $.Attributes.NetTotal
                                          itemTargetPath: $._dnNetHi
                                          operation: Add
                                          value: 0.005
                                        - type: If@1
                                          description: Paid amount no less than the net band floor
                                          path: $.key._dnPaidAbs
                                          operator: GreaterEqualsThan
                                          valuePath: $.key._dnNetLo
                                          valueType: Double
                                          transformations:
                                            - type: If@1
                                              description: …and no more than the net band cap — amount plausible
                                              path: $.key._dnPaidAbs
                                              operator: LessEqualsThan
                                              valuePath: $.key._dnNetHi
                                              valueType: Double
                                              transformations:
                                                - type: SetPrimitiveValue@1
                                                  targetPath: $.key._dnAmountOk
                                                  value: 1
                                                  valueType: Int
                                - type: If@1
                                  description: Amount plausible — settle the document and all referenced transactions
                                  path: $.key._dnAmountOk
                                  operator: Equals
                                  value: 1
                                  valueType: Int64
                                  transformations:
                                    - type: GetAssociationTargets@1
                                      description: Existing tx links on this document (idempotency guard, AB#4398)
                                      originRtIdPath: $.key.RtId
                                      originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                      targetCkTypeId: Basic.Accounting/BankTransaction
                                      associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                      graphDirection: Outbound
                                      targetPath: $.key._dnExisting
                                    - type: ForEach@1
                                      description: Mark every referenced transaction matched, link it when the document is not already linked
                                      iterationPath: $.key._dnTxs.Items
                                      targetPath: $.key._dnLinkResults
                                      targetValueKind: Simple
                                      targetValueWriteMode: Overwrite
                                      maxDegreeOfParallelism: 1
                                      transformations:
                                        - type: CreateUpdateInfo@1
                                          description: Transaction is matched (document number found in the transfer purpose)
                                          targetPath: $.key._upd
                                          updateKind: Update
                                          ckTypeId: Basic.Accounting/BankTransaction
                                          rtIdPath: $.key.RtId
                                          attributeUpdates:
                                            - attributeName: MatchState
                                              attributeValueType: Enum
                                              value: Matched
                                            - attributeName: MatchComment
                                              attributeValueType: String
                                              value: Auto-matched by document number in transfer purpose
                                        - type: If@1
                                          description: Create the link only when the document is not already linked (a stale link still settles via the existing one)
                                          path: $.full.key._dnExisting[0].TotalCount
                                          operator: Equals
                                          value: 0
                                          valueType: Int64
                                          transformations:
                                            - type: CreateAssociationUpdate@1
                                              description: Link document to transaction
                                              targetPath: $.key._assoc
                                              updateKind: Create
                                              originRtIdPath: $.full.key.RtId
                                              originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                              targetRtIdPath: $.key.RtId
                                              targetCkTypeId: Basic.Accounting/BankTransaction
                                              associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                    - type: Flatten@1
                                      description: Collect the transaction updates
                                      path: $.key._dnLinkResults[*]._upd
                                      targetPath: $.key._dnUpdates
                                      targetValueKind: Simple
                                      targetValueWriteMode: Overwrite
                                    - type: If@1
                                      description: Collect the new links (only produced when the document had none)
                                      path: $.key._dnExisting[0].TotalCount
                                      operator: Equals
                                      value: 0
                                      valueType: Int64
                                      transformations:
                                        - type: Flatten@1
                                          path: $.key._dnLinkResults[*]._assoc
                                          targetPath: $.key._dnAssocs
                                          targetValueKind: Simple
                                          targetValueWriteMode: Overwrite
                                    - type: CreateUpdateInfo@1
                                      description: Document is paid — PaidAmount is the total actually transferred (net-of-VAT transfers stay visible)
                                      targetPath: $.key._dnUpdates
                                      targetValueKind: Array
                                      targetValueWriteMode: Append
                                      updateKind: Update
                                      ckTypeId: Meshmakers.Accounting/AccountingDocument
                                      rtIdPath: $.key.RtId
                                      attributeUpdates:
                                        - attributeName: DocumentState
                                          attributeValueType: Enum
                                          value: PAID
                                        - attributeName: PaidAmount
                                          attributeValueType: Double
                                          valuePath: $.key._dnPaidAbs
                                    - type: ApplyChanges@2
                                      entityUpdatesPath: $.key._dnUpdates
                                      associationUpdatesPath: $.key._dnAssocs
            # --- Recurring-merchant series pass (AB#4542) — card-charging
            #     subscription vendors (HelloFresh & co) debit a few days
            #     BEFORE the invoice date and repeat identical amounts weekly.
            #     The exact pass cannot settle these: the charge lies outside
            #     its [-1,+14] window (charge precedes invoice), or several
            #     identical charges share one window (rival guard, by design).
            #     This pass compensates with a STRONGER anchor: the charge must
            #     carry the vendor-name prefix in its purpose AND match the
            #     gross total exactly, inside a [-7,+14] day window around the
            #     document date. Documents iterate OLDEST-FIRST with a
            #     per-document ApplyChanges, so a weekly chain unravels
            #     greedily: the earliest open document claims the earliest
            #     anchored charge, the next document the next one. Worst case
            #     within one merchant series is a swap of adjacent same-amount
            #     weeks — immaterial for bookkeeping.
            - type: GetRtEntitiesByType@1
              description: Open documents for the series pass, oldest first
              ckTypeId: Meshmakers.Accounting/AccountingDocument
              targetPath: $.srDocs
              take: 500
              sortOrders:
                - attributeName: DocumentDate
                  sortOrder: Ascending
              fieldFilters:
                - attributePath: DocumentState
                  operator: Equals
                  comparisonValue: 0
            - type: ForEach@1
              description: Series pass — earliest purpose-anchored charge settles the earliest open document
              iterationPath: $.srDocs.Items
              targetPath: $.srResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                # Guards: positive gross (GreaterThan/Double is null-safe — a
                # RegexMatch on a numeric attribute would throw), a document
                # date for the window, and a vendor name whose first 8
                # characters are Like-safe (Like builds an UNESCAPED regex) —
                # that prefix is the purpose anchor ("HelloFre" matches
                # "...HELLOFRESH BERLIN...", case-insensitively).
                - type: If@1
                  description: Document carries a positive gross total
                  path: $.key.Attributes.GrossTotal
                  operator: GreaterThan
                  value: 0
                  valueType: Double
                  transformations:
                    - type: If@1
                      description: Document carries a document date
                      path: $.key.Attributes.DocumentDate
                      operator: RegexMatch
                      value: .+
                      valueType: String
                      transformations:
                        # Nested-record shape: an RtRecord attribute serializes
                        # as { CkRecordId, Attributes: {...} } in the data
                        # context — the company name lives one level deeper than
                        # the fieldFilter path (Vendor.CompanyName) suggests.
                        - type: If@1
                          description: Vendor name is at least 8 Like-safe characters
                          path: $.key.Attributes.Vendor.Attributes.CompanyName
                          operator: RegexMatch
                          value: ^[A-Za-z0-9][A-Za-z0-9 .-]{7,}
                          valueType: String
                          transformations:
                            - type: TransformString@1
                              description: Purpose anchor = first 8 characters of the vendor name
                              path: $.key
                              sourcePath: $.Attributes.Vendor.Attributes.CompanyName
                              targetPath: $._srPrefix
                              operation: SubstringFromStart
                              length: 8
                            - type: Math@1
                              description: Expected signed charge (INCOMING default = negative gross)
                              path: $.key
                              itemPath: $.Attributes.GrossTotal
                              itemTargetPath: $._srAmount
                              operation: Multiply
                              value: -1
                            - type: If@1
                              description: OUTGOING document — expect an incoming Credit (positive amount)
                              path: $.key.Attributes.DocumentType
                              operator: Equals
                              value: 1
                              valueType: Int64
                              transformations:
                                - type: Math@1
                                  path: $.key
                                  itemPath: $.Attributes.GrossTotal
                                  itemTargetPath: $._srAmount
                                  operation: Multiply
                                  value: 1
                            - type: DateTime@1
                              description: Window floor = document date - 7 days (card charges precede the invoice)
                              operation: AddDays
                              path: $.key.Attributes.DocumentDate
                              value: -7
                              targetPath: $.key._srMin
                            - type: DateTime@1
                              description: Window cap = document date + 14 days
                              operation: AddDays
                              path: $.key.Attributes.DocumentDate
                              value: 14
                              targetPath: $.key._srMax
                            - type: GetRtEntitiesByType@1
                              description: Pending charges of the exact amount, purpose-anchored to the vendor, inside the window, earliest first
                              ckTypeId: Basic.Accounting/BankTransaction
                              targetPath: $.key._srTxs
                              take: 5
                              sortOrders:
                                - attributeName: BookingDate
                                  sortOrder: Ascending
                              fieldFilters:
                                - attributePath: MatchState
                                  operator: In
                                  comparisonValue:
                                    - 0
                                    - 2
                                - attributePath: Amount
                                  operator: Equals
                                  comparisonValuePath: $.key._srAmount
                                - attributePath: BookingDate
                                  operator: GreaterEqualThan
                                  comparisonValuePath: $.key._srMin
                                - attributePath: BookingDate
                                  operator: LessEqualThan
                                  comparisonValuePath: $.key._srMax
                                - attributePath: Purpose
                                  operator: Like
                                  comparisonValuePath: $.key._srPrefix
                            - type: If@1
                              description: At least one anchored charge — the earliest settles this document
                              path: $.key._srTxs.TotalCount
                              operator: GreaterEqualsThan
                              value: 1
                              valueType: Int64
                              transformations:
                                - type: GetAssociationTargets@1
                                  description: Existing tx links on this document (idempotency guard, AB#4398)
                                  originRtIdPath: $.key.RtId
                                  originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                  targetCkTypeId: Basic.Accounting/BankTransaction
                                  associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                  graphDirection: Outbound
                                  targetPath: $.key._srExisting
                                - type: If@1
                                  description: Create the link only when the document is not already linked (a stale link still settles via the existing one)
                                  path: $.key._srExisting[0].TotalCount
                                  operator: Equals
                                  value: 0
                                  valueType: Int64
                                  transformations:
                                    - type: CreateAssociationUpdate@1
                                      description: Link document to the earliest anchored charge
                                      targetPath: $.key._srAssocs
                                      targetValueKind: Array
                                      targetValueWriteMode: Append
                                      updateKind: Create
                                      originRtIdPath: $.key.RtId
                                      originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                      targetRtIdPath: $.key._srTxs.Items[0].RtId
                                      targetCkTypeId: Basic.Accounting/BankTransaction
                                      associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                - type: CreateUpdateInfo@1
                                  description: Document is paid
                                  targetPath: $.key._srUpdates
                                  targetValueKind: Array
                                  targetValueWriteMode: Append
                                  updateKind: Update
                                  ckTypeId: Meshmakers.Accounting/AccountingDocument
                                  rtIdPath: $.key.RtId
                                  attributeUpdates:
                                    - attributeName: DocumentState
                                      attributeValueType: Enum
                                      value: PAID
                                    - attributeName: PaidAmount
                                      attributeValueType: Double
                                      valuePath: $.key.Attributes.GrossTotal
                                - type: CreateUpdateInfo@1
                                  description: Transaction is matched (recurring merchant series)
                                  targetPath: $.key._srUpdates
                                  targetValueKind: Array
                                  targetValueWriteMode: Append
                                  updateKind: Update
                                  ckTypeId: Basic.Accounting/BankTransaction
                                  rtIdPath: $.key._srTxs.Items[0].RtId
                                  attributeUpdates:
                                    - attributeName: MatchState
                                      attributeValueType: Enum
                                      value: Matched
                                    - attributeName: MatchComment
                                      attributeValueType: String
                                      value: Auto-matched by recurring merchant series (vendor purpose anchor, exact amount)
                                - type: ApplyChanges@2
                                  entityUpdatesPath: $.key._srUpdates
                                  associationUpdatesPath: $.key._srAssocs
            # --- Multi-invoice upload sum pass (AB#4543) — one uploaded PDF can
            #     contain SEVERAL independent invoices (e.g. an Amazon marketplace
            #     order with one invoice per seller) that are settled by ONE
            #     payment over the total. The counterpart/purpose ("AMZN MKTP...")
            #     has no textual relation to the per-seller vendor names, so the
            #     purpose-anchored passes cannot link these, and the AI pass is
            #     unreliable here (no textual anchor, and its inline candidate
            #     list is take-capped). The upload itself is the deterministic
            #     anchor: for every OPEN document that came out of a multi-invoice
            #     upload, settle ALL sibling documents against the SINGLE pending
            #     transaction whose amount equals the sibling gross sum inside a
            #     [-7,+14] day window around the document date. All-or-nothing:
            #     the pass only fires while every sibling is still OPEN and
            #     unlinked, and the whole group commits in one ApplyChanges —
            #     re-runs skip settled groups, ambiguity (several candidate
            #     transactions) falls through to the AI/manual path.
            - type: GetRtEntitiesByType@1
              description: Open documents for the multi-invoice upload sum pass
              ckTypeId: Meshmakers.Accounting/AccountingDocument
              targetPath: $.miDocs
              take: 500
              fieldFilters:
                - attributePath: DocumentState
                  operator: Equals
                  comparisonValue: 0
            - type: ForEach@1
              description: Multi-invoice upload sum pass — settle all sibling documents of one upload against the single transaction over their sum
              iterationPath: $.miDocs.Items
              targetPath: $.miResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                - type: GetAssociationTargets@1
                  description: Upload (staging entity) this document came from
                  originRtIdPath: $.key.RtId
                  originCkTypeId: Meshmakers.Accounting/AccountingDocument
                  targetCkTypeId: Meshmakers.Accounting/UploadedDocument
                  associationRoleId: Meshmakers.Accounting/UploadedToDocument
                  graphDirection: Inbound
                  targetPath: $.key._miUpload
                - type: If@1
                  description: Document originates from an upload
                  path: $.key._miUpload[0].TotalCount
                  operator: GreaterEqualsThan
                  value: 1
                  valueType: Int64
                  transformations:
                    - type: GetAssociationTargets@1
                      description: All sibling documents of that upload (including this one)
                      originRtIdPath: $.key._miUpload[0].Items[0].RtId
                      originCkTypeId: Meshmakers.Accounting/UploadedDocument
                      targetCkTypeId: Meshmakers.Accounting/AccountingDocument
                      associationRoleId: Meshmakers.Accounting/UploadedToDocument
                      graphDirection: Outbound
                      targetPath: $.key._miSibs
                    - type: If@1
                      description: The upload produced SEVERAL documents — a multi-invoice PDF
                      path: $.key._miSibs[0].TotalCount
                      operator: GreaterThan
                      value: 1
                      valueType: Int64
                      transformations:
                        - type: ForEach@1
                          description: Check every sibling — open, unlinked, and collect its gross total
                          iterationPath: $.key._miSibs[0].Items
                          targetPath: $.key._miSibChecks
                          targetValueKind: Simple
                          targetValueWriteMode: Overwrite
                          maxDegreeOfParallelism: 1
                          transformations:
                            - type: SetPrimitiveValue@1
                              description: Sibling not settleable (default)
                              targetPath: $.key._open
                              value: 0
                              valueType: Int
                            - type: SetPrimitiveValue@1
                              targetPath: $.key._gross
                              value: 0
                              valueType: Double
                            - type: SetPrimitiveValue@1
                              description: Existing transaction links (default)
                              targetPath: $.key._links
                              value: 0
                              valueType: Int
                            - type: GetRtEntitiesByType@1
                              description: Load the sibling document (association targets carry no attributes)
                              ckTypeId: Meshmakers.Accounting/AccountingDocument
                              targetPath: $.sib
                              take: 1
                              fieldFilters:
                                - attributePath: RtId
                                  operator: Equals
                                  comparisonValuePath: $.key.RtId
                            - type: If@1
                              description: Sibling resolved
                              path: $.sib.TotalCount
                              operator: GreaterEqualsThan
                              value: 1
                              valueType: Int64
                              transformations:
                                - type: If@1
                                  description: Sibling is OPEN
                                  path: $.sib.Items[0].Attributes.DocumentState
                                  operator: Equals
                                  value: 0
                                  valueType: Int64
                                  transformations:
                                    - type: SetPrimitiveValue@1
                                      targetPath: $.key._open
                                      value: 1
                                      valueType: Int
                                - type: If@1
                                  description: Sibling carries a positive gross total (null-safe numeric guard)
                                  path: $.sib.Items[0].Attributes.GrossTotal
                                  operator: GreaterThan
                                  value: 0
                                  valueType: Double
                                  transformations:
                                    - type: SetPrimitiveValue@1
                                      targetPath: $.key._gross
                                      valuePath: $.sib.Items[0].Attributes.GrossTotal
                                      valueType: Double
                            - type: GetAssociationTargets@1
                              description: Existing transaction links of the sibling (idempotency guard, AB#4398)
                              originRtIdPath: $.key.RtId
                              originCkTypeId: Meshmakers.Accounting/AccountingDocument
                              targetCkTypeId: Basic.Accounting/BankTransaction
                              associationRoleId: Meshmakers.Accounting/TransactionToDocument
                              graphDirection: Outbound
                              targetPath: $.sibLinks
                            - type: SetPrimitiveValue@1
                              targetPath: $.key._links
                              valuePath: $.sibLinks[0].TotalCount
                              valueType: Int
                        - type: SumAggregation@1
                          description: Open siblings in the group
                          targetPath: $.key._miOpenCount
                          aggregations:
                            - path: $.key._miSibChecks[*]
                              aggregationPath: $._open
                              value: 1
                              filterPath: null
                              comparisonValue: null
                        - type: SumAggregation@1
                          description: Gross sum over the group
                          targetPath: $.key._miGrossSum
                          aggregations:
                            - path: $.key._miSibChecks[*]
                              aggregationPath: $._gross
                              value: 1
                              filterPath: null
                              comparisonValue: null
                        - type: SumAggregation@1
                          description: Pre-existing transaction links over the group
                          targetPath: $.key._miLinkSum
                          aggregations:
                            - path: $.key._miSibChecks[*]
                              aggregationPath: $._links
                              value: 1
                              filterPath: null
                              comparisonValue: null
                        - type: If@1
                          description: Every sibling is still OPEN — the group is settleable as a whole
                          path: $.key._miOpenCount
                          operator: Equals
                          valuePath: $.key._miSibs[0].TotalCount
                          valueType: Double
                          transformations:
                            - type: If@1
                              description: No sibling is linked to a transaction yet
                              path: $.key._miLinkSum
                              operator: Equals
                              value: 0
                              valueType: Double
                              transformations:
                                - type: If@1
                                  description: Group gross sum is positive
                                  path: $.key._miGrossSum
                                  operator: GreaterThan
                                  value: 0
                                  valueType: Double
                                  transformations:
                                    - type: If@1
                                      description: Document carries a document date for the window
                                      path: $.key.Attributes.DocumentDate
                                      operator: RegexMatch
                                      value: .+
                                      valueType: String
                                      transformations:
                                        - type: SetPrimitiveValue@1
                                          description: An INCOMING group is paid by a Debit (default)
                                          targetPath: $.key._miDir
                                          value: 1
                                          valueType: Int
                                        - type: Math@1
                                          description: Expected signed amount (Debit = negative gross sum)
                                          path: $.key
                                          itemPath: $._miGrossSum
                                          itemTargetPath: $._miAmt
                                          operation: Multiply
                                          value: -1
                                        - type: If@1
                                          description: OUTGOING group — expect an incoming Credit over the positive sum
                                          path: $.key.Attributes.DocumentType
                                          operator: Equals
                                          value: 1
                                          valueType: Int64
                                          transformations:
                                            - type: SetPrimitiveValue@1
                                              targetPath: $.key._miDir
                                              value: 0
                                              valueType: Int
                                            - type: Math@1
                                              path: $.key
                                              itemPath: $._miGrossSum
                                              itemTargetPath: $._miAmt
                                              operation: Multiply
                                              value: 1
                                        - type: Math@1
                                          description: Float-safe amount band floor
                                          path: $.key
                                          itemPath: $._miAmt
                                          itemTargetPath: $._miAmtLo
                                          operation: Subtract
                                          value: 0.005
                                        - type: Math@1
                                          description: Float-safe amount band cap
                                          path: $.key
                                          itemPath: $._miAmt
                                          itemTargetPath: $._miAmtHi
                                          operation: Add
                                          value: 0.005
                                        - type: DateTime@1
                                          description: Window floor = document date - 7 days (card charges can precede the invoice)
                                          operation: AddDays
                                          path: $.key.Attributes.DocumentDate
                                          value: -7
                                          targetPath: $.key._miMinDate
                                        - type: DateTime@1
                                          description: Window cap = document date + 14 days
                                          operation: AddDays
                                          path: $.key.Attributes.DocumentDate
                                          value: 14
                                          targetPath: $.key._miMaxDate
                                        - type: GetRtEntitiesByType@1
                                          description: Pending transactions matching the group sum inside the window
                                          ckTypeId: Basic.Accounting/BankTransaction
                                          targetPath: $.key._miTxs
                                          take: 5
                                          fieldFilters:
                                            - attributePath: MatchState
                                              operator: In
                                              comparisonValue:
                                                - 0
                                                - 2
                                            - attributePath: Direction
                                              operator: Equals
                                              comparisonValuePath: $.key._miDir
                                            - attributePath: Amount
                                              operator: GreaterEqualThan
                                              comparisonValuePath: $.key._miAmtLo
                                            - attributePath: Amount
                                              operator: LessEqualThan
                                              comparisonValuePath: $.key._miAmtHi
                                            - attributePath: BookingDate
                                              operator: GreaterEqualThan
                                              comparisonValuePath: $.key._miMinDate
                                            - attributePath: BookingDate
                                              operator: LessEqualThan
                                              comparisonValuePath: $.key._miMaxDate
                                        - type: If@1
                                          description: Exactly ONE candidate transaction — unambiguous, settle the whole group
                                          path: $.key._miTxs.TotalCount
                                          operator: Equals
                                          value: 1
                                          valueType: Int64
                                          transformations:
                                            - type: ForEach@1
                                              description: Settle every sibling document against the group transaction
                                              iterationPath: $.key._miSibChecks
                                              targetPath: $.key._miApply
                                              targetValueKind: Simple
                                              targetValueWriteMode: Overwrite
                                              maxDegreeOfParallelism: 1
                                              transformations:
                                                - type: CreateUpdateInfo@1
                                                  description: Sibling document is paid with its own gross total
                                                  targetPath: $.key._upd
                                                  updateKind: Update
                                                  ckTypeId: Meshmakers.Accounting/AccountingDocument
                                                  rtIdPath: $.key.RtId
                                                  attributeUpdates:
                                                    - attributeName: DocumentState
                                                      attributeValueType: Enum
                                                      value: PAID
                                                    - attributeName: PaidAmount
                                                      attributeValueType: Double
                                                      valuePath: $.key._gross
                                                - type: CreateAssociationUpdate@1
                                                  description: Link the sibling document to the group transaction
                                                  targetPath: $.key._assoc
                                                  updateKind: Create
                                                  originRtIdPath: $.key.RtId
                                                  originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                                  targetRtIdPath: $.full.key._miTxs.Items[0].RtId
                                                  targetCkTypeId: Basic.Accounting/BankTransaction
                                                  associationRoleId: Meshmakers.Accounting/TransactionToDocument
                                            - type: Flatten@1
                                              description: Collect the sibling updates
                                              path: $.key._miApply[*]._upd
                                              targetPath: $.key._miUpdates
                                              targetValueKind: Simple
                                              targetValueWriteMode: Overwrite
                                            - type: Flatten@1
                                              description: Collect the sibling links
                                              path: $.key._miApply[*]._assoc
                                              targetPath: $.key._miAssocs
                                              targetValueKind: Simple
                                              targetValueWriteMode: Overwrite
                                            - type: CreateUpdateInfo@1
                                              description: Transaction is matched (multi-invoice upload sum)
                                              targetPath: $.key._miUpdates
                                              targetValueKind: Array
                                              targetValueWriteMode: Append
                                              updateKind: Update
                                              ckTypeId: Basic.Accounting/BankTransaction
                                              rtIdPath: $.key._miTxs.Items[0].RtId
                                              attributeUpdates:
                                                - attributeName: MatchState
                                                  attributeValueType: Enum
                                                  value: Matched
                                                - attributeName: MatchComment
                                                  attributeValueType: String
                                                  value: Auto-matched by multi-invoice upload sum (one PDF, several invoices)
                                            - type: ApplyChanges@2
                                              entityUpdatesPath: $.key._miUpdates
                                              associationUpdatesPath: $.key._miAssocs
            - type: GetRtEntitiesByType@1
              description: Transactions still unreviewed after the deterministic pass
              ckTypeId: Basic.Accounting/BankTransaction
              targetPath: $.aiTransactions
              take: 25
              fieldFilters:
                - attributePath: MatchState
                  operator: Equals
                  comparisonValue: 0
            - type: If@1
              description: AI fallback for the ambiguous rest
              path: $.aiTransactions.TotalCount
              operator: GreaterThan
              value: 0
              valueType: Int64
              transformations:
                - type: GetRtEntitiesByType@1
                  description: Candidate documents for the AI (all open)
                  ckTypeId: Meshmakers.Accounting/AccountingDocument
                  targetPath: $.openDocs
                  take: 200
                  # AB#4544: newest documents first — with more OPEN documents than
                  # the page size (bulk-upload days) the natural order dropped exactly
                  # the newest documents, which are the likeliest matches for pending
                  # transactions. Undated documents sort last.
                  sortOrders:
                    - sortOrder: Descending
                      attributeName: DocumentDate
                  fieldFilters:
                    - attributePath: DocumentState
                      operator: Equals
                      comparisonValue: 0
                # path MUST point at a concrete value: the node treats path "$"
                # as "no main content" (MCP-only mode) and silently skips the AI
                # call when no MCP server is configured.
                - type: AnthropicAiQuery@1
                  apiKeyConfigurationName: AnthropicAiConfig
                  description: Match remaining transactions against open documents
                  path: $.aiTransactions
                  dataPaths:
                    - $.openDocs
                  responseFormat: json
                  # AB#4544: 4000 was too tight for a full 25-transaction batch —
                  # responses of ~8k characters were cut mid-JSON ("No JSON block
                  # found in response"), which is exactly the degraded case the
                  # guards below catch. 8000 gives the answer room to finish.
                  maxTokens: 8000
                  temperature: 0.0
                  question: >-
                    Match each bank transaction in the main content (aiTransactions, Items array)
                    to the open accounting document(s) from $.openDocs (Items array) that it pays.
                    Every transaction must appear in exactly one of the two result lists.
                  systemPrompt: >-
                    You are a bank reconciliation assistant. The main content holds the bank
                    transactions (Items array); the additional context from $.openDocs holds the
                    open accounting documents (Items array).

                    RULES:
                    1. A Debit transaction (Direction 1, negative Amount) pays INCOMING documents; a Credit transaction (Direction 0) settles OUTGOING documents.
                    2. Single match: abs(transaction Amount) equals the document GrossTotal (allow small deviations only for obvious bank fees) AND the counterpart name or purpose plausibly relates to the document vendor/customer, AND the BookingDate is within 90 days of the DocumentDate.
                    3. Collective match (AB#4510): one transaction may settle SEVERAL documents at once — a typical case is an expense reimbursement transfer to an employee covering many receipts. Put multiple documents into documentRtIds ONLY when the SUM of their GrossTotals equals abs(transaction Amount) (allow small deviations only for obvious bank fees) AND all documents plausibly belong to that one payment (e.g. the purpose hints at a reimbursement or collective transfer, or all documents share the counterpart). Each document must still satisfy the 90-day date rule.
                    4. Only match when you are confident. When several assignments are equally plausible, do NOT match.
                    5. transactionRtId and every entry of documentRtIds MUST be the exact 24-character hex RtId values from the input items — never invent or modify them. documentRtIds MUST be a non-empty array (a single match is an array with one entry).
                    6. Every transaction from aiTransactions.Items must appear either in matches or in unmatched.
                    7. NEVER output duplicates: each transactionRtId appears at most once across the whole result, and each document RtId is used at most once across ALL documentRtIds arrays. A document already paid by one transaction cannot pay another. When in doubt, put the transaction in unmatched.
                  jsonFormatSample: '{"matches": [{"transactionRtId": "69b858129a7ae6defef1ba39", "documentRtIds": ["69b858129a7ae6defef1ba40"], "reason": "Amount 90.00 matches invoice R-2026-014 from Anthropic"}, {"transactionRtId": "69b858129a7ae6defef1ba42", "documentRtIds": ["69b858129a7ae6defef1ba43", "69b858129a7ae6defef1ba44"], "reason": "Reimbursement 145.50 = 100.00 + 45.50, purpose Spesen Mueller"}], "unmatched": ["69b858129a7ae6defef1ba41"]}'
                  targetPath: $.ai
                # AB#4544: a degraded AI response (API error, refusal, malformed or
                # truncated JSON) carries no matches/unmatched arrays — the ForEach
                # nodes below would then FAIL the whole run ('the value in the
                # pipeline is not an array'), nothing of the batch would be committed
                # and the same 25 transactions would loop forever. Guard each loop on
                # its first element (RegexMatch is null-safe; the guarded values are
                # strings, never numbers — cf. the RegexMatch-on-number trap): an
                # empty or missing list simply skips the loop, the batch stays
                # Unreviewed and is retried on the next run — same degraded-mode
                # philosophy as AB#4541.
                - type: If@1
                  description: AI returned a usable matches list (degraded-response guard, AB#4544)
                  path: $.ai.matches[0].transactionRtId
                  operator: RegexMatch
                  value: ".+"
                  valueType: String
                  transformations:
                    - type: ForEach@1
                      description: Apply AI matches
                      iterationPath: $.ai.matches
                      targetPath: $.aiApplied
                      targetValueKind: Simple
                      targetValueWriteMode: Overwrite
                      maxDegreeOfParallelism: 1
                      transformations:
                        # AB#4510: a match carries a documentRtIds LIST — a collective
                        # transfer (e.g. an expense reimbursement) settles several
                        # documents with one transaction. Link and settle each document
                        # in turn, then mark the transaction matched once.
                        - type: ForEach@1
                          description: Link and settle every document of this match
                          iterationPath: $.key.documentRtIds
                          targetPath: $.key._aiDocResults
                          targetValueKind: Simple
                          targetValueWriteMode: Overwrite
                          maxDegreeOfParallelism: 1
                          transformations:
                            - type: GetAssociationTargets@1
                              # Idempotency (AB#4398): the AI can repeat a document across
                              # matches despite the prompt, and a prior pass may already have
                              # linked this document. ApplyChanges runs per iteration, so the
                              # first commit is visible here — create the link only when the
                              # document is not already linked; the PAID update below runs
                              # regardless (idempotent).
                              description: Existing tx links on this document (idempotency guard, AB#4398)
                              originRtIdPath: $.key
                              originCkTypeId: Meshmakers.Accounting/AccountingDocument
                              targetCkTypeId: Basic.Accounting/BankTransaction
                              associationRoleId: Meshmakers.Accounting/TransactionToDocument
                              graphDirection: Outbound
                              targetPath: $._aiExisting
                            - type: If@1
                              description: Create the link only when the document is not already linked
                              path: $._aiExisting[0].TotalCount
                              operator: Equals
                              value: 0
                              valueType: Int64
                              transformations:
                                - type: CreateAssociationUpdate@1
                                  description: Link document to transaction
                                  targetPath: $._aiAssocs
                                  targetValueKind: Array
                                  targetValueWriteMode: Append
                                  updateKind: Create
                                  originRtIdPath: $.key
                                  originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                  targetRtIdPath: $.full.key.transactionRtId
                                  targetCkTypeId: Basic.Accounting/BankTransaction
                                  associationRoleId: Meshmakers.Accounting/TransactionToDocument
                            - type: GetRtEntitiesById@1
                              description: Load the matched document to read its gross total for PaidAmount (AB#4433)
                              rtIdsPath: $.key
                              ckTypeId: Meshmakers.Accounting/AccountingDocument
                              targetPath: $._aiDoc
                            - type: CreateUpdateInfo@1
                              description: Document is paid
                              targetPath: $._aiUpdates
                              targetValueKind: Array
                              targetValueWriteMode: Append
                              updateKind: Update
                              ckTypeId: Meshmakers.Accounting/AccountingDocument
                              rtIdPath: $.key
                              attributeUpdates:
                                - attributeName: DocumentState
                                  attributeValueType: Enum
                                  value: PAID
                                # AB#4433: mirror the deterministic/tolerance passes —
                                # PaidAmount is the document's own gross total (for a
                                # collective transfer each document carries its share).
                                - attributeName: PaidAmount
                                  attributeValueType: Double
                                  valuePath: $._aiDoc.Items[0].Attributes.GrossTotal
                            - type: ApplyChanges@2
                              entityUpdatesPath: $._aiUpdates
                              associationUpdatesPath: $._aiAssocs
                        - type: CreateUpdateInfo@1
                          description: Transaction is matched
                          targetPath: $._aiTxUpdates
                          targetValueKind: Array
                          targetValueWriteMode: Append
                          updateKind: Update
                          ckTypeId: Basic.Accounting/BankTransaction
                          rtIdPath: $.key.transactionRtId
                          attributeUpdates:
                            - attributeName: MatchState
                              attributeValueType: Enum
                              value: Matched
                        - type: ApplyChanges@2
                          entityUpdatesPath: $._aiTxUpdates
                - type: If@1
                  description: AI returned a usable unmatched list (degraded-response guard, AB#4544)
                  path: $.ai.unmatched[0]
                  operator: RegexMatch
                  value: ".+"
                  valueType: String
                  transformations:
                    - type: ForEach@1
                      description: Mark transactions the AI could not assign
                      iterationPath: $.ai.unmatched
                      targetPath: $.aiUnmatched
                      targetValueKind: Simple
                      targetValueWriteMode: Overwrite
                      maxDegreeOfParallelism: 1
                      transformations:
                        - type: CreateUpdateInfo@1
                          description: Transaction could not be assigned
                          targetPath: $._unmatchedUpdates
                          targetValueKind: Array
                          targetValueWriteMode: Append
                          updateKind: Update
                          ckTypeId: Basic.Accounting/BankTransaction
                          rtIdPath: $.key
                          attributeUpdates:
                            - attributeName: MatchState
                              attributeValueType: Enum
                              value: Unmatched
                        - type: ApplyChanges@2
                          entityUpdatesPath: $._unmatchedUpdates
                - type: If@1
                  # AB#4544: If@1 'Equals' with no configured value compares against
                  # null — true only when the path yields nothing. Both lists
                  # empty/missing although transactions were pending means the
                  # response was degraded (prompt rule 6: every transaction must
                  # appear in exactly one of the two lists).
                  description: Degraded AI response — no matches list (AB#4544)
                  path: $.ai.matches[0].transactionRtId
                  operator: Equals
                  valueType: String
                  transformations:
                    - type: If@1
                      description: ...and no unmatched list — batch stays Unreviewed for the next run
                      path: $.ai.unmatched[0]
                      operator: Equals
                      valueType: String
                      transformations:
                        - type: Logger@1
                          message: AI match pass received a degraded AI response (no matches/unmatched arrays) — leaving the batch Unreviewed for the next run (AB#4544)
            # --- Fiscal-year assignment pass (AB#4395) — runs LAST, after all
            #     matching passes, so a PAYMENTDATE-based document can follow a
            #     payment that was linked earlier in this very run. Assigns every
            #     document WITHOUT a DocumentToFiscalYear link to the fiscal year
            #     determined by that year's own PeriodBasis: DOCUMENTDATE (0,
            #     also the default when the attribute is unset) = DocumentDate in
            #     [StartDate, EndDate]; PAYMENTDATE (1) = a linked payment's
            #     BookingDate in range — an unpaid document then deliberately
            #     stays unassigned until it is matched. Fiscal years are iterated
            #     ascending by StartDate with first-match-wins, so for partial
            #     payments across a year boundary the earliest payment's year
            #     wins. A document whose date falls into no fiscal year stays
            #     unassigned (surfaced on the Handover page). Idempotency and
            #     manual override: the association is only ever CREATED when the
            #     document has none — an existing (manual or earlier) assignment
            #     is never touched (association adds are not idempotent, cf.
            #     AB#4433) and is re-checked inside each iteration because
            #     ApplyChanges persists immediately (this also prevents a double
            #     assignment when a DOCUMENTDATE year and a PAYMENTDATE year
            #     both contain the document). Date tests run in-pipeline with
            #     If@1 valueType DateTime — date field filters on dynamic CK
            #     attributes do not coerce (AB#4389). RECURRING master documents
            #     (state 4) are templates, not receipts, and are excluded (the
            #     NotEquals filter also matches documents without a state).
            #     Caps: 50 fiscal years, 1000 documents per run — the 15-minute
            #     polling loop drains any backlog beyond that.
            - type: GetRtEntitiesByType@1
              description: Load fiscal years ascending by start date (first match wins)
              ckTypeId: Meshmakers.Accounting/FiscalYear
              targetPath: $.fyYears
              take: 50
              sortOrders:
                - sortOrder: Ascending
                  attributeName: StartDate
            - type: GetRtEntitiesByType@1
              description: Load documents (recurring masters excluded)
              ckTypeId: Meshmakers.Accounting/AccountingDocument
              targetPath: $.fyDocs
              take: 1000
              fieldFilters:
                - attributePath: DocumentState
                  operator: NotEquals
                  comparisonValue: 4
            - type: ForEach@1
              description: Assign each unassigned document to its fiscal year
              iterationPath: $.fyDocs.Items
              targetPath: $.fyAssignResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                - type: GetAssociationTargets@1
                  description: Existing fiscal-year assignment (manual or auto — never overwritten)
                  originRtIdPath: $.key.RtId
                  originCkTypeId: Meshmakers.Accounting/AccountingDocument
                  targetCkTypeId: Meshmakers.Accounting/FiscalYear
                  associationRoleId: Meshmakers.Accounting/DocumentToFiscalYear
                  graphDirection: Outbound
                  targetPath: $.key._fyExisting
                - type: If@1
                  description: Unassigned — find the fiscal year by period basis
                  path: $.key._fyExisting[0].TotalCount
                  operator: Equals
                  value: 0
                  valueType: Int64
                  transformations:
                    - type: ForEach@1
                      description: Test each fiscal year by its own period basis
                      iterationPath: $.full.fyYears.Items
                      targetPath: $.key._fyLoop
                      targetValueKind: Simple
                      targetValueWriteMode: Overwrite
                      maxDegreeOfParallelism: 1
                      transformations:
                        # Normalize the optional PeriodBasis: seed the DOCUMENTDATE
                        # default, then copy the attribute over it when present —
                        # SelectByPath skips missing paths instead of throwing
                        # (FormatString errors on a missing path, nullValue only
                        # covers present-but-null).
                        - type: SetPrimitiveValue@1
                          description: Default period basis DOCUMENTDATE
                          targetPath: $.key._basis
                          value: 0
                          valueType: Int
                        - type: SelectByPath@1
                          description: Copy the fiscal year's PeriodBasis when present
                          selectPath:
                            - path: $.key.Attributes.PeriodBasis
                              targetPath: $.key._basis
                        - type: If@1
                          description: DOCUMENTDATE basis — the document date decides
                          path: $.key._basis
                          operator: NotEquals
                          value: 1
                          valueType: Int64
                          transformations:
                            - type: If@1
                              description: Document date on/after fiscal-year start
                              path: $.full.key.Attributes.DocumentDate
                              operator: GreaterEqualsThan
                              valuePath: $.key.Attributes.StartDate
                              valueType: DateTime
                              transformations:
                                - type: If@1
                                  description: Document date on/before fiscal-year end
                                  path: $.full.key.Attributes.DocumentDate
                                  operator: LessEqualsThan
                                  valuePath: $.key.Attributes.EndDate
                                  valueType: DateTime
                                  transformations:
                                    - type: GetAssociationTargets@1
                                      description: Re-check — an earlier fiscal-year iteration may have assigned already
                                      originRtIdPath: $.full.key.RtId
                                      originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                      targetCkTypeId: Meshmakers.Accounting/FiscalYear
                                      associationRoleId: Meshmakers.Accounting/DocumentToFiscalYear
                                      graphDirection: Outbound
                                      targetPath: $.key._fyRecheck
                                    - type: If@1
                                      description: Still unassigned — link document to this fiscal year
                                      path: $.key._fyRecheck[0].TotalCount
                                      operator: Equals
                                      value: 0
                                      valueType: Int64
                                      transformations:
                                        - type: CreateAssociationUpdate@1
                                          description: Document -> FiscalYear by document date
                                          targetPath: $.key._fyAssoc
                                          targetValueKind: Array
                                          targetValueWriteMode: Append
                                          updateKind: Create
                                          originRtIdPath: $.full.key.RtId
                                          originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                          targetRtIdPath: $.key.RtId
                                          targetCkTypeId: Meshmakers.Accounting/FiscalYear
                                          associationRoleId: Meshmakers.Accounting/DocumentToFiscalYear
                                        - type: ApplyChanges@2
                                          description: Persist the fiscal-year assignment
                                          associationUpdatesPath: $.key._fyAssoc
                        - type: If@1
                          description: PAYMENTDATE basis — a linked payment decides; unmatched documents stay unassigned
                          path: $.key._basis
                          operator: Equals
                          value: 1
                          valueType: Int64
                          transformations:
                            - type: GetAssociationTargets@1
                              description: Payments linked to the document
                              originRtIdPath: $.full.key.RtId
                              originCkTypeId: Meshmakers.Accounting/AccountingDocument
                              targetCkTypeId: Basic.Accounting/BankTransaction
                              associationRoleId: Meshmakers.Accounting/TransactionToDocument
                              graphDirection: Outbound
                              targetPath: $.key._fyTxs
                            - type: ForEach@1
                              description: Assign when a payment's booking date falls into this fiscal year
                              iterationPath: $.key._fyTxs[0].Items
                              targetPath: $.key._fyTxLoop
                              targetValueKind: Simple
                              targetValueWriteMode: Overwrite
                              maxDegreeOfParallelism: 1
                              transformations:
                                - type: If@1
                                  description: Booking date on/after fiscal-year start
                                  path: $.key.Attributes.BookingDate
                                  operator: GreaterEqualsThan
                                  valuePath: $.full.key.Attributes.StartDate
                                  valueType: DateTime
                                  transformations:
                                    - type: If@1
                                      description: Booking date on/before fiscal-year end
                                      path: $.key.Attributes.BookingDate
                                      operator: LessEqualsThan
                                      valuePath: $.full.key.Attributes.EndDate
                                      valueType: DateTime
                                      transformations:
                                        - type: GetAssociationTargets@1
                                          description: Re-check — an earlier payment or fiscal-year iteration may have assigned already
                                          originRtIdPath: $.full.full.key.RtId
                                          originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                          targetCkTypeId: Meshmakers.Accounting/FiscalYear
                                          associationRoleId: Meshmakers.Accounting/DocumentToFiscalYear
                                          graphDirection: Outbound
                                          targetPath: $.key._fyRecheck
                                        - type: If@1
                                          description: Still unassigned — link document to this fiscal year
                                          path: $.key._fyRecheck[0].TotalCount
                                          operator: Equals
                                          value: 0
                                          valueType: Int64
                                          transformations:
                                            - type: CreateAssociationUpdate@1
                                              description: Document -> FiscalYear by payment date
                                              targetPath: $.key._fyAssoc
                                              targetValueKind: Array
                                              targetValueWriteMode: Append
                                              updateKind: Create
                                              originRtIdPath: $.full.full.key.RtId
                                              originCkTypeId: Meshmakers.Accounting/AccountingDocument
                                              targetRtIdPath: $.full.key.RtId
                                              targetCkTypeId: Meshmakers.Accounting/FiscalYear
                                              associationRoleId: Meshmakers.Accounting/DocumentToFiscalYear
                                            - type: ApplyChanges@2
                                              description: Persist the fiscal-year assignment
                                              associationUpdatesPath: $.key._fyAssoc
            # Security: the HTTP response body is the whole data context. Reduce
            # it to a minimal acknowledgement so it can never echo the caller's
            # request headers/Authorization or internal entity data.
            - type: SetPrimitiveValue@1
              targetPath: $.done
              value: true
              valueType: Boolean
            - type: Project@1
              clear: true
              fields:
                - path: $.done
                  inclusion: true
  # --- Pipelines: transaction maintenance (bulk match-state updates) ---
  - rtId: aa0000000000000000000400
    ckTypeId: System.Communication/DataFlow
    attributes:
      - id: System/Name
        value: Transaction Maintenance
      - id: System/Description
        value: Bulk maintenance of bank transactions — set the match state (e.g. Ignored with a reason) for a booking-date range
  - rtId: aa0000000000000000000401
    ckTypeId: System.Communication/Pipeline
    associations:
      - roleId: System/ParentChild
        targetRtId: aa0000000000000000000400
        targetCkTypeId: System.Communication/DataFlow
      - roleId: System.Communication/Executes
        targetRtId: "670000000000000000000002"
        targetCkTypeId: System.Communication/Adapter
    attributes:
      - id: System.Communication/DeploymentState
        value: 0
      - id: System/Name
        value: Bulk Update Transactions Pipeline
      - id: System/Enabled
        value: true
      - id: System.Communication/PipelineDefinition
        value: >-
          triggers:
            - type: FromHttpRequest@1
              path: /bulkUpdateTransactions
              method: POST
          transformations:
            # FromHttpRequest is synchronous and cannot return a 202, so a large
            # booking-date range used to exceed the nginx 60s gateway timeout (504)
            # while the whole update ran inline. Hand the request body to the worker
            # pipeline fire-and-forget (awaitResult:false) and return immediately;
            # the frontend polls the worker's PipelineExecution (Status/OutputData)
            # for progress and the affected count.
            - type: ToPipelineDataEvent@1
              description: Kick off the async worker (same DataFlow)
              path: $.body
              targetPath: $.input
              targetPipelineRtId: aa0000000000000000000402
              awaitResult: false
            # The HTTP response is the whole DataContext — reduce it to a small ack.
            - type: SetPrimitiveValue@1
              targetPath: $.accepted
              value: true
              valueType: Boolean
            - type: Project@1
              description: Return a minimal accepted acknowledgement
              clear: true
              fields:
                - path: $.accepted
                  inclusion: true
  # Async worker for the bulk transaction update. Triggered fire-and-forget by the
  # Bulk Update Transactions Pipeline (ToPipelineDataEvent → $.input), so the HTTP
  # caller never blocks and the nginx 60s gateway timeout can no longer fire. Its
  # own PipelineExecution carries Status + OutputData (affected count), which the
  # frontend polls via GraphQL. Same DataFlow (aa..0400) as the trigger — required
  # for the shared topic exchange. Post-install: DeployDataFlow for this DataFlow.
  - rtId: aa0000000000000000000402
    ckTypeId: System.Communication/Pipeline
    associations:
      - roleId: System/ParentChild
        targetRtId: aa0000000000000000000400
        targetCkTypeId: System.Communication/DataFlow
      - roleId: System.Communication/Executes
        targetRtId: "670000000000000000000002"
        targetCkTypeId: System.Communication/Adapter
    attributes:
      - id: System.Communication/DeploymentState
        value: 0
      - id: System/Name
        value: Bulk Update Transactions Worker Pipeline
      - id: System/Enabled
        value: true
      - id: System.Communication/PipelineDefinition
        value: >-
          triggers:
            # Fired fire-and-forget by the Bulk Update Transactions Pipeline. The
            # request body arrives at $.input (the sender's targetPath).
            - type: FromPipelineDataEvent@1
          transformations:
            # The Mongo field-filter resolver only coerces comparison values for
            # CLR properties, not for dynamic CK attributes — an ISO date string
            # never matches the stored BSON date. Filter the state in Mongo and
            # compare the booking date typed (DateTime) inside the loop instead.
            - type: GetRtEntitiesByType@1
              description: Transactions with one of the source states
              ckTypeId: Basic.Accounting/BankTransaction
              targetPath: $.txs
              take: 10000
              fieldFilters:
                - attributePath: MatchState
                  operator: In
                  comparisonValuePath: $.input.statesToChange
            - type: ForEach@1
              description: Build one state update per transaction in the date range
              iterationPath: $.txs.Items
              targetPath: $.result
              documentMode: Extend
              mergePath: $._updates
              maxDegreeOfParallelism: 1
              transformations:
                - type: If@1
                  description: BookingDate on or after the range start
                  path: $.key.Attributes.BookingDate
                  operator: GreaterEqualsThan
                  valuePath: $.full.input.from
                  valueType: DateTime
                  transformations:
                    - type: If@1
                      description: BookingDate on or before the range end
                      path: $.key.Attributes.BookingDate
                      operator: LessEqualsThan
                      valuePath: $.full.input.to
                      valueType: DateTime
                      transformations:
                        - type: CreateUpdateInfo@1
                          targetPath: $._updates._u
                          updateKind: Update
                          ckTypeId: Basic.Accounting/BankTransaction
                          rtIdPath: $.key.RtId
                          attributeUpdates:
                            - attributeName: MatchState
                              attributeValueType: Enum
                              valuePath: $.full.input.targetState
                            - attributeName: MatchComment
                              attributeValueType: String
                              valuePath: $.full.input.comment
            - type: Flatten@1
              path: $.result[*]._u
              targetPath: $._updateItems
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
            - type: ApplyChanges@2
              description: Persist the bulk state change
              entityUpdatesPath: $._updateItems
            # Reduce the context to the affected count and persist it as
            # PipelineExecution.OutputData so the frontend can read it on completion.
            - type: Project@1
              description: Keep only the affected count
              clear: true
              fields:
                - path: $.txs.TotalCount
                  inclusion: true
            - type: SetPipelineExecutionResult@1
              description: Persist {txs:{TotalCount}} as OutputData
              path: $
  # --- Pipeline: BMD handover export (AB#4392) ---
  # On-demand outbound export triggered via POST /exportHandover?fiscalYearId&scope
  # [&from&to for a month/quarter]. Renders a cover sheet per document (parsed data
  # + tax-advisor note + one row per linked payment), merges it with the original
  # PDF, and returns a ZIP as a FileSystemItem. Post-install: DeployDataFlow for
  # this DataFlow. Requires documents assigned to the fiscal year.
  - rtId: aa0000000000000000000600
    ckTypeId: System.Communication/DataFlow
    attributes:
      - id: System/Name
        value: BMD Handover Export
      - id: System/Description
        value: Exports a tax-advisor handover package (cover sheet + merged original + ZIP) per fiscal year, month or quarter
  - rtId: aa0000000000000000000601
    ckTypeId: System.Communication/Pipeline
    associations:
      - roleId: System/ParentChild
        targetRtId: aa0000000000000000000600
        targetCkTypeId: System.Communication/DataFlow
      - roleId: System.Communication/Executes
        targetRtId: "670000000000000000000002"
        targetCkTypeId: System.Communication/Adapter
    attributes:
      - id: System.Communication/DeploymentState
        value: 0
      - id: System/Name
        value: BMD Handover Export Pipeline
      - id: System/Enabled
        value: true
      - id: System.Communication/PipelineDefinition
        value: |
          # =============================================================================
          # BMD handover export pipeline (AB#4392) — pipeline DEFINITION only
          # (triggers + transformations). This is the `PipelineDefinition` body; it is
          # deployed to the managed Mesh Adapter (670000000000000000000002).
          #
          # Trigger:  POST /exportHandover?fiscalYearId=<rtId>&scope=AP|AR|all
          #   scope AP  = INCOMING documents (supplier invoices, Eingangsrechnungen)
          #   scope AR  = OUTGOING documents (Ausgangsrechnungen)
          #   scope all = both
          # Returns (HTTP JSON body = final data context): { "fileSystemItem": "<rtId>" }
          #   The frontend resolves the download URL via the existing GetFileSystemItem
          #   query on that rtId and bearer-fetches the ZIP blob (see inbox-detail.ts).
          #
          # New nodes used (octo-mesh-adapter): RenderDataSheetPdf@1, MergePdf@1,
          #   CreateZipArchive@1.
          #
          # ---------------------------------------------------------------------------
          # LIVE-VALIDATED end-to-end on salzburgdev (2026-07-16): 5 docs linked to
          # FiscalYear 2026 -> HTTP 200, flat {"fileSystemItem":"<rtId>"}, ZIP with cover
          # sheet prepended (page counts 1 for no-original / 2..6 for merged), unique
          # AP/-grouped names, stored FileSystemItem downloadable. Confirmed:
          #  [1] FiscalYear -> Documents via DocumentToFiscalYear is graphDirection
          #      Inbound (documents link OUT to the fiscal year). Original PDF
          #      (System/Related) and transactions (TransactionToDocument) are OUTBOUND.
          #  [2] DocumentType is the INT enum key (0=INCOMING/AP, 1=OUTGOING/AR) — the
          #      prefix/scope Ifs compare as Int.
          #  [4] Documents without a stored original get a cover-sheet-only entry.
          #  Content length: the ZIP node emits its byte length (contentLengthTargetPath)
          #      for CreateFileSystemUpdate; empty DocumentNumber falls back to RtId so
          #      ZIP entry names stay unique.
          #  [OPT] DONE: optional/nested cover fields (Vendor/Customer, Net/Tax/Rate,
          #      DueDate, payment proof, TaxAdvisorNote) are populated via SelectByPath@1,
          #      which skips missing/null/nested-under-null sources (leaving the "" default)
          #      instead of throwing. Verified live: Brutto + payment proof render, empty
          #      fields stay blank.
          #  [3] DONE: values are copied as JSON nodes (not string-interpolated), so they
          #      are auto-escaped — a note/name with a quote or newline can't break the JSON.
          #  [DATE] DONE: date/time values are trimmed to yyyy-MM-dd via TransformString.
          #  [PERIOD] DONE (AB#4535): optional query from/to (ISO) narrow the export to a
          #      month or quarter — a DocumentDate range gate flips $.key.include back to
          #      "no" outside [from, to]; omitting the params exports the whole fiscal
          #      year (bounds default to an all-inclusive range because the params are
          #      absent then, and a missing path would make FormatString throw — seeded
          #      via SetPrimitiveValue + SelectByPath, same pattern as the AB#4395
          #      PeriodBasis read). The frontend Handover page computes from/to from the
          #      period picker. NOTE: out-of-period documents are still rendered (like
          #      scope-excluded ones) — they are only dropped from the ZIP; rendering is
          #      cheap (~40ms/doc), a skip-early refactor was deliberately not done.
          #  [5] DONE: the Zahlungsnachweis section lists ONE row per linked transaction
          #      (inner ForEach over $.key.txGroups[0].Items -> Flatten -> inject). Verified
          #      live with a document linked to two transactions.
          #  [DATA] Assigning documents to a FiscalYear (DocumentToFiscalYear) is a
          #      precondition; on salzburgdev this was done manually for the test.
          # =============================================================================

          triggers:
            - type: FromHttpRequest@1
              path: /exportHandover
              method: POST

          transformations:
            # -- 1) Load the fiscal year's documents via DocumentToFiscalYear -----------
            - type: GetAssociationTargets@1
              description: Documents assigned to the requested fiscal year
              originRtIdPath: $.query.fiscalYearId
              originCkTypeId: Meshmakers.Accounting/FiscalYear
              targetCkTypeId: Meshmakers.Accounting/AccountingDocument
              associationRoleId: Meshmakers.Accounting/DocumentToFiscalYear
              graphDirection: Inbound          # [1] validate
              targetPath: $.docGroups

            # -- 2) Per document: resolve original, render cover, merge, collect entry --
            - type: ForEach@1
              description: Build one merged PDF per document
              iterationPath: $.docGroups[0].Items
              targetPath: $.docResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              transformations:
                # scope guard: AP => INCOMING, AR => OUTGOING, all => process everything.
                # Implemented as "process when scope=all OR DocumentType matches scope".
                # We normalise scope -> expected DocumentType into $.key.wantType, then
                # only emit an entry when it matches (or scope=all).
                - type: FormatString@1
                  description: Echo requested scope into the item context
                  format: "{$.full.query.scope}"
                  nullValue: all
                  targetPath: $.key.scope

                # AP/AR label + folder prefix derived from DocumentType. Verified on
                # salzburgdev: DocumentType comes back as the INT enum key (0=INCOMING,
                # 1=OUTGOING), not the name — compare as Int. Default first so the path
                # always exists (the scope-match If references it via valuePath).
                - type: SetPrimitiveValue@1
                  description: Default prefix
                  targetPath: $.key.prefix
                  value: ""
                  valueType: String
                - type: If@1
                  description: Incoming => AP
                  path: $.key.Attributes.DocumentType
                  operator: Equal
                  value: 0
                  valueType: Int
                  transformations:
                    - type: SetPrimitiveValue@1
                      targetPath: $.key.prefix
                      value: AP
                      valueType: String
                - type: If@1
                  description: Outgoing => AR
                  path: $.key.Attributes.DocumentType
                  operator: Equal
                  value: 1
                  valueType: Int
                  transformations:
                    - type: SetPrimitiveValue@1
                      targetPath: $.key.prefix
                      value: AR
                      valueType: String

                # scope gate: include this document when scope=all OR scope matches the
                # document's AP/AR prefix. Default excluded; two Ifs flip it to "yes".
                - type: SetPrimitiveValue@1
                  description: Default exclude
                  targetPath: $.key.include
                  value: "no"
                  valueType: String
                - type: If@1
                  description: scope=all includes everything
                  path: $.key.scope
                  operator: Equal
                  value: all
                  valueType: String
                  transformations:
                    - type: SetPrimitiveValue@1
                      targetPath: $.key.include
                      value: "yes"
                      valueType: String
                - type: If@1
                  description: scope matches AP/AR prefix
                  path: $.key.scope
                  operator: Equal
                  valuePath: $.key.prefix
                  valueType: String
                  transformations:
                    - type: SetPrimitiveValue@1
                      targetPath: $.key.include
                      value: "yes"
                      valueType: String

                # period gate (AB#4535): optional query from/to narrow the export
                # to a month or quarter — a document dated outside [from, to] is
                # flipped back to include=no. The params are ABSENT for a
                # full-year export and a missing path makes FormatString throw,
                # so all-inclusive bounds are seeded first and SelectByPath only
                # copies the params when present (AB#4395 pattern). Date tests
                # run as If@1 valueType DateTime — date field filters on dynamic
                # CK attributes do not coerce (AB#4389).
                - type: SetPrimitiveValue@1
                  description: Default period lower bound (open)
                  targetPath: $.key.periodFrom
                  value: "0001-01-01T00:00:00Z"
                  valueType: String
                - type: SetPrimitiveValue@1
                  description: Default period upper bound (open)
                  targetPath: $.key.periodTo
                  value: "9999-12-31T23:59:59Z"
                  valueType: String
                - type: SelectByPath@1
                  description: Copy the optional from/to query params when present
                  selectPath:
                    - path: $.full.query.from
                      targetPath: $.key.periodFrom
                    - path: $.full.query.to
                      targetPath: $.key.periodTo
                - type: If@1
                  description: Document date before the period start — exclude
                  path: $.key.Attributes.DocumentDate
                  operator: LessThan
                  valuePath: $.key.periodFrom
                  valueType: DateTime
                  transformations:
                    - type: SetPrimitiveValue@1
                      targetPath: $.key.include
                      value: "no"
                      valueType: String
                - type: If@1
                  description: Document date after the period end — exclude
                  path: $.key.Attributes.DocumentDate
                  operator: GreaterThan
                  valuePath: $.key.periodTo
                  valueType: DateTime
                  transformations:
                    - type: SetPrimitiveValue@1
                      targetPath: $.key.include
                      value: "no"
                      valueType: String

                # 2a) original stored PDF via System/Related
                - type: GetAssociationTargets@1
                  description: Original stored PDF (FileSystemItem)
                  originRtIdPath: $.key.RtId
                  originCkTypeId: Meshmakers.Accounting/AccountingDocument
                  targetCkTypeId: System.Reporting/FileSystemItem
                  associationRoleId: System/Related
                  graphDirection: Outbound        # [1] validate
                  targetPath: $.key.fileGroups

                # 2b) first linked bank transaction (payment proof) via TransactionToDocument
                - type: GetAssociationTargets@1
                  description: Linked bank transactions (payment proof)
                  originRtIdPath: $.key.RtId
                  originCkTypeId: Meshmakers.Accounting/AccountingDocument
                  targetCkTypeId: Basic.Accounting/BankTransaction
                  associationRoleId: Meshmakers.Accounting/TransactionToDocument
                  graphDirection: Outbound        # [1] validate
                  targetPath: $.key.txGroups

                # 2c) assemble the cover-sheet model — escaping-safe and null-safe.
                #     We seed a full skeleton (labels set, values ""), then SelectByPath@1
                #     copies each source attribute into its row VALUE by JSON node (not by
                #     string interpolation) — so values are auto-escaped ([3] fixed) and
                #     missing / null / nested-under-null sources are simply skipped, leaving
                #     the "" default ([OPT] fixed). Payment proof uses the first linked
                #     transaction only ([5] multi-payment is a follow-up).
                - type: WriteJson@1
                  description: Cover-sheet skeleton (labels + empty values)
                  jsonString: '{"title":"Belegübergabe an den Steuerberater","subtitle":"","sections":[{"heading":"Beleg","rows":[{"label":"Belegnummer","value":""},{"label":"Belegdatum","value":""},{"label":"Fälligkeit","value":""},{"label":"Belegart","value":""},{"label":"Brutto","value":""}]},{"heading":"Kontakt","rows":[{"label":"Lieferant","value":""},{"label":"UID","value":""},{"label":"IBAN","value":""},{"label":"Kunde","value":""}]},{"heading":"Beträge","rows":[{"label":"Netto","value":""},{"label":"USt","value":""},{"label":"Steuersatz %","value":""}]},{"heading":"Zahlungsnachweis","rows":[]}],"footerHeading":"Notiz an den Steuerberater","footerText":""}'
                  targetPath: $.key.sheet
                - type: SelectByPath@1
                  description: Copy present document values into the skeleton (skips missing/null)
                  selectPath:
                    - path: $.key.Attributes.DocumentNumber
                      targetPath: $.key.sheet.subtitle
                    - path: $.key.Attributes.DocumentNumber
                      targetPath: $.key.sheet.sections[0].rows[0].value
                    - path: $.key.Attributes.DocumentDate
                      targetPath: $.key.sheet.sections[0].rows[1].value
                    - path: $.key.Attributes.DueDate
                      targetPath: $.key.sheet.sections[0].rows[2].value
                    - path: $.key.prefix
                      targetPath: $.key.sheet.sections[0].rows[3].value
                    - path: $.key.Attributes.GrossTotal
                      targetPath: $.key.sheet.sections[0].rows[4].value
                    - path: $.key.Attributes.Vendor.CompanyName
                      targetPath: $.key.sheet.sections[1].rows[0].value
                    - path: $.key.Attributes.Vendor.TaxIdentificationNumber
                      targetPath: $.key.sheet.sections[1].rows[1].value
                    - path: $.key.Attributes.Vendor.IBAN
                      targetPath: $.key.sheet.sections[1].rows[2].value
                    - path: $.key.Attributes.Customer.CompanyName
                      targetPath: $.key.sheet.sections[1].rows[3].value
                    - path: $.key.Attributes.NetTotal
                      targetPath: $.key.sheet.sections[2].rows[0].value
                    - path: $.key.Attributes.TaxTotal
                      targetPath: $.key.sheet.sections[2].rows[1].value
                    - path: $.key.Attributes.TaxRate
                      targetPath: $.key.sheet.sections[2].rows[2].value
                    - path: $.key.txGroups[0].Items[0].Attributes.BookingDate
                      targetPath: $.key.sheet.sections[3].rows[0].value
                    - path: $.key.txGroups[0].Items[0].Attributes.Amount
                      targetPath: $.key.sheet.sections[3].rows[1].value
                    - path: $.key.txGroups[0].Items[0].Attributes.CounterpartIban
                      targetPath: $.key.sheet.sections[3].rows[2].value
                    - path: $.key.Attributes.TaxAdvisorNote
                      targetPath: $.key.sheet.footerText
                # Trim ISO date/time values to the date only (yyyy-MM-dd). SubstringFromStart
                # is null-safe and clamps to the string length, so blank values stay blank.
                - type: TransformString@1
                  description: Trim document date
                  sourcePath: $.key.sheet.sections[0].rows[1].value
                  targetPath: $.key.sheet.sections[0].rows[1].value
                  operation: SubstringFromStart
                  length: 10
                - type: TransformString@1
                  description: Trim due date
                  sourcePath: $.key.sheet.sections[0].rows[2].value
                  targetPath: $.key.sheet.sections[0].rows[2].value
                  operation: SubstringFromStart
                  length: 10

                # Payment proof: one row per linked transaction ([5]). The inner ForEach
                # iterates the linked transactions (inside it $.key = the transaction),
                # builds a {label,value} row per payment, and collects each whole iteration
                # into $.key.payItems; Flatten then lifts just the .row of each into
                # $.key.payRows, which replaces the (empty) Zahlungsnachweis rows. Zero
                # transactions -> payRows empty -> the section shows just its heading.
                - type: ForEach@1
                  description: Build one payment row per linked transaction
                  iterationPath: $.key.txGroups[0].Items
                  targetPath: $.key.payItems
                  targetValueKind: Simple
                  targetValueWriteMode: Overwrite
                  maxDegreeOfParallelism: 1
                  transformations:
                    - type: WriteJson@1
                      jsonString: '{"d":"","a":"","i":""}'
                      targetPath: $.key.f
                    - type: WriteJson@1
                      jsonString: '{"label":"","value":""}'
                      targetPath: $.key.row
                    - type: SelectByPath@1
                      selectPath:
                        - path: $.key.Attributes.BookingDate
                          targetPath: $.key.f.d
                        - path: $.key.Attributes.Amount
                          targetPath: $.key.f.a
                        - path: $.key.Attributes.CounterpartIban
                          targetPath: $.key.f.i
                    - type: TransformString@1
                      description: Trim booking date
                      sourcePath: $.key.f.d
                      targetPath: $.key.f.d
                      operation: SubstringFromStart
                      length: 10
                    # amounts / IBANs contain no JSON-special chars, so FormatString here is
                    # safe; f.* are always present (defaulted) so no undefined lookups.
                    - type: FormatString@1
                      format: "Zahlung {$.key.f.d}"
                      targetPath: $.key.row.label
                    - type: FormatString@1
                      format: "{$.key.f.a} · {$.key.f.i}"
                      targetPath: $.key.row.value
                - type: Flatten@1
                  description: Lift each payment row out of the collected iterations
                  path: $.key.payItems[*].row
                  targetPath: $.key.payRows
                - type: SelectByPath@1
                  description: Inject payment rows into the cover sheet
                  selectPath:
                    - path: $.key.payRows
                      targetPath: $.key.sheet.sections[3].rows

                - type: RenderDataSheetPdf@1
                  description: Render the cover sheet PDF
                  path: $.key.sheet
                  targetPath: $.key.coverPdf

                # 2d) merge cover + original (when an original exists), else cover only.
                - type: If@1
                  description: Has an original PDF
                  path: $.key.fileGroups[0].TotalCount
                  operator: GreaterThan
                  value: 0
                  valueType: Int
                  transformations:
                    - type: GetFileSystemContent@1
                      description: Load original PDF bytes
                      rtIdPath: $.key.fileGroups[0].Items[0].RtId   # [4] validate
                      targetPath: $.key.originalPdf
                    - type: FormatString@1
                      description: Merge inputs [cover, original]
                      format: '["{$.key.coverPdf}","{$.key.originalPdf}"]'
                      targetPath: $.key.mergeJson
                    - type: WriteJson@1
                      jsonStringPath: $.key.mergeJson
                      targetPath: $.key.mergeInputs
                    - type: MergePdf@1
                      description: Prepend cover sheet to the original
                      path: $.key.mergeInputs
                      targetPath: $.key.finalPdf
                - type: If@1
                  description: No original PDF -> cover sheet only
                  path: $.key.fileGroups[0].TotalCount
                  operator: Equal
                  value: 0
                  valueType: Int
                  transformations:
                    - type: FormatString@1
                      description: Use the cover sheet as the final PDF
                      format: "{$.key.coverPdf}"
                      targetPath: $.key.finalPdf

                # 2e) zip entry { fileName, contentBase64 } — only for in-scope documents.
                #     Documents excluded by scope never get $.key.entry, so the Flatten
                #     over $.docResults[*].entry drops them from the ZIP.
                - type: If@1
                  description: Emit entry only when in scope
                  path: $.key.include
                  operator: Equal
                  value: "yes"
                  valueType: String
                  transformations:
                    # File-name base = DocumentNumber, falling back to the RtId when the
                    # number is empty so entries stay unique (a ZIP can't have two AP/.pdf).
                    - type: SetPrimitiveValue@1
                      description: File-name base from document number
                      targetPath: $.key.fnbase
                      valuePath: $.key.Attributes.DocumentNumber
                      valueType: String
                    - type: If@1
                      description: Empty number -> use RtId
                      path: $.key.fnbase
                      operator: Equal
                      value: ""
                      valueType: String
                      transformations:
                        - type: SetPrimitiveValue@1
                          targetPath: $.key.fnbase
                          valuePath: $.key.RtId
                          valueType: String
                    - type: FormatString@1
                      description: Archive entry file name (grouped AP/AR)
                      nullValue: doc
                      format: '{$.key.prefix}/{$.key.fnbase}.pdf'
                      targetPath: $.key.entryName
                    - type: FormatString@1
                      description: Build zip-entry JSON
                      format: '{"fileName":"{$.key.entryName}","contentBase64":"{$.key.finalPdf}"}'
                      targetPath: $.key.entryJson
                    - type: WriteJson@1
                      jsonStringPath: $.key.entryJson
                      targetPath: $.key.entry

            # -- 3) Collect entries, build ZIP, store as FileSystemItem -----------------
            - type: Flatten@1
              description: Collect per-document zip entries into one array
              path: $.docResults[*].entry
              targetPath: $.zipEntries
            - type: CreateZipArchive@1
              description: Bundle all merged PDFs into the handover ZIP
              path: $.zipEntries
              targetPath: $.zip.data
              contentLengthTargetPath: $.zip.length
            # base64 length -> byte length is needed by CreateFileSystemUpdate; the node
            # accepts a ContentLengthPath, but a static contentType/fileName is simplest.
            - type: FormatString@1
              description: ZIP file name
              nullValue: handover
              format: 'handover-{$.query.fiscalYearId}.zip'
              targetPath: $.zip.fileName
            - type: CreateFileSystemUpdate@1
              description: Persist the ZIP as a FileSystemItem under the Documents root
              path: $.zip.data
              generateRtId: true
              fileNamePath: $.zip.fileName
              contentType: application/zip
              contentLengthPath: $.zip.length
              rootFolderWellKnownName: Documents
              targetPath: $.zip.item

            # -- 4) Return { fileSystemItem: <rtId> } -----------------------------------
            # The HTTP response body is the final data context. Put the id at the root so
            # the body is a flat { "fileSystemItem": "<rtId>" } (the frontend reads
            # response.fileSystemItem directly).
            - type: SetPrimitiveValue@1
              description: Response id at root
              targetPath: $.fileSystemItem
              valuePath: $.zip.item.RtId
              valueType: String
            - type: SetPipelineExecutionResult@1
              path: $.fileSystemItem
            # Project the context down to just the id so the HTTP body is clean.
            - type: Project@1
              clear: true
              fields:
                - path: $.fileSystemItem
                  inclusion: true
  # --- Microsoft 365 e-mail document import (AB#3328) -------------------------
  # Moved from data/ into the seed so a fresh tenant gets it present-but-DISABLED.
  # The pipeline ships with System/Enabled=false; Settings -> E-Mail Import in the
  # meshmakers-app writes the EmailImportSettings configuration, rewrites the
  # trigger folders/mailbox into PipelineDefinition, sets Enabled and deploys the
  # DataFlow. Graph credentials (MicrosoftGraphDocuments) carry placeholders here
  # and are filled per tenant via scripts/om_set_secrets.ps1 (microsoftGraph).
  # Default trigger folders are the PROD names (ToDo/Done); local dev overrides
  # them to Todo_local-test/Done_local-test via the Settings configuration.
  - rtId: 67d4a2f0b2e4d8c3a1f000a0
    ckTypeId: System.Communication/MicrosoftGraphConfiguration
    rtWellKnownName: MicrosoftGraphDocuments
    attributes:
      - id: System.Communication/AzureTenantId
        value: TODO_SET_AZURE_TENANT_ID
      - id: System.Communication/ClientId
        value: TODO_SET_CLIENT_ID
      - id: System.Communication/ClientSecret
        value: TODO_SET_CLIENT_SECRET
  - rtId: 67d4a2f0b2e4d8c3a1f00110
    ckTypeId: System.Communication/DataFlow
    attributes:
      - id: System/Name
        value: Graph Email Document Import
      - id: System/Description
        value: Polls an Office 365 mail folder via Microsoft Graph, stages PDF attachments (or, when none, the rendered mail body) as UploadedDocuments (inbox) and moves processed mails to the Done folder
  - rtId: 67d4a2f0b2e4d8c3a1f00111
    ckTypeId: System.Communication/Pipeline
    associations:
      - roleId: System/ParentChild
        targetRtId: 67d4a2f0b2e4d8c3a1f00110
        targetCkTypeId: System.Communication/DataFlow
      - roleId: System.Communication/Executes
        targetRtId: "670000000000000000000002"
        targetCkTypeId: System.Communication/Adapter
      # Graph credentials - the GlobalConfiguration is built from Uses associations.
      - roleId: System.Communication/Uses
        targetRtId: 67d4a2f0b2e4d8c3a1f000a0
        targetCkTypeId: System.Communication/MicrosoftGraphConfiguration
    attributes:
      - id: System.Communication/DeploymentState
        value: 0
      - id: System/Name
        value: Graph Email Document Import Pipeline
      - id: System/Enabled
        value: false
      - id: System.Communication/PipelineDefinition
        value: >-
          triggers:
            - type: FromMicrosoftGraphEmail@1
              serverConfiguration: MicrosoftGraphDocuments
              pollingIntervalSeconds: 120
              mailbox: gerald.lochner@meshmakers.io
              folderPath: Archive/Rechnungen_Verträge/ToDo
              moveToFolderPathOnSuccess: Archive/Rechnungen_Verträge/Done
          transformations:
            - type: ForEach@1
              description: Process each mail in the batch (the trigger sends one mail per run)
              iterationPath: $.Emails
              targetPath: $.emailResults
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              transformations:
                - type: ForEach@1
                  description: Stage each PDF attachment for asynchronous analysis
                  iterationPath: $.key.Attachments
                  targetPath: $.attachmentResults
                  targetValueKind: Simple
                  targetValueWriteMode: Overwrite
                  maxDegreeOfParallelism: 1
                  transformations:
                    - type: If@1
                      description: Only process PDF attachments
                      path: $.key.ContentType
                      operator: Equals
                      value: "application/pdf"
                      valueType: String
                      transformations:
                        - type: If@1
                          description: Skip files above the 10 MB analysis limit
                          path: $.key.Length
                          operator: LessEqualsThan
                          value: 10000000
                          valueType: Int64
                          transformations:
                            - type: ComputeFileHash@1
                              description: Compute SHA-256 hash of the attachment
                              path: $.key.Data
                              targetPath: $.fileHash
                            - type: CheckDuplicate@1
                              description: Check if this document was already staged
                              ckTypeId: Meshmakers.Accounting/UploadedDocument
                              attributeName: FileHash
                              valuePath: $.fileHash
                              targetPath: $.isDuplicate
                              existingEntityPath: $.existingUpload
                            - type: If@1
                              description: New document - store the file and stage it
                              path: $.isDuplicate
                              operator: NotEquals
                              value: true
                              valueType: Boolean
                              transformations:
                                - type: DateTime@1
                                  description: Upload timestamp
                                  operation: Now
                                  targetPath: $.uploadedAt
                                - type: CreateFileSystemUpdate@1
                                  description: Store PDF in file system
                                  targetPath: $.fileSystemItem
                                  path: $.key.Data
                                  generateRtId: true
                                  fileNamePath: $.key.FileName
                                  contentType: application/pdf
                                  contentLengthPath: $.key.Length
                                  rootFolderWellKnownName: "Documents"
                                - type: CreateUpdateInfo@1
                                  description: Stage the mail attachment for the analysis pipeline
                                  targetPath: $.updates._items
                                  targetValueKind: Array
                                  targetValueWriteMode: Overwrite
                                  updateKind: Insert
                                  ckTypeId: Meshmakers.Accounting/UploadedDocument
                                  rtIdPath: $.uploadRtId
                                  generateRtId: true
                                  attributeUpdates:
                                    - attributeName: OriginalFileName
                                      attributeValueType: String
                                      valuePath: $.key.FileName
                                    - attributeName: FileRtId
                                      attributeValueType: String
                                      valuePath: $.fileSystemItem.RtId
                                    - attributeName: FileHash
                                      attributeValueType: String
                                      valuePath: $.fileHash
                                    - attributeName: UploadedAt
                                      attributeValueType: DateTime
                                      valuePath: $.uploadedAt
                                    - attributeName: ProcessingState
                                      attributeValueType: Enum
                                      value: NEW
                                    - attributeName: SourceChannel
                                      attributeValueType: Enum
                                      value: EMAIL
                                    - attributeName: SourceSender
                                      attributeValueType: String
                                      valuePath: $.full.key.FromAddress
                                    - attributeName: SourceSubject
                                      attributeValueType: String
                                      valuePath: $.full.key.Subject
                                    - attributeName: SourceReceivedAt
                                      attributeValueType: DateTime
                                      valuePath: $.full.key.Date
                                    - attributeName: SourceBody
                                      attributeValueType: String
                                      valuePath: $.full.key.Body
                                - type: CreateAssociationUpdate@1
                                  description: Link the staged upload to the stored file
                                  targetPath: $.updates._assocItems
                                  targetValueKind: Array
                                  targetValueWriteMode: Overwrite
                                  updateKind: Create
                                  originRtIdPath: $.updates._items[0].RtEntity.RtId
                                  originCkTypeIdPath: $.updates._items[0].RtEntity.CkTypeId
                                  targetRtIdPath: $.fileSystemItem.RtId
                                  targetCkTypeIdPath: $.fileSystemItem.CkTypeId
                                  associationRoleId: System/Related
                                - type: ApplyChanges@2
                                  description: Persist the staged upload and file link
                                  entityUpdatesPath: $.updates._items
                                  associationUpdatesPath: $.updates._assocItems
                # --- Mail without a PDF attachment: keep the mail itself as the receipt ---
                # A forwarded mail that carries no PDF (only inline logos, or nothing at
                # all) is rendered to a PDF from its body — HTML or plain text — and staged
                # exactly like an uploaded document, so the mail itself becomes the receipt.
                - type: If@1
                  description: Only when the mail has no PDF attachment
                  path: $.key.HasPdfAttachment
                  operator: Equals
                  value: false
                  valueType: Boolean
                  transformations:
                    - type: Hash@1
                      description: Hash the mail body (UTF-8) so the same mail is not saved twice
                      sourcePath: $.key.Body
                      algorithm: Sha256
                      inputFormat: String
                      targetPath: $.bodyHash
                    - type: CheckDuplicate@1
                      description: Skip if this mail body was already stored as a receipt
                      ckTypeId: Meshmakers.Accounting/UploadedDocument
                      attributeName: FileHash
                      valuePath: $.bodyHash
                      targetPath: $.isBodyDuplicate
                      existingEntityPath: $.existingBodyUpload
                    - type: If@1
                      description: New mail - render the body to PDF and stage it
                      path: $.isBodyDuplicate
                      operator: NotEquals
                      value: true
                      valueType: Boolean
                      transformations:
                        - type: FormatString@1
                          description: Receipt file name derived from the mail subject
                          format: "{$.key.Subject}.pdf"
                          nullValue: "E-Mail-Beleg.pdf"
                          targetPath: $.renderedFileName
                        - type: RenderHtmlPdf@1
                          description: Render the mail body (HTML or plain text) as the receipt PDF
                          path: $.key.Body
                          titlePath: $.key.Subject
                          targetPath: $.renderedPdf
                          contentLengthTargetPath: $.renderedPdfLen
                        - type: DateTime@1
                          description: Upload timestamp
                          operation: Now
                          targetPath: $.uploadedAt
                        - type: CreateFileSystemUpdate@1
                          description: Store the rendered receipt PDF in the file system
                          targetPath: $.fileSystemItem
                          path: $.renderedPdf
                          generateRtId: true
                          fileNamePath: $.renderedFileName
                          contentType: application/pdf
                          contentLengthPath: $.renderedPdfLen
                          rootFolderWellKnownName: "Documents"
                        - type: CreateUpdateInfo@1
                          description: Stage the rendered mail receipt for the analysis pipeline
                          targetPath: $.updates._items
                          targetValueKind: Array
                          targetValueWriteMode: Overwrite
                          updateKind: Insert
                          ckTypeId: Meshmakers.Accounting/UploadedDocument
                          rtIdPath: $.uploadRtId
                          generateRtId: true
                          attributeUpdates:
                            - attributeName: OriginalFileName
                              attributeValueType: String
                              valuePath: $.renderedFileName
                            - attributeName: FileRtId
                              attributeValueType: String
                              valuePath: $.fileSystemItem.RtId
                            - attributeName: FileHash
                              attributeValueType: String
                              valuePath: $.bodyHash
                            - attributeName: UploadedAt
                              attributeValueType: DateTime
                              valuePath: $.uploadedAt
                            - attributeName: ProcessingState
                              attributeValueType: Enum
                              value: NEW
                            - attributeName: SourceChannel
                              attributeValueType: Enum
                              value: EMAIL
                            - attributeName: SourceSender
                              attributeValueType: String
                              valuePath: $.key.FromAddress
                            - attributeName: SourceSubject
                              attributeValueType: String
                              valuePath: $.key.Subject
                            - attributeName: SourceReceivedAt
                              attributeValueType: DateTime
                              valuePath: $.key.Date
                            - attributeName: SourceBody
                              attributeValueType: String
                              valuePath: $.key.Body
                        - type: CreateAssociationUpdate@1
                          description: Link the staged receipt to the stored file
                          targetPath: $.updates._assocItems
                          targetValueKind: Array
                          targetValueWriteMode: Overwrite
                          updateKind: Create
                          originRtIdPath: $.updates._items[0].RtEntity.RtId
                          originCkTypeIdPath: $.updates._items[0].RtEntity.CkTypeId
                          targetRtIdPath: $.fileSystemItem.RtId
                          targetCkTypeIdPath: $.fileSystemItem.CkTypeId
                          associationRoleId: System/Related
                        - type: ApplyChanges@2
                          description: Persist the staged receipt and file link
                          entityUpdatesPath: $.updates._items
                          associationUpdatesPath: $.updates._assocItems

