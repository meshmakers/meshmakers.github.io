        value: Import Bank Connection Pipeline
      - id: System/Enabled
        value: true
      - id: System.Communication/PipelineDefinition
        value: >-
          triggers:
            - type: FromHttpRequest@1
              path: /importBankConnection
              method: POST
          transformations:
            - type: GetPipelineConfigByWellKnownName@1
              wellKnownName: FinApiConfiguration
              targetPath: $.config
            - type: FinApiSetConfig@1
              baseUrlPath: $.config.baseUrl
              clientIdPath: $.config.clientId
              clientSecretPath: $.config.clientSecret
            - type: FinApiAuth@1
              description: Authenticate with finAPI
              targetPath: $.auth.accessToken
              targetValueWriteMode: Overwrite
              targetValueKind: Simple
              documentMode: Extend
              usernamePath: $.config.username
              passwordPath: $.config.password
            - type: GetRtEntitiesById@1
              description: Load BankConnection entity by rtId
              rtIdsPath: $.body.bankConnectionRtId
              ckTypeId: Basic.Accounting/BankConnection
              targetPath: $.bankConnection
            - type: FinApiImportBankConnection@1
              description: Import bank connection via finAPI
              accessTokenPath: $.auth.accessToken
              bankIdPath: $.bankConnection.Items[0].Attributes.BankCode
              bankingInterface: XS2A
              bankingUserIdPath: $.body.bankingUserId
              userIdLabel: Verfügernummer
              bankingCustomerIdPath: $.body.bankingCustomerId
              customerIdLabel: Kundennummer
              bankingPinPath: $.body.bankingPin
              pinLabel: PIN
              targetPath: $.importResult
              targetValueWriteMode: Overwrite
              targetValueKind: Simple
              documentMode: Extend
            - type: CreateUpdateInfo@1
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: Update
              ckTypeId: Basic.Accounting/BankConnection
              rtIdPath: $.body.bankConnectionRtId
              attributeUpdates:
                - attributeName: ExternalId
                  valuePath: $.finApiBankConnectionId
                  attributeValueType: String
                - attributeName: AccountIds
                  valuePath: $.finApiAccountIds
                  attributeValueType: IntArray
                - attributeName: SyncStatus
                  value: Connected
                  attributeValueType: String
                - attributeName: LastSuccessfulSync
                  attributeValueType: DateTime
                  valuePath: $.completedAt
            - type: ApplyChanges@2
              description: Persist BankConnection update
              entityUpdatesPath: $._updateItems
            # Security: reduce the HTTP response to just the import result so it
            # can never leak finApiConfig (clientSecret/password/clientId/
            # username), the finAPI access token, the submitted banking PIN, or
            # the caller's request headers/Authorization.
            - type: Project@1
              clear: true
              fields:
                - path: $.importResult
                  inclusion: true
