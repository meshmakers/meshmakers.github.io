                        # (e.g. a duplicate re-analysis that now completes).
                        - attributeName: ProcessingError
                          attributeValueType: String
                          value: ""
                    - type: ApplyChanges@2
                      entityUpdatesPath: $.finals
                - type: If@1
                  description: Extraction incomplete, duplicate or no invoice found - flag for manual follow-up
                  path: $.uploadDone
                  operator: NotEquals
                  value: true
                  valueType: Boolean
                  transformations:
                    - type: If@1
                      description: No invoice reported at all - write the generic reason (per-invoice reasons were written in the loop)
                      path: $.invCount
                      operator: LessEqualsThan
                      value: 0
                      valueType: Int64
                      transformations:
                        - type: SetPrimitiveValue@1
                          targetPath: $.noInvoiceNote
                          valueType: String
                          value: "OCR or AI extraction did not produce a complete result. Please process the document manually."
                    - type: CreateUpdateInfo@1
                      targetPath: $.finals
                      targetValueKind: Array
                      targetValueWriteMode: Overwrite
                      updateKind: Update
                      ckTypeId: Meshmakers.Accounting/UploadedDocument
                      rtIdPath: $.key.RtId
                      attributeUpdates:
                        - attributeName: ProcessingState
                          attributeValueType: Enum
                          value: INCOMPLETE
                        - attributeName: ProcessedAt
                          attributeValueType: DateTime
                          valuePath: $.processedAt
                        - attributeName: ProcessingError
                          attributeValueType: String
                          valuePath: $.noInvoiceNote
                    - type: ApplyChanges@2
                      entityUpdatesPath: $.finals
                - type: SetPrimitiveValue@1
                  valuePath: $.key.RtId
                  valueType: String
                  targetPath: $.key._processedRtId
                - type: Project@1
                  description: Keep only the processed id in the loop result
                  path: $.key
                  fields:
                    - path: Attributes
            # --- AB#5348: a crashed iteration has to fail VISIBLY, exactly once ---
            # The ForEach above isolates a failing iteration, but the iteration
            # dies wherever it throws, so nothing INSIDE it can still write a
            # terminal state. The upload therefore keeps the PROCESSING(1) its
            # first node committed, and the pickup filter above (ProcessingState
            # <= 1, deliberately reclaiming uploads orphaned by an adapter
            # crash) picks it up again five minutes later: a deterministically
            # poisoned document burns a full OCR + AI pass on every run forever
            # and shows the user nothing - not COMPLETED(2), not INCOMPLETE(3),
            # just permanently "in progress" with an empty ProcessedAt. That is
            # the state "Rechnung Dorfaeusl 59.pdf" was wedged in.
            # This sweep runs AFTER the loop, where a terminal state can still
            # be written. It walks the uploads THIS run picked up - deliberately
            # not "everything at PROCESSING", which would also flag the in-flight
            # documents of a concurrent manual /processDocuments run - re-reads
            # each one and flags the ones that never left PROCESSING. An
            # iteration that succeeded has already moved to COMPLETED or
            # INCOMPLETE and cannot match, so the sweep hits exactly the crashed
            # ones. Five point reads per run.
            # Orphan reclaim after an adapter restart is untouched: the process
            # is gone in that case and this node never runs, so the <= 1 filter
            # still rescues those uploads on the next poll.
            # The run still turns red - ForEach@1 raises its aggregated
            # iteration error AFTER the downstream nodes have run (no errorsPath
            # is configured, and none must be added), so the failure stays in the
            # execution history too.
            - type: DateTime@1
              description: Timestamp for the failure flag
              operation: Now
              targetPath: $.sweptAt
            - type: ForEach@1
              description: Flag every upload whose analysis iteration crashed
              iterationPath: $.pending.Items
              targetPath: $.swept
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
              maxDegreeOfParallelism: 1
              # One upload that cannot be flagged must not stop the others from
              # being flagged - and the run is failing anyway.
              continueOnError: true
              transformations:
                # rtIdsPath is READ AS AN ARRAY (GetRtEntitiesByIdNode ->
                # IDataContext.GetArray<string>), so it is wrapped explicitly -
                # the house pattern, see notify-todo-inbound.yaml ("RtIdsPath
                # needs an array"). A bare scalar path does currently work (the
                # data context widens a scalar to a one-element array), but the
                # contract the property states is the array, and a path that
                # resolves to something the widening does not cover - a wildcard
                # like $.pending.Items[*].RtId, or an absent path - yields null
                # and the node throws "No RtIds found at path". Writing the array
                # the property asks for keeps this out of the widening's hands.
                - type: SetPrimitiveValue@1
                  description: Wrap the single rtId into an array for GetRtEntitiesById
                  targetPath: $.key._sweepRtIds
                  valuePath: $.key.RtId
                  valueType: String
                  targetValueKind: Array
                # Read UNFILTERED on purpose: the current ProcessingState is what
                # decides, and an unfiltered read must always come back with
                # exactly this upload. That makes the read self-checking - see the
                # empty-result branch below.
                - type: GetRtEntitiesById@1
                  description: Re-read this upload - its CURRENT state decides
                  ckTypeId: Meshmakers.Accounting/UploadedDocument
                  rtIdsPath: $.key._sweepRtIds
                  targetPath: $.current
                # The sweep's own failure mode is silence: if the re-read ever
                # stops returning the upload, nothing is flagged, the document
                # stays PROCESSING and is retried every five minutes - exactly
                # the defect this sweep exists to remove, and just as invisible.
                # An upload we marked PROCESSING moments ago must be readable by
                # its own rtId, so an empty result is either a delete during the
                # run or a broken sweep, and both belong in the execution log.
                - type: If@1
                  description: Re-read came back empty - the sweep cannot do its job
                  path: $.current.TotalCount
                  operator: Equals
                  value: 0
                  valueType: Int64
                  transformations:
                    - type: Logger@1
                      message: "AB#5348 sweep: re-reading a just-processed upload by its own rtId returned nothing. Either the upload was deleted during this run, or the sweep's re-read is broken - in which case a crashed analysis is no longer flagged INCOMPLETE and the document is retried every five minutes at full OCR and AI cost. Check GetRtEntitiesById@1 / rtIdsPath in the Document Analysis pipeline."
                - type: If@1
                  description: Still PROCESSING after the loop - this upload's iteration crashed
                  path: $.current.Items[0].Attributes.ProcessingState
                  operator: Equals
                  value: 1
                  valueType: Int64
                  transformations:
                    - type: CreateUpdateInfo@1
                      targetPath: $.failMark
                      targetValueKind: Array
                      targetValueWriteMode: Overwrite
                      updateKind: Update
                      ckTypeId: Meshmakers.Accounting/UploadedDocument
                      rtIdPath: $.key.RtId
                      attributeUpdates:
                        - attributeName: ProcessingState
                          attributeValueType: Enum
                          value: INCOMPLETE
                        # Stamped so the document stops looking in-flight. An
                        # empty ProcessedAt on a PROCESSING upload was the only
                        # outward sign this defect ever gave.
                        - attributeName: ProcessedAt
                          attributeValueType: DateTime
                          valuePath: $.full.sweptAt
                        - attributeName: ProcessingError
                          attributeValueType: String
                          value: "The automatic analysis of this document failed unexpectedly and was stopped. It is not retried automatically - see the pipeline execution history for the error, then start the analysis again from the inbox."
                    - type: ApplyChanges@2
                      entityUpdatesPath: $.failMark
            - type: Project@1
              clear: true
              fields:
                - path: $.processed
                  inclusion: true
      - id: System.Communication/StatusMessage
  # Cron trigger for the Document Analysis pipeline — replaces the former in-process
  # FromPolling (00:05:00). Scheduled by the Bot/Hangfire scheduler, so it survives
  # adapter hibernation (scale-to-zero co-wake, AB#4918/4984).
  - rtId: aa0000000000000000000304
    ckTypeId: System.Communication/PipelineTrigger
    associations:
      - roleId: System/ParentChild
        targetRtId: aa0000000000000000000300
        targetCkTypeId: System.Communication/DataFlow
      - roleId: System.Communication/Triggers
        targetRtId: aa0000000000000000000301
        targetCkTypeId: System.Communication/Pipeline
    attributes:
      - id: System/Name
        value: Document Analysis Schedule
      - id: System/Description
        value: Runs the document analysis pipeline every 5 minutes.
      - id: System/Enabled
        value: true
      - id: System.Bot/CronExpression
        value: "0 */5 * * * ?"
