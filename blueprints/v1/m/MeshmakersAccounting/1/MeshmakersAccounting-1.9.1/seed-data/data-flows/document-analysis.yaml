                              value: ""
                            - type: SelectByPath@1
                              description: The upload's own file hash, when it has one
                              selectPath:
                                - path: $.full.key.Attributes.FileHash
                                  targetPath: $.dupUploadHash
                            - type: SetPrimitiveValue@1
                              description: Default - this upload reported several invoices
                              targetPath: $.dupSingleInvoice
                              valueType: Boolean
                              value: false
                            - type: If@1
                              description: Exactly one invoice in this upload - no sibling documents exist
                              path: $.full.invCount
                              operator: Equals
                              value: 1
                              valueType: Int64
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.dupSingleInvoice
                                  valueType: Boolean
                                  value: true
                            - type: If@1
                              description: A vendor name is required - without one the same-vendor condition cannot be established
                              path: $.dupVendorNorm
                              operator: NotEquals
                              value: ""
                              valueType: String
                              transformations:
                                - type: GetRtEntitiesByType@1
                                  description: Existing documents with exactly this gross total - the only equality a fieldFilter carries reliably here
                                  ckTypeId: Meshmakers.Accounting/AccountingDocument
                                  targetPath: $.dupCand
                                  take: 100
                                  fieldFilters:
                                    - attributePath: GrossTotal
                                      operator: Equals
                                      comparisonValuePath: $.key.grossTotal
                                # Both loops collect their hits through mergePath: an
                                # iteration that writes nothing contributes nothing to the
                                # result array (ForEach@1 skips a null merge item), so
                                # $.dupHard / $.dupSuspect ARE the hits and [0] answers
                                # "any hit". A loop cannot write into the enclosing context
                                # - the iteration works on a clone and only its merge value
                                # travels out - which is why the verdict is carried out this
                                # way and not by setting a flag on the invoice
                                # (transaction-maintenance.yaml aggregates its updates with
                                # the same idiom).
                                - type: ForEach@1
                                  description: Hard duplicate - same vendor, date, gross total and normalised number, or the identical file for a numberless receipt
                                  iterationPath: $.dupCand.Items
                                  targetPath: $.dupHard
                                  mergePath: $._dupHardNote
                                  maxDegreeOfParallelism: 1
                                  transformations:
                                    - type: ExecuteCSharp@1
                                      description: Vendor, recurrence and number/file verdict for this candidate
                                      code: 'string Nm(string s) { if (s == null) return ""; var n = Regex.Replace(s.ToLowerInvariant().Trim(), @"\s+", " "); n = Regex.Replace(n, @"[\s.,]+$", ""); foreach (var f in new[] { "gmbh & co. kg", "gmbh & co kg", "ges.m.b.h", "gesmbh", "gmbh", "limited", "s.r.o", "sarl", "sas", "ltd", "inc", "llc", "plc", "e.u", "ag", "kg", "og", "sa", "bv", "nv", "se", "ug" }) { if (n.EndsWith(" " + f)) { n = n.Substring(0, n.Length - f.Length - 1).TrimEnd(); break; } } return n; } string Num(string s) { return s == null ? "" : Regex.Replace(s, @"[\s\-/._]+", "").ToUpperInvariant(); } bool Same(string a, string b) { if (a.Length == 0 || b.Length == 0) return false; if (a == b) return true; return Math.Min(a.Length, b.Length) >= 5 && (a.StartsWith(b) || b.StartsWith(a)); } if (candState == 4) return false; if (!string.IsNullOrWhiteSpace(candRecurrence)) return false; var iv = invVendorNorm ?? ""; var inum = invNumNorm ?? ""; var uh = uploadHash ?? ""; if (!Same(Nm(candVendor), iv)) return false; if (inum.Length > 0) return Num(candNumber) == inum; return single && uh.Length > 0 && string.Equals(candHash ?? "", uh, StringComparison.OrdinalIgnoreCase);'
                                      usings:
                                        - System
                                        - System.Text.RegularExpressions
                                      returnType: Boolean
                                      arguments:
                                        - name: candState
                                          valuePath: $.key.Attributes.DocumentState
                                          dataType: Int64
                                        - name: candRecurrence
                                          valuePath: $.key.Attributes.RecurrenceMatchValue
                                          dataType: String
                                        - name: candVendor
                                          valuePath: $.key.Attributes.Vendor.Attributes.CompanyName
                                          dataType: String
                                        - name: candNumber
                                          valuePath: $.key.Attributes.DocumentNumber
                                          dataType: String
                                        - name: candHash
                                          valuePath: $.key.Attributes.FileHash
                                          dataType: String
                                        - name: invVendorNorm
                                          valuePath: $.full.dupVendorNorm
                                          dataType: String
                                        - name: invNumNorm
                                          valuePath: $.full.dupNumNorm
                                          dataType: String
                                        - name: uploadHash
                                          valuePath: $.full.dupUploadHash
                                          dataType: String
                                        - name: single
                                          valuePath: $.full.dupSingleInvoice
                                          dataType: Boolean
                                      targetPath: $._dupIsHard
                                    - type: If@1
                                      description: Candidate matches on everything but the date
                                      path: $._dupIsHard
                                      operator: Equals
                                      value: true
                                      valueType: Boolean
                                      transformations:
                                        - type: If@1
                                          description: Document date not before the window start (typed comparison - a date fieldFilter never matches)
                                          path: $.key.Attributes.DocumentDate
                                          operator: GreaterEqualsThan
                                          valuePath: $.full.dupDateLo
                                          valueType: DateTime
                                          transformations:
                                            - type: If@1
                                              description: Document date not after the window end
                                              path: $.key.Attributes.DocumentDate
                                              operator: LessEqualsThan
                                              valuePath: $.full.dupDateHi
                                              valueType: DateTime
                                              transformations:
                                                - type: ExecuteCSharp@1
                                                  description: Reason naming the existing document
                                                  code: 'var n = string.IsNullOrWhiteSpace(number) ? "(no number)" : number.Trim(); var d = date ?? ""; DateTime dt; if (DateTime.TryParse(d, System.Globalization.CultureInfo.InvariantCulture, System.Globalization.DateTimeStyles.None, out dt)) d = dt.ToString("dd.MM.yyyy", System.Globalization.CultureInfo.InvariantCulture); var g = gross.ToString("0.00", System.Globalization.CultureInfo.InvariantCulture); return "Duplicate of " + n + " (" + d + ", " + g + ") — rtId " + (rtId ?? "");'
                                                  usings:
                                                    - System
                                                  returnType: String
                                                  arguments:
                                                    - name: number
                                                      valuePath: $.key.Attributes.DocumentNumber
                                                      dataType: String
                                                    - name: date
                                                      valuePath: $.key.Attributes.DocumentDate
                                                      dataType: String
                                                    - name: gross
                                                      valuePath: $.key.Attributes.GrossTotal
                                                      dataType: Double
                                                    - name: rtId
                                                      valuePath: $.key.RtId
                                                      dataType: String
                                                  targetPath: $._dupHardNote
                                - type: If@1
                                  description: No hard hit - a numberless receipt may still be a suspected duplicate
                                  path: $.dupHard[0]
                                  operator: Equals
                                  valueType: String
                                  transformations:
                                    - type: ForEach@1
                                      description: Suspected duplicate - numberless receipt with the same vendor, date and gross total but a different file
                                      iterationPath: $.dupCand.Items
                                      targetPath: $.dupSuspect
                                      mergePath: $._dupSuspectNote
                                      maxDegreeOfParallelism: 1
                                      transformations:
                                        - type: ExecuteCSharp@1
                                          description: Vendor, recurrence and different-file verdict for this candidate
                                          code: 'string Nm(string s) { if (s == null) return ""; var n = Regex.Replace(s.ToLowerInvariant().Trim(), @"\s+", " "); n = Regex.Replace(n, @"[\s.,]+$", ""); foreach (var f in new[] { "gmbh & co. kg", "gmbh & co kg", "ges.m.b.h", "gesmbh", "gmbh", "limited", "s.r.o", "sarl", "sas", "ltd", "inc", "llc", "plc", "e.u", "ag", "kg", "og", "sa", "bv", "nv", "se", "ug" }) { if (n.EndsWith(" " + f)) { n = n.Substring(0, n.Length - f.Length - 1).TrimEnd(); break; } } return n; } bool Same(string a, string b) { if (a.Length == 0 || b.Length == 0) return false; if (a == b) return true; return Math.Min(a.Length, b.Length) >= 5 && (a.StartsWith(b) || b.StartsWith(a)); } if (candState == 4) return false; if (!string.IsNullOrWhiteSpace(candRecurrence)) return false; var iv = invVendorNorm ?? ""; var inum = invNumNorm ?? ""; var uh = uploadHash ?? ""; if (inum.Length > 0) return false; if (!single) return false; if (!Same(Nm(candVendor), iv)) return false; return uh.Length == 0 || !string.Equals(candHash ?? "", uh, StringComparison.OrdinalIgnoreCase);'
                                          usings:
                                            - System
                                            - System.Text.RegularExpressions
                                          returnType: Boolean
                                          arguments:
                                            - name: candState
                                              valuePath: $.key.Attributes.DocumentState
                                              dataType: Int64
                                            - name: candRecurrence
                                              valuePath: $.key.Attributes.RecurrenceMatchValue
                                              dataType: String
                                            - name: candVendor
                                              valuePath: $.key.Attributes.Vendor.Attributes.CompanyName
                                              dataType: String
                                            - name: candHash
                                              valuePath: $.key.Attributes.FileHash
                                              dataType: String
                                            - name: invVendorNorm
                                              valuePath: $.full.dupVendorNorm
                                              dataType: String
                                            - name: invNumNorm
                                              valuePath: $.full.dupNumNorm
                                              dataType: String
                                            - name: uploadHash
                                              valuePath: $.full.dupUploadHash
                                              dataType: String
                                            - name: single
                                              valuePath: $.full.dupSingleInvoice
                                              dataType: Boolean
                                          targetPath: $._dupIsSuspect
                                        - type: If@1
                                          description: Candidate matches on everything but the date
                                          path: $._dupIsSuspect
                                          operator: Equals
                                          value: true
                                          valueType: Boolean
                                          transformations:
                                            - type: If@1
                                              description: Document date not before the window start
                                              path: $.key.Attributes.DocumentDate
                                              operator: GreaterEqualsThan
                                              valuePath: $.full.dupDateLo
                                              valueType: DateTime
                                              transformations:
                                                - type: If@1
                                                  description: Document date not after the window end
                                                  path: $.key.Attributes.DocumentDate
                                                  operator: LessEqualsThan
                                                  valuePath: $.full.dupDateHi
                                                  valueType: DateTime
                                                  transformations:
                                                    - type: ExecuteCSharp@1
                                                      description: Reason naming the possibly duplicated document
                                                      code: 'var n = string.IsNullOrWhiteSpace(number) ? "(no number)" : number.Trim(); var d = date ?? ""; DateTime dt; if (DateTime.TryParse(d, System.Globalization.CultureInfo.InvariantCulture, System.Globalization.DateTimeStyles.None, out dt)) d = dt.ToString("dd.MM.yyyy", System.Globalization.CultureInfo.InvariantCulture); var g = gross.ToString("0.00", System.Globalization.CultureInfo.InvariantCulture); return "Possible duplicate of " + n + " (" + d + ", " + g + ") — same vendor, date and amount, different file";'
                                                      usings:
                                                        - System
                                                      returnType: String
                                                      arguments:
                                                        - name: number
                                                          valuePath: $.key.Attributes.DocumentNumber
                                                          dataType: String
                                                        - name: date
                                                          valuePath: $.key.Attributes.DocumentDate
                                                          dataType: String
                                                        - name: gross
                                                          valuePath: $.key.Attributes.GrossTotal
                                                          dataType: Double
                                                        - name: rtId
                                                          valuePath: $.key.RtId
                                                          dataType: String
                                                      targetPath: $._dupSuspectNote
                                - type: If@1
                                  description: A hard hit wins over a suspicion
                                  path: $.dupHard[0]
                                  operator: NotEquals
                                  valueType: String
                                  transformations:
                                    - type: SetPrimitiveValue@1
                                      targetPath: $.dupHitNote
                                      valuePath: $.dupHard[0]
                                      valueType: String
                                - type: If@1
                                  description: No hard hit - take the suspicion when there is one
                                  path: $.dupHard[0]
                                  operator: Equals
                                  valueType: String
                                  transformations:
                                    - type: If@1
                                      path: $.dupSuspect[0]
                                      operator: NotEquals
                                      valueType: String
                                      transformations:
                                        - type: SetPrimitiveValue@1
                                          targetPath: $.dupHitNote
                                          valuePath: $.dupSuspect[0]
                                          valueType: String
                            - type: If@1
                              description: Duplicate - create nothing; the upload is parked INCOMPLETE in the Inbox with this reason
                              path: $.dupHitNote
                              operator: NotEquals
                              value: ""
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.docOk
                                  valueType: Boolean
                                  value: false
                                - type: SetPrimitiveValue@1
                                  description: Reuses the AB#4452 duplicate channel - the block after the create gate copies a non-empty $.dupNote into ProcessingError
                                  targetPath: $.dupNote
                                  valuePath: $.dupHitNote
                                  valueType: String
                                - type: Logger@1
                                  message: "AB#5086 normalised duplicate: an existing accounting document matches this invoice on vendor, gross total and document date and either on the normalised document number or on the file hash. No document was created; the upload is parked INCOMPLETE in the Inbox, and ProcessingError names the existing document (number, date, amount, rtId) - Logger@1 cannot interpolate data-context values."
                        # --- AB#5086: Keep as separate document ----------------------
                        # The operator named this upload on the bypass list, so the
                        # duplicate verdict - this one AND the AB#4452 one above - is
                        # withdrawn and the document is created after all. Deliberately
                        # placed AFTER both duplicate checks and BEFORE the direction check
                        # below: it must clear a duplicate reason only, never a direction
                        # conflict or an incomplete extraction, both of which need their
                        # own decision.
                        - type: If@1
                          description: Keep as separate document was requested for this upload (AB#5086)
                          path: $.full.dupBypass
                          operator: Equals
                          value: true
                          valueType: Boolean
                          transformations:
                            - type: If@1
                              description: Only a duplicate verdict is withdrawn - an incomplete extraction stays incomplete
                              path: $.dupNote
                              operator: NotEquals
                              value: ""
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.docOk
                                  valueType: Boolean
                                  value: true
                                - type: SetPrimitiveValue@1
                                  targetPath: $.dupNote
                                  valueType: String
                                  value: ""
                                - type: Logger@1
                                  message: "AB#5086 duplicate bypass: the operator answered the duplicate note in the Inbox with Keep as separate document, so this invoice is created even though an existing document matches it."
                        # --- AB#5382: direction consistency check ---------------------
                        # The extractor sometimes labels an ordinary supplier invoice OUTGOING
                        # although it put OUR company into "customer" (with our VAT id) and the
                        # supplier into "vendor" - 19 of 341 gastroacker documents, all e-mail
                        # imports sent from the supplier's own address. The party fields are
                        # more reliable than the verdict, but not reliable enough to overwrite
                        # it blindly, and vendor/customer are never modified. The C# node
                        # derives an EXPECTATION from the parties: VAT id equality after
                        # removing ALL whitespace and upper-casing (a profile typed "ATU 123"
                        # must not make the check inert); exact normalised name equality
                        # (lower-case, trimmed, whitespace collapsed, ONE trailing legal-form
                        # token stripped) ONLY for a party without a VAT id, never Contains
                        # (salzburgdev's profile says "salzburgdev", its documents "Gerald
                        # Lochner / SALZBURGDEV.AT" - that miss is intended); "" when nothing
                        # is known or both parties look like us. On a contradiction with the
                        # model's documentType: e-mail import AND expected INCOMING (the
                        # supplier-mail shape) -> $.dirOverride, applied inside the create
                        # branch so $.docType stays the single source of truth for the write
                        # and the re-arm direction, traced in the document's Comment; every
                        # other contradiction -> $.docOk=false + $.dupNote, the
                        # duplicate-branch mechanism that parks the upload INCOMPLETE in the
                        # Inbox with a reason. Deliberate consequence: an UPLOAD is never
                        # overridden, so the self-billing / grant documents (FERCHAU, top
                        # itservices, FFG: we are the customer of a correct OUTGOING document)
                        # and ISPIM (the extractor names us as the vendor of a correct
                        # INCOMING one, without a VAT id) are parked INCOMPLETE on EVERY
                        # upload and stay a recurring manual step for those senders until a
                        # sender allow-list exists.
                        # Absent paths: ExecuteCSharp@1 coalesces an absent argument to null
                        # and If@1 reads an absent path as null (so an "is set" gate has to
                        # stay: null Equals null is TRUE); SetPrimitiveValue@1 and
                        # FormatString@1 throw on an undefined path, so every value they read
                        # is defaulted first.
                        - type: SetPrimitiveValue@1
                          description: Default - no direction override
                          targetPath: $.dirOverride
                          valueType: Boolean
                          value: false
                        - type: SetPrimitiveValue@1
                          description: Default - no expectation (the model's verdict stands)
                          targetPath: $.dir.expected
                          valueType: String
                          value: ""
                        - type: If@1
                          description: Direction check only for a document that is about to be created (a duplicate keeps its own reason)
                          path: $.docOk
                          operator: Equals
                          value: true
                          valueType: Boolean
                          transformations:
                            - type: If@1
                              description: CompanyProfile exists (user-created singleton, may be absent)
                              path: $.company.TotalCount
                              operator: GreaterThan
                              value: 0
                              valueType: Int64
                              transformations:
                                - type: ExecuteCSharp@1
                                  description: Expected direction from the parties - INCOMING, OUTGOING or "" (VAT id equality without any whitespace; exact normalised name only for a party WITHOUT a VAT id; never Contains)
                                  code: 'string Vat(string s) { return s == null ? "" : Regex.Replace(s, @"\s+", "").ToUpperInvariant(); } string Nm(string s) { if (s == null) return ""; var n = Regex.Replace(s.ToLowerInvariant().Trim(), @"\s+", " "); n = Regex.Replace(n, @"[\s.,]+$", ""); foreach (var f in new[] { "gmbh & co. kg", "gmbh & co kg", "ges.m.b.h", "gesmbh", "gmbh", "limited", "s.r.o", "sarl", "sas", "ltd", "inc", "llc", "plc", "e.u", "ag", "kg", "og", "sa", "bv", "nv", "se", "ug" }) { if (n.EndsWith(" " + f)) { n = n.Substring(0, n.Length - f.Length - 1).TrimEnd(); break; } } return n; } var ov = Vat(ownVat); var on = Nm(ownName); var vv = Vat(vendorVat); var cv = Vat(customerVat); var vendorIsUs = vv.Length > 0 ? ov.Length > 0 && vv == ov : on.Length > 0 && Nm(vendorName) == on; var customerIsUs = cv.Length > 0 ? ov.Length > 0 && cv == ov : on.Length > 0 && Nm(customerName) == on; if (customerIsUs && !vendorIsUs) return "INCOMING"; if (vendorIsUs && !customerIsUs) return "OUTGOING"; return "";'
                                  usings:
                                    - System
                                    - System.Text.RegularExpressions
                                  returnType: String
                                  arguments:
                                    - name: ownVat
                                      valuePath: $.company.Items[0].Attributes.VatId
                                      dataType: String
                                    - name: ownName
                                      valuePath: $.company.Items[0].Attributes.Name
                                      dataType: String
                                    - name: vendorVat
                                      valuePath: $.key.vendor.vatId
                                      dataType: String
                                    - name: vendorName
                                      valuePath: $.key.vendor.companyName
                                      dataType: String
                                    - name: customerVat
                                      valuePath: $.key.customer.vatId
                                      dataType: String
                                    - name: customerName
                                      valuePath: $.key.customer.companyName
                                      dataType: String
                                  targetPath: $.dir.expected
                            - type: If@1
                              description: An expectation exists - compare it with the model's verdict
                              path: $.dir.expected
                              operator: NotEquals
                              value: ""
                              valueType: String
                              transformations:
                                # The model's verdict, normalised exactly like the create branch does
                                # (anything but an exact OUTGOING is INCOMING); $.docType itself is only
                                # derived inside that branch, which runs after this check.
                                - type: SetPrimitiveValue@1
                                  targetPath: $.dir.model
                                  valueType: String
                                  value: INCOMING
                                - type: If@1
                                  path: $.key.documentType
                                  operator: Equals
                                  value: OUTGOING
                                  valueType: String
                                  transformations:
                                    - type: SetPrimitiveValue@1
                                      targetPath: $.dir.model
                                      valueType: String
                                      value: OUTGOING
                                - type: If@1
                                  description: Contradiction - override (e-mail + expected INCOMING) or park in the Inbox
                                  path: $.dir.expected
                                  operator: NotEquals
                                  valuePath: $.dir.model
                                  valueType: String
                                  transformations:
                                    # Identifying details for the note - defaulted, then copied under an
                                    # "is set" gate; the sender clause is omitted when there is no sender.
                                    - type: SetPrimitiveValue@1
                                      targetPath: $.dir.docNo
                                      valueType: String
                                      value: "(no number)"
                                    - type: SetPrimitiveValue@1
                                      targetPath: $.dir.vendorLabel
                                      valueType: String
                                      value: "(unknown vendor)"
                                    - type: SetPrimitiveValue@1
                                      targetPath: $.dir.senderClause
                                      valueType: String
                                      value: ""
                                    - type: If@1
                                      path: $.key.documentNumber
                                      operator: NotEquals
                                      valueType: String
                                      transformations:
                                        - type: SetPrimitiveValue@1
                                          targetPath: $.dir.docNo
                                          valuePath: $.key.documentNumber
                                          valueType: String
                                    - type: If@1
                                      path: $.key.vendor.companyName
                                      operator: NotEquals
                                      valueType: String
                                      transformations:
                                        - type: SetPrimitiveValue@1
                                          targetPath: $.dir.vendorLabel
                                          valuePath: $.key.vendor.companyName
                                          valueType: String
                                    - type: If@1
                                      path: $.full.key.Attributes.SourceSender
                                      operator: NotEquals
                                      valueType: String
                                      transformations:
                                        - type: FormatString@1
                                          format: ", sender {$.full.key.Attributes.SourceSender}"
                                          targetPath: $.dir.senderClause
                                    # Channel of the upload: DocumentSource EMAIL = 1, read as the enum's
                                    # int key (an unset SourceChannel reads null and counts as "not e-mail").
                                    - type: SetPrimitiveValue@1
                                      targetPath: $.dir.isEmail
                                      valueType: Boolean
                                      value: false
                                    - type: If@1
                                      description: Upload came in through the e-mail import
                                      path: $.full.key.Attributes.SourceChannel
                                      operator: Equals
                                      value: 1
                                      valueType: Int64
                                      transformations:
                                        - type: SetPrimitiveValue@1
                                          targetPath: $.dir.isEmail
                                          valueType: Boolean
                                          value: true
                                    - type: If@1
                                      description: E-mail import AND expected INCOMING - the supplier-mail shape, override
                                      path: $.dir.isEmail
                                      operator: Equals
                                      value: true
                                      valueType: Boolean
                                      transformations:
                                        - type: If@1
                                          path: $.dir.expected
                                          operator: Equals
                                          value: INCOMING
                                          valueType: String
                                          transformations:
                                            - type: SetPrimitiveValue@1
                                              targetPath: $.dirOverride
                                              valueType: Boolean
                                              value: true
                                            # Per-document trace, written to the AccountingDocument's Comment
                                            # (the internal note, not handed over to the tax advisor). The
                                            # vendor's addressNotes share that attribute and are appended, so
                                            # the override does not drop them.
                                            - type: SetPrimitiveValue@1
                                              targetPath: $.dir.addrSuffix
                                              valueType: String
                                              value: ""
                                            - type: If@1
                                              path: $.key.vendor.addressNotes
                                              operator: NotEquals
                                              valueType: String
                                              transformations:
                                                - type: FormatString@1
                                                  format: " Vendor address as printed: {$.key.vendor.addressNotes}"
                                                  targetPath: $.dir.addrSuffix
                                            - type: FormatString@1
                                              description: Override note for the document's Comment
                                              format: "Direction corrected from OUTGOING to INCOMING by the consistency check (AB#5382): document {$.dir.docNo} from {$.dir.vendorLabel}{$.dir.senderClause}.{$.dir.addrSuffix}"
                                              targetPath: $.dir.overrideNote
                                            - type: Logger@1
                                              message: "AB#5382 direction override: e-mail import - the extractor labelled the invoice OUTGOING, but our company is the CUSTOMER (VAT id / name match) and the vendor is a third party; the document is created as INCOMING and carries the details (document number, vendor, sender) in its Comment - Logger@1 cannot interpolate data-context values."
                                    - type: If@1
                                      description: Every other contradiction - do not create silently, park the upload in the Inbox
                                      path: $.dirOverride
                                      operator: Equals
                                      value: false
                                      valueType: Boolean
                                      transformations:
                                        - type: SetPrimitiveValue@1
                                          description: Reason for expected INCOMING (we are the customer, model says OUTGOING)
                                          targetPath: $.dir.reason
                                          valueType: String
                                          value: "Direction check: the extractor says OUTGOING but our company appears as the customer - please verify the direction and the parties, then create the document manually."
                                        - type: If@1
                                          description: Reason for expected OUTGOING (we are the vendor, model says INCOMING)
                                          path: $.dir.expected
                                          operator: Equals
                                          value: OUTGOING
                                          valueType: String
                                          transformations:
                                            - type: SetPrimitiveValue@1
                                              targetPath: $.dir.reason
                                              valueType: String
                                              value: "Direction check: the extractor says INCOMING but our company appears as the vendor - please verify the direction and the parties, then create the document manually."
                                        # Reuses the duplicate-branch path: the "Invoice not created" block
                                        # after the create gate copies a non-empty $.dupNote into
                                        # ProcessingError, and the upload ends INCOMPLETE after the loop.
                                        - type: FormatString@1
                                          description: Inbox reason with the identifying details
                                          format: "{$.dir.reason} (Document {$.dir.docNo} from {$.dir.vendorLabel}{$.dir.senderClause}.)"
                                          targetPath: $.dupNote
                                        - type: SetPrimitiveValue@1
                                          targetPath: $.docOk
                                          valueType: Boolean
                                          value: false
                                        - type: Logger@1
                                          message: "AB#5382 direction conflict: the extractor's documentType contradicts the parties (our company is on the other side of the document) and this is not the e-mail-import/INCOMING shape - no document created; the upload is parked INCOMPLETE in the Inbox, ProcessingError carries document number, vendor and sender."
                        # --- AB#5402: deterministic extraction check score -----------------------
                        # Grades every extracted field VERIFIED / UNVERIFIED / CONTRADICTORY and the
                        # document by the WORST field; both land on the created AccountingDocument
                        # (ExtractionCheckTier + ExtractionCheckReport) for the review queue. Graded
                        # information ONLY: nothing here touches $.docOk or the COMPLETED/INCOMPLETE
                        # outcome. Checks: value printed verbatim in the OCR text (amounts in the
                        # AT/DE/CH print forms 1234.56 / 1234,56 / 1.234,56 / 1 234,56 / 1'234.56,
                        # dates as dd.MM.yyyy, d.M.yyyy, dd.MM.yy, ISO, slashes and month names; an
                        # amount NOT printed is CONTRADICTORY - the model computed or invented it -
                        # a date/number not printed is only UNVERIFIED; without any OCR text every
                        # verbatim check is UNVERIFIED, never CONTRADICTORY), IBAN mod 97, VAT id
                        # country format with the real ATU check digit, plus the signals computed
                        # above: $.totalsMismatch -> the three amounts CONTRADICTORY ("sum"),
                        # $.dateOk == false -> documentDate CONTRADICTORY ("window"); both only
                        # when $.docOk (they are computed on the completeness branch only).
                        # ONE ExecuteCSharp@1 node by design: every DISTINCT script is compiled once
                        # and retained for the adapter's lifetime (tens of MB each, AB#5448), so all
                        # checks share one script with a composite return. The body is wrapped in
                        # try/catch and returns the UNVERIFIED sentinel on any failure - the node has
                        # no continueOnError and a throw would abort the whole upload iteration.
                        # Linear string work only (IndexOf with digit-boundary checks, no regex),
                        # OCR text capped at 250k chars, so the default timeout is never near.
                        # Return form: StringArray [tier, reportJson], read back as $.fieldChecks[0]
                        # and $.fieldChecks[1] in the create node. Verified: CreateUpdateInfo@1
                        # resolves valuePath through SelectMatches, whose multi-match pre-filter only
                        # fires on * ? .. - an index is a plain single-value read, and this file
                        # already reads $.ai.result.invoices[0].* that way in the Stage 1 persist.
                        # Record (an anonymous object) was NOT used: its result conversion is a raw
                        # pass-through without test coverage. Absent paths: every argument coalesces
                        # to the type's default (null / 0 / false), so a 0 amount means "not
                        # extracted" and is skipped. Harness + fixtures: scripts/extraction_check_test.py.
                        - type: ExecuteCSharp@1
                          description: AB#5402 extraction check score - per-field VERIFIED/UNVERIFIED/CONTRADICTORY over the OCR text, IBAN mod 97, VAT id format/check digit and the totals/date-window signals; returns [tier, reportJson]
                          code: |
                            try
                            {
                              const int MaxOcr = 250000;
                              var order = new Dictionary<string, int> { ["VERIFIED"] = 0, ["UNVERIFIED"] = 1, ["CONTRADICTORY"] = 2 };
                              var fields = new Dictionary<string, object>();
                              var worst = -1;
                              void Grade(string field, string tier, List<string> checks)
                              {
                                fields[field] = new Dictionary<string, object> { ["t"] = tier, ["c"] = checks };
                                if (order[tier] > worst) worst = order[tier];
                              }
                              // --- OCR text normalisation: NBSP/thin spaces -> space, typographic dashes -> '-', bounded length.
                              string Norm(string s)
                              {
                                if (string.IsNullOrEmpty(s)) return "";
                                if (s.Length > MaxOcr) s = s.Substring(0, MaxOcr);
                                var sb = new StringBuilder(s.Length);
                                foreach (var ch in s)
                                {
                                  if (ch == '\u00A0' || ch == '\u202F' || ch == '\u2009' || ch == '\t') sb.Append(' ');
                                  else if (ch == '\u2013' || ch == '\u2014' || ch == '\u2212') sb.Append('-');
                                  else sb.Append(ch);
                                }
                                return sb.ToString();
                              }
                              string Compact(string s)
                              {
                                if (string.IsNullOrEmpty(s)) return "";
                                var sb = new StringBuilder(s.Length);
                                foreach (var ch in s) if (!char.IsWhiteSpace(ch)) sb.Append(ch);
                                return sb.ToString();
                              }
                              // A numeric token counts only when it is not glued to more digits: "200,00" must not match
                              // inside "1200,00" and "1200" must not match inside "1200,50" or "12000".
                              bool IsSep(char c) { return c == '.' || c == ',' || c == '\'' ; }
                              bool Bounded(string text, int idx, int len)
                              {
                                if (idx > 0)
                                {
                                  var p = text[idx - 1];
                                  if (char.IsDigit(p)) return false;
                                  if (IsSep(p) && idx > 1 && char.IsDigit(text[idx - 2])) return false;
                                }
                                var end = idx + len;
                                if (end < text.Length)
                                {
                                  var n = text[end];
                                  if (char.IsDigit(n)) return false;
                                  if (IsSep(n) && end + 1 < text.Length && char.IsDigit(text[end + 1])) return false;
                                }
                                return true;
                              }
                              bool FindBounded(string text, string token)
                              {
                                if (string.IsNullOrEmpty(token)) return false;
                                var pos = 0;
                                while (pos <= text.Length - token.Length)
                                {
                                  var idx = text.IndexOf(token, pos, StringComparison.Ordinal);
                                  if (idx < 0) return false;
                                  if (Bounded(text, idx, token.Length)) return true;
                                  pos = idx + 1;
                                }
                                return false;
                              }
                              // --- Amount forms as printed on AT/DE/CH invoices (currency symbols are outside the token).
                              string Group(string digits, char sep)
                              {
                                if (digits.Length <= 3) return digits;
                                var sb = new StringBuilder();
                                var first = digits.Length % 3;
                                if (first > 0) sb.Append(digits, 0, first);
                                for (var i = first; i < digits.Length; i += 3)
                                {
                                  if (sb.Length > 0) sb.Append(sep);
                                  sb.Append(digits, i, 3);
                                }
                                return sb.ToString();
                              }
                              List<string> AmountForms(double v)
                              {
                                var r = Math.Round(Math.Abs(v), 2, MidpointRounding.AwayFromZero);
                                var whole = (long)Math.Floor(r);
                                var cents = (int)Math.Round((r - whole) * 100.0);
                                if (cents == 100) { whole += 1; cents = 0; }
                                var w = whole.ToString(CultureInfo.InvariantCulture);
                                var cc = cents.ToString("00", CultureInfo.InvariantCulture);
                                var forms = new List<string>
                                {
                                  w + "." + cc, w + "," + cc,
                                  Group(w, '.') + "," + cc, Group(w, ',') + "." + cc,
                                  Group(w, ' ') + "," + cc, Group(w, ' ') + "." + cc,
                                  Group(w, '\'') + "." + cc
                                };
                                if (cents == 0)
                                {
                                  forms.Add(w); forms.Add(Group(w, '.')); forms.Add(Group(w, ' ')); forms.Add(Group(w, ','));
                                }
                                else if (cents % 10 == 0)
                                {
                                  var c1 = (cents / 10).ToString(CultureInfo.InvariantCulture);
                                  forms.Add(w + "," + c1); forms.Add(w + "." + c1);
                                }
                                return forms.Distinct().ToList();
                              }
                              // --- Date forms: numeric (dd.MM.yyyy, d.M.yyyy, dd.MM.yy, ISO, slashes) and the common
                              // German/English month-name spellings. No CultureInfo lookups: the adapter may run with
                              // invariant globalization, where a culture lookup throws.
                              string[] De = { "Januar", "Februar", "M\u00E4rz", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember" };
                              string[] En = { "January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December" };
                              bool TryDate(string s, out DateTime d)
                              {
                                d = default;
                                if (string.IsNullOrWhiteSpace(s)) return false;
                                s = s.Trim();
                                var styles = DateTimeStyles.AssumeUniversal | DateTimeStyles.AdjustToUniversal;
                                var fmts = new[] { "yyyy-MM-dd", "yyyy-MM-ddTHH:mm:ss", "yyyy-MM-ddTHH:mm:ssZ", "yyyy-MM-ddTHH:mm:ss.FFFFFFFZ", "yyyy-MM-ddTHH:mm:sszzz", "dd.MM.yyyy", "d.M.yyyy" };
                                if (DateTime.TryParseExact(s, fmts, CultureInfo.InvariantCulture, styles, out d)) return true;
                                return DateTime.TryParse(s, CultureInfo.InvariantCulture, styles, out d);
                              }
                              List<string> DateForms(DateTime d)
                              {
                                var ic = CultureInfo.InvariantCulture;
                                var forms = new List<string>
                                {
                                  d.ToString("dd.MM.yyyy", ic), d.ToString("d.M.yyyy", ic), d.ToString("dd.MM.yy", ic), d.ToString("d.M.yy", ic),
                                  d.ToString("dd. MM. yyyy", ic), d.ToString("yyyy-MM-dd", ic), d.ToString("dd/MM/yyyy", ic), d.ToString("MM/dd/yyyy", ic),
                                  d.ToString("yyyy/MM/dd", ic), d.ToString("dd-MM-yyyy", ic), d.ToString("d/M/yyyy", ic), d.ToString("M/d/yyyy", ic)
                                };
                                var dd = d.Day.ToString(ic); var yy = d.Year.ToString(ic); var de = De[d.Month - 1]; var en = En[d.Month - 1];
                                forms.Add(dd + ". " + de + " " + yy); forms.Add(dd + "." + de + " " + yy); forms.Add(dd + ". " + de.Substring(0, 3) + " " + yy);
                                forms.Add(dd + ". " + de.Substring(0, 3) + ". " + yy);
                                forms.Add(en + " " + dd + ", " + yy); forms.Add(dd + " " + en + " " + yy); forms.Add(en.Substring(0, 3) + " " + dd + ", " + yy);
                                forms.Add(dd + " " + en.Substring(0, 3) + " " + yy); forms.Add(en.Substring(0, 3) + ". " + dd + ", " + yy);
                                return forms.Distinct().ToList();
                              }
                              bool FindAny(string text, List<string> forms)
                              {
                                foreach (var f in forms) if (FindBounded(text, f)) return true;
                                return false;
                              }
                              // --- IBAN mod 97 (ISO 7064), iterative so no BigInteger is needed.
                              string IbanTier(string iban)
                              {
                                var s = Compact(iban).ToUpperInvariant();
                                if (s.Length == 0) return null;
                                if (s.IndexOf('*') >= 0 || s.Count(c => c == 'X') >= 4) return "UNVERIFIED";
                                if (s.Length < 15 || s.Length > 34) return "CONTRADICTORY";
                                if (!char.IsLetter(s[0]) || !char.IsLetter(s[1]) || !char.IsDigit(s[2]) || !char.IsDigit(s[3])) return "CONTRADICTORY";
                                foreach (var c in s) if (!char.IsLetterOrDigit(c) || c > 'Z') return "CONTRADICTORY";
                                var rearranged = s.Substring(4) + s.Substring(0, 4);
                                var rem = 0;
                                foreach (var c in rearranged)
                                {
                                  if (char.IsDigit(c)) rem = (rem * 10 + (c - '0')) % 97;
                                  else rem = (rem * 100 + (c - 'A' + 10)) % 97;
                                }
                                return rem == 1 ? "VERIFIED" : "CONTRADICTORY";
                              }
                              // --- VAT id: country prefix + per-country format; ATU check digit computed properly.
                              bool MatchPattern(string value, string pattern)
                              {
                                foreach (var alt in pattern.Split('|'))
                                {
                                  if (alt.Length != value.Length) continue;
                                  var ok = true;
                                  for (var i = 0; i < alt.Length && ok; i++)
                                  {
                                    var p = alt[i]; var c = value[i];
                                    if (p == 'N') ok = char.IsDigit(c);
                                    else if (p == 'A') ok = c >= 'A' && c <= 'Z';
                                    else if (p == 'X') ok = char.IsDigit(c) || (c >= 'A' && c <= 'Z');
                                    else ok = p == c;
                                  }
                                  if (ok) return true;
                                }
                                return false;
                              }
                              bool AtuCheckDigit(string digits)
                              {
                                // ATU + 8 digits; the 8th is the check digit: sum = c1 + c3 + c5 + c7 + Q(c2) + Q(c4) + Q(c6),
                                // Q(c) = (2c / 10) + (2c mod 10), check = (96 - sum) mod 10.
                                if (digits.Length != 8) return false;
                                var sum = 0;
                                for (var i = 0; i < 7; i++)
                                {
                                  var c = digits[i] - '0';
                                  if (i % 2 == 0) sum += c;
                                  else { var q = c * 2; sum += q / 10 + q % 10; }
                                }
                                var check = ((96 - sum) % 10 + 10) % 10;
                                return check == digits[7] - '0';
                              }
                              string VatTier(string vat)
                              {
                                var s = Compact(vat).ToUpperInvariant().Replace(".", "").Replace("-", "").Replace("/", "");
                                if (s.Length == 0) return null;
                                if (s.Length < 4 || !char.IsLetter(s[0]) || !char.IsLetter(s[1])) return "UNVERIFIED";
                                var cc = s.Substring(0, 2); var body = s.Substring(2);
                                if (cc == "CH" && body.StartsWith("E")) { body = body.Substring(1); foreach (var suf in new[] { "MWST", "TVA", "IVA" }) if (body.EndsWith(suf)) body = body.Substring(0, body.Length - suf.Length); }
                                if (cc == "NO" && body.EndsWith("MVA")) body = body.Substring(0, body.Length - 3);
                                if (cc == "AT")
                                {
                                  if (!MatchPattern(body, "UNNNNNNNN")) return "CONTRADICTORY";
                                  return AtuCheckDigit(body.Substring(1)) ? "VERIFIED" : "CONTRADICTORY";
                                }
                                var formats = new Dictionary<string, string>
                                {
                                  ["DE"] = "NNNNNNNNN", ["IT"] = "NNNNNNNNNNN", ["FR"] = "XXNNNNNNNNN", ["NL"] = "NNNNNNNNNBNN", ["BE"] = "NNNNNNNNNN",
                                  ["PL"] = "NNNNNNNNNN", ["CZ"] = "NNNNNNNN|NNNNNNNNN|NNNNNNNNNN", ["SK"] = "NNNNNNNNNN", ["HU"] = "NNNNNNNN", ["SI"] = "NNNNNNNN",
                                  ["HR"] = "NNNNNNNNNNN", ["ES"] = "XNNNNNNNX", ["PT"] = "NNNNNNNNN", ["LU"] = "NNNNNNNN", ["DK"] = "NNNNNNNN", ["SE"] = "NNNNNNNNNNNN",
                                  ["FI"] = "NNNNNNNN", ["IE"] = "NNNNNNNA|NNNNNNNAA|NANNNNNA", ["EL"] = "NNNNNNNNN", ["GR"] = "NNNNNNNNN",
                                  ["RO"] = "NN|NNN|NNNN|NNNNN|NNNNNN|NNNNNNN|NNNNNNNN|NNNNNNNNN|NNNNNNNNNN", ["BG"] = "NNNNNNNNN|NNNNNNNNNN",
                                  ["LT"] = "NNNNNNNNN|NNNNNNNNNNNN", ["LV"] = "NNNNNNNNNNN", ["EE"] = "NNNNNNNNN", ["MT"] = "NNNNNNNN", ["CY"] = "NNNNNNNNA",
                                  ["XI"] = "NNNNNNNNN|NNNNNNNNNNNN", ["GB"] = "NNNNNNNNN|NNNNNNNNNNNN", ["CH"] = "NNNNNNNNN", ["NO"] = "NNNNNNNNN"
                                };
                                string pattern;
                                if (!formats.TryGetValue(cc, out pattern)) return "UNVERIFIED";
                                return MatchPattern(body, pattern) ? "VERIFIED" : "CONTRADICTORY";
                              }
                              // --- Run the checks.
                              var text = Norm(ocr);
                              var hasOcr = text.Trim().Length > 0;
                              var textCompact = hasOcr ? Compact(text) : "";
                              void Amount(string field, double v, bool extracted)
                              {
                                if (!extracted) return;
                                var checks = new List<string> { "verbatim" };
                                var tier = "UNVERIFIED";
                                if (hasOcr) tier = FindAny(text, AmountForms(v)) ? "VERIFIED" : "CONTRADICTORY";
                                if (docOk && totalsMismatch) { tier = "CONTRADICTORY"; checks.Add("sum"); }
                                Grade(field, tier, checks);
                              }
                              // A Double argument arrives as 0 when the path is absent, so 0 means "not extracted" here
                              // (an invoice over exactly 0.00 is not a receipt the matcher could use anyway).
                              Amount("grossTotal", gross, gross != 0);
                              Amount("netTotal", net, net != 0);
                              Amount("taxTotal", tax, tax != 0);
                              void Date(string field, string value, bool window)
                              {
                                DateTime d;
                                if (!TryDate(value, out d)) return;
                                var checks = new List<string> { "verbatim" };
                                var tier = "UNVERIFIED";
                                if (hasOcr && FindAny(text, DateForms(d))) tier = "VERIFIED";
                                if (window) { tier = "CONTRADICTORY"; checks.Add("window"); }
                                Grade(field, tier, checks);
                              }
                              Date("documentDate", docDate, docOk && !dateOk);
                              Date("dueDate", dueDate, false);
                              if (!string.IsNullOrWhiteSpace(docNo))
                              {
                                var tier = "UNVERIFIED";
                                if (hasOcr)
                                {
                                  var n = Norm(docNo).Trim();
                                  if (text.IndexOf(n, StringComparison.OrdinalIgnoreCase) >= 0) tier = "VERIFIED";
                                  else { var c = Compact(n); if (c.Length >= 4 && textCompact.IndexOf(c, StringComparison.OrdinalIgnoreCase) >= 0) tier = "VERIFIED"; }
                                }
                                Grade("documentNumber", tier, new List<string> { "verbatim" });
                              }
                              var vi = IbanTier(vendorIban); if (vi != null) Grade("vendor.iban", vi, new List<string> { "mod97" });
                              var ci = IbanTier(customerIban); if (ci != null) Grade("customer.iban", ci, new List<string> { "mod97" });
                              var vv = VatTier(vendorVat); if (vv != null) Grade("vendor.vatId", vv, new List<string> { vendorVat != null && Compact(vendorVat).ToUpperInvariant().StartsWith("AT") ? "checkdigit" : "format" });
                              var cv = VatTier(customerVat); if (cv != null) Grade("customer.vatId", cv, new List<string> { customerVat != null && Compact(customerVat).ToUpperInvariant().StartsWith("AT") ? "checkdigit" : "format" });
                              var docTier = worst < 0 ? "UNVERIFIED" : order.First(kv => kv.Value == worst).Key;
                              var report = new Dictionary<string, object> { ["v"] = 1, ["fields"] = fields };
                              if (!hasOcr) report["noOcr"] = true;
                              return new[] { docTier, JsonSerializer.Serialize(report) };
                            }
                            catch (Exception ex)
                            {
                              var msg = ex.GetType().Name + ": " + ex.Message;
                              string esc;
                              try { esc = JsonSerializer.Serialize(msg); } catch { esc = "\"check failed\""; }
                              return new[] { "UNVERIFIED", "{\"v\":1,\"fields\":{},\"error\":" + esc + "}" };
                            }
                          usings:
                            - System
                            - System.Collections.Generic
                            - System.Linq
                            - System.Globalization
                            - System.Text
                            - System.Text.Json
                          returnType: StringArray
                          timeoutMs: 10000
                          arguments:
                            - name: ocr
                              valuePath: $.full.ocr.result
                              dataType: String
                            - name: docNo
                              valuePath: $.key.documentNumber
                              dataType: String
                            - name: docDate
                              valuePath: $.key.documentDate
                              dataType: String
                            - name: dueDate
                              valuePath: $.key.dueDate
                              dataType: String
                            - name: gross
                              valuePath: $.key.grossTotal
                              dataType: Double
                            - name: net
                              valuePath: $.key.netTotal
                              dataType: Double
                            - name: tax
                              valuePath: $.key.taxTotal
                              dataType: Double
                            - name: vendorIban
                              valuePath: $.key.vendor.iban
                              dataType: String
                            - name: customerIban
                              valuePath: $.key.customer.iban
                              dataType: String
                            - name: vendorVat
                              valuePath: $.key.vendor.vatId
                              dataType: String
                            - name: customerVat
                              valuePath: $.key.customer.vatId
                              dataType: String
                            - name: totalsMismatch
                              valuePath: $.totalsMismatch
                              dataType: Boolean
                            - name: dateOk
                              valuePath: $.dateOk
                              dataType: Boolean
                            - name: docOk
                              valuePath: $.docOk
                              dataType: Boolean
                          targetPath: $.fieldChecks
                        - type: If@1
                          description: Extraction successful - create AccountingDocument
                          path: $.docOk
                          operator: Equals
                          value: true
                          valueType: Boolean
                          transformations:
                            # Normalize the AI-detected direction to a guaranteed enum name
                            # before the write: default INCOMING, promote to OUTGOING only on
                            # an exact match. Guards against a missing/variant documentType
                            # breaking the Enum attribute conversion.
                            - type: SetPrimitiveValue@1
                              description: Default document direction
                              targetPath: $.docType
                              valueType: String
                              value: INCOMING
                            - type: If@1
                              description: Our company is the issuer — outgoing invoice
                              path: $.key.documentType
                              operator: Equals
                              value: OUTGOING
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.docType
                                  valueType: String
                                  value: OUTGOING
                            # AB#5382: apply the override decided by the direction consistency
                            # check above (e-mail import, our company is the customer, the extractor
                            # said OUTGOING). Applied here so $.docType remains the single source of
                            # truth for the DocumentType write and the re-arm direction below.
                            - type: If@1
                              description: AB#5382 - direction override to INCOMING
                              path: $.dirOverride
                              operator: Equals
                              value: true
                              valueType: Boolean
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.docType
                                  valueType: String
                                  value: INCOMING
                            # AB#4542: a zero-total invoice (voucher/credit-settled, e.g.
                            # HelloFresh voucher weeks, provider credit notes) will never
                            # see a payment — create it as PAID with NoTransactionExpected
                            # instead of leaving it OPEN forever. $.noTxExpected stays
                            # absent for normal documents; an absent valuePath skips the
                            # attribute in CreateUpdateInfo.
                            - type: SetPrimitiveValue@1
                              description: New documents await a payment (default)
                              targetPath: $.docState
                              valueType: String
                              value: OPEN
                            - type: If@1
                              description: Zero gross total — voucher/credit-settled, no payment expected
                              path: $.key.grossTotal
                              operator: Equals
                              value: 0
                              valueType: Double
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.docState
                                  valueType: String
                                  value: PAID
                                - type: SetPrimitiveValue@1
                                  targetPath: $.noTxExpected
                                  valueType: Boolean
                                  value: true
                            # --- Sanitize party addresses (poison-item fix) -------------
                            # The Basic Address record has MANDATORY Street + CityTown. The
                            # AI is asked to emit an address all-or-nothing, but occasionally
                            # returns a PARTIAL address (e.g. only zipcode/countryCode); that
                            # partial object still materializes the embedded Address record,
                            # whose missing Street/CityTown then FatalError ApplyChanges and
                            # abort the ENTIRE ForEach — stranding every queued upload. Do not
                            # trust the AI's structural omission: copy each party's address
                            # into a sanitized staging path ($.san.*) ONLY when BOTH mandatory
                            # fields (street + city) are present and non-empty; otherwise the
                            # staging paths stay absent and NO Address record is materialized
                            # (the raw sender address is still kept in Comment via addressNotes).
                            - type: SetPrimitiveValue@1
                              targetPath: $.vendorAddrOk
                              valueType: Boolean
                              value: true
                            - type: If@1
                              description: Vendor street absent — no address
                              path: $.key.vendor.address.street
                              operator: Equals
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.vendorAddrOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: Vendor street empty — no address
                              path: $.key.vendor.address.street
                              operator: Equals
                              value: ""
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.vendorAddrOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: Vendor city absent — no address
                              path: $.key.vendor.address.city
                              operator: Equals
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.vendorAddrOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
                              description: Vendor city empty — no address
                              path: $.key.vendor.address.city
                              operator: Equals
                              value: ""
                              valueType: String
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.vendorAddrOk
                                  valueType: Boolean
                                  value: false
                            - type: If@1
