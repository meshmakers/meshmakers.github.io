    - id: System.UI/DashboardWidget.DataSourceCkTypeId
      value: ''
    - id: System.UI/DashboardWidget.DataSourceRtId
      value: 6a4dcf0100000000000000c4
    - id: System.UI/DashboardWidget.Config
      value: '{"columns":[],"sorting":[{"field":"documentDate","dir":"desc"}],"filters":[{"attributePath":"documentType","operator":"EQUALS","comparisonValue":"OUTGOING"},{"attributePath":"fiscalYear.meshmakersAccountingFiscalYear->rtId","operator":"EQUALS","comparisonValue":"$fy_rtId"}],"pageSize":10,"sortable":true,"queryName":"meshmakers-outgoing-invoices","queryRtId":"6a4dcf0100000000000000c4","queryFamily":"runtime"}'

  - rtId: 6a4dcf0100000000000000a3
