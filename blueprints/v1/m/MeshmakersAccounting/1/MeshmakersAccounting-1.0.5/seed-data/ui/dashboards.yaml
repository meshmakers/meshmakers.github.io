  # ============================================================================
  # Board 1 — Finance Cockpit (meshmakers-finance-cockpit)
  # ============================================================================
  - rtId: 6a4dcf0100000000000000f1
    ckTypeId: System.UI/Dashboard
    rtWellKnownName: meshmakers-finance-cockpit
    associations: []
    attributes:
    - id: System/Name
      value: Finance Cockpit
    # The blob after the ---MESHBOARD_VARIABLES--- marker carries the FiscalYear
    # entity selector (see the header note). defaultRtId = FY 2026 (seeded).
    - id: System/Description
      value: |-
        Costs vs revenue and budget overview.
        ---MESHBOARD_VARIABLES---
        {"entitySelectors":[{"id":"fy","label":"Geschäftsjahr","ckTypeId":"Meshmakers.Accounting/FiscalYear","attributeMappings":[{"attributePath":"startDate","variableName":"fyStart","attributeValueType":"DATE_TIME"},{"attributePath":"endDate","variableName":"fyEnd","attributeValueType":"DATE_TIME"}],"showInToolbar":true,"defaultRtId":"aa0000000000000000000100"}]}
    - id: System.UI/Dashboard.Columns
      value: 6
    - id: System.UI/Dashboard.RowHeight
      value: 200
    - id: System.UI/Dashboard.Gap
      value: 16

  - rtId: 6a4dcf0100000000000000a1
    ckTypeId: System.UI/DashboardWidget
    associations:
