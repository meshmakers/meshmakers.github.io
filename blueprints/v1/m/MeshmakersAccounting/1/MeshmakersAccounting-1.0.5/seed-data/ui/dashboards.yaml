    - id: System.UI/DashboardWidget.ColSpan
      value: 4
    - id: System.UI/DashboardWidget.RowSpan
      value: 2
    - id: System.UI/DashboardWidget.DataSourceType
      value: systemQuery
    - id: System.UI/DashboardWidget.DataSourceCkTypeId
      value: ''
    - id: System.UI/DashboardWidget.DataSourceRtId
      value: 6a4dcf0100000000000000c6
    # NOT_EQUALS INCOME (not EQUALS EXPENSE) so pre-1.5.0 categories with a
    # missing CategoryKind attribute stay in the expenses chart (AB#4507).
    # parent-nav filter scopes to the selected fiscal year (AB#4434).
    - id: System.UI/DashboardWidget.Config
      value: '{"chartType":"column","categoryField":"name","series":[{"field":"budgetAmount","name":"Budget"},{"field":"actualAmount","name":"Actual"}],"showLegend":true,"legendPosition":"bottom","queryName":"meshmakers-category-budget-actuals","queryRtId":"6a4dcf0100000000000000c6","queryFamily":"runtime","filters":[{"attributePath":"categoryKind","operator":"NOT_EQUALS","comparisonValue":"INCOME"},{"attributePath":"parent.meshmakersAccountingFiscalYear->rtId","operator":"EQUALS","comparisonValue":"$fy_rtId"}]}'

