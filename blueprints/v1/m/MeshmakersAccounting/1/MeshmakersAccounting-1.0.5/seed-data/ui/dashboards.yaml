    - id: System.UI/DashboardWidget.Col
      value: 1
    - id: System.UI/DashboardWidget.Row
      value: 1
    - id: System.UI/DashboardWidget.ColSpan
      value: 3
    - id: System.UI/DashboardWidget.RowSpan
      value: 2
    - id: System.UI/DashboardWidget.DataSourceType
      value: systemQuery
    - id: System.UI/DashboardWidget.DataSourceCkTypeId
      value: ''
    - id: System.UI/DashboardWidget.DataSourceRtId
      value: 6a4dcf0100000000000000c3
    - id: System.UI/DashboardWidget.Config
      value: '{"chartType":"donut","categoryField":"documenttype","valueField":"nettotal_sum","showLabels":true,"showLegend":true,"legendPosition":"right","queryName":"meshmakers-nettotal-by-documenttype","queryRtId":"6a4dcf0100000000000000c3","queryFamily":"runtime","filters":[{"attributePath":"fiscalYear.meshmakersAccountingFiscalYear->rtId","operator":"EQUALS","comparisonValue":"$fy_rtId"}]}'

