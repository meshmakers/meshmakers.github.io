                      transformations:
                        - type: ExecuteCSharp@1
                          description: Vendor row as JSON (merged + CSV-encoded later in one pass over all docs)
                          code: 'Func<object,string> S = o => { if (o == null) return ""; if (o is System.Text.Json.JsonElement e) { if (e.ValueKind == System.Text.Json.JsonValueKind.String) return e.GetString() ?? ""; if (e.ValueKind == System.Text.Json.JsonValueKind.Null || e.ValueKind == System.Text.Json.JsonValueKind.Undefined) return ""; return e.ToString(); } return o.ToString() ?? ""; }; var nm = S(name).Trim(); if (string.IsNullOrWhiteSpace(nm)) return null; return System.Text.Json.JsonSerializer.Serialize(new string[] { nm, S(uid).Trim(), S(iban).Trim(), S(accountName).Trim(), S(street).Trim(), S(zip).Trim(), S(city).Trim(), S(country).Trim() });'
                          returnType: String
                          arguments:
                            - name: name
                              valuePath: $.key.Attributes.Vendor.Attributes.CompanyName
                              dataType: Record
                            - name: uid
                              valuePath: $.key.Attributes.Vendor.Attributes.TaxIdentificationNumber
                              dataType: Record
                            - name: iban
                              valuePath: $.key.Attributes.Vendor.Attributes.IBAN
                              dataType: Record
