$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
  - Meshmakers.Accounting-[3.1.0,4.0)
  - System.Communication-[4.5,5.0)
  - System.Files-[1.0,2.0)
  - System.Identity-[3.0,4.0)
  - System.UI-[2.2,3.0)
entities:
  # --- Pipeline: attach-document-file ---
  # Attaches an original PDF to an EXISTING AccountingDocument that has no stored
  # file yet (a manually created document, or one whose analysis produced no file
  # link). POST /attachDocumentFile as multipart/form-data with the PDF as `file`
  # and the target document's rtId in the `documentRtId` form field. Stores the
  # PDF as a FileSystemItem under the Documents root and links it to the document
  # via System/Related — the same association the analysis pipeline creates and
  # the frontend resolves for the preview — and stamps FileHash for consistency, but
  # only on a document that has no FileHash yet (AB#5780: the hash names the ORIGINAL;
  # an additional PDF attached to a document that already has one never replaces it).
  - rtId: 67d4a2f0b2e4d8c3a1f000fa
    ckTypeId: System.Communication/DataFlow
    attributes:
      - id: System/Name
        value: Attach Document File
      - id: System/Description
        value: Attaches an original PDF to an existing accounting document that has no stored file
  - rtId: 67d4a2f0b2e4d8c3a1f000fb
    ckTypeId: System.Communication/Pipeline
    associations:
      # AB#7800: runs as the blueprint pipeline identity (ServiceAccountConfig, AccountingManagement) instead of
      # the adapter account octo-pipeline-sa-*; a pipeline is redeployed for a Uses edge to take effect.
      - roleId: System.Communication/Uses
        targetRtId: 67f0c00ec4ff02221e0b7002
        targetCkTypeId: System.Communication/ServiceAccountConfiguration
      - roleId: System/ParentChild
        targetRtId: 67d4a2f0b2e4d8c3a1f000fa
        targetCkTypeId: System.Communication/DataFlow
      - roleId: System.Communication/Executes
        targetRtId: "670000000000000000000002"
        targetCkTypeId: System.Communication/Adapter
    attributes:
      - id: System.Communication/DeploymentState
        value: 0
      - id: System/Name
        value: Attach Document File Pipeline
      - id: System/Enabled
        value: true
      - id: System.Communication/PipelineDefinition
        value: |-
          triggers:
            - type: FromHttpRequest@2
              path: /attachDocumentFile
              method: POST
              allowAnonymous: false
              requiredRoles:
                - AccountingManagement
                - AccountingEmployee
          transformations:
            # AB#8964 write gate. The route admits AccountingManagement AND AccountingEmployee,
            # and the document data policies (aa..322/323) ship in AuditOnly, so nothing on the
            # platform stops an employee from attaching to a document that is not theirs. The
            # verified caller of FromHttpRequest@2 (bearer) is checked here BEFORE anything is
            # stored: management may attach to any document of the tenant, an employee only to a
            # document whose OwnerUserId is their own subject (the owned-only rule of aa..323).
            # Unknown rtId, a document of another tenant, an ownerless document for an employee
            # and a foreign document all get the SAME answer (statusCode 403, no existence leak),
            # and no file, hash or link is written. Tested by scripts/attach_document_file_auth_test.py.
            - type: WriteVerifiedCaller@1
              description: AB#8964 caller identity for the write gate
              targetPath: $.caller
            - type: SetPrimitiveValue@1
              description: Deny unless the gate below allows
              targetPath: $.gate
              value: "DENY"
              valueType: String
            - type: If@1
              description: Only a well-formed rtId is looked up
              path: $.formData.documentRtId
              operator: RegexMatch
              value: '^[0-9a-f]{24}$'
              valueType: String
              transformations:
                - type: SetPrimitiveValue@1
                  description: Target rtId as a single-element array
                  targetPath: $.gateDocIds
                  valuePath: $.formData.documentRtId
                  valueType: String
                  targetValueKind: Array
                - type: GetRtEntitiesById@1
                  description: Load the target document as the caller (owner for the gate)
                  ckTypeId: Meshmakers.Accounting/AccountingDocument
                  rtIdsPath: $.gateDocIds
                  targetPath: $.gateDoc
                - type: ExecuteCSharp@1
                  description: AB#8964 attach write gate
                  usings:
                    - System
                    - System.Linq
                  returnType: String
                  arguments:
                    - name: requested
                      valuePath: $.formData.documentRtId
                      dataType: String
                    - name: foundRtId
                      valuePath: $.gateDoc.Items[0].RtId
                      dataType: String
                    - name: owner
                      valuePath: $.gateDoc.Items[0].Attributes.OwnerUserId
                      dataType: String
                    - name: subject
                      valuePath: $.caller.subjectId
                      dataType: String
                    - name: roles
                      valuePath: $.caller.roles
                      dataType: StringArray
                  targetPath: $.gate
                  code: |
                    if (string.IsNullOrWhiteSpace(subject)) return "DENY";
                    if (string.IsNullOrWhiteSpace(requested) || string.IsNullOrWhiteSpace(foundRtId)) return "DENY";
                    if (!string.Equals(requested.Trim(), foundRtId.Trim(), StringComparison.OrdinalIgnoreCase)) return "DENY";
                    var r = roles ?? new string[0];
                    if (r.Contains("AccountingManagement")) return "ALLOW";
                    if (r.Contains("AccountingEmployee") && !string.IsNullOrWhiteSpace(owner)
                        && string.Equals(owner.Trim(), subject.Trim(), StringComparison.Ordinal)) return "ALLOW";
                    return "DENY";
            - type: If@1
              description: Gate denied - 403, nothing stored
              path: $.gate
              operator: NotEquals
              value: "ALLOW"
              valueType: String
              transformations:
                - type: SetPrimitiveValue@1
                  targetPath: $.statusCode
                  value: 403
                  valueType: Int
                - type: SetPrimitiveValue@1
                  targetPath: $._resultType
                  value: "error"
                  valueType: String
                - type: SetPrimitiveValue@1
                  targetPath: $._errorMessage
                  value: "You are not allowed to attach a file to this document."
                  valueType: String
            - type: If@1
              description: Gate allowed - store and link the file
              path: $.gate
              operator: Equals
              value: "ALLOW"
              valueType: String
              transformations:
                - type: If@1
                  description: Only accept PDF files
                  path: $.files[0].contentType
                  operator: Equals
                  value: "application/pdf"
                  valueType: String
                  transformations:
                    - type: If@1
                      description: Reject files above the 10 MB limit with a speaking error
                      path: $.files[0].length
                      operator: GreaterThan
                      value: 10000000
                      valueType: Int64
                      transformations:
                        - type: SetPrimitiveValue@1
                          targetPath: $._resultType
                          value: "error"
                          valueType: String
                        - type: SetPrimitiveValue@1
                          targetPath: $._errorMessage
                          value: "File too large (max 10 MB). Please reduce the file size."
                          valueType: String
                    - type: If@1
                      description: Within the size limit - store the file and link it
                      path: $.files[0].length
                      operator: LessEqualsThan
                      value: 10000000
                      valueType: Int64
                      transformations:
                        - type: ComputeFileHash@1
                          description: Compute SHA-256 hash of the file
                          path: $.files[0].data
                          targetPath: $.fileHash
                        - type: CreateFileSystemUpdate@1
                          description: Store the PDF in the file system
                          targetPath: $.fileSystemItem
                          path: $.files[0].data
                          generateRtId: true
                          fileNamePath: $.files[0].fileName
                          contentType: application/pdf
                          contentLengthPath: $.files[0].length
                          rootFolderWellKnownName: "Documents"
                        # AB#5780: FileHash is the intake hash of the document's ORIGINAL and the
                        # reference of "Verify original". It is stamped only when the document has
                        # none yet - an amendment attached later ("attach another PDF", AB#4874)
                        # used to OVERWRITE it, after which the original no longer verified.
                        - type: WriteJson@1
                          description: No entity update unless the document lacks a hash
                          targetPath: $.updates._items
                          jsonString: '[]'
                        - type: FormatString@1
                          description: Document rtId as a single-element JSON array
                          format: '["{$.formData.documentRtId}"]'
                          targetPath: $.docIdJson
                        - type: WriteJson@1
                          jsonStringPath: $.docIdJson
                          targetPath: $.docIdArr
                        - type: GetRtEntitiesById@1
                          description: Load the target document (existing FileHash)
                          ckTypeId: Meshmakers.Accounting/AccountingDocument
                          rtIdsPath: $.docIdArr
                          targetPath: $.targetDoc
                        - type: SetPrimitiveValue@1
                          description: No existing hash unless the document carries one
                          targetPath: $.existingHash
                          value: ""
                          valueType: String
                        - type: SelectByPath@1
                          description: Existing intake hash of the document, when present
                          selectPath:
                            - path: $.targetDoc.Items[0].Attributes.FileHash
                              targetPath: $.existingHash
                        - type: If@1
                          description: Only a document without a hash takes this file's hash
                          path: $.existingHash
                          operator: Equals
                          value: ""
                          valueType: String
                          transformations:
                            - type: CreateUpdateInfo@1
                              description: Stamp the file hash on the existing document
                              targetPath: $.updates._items
                              targetValueKind: Array
                              targetValueWriteMode: Overwrite
                              updateKind: Update
                              ckTypeId: Meshmakers.Accounting/AccountingDocument
                              rtIdPath: $.formData.documentRtId
                              attributeUpdates:
                                - attributeName: FileHash
                                  attributeValueType: String
                                  valuePath: $.fileHash
                        - type: CreateAssociationUpdate@1
                          description: Link the document to the stored file
                          targetPath: $.updates._assocItems
                          targetValueKind: Array
                          targetValueWriteMode: Overwrite
                          updateKind: Create
                          originRtIdPath: $.formData.documentRtId
                          originCkTypeId: Meshmakers.Accounting/AccountingDocument
                          targetRtIdPath: $.fileSystemItem.RtId
                          targetCkTypeIdPath: $.fileSystemItem.CkTypeId
                          associationRoleId: System/Related
                        - type: ApplyChanges@2
                          entityUpdatesPath: $.updates._items
                          associationUpdatesPath: $.updates._assocItems
                        - type: SetPrimitiveValue@1
                          targetPath: $._resultType
                          value: "attached"
                          valueType: String
            - type: Project@1
              clear: true
              fields:
                - path: $._resultType
                  inclusion: true
                - path: $._errorMessage
                  inclusion: true
                - path: $.statusCode
                  inclusion: true
      - id: System.Communication/StatusMessage
