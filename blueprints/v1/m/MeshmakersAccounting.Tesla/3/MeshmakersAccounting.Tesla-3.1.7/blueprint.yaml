$schema: https://schemas.meshmakers.cloud/blueprint-meta.schema.json
blueprintId: MeshmakersAccounting.Tesla-3.1.7
description: |
  Tesla Supercharger invoice fetcher add-on for the Meshmakers Accounting app
  (AB#4678). Periodically pulls charging invoices from the Tesla Fleet API and
  stages them in the accounting inbox as UploadedDocument entities
  (ProcessingState NEW, SourceChannel API) — the existing analysis pipeline
  picks them up like any uploaded or e-mailed document; the SHA-256 hash dedup
  makes re-polls idempotent.

  Installs:
  - the Meshmakers.Accounting.Tesla construction kit model (TeslaConfiguration)
  - the TeslaConfiguration entity (EMPTY ClientSecret / RefreshToken since
    1.12.3, AB#5929 — never placeholders; placeholder ClientId)
  - the "Tesla Charging Invoices" DataFlow with the fetcher pipeline
    (cron via PipelineTrigger, daily 05:30, plus manual ExecutePipeline)

  REQUIRES an installed MeshmakersAccounting base blueprint (declared via
  blueprintDependencies) — the fetcher stages into the base app's inbox
  (Meshmakers.Accounting/UploadedDocument, Documents root folder).

  Tesla prerequisites (one-time):
  - Tesla developer app (developer.tesla.com) with OAuth grant types
    Authorization Code + Machine-to-Machine and the "Vehicle Charging
    Management" scope; partner registration needs a domain hosting the public
    key at /.well-known/appspecific/com.tesla.3p.public-key.pem
  - a refresh token generated once via the localhost OAuth callback

  Post-install:
  - Set ClientId/ClientSecret/RefreshToken on the TeslaConfiguration entity —
    from the app (Settings -> Add-ons -> Tesla, AB#5035) or via
    scripts/om_set_secrets.ps1 (tesla section). Since 1.1.0 the config
    attributes are isRuntimeState, so a blueprint re-apply/update PRESERVES
    operator values (they are no longer reset to placeholders).
  - Since 2.3.0 (Meshmakers.Accounting.Tesla 1.4.0, AB#5929) ClientSecret and
    RefreshToken are SECRET attributes: write-only, stored encrypted, reads
    only report whether they are set; Secret ownership keeps them on every
    re-apply. The fetcher reads the CURRENT refresh token with RevealSecret@1
    (identity ServiceAccount) instead of the deploy-time configuration
    snapshot. REQUIRES a mesh adapter with RevealSecret@1 and the key ring
    (platform release 3.5.18+). After installing 2.3.0, REDEPLOY the "Tesla
    Charging Invoices" DataFlow right away.
  - DeployDataFlow "Tesla Charging Invoices" + DeployTriggers (cron) — the
    app's Tesla add-on card does both on "Activate".
  - NOTE: Tesla rotates refresh tokens; the pipeline persists the newest token
    back to TeslaConfiguration on every run. isRuntimeState keeps that newest
    token across a re-apply, so it is no longer lost — but a manual
    om_set_secrets run still overwrites it with the secrets.local.json value.
# The blueprint engine installs each dependency's range FLOOR as the exact
# version, and transitive CK dependencies are NOT resolved on install — list
# everything explicitly, install order = list order (same rules as the base
# blueprint).
#
# AB#5044: every floor an add-on SHARES with the base blueprint must be >= the
# base's floor, and `scripts/check_blueprint_floors.ps1` fails the build if it
# is not. Two reasons, only one of which is about downgrades:
#   * A stale floor names a version that may no longer be published. The engine
#     installs the FLOOR AS AN EXACT VERSION (it does not resolve the highest
#     match in the range), so on a fresh tenant an unpublished floor fails the
#     install outright with "model not found in one of the registered catalogs".
#   * A stale floor does NOT roll a newer installed model back — the engine
#     skips the import when an installed version already satisfies the request
#     and keeps the installed version in the migration history (AB#5042). That
#     guard is what makes this a hygiene rule rather than a live hazard, and it
#     is the engine's promise, not this file's: do not rely on it to excuse a
#     floor that drifts far enough to leave the range and turn into a hard
#     seed-import error.
# The base app model floor must also carry what THIS blueprint's seed data
# needs: the API enum value on DocumentSource (since 1.17.0).
ckModelDependencies:
# AB#5929: 2.3.0 ships the SECRET Tesla model and RevealSecret@1 - both need the System 2.5
# generation (SECRET value type) on the target.
- System-[2.5,)
- System.Bot-[3.0,4.0)
- System.Communication-[4.5,5.0)
- System.Files-[1.0,2.0)
# AB#5528: System 2.5 generation - the floor is the EXACT version a fresh tenant installs,
# so it must name the library built against System 2.5.0 (not the 2.4-pinned 2.2.0).
- Basic-[2.5.0,3.0)
# AB#5390: raised with the base blueprint (ExclusionReason on BankTransaction).
# AB#5528: 1.9.0 = System 2.5 generation of Basic.Accounting.
# AB#7617: Basic.Accounting floor follows the base blueprint (1.11.0, check_blueprint_floors.ps1).
- Basic.Accounting-[1.11.0,2.0)
# AB#5347, AB#5388, AB#5389, AB#5394, AB#5402, AB#5403: raised with the base blueprint. An
# add-on floor below the base's fails scripts/check_blueprint_floors.ps1, and a range that no
# longer contains the model version the base installs (as [1.31.0,2.0) once did) breaks
# a fresh install. 3.0.0 (AB#5403) removed the flat TaxRate attributes, so the ceiling moved
# to 4.0 together with the floor - exactly the [2.7.0,3.0) trap this comment warns about.
# This add-on never touched TaxRate (it only stages UploadedDocuments), nothing else changes.
# AB#7087: floor follows the base blueprint (3.6.0, check_blueprint_floors.ps1).
# AB#7404: floor follows the base blueprint (3.7.0, check_blueprint_floors.ps1).
# AB#7452: floor follows the base blueprint (3.8.0, check_blueprint_floors.ps1).
# AB#7457: floor follows the base blueprint (3.9.0, check_blueprint_floors.ps1).
# AB#7512: floor follows the base blueprint (3.10.0, check_blueprint_floors.ps1).
# AB#7550: floor follows the base blueprint (3.11.0, check_blueprint_floors.ps1).
# AB#7715: floor follows the base blueprint (3.12.0, check_blueprint_floors.ps1).
# AB#7717: floor follows the base blueprint (3.13.0, check_blueprint_floors.ps1).
- Meshmakers.Accounting-[3.13.0,4.0)
# AB#5929: 1.4.0 = ClientSecret / RefreshToken as SECRET attributes. MUST ship together
# with the RevealSecret@1 fetcher below (RevealSecret refuses a non-Secret attribute, and the
# old SetPrimitiveValue read would see only the { isSet } marker of a Secret).
# AB#7404: 1.6.0 is the v3 (range-retaining) re-publish of the Tesla model (no content change).
- Meshmakers.Accounting.Tesla-[1.6.0,2.0)
blueprintDependencies:
- MeshmakersAccounting-[1.0.0,)
# The seed is split per feature (AB#4758), same layout as the base blueprint: every listed
# file is loaded and merged into a single runtime model before the import. Add a new file
# here when you create one - `octo-bpm validate` warns about YAML under seed-data/ that
# nothing references.
seedDataPaths:

  # The Tesla account configuration (credentials are filled per tenant, never seeded)
  - seed-data/configurations/tesla.yaml

  # One file per data flow: the DataFlow plus its pipelines and triggers
  - seed-data/data-flows/tesla-charging-invoices.yaml
