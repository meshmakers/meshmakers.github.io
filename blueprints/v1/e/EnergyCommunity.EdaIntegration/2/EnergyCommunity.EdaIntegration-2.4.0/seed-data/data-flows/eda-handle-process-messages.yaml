# handle-cm-rev-sp — pipeline inside DataFlow eda-handle-process-messages (AB#4820)
- rtId: 691b2c5e0a44e3fea8b15462
  rtCreationDateTime: 2025-11-17T14:08:30.3780000Z
  rtChangedDateTime: 2026-03-13T06:32:54.1360000Z
  ckTypeId: System.Communication/Pipeline-1
  associations:
  - roleId: System/ParentChild-1
    targetRtId: 6a3ba517dd34215646b7a8a4
    targetCkTypeId: System.Communication/DataFlow-1
    attributes: []
  - roleId: System.Communication/Executes-1
    targetRtId: '686e0f17196fcd3c42ed8c77'
    targetCkTypeId: System.Communication/Adapter-1
    attributes: []
  attributes:
  - id: System.Communication/DeploymentState-1
    value: 0
  - id: System/Name-1
    value: handle-cm-rev-sp
  - id: System/Description-1
    value: Handle all messages for process CM_REV_SP
  - id: System.Communication/StatusMessage-1
  - id: System/Enabled-1
    value: true
  - id: System.Communication/PipelineDefinition-1
    value: |-
      triggers:
        # - type: FromExecutePipelineCommand@1
        - type: FromPolling@1
          interval: 00:03:35
      transformations:
        - type: GetQueryById@1
          targetPath: $.query
          queryRtId: 691b2b2a0a44e3fea8b15460

        - type: If@1
          description: Messages available
          path: $.query.Rows[0].RtId
          operator: NotEqual
          value: null
          valueType: string
          transformations:
            - type: ForEach@1
              description: Parse EDA messages
              iterationPath: $.query.Rows
              mergePath: $.EdaMessage
              targetPath: $.EdaMessages
              transformations:
                - type: EdaParseMessage@1
                  messageRtIdPath: $.key.RtId
                  messageTypePath: $.key.Values[0]
                  processRtIdPath: $.key.Values[1]
                  rawMessagePath: $.key.Values[2]
                  targetPath: $.EdaMessage

            - type: Project@1
              fields:
                - path: $.query

            # START general message and process handling

            - type: ExtractProcesses@1
              path: $.EdaMessages
              targetPath: $.EdaProcesses

            - type: ForEach@1
              description: EDA messages
              iterationPath: $.EdaMessages
              mergePath: $.Updates
              targetPath: $.updates
              transformations:
                # Update messags to processed
                - type: CreateUpdateInfo@1
                  targetPath: $.Updates.UpdateMessage
                  updateKind: UPDATE
                  ckTypeId: Basic.Energy/EdaMessage
                  rtIdPath: $.key.MessageRtId
                  attributeUpdates:
                    - attributeName: Processed
                      attributeValueType: Boolean
                      value: true

            - type: ForEach@1
              description: EDA processes
              iterationPath: $.EdaProcesses
              mergePath: $.Updates
              targetPath: $.updates
              targetValueWriteMode: Append
              transformations:
                - type: CreateUpdateInfo@1
                  targetPath: $.Updates.UpdateProcess
                  updateKind: UPDATE
                  ckTypeId: Basic.Energy/EdaProcess
                  rtIdPath: $.key.ProcessRtId
                  attributeUpdates:
                    - attributeName: Finished
                      attributeValueType: Boolean
                      valuePath: $.key.FinishProcess
                    - attributeName: Success
                      attributeValueType: Boolean
                      valuePath: $.key.IsSuccessfulProcess
                    - attributeName: Info
                      attributeValueType: String
                      valuePath: $.key.ResponseInfo
                    - attributeName: ResponseCode
                      attributeValueType: String
                      valuePath: $.key.ResponseCode

            - type: Flatten@1
              description: Update processes
              path: $.updates[*].UpdateProcess
              targetPath: $.Result
            - type: Flatten@1
              description: Update messages
              path: $.updates[*].UpdateMessage
              targetPath: $.Result
              targetValueWriteMode: Append

            # END general message and process handling

            - type: Project@1
              fields:
                - path: $.updates
                - path: $.EdaMessages
                - path: $.EdaProcesses

            - type: ApplyChanges@2
              entityUpdatesPath: $.Result
