      path: $.EdaMessages[*]\n            keyPath: $.MeteringPointNumber\n            joinPath: $.MeteringPoints.Items[*]\n            joinKeyPath: $.Attributes.MeteringPointNumber\n            itemPath: $.MeteringPoint\n\n      - type: Project@1\n        fields:\n          - path: $.MeteringPoints\n          - path: $.MeteringPointNumbers\n\n      # Process messages\n      - type: ForEach@1\n        description: EDA messages\n        iterationPath: $.EdaMessages\n        mergePath: $.Updates\n        targetPath: $.updates\n        transformations:\n          - type: If@1\n            description: Metering point\n            path: $.key.MeteringPoint[0].RtId\n            operator: NotEqual\n            value: null\n            valueType: String\n            transformations:\n              # Update messags to processed\n              - type: CreateUpdateInfo@1\n                targetPath: $.Updates.UpdateMessage\n                updateKind: UPDATE\n                ckTypeId: Basic.Energy/EdaMessage\n                rtIdPath: $.key.MessageRtId\n                attributeUpdates:\n                  - attributeName: Processed\n                    attributeValueType: Boolean\n                    value: true\n              # Update metering point\n              - type: CreateUpdateInfo@1\n                targetPath: $.Updates.MeteringPoint\n                updateKind: UPDATE\n                ckTypeIdPath: $.key.MeteringPoint[0].CkTypeId.SemanticVersionedFullName\n                rtIdPath: $.key.MeteringPoint[0].RtId\n                attributeUpdates:\n                  - attributeName: State\n                    attributeValueType: Enum\n                    value: Inactive\n\n      - type: Flatten@1\n        description: Update messages\n        path: $.updates[*].UpdateMessage\n        targetPath: $.Result\n      \n      - type: Flatten@1\n        description: Update metering points\n        path: $.updates[*].MeteringPoint\n        targetPath: $.MeteringPoints\n      \n  