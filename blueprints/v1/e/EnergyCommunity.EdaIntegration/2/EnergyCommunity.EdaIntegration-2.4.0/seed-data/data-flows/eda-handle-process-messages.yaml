  - id: System.Communication/StatusMessage-1
  - id: System/Enabled-1
    value: true
  - id: System.Communication/PipelineDefinition-1
    value: "triggers:\r\n  # - type: FromExecutePipelineCommand@1\r\n  - type: FromPolling@1\r\n    interval: 00:04:20\r\ntransformations:\r\n  - type: GetRtEntitiesByType@1\r\n    description: Load all not processed EDA messages\r\n    ckTypeId: Basic.Energy/EdaMessage\r\n    targetPath: $.InputMessages\r\n    fieldFilters:\r\n      - attributePath: Processed\r\n        operator: Equals\r\n        comparisonValue: false\r\n      - attributePath: MessageType\r\n        operator: Equals\r\n        comparisonValue: AUFHEBUNG_CCMC\r\n\r\n  - type: If@1\r\n    description: Messages available\r\n    path: $.InputMessages.TotalCount\r\n    operator: GreaterThan\r\n    value: 0\r\n    valueType: Int\r\n    transformations:\r\n      - type: ForEach@1\r\n        description: Parse EDA messages\r\n        iterationPath: $.InputMessages.Items\r\n        mergePath: $.EdaMessage\r\n        targetPath: $.EdaMessages\r\n        transformations:\r\n          - type: EdaParseMessage@1\r\n            messageRtIdPath: $.key.RtId\r\n            messageTypePath: $.key.Attributes.MessageType\r\n            rawMessagePath: $.key.Attributes.RawMessage\r\n            targetPath: $.EdaMessage\r\n\r\n      # Load metering points to EdaMessages\r\n      - type: Flatten@1\r\n        description: Metering points\r\n        path: $.EdaMessages[*].MeteringPointNumber\r\n        targetPath: $.MeteringPointNumbers\r\n\r\n      - type: Project@1\r\n        fields:\r\n          - path: $.InputMessages\r\n\r\n      - type: GetRtEntitiesByType@1\r\n        description: Load metering points\r\n        ckTypeId: Basic.Energy/MeteringPoint\r\n        targetPath: $.MeteringPoints\r\n        fieldFilters:\r\n          - attributePath: MeteringPointNumber\r\n            operator: IN\r\n            comparisonValuePath: $.MeteringPointNumbers\r\n\r\n      - type: If@1\r\n        description: Metering points\r\n        path: $.MeteringPoints.TotalCount\r\n        operator: GreaterThan\r\n        value: 0\r\n        valueType: Int\r\n        transformations:\r\n          - type: Join@1\r\n            description: Metering points\r\n            path: $.EdaMessages[*]\r\n            keyPath: $.MeteringPointNumber\r\n            joinPath: $.MeteringPoints.Items[*]\r\n            joinKeyPath: $.Attributes.MeteringPointNumber\r\n            itemPath: $.MeteringPoint\r\n\r\n      - type: Project@1\r\n        fields:\r\n          - path: $.MeteringPoints\r\n          - path: $.MeteringPointNumbers\r\n\r\n      # Process messages\r\n      - type: ForEach@1\r\n        description: EDA messages\r\n        iterationPath: $.EdaMessages\r\n        mergePath: $.Updates\r\n        targetPath: $.updates\r\n        transformations:\r\n          - type: If@1\r\n            description: Metering point\r\n            path: $.key.MeteringPoint[0].RtId\r\n            operator: NotEqual\r\n            value: null\r\n            valueType: String\r\n            transformations:\r\n              # Update messags to processed\r\n              - type: CreateUpdateInfo@1\r\n                targetPath: $.Updates.UpdateMessage\r\n                updateKind: UPDATE\r\n                ckTypeId: Basic.Energy/EdaMessage\r\n                rtIdPath: $.key.MessageRtId\r\n                attributeUpdates:\r\n                  - attributeName: Processed\r\n                    attributeValueType: Boolean\r\n                    value: true\r\n              # Update metering point\r\n              - type: CreateUpdateInfo@1\r\n                targetPath: $.Updates.MeteringPoint\r\n                updateKind: UPDATE\r\n                ckTypeIdPath: $.key.MeteringPoint[0].CkTypeId.SemanticVersionedFullName\r\n                rtIdPath: $.key.MeteringPoint[0].RtId\r\n                attributeUpdates:\r\n                  - attributeName: State\r\n                    attributeValueType: Enum\r\n                    value: Inactive\r\n\r\n      - type: Flatten@1\r\n        description: Update messages\r\n        path: $.updates[*].UpdateMessage\r\n        targetPath: $.Result\r\n\r\n      - type: Flatten@1\r\n        description: Update metering points\r\n        path: $.updates[*].MeteringPoint\r\n        targetPath: $.MeteringPoints\r\n\r\n      - type: Project@1\r\n        fields:\r\n          - path: $.updates\r\n          - path: $.EdaMessages\r\n      \r\n      \r\n      # Apply Changes\r\n      - type: ApplyChanges@2\r\n        description: Update meteringpoints\r\n        entityUpdatesPath: $.MeteringPoints\r\n\r\n      - type: ApplyChanges@2\r\n        description: Update messages\r\n        entityUpdatesPath: $.Result"

