  - id: System.Communication/PipelineDefinition-1
    value: "triggers:\n  # - type: FromExecutePipelineCommand@1\n  - type: FromPolling@1\n    interval: 00:03:10\ntransformations:\n  - type: GetQueryById@1\n    targetPath: $.query\n    queryRtId: 6888fae9893700047f54cc3b\n\n  - type: If@1\n    description: Messages\n    path: $.query.Rows[0].RtId\n    operator: NotEqual\n    value: null\n    valueType: string\n    transformations:\n      - type: ForEach@1\n        description: Parse all all EDA messages\n        iterationPath: $.query.Rows\n        mergePath: $.EdaMessage\n        targetPath: $.EdaMessages\n        transformations:\n          - type: EdaParseMessage@1\n            messageRtIdPath: $.key.RtId\n            messageTypePath: $.key.Values[0]\n            processRtIdPath: $.key.Values[1]\n            rawMessagePath: $.key.Values[2]\n            targetPath: $.EdaMessage\n\n      - type: Flatten@1\n        path: $.EdaMessages[*].MeteringPoints[*]\n        targetPath: $.MeteringPoints\n\n      - type: Project@1\n        fields:\n          - path: $.query\n\n      - type: Flatten@1\n        path: $.MeteringPoints[*].MeteringPointNumber\n        targetPath: $.MeteringPointNumbers\n\n      - type: GetRtEntitiesByType@1\n        description: Load metering points\n        ckTypeId: EnergyCommunity/Producer\n        targetPath: $.Producer\n        fieldFilters:\n          - attributePath: MeteringPointNumber\n            operator: IN\n            comparisonValuePath: $.MeteringPointNumbers\n      - type: GetRtEntitiesByType@1\n        description: Load metering points\n        ckTypeId: EnergyCommunity/Consumer\n        targetPath: $.Consumer\n        fieldFilters:\n          - attributePath: MeteringPointNumber\n            operator: IN\n            comparisonValuePath: $.MeteringPointNumbers\n\n      - type: If@1\n        description: Producers\n        path: $.Producer.TotalCount\n        operator: GreaterThan\n        value: 0\n        valueType: Int\n        transformations:\n          # Join metering data from DB with metering data from message\n          - type: Join@1\n            path: $.MeteringPoints[*]\n            keyPath: $.MeteringPointNumber\n            joinPath: $.Producer.Items[*]\n            joinKeyPath: $.Attributes.MeteringPointNumber\n            itemPath: $.Producer\n      - type: If@1\n        description: Consumers\n        path: $.Consumer.TotalCount\n        operator: GreaterThan\n        value: 0\n        valueType: Int\n        transformations:\n          # Join metering data from DB with metering data from message\n          - type: Join@1\n            path: $.MeteringPoints[*]\n            keyPath: $.MeteringPointNumber\n            joinPath: $.Consumer.Items[*]\n            joinKeyPath: $.Attributes.MeteringPointNumber\n            itemPath: $.Consumer\n\n      - type: Project@1\n        fields:\n          - path: $.MeteringPointNumbers\n          - path: $.Consumer\n          - path: $.Producer\n\n      - type: ForEach@1\n        description: Do all metering points\n        iterationPath: $.MeteringPoints\n        mergePath: $.Updates\n        targetPath: $.updates\n        transformations:\n          - type: CreateMeteringPointUpdate@1\n            path: $.key\n            consumerPath: $.key.Consumer[0]\n            producerPath: $.key.Producer[0]\n            targetPath: $.Updates.UpdateMeteringPoints\n\n      - type: Flatten@1\n        path: $.updates[*].UpdateMeteringPoints[*]\n        targetPath: $.UpdateMeteringPoints\n\n      - type: Project@1\n        fields:\n          - path: $.updates\n          - path: $.MeteringPoints\n\n      # New metering points\n      - type: ForEach@1\n        description: Meteringpoint updates\n        iterationPath: $.UpdateMeteringPoints\n        mergePath: $.Updates\n        targetPath: $.updates\n        transformations:\n          - type: DataMapping@1\n            path: $.key.Direction\n            targetPath: $.key.ckType\n            sourceValueType: Int\n            targetValueType: String\n            mappings:\n              - sourceValue: 1\n                targetValue: EnergyCommunity/Consumer\n              - sourceValue: 2\n                targetValue: EnergyCommunity/Producer\n          - type: DataMapping@1\n            path: $.key.IsActive\n            targetPath: $.key.State\n            sourceValueType: Boolean\n            targetValueType: Int\n            mappings:\n              - sourceValue: true\n                targetValue: 1\n              - sourceValue: false\n                targetValue: 2\n          - type: DataMapping@1\n            path: $.key.Direction\n            targetPath: $.key.IsProducer\n            sourceValueType: Int\n            targetValueType: Boolean\n            mappings:\n              - sourceValue: 1\n                targetValue: false\n              - sourceValue: 2\n                targetValue: true\n\n          # Update metering points\n          - type: If@1\n            description: Existing metering point\n            path: $.key.RtId\n            operator: NotEquals\n            value: null\n            valueType: String\n            transformations:\n              - type: If@1\n                description: Consumer\n                path: $.key.Direction\n                operator: Equals\n                value: 1\n                valueType: Int\n                transformations:\n                  - type: CreateUpdateInfo@1\n                    targetPath: $.Updates.UpdateMeteringPoint\n                    updateKind: UPDATE\n                    ckTypeIdPath: $.key.ckType\n                    rtIdPath: $.key.RtId\n                    attributeUpdates:\n                      - attributeName: PartitionFactor\n                        attributeValueType: Int\n                        valuePath: $.key.ParticipationFactor\n                      - attributeName: ConsentId\n                        attributeValueType: String\n                        valuePath: $.key.ConsentId\n                      - attributeName: State\n                        attributeValueType: Enum\n                        valuePath: $.key.State\n              - type: If@1\n                description: Producer\n                path: $.key.Direction\n                operator: Equals\n                value: 2\n                valueType: Int\n                transformations:\n                  - type: CreateUpdateInfo@1\n                    targetPath: $.Updates.UpdateMeteringPoint\n                    updateKind: UPDATE\n                    ckTypeIdPath: $.key.ckType\n                    rtIdPath: $.key.RtId\n                    attributeUpdates:\n                      - attributeName: PartitionFactor\n                        attributeValueType: Int\n                        valuePath: $.key.ParticipationFactor\n                      - attributeName: ProductionType\n                        attributeValueType: Enum\n                        valuePath: $.key.ProductionType\n                      - attributeName: ConsentId\n                        attributeValueType: String\n                        valuePath: $.key.ConsentId\n                      - attributeName: State\n                        attributeValueType: Enum\n                        valuePath: $.key.State\n\n          # New metering points\n          - type: If@1\n            description: New metering point\n            path: $.key.RtId\n            operator: Equals\n            value: null\n            valueType: String\n            transformations:\n              - type: CreateUpdateInfo@1\n                targetPath: $.Updates.NewMeteringPoint\n                updateKind: INSERT\n                ckTypeId: Basic.Energy/EdaMeteringPoint\n                attributeUpdates:\n                  - attributeName: MeteringPointNumber\n                    attributeValueType: String\n                    valuePath: $.key.MeteringPointNumber\n                  - attributeName: PartitionFactor\n                    attributeValueType: Int\n                    valuePath: $.key.ParticipationFactor\n                  - attributeName: ProductionType\n                    attributeValueType: Enum\n                    value: Unknown\n                  - attributeName: IsProducer\n                    attributeValueType: Boolean\n                    valuePath: $.key.IsProducer\n                  - attributeName: ConsentId\n                    attributeValueType: String\n                    valuePath: $.key.ConsentId\n\n      - type: Project@1\n        fields:\n          - path: $.UpdateMeteringPoints\n\n      - type: ExtractProcesses@1\n        path: $.EdaMessages\n        targetPath: $.EdaProcesses\n\n      - type: ForEach@1\n        description: Do all EDA messages\n        iterationPath: $.EdaMessages\n        mergePath: $.Updates\n        targetPath: $.updates\n        targetValueWriteMode: Append\n        transformations:\n          # Update messags to processed\n          - type: CreateUpdateInfo@1\n            targetPath: $.Updates.UpdateMessage\n            updateKind: UPDATE\n            ckTypeId: Basic.Energy/EdaMessage\n            rtIdPath: $.key.MessageRtId\n            attributeUpdates:\n              - attributeName: Processed\n                attributeValueType: Boolean\n                value: true\n\n      - type: ForEach@1\n        description: Do all EDA processes\n        iterationPath: $.EdaProcesses\n        mergePath: $.Updates\n        targetPath: $.updates\n        targetValueWriteMode: Append\n        transformations:\n          - type: CreateUpdateInfo@1\n            targetPath: $.Updates.UpdateProcess\n            updateKind: UPDATE\n            ckTypeId: Basic.Energy/EdaProcess\n            rtIdPath: $.key.ProcessRtId\n            attributeUpdates:\n              - attributeName: Finished\n                attributeValueType: Boolean\n                valuePath: $.key.FinishProcess\n              - attributeName: Success\n                attributeValueType: Boolean\n                valuePath: $.key.IsSuccessfulProcess\n              - attributeName: Info\n                attributeValueType: String\n                valuePath: $.key.ResponseInfo\n              - attributeName: ResponseCode\n                attributeValueType: String\n                valuePath: $.key.ResponseCode\n\n      - type: Project@1\n        fields:\n          - path: $.EdaMessages\n          - path: $.EdaProcesses\n\n      - type: Flatten@1\n        path: $.updates[*].UpdateProcess\n        targetPath: $.Result\n      - type: Flatten@1\n        path: $.updates[*].UpdateMessage\n        targetPath: $.Result\n        targetValueWriteMode: Append\n      - type: Flatten@1\n        path: $.updates[*].NewMeteringPoint\n        targetPath: $.NewMeteringPoints\n      - type: Flatten@1\n        path: $.updates[*].UpdateMeteringPoint\n        targetPath: $.UpdateMeteringPoints\n\n      - type: Project@1\n        fields:\n          - path: $.updates\n\n      - type: ApplyChanges@2\n        entityUpdatesPath: $.NewMeteringPoints\n      \n      - type: ApplyChanges@2\n        entityUpdatesPath: $.UpdateMeteringPoints\n\n      - type: ApplyChanges@2\n        entityUpdatesPath: $.Result"

