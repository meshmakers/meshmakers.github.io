    valueType: Int\r\n        transformations:\r\n          - type: Join@1\r\n            description: Metering points\r\n            path: $.EdaMessages[*]\r\n            keyPath: $.MeteringPointNumber\r\n            joinPath: $.MeteringPoints.Items[*]\r\n            joinKeyPath: $.Attributes.MeteringPointNumber\r\n            itemPath: $.MeteringPoint\r\n\r\n      - type: Project@1\r\n        fields:\r\n          - path: $.MeteringPoints\r\n          - path: $.MeteringPointNumbers\r\n\r\n      # Process messages\r\n      - type: ForEach@1\r\n        description: EDA messages\r\n        iterationPath: $.EdaMessages\r\n        mergePath: $.Updates\r\n        targetPath: $.updates\r\n        transformations:\r\n          - type: If@1\r\n            description: Metering point\r\n            path: $.key.MeteringPoint[0].RtId\r\n            operator: NotEqual\r\n            value: null\r\n            valueType: String\r\n            transformations:\r\n              # Update messags to processed\r\n              - type: CreateUpdateInfo@1\r\n                targetPath: $.Updates.UpdateMessage\r\n                updateKind: UPDATE\r\n                ckTypeId: Basic.Energy/EdaMessage\r\n                rtIdPath: $.key.MessageRtId\r\n                attributeUpdates:\r\n                  - attributeName: Processed\r\n                    attributeValueType: Boolean\r\n                    value: true\r\n              # Update metering point\r\n              - type: CreateUpdateInfo@1\r\n                targetPath: $.Updates.MeteringPoint\r\n                updateKind: UPDATE\r\n                ckTypeIdPath: $.key.MeteringPoint[0].CkTypeId.SemanticVersionedFullName\r\n                rtIdPath: $.key.MeteringPoint[0].RtId\r\n                attributeUpdates:\r\n                  - attributeName: State\r\n                    attributeValueType: Enum\r\n                    value: Inactive\r\n\r\n      - type: Flatten@1\r\n        description: Update messages\r\n        path: $.updates[*].UpdateMessage\r\n        targetPath: $.Result\r\n\r\n      - type: Flatten@1\r\n        description: Update metering points\r\n        path: $.updates[*].MeteringPoint\r\n        targetPath: $.MeteringPoints\r\n\r\n      - type: Project@1\r\n        fields:\r\n          - path: $.updates\r\n          - path: $.EdaMessages\r\n      \r\n      \r\n      # Apply Changes\r\n      - type: ApplyChanges@2\r\n        description: Update meteringpoints\r\n        entityUpdatesPath: $.MeteringPoints\r\n\r\n      - type: ApplyChanges@2\r\n        description: Update messages\r\n        entityUpdatesPath: $.Result"

