    value: Mesh Pipeline
  - id: System.Communication/StatusMessage-1
  - id: System/Enabled-1
    value: true
  - id: System.Communication/PipelineDefinition-1
    value: "triggers:\r\n  - type: FromExecutePipelineCommand@1\r\n  # - type: FromPolling@1\r\n  #   interval: 00:10:00\r\ntransformations:\r\n  \r\n  # ------------------------------------\r\n  # Setting operating facilities states\r\n  # ------------------------------------\r\n  - type: Logger@1\r\n    description: Start for customers\r\n    message: Start for customers\r\n\r\n  - type: GetQueryById@1\r\n    description: Get all states for operating facilities\r\n    targetPath: $.query\r\n    queryRtId: 692ec1577b16a091baf944fb\r\n\r\n  # Search for different states\r\n  - type: ForEach@1\r\n    description: Search different states\r\n    iterationPath: $.query.Rows\r\n    mergePath: $.diff\r\n    targetPath: $.OperatingFacilities\r\n    transformations:\r\n      - type: If@1\r\n        description: Has different states\r\n        path: $.key.Values[0]\r\n        operator: NotEqual\r\n        valuePath: $.key.Values[2]\r\n        valueType: Enum\r\n        transformations:\r\n          - type: SetPrimitiveValue@1\r\n            targetPath: $.diff.operatingFacilityRtId\r\n            valuePath: $.key.Values[1]\r\n            valueType: String\r\n          - type: SetPrimitiveValue@1\r\n            targetPath: $.diff.currentState\r\n            valuePath: $.key.Values[2]\r\n            valueType: Int\r\n\r\n  \r\n\r\n  - type: If@1\r\n    description: Operating facilities\r\n    path: $.OperatingFacilities[0].operatingFacilityRtId\r\n    operator: NotEquals\r\n    value: null\r\n    valueType: String\r\n    transformations:\r\n      - type: Distinct@1\r\n        description: Operating facilities\r\n        path: $.OperatingFacilities\r\n        targetPath: $.OperatingFacilities\r\n        distinctValuePath: $.operatingFacilityRtId\r\n      - type: Join@1\r\n        description: Metering points\r\n        path: $.OperatingFacilities[*]\r\n        keyPath: $.operatingFacilityRtId\r\n        joinPath: $.query.Rows[*]\r\n        joinKeyPath: $.Values[1]\r\n        itemPath: $.MeteringPoints\r\n\r\n      - type: ForEach@1\r\n        description: Operating facilities\r\n        iterationPath: $.OperatingFacilities\r\n        mergePath: $.key\r\n        targetPath: $.OperatingFacilities\r\n        transformations:\r\n          - type: ForEach@1\r\n            description: Metering points\r\n            iterationPath: $.key.MeteringPoints\r\n            mergePath: $.State\r\n            targetPath: $.State\r\n            transformations:\r\n              - type: Switch@1\r\n                path: $.key.Values[0]\r\n                valueType: Int\r\n                cases:\r\n                  - value: 1\r\n                    transformations:\r\n                      - type: SetPrimitiveValue@1\r\n                        targetPath: $.State.Active\r\n                        value: \"Found\"\r\n                        valueType: String\r\n                  - value: 2\r\n                    transformations:\r\n                      - type: SetPrimitiveValue@1\r\n                        targetPath: $.State.Inactive\r\n                        value: \"Found\"\r\n                        valueType: String\r\n\r\n          - type: Flatten@1\r\n            description: Active state\r\n            path: $.State[*].Active\r\n            targetPath: $.key.State.Active\r\n          - type: Flatten@1\r\n            description: Inactive state\r\n            path: $.State[*].Inactive\r\n            targetPath: $.key.State.Inactive\r\n          - type: Project@1\r\n            description: Metering points\r\n            fields:\r\n              - path: $.key.MeteringPoints\r\n\r\n      - type: Project@1\r\n        description: Query\r\n        fields:\r\n          - path: $.query\r\n      \r\n      # Create operating facilities updates\r\n      - type: ForEach@1\r\n        description: Operating facilities\r\n        iterationPath: $.OperatingFacilities\r\n        mergePath: $.update\r\n        targetPath: $.Updates\r\n        transformations:\r\n          - type: Switch@1\r\n            description: Current state\r\n            path: $.key.currentState\r\n            valueType: Int\r\n            cases:\r\n              - value: 1\r\n                transformations:\r\n                  - type: If@1\r\n                    description: No active metering point\r\n                    path: $.key.State.Active[0]\r\n                    operator: Equals\r\n                    value: null\r\n                    valueType: String\r\n                    transformations:\r\n                      - type: CreateUpdateInfo@1\r\n                        targetPath: $.update\r\n                        updateKind: UPDATE\r\n                        ckTypeId: Basic.Energy/OperatingFacility\r\n                        rtIdPath: $.key.operatingFacilityRtId\r\n                        attributeUpdates:\r\n                          - attributeName: State\r\n                            attributeValueType: Enum\r\n                            value: Inactive\r\n              - value: 2\r\n                transformations:\r\n                  - type: If@1\r\n                    description: Active metering point\r\n                    path: $.key.State.Active[0]\r\n                    operator: NotEquals\r\n                    value: null\r\n                    valueType: String\r\n                    transformations:\r\n                      - type: CreateUpdateInfo@1\r\n                        targetPath: $.update\r\n                        updateKind: UPDATE\r\n                        ckTypeId: Basic.Energy/OperatingFacility\r\n                        rtIdPath: $.key.operatingFacilityRtId\r\n                        attributeUpdates:\r\n                          - attributeName: State\r\n                            attributeValueType: Enum\r\n                            value: Active\r\n\r\n  - type: Project@1\r\n    description: Operating facilities\r\n    fields:\r\n      - path: $.OperatingFacilities\r\n      - path: $.query\r\n\r\n  - type: ApplyChanges@2\r\n    description: Update operating facilities\r\n    entityUpdatesPath: $.Updates\r\n\r\n  - type: Project@1\r\n    description: Updates\r\n    fields:\r\n      - path: $.Updates\r\n\r\n\r\n  # ------------------------------------\r\n  # Setting customer states\r\n  # ------------------------------------\r\n  - type: Logger@1\r\n    description: Start for customers\r\n    message: Start for customers\r\n\r\n  - type: GetQueryById@1\r\n    description: Get all states for customers\r\n    targetPath: $.query\r\n    queryRtId: 69314ccc231a1b734996238d\r\n\r\n  # Search for different states\r\n  - type: ForEach@1\r\n    description: Search different states\r\n    iterationPath: $.query.Rows\r\n    mergePath: $.diff\r\n    targetPath: $.Customers\r\n    transformations:\r\n      - type: If@1\r\n        description: Has different states\r\n        path: $.key.Values[0]\r\n        operator: NotEqual\r\n        valuePath: $.key.Values[2]\r\n        valueType: Enum\r\n        transformations:\r\n          - type: SetPrimitiveValue@1\r\n            targetPath: $.diff.CustomerRtId\r\n            valuePath: $.key.Values[1]\r\n            valueType: String\r\n          - type: SetPrimitiveValue@1\r\n            targetPath: $.diff.currentState\r\n            valuePath: $.key.Values[2]\r\n            valueType: Int\r\n\r\n  - type: If@1\r\n    description: Customers\r\n    path: $.Customers[0].CustomerRtId\r\n    operator: NotEquals\r\n    value: null\r\n    valueType: String\r\n    transformations:\r\n      - type: Distinct@1\r\n        description: Operating facilities\r\n        path: $.Customers\r\n        targetPath: $.Customers\r\n        distinctValuePath: $.CustomerRtId\r\n\r\n      - type: Join@1\r\n        description: Metering points\r\n        path: $.Customers[*]\r\n        keyPath: $.CustomerRtId\r\n        joinPath: $.query.Rows[*]\r\n        joinKeyPath: $.Values[1]\r\n        itemPath: $.OperatingFacilities\r\n\r\n      - type: ForEach@1\r\n        description: Operating facilities\r\n        iterationPath: $.Customers\r\n        mergePath: $.key\r\n        targetPath: $.Customers\r\n        transformations:\r\n          - type: ForEach@1\r\n            description: Operating facilities\r\n            iterationPath: $.key.OperatingFacilities\r\n            mergePath: $.State\r\n            targetPath: $.State\r\n            transformations:\r\n              - type: Switch@1\r\n                path: $.key.Values[0]\r\n                valueType: Int\r\n                cases:\r\n                  - value: 1\r\n                    transformations:\r\n                      - type: SetPrimitiveValue@1\r\n                        targetPath: $.State.Active\r\n                        value: \"Found\"\r\n                        valueType: String\r\n                  - value: 2\r\n                    transformations:\r\n                      - type: SetPrimitiveValue@1\r\n                        targetPath: $.State.Inactive\r\n                        value: \"Found\"\r\n                        valueType: String\r\n\r\n          - type: Flatten@1\r\n            description: Active state\r\n            path: $.State[*].Active\r\n            targetPath: $.key.State.Active\r\n          - type: Flatten@1\r\n            description: Inactive state\r\n            path: $.State[*].Inactive\r\n            targetPath: $.key.State.Inactive\r\n          - type: Project@1\r\n            description: Metering points\r\n            fields:\r\n              - path: $.key.OperatingFacilities\r\n\r\n      - type: Project@1\r\n        description: Query\r\n        fields:\r\n          - path: $.query\r\n\r\n      # Create customers updates\r\n      - type: ForEach@1\r\n        description: Customers\r\n        iterationPath: $.Customers\r\n        mergePath: $.update\r\n        targetPath: $.Updates\r\n        transformations:\r\n          - type: Switch@1\r\n            description: Current state\r\n            path: $.key.currentState\r\n            valueType: Int\r\n            cases:\r\n              - value: 1\r\n                transformations:\r\n                  - type: If@1\r\n                    description: No active operating facilities\r\n                    path: $.key.State.Active[0]\r\n                    operator: Equals\r\n                    value: null\r\n                    valueType: String\r\n                    transformations:\r\n                      - type: CreateUpdateInfo@1\r\n                        targetPath: $.update\r\n                        updateKind: UPDATE\r\n                        ckTypeId: EnergyCommunity/Customer\r\n                        rtIdPath: $.key.CustomerRtId\r\n                        attributeUpdates:\r\n                          - attributeName: State\r\n                            attributeValueType: Enum\r\n                            value: Inactive\r\n              - value: 2\r\n                transformations:\r\n                  - type: If@1\r\n                    description: Active operating facilities\r\n                    path: $.key.State.Active[0]\r\n                    operator: NotEquals\r\n                    value: null\r\n                    valueType: String\r\n                    transformations:\r\n                      - type: CreateUpdateInfo@1\r\n                        targetPath: $.update\r\n                        updateKind: UPDATE\r\n                        ckTypeId: EnergyCommunity/Customer\r\n                        rtIdPath: $.key.CustomerRtId\r\n                        attributeUpdates:\r\n                          - attributeName: State\r\n                            attributeValueType: Enum\r\n                            value: Active\r\n  \r\n  - type: Project@1\r\n    description: Customers\r\n    fields:\r\n      - path: $.Customers\r\n      - path: $.query\r\n\r\n  - type: ApplyChanges@2\r\n    description: Update operating facilities\r\n    entityUpdatesPath: $.Updates\r\n    "
