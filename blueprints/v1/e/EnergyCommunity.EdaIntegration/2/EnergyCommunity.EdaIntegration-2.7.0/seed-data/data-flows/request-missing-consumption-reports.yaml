$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
- Basic.Energy-[1.7,2.0)
- EnergyCommunity-[4.6,5.0)
- System.Communication-[3.22,4.0)
- System.Bot-[3.1,4.0)
- System.UI-[2.4,3.0)

# One DataFlow with its pipeline — the seed carries the pipeline definition inline.
# Part of the EnergyCommunity.EdaIntegration blueprint — see blueprint.yaml for the full file list.
entities:

# Source: _eda/request-missing-consumption-reports-pipeline.yaml
- rtId: 69c249a14f1e21ff43bfb1c2
  rtCreationDateTime: 2026-03-24T08:21:54.0310000Z
  rtChangedDateTime: 2026-03-26T13:55:37.0760000Z
  ckTypeId: System.Communication/Pipeline-1
  associations:
  - roleId: System/ParentChild-1
    targetRtId: 69c249764f1e21ff43bfb1c1
    targetCkTypeId: System.Communication/DataFlow-1
    attributes: []
  - roleId: System.Communication/Executes-1
    targetRtId: '686e0f17196fcd3c42ed8c77'
    targetCkTypeId: System.Communication/Adapter-1
    attributes: []
  attributes:
  - id: System.Communication/DeploymentState-1
    value: 0
  - id: System/Name-1
    value: request_missing_consumption_reports - Mesh
  - id: System.Communication/StatusMessage-1
  - id: System.Communication/PipelineDefinition-1
    value: |-
      triggers:
        # - type: FromExecutePipelineCommand@1
        - type: FromHttpRequest@1
          path: /requestMissingConsumptionReports
          method: POST
      transformations:
        - type: GetPipelineConfigByWellKnownName@1
          wellKnownName: "EnergyCommunityConfiguration"
          targetPath: $.conf

        - type: SetPrimitiveValue@1
          description: set start date
          targetPath: $.config.from
          #value: "2026-01-01T00:00:00+01:00"
          valuePath: $.body.date
          valueType: DateTime
        - type: SetPrimitiveValue@1
          description: partner id
          targetPath: $.config.partnerId
          valuePath: $.conf.partnerId
          valueType: String

        - type: Project@1
          fields:
            - path: $.conf
            - path: $.body
            - path: $.path
            - path: $.method


        - type: For@1
          description: create time range
          count: 1
          indexTargetPath: $.start
          targetPath: $.it
          transformations:
            - type: Math@1
              description: end index
              path: $
              itemPath: $.start
              itemTargetPath: $.end
              operation: Add
              value: 1
            - type: DateTime@1
              description: set start date
              operation: AddDays
              path: $.config.from
              targetPath: $.timeRange.from
              valuePath: $.start
            - type: DateTime@1
              description: set end date
              operation: AddDays
              path: $.config.from
              targetPath: $.timeRange.to
              valuePath: $.end

        - type: Flatten@1
          description: time range
          path: $.it[*].timeRange
          targetPath: $.timeRange

        - type: Project@1
          fields: # optional
            - path: $.it
            #- path: $.config

        - type: ForEach@1
          description: time ranges
          #maxDegreeOfParallelism: 1
          iterationPath: $.timeRange
          mergePath: $.key
          targetPath: $.days
          transformations:
            - type: GetQueryById@1
              description: participation for day
              queryRtId: 69c230e44f1e21ff43bfb1be
              targetPath: $.query
              fieldFilters:
                - attributePath: timeRange.from
                  operator: LessEqualThan
                  comparisonValuePath: $.key.from
                - attributePath: timeRange.to
                  operator: GreaterEqualThan
                  comparisonValuePath: $.key.to
            - type: Flatten@1
              description: metering points
              path: $.query.Rows[*]
              targetPath: $.key.meteringPoints

        - type: Project@1
          fields:
            - path: $.timeRange


        # Which metering points have a value on the day (AB#4551)
        #
        # The 1.x line kept one daily quantity per metering point, built from the
        # registers 1-1:2.9.0 G.03 (consumer) and 1-1:2.9.0 G.01T with 1-1:2.9.0 P.01T
        # (producer), and asked for every participating metering point without one.
        # Here the rows of these registers are counted per measurement anchor
        # (metering point x OBIS code) in the measurement archive
        # (ec0000000000000000000a01), the anchors are resolved to their metering
        # point, and each participating metering point gets the matches as
        # $.quantities. A metering point without a match has not a single value on
        # that day and is requested below. A day with values missing in between
        # counts as present, as on the 1.x line.
        #
        # On a windowed archive from/to select the rows that overlap the range, with
        # both ends exclusive -- the last interval of the day before does not count.
        - type: ForEach@1
          description: days
          maxDegreeOfParallelism: 1
          iterationPath: $.days
          mergePath: $.key
          targetPath: $.days
          transformations:
            - type: AggregateStreamData@1
              description: Measurement anchors with at least one value on the day
              archiveRtId: ec0000000000000000000a01
              groupBy:
                - rtId
              fieldFilters:
                - attributePath: ObisCode
                  operator: In
                  comparisonValue: ["1-1:2.9.0 G.03", "1-1:2.9.0 G.01T", "1-1:2.9.0 P.01T"]
              aggregations:
                - attributePath: Amount.Value
                  function: Count
              fromPath: $.key.from
              toPath: $.key.to
              targetPath: $.agg
            # GetAssociationTargets@1 fails without an origin id. Without any value
            # on the day nothing is attached and every metering point is requested.
            - type: If@1
              description: At least one value on the day
              path: $.agg.Rows[0].Values[0]
              operator: NotEquals
              value: null
              valueType: String
              transformations:
                - type: GetAssociationTargets@1
                  description: Metering point of each measurement anchor
                  associationRoleId: System/ParentChild
                  graphDirection: Outbound
                  originCkTypeId: Basic.Energy/EnergyMeasurement
                  targetCkTypeId: Basic.Energy/MeteringPoint
                  originRtIdPath: $.agg.Rows[*].Values[0]
                  targetPath: $.parents
                - type: Join@1
                  description: quantities to metering points
                  path: $.key.meteringPoints[*]
                  keyPath: $.Values[0]
                  joinPath: $.parents[*].Items[*]
                  joinKeyPath: $.Attributes.MeteringPointNumber
                  itemPath: $.quantities

        - type: ForEach@1
          description: days
          maxDegreeOfParallelism: 1
          iterationPath: $.days
          mergePath: $.body
          targetPath: $.body
          transformations:
            - type: ForEach@1
              description: metering points
              #maxDegreeOfParallelism: 1
              iterationPath: $.key.meteringPoints
              mergePath: $.body
              targetPath: $.body
              transformations:
                - type: If@1
                  description: no quantities
                  operator: Equal
                  path: $.key.quantities[0].RtId
                  value: NULL
                  valueType: String
                  transformations:
                    - type: SetPrimitiveValue@1
                      targetPath: $.body.requestData.processName
                      value: "CR_REQ_PT"
                      valueType: String
                    - type: TransformString@1
                      description: Get operator number
                      path: $.key
                      sourcePath: $.Values[0]
                      targetPath: $.Operator
                      operation: SubstringFromStart
                      length: 8
                    - type: FormatString@1
                      targetPath: $.body.requestData.comment
                      format: "Get energy quantities for {$.key.Values[0]} {$.full.key.from}-{$.full.key.to}"
                    # - type: FormatString@1
                    #   targetPath: $.body.requestData.processData.receiver
                    #   format: "{$.key.Operator}TEST2"
                    - type: SetPrimitiveValue@1
                      targetPath: $.body.requestData.processData.receiver
                      valuePath: $.key.Operator
                      valueType: String
                    - type: SetPrimitiveValue@1
                      targetPath: $.body.requestData.processData.sender
                      valuePath: $.full.full.config.partnerId
                      valueType: String
                    - type: SetPrimitiveValue@1
                      targetPath: $.body.requestData.processData.meteringPoint
                      valuePath: $.key.Values[0]
                      valueType: String
                    - type: SetPrimitiveValue@1
                      targetPath: $.body.requestData.processData.from
                      valuePath: $.full.key.from
                      valueType: DateTime
                    - type: SetPrimitiveValue@1
                      targetPath: $.body.requestData.processData.to
                      valuePath: $.full.key.to
                      valueType: DateTime


        - type: Flatten@1
          path: $.body[*][*]
          targetPath: $.RequestData

        - type: Project@1
          fields:
            - path: $.config
            - path: $.days
            - path: $.body

        - type: ForEach@1
          description: "Send all requests"
          maxDegreeOfParallelism: 1
          iterationPath: $.RequestData
          #mergePath: $.request
          #targetPath: $.Requests
          transformations:
            - type: EdaStartProcess@1
              path: $.key.requestData
              targetPath: $.request
            - type: SetPrimitiveValue@1
              targetPath: $.request.comment
              valuePath: $.key.requestData.comment
              valueType: String
            - type: If@1
              description: If successfull sent create a new process in DB
              path: $.request.IsSuccess
              operator: Equals
              value: true
              valueType: Boolean
              transformations:
                - type: CreateUpdateInfo@1
                  targetPath: $.update
                  targetValueKind: Array
                  updateKind: INSERT
                  ckTypeId: Basic.Energy/EdaProcess
                  attributeUpdates:
                    - attributeName: Name
                      attributeValueType: String
                      value: "CR_REQ_PT"
                    - attributeName: Description
                      attributeValueType: String
                      valuePath: $.request.comment
                    - attributeName: ConversationId
                      attributeValueType: String
                      valuePath: $.request.Message.ProcessDirectory.ConversationId
                    - attributeName: Finished
                      attributeValueType: Boolean
                      value: false
                    - attributeName: StartTime
                      attributeValueType: DateTime
                      valuePath: $.request.Message.MarketParticipantDirectory.RoutingHeader.DocumentCreationDateTime
                    - attributeName: Sender
                      attributeValueType: String
                      valuePath: $.request.Message.MarketParticipantDirectory.RoutingHeader.Sender.MessageAddress
                    - attributeName: Receiver
                      attributeValueType: String
                      valuePath: $.request.Message.MarketParticipantDirectory.RoutingHeader.Receiver.MessageAddress
                    - attributeName: MeteringPointNumber
                      attributeValueType: String
                      valuePath: $.request.Message.ProcessDirectory.MeteringPoint
                    - attributeName: RawMessage
                      attributeValueType: String
                      valuePath: $.request.Message

                - type: ApplyChanges@1
                  path: $.update
- rtId: 69c249764f1e21ff43bfb1c1
  rtCreationDateTime: 2026-03-24T08:21:10.4100000Z
  rtChangedDateTime: 2026-03-25T06:13:59.4980000Z
  ckTypeId: System.Communication/DataFlow-1
  associations: []
  attributes:
  - id: System/Name-1
    value: request-missing-consumption-reports
  - id: System/Description-1
    value: Reqeuest consumption reports for days without any data
