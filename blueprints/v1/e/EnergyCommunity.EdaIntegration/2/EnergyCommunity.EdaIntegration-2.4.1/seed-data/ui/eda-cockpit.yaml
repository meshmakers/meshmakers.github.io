$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
- Basic.Energy-[1.3,2.0)
- EnergyCommunity-[4.1,5.0)
- System.Communication-[3.22,4.0)
- System.Bot-[3.1,4.0)
- System.UI-[2.4,3.0)

# The EDA cockpit MeshBoard: Dashboard `energy-community-eda` and its four widgets.
# Part of the EnergyCommunity.EdaIntegration blueprint — see blueprint.yaml for the full file list.
entities:

# Dashboard
- rtId: ec0000000000000000000d02
  ckTypeId: System.UI/Dashboard-1
  rtWellKnownName: energy-community-eda
  associations: []
  attributes:
  - id: System/Name-1
    value: EDA Cockpit
  - id: System/Description-1
    value: ''
  - id: System.UI/Dashboard.Columns-1
    value: 6
  - id: System.UI/Dashboard.RowHeight-1
    value: 200
  - id: System.UI/Dashboard.Gap-1
    value: 16

# Widget: metering-point count KPI (runtimeEntity count over MeteringPoint).
- rtId: ec0000000000000000000d03
  ckTypeId: System.UI/DashboardWidget-1
  associations:
  - roleId: System/ParentChild-1
    targetRtId: ec0000000000000000000d02
    targetCkTypeId: System.UI/Dashboard-1
    attributes: []
  attributes:
  - id: System/Name-1
    value: Zählpunkte
  - id: System.UI/DashboardWidget.Type-1
    value: kpi
  - id: System.UI/DashboardWidget.Col-1
    value: 1
  - id: System.UI/DashboardWidget.Row-1
    value: 1
  - id: System.UI/DashboardWidget.ColSpan-1
    value: 1
  - id: System.UI/DashboardWidget.RowSpan-1
    value: 1
  - id: System.UI/DashboardWidget.DataSourceType-1
    value: runtimeEntity
  - id: System.UI/DashboardWidget.DataSourceCkTypeId-1
    value: Basic.Energy/MeteringPoint
  - id: System.UI/DashboardWidget.DataSourceRtId-1
    value: ''
  - id: System.UI/DashboardWidget.Config-1
    value: '{"valueAttribute":"_count","icon":"chart"}'

# Widget: metering-point state donut (systemQuery grouping, runtime family).
- rtId: ec0000000000000000000d04
  ckTypeId: System.UI/DashboardWidget-1
  associations:
  - roleId: System/ParentChild-1
    targetRtId: ec0000000000000000000d02
    targetCkTypeId: System.UI/Dashboard-1
    attributes: []
