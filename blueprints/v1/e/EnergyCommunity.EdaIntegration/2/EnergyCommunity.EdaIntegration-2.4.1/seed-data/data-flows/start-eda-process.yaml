$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
- Basic.Energy-[1.3,2.0)
- EnergyCommunity-[4.1,5.0)
- System.Communication-[3.22,4.0)
- System.Bot-[3.1,4.0)
- System.UI-[2.4,3.0)

# One DataFlow with its pipelines — the seed carries the pipeline definitions inline.
# Part of the EnergyCommunity.EdaIntegration blueprint — see blueprint.yaml for the full file list.
entities:

# ─── EDA pipelines ───────────────────────────────────────────────────────

# Source: _eda/start-eda-process-pipeline.yaml
- rtId: 68c28086234ceec0d029dfec
  rtCreationDateTime: 2025-09-11T07:55:50.6700000Z
  rtChangedDateTime: 2025-11-17T16:14:53.6880000Z
  ckTypeId: System.Communication/Pipeline-1
  associations:
  - roleId: System/ParentChild-1
    targetRtId: 68b017a08f03da854927fd86
    targetCkTypeId: System.Communication/DataFlow-1
    attributes: []
  - roleId: System.Communication/Executes-1
    targetRtId: '686e0f17196fcd3c42ed8c77'
    targetCkTypeId: System.Communication/Adapter-1
    attributes: []
  attributes:
  - id: System.Communication/DeploymentState-1
    value: 0
  - id: System/Name-1
    value: Start EDA process HTTP request
  - id: System.Communication/StatusMessage-1
  - id: System/Enabled-1
    value: true
  - id: System.Communication/PipelineDefinition-1
    value: >+
      triggers:
        - type: FromHttpRequest@1
          path: /startProcess
          method: POST
      transformations:
        - type: EdaStartProcess@1
          path: $.body.requestData
          targetPath: $.request
        - type: If@1
          description: If successfull sent create a new process in DB
          path: $.request.IsSuccess
          operator: Equals
          value: true
          valueType: Boolean
          transformations:
            - type: CreateUpdateInfo@1
              targetPath: $.update
              targetValueKind: Array
              updateKind: INSERT
              ckTypeId: Basic.Energy/EdaProcess
              attributeUpdates:
                - attributeName: Name
                  attributeValueType: String
                  valuePath: $.body.requestData.processName
                - attributeName: Description
                  attributeValueType: String
                  valuePath: $.body.requestData.comment
                - attributeName: ConversationId
                  attributeValueType: String
                  valuePath: $.request.Message.ProcessDirectory.ConversationId
                - attributeName: Finished
                  attributeValueType: Boolean
                  value: false
                - attributeName: StartTime
                  attributeValueType: DateTime
                  valuePath: $.request.Message.MarketParticipantDirectory.RoutingHeader.DocumentCreationDateTime
                - attributeName: Sender
                  attributeValueType: String
                  valuePath: $.body.requestData.processData.sender
                - attributeName: Receiver
                  attributeValueType: String
                  valuePath: $.body.requestData.processData.receiver
                - attributeName: MeteringPointNumber
                  attributeValueType: String
                  valuePath: $.body.requestData.processData.meteringPoint
                - attributeName: RawMessage
                  attributeValueType: String
                  valuePath: $.request.Message
            - type: ApplyChanges@1
              path: $.update
# Second pipeline in the start-eda-process DataFlow: starts EDA processes that
# were persisted with Planned=true and a due StartTime (AB#3147 in the CK model,
# ported from energy-community-deployment). Driven on demand; the FromPolling@1
# alternative stays commented out in the definition.
- rtId: 6a2bc26a6830b2865f042892
  rtCreationDateTime: 2026-06-12T08:25:14.8890000Z
  rtChangedDateTime: 2026-06-12T12:25:21.3760000Z
  ckTypeId: System.Communication/Pipeline-1
  associations:
  - roleId: System/ParentChild-1
    targetRtId: 68b017a08f03da854927fd86
    targetCkTypeId: System.Communication/DataFlow-1
    attributes: []
  - roleId: System.Communication/Executes-1
    targetRtId: '686e0f17196fcd3c42ed8c77'
    targetCkTypeId: System.Communication/Adapter-1
    attributes: []
  attributes:
  - id: System.Communication/DeploymentState-1
    value: 0
  - id: System/Name-1
    value: Start planned EDA processes
  - id: System.Communication/StatusMessage-1
  - id: System/Enabled-1
    value: true
  - id: System.Communication/PipelineDefinition-1
    value: "triggers:\n  - type: FromExecutePipelineCommand@1\n  # - type: FromPolling@1\n  #   interval: 00:10:00\ntransformations:\n  - type: DateTime@1\n    description: current date\n    operation: Now\n    targetPath: $.Now\n  - type: GetQueryById@1\n    targetPath: $.query\n    queryRtId: 6a2bbc146830b2865f042891\n    fieldFilters:\n      - attributePath: startTime\n        operator: LessEqualThan\n        comparisonValuePath: $.Now\n  - type: ForEach@1\n    description: messages\n    iterationPath: $.query.Rows\n    maxDegreeOfParallelism: 1\n    #mergePath: $.message\n    #targetPath: $.result\n    transformations:\n      - type: SetPrimitiveValue@1\n        description: process name\n        valueType: String\n        targetPath: $.process.processName\n        valuePath: $.key.Values[0]\n      - type: EdaStartProcess@1\n        path: $.process\n        processDataPath: $.key.Values[2]\n        targetPath: $.request\n      - type: If@1\n        description: request successful\n        path: $.request.IsSuccess\n        operator: Equals\n        value: true\n        valueType: Boolean\n        transformations:\n          - type: CreateUpdateInfo@1\n            targetPath: $.update\n            targetValueKind: Array\n            updateKind: UPDATE\n            ckTypeIdPath: $.key.CkTypeId\n            rtIdPath: $.key.RtId\n            attributeUpdates:\n              - attributeName: ConversationId\n                attributeValueType: String\n                valuePath: $.request.Message.ProcessDirectory.ConversationId\n              - attributeName: Finished\n                attributeValueType: Boolean\n                value: false\n              - attributeName: StartTime\n                attributeValueType: DateTime\n                valuePath: $.request.Message.MarketParticipantDirectory.RoutingHeader.DocumentCreationDateTime\n              - attributeName: Planned\n                attributeValueType: Boolean\n                value: false\n              - attributeName: RawMessage\n                attributeValueType: String\n                valuePath: $.request.Message\n          - type: ApplyChanges@1\n            path: $.update"
- rtId: 68b017a08f03da854927fd86
  rtCreationDateTime: 2025-08-28T08:47:28.9310000Z
