# Yearly rollup CHAINED on monthly — a calendar year is exactly 12 calendar
# months, so it reads ~12 rows per year. CalendarYear (4) + Europe/Vienna.
# BucketSizeMs 29030400000 (336 d = 12 x the monthly 28-d bucket) — must be an
# integer multiple of the source granularity; 365 d would be rejected by the
# rollup-over-rollup validator.
