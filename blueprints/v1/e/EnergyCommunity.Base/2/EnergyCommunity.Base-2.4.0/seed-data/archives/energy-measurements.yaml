  - id: System.StreamData/RollupArchive.WatermarkLagMs-1
    value: 900000
  - id: System.StreamData/RollupArchive.BucketAlignment-1
    value: 4
  - id: System.StreamData/RollupArchive.ReferenceTimeZone-1
    value: Europe/Vienna
  - id: System.StreamData/RollupArchive.Aggregations-1
