# The per-tenant energy-community-app Application was REMOVED here (AB#3683).
#
# One deployment now serves every tenant: it lives on the MANAGEMENT tenant, seeded by
# EnergyCommunity.App (rtId ec0000000000000000000f01, hostname
# energy-community.{{domain.DEFAULT}}), and reads the tenant from its `/:tenantId` route.
# Seeding a second app per operating tenant produced a workload nobody deploys and a
# hostname nobody visits, and `install-tenant.ps1` still told operators to deploy it.
#
# Existing tenants keep their entity: blueprint upsert never deletes, so
# 6a1f14de0b5979da7108457e survives this version and stays deployable — which is what makes
# the migration reversible per tenant. Undeploy it once the tenant is served by the shared
# host (`UndeployWorkload -id 6a1f14de0b5979da7108457e`), and drop it for good with
# `UpdateBlueprint -m Full` only when every tenant has moved.


- rtId: ec0000000000000000000a01
  ckTypeId: System.StreamData/TimeRangeArchive-1
  rtWellKnownName: energy-measurements
  associations: []
  attributes:
  - id: System.StreamData/TimeRangeArchive.Period-1
    value: 9000000000
  - id: System.StreamData/Archive.TargetCkTypeId-1
    value: Basic.Energy/EnergyMeasurement
  - id: System.StreamData/Archive.Columns-1
    value:
    - ckRecordId: System.StreamData/CkArchiveColumn-1
      attributes:
      - id: System.StreamData/CkArchiveColumn.Path-1
        value: Amount.Value
      - id: System.StreamData/CkArchiveColumn.Required-1
        value: true
      - id: System.StreamData/CkArchiveColumn.Indexed-1
        value: false
    - ckRecordId: System.StreamData/CkArchiveColumn-1
      attributes:
      - id: System.StreamData/CkArchiveColumn.Path-1
        value: Amount.Unit
      - id: System.StreamData/CkArchiveColumn.Required-1
        value: true
      - id: System.StreamData/CkArchiveColumn.Indexed-1
        value: false
    - ckRecordId: System.StreamData/CkArchiveColumn-1
      attributes:
      - id: System.StreamData/CkArchiveColumn.Path-1
        value: ObisCode
      - id: System.StreamData/CkArchiveColumn.Required-1
        value: true
      - id: System.StreamData/CkArchiveColumn.Indexed-1
        value: true
    - ckRecordId: System.StreamData/CkArchiveColumn-1
      attributes:
      - id: System.StreamData/CkArchiveColumn.Path-1
        value: DataQuality
      - id: System.StreamData/CkArchiveColumn.Required-1
        value: true
      - id: System.StreamData/CkArchiveColumn.Indexed-1
        value: true
  - id: System.StreamData/Archive.Status-1
    value: 2

# Hourly rollup over the raw archive. FixedSize (0) — an hour is a
# whole-hour-offset-invariant window for Europe/Vienna, so no calendar
# alignment needed. BucketSizeMs 3600000 is an exact multiple of the 15-min
# source window. Aggregations SUM(Amount.Value) -> amountvalue_sum,
# MAX(DataQuality) -> dataquality_max (derived column names).
- rtId: ec0000000000000000000a02
  ckTypeId: System.StreamData/RollupArchive-1
  rtWellKnownName: energy-measurements-hourly
  associations: []
  attributes:
  - id: System.StreamData/RollupArchive.SourceArchiveRtId-1
    value: 'ec0000000000000000000a01'
  - id: System.StreamData/RollupArchive.BucketSizeMs-1
    value: 3600000
  - id: System.StreamData/RollupArchive.WatermarkLagMs-1
    value: 900000
  - id: System.StreamData/RollupArchive.BucketAlignment-1
    value: 0
  - id: System.StreamData/RollupArchive.Aggregations-1
    value:
    - ckRecordId: System.StreamData/CkRollupAggregation-1
      attributes:
      - id: System.StreamData/CkRollupAggregation.SourcePath-1
        value: Amount.Value
      - id: System.StreamData/CkRollupAggregation.Function-1
        value: 3
    - ckRecordId: System.StreamData/CkRollupAggregation-1
      attributes:
      - id: System.StreamData/CkRollupAggregation.SourcePath-1
        value: DataQuality
      - id: System.StreamData/CkRollupAggregation.Function-1
        value: 2
  - id: System.StreamData/Archive.TargetCkTypeId-1
    value: Basic.Energy/EnergyMeasurement
  - id: System.StreamData/Archive.Columns-1
    value:
    - ckRecordId: System.StreamData/CkArchiveColumn-1
      attributes:
      - id: System.StreamData/CkArchiveColumn.Path-1
        value: amountvalue_sum
      - id: System.StreamData/CkArchiveColumn.Required-1
        value: false
      - id: System.StreamData/CkArchiveColumn.Indexed-1
        value: true
    - ckRecordId: System.StreamData/CkArchiveColumn-1
      attributes:
      - id: System.StreamData/CkArchiveColumn.Path-1
        value: dataquality_max
      - id: System.StreamData/CkArchiveColumn.Required-1
        value: false
      - id: System.StreamData/CkArchiveColumn.Indexed-1
        value: true
  - id: System.StreamData/Archive.Status-1
    value: 2

# Daily rollup CHAINED on hourly (cascade keeps open-bucket recompute cheap).
# CalendarDay (1) + Europe/Vienna: buckets snap to local Austrian midnight,
# DST-correct (requires System.StreamData >= 1.6.4). Reads the hourly PHYSICAL
# columns and re-aggregates SUM-of-sums / MAX-of-maxes; TargetColumnName keeps
# the stored column names identical so query shapes match all levels.
# BucketSizeMs 86400000 is informational under calendar alignment.
