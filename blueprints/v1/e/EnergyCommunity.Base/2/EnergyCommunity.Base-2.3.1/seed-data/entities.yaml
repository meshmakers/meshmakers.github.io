# ─── Legacy daily archive + sub-ladder (migration tenants only) ──────────
# Carries over pre-cutover daily EnergyQuantity history 1:1 (ADR 0001
# decision 3). Day-sized windows MUST NOT go into the 900 s raw archive —
# the rollup engine's fully-contained-window rule would silently drop them
# from the entire ladder. Day windows DO tile calendar months/years, so a
# small monthly + yearly sub-ladder works on top. Period is advisory
# (TimeSpan ticks: 864000000000 = 1 d). Fresh (greenfield) tenants leave
# these three archives Disabled — install-tenant.ps1 only activates them
# with -IncludeLegacyArchives.
- rtId: ec0000000000000000000a11
  ckTypeId: System.StreamData/TimeRangeArchive-1
  rtWellKnownName: energy-measurements-legacy-daily
  associations: []
  attributes:
  - id: System.StreamData/TimeRangeArchive.Period-1
    value: 864000000000
  - id: System.StreamData/Archive.TargetCkTypeId-1
    value: Basic.Energy/EnergyMeasurement
  - id: System.StreamData/Archive.Columns-1
    value:
    - ckRecordId: System.StreamData/CkArchiveColumn-1
      attributes:
      - id: System.StreamData/CkArchiveColumn.Path-1
        value: Amount.Value
      - id: System.StreamData/CkArchiveColumn.Required-1
        value: true
      - id: System.StreamData/CkArchiveColumn.Indexed-1
        value: false
    - ckRecordId: System.StreamData/CkArchiveColumn-1
      attributes:
      - id: System.StreamData/CkArchiveColumn.Path-1
        value: Amount.Unit
      - id: System.StreamData/CkArchiveColumn.Required-1
        value: true
      - id: System.StreamData/CkArchiveColumn.Indexed-1
        value: false
    - ckRecordId: System.StreamData/CkArchiveColumn-1
      attributes:
      - id: System.StreamData/CkArchiveColumn.Path-1
        value: ObisCode
      - id: System.StreamData/CkArchiveColumn.Required-1
        value: true
      - id: System.StreamData/CkArchiveColumn.Indexed-1
        value: true
    - ckRecordId: System.StreamData/CkArchiveColumn-1
      attributes:
      - id: System.StreamData/CkArchiveColumn.Path-1
        value: DataQuality
      - id: System.StreamData/CkArchiveColumn.Required-1
        value: true
      - id: System.StreamData/CkArchiveColumn.Indexed-1
        value: true
  - id: System.StreamData/Archive.Status-1
    value: 2

# Legacy monthly rollup over the legacy daily archive. Same parametrization
# as the main monthly rollup (CalendarMonth (3) + Europe/Vienna), but the
