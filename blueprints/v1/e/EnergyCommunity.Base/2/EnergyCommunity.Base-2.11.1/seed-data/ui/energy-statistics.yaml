  associations:
  - roleId: System/ParentChild-1
    targetRtId: ec0000000000000000000c01
    targetCkTypeId: System.UI/Dashboard-1
    attributes: []
  attributes:
  - id: System/Name-1
    value: Erzeugung
  - id: System.UI/DashboardWidget.Type-1
    value: kpi
  - id: System.UI/DashboardWidget.Col-1
    value: 2
  - id: System.UI/DashboardWidget.Row-1
    value: 1
  - id: System.UI/DashboardWidget.ColSpan-1
    value: 1
  - id: System.UI/DashboardWidget.RowSpan-1
    value: 1
  - id: System.UI/DashboardWidget.DataSourceType-1
    value: systemQuery
  - id: System.UI/DashboardWidget.DataSourceCkTypeId-1
    value: ''
  - id: System.UI/DashboardWidget.DataSourceRtId-1
    value: ec0000000000000000000a22
  - id: System.UI/DashboardWidget.Config-1
    value: '{"valueAttribute":"","suffix":"kWh","icon":"chart","outputVariableName":"creation","queryMode":"groupedAggregation","queryValueField":"amountvalue_sum","queryCategoryField":"obiscode","queryCategoryValue":"1-1:2.9.0 G.01T","queryName":"energy-measurements-aggregation-by-obiscode","queryRtId":"ec0000000000000000000a22","queryFamily":"streamData"}'

