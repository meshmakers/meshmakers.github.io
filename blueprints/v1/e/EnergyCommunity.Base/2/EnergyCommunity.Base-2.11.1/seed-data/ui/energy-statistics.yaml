# The energy-statistics MeshBoard: Dashboard `energy-community-energy-quantities`
# and its seven widgets.
# Part of the EnergyCommunity.Base blueprint — see blueprint.yaml for the full file list.
entities:

# ─── Energy-statistics MeshBoard (EC v2, AB#4578 — Board 2) ──────────────
# System.UI/Dashboard `energy-community-energy-quantities` + widgets. Adopts
# and converts the retired EnergyCommunity/EnergyQuantity board
# (misc/energy-community-deployment/data/boards/Energy_quantity_statistics.yaml)
# to stream data: the widgets bind to the persisted SD queries above by rtId
# (a21/a22/a23), so those queries MUST be seeded before the board — they are,
# just above. Requires the service-managed System.UI CK model
# (octo-platform-services). The old RT navigation
# (parent...energyCommunityMeteringPoint->ckTypeId) and the RT
# quantity/timeRange field filters are gone — the time window is supplied by
# the dashboard time filter as StreamDataArguments.from/to.
#
# Binding notes (verified against the meshboard widget source):
#   - KPI groupedAggregation picks the FIRST aggregation row whose
#     queryCategoryField cell == queryCategoryValue (it does NOT sum rows).
#     The KPI row reads the community-level feed-in series: Verbrauch =
#     1-1:2.9.0 G.03, Erzeugung = 1-1:2.9.0 G.01T, Überschuss =
#     1-1:2.9.0 P.01T. Erzeugung and Überschuss publish their value as the
#     output variables `creation` / `surplus`; the static formula KPI
#     "Erzeugung in EEG" computes `${creation} - ${surplus}` from them. The
#     by-OBIS pie is filtered to those three series, the data-quality donut
#     to G.03.
#   - Physical SD columns: group-by columns are lower-cased with no suffix
#     (obiscode, dataquality, amountunit); SUM(amount.value) -> amountvalue_sum.
#   - queryFamily is set to streamData explicitly to skip the runtime lookup.
#   - rtId scheme: dashboard/widgets use the ec00…0cXX block. The two KPIs
#     added in Studio (Überschuss, Erzeugung in EEG) keep the rtIds they were
#     created with on eegroider, so that tenant adopts them on upsert instead
#     of getting duplicates.

# Dashboard
- rtId: ec0000000000000000000c01
  ckTypeId: System.UI/Dashboard-1
  rtWellKnownName: energy-community-energy-quantities
  associations: []
  attributes:
  - id: System/Name-1
    value: Energy quantity statistics
  - id: System/Description-1
    value: |-
      ---MESHBOARD_VARIABLES---
      {"timeFilter":{"enabled":true,"defaultSelection":{"type":"custom","customFrom":"2026-07-01T00:00:00.000Z","customTo":"2026-08-01T00:00:00.000Z"},"selection":{"type":"custom","customFrom":"2026-07-01T00:00:00.000Z","customTo":"2026-08-01T00:00:00.000Z"}}}
  - id: System.UI/Dashboard.Columns-1
    value: 4
  - id: System.UI/Dashboard.RowHeight-1
    value: 200
  - id: System.UI/Dashboard.Gap-1
    value: 16

