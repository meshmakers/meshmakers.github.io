# Widget: energy time series (lineChart) — one line per OBIS code, each the SUM
# over all metering registers of that code (the community total). Resolution-aware
# (AB#4290) so the server picks the rollup grain for the window (hourly for a month,
# coarser for a year) instead of scanning the raw 15-min archive; aggregateSeriesByGroup
# (AB#4714) buckets the source EnergyMeasurement entities by obisCode and sums each
# group server-side — without it the per-rtId fan-out would render one arbitrary meter
# per OBIS code, not the total. queryRtId a21 supplies only the base archive family.
- rtId: ec0000000000000000000c06
  ckTypeId: System.UI/DashboardWidget-1
  associations:
  - roleId: System/ParentChild-1
    targetRtId: ec0000000000000000000c01
    targetCkTypeId: System.UI/Dashboard-1
    attributes: []
  attributes:
  - id: System/Name-1
    value: Energy over time
  - id: System.UI/DashboardWidget.Type-1
    value: lineChart
  - id: System.UI/DashboardWidget.Col-1
    value: 1
  - id: System.UI/DashboardWidget.Row-1
    value: 4
  - id: System.UI/DashboardWidget.ColSpan-1
    value: 4
  - id: System.UI/DashboardWidget.RowSpan-1
    value: 2
  - id: System.UI/DashboardWidget.DataSourceType-1
    value: systemQuery
  - id: System.UI/DashboardWidget.DataSourceCkTypeId-1
    value: ''
  - id: System.UI/DashboardWidget.DataSourceRtId-1
    value: ec0000000000000000000a21
  - id: System.UI/DashboardWidget.Config-1
    value: '{"chartType":"line","categoryField":"window_start","seriesGroupField":"obisCode","valueField":"amount.value","unitField":"amount.unit","showLegend":true,"legendPosition":"right","showMarkers":false,"showDataBadge":true,"queryFamily":"streamData","queryName":"energy_measurements","queryRtId":"ec0000000000000000000a21","resolutionAware":true,"requiredAggregation":"SUM","aggregateSeriesByGroup":true}'
