- EnergyCommunity-[5.0,6.0)
- System.Communication-[3.26,5.0)
- System.StreamData-[1.13,2.0)
- System.UI-[2.4,3.0)

# The customer statistics MeshBoards (AB#5791), shown read-only on the Statistics tab of a
# customer in the EC app. Part of the EnergyCommunity.Base blueprint - see blueprint.yaml.
#
# Three boards with the same nine widgets; they differ only in their one hidden entity
# selector, which the app picks through the route data `entitySelectors`:
#   energy-community-customer-statistics        selector customer       (ec00...0c0a-0c13)
#   energy-community-facility-statistics        selector facility       (ec00...0c14-0c1d)
#   energy-community-metering-point-statistics  selector meteringPoint  (ec00...0c1e-0c27)
# The app shows the narrowest board for the facility and metering-point filters of the tab.
# The widgets read the same queries as the energy-statistics board (a22 KPIs, a21 line
# chart), so a customer total equals the sum of its metering points; the app spec
# customer-statistics-boards.spec.ts fails when the boards drift apart or from that board.
# The line charts name their lines through `seriesLabels`, the same register-name map as the
# energy-statistics board (Base 3.2.2, AB#5307); register-names.spec.ts compares all copies.
entities:

# ─── energy-community-customer-statistics - scoped to the customer: Customer -AssociatedFacilities (out)-> OperatingFacility -ParentChild (in)-> MeteringPoint -ParentChild (in)-> EnergyMeasurement
- rtId: ec0000000000000000000c0a
  ckTypeId: System.UI/Dashboard-1
  rtWellKnownName: energy-community-customer-statistics
  associations: []
  attributes:
  - id: System/Name-1
    value: Customer energy statistics
  - id: System/Description-1
    value: |-
      ---MESHBOARD_VARIABLES---
      {"timeZoneMode":"Europe/Vienna","timeFilter":{"enabled":true,"defaultSelection":{"type":"custom","customFrom":"2026-06-30T22:00:00.000Z","customTo":"2026-07-31T22:00:00.000Z"},"selection":{"type":"custom","customFrom":"2026-06-30T22:00:00.000Z","customTo":"2026-07-31T22:00:00.000Z"}},"entitySelectors":[{"id":"customer","label":"Kunde","ckTypeId":"EnergyCommunity/Customer","attributeMappings":[],"showInToolbar":false,"childScope":{"path":[{"roleId":"EnergyCommunity/AssociatedFacilities","direction":"out","targetCkTypeId":"Basic.Energy/OperatingFacility"},{"roleId":"System/ParentChild","direction":"in","targetCkTypeId":"Basic.Energy/MeteringPoint"},{"roleId":"System/ParentChild","direction":"in","targetCkTypeId":"Basic.Energy/EnergyMeasurement"}]}}]}
  - id: System.UI/Dashboard.Columns-1
    value: 4
  - id: System.UI/Dashboard.RowHeight-1
    value: 200
  - id: System.UI/Dashboard.Gap-1
    value: 16

