$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
- Basic-[2.5,3.0)
- Basic.Energy-[2.0,3.0)
- EnergyCommunity-[5.0,6.0)
- System.Communication-[3.26,5.0)
- System.StreamData-[1.13,2.0)
- System.UI-[2.4,3.0)

# Shared RT queries over the master data (_trees, _energy_customers,
# _energy_operating_facilities, _energy_meter_consumer, _energy_meter_producer).
# Used by the EDA and Billing blueprints and by the Office Add-In's Excel import
# (blueprint Office.ExcelImport), and by the route /meteringDataGaps (gap days, AB#8299).
# Part of the EnergyCommunity.Base blueprint — see blueprint.yaml for the full file list.
entities:

# ─── Shared queries: Excel-import ────────────────────────────────────────
- rtId: 682f0020af1fe4dd0f346f3c
  ckTypeId: System/SimpleRtQuery-1
  associations: []
  attributes:
  - id: System/Name-1
    value: _trees
  - id: System/Query.CkTypeId-1
    value: Basic/Tree
  - id: System/Query.Columns-1
    value:
    - rtId
    - name
    - description
  - id: System/Query.Sorting-1
    value: []
  - id: System/Query.FieldFilter-1
    value: []

- rtId: 682f0758900aec7bc66dcb74
  ckTypeId: System/SimpleRtQuery-1
  associations: []
  attributes:
  - id: System/Name-1
    value: _energy_customers
  - id: System/Query.CkTypeId-1
    value: EnergyCommunity/Customer
  - id: System/Query.Columns-1
    value:
    - contact.legalEntityType
    - taxProcedureCreditNote
    - contact.salutation
    - contact.firstName
    - contact.lastName
    - contact.companyName
    - contact.address.street
    - contact.address.zipcode
    - contact.address.cityTown
    - contact.address.nationalCode
    - customerNumber
    - contact.taxIdentificationNumber
    - contact.companyRegisterNumber
    - contact.email
    - bankAccount.iban
    - bankAccount.swiftCode
    - bankAccount.bankName
    - bankAccount.accountHolder
  - id: System/Query.Sorting-1
    value: []
  - id: System/Query.FieldFilter-1
    value: []

- rtId: 682f0d3cce5a9c50f9241cc8
  ckTypeId: System/SimpleRtQuery-1
  associations: []
  attributes:
  - id: System/Name-1
    value: _energy_operating_facilities
  # EC v2 (ADR 0001): OperatingFacility moved to Basic.Energy — EnergyCommunity 4.x
  # no longer duplicates it.
  - id: System/Query.CkTypeId-1
    value: Basic.Energy/OperatingFacility
  - id: System/Query.Columns-1
    value:
    - address.street
    - address.zipcode
    - address.cityTown
    - address.nationalCode
    - facilityType
    - name
    - customer.energyCommunityCustomer->customerNumber
    - parent.basicCity->zipcode
  - id: System/Query.Sorting-1
    value: []
  - id: System/Query.FieldFilter-1
    value: []

- rtId: 682f1209ce5a9c50f9242880
  ckTypeId: System/SimpleRtQuery-1
  associations: []
  attributes:
  - id: System/Name-1
    value: _energy_meter_consumer
  - id: System/Query.CkTypeId-1
    value: EnergyCommunity/Consumer
  - id: System/Query.Columns-1
    value:
    - meteringPointNumber
    - name
    - energyConsumption
    - parent.basicEnergyOperatingFacility->name
    - parent.basicEnergyOperatingFacility->customer.energyCommunityCustomer->customerNumber
  - id: System/Query.Sorting-1
    value: []
  - id: System/Query.FieldFilter-1
    value: []

- rtId: 682f1218ce5a9c50f9242881
  ckTypeId: System/SimpleRtQuery-1
  associations: []
  attributes:
  - id: System/Name-1
    value: _energy_meter_producer
  - id: System/Query.CkTypeId-1
    value: EnergyCommunity/Producer
  - id: System/Query.Columns-1
    value:
    - meteringPointNumber
    - energyProductionCapacity
    - name
    - productionType
    - parent.basicEnergyOperatingFacility->name
    - parent.basicEnergyOperatingFacility->customer.energyCommunityCustomer->customerNumber
  - id: System/Query.Sorting-1
    value: []
  - id: System/Query.FieldFilter-1
    value: []

# ─── Gap days (AB#8299, route /meteringDataGaps) ─────────────────────────
# Same columns and filters as the EdaIntegration queries of the scheduled gap detection
# (ec0000000000000000000d16, 69c230e44f1e21ff43bfb1be, ec0000000000000000000d18): Base cannot
# reference the EdaIntegration seed. The periods query adds the rtId of the metering point as
# fourth column (the route answers it); the first three stay in the order the "gap days" scripts read.
- rtId: ec0000000000000000000a69
  ckTypeId: System/SimpleRtQuery-1
  associations: []
  attributes:
  - id: System/Query.CkTypeId-1
    value: Basic.Energy/EnergyMeasurement
  - id: System/Query.Columns-1
    value:
    - parent.basicEnergyMeteringPoint->meteringPointNumber
    - obisCode
  - id: System/Query.Sorting-1
    value: []
  - id: System/Query.FieldFilter-1
    value: []
  - id: System/Name-1
    value: pipeline_gap_anchors_base
  - id: System/Description-1
    value: Measurement anchors with the number of their metering point and their OBIS code (route /meteringDataGaps, AB#8299; the pipeline filters the billing registers).
  - id: System/Query.NavigationFilterMode-1
    value: 0

- rtId: ec0000000000000000000a6a
  ckTypeId: System/SimpleRtQuery-1
  associations: []
  attributes:
  - id: System/Query.CkTypeId-1
    value: EnergyCommunity/ParticipationPeriod
  - id: System/Query.Columns-1
    value:
    - meteringPoint.basicEnergyMeteringPoint->meteringPointNumber
    - timeRange.from
    - timeRange.to
    - meteringPoint.basicEnergyMeteringPoint->rtId
  - id: System/Query.Sorting-1
    value: []
  - id: System/Query.FieldFilter-1
    value: []
  - id: System/Name-1
    value: pipeline_gap_participation_periods
  - id: System/Description-1
    value: Participation periods with number, from, to and rtId of their metering point (route /meteringDataGaps, AB#8299).
  - id: System/Query.NavigationFilterMode-1
    value: 0

- rtId: ec0000000000000000000a6b
  ckTypeId: System/SimpleRtQuery-1
  associations: []
  attributes:
  - id: System/Query.CkTypeId-1
    value: Basic.Energy/EdaProcess
  - id: System/Query.Columns-1
    value:
    - meteringPointNumber
    - planned
    - rawMessage
  - id: System/Query.Sorting-1
    value: []
  - id: System/Query.FieldFilter-1
    value:
    - ckRecordId: System/FieldFilter-1
      attributes:
      - id: System/AttributePath-1
        value: name
      - id: System/FieldFilter.Operator-1
        value: 0
      - id: System/ComparisonValue-1
        value: CR_REQ_PT
    - ckRecordId: System/FieldFilter-1
      attributes:
      - id: System/AttributePath-1
        value: finished
      - id: System/FieldFilter.Operator-1
        value: 0
      - id: System/ComparisonValue-1
        value: false
  - id: System/Name-1
    value: pipeline_gap_open_data_requests
  - id: System/Description-1
    value: Open CR_REQ_PT processes with metering point, planned flag and stored message (route /meteringDataGaps, AB#8299; none on a tenant without EDA).
  - id: System/Query.NavigationFilterMode-1
    value: 0
