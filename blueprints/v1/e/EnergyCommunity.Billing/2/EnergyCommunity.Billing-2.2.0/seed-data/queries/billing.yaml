$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
- EnergyCommunity-[4.1,5.0)
- Basic.Energy-[1.3,2.0)
# 3.31 floor, not 3.26: the send pipelines below read BankAccountIban, BankAccountHolder
# and EmailFooterImage off EnergyCommunityConfiguration. On 3.26 those attributes simply do
# not exist, and the resolver cannot tell an attribute the model never declared from one an
# operator left blank - it substitutes nothing and warns, so offene-abrechnung asks a member
# to pay into an empty account. Refusing the install is the only place that difference is
# still visible.
- System.Communication-[3.31,4.0)
- System.Notification-[2.0,3.0)
- System.UI-[2.4,3.0)

# Queries the billing pipelines and reports read: five RT queries over the billing
# documents / items / metering points, plus the grouping aggregation over the raw
# energy-measurements archive that feeds the stream-data settlement.
# Part of the EnergyCommunity.Billing blueprint — see blueprint.yaml for the full file list.
entities:

# ─── Billing & reporting queries ─────────────────────────────────────────
- rtId: 682f4f297e558c7c4221c1df
  rtCreationDateTime: 2025-05-22T16:22:01.2530000Z
  rtChangedDateTime: 2025-05-23T13:09:05.8930000Z
  ckTypeId: System/SimpleRtQuery-1
  associations: []
  attributes:
  - id: System/Query.CkTypeId-1
    value: EnergyCommunity/BillingDocument
  - id: System/Query.Columns-1
    value:
    - timeRange.from
    - timeRange.to
    - billingDocumentState
    - documentNumber
    - billingType
    - grossTotal
    - documentDate
    - bankAccount.accountHolder
    - bankAccount.bankName
    - bankAccount.iban
    - bankAccount.swiftCode
    - contact.salutation
    - assignedTo.energyCommunityCustomer->customerNumber
    - contact.firstName
    - contact.lastName
    - contact.companyName
    - contact.companyRegisterNumber
    - contact.taxIdentificationNumber
    - contact.address.street
    - contact.address.zipcode
    - contact.address.street
    - contact.address.cityTown
    - contact.address.nationalCode
    - customerNumber
  - id: System/Query.Sorting-1
    value: []
  - id: System/Query.FieldFilter-1
    value: []
  - id: System/Name-1
    value: _energy_billing_documents

- rtId: 683023e8887d44e03806103c
  rtCreationDateTime: 2025-05-23T07:29:44.3210000Z
  rtChangedDateTime: 2025-05-23T09:48:15.2340000Z
  ckTypeId: System/SimpleRtQuery-1
  associations: []
  attributes:
  - id: System/Query.CkTypeId-1
    value: EnergyCommunity/BillingDocumentLineItem
  # EC v2 (ADR 0001): the AssignedBilling -> EnergyQuantity association is gone;
  # the line item carries quantity + billedTimeRange + the interval snapshot
  # itself, so the former assignedTo.energyCommunityEnergyQuantity->rtId column
  # is replaced by the line item's own quantity / billedTimeRange columns.
  - id: System/Query.Columns-1
    value:
    - billingType
    - grossAmount
    - netAmount
    - taxAmount
    - taxRate
    - unitPrice
    - quantity
    - billedTimeRange.from
    - billedTimeRange.to
    - intervalCount
    - parent.energyCommunityBillingDocument->documentNumber
    - meteringPoint.basicEnergyMeteringPoint->meteringPointNumber
  - id: System/Query.Sorting-1
    value: []
  - id: System/Query.FieldFilter-1
    value: []
  - id: System/Name-1
    value: _energy_billing_items

- rtId: 683022ee887d44e03806103b
  rtCreationDateTime: 2025-05-23T07:25:34.5420000Z
  rtChangedDateTime: 2025-06-10T20:09:00.0490000Z
  ckTypeId: System/SimpleRtQuery-1
  associations: []
  attributes:
  - id: System/Query.CkTypeId-1
    value: EnergyCommunity/BillingDocumentLineItem
  # EC v2 (ADR 0001 decision 4): the line item is self-contained — it persists
  # the billed quantity, the billed TimeRange and the interval/quality snapshot,
  # so the report no longer joins into per-interval EnergyQuantity data (that
  # type is gone). Metering-point context comes from the BilledMeteringPoint
  # association (MeteringPoint moved to Basic.Energy; Consumer/Producer are its
  # subtypes). NOTE: the tenant's Telerik billing report template
  # (misc/energy-community-deployment) binds to these column names/positions and
  # MUST be updated to match this shape (AB#4552 follow-up — out of this repo).
  - id: System/Query.Columns-1
    value:
    - parent.energyCommunityBillingDocument->rtId
    - parent.energyCommunityBillingDocument->contact.legalEntityType
    - parent.energyCommunityBillingDocument->taxProcedureCreditNote
    - parent.energyCommunityBillingDocument->timeRange.from
    - parent.energyCommunityBillingDocument->timeRange.to
    - unitPrice
    - grossAmount
    - taxRate
    - taxAmount
    - netAmount
    - billingType
    - quantity
    - billedTimeRange.from
    - billedTimeRange.to
    - intervalCount
    - intervalCountL1
    - intervalCountL2
    - intervalCountL3
    - intervalCountUnknown
    - meteringPoint.basicEnergyMeteringPoint->parent.basicEnergyOperatingFacility->name
    - meteringPoint.basicEnergyMeteringPoint->name
    - meteringPoint.basicEnergyMeteringPoint->meteringPointNumber
  - id: System/Query.Sorting-1
    value: []
  - id: System/Query.FieldFilter-1
    value: []
  - id: System/Name-1
    value: reporting_energy_billing_items

- rtId: 683177dcb90d979b8ae558a1
  rtCreationDateTime: 2025-05-24T07:40:12.2110000Z
  rtChangedDateTime: 2025-06-12T13:02:22.4410000Z
  ckTypeId: System/SimpleRtQuery-1
  associations: []
  attributes:
  - id: System/Query.CkTypeId-1
    value: EnergyCommunity/BillingDocument
  - id: System/Query.Columns-1
    value:
    - rtId
    - ckTypeId
    - assignedTo.energyCommunityCustomer->rtId
    - assignedTo.energyCommunityCustomer->contact.taxIdentificationNumber
    - billingDocumentState
    - timeRange.from
    - timeRange.to
    - taxProcedureCreditNote
  - id: System/Query.Sorting-1
    value: []
  - id: System/Query.FieldFilter-1
    value: []
  - id: System/Name-1
    value: pipeline_energy_billings

- rtId: 693996d37a64d9a8f73b3832
  rtCreationDateTime: 2025-12-10T15:50:43.8680000Z
  rtChangedDateTime: 2025-12-10T15:52:54.8650000Z
  ckTypeId: System/SimpleRtQuery-1
  associations: []
  attributes:
  # EC v2 (ADR 0001): EnergyCommunity/MeteringPoint was removed — metering points
  # are Basic.Energy/MeteringPoint (EnergyCommunity/Consumer and /Producer are its
  # subtypes; the query returns the concrete subtype instances). Columns stay
  # minimal — the settlement pipeline reads the metering point rtId + ckTypeId
  # from the QueryResultRow itself ($.RtId / $.CkTypeId), scopes the stream-data
  # query to the metering point's EnergyMeasurement anchors, and joins to the
  # billing document by customer [Values[1]].
  - id: System/Query.CkTypeId-1
    value: Basic.Energy/MeteringPoint
  - id: System/Query.Columns-1
    value:
    - meteringPointNumber
    - parent.basicEnergyOperatingFacility->customer.energyCommunityCustomer->rtId
  - id: System/Query.Sorting-1
    value:
    - ckRecordId: System/SortOrderItem-1
      attributes:
      - id: System/AttributePath-1
        value: meteringPointNumber
      - id: System/SortOrder-1
        value: 1
  - id: System/Query.FieldFilter-1
    value: []
  - id: System/Name-1
    value: pipeline_customer_meteringpoints

# ─── Stream-data settlement query (EC v2, ADR 0001 / AB#4552) ─────────────
# Replaces the removed EnergyCommunity/EnergyQuantity RT aggregation used by the
# 1.x billing. Grouped aggregation over the raw energy-measurements archive
# (ec0000000000000000000a01): SUM + COUNT of amount.value grouped by dataQuality
# (+ amount.unit). The settlement pipelines invoke it via GetQueryById@1 and
# supply the dynamic scope as node fieldFilters (the persisted From/To/rtIds stay
# blank — the node's static From/To config cannot take the HTTP-body period):
#   - rtId        IN  <the metering point's EnergyMeasurement anchor rtIds>
#   - window_start >= <billing period from>   (fully-contained interval rule)
#   - window_end   <= <billing period to>
# Output: one row per (dataQuality, amount.unit) present in scope,
#   Values = [dataQuality, amount.unit, amountvalue_sum, amountvalue_count].
# The pipeline sums amountvalue_sum over L1/L2 for the billed quantity and uses
# amountvalue_count per quality for the LineItem intervalCount* snapshot.
# NOTE: dataQuality is an INTEGER enum column in CrateDB — quality filtering /
# bucketing uses the integer keys (Unknown 0, L1 1, L2 2, L3 3), not the names.
- rtId: ec000000000000000000e001
  ckTypeId: System/GroupingAggregationSdQuery-1
  associations: []
  attributes:
  - id: System/Name-1
    value: billing-energy-by-quality
  - id: System/Description-1
    value: ''
  - id: System/Query.CkTypeId-1
    value: Basic.Energy/EnergyMeasurement
  - id: System/StreamDataQuery.ArchiveRtId-1
    value: ec0000000000000000000a01
  - id: System/Query.GroupByColumns-1
    value:
    - dataQuality
    - amount.unit
  - id: System/AggregationQueryColumns-1
    value:
    - ckRecordId: System/AggregationQueryColumn-1
      attributes:
      - id: System/AttributePath-1
        value: amount.value
      - id: System/AggregationType-1
        value: 4    # Sum
    - ckRecordId: System/AggregationQueryColumn-1
      attributes:
      - id: System/AttributePath-1
        value: amount.value
      - id: System/AggregationType-1
        value: 0    # Count
  - id: System/Query.NavigationFilterMode-1
    value: 0
  - id: System/StreamDataQuery.From-1
  - id: System/StreamDataQuery.To-1
  - id: System/StreamDataQuery.Limit-1
  - id: System/Query.FieldFilter-1
    value: []
