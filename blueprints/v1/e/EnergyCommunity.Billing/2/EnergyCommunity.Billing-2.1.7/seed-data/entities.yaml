- rtId: 68a83612de6bd740110e2068
  rtCreationDateTime: 2025-08-22T09:19:14.3610000Z
  rtChangedDateTime: 2025-08-22T12:23:36.4890000Z
  ckTypeId: System.Communication/Pipeline-1
  associations:
  - roleId: System/ParentChild-1
    targetRtId: 68a83612de6bd740110e2067
    targetCkTypeId: System.Communication/DataFlow-1
    attributes: []
  - roleId: System.Communication/Executes-1
    targetRtId: '670000000000000000000002'
    targetCkTypeId: System.Communication/Adapter-1
    attributes: []
  attributes:
  - id: System.Communication/DeploymentState-1
    value: 0
  - id: System/Name-1
    value: Mesh Pipeline
  - id: System/Enabled-1
    value: true
  - id: System.Communication/PipelineDefinition-1
    value: >
      triggers:
        - type: FromHttpRequest@1
          path: /cancelBillingDocument
          method: POST

      transformations:
        # Get the billing documents and filter by cancellable states (DRAFT, RELEASED, SENT)
        - type: GetRtEntitiesById@1
          description: Get billing documents in cancellable states
          targetPath: $.billingDocuments
          rtIdsPath: $.body.billingDocumentRtIds  # Billing document RT IDs from payload
          ckTypeId: EnergyCommunity/BillingDocument
          fieldFilters:
            - attributePath: billingDocumentState
              operator: In
              comparisonValue: [0, 1, 2]  # DRAFT, RELEASED, SENT states

        # Create update info for each billing document
        - type: ForEach@1
          description: Iterate billing documents to cancel them
          iterationPath: $.billingDocuments.Items
          mergePath: $.updates
          targetPath: $.updates
          transformations:
            - type: CreateUpdateInfo@1
              targetPath: $.updates._items
              updateKind: UPDATE
              ckTypeId: EnergyCommunity/BillingDocument
              rtIdPath: $.key.RtId
              attributeUpdates:
                - attributeName: BillingDocumentState
                  attributeValueType: Enum
                  value: 4 # Set to canceled state (4)

        # Flatten the updates array
        - type: Flatten@1
          path: $.updates[*]._items
          targetPath: $._result._items
          targetValueKind: Simple
          targetValueWriteMode: Overwrite

        # Apply the changes to cancel the billing documents
        - type: ApplyChanges@2
          entityUpdatesPath: $._result._items  # Path to the array of update info objects
  - id: System.Communication/StatusMessage-1
