        value: meteringPointNumber
      - id: System/SortOrder-1
        value: 1
  - id: System/Query.FieldFilter-1
    value: []
  - id: System/Name-1
    value: pipeline_customer_meteringpoints

# ─── Stream-data settlement query (EC v2, ADR 0001 / AB#4552) ─────────────
# Replaces the removed EnergyCommunity/EnergyQuantity RT aggregation used by the
# 1.x billing. Grouped aggregation over the raw energy-measurements archive
# (ec0000000000000000000a01): SUM + COUNT of amount.value grouped by dataQuality
# (+ amount.unit). The settlement pipelines invoke it via GetQueryById@1 and
# supply the dynamic scope as node fieldFilters (the persisted From/To/rtIds stay
# blank — the node's static From/To config cannot take the HTTP-body period):
#   - rtId        IN  <the metering point's EnergyMeasurement anchor rtIds>
#   - window_start >= <billing period from>   (fully-contained interval rule)
#   - window_end   <= <billing period to>
# Output: one row per (dataQuality, amount.unit) present in scope,
#   Values = [dataQuality, amount.unit, amountvalue_sum, amountvalue_count].
# The pipeline sums amountvalue_sum over L1/L2 for the billed quantity and uses
# amountvalue_count per quality for the LineItem intervalCount* snapshot.
# NOTE: dataQuality is an INTEGER enum column in CrateDB — quality filtering /
# bucketing uses the integer keys (Unknown 0, L1 1, L2 2, L3 3), not the names.
- rtId: ec000000000000000000e001
  ckTypeId: System/GroupingAggregationSdQuery-1
  associations: []
  attributes:
  - id: System/Name-1
    value: billing-energy-by-quality
  - id: System/Description-1
    value: ''
  - id: System/Query.CkTypeId-1
    value: Basic.Energy/EnergyMeasurement
  - id: System/StreamDataQuery.ArchiveRtId-1
    value: ec0000000000000000000a01
  - id: System/Query.GroupByColumns-1
    value:
    - dataQuality
    - amount.unit
  - id: System/AggregationQueryColumns-1
    value:
    - ckRecordId: System/AggregationQueryColumn-1
      attributes:
      - id: System/AttributePath-1
        value: amount.value
      - id: System/AggregationType-1
        value: 4    # Sum
    - ckRecordId: System/AggregationQueryColumn-1
      attributes:
      - id: System/AttributePath-1
        value: amount.value
      - id: System/AggregationType-1
        value: 0    # Count
  - id: System/Query.NavigationFilterMode-1
    value: 0
  - id: System/StreamDataQuery.From-1
  - id: System/StreamDataQuery.To-1
  - id: System/StreamDataQuery.Limit-1
  - id: System/Query.FieldFilter-1
    value: []


# ─── Billing pipelines ───────────────────────────────────────────────────

# Source: _calculation/energy-create-all-billing-documents.yaml
- rtId: 689e0cafc55441bd624d04cb
  rtCreationDateTime: 2025-08-14T16:19:59.7210000Z
  rtChangedDateTime: 2025-08-22T12:23:36.4570000Z
  ckTypeId: System.Communication/Pipeline-1
  associations:
    - roleId: System/ParentChild-1
      targetRtId: 689e0c9bc55441bd624d04ca
      targetCkTypeId: System.Communication/DataFlow-1
      attributes: []
    - roleId: System.Communication/Executes-1
      targetRtId: '670000000000000000000002'
      targetCkTypeId: System.Communication/Adapter-1
      attributes: []
  attributes:
    # AB#4633: ship DEPLOYED (2) to match the create-items pipelines — the create
    # chain (documents + items) must be live after tenant install; before this the
    # documents endpoint 404'd until a manual DeployDataFlow.
    - id: System.Communication/DeploymentState-1
      value: 2
    - id: System/Name-1
      value: Mesh Pipeline
    - id: System/Enabled-1
      value: true
    - id: System.Communication/PipelineDefinition-1
      value: >+
        triggers:
          - type: FromHttpRequest@1
            path: /createAllBillingDocumentsForPeriod
            method: POST
        transformations:
          - type: GetRtEntitiesByType@1
            description: Get specific customers by ID
            ckTypeId: EnergyCommunity/Customer
            targetPath: $.customers
            fieldFilters:
              - attributePath: State
                operator: Equals
                comparisonValue: 1 # Active
          - type: GetAssociationTargets@1
            description: get existing documents
            associationRoleId: EnergyCommunity/AssignedBilling
            graphDirection: Inbound
            originCkTypeId: EnergyCommunity/Customer
            targetCkTypeId: EnergyCommunity/BillingDocument
            originRtIdPath: $.customers.Items[*].RtId
            targetPath: $.billingDocuments
            fieldFilters:
              - attributePath: timeRange.from
                operator: Equals
                comparisonValuePath: $.body.timeRange.from
              - attributePath: timeRange.to
                operator: Equals
                comparisonValuePath: $.body.timeRange.to
              - attributePath: billingDocumentState
                operator: NotEquals
                comparisonValue: 4
          - type: Join@1
            description: Join customers and billings
            path: $.customers.Items[*]
            keyPath: $.RtId
            joinPath: $.billingDocuments[*]
            joinKeyPath: $.OriginRtId
            itemPath: $.billingDocument
          - type: Project@1
            fields:
              - path: "$.billingDocuments"
          - type: ForEach@1
            description: iterate customers
            iterationPath: $.customers.Items
            mergePath: $.updates
            targetPath: $.updates
            #targetValueWriteMode: Merge
            transformations:
              - type: If@1
                description: if no billing document
                path: $.key.billingDocument[0].Items[0].RtId
                operator: Equals
                value: null
                valueType: String
                transformations:
                  - type: CreateUpdateInfo@1
                    targetPath: $.updates._items
                    updateKind: INSERT
                    ckTypeId: EnergyCommunity/BillingDocument
                    rtIdPath: $.rtId
                    generateRtId: true
                    attributeUpdates:
                      - attributeName: CustomerNumber
                        attributeValueType: String
                        valuePath: $.key.Attributes.CustomerNumber
                      - attributeName: TaxProcedureCreditNote
                        attributeValueType: Enum
                        valuePath: $.key.Attributes.TaxProcedureCreditNote
                      - attributeName: Contact
                        attributeValueType: Record
                        valuePath: $.key.Attributes.Contact
                      - attributeName: BankAccount
                        attributeValueType: Record
                        valuePath: $.key.Attributes.BankAccount
                      - attributeName: TimeRange.From
                        attributeValueType: DateTime
                        valuePath: $.full.body.timeRange.from
                      - attributeName: TimeRange.To
                        attributeValueType: DateTime
                        valuePath: $.full.body.timeRange.to
                      - attributeName: BillingType
                        attributeValueType: Enum
                        value: "Debit"
                      - attributeName: GrossTotal
                        attributeValueType: Double
                        value: 0.0
                      - attributeName: BillingDocumentState
                        attributeValueType: Enum
                        value: "Draft"
                      - attributeName: DocumentDate
                        attributeValueType: DateTime
                        valuePath: $.full.body.documentDate
                  - type: CreateAssociationUpdate@1
                    targetPath: $.updates._assocUpdateItems
                    targetValueKind: Array
                    targetValueWriteMode: Append
                    updateKind: CREATE
                    originRtIdPath: $.updates._items.RtEntity.RtId
                    originCkTypeIdPath: $.updates._items.RtEntity.CkTypeId
                    targetRtIdPath: $.key.RtId
                    targetCkTypeIdPath: $.key.CkTypeId.SemanticVersionedFullName
                    associationRoleId: EnergyCommunity/AssignedBilling
          - type: Flatten@1
            path: $.updates[*]._items
            targetPath: $._result._items
            targetValueKind: Simple
            targetValueWriteMode: Overwrite
          - type: Flatten@1
            path: $.updates[*]._assocUpdateItems[*]
            targetPath: $._result.assocUpdateItems
            targetValueKind: Simple
            targetValueWriteMode: Overwrite
          - type: Project@1
            fields:
              - path: "$.customers"
              - path: "$.updates"
          - type: ApplyChanges@2
            entityUpdatesPath: $._result._items # Path to the array of update info objects
            associationUpdatesPath: $._result.assocUpdateItems # Path to the array of association update info objects
    - id: System.Communication/StatusMessage-1
- rtId: 689e0c9bc55441bd624d04ca
  rtCreationDateTime: 2025-08-14T16:19:39.1980000Z
  rtChangedDateTime: 2025-08-20T05:45:19.7600000Z
  ckTypeId: System.Communication/DataFlow-1
  associations: []
  attributes:
    - id: System/Name-1
      value: energy-create-all-billing-documents
    - id: System/Description-1

# Source: _calculation/energy-create-all-billing-items.yaml
# EC v2 (ADR 0001 decision 4 / AB#4552): settlement is computed from STREAM DATA.
# Per metering point the raw energy-measurements archive (ec0000000000000000000a01)
# is aggregated (SUM + COUNT of amount.value, grouped by dataQuality) over the
# billing period, scoped to the metering point's EnergyMeasurement anchor rtIds
# via the persisted GroupingAggregationSdQuery billing-energy-by-quality
# (ec000000000000000000e001) invoked by GetQueryById@1 with node fieldFilters
# (rtId IN anchors, window_start/window_end within the document period). The
# billed quantity sums L1 (1) + L2 (2) only; the per-quality COUNTs populate the
# LineItem intervalCount snapshot; billedTimeRange = the document period. The
# removed EnergyQuantity + its AssignedBilling associations are gone. dataQuality
# comes back as an INTEGER enum key (Unknown 0, L1 1, L2 2, L3 3).
- rtId: 689e0d78c55441bd624d04cf
  rtCreationDateTime: 2025-08-14T16:23:20.1660000Z
  rtChangedDateTime: 2026-07-27T00:00:00.0000000Z
  ckTypeId: System.Communication/Pipeline-1
  associations:
  - roleId: System/ParentChild-1
    targetRtId: 689e0d65c55441bd624d04ce
    targetCkTypeId: System.Communication/DataFlow-1
    attributes: []
  - roleId: System.Communication/Executes-1
    targetRtId: '670000000000000000000002'
    targetCkTypeId: System.Communication/Adapter-1
    attributes: []
  # AB#4633: GetPipelineConfigByWellKnownName@1 builds the GlobalConfiguration
  # from the pipeline's Uses associations — without this the settlement fails
  # (HTTP 500, "'EnergyCommunityConfiguration' not found in GlobalConfiguration")
  # on a fresh tenant. Target = the Base-seeded EnergyCommunityConfiguration.
  - roleId: System.Communication/Uses-1
    targetRtId: 69775cca547399077ac963a1
    targetCkTypeId: System.Communication/EnergyCommunityConfiguration-1
    attributes: []
  attributes:
  - id: System.Communication/DeploymentState-1
    value: 2
  - id: System/Name-1
    value: Mesh Pipeline
  - id: System.Communication/StatusMessage-1
  - id: System/Enabled-1
    value: true
  - id: System.Communication/PipelineDefinition-1
    value: |-
      triggers:
        - type: FromHttpRequest@1
          path: /createAllBillingItemsForPeriod
          method: POST
      transformations:
        # Load pricing/tax configuration
        - type: GetPipelineConfigByWellKnownName@1
          wellKnownName: "EnergyCommunityConfiguration"
          targetPath: $.config
        - type: SetPrimitiveValue@1
          targetPath: $.Configuration.taxRate
          valuePath: $.config.taxRate
          valueType: Double
        - type: SetPrimitiveValue@1
          targetPath: $.Configuration.farmerTaxRate
          valuePath: $.config.farmerTaxRate
          valueType: Double
        - type: SetPrimitiveValue@1
          targetPath: $.Configuration.consumerPrice
          valuePath: $.config.consumerPrice
          valueType: Double
        - type: SetPrimitiveValue@1
          targetPath: $.Configuration.producerPrice
          valuePath: $.config.producerPrice
          valueType: Double
        - type: Project@1
          fields:
            - path: $.config

        # Draft billing documents in the period with grossTotal still 0.
        # Values: [0]=doc rtId, [1]=doc ckTypeId, [2]=customer rtId,
        #         [3]=customer taxId, [4]=state, [5]=from, [6]=to, [7]=taxProcedure
        - type: GetQueryById@1
          description: get customer/billingdocuments in range
          queryRtId: "683177dcb90d979b8ae558a1"
          targetPath: $.documents
          fieldFilters:
            - attributePath: billingDocumentState
              operator: Equals
              comparisonValue: 0
            - attributePath: timeRange.from
              operator: Equals
              comparisonValuePath: $.body.timeRange.from
            - attributePath: timeRange.to
              operator: Equals
              comparisonValuePath: $.body.timeRange.to
            - attributePath: grossTotal
              operator: Equals
              comparisonValue: 0.0

        # Metering points of those customers (Basic.Energy/MeteringPoint; the row
        # carries the concrete Consumer/Producer subtype via $.RtId / $.CkTypeId).
        # Values: [0]=meteringPointNumber, [1]=customer rtId
        - type: GetQueryById@1
          description: get metering points
          queryRtId: "693996d37a64d9a8f73b3832"
          targetPath: $.meteringPoints
          fieldFilters:
            - attributePath: parent.basicEnergyOperatingFacility->customer.energyCommunityCustomer->rtId
              operator: In
              comparisonValuePath: $.documents.Rows[*].Values[2]

        # EnergyMeasurement anchors of those metering points (one per OBIS code).
        # anchors[*] = { OriginRtId: <metering point rtId>, Items: [ anchor... ] }
        - type: GetAssociationTargets@1
          description: get measurement anchors per metering point
          associationRoleId: System/ParentChild
          graphDirection: Inbound
          originCkTypeId: Basic.Energy/MeteringPoint
          targetCkTypeId: Basic.Energy/EnergyMeasurement
          originRtIdPath: $.meteringPoints.Rows[*].RtId
          targetPath: $.anchors

        - type: Join@1
          description: attach the anchor group to each metering point
          path: $.meteringPoints.Rows[*]
          keyPath: $.RtId
          joinPath: $.anchors[*]
          joinKeyPath: $.OriginRtId
          itemPath: $.anchorGroup

        - type: Join@1
          description: attach the metering points to their billing document (by customer)
          path: $.documents.Rows[*]
          keyPath: $.Values[2]
          joinPath: $.meteringPoints.Rows[*]
          joinKeyPath: $.Values[1]
          itemPath: $.meteringPoints

        - type: Project@1
          fields:
            - path: $.meteringPoints
            - path: $.anchors
            - path: $.path
            - path: $.method
            - path: $.body

        # process data
        - type: ForEach@1
          description: iterate billing documents
          maxDegreeOfParallelism: 1
          iterationPath: $.documents.Rows
          mergePath: $._updateItems
          targetPath: $._updateItems
          transformations:
            - type: ForEach@1
              description: iterate metering points of the document
              maxDegreeOfParallelism: 1
              iterationPath: $.key.meteringPoints
              mergePath: $.updates
              targetPath: $.updates
              transformations:
                # Stream-data settlement for this metering point over the document
                # period, scoped to its anchor rtIds. Rows: one per (dataQuality,
                # amount.unit); Values [0]=dataQuality(int) [1]=unit(int)
                # [2]=SUM(amount.value) [3]=COUNT(amount.value).
                - type: GetQueryById@1
                  description: stream-data settlement (sum + count per quality)
                  queryRtId: "ec000000000000000000e001"
                  targetPath: $.key.sd
                  fieldFilters:
                    - attributePath: rtId
                      operator: In
                      comparisonValuePath: $.key.anchorGroup[0].Items[*].RtId
                    - attributePath: window_start
                      operator: GreaterEqualThan
                      comparisonValuePath: $.full.full.body.timeRange.from
                    - attributePath: window_end
                      operator: LessEqualThan
                      comparisonValuePath: $.full.full.body.timeRange.to

                - type: SetPrimitiveValue@1
                  targetPath: $.key.data.sum
                  value: 0
                  valueType: Double
                - type: SetPrimitiveValue@1
                  targetPath: $.key.data.cntTotal
                  value: 0
                  valueType: Int
                - type: SetPrimitiveValue@1
                  targetPath: $.key.data.cntL1
                  value: 0
                  valueType: Int
                - type: SetPrimitiveValue@1
                  targetPath: $.key.data.cntL2
                  value: 0
                  valueType: Int
                - type: SetPrimitiveValue@1
                  targetPath: $.key.data.cntL3
                  value: 0
                  valueType: Int
                - type: SetPrimitiveValue@1
                  targetPath: $.key.data.cntUnknown
                  value: 0
                  valueType: Int

                - type: If@1
                  description: settlement rows present for this metering point (count > 0)
                  path: $.key.sd.Rows[0].Values[3]
                  operator: GreaterThan
                  value: 0
                  valueType: Int
                  transformations:
                    # billed quantity = SUM(amount.value) over L1 (1) + L2 (2)
                    - type: SumAggregation@1
                      description: sum L1/L2 quantity
                      targetPath: $.key.data.sum
                      aggregations:
                        - path: $.key.sd.Rows[*]
                          filterPath: $.Values[0]
                          comparisonValue: 1
                          aggregationPath: $.Values[2]
                          value: 1
                        - path: $.key.sd.Rows[*]
                          filterPath: $.Values[0]
                          comparisonValue: 2
                          aggregationPath: $.Values[2]
                          value: 1
                    # per-quality interval counts (COUNT is Values[3])
                    - type: SumAggregation@1
                      description: interval count total
                      targetPath: $.key.data.cntTotal
                      aggregations:
                        - path: $.key.sd.Rows[*]
                          aggregationPath: $.Values[3]
                          value: 1
                    - type: SumAggregation@1
                      description: interval count L1
                      targetPath: $.key.data.cntL1
                      aggregations:
                        - path: $.key.sd.Rows[*]
                          filterPath: $.Values[0]
                          comparisonValue: 1
                          aggregationPath: $.Values[3]
                          value: 1
                    - type: SumAggregation@1
                      description: interval count L2
                      targetPath: $.key.data.cntL2
                      aggregations:
                        - path: $.key.sd.Rows[*]
                          filterPath: $.Values[0]
                          comparisonValue: 2
                          aggregationPath: $.Values[3]
                          value: 1
                    - type: SumAggregation@1
                      description: interval count L3
                      targetPath: $.key.data.cntL3
                      aggregations:
                        - path: $.key.sd.Rows[*]
                          filterPath: $.Values[0]
                          comparisonValue: 3
                          aggregationPath: $.Values[3]
                          value: 1
                    - type: SumAggregation@1
                      description: interval count Unknown
                      targetPath: $.key.data.cntUnknown
                      aggregations:
                        - path: $.key.sd.Rows[*]
                          filterPath: $.Values[0]
                          comparisonValue: 0
                          aggregationPath: $.Values[3]
                          value: 1

                    # tax rate by metering point type (Producer feed-in is tax-free)
                    - type: Switch@1
                      description: Define tax rate
                      path: $.key.CkTypeId
                      valueType: String
                      cases:
                        - value: "EnergyCommunity/Consumer"
                          transformations:
                            - type: SetPrimitiveValue@1
                              targetPath: $.key.data.taxRate
                              valuePath: $.full.full.Configuration.taxRate
                              valueType: Double
                        - value: "EnergyCommunity/Producer"
                          transformations:
                            - type: SetPrimitiveValue@1
                              targetPath: $.key.data.taxRate
                              value: 0
                              valueType: Double
                    - type: If@1
                      description: Reduce tax rate for farmers (FarmerTaxProcedure)
                      path: $.full.key.Values[7]
                      operator: Equals
                      value: 3
                      valueType: Enum
                      transformations:
                        - type: If@1
                          description: Ensure producer
                          path: $.key.CkTypeId
                          operator: Equals
                          value: EnergyCommunity/Producer
                          valueType: String
                          transformations:
                            - type: SetPrimitiveValue@1
                              valuePath: $.full.full.Configuration.farmerTaxRate
                              valueType: Int
                              targetPath: $.key.data.taxRate

                    # unit price by metering point type
                    - type: Switch@1
                      description: Define unit price
                      path: $.key.CkTypeId
                      valueType: String
                      cases:
                        - value: "EnergyCommunity/Consumer"
                          transformations:
                            - type: SetPrimitiveValue@1
                              targetPath: $.key.data.unitPrice
                              valuePath: $.full.full.Configuration.consumerPrice
                              valueType: Double
                        - value: "EnergyCommunity/Producer"
                          transformations:
                            - type: SetPrimitiveValue@1
                              targetPath: $.key.data.unitPrice
                              valuePath: $.full.full.Configuration.producerPrice
                              valueType: Double
                    - type: DataMapping@1
                      description: Define billingType
                      path: $.key.CkTypeId
                      targetPath: $.key.data.billingType
                      sourceValueType: String
                      targetValueType: String
                      mappings:
                        - sourceValue: EnergyCommunity/Consumer
                          targetValue: "Debit"
                          description: "consumer"
                        - sourceValue: EnergyCommunity/Producer
                          targetValue: "Credit"
                          description: "producer"

                    # calculations
                    - type: Math@1
                      description: calc net amount (unit price * quantity)
                      path: $.key.data
                      itemPath: $.sum
                      operation: Multiply
                      valuePath: $.key.data.unitPrice
                      itemTargetPath: $.netAmount
                    - type: Math@1
                      description: calc tax factor (tax rate / 100)
                      path: $.key.data
                      itemPath: $.taxRate
                      operation: Divide
                      value: 100
                      itemTargetPath: $.taxFactor
                    - type: Math@1
                      description: calc tax amount (tax factor * netAmount)
                      path: $.key.data
                      itemPath: $.netAmount
                      operation: Multiply
                      valuePath: $.key.data.taxFactor
                      itemTargetPath: $.taxAmount
                    - type: Math@1
                      description: calc gross amount (netAmount + taxAmount)
                      path: $.key.data
                      itemPath: $.netAmount
                      operation: Add
                      valuePath: $.key.data.taxAmount
                      itemTargetPath: $.grossAmount

                    - type: CreateUpdateInfo@1
                      description: create billing document line item
                      targetPath: $.updates._items
                      updateKind: INSERT
                      ckTypeId: EnergyCommunity/BillingDocumentLineItem
                      rtIdPath: $.rtId
                      generateRtId: true
                      attributeUpdates:
                        - attributeName: GrossAmount
                          attributeValueType: Double
                          valuePath: $.key.data.grossAmount
                        - attributeName: UnitPrice
                          attributeValueType: Double
                          valuePath: $.key.data.unitPrice
                        - attributeName: BillingType
                          attributeValueType: Enum
                          valuePath: $.key.data.billingType
                        - attributeName: TaxRate
                          attributeValueType: Double
                          valuePath: $.key.data.taxRate
                        - attributeName: TaxAmount
                          attributeValueType: Double
                          valuePath: $.key.data.taxAmount
                        - attributeName: NetAmount
                          attributeValueType: Double
                          valuePath: $.key.data.netAmount
                        - attributeName: Quantity
                          attributeValueType: Double
                          valuePath: $.key.data.sum
                        - attributeName: BilledTimeRange.From
                          attributeValueType: DateTime
                          valuePath: $.full.key.Values[5]
                        - attributeName: BilledTimeRange.To
                          attributeValueType: DateTime
                          valuePath: $.full.key.Values[6]
                        - attributeName: IntervalCount
                          attributeValueType: Integer
                          valuePath: $.key.data.cntTotal
                        - attributeName: IntervalCountL1
                          attributeValueType: Integer
                          valuePath: $.key.data.cntL1
                        - attributeName: IntervalCountL2
                          attributeValueType: Integer
                          valuePath: $.key.data.cntL2
                        - attributeName: IntervalCountL3
                          attributeValueType: Integer
                          valuePath: $.key.data.cntL3
                        - attributeName: IntervalCountUnknown
                          attributeValueType: Integer
                          valuePath: $.key.data.cntUnknown
                    - type: CreateAssociationUpdate@1
                      description: Assign line item to its billing document (parent)
                      targetPath: $.updates._assocUpdateItems
                      targetValueKind: Array
                      targetValueWriteMode: Append
                      updateKind: CREATE
                      originRtIdPath: $.updates._items.RtId
                      originCkTypeIdPath: $.updates._items.CkTypeId
                      targetRtIdPath: $.full.key.Values[0]
                      targetCkTypeIdPath: $.full.key.CkTypeId
                      associationRoleId: System/ParentChild
                    - type: CreateAssociationUpdate@1
                      description: Assign the billed metering point
                      targetPath: $.updates._assocUpdateItems
                      targetValueKind: Array
                      targetValueWriteMode: Append
                      updateKind: CREATE
                      originRtIdPath: $.updates._items.RtId
                      originCkTypeIdPath: $.updates._items.CkTypeId
                      targetRtIdPath: $.key.RtId
                      targetCkTypeIdPath: $.key.CkTypeId
                      associationRoleId: EnergyCommunity/BilledMeteringPoint

            - type: Flatten@1
              path: $.updates[*]._items
              targetPath: $._updateItems._items
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
            - type: Flatten@1
              path: $.updates[*]._assocUpdateItems[*]
              targetPath: $._updateItems._assocUpdateItems
              targetValueKind: Simple
              targetValueWriteMode: Overwrite
            - type: Project@1
              fields:
                - path: $.updates

            - type: SumAggregation@1
              description: billing sum (debit positive, credit negative)
              targetPath: $.key._billing.sum
              aggregations:
                - path: $._updateItems._items[*]
                  filterPath: $.RtEntity.Attributes.BillingType
                  comparisonValue: 0
                  aggregationPath: $.RtEntity.Attributes.GrossAmount
                  value: 1
                - path: $._updateItems._items[*]
                  filterPath: $.RtEntity.Attributes.BillingType
                  comparisonValue: 1
                  aggregationPath: $.RtEntity.Attributes.GrossAmount
                  value: -1

            - type: SetPrimitiveValue@1
              value: "Debit"
              targetPath: $.key._billing.billingType
            - type: If@1
              description: credit
              path: $.key._billing.sum
              operator: LessEqualsThan
              value: 0
              valueType: Double
              transformations:
                - type: SetPrimitiveValue@1
                  value: "Credit"
                  targetPath: $.key._billing.billingType
            - type: CreateUpdateInfo@1
              description: update billing document
              targetPath: $._updateItems._items
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              ckTypeId: EnergyCommunity/BillingDocument
              rtIdPath: $.key.Values[0]
              attributeUpdates:
                - attributeName: GrossTotal
                  attributeValueType: Double
                  valuePath: $.key._billing.sum
                - attributeName: BillingType
                  attributeValueType: Enum
                  valuePath: $.key._billing.billingType

        - type: Flatten@1
          path: $._updateItems[*]._items[*]
          targetPath: $._result.billingItems
          targetValueKind: Simple
          targetValueWriteMode: Overwrite
        - type: Flatten@1
          path: $._updateItems[*]._assocUpdateItems[*]
          targetPath: $._result.assocUpdateItems
          targetValueKind: Simple
          targetValueWriteMode: Overwrite
        - type: Project@1
          fields:
            - path: "$.documents"
            - path: "$._updateItems"

        - type: ApplyChanges@2
          entityUpdatesPath: $._result.billingItems
          associationUpdatesPath: $._result.assocUpdateItems
