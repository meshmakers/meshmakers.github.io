- rtId: 689e35bb0b31042892179019
  rtCreationDateTime: 2025-08-14T19:15:07.9380000Z
  rtChangedDateTime: 2025-08-22T12:23:36.4740000Z
  ckTypeId: System.Communication/Pipeline-1
  associations:
    - roleId: System/ParentChild-1
      targetRtId: 689e35aa0b31042892179018
      targetCkTypeId: System.Communication/DataFlow-1
      attributes: []
    - roleId: System.Communication/Executes-1
      targetRtId: '670000000000000000000002'
      targetCkTypeId: System.Communication/Adapter-1
      attributes: []
  attributes:
    - id: System.Communication/DeploymentState-1
      value: 0
    - id: System/Name-1
      value: Mesh Pipeline
    - id: System/Enabled-1
      value: true
    - id: System.Communication/PipelineDefinition-1
      value: >+
        triggers:
          - type: FromHttpRequest@1
            path: /releaseAllBillingDocumentForPeriod
            method: POST
        
        transformations:
          # GetRtEntitiesByType to all billing documents for a period and verify its in the staus "DRAFT"
          - type: GetRtEntitiesByType@1
            description: Get the billing document and filter by status draft
            targetPath: $.billingDocuments
            ckTypeId: EnergyCommunity/BillingDocument
            skip: 0
            take: 5
            fieldFilters:
              - attributePath: billingDocumentState
                operator: Equals
                comparisonValue: 0
              - attributePath: timeRange.from
                operator: Equals
                comparisonValuePath: $.body.timeRange.from
              - attributePath: timeRange.to
                operator: Equals
                comparisonValuePath: $.body.timeRange.to
              - attributePath: grossTotal
                operator: NotEquals
                comparisonValue: 0.0
          - type: ForEach@1
            description: iterate billing documents
            iterationPath: $.billingDocuments.Items
            mergePath: $.updates
            targetPath: $.updates
            transformations:
              - type: If@1
                description: Check if billing document was found and is in status DRAFT
                operator: Equals
                path: $.key.Attributes.BillingDocumentState
                value: 0
                valueType: Integer
                transformations:
                  # When we didn't find a billing document we return (IfNode?)
                  - type: GenerateAndStoreReport@1
                    description: Call the reporting API to generate and store the Billing Document
                    # AB#4554: GenerateAndStoreReport@1 exposes no *Path variant for
                    # reportDefinitionUri / reportFileNamePrefix (literal-only in the node
                    # schema), so these stay tenant-neutral literals instead of resolving
                    # from EnergyCommunityConfiguration. Tenants that need a custom report
                    # template use the single-document /releaseBillingDocument pipeline
                    # (MakeHttpRequest@1), which IS config-driven.
                    targetPath: $.reportDetails
                    fileSystemFolderUri: /
                    reportDefinitionUri: Billing.trdp
                    reportFileNamePrefix: Billing_
                    relatedRtIdPath: $.key.RtId
                    relatedCkTypeId: EnergyCommunity/BillingDocument
                    reportParameters:
                      - name: billingDocumentRtId
                        valuePath: $.key.RtId  # Billing document RT ID from payload
                  - type: CreateUpdateInfo@1
                    targetPath: $.updates._items
                    targetValueKind: Array
                    updateKind: UPDATE
                    ckTypeId: EnergyCommunity/BillingDocument
                    rtIdPath: $.key.RtId
                    attributeUpdates:
                      - attributeName: BillingDocumentState
                        attributeValueType: Enum
                        value: 1
                  - type: ApplyChanges@2 # we update here item-by-item
                    entityUpdatesPath: $.updates._items
          - type: Flatten@1
            path: $.updates[*]._items[*]
            targetPath: $._result._items
            targetValueKind: Simple
            targetValueWriteMode: Overwrite
          - type: Project@1
            fields:
              - path: "$.path"
              - path: "$.method"
              - path: "$.body"
              - path: "$.billingDocuments"
              - path: "$.updates"
        
          # when the http call does not succeed the next nodes are not executed. so we can be sure, we get a path to the report.
          # we have to get the report file information
          # we create a association between the billing document and the report file
          # we create a update item that sets the billing document status to "RELEASED"
          # we apply changes
    - id: System.Communication/StatusMessage-1

