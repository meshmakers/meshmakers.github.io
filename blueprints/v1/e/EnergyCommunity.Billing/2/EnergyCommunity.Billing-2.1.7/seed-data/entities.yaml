- rtId: 689f3398ae5c4c800f3f6a42
  rtCreationDateTime: 2025-08-15T13:18:16.1370000Z
  rtChangedDateTime: 2025-08-15T14:52:27.7240000Z
  ckTypeId: System.Communication/Pipeline-1
  associations:
  - roleId: System/ParentChild-1
    targetRtId: 689f3368ae5c4c800f3f6a41
    targetCkTypeId: System.Communication/DataFlow-1
    attributes: []
  - roleId: System.Communication/Executes-1
    targetRtId: '670000000000000000000002'
    targetCkTypeId: System.Communication/Adapter-1
    attributes: []
  # AB#4554: Uses → EnergyCommunityConfiguration so the BCC address resolves
  # config-driven (notificationEmailContact) via GetPipelineConfigByWellKnownName@1.
  - roleId: System.Communication/Uses-1
    targetRtId: 69775cca547399077ac963a1
    targetCkTypeId: System.Communication/EnergyCommunityConfiguration-1
    attributes: []
  attributes:
  - id: System.Communication/DeploymentState-1
    value: 0
  - id: System/Name-1
    value: Mesh Pipeline
  - id: System/Enabled-1
    value: true
  - id: System.Communication/PipelineDefinition-1
    value: >
      triggers:
        - type: FromHttpRequest@1
          path: /sendAllBillingDocumentsForPeriod
          method: POST
      transformations:
        # AB#4554: load config so the BCC address resolves config-driven.
        - type: GetPipelineConfigByWellKnownName@1
          wellKnownName: "EnergyCommunityConfiguration"
          targetPath: $.config
        # AB#2569: the community bank details are read from the runtime entity, not from
        # $.config above. GetPipelineConfigByWellKnownName@1 hands the pipeline a DTO the
        # communication controller serialises through the CK model compiled into its own
        # binary, so an attribute added to the tenant model is silently dropped until the
        # service itself ships that CK version. Verified against a tenant with System.Communication
        # 3.31.0 imported: the typed config had no BankAccount* keys at all, while this lookup
        # returned both with their values.
        - type: GetRtEntitiesByType@1
          description: read the community configuration as a runtime entity
          ckTypeId: System.Communication/EnergyCommunityConfiguration
          targetPath: $.communityConfig
          take: 1
        - type: GetRtEntitiesByType@1
          description: Get the billing document and filter by status draft
          targetPath: $.billingItems
          ckTypeId: EnergyCommunity/BillingDocument
          fieldFilters:
            - attributePath: billingDocumentState
              operator: Equals
              comparisonValue: 1
            - attributePath: timeRange.from
              operator: Equals
              comparisonValuePath: $.body.timeRange.from
            - attributePath: timeRange.to
              operator: Equals
              comparisonValuePath: $.body.timeRange.to
        - type: GetAssociationTargets@1
          description: get file system items for download
          associationRoleId: System/Related
          graphDirection: Inbound
          originCkTypeId: EnergyCommunity/BillingDocument
          targetCkTypeId: System.Reporting/FileSystemItem
          originRtIdPath: $.billingItems.Items[*].RtId
          targetPath: $.fileSystemItems
        - type: GetAssociationTargets@1
          description: get customers for billing items
          associationRoleId: EnergyCommunity/AssignedBilling
          graphDirection: Outbound
          originCkTypeId: EnergyCommunity/BillingDocument
          targetCkTypeId: EnergyCommunity/Customer
          originRtIdPath: $.billingItems.Items[*].RtId
          targetPath: $.customers
        - type: Join@1
          description: Join billing items with file system items
          path: $.billingItems.Items[*]
          keyPath: $.RtId
          joinPath: $.fileSystemItems[*]
          joinKeyPath: $.OriginRtId
          itemPath: $.fileSystemItem
        - type: Join@1
          description: Join billing items with customers
          path: $.billingItems.Items[*]
          keyPath: $.RtId
          joinPath: $.customers[*]
          joinKeyPath: $.OriginRtId
          itemPath: $.customer
        - type: ForEach@1
          description: iterate billing items and send emails sequentially
          iterationPath: $.billingItems.Items
          mergePath: $.results
          targetPath: $.results
          transformations:
            - type: If@1
              description: check if file system item exists
              path: $.key.fileSystemItem[0].Items[0].RtId
              operator: NotEquals
              valueType: String
              value: null
              transformations:
                - type: If@1
                  description: check if cusomer exists
                  path: $.key.customer[0].Items[0].RtId
                  operator: NotEquals
                  valueType: String
                  value: null
                  transformations:
                    - type: GetNotificationTemplate@1
                      # AB#4554: neutral seeded template name (tenant-neutral).
                      notificationTemplateName: billing-quarterly-q2
                      targetPath: $.key.emailBody
                      subjectTargetPath: $.key.emailSubject
                      # AB#2570: the editor lets an author declare PLAIN or HTML, and until this
                      # path existed that choice reached nobody - every body went through Markdig.
                      renderingTypeTargetPath: $.key.emailRenderingType
                    # AB#2569: one resolver for every send path. Replaced two PlaceholderReplace@1 rule
                    # blocks generated per pipeline plus hand-written converter nodes - a fourth send path
                    # meant a fourth copy, and a token wired here but not there produced different mail
                    # from one template. A token whose source this path does not supply fails the node
                    # rather than rendering blank. ForEach@1 leaves ContinueOnError unset here, so the first
                    # refusal aborts the whole batch - the loud end of the choice, on purpose.
                    #
                    # What aborting does NOT do is undo the recipients already served. A refusal the template
                    # causes trips on the first iteration and nothing goes out, but one a single recipient
                    # causes - a typed address matching no customer - trips mid-run, and everybody ahead of it
                    # already has their mail. The response carries the failure, not the count, so re-running
                    # the same batch mails those recipients twice. Fix the offending recipient and send the
                    # remainder, rather than repeating the batch.
                    - type: ResolveNotificationPlaceholders@1
                      subjectPath: $.key.emailSubject
                      subjectTargetPath: $.renderedSubject
                      bodyPath: $.key.emailBody
                      bodyTargetPath: $.renderedBody
                      communityConfigPath: $.full.communityConfig.Items[0]
                      renderingTypePath: $.key.emailRenderingType
                      customerPath: $.key
                      billingDocumentPath: $.key
                      # Must equal the contentId on the SendEMail@2 attachment below. They are two halves of
                      # one reference and nothing checks them: rename one and the body keeps an <img> pointing
                      # at a cid nobody attached, which the node cannot report because it only strips a
                      # reference whose own attachment went missing.
                      logoContentId: community-footer
                    - type: SendEMail@2
                      # AB#4554: literal-only serverConfiguration → tenant-neutral name.
                      serverConfiguration: billing-smtp
                      subjectPath: $.renderedSubject
                      path: $.renderedBody
                      bodyFormatPath: $.key.emailRenderingType
                      toPath: $.key.customer[0].Items[0].Attributes.Contact.Attributes.Email
                      # BCC resolves config-driven from notificationEmailContact.
                      bccPath: $.full.config.notificationEmailContact
                      attachments:
                        - binaryIdPath: $.key.fileSystemItem[0].Items[0].Attributes.Content.BinaryId
                          fileName: Abrechnung.pdf
                          contentType: application/pdf
                        # AB#2570: the community's footer image, addressable as cid:community-footer.
                        # Optional - a community without one still gets its billing mail.
                        - binaryIdPath: $.full.communityConfig.Items[0].Attributes.EmailFooterImage.BinaryId
                          fileNamePath: $.full.communityConfig.Items[0].Attributes.EmailFooterImage.Filename
                          contentTypePath: $.full.communityConfig.Items[0].Attributes.EmailFooterImage.ContentType
                          fileName: footer.png
                          contentType: image/png
                          contentId: community-footer
                          optional: true
                    - type: CreateUpdateInfo@1
                      targetPath: $.updates._items
                      updateKind: UPDATE
                      targetValueKind: Array
                      ckTypeId: EnergyCommunity/BillingDocument
                      rtIdPath: $.key.RtId
                      attributeUpdates:
                        - attributeName: BillingDocumentState
                          attributeValueType: Enum
                          value: "SENT"
                    - type: ApplyChanges@2
                      description: apply state change immediately after email sent
                      entityUpdatesPath: $.updates._items
  - id: System.Communication/StatusMessage-1

