# ─── Ad-hoc member messaging (AB#4292) ───────────────────────────────────
# Generic send pipeline: sends a notification template to an explicit list of
# recipient email addresses. The frontend (energy-community app) resolves the
# audience (manual addresses / a single customer / all active members) and posts
# { notificationTemplateRtWellKnownName, toAddresses[] } to /sendMessage.
- rtId: ec000000000000000000d001
  ckTypeId: System.Communication/DataFlow-1
  associations: []
  attributes:
  - id: System/Name-1
    value: energy-send-message
  - id: System/Description-1
    value: Sends a notification template to an explicit list of recipient email addresses (ad-hoc member messaging).
- rtId: ec000000000000000000d002
  ckTypeId: System.Communication/Pipeline-1
  associations:
  - roleId: System/ParentChild-1
    targetRtId: ec000000000000000000d001
    targetCkTypeId: System.Communication/DataFlow-1
    attributes: []
  - roleId: System.Communication/Executes-1
    targetRtId: '670000000000000000000002'
    targetCkTypeId: System.Communication/Adapter-1
    attributes: []
