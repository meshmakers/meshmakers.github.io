  # subtypes; the query returns the concrete subtype instances). Columns stay
  # minimal — the settlement pipeline reads the metering point rtId + ckTypeId
  # from the QueryResultRow itself ($.RtId / $.CkTypeId), scopes the stream-data
  # query to the metering point's EnergyMeasurement anchors, and joins to the
  # billing document by customer [Values[1]].
  - id: System/Query.CkTypeId-1
