    - intervalCountL2
    - intervalCountL3
    - intervalCountUnknown
    - meteringPoint.basicEnergyMeteringPoint->parent.basicEnergyOperatingFacility->name
    - meteringPoint.basicEnergyMeteringPoint->name
    - meteringPoint.basicEnergyMeteringPoint->meteringPointNumber
  - id: System/Query.Sorting-1
    value: []
  - id: System/Query.FieldFilter-1
    value: []
  - id: System/Name-1
    value: reporting_energy_billing_items

- rtId: 683177dcb90d979b8ae558a1
  rtCreationDateTime: 2025-05-24T07:40:12.2110000Z
  rtChangedDateTime: 2025-06-12T13:02:22.4410000Z
  ckTypeId: System/SimpleRtQuery-1
  associations: []
  attributes:
  - id: System/Query.CkTypeId-1
    value: EnergyCommunity/BillingDocument
  - id: System/Query.Columns-1
    value:
