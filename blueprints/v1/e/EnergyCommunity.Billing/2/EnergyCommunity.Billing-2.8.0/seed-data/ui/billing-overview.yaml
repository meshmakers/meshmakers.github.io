  - id: System.UI/DashboardWidget.DataSourceRtId-1
    value: ec0000000000000000000a22
  - id: System.UI/DashboardWidget.Config-1
    value: '{"chartType":"pie","categoryField":"obiscode","valueField":"amountvalue_sum","showLabels":false,"showLegend":true,"legendPosition":"right","queryFamily":"streamData","queryName":"energy-measurements-aggregation-by-obiscode","queryRtId":"ec0000000000000000000a22","filters":[{"attributePath":"obisCode","operator":"IN","comparisonValue":"[[[[\"1-1:2.9.0 G.03\", \"1-1:2.9.0 G.01T\", \"1-1:2.9.0 P.01T\"]]]]"}]}'

