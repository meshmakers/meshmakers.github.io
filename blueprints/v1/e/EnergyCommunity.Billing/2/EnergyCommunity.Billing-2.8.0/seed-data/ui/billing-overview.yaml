# Widget 6: Billed energy amounts by tax procedure (in kWh) (table) — e05.
# Explicit columns so the quantity renders with two decimals: `format` is a DecimalPipe
# digits info and needs @meshmakers/octo-meshboard with TableColumn.format (AB#5643);
# an older library ignores it and shows up to three decimals. A column `field` is the
# query column with every '.' replaced by '_' - the table stores row values under that
# sanitized name (table-widget-data-source.directive.ts, sanitizeFieldName), so the
# raw attribute path renders an empty column.
- rtId: ec0000000000000000000f07
  ckTypeId: System.UI/DashboardWidget-1
  associations:
  - roleId: System/ParentChild-1
    targetRtId: ec0000000000000000000f01
    targetCkTypeId: System.UI/Dashboard-1
    attributes: []
  attributes:
  - id: System/Name-1
    value: Billed energy amounts by tax procedure (in kWh)
  - id: System.UI/DashboardWidget.Type-1
    value: table
  - id: System.UI/DashboardWidget.Col-1
    value: 1
  - id: System.UI/DashboardWidget.Row-1
    value: 3
  - id: System.UI/DashboardWidget.ColSpan-1
    value: 4
  - id: System.UI/DashboardWidget.RowSpan-1
    value: 3
  - id: System.UI/DashboardWidget.DataSourceType-1
    value: systemQuery
  - id: System.UI/DashboardWidget.DataSourceCkTypeId-1
    value: ''
  - id: System.UI/DashboardWidget.DataSourceRtId-1
    value: ec0000000000000000000e05
  - id: System.UI/DashboardWidget.Config-1
    value: '{"columns":[{"field":"parent_energyCommunityBillingDocument->assignedTo_energyCommunityCustomer->taxProcedureCreditNote","title":"Tax procedure"},{"field":"billingType","title":"Billing type"},{"field":"quantity_sum","title":"Quantity (kWh)","dataType":"numeric","format":"1.2-2"}],"sorting":[],"filters":[{"attributePath":"parent.energyCommunityBillingDocument->timeRange.from","operator":"GREATER_EQUAL_THAN","comparisonValue":"${timeRangeFrom}"},{"attributePath":"parent.energyCommunityBillingDocument->timeRange.to","operator":"LESS_EQUAL_THAN","comparisonValue":"${timeRangeTo}"}],"pageSize":10,"sortable":true,"queryName":"meshboard_billing_item_by_tax_procedure_note","queryRtId":"ec0000000000000000000e05"}'

