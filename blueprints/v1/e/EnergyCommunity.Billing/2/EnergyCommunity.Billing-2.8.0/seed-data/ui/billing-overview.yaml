# Widget 8: Energy Amounts produced vs. consumed (in kWh) (pie) — CONVERTED to
# STREAM DATA (Board 2 counterpart a22 by-OBIS). queryFamily streamData.
# Filtered to the three community series exactly like the energy-statistics board
# (AB#5643): consumed from the community 1-1:2.9.0 G.03, produced 1-1:2.9.0 G.01T,
# surplus 1-1:2.9.0 P.01T. Unfiltered, a22 sums every register a metering point
# carries - eight slices on eegroider, four of them duplicates (G.01 = G.01T,
# G.03 = G.03R). The filter string is copied verbatim from energy-statistics.yaml.
- rtId: ec0000000000000000000f09
