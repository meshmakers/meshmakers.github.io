$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
- EnergyCommunity-[4.1,5.0)
- Basic.Energy-[1.3,2.0)
# 3.31 floor, not 3.26: the send pipelines below read BankAccountIban, BankAccountHolder
# and EmailFooterImage off EnergyCommunityConfiguration. On 3.26 those attributes simply do
# not exist, and the resolver cannot tell an attribute the model never declared from one an
# operator left blank - it substitutes nothing and warns, so offene-abrechnung asks a member
# to pay into an empty account. Refusing the install is the only place that difference is
# still visible.
- System.Communication-[3.31,4.0)
- System.Notification-[2.0,3.0)
- System.UI-[2.4,3.0)

# The billing-overview MeshBoard (AB#4578): Dashboard `energy-community-accounting`
# and its ten widgets.
# Part of the EnergyCommunity.Billing blueprint — see blueprint.yaml for the full file list.
entities:

# ─── Billing MeshBoard: BillingOverview dashboard (EC v2, AB#4578 — Board 1) ──
# System.UI/Dashboard `energy-community-accounting` ("Übersicht") + 10 widgets.
# Adopts and converts the retired 1.x board
# (misc/energy-community-deployment/data/boards/BillingOverview.yaml): the 8
# billing widgets stay on the EC v2 runtime types (bound to the six
# meshboard_* GroupingAggregationRtQuery entities above by rtId, e01..e06), and
# the 2 metering-value widgets convert to STREAM DATA exactly like Board 2 —
# they bind to the persisted SD queries in EnergyCommunity.Base by rtId
# (a22 by-OBIS, a23 by-data-quality) with queryFamily "streamData" so the widget
# skips the runtime-query lookup. Requires the service-managed System.UI CK model
# (octo-platform-services). Time window is supplied by the dashboard time filter
# as ${timeRangeFrom}/${timeRangeTo} (billing widgets) and as
# StreamDataArguments.from/to (the two SD widgets).
#
# Time filter: the source board defaulted to a 2025-Q4 quarter selection; here it
# defaults to the custom window 2026-07-01..2026-08-01 (matching the EC 4.0 demo
# billing document period on the test tenants, as Board 2 does) so the
# time-filtered billing/SD widgets resolve against seeded data out of the box.
# rtId scheme: dashboard = ec00…0f01, widgets = ec00…0f02..0f0b.

# Dashboard
- rtId: ec0000000000000000000f01
  ckTypeId: System.UI/Dashboard-1
  rtWellKnownName: energy-community-accounting
  associations: []
  attributes:
  - id: System/Name-1
    value: Übersicht
  - id: System/Description-1
    value: |-
      Energiegemeinschaft
      ---MESHBOARD_VARIABLES---
      {"timeFilter":{"enabled":true,"defaultSelection":{"type":"custom","customFrom":"2026-07-01T00:00:00.000Z","customTo":"2026-08-01T00:00:00.000Z"},"selection":{"type":"custom","customFrom":"2026-07-01T00:00:00.000Z","customTo":"2026-08-01T00:00:00.000Z"}}}
  - id: System.UI/Dashboard.Columns-1
    value: 6
  - id: System.UI/Dashboard.RowHeight-1
    value: 200
  - id: System.UI/Dashboard.Gap-1
    value: 16

