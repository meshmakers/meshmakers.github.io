$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
- EnergyCommunity-[4.1,5.0)
- Basic.Energy-[1.3,2.0)
# 3.31 floor, not 3.26: the send pipelines below read BankAccountIban, BankAccountHolder
# and EmailFooterImage off EnergyCommunityConfiguration. On 3.26 those attributes simply do
# not exist, and the resolver cannot tell an attribute the model never declared from one an
# operator left blank - it substitutes nothing and warns, so offene-abrechnung asks a member
# to pay into an empty account. Refusing the install is the only place that difference is
# still visible.
- System.Communication-[3.31,4.0)
- System.Notification-[2.0,3.0)
- System.UI-[2.4,3.0)

# The five notification templates with neutral default text (quarterly invoice, Q2
# variant, open invoice, open credit note, pre-reminder). Customise in Refinery Studio.
# Part of the EnergyCommunity.Billing blueprint — see blueprint.yaml for the full file list.
entities:

# ─── Notification templates ──────────────────────────────────────────────
# Subject/body texts are neutral defaults. Member name, community name and the
# billing period are ${...} placeholders resolved at send time (AB#2569).
#
# The bank details in offene-abrechnung are ${community.accountHolder} and
# ${community.iban} - the COMMUNITY's account, not the member's. Mapping them to
# customer.iban would tell a member to pay themselves. They were literal text until
# System.Communication 3.31.0 added BankAccountHolder / BankAccountIban; a tenant on
# an older model, or one that never filled the two fields in Settings, still sends
# this template with those two lines blank.
# rtIds and rtWellKnownNames are kept stable so pipelines reference them
# regardless of customization.

- rtId: 684afcd8640a3ca920364d28
  ckTypeId: System.Notification/NotificationTemplate-1
  rtWellKnownName: billing-quarterly
  associations: []
  attributes:
  - id: System.Notification/SubjectTemplate-1
    value: 'Abrechnung ${billingDocument.periodFrom} - ${billingDocument.periodTo}'
  - id: System.Notification/BodyTemplate-1
    value: |-
      Liebe / lieber ${customer.firstName},

      anbei findest du die Quartalsabrechnung für den gewählten Zeitraum.

      Bei Fragen oder Unstimmigkeiten melde dich bitte per E-Mail bei uns.

      Beste Grüße,
      ${community.name}
  - id: System.Notification/NotificationType-1
    value: 1
  - id: System.Notification/RenderingType-1
    value: 0

- rtId: 68a34a715241bae7b18c14be
  ckTypeId: System.Notification/NotificationTemplate-1
  rtWellKnownName: billing-quarterly-q2
  associations: []
  attributes:
  - id: System.Notification/SubjectTemplate-1
    value: 'Abrechnung Q2'
  - id: System.Notification/BodyTemplate-1
    value: |-
      Liebe / lieber ${customer.firstName},

      anbei die Quartalsabrechnung Q2.

      Bei Rückfragen melde dich bitte per E-Mail.

      Beste Grüße,
      ${community.name}
  - id: System.Notification/NotificationType-1
    value: 1
  - id: System.Notification/RenderingType-1
    value: 0

- rtId: 68c929359c0523ec5bfef80a
  ckTypeId: System.Notification/NotificationTemplate-1
  rtWellKnownName: offene-abrechnung
  associations: []
  attributes:
  - id: System.Notification/SubjectTemplate-1
    value: 'Offene Abrechnung'
  - id: System.Notification/BodyTemplate-1
    value: |-
      Liebe / lieber ${customer.firstName},

      beim Durchsehen unserer Unterlagen ist uns aufgefallen, dass unsere Abrechnung an dich noch nicht beglichen wurde.

      Bitte überweise den offenen Betrag auf folgendes Konto:

      Kontoinhaber: ${community.accountHolder}

      IBAN: ${community.iban}

      Solltest du die Zahlung bereits veranlasst haben, betrachte diese Nachricht bitte als gegenstandslos.

      Beste Grüße,
      ${community.name}
  - id: System.Notification/NotificationType-1
    value: 1
  - id: System.Notification/RenderingType-1
    value: 0

- rtId: 68c933969c0523ec5bfef80b
  ckTypeId: System.Notification/NotificationTemplate-1
  rtWellKnownName: offene-gutschrift
  associations: []
  attributes:
  - id: System.Notification/SubjectTemplate-1
    value: 'Offene Gutschrift'
  - id: System.Notification/BodyTemplate-1
    value: |-
      Liebe / lieber ${customer.firstName},

      aus deiner Einspeisung in der Energiegemeinschaft steht dir eine Gutschrift zu. Die Auszahlung konnten wir noch nicht durchführen, weil uns deine aktuelle Bankverbindung fehlt.

      Bitte schicke uns deine IBAN und Kontoinhaber:in als Antwort auf dieses E-Mail, dann veranlassen wir die Auszahlung umgehend.

      Beste Grüße,
      ${community.name}
  - id: System.Notification/NotificationType-1
    value: 1
  - id: System.Notification/RenderingType-1
    value: 0

- rtId: 68c933ea9c0523ec5bfef80c
  ckTypeId: System.Notification/NotificationTemplate-1
  rtWellKnownName: prae-zahlungserinnerung
  associations: []
  attributes:
  - id: System.Notification/SubjectTemplate-1
    value: 'Erinnerung Abrechnung'
  - id: System.Notification/BodyTemplate-1
    value: |-
      Liebe / lieber ${customer.firstName},

      es ist möglich, dass unsere letzte Abrechnung nicht bei dir angekommen ist. Wir senden dir die Abrechnung daher im Anhang nochmals zu.

      Falls die Zahlung bereits erfolgt ist, betrachte diese Nachricht bitte als gegenstandslos.

      Beste Grüße,
      ${community.name}
  - id: System.Notification/NotificationType-1
    value: 1
  - id: System.Notification/RenderingType-1
    value: 0
