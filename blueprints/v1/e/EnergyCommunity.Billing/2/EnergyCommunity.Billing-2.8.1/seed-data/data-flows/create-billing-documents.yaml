$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
- EnergyCommunity-[4.8,5.0)
- Basic.Energy-[1.9,2.0)
# 3.31 floor, not 3.26: the send pipelines below read BankAccountIban, BankAccountHolder
# and EmailFooterImage off EnergyCommunityConfiguration. On 3.26 those attributes simply do
# not exist, and the resolver cannot tell an attribute the model never declared from one an
# operator left blank - it substitutes nothing and warns, so offene-abrechnung asks a member
# to pay into an empty account. Refusing the install is the only place that difference is
# still visible.
- System.Communication-[3.31,5.0)
- System.Notification-[2.0,3.0)
- System.UI-[2.4,3.0)

# One DataFlow with its pipeline — the seed carries the pipeline definition inline.
# Part of the EnergyCommunity.Billing blueprint — see blueprint.yaml for the full file list.
entities:

# Source: _calculation/energy-create-billing-documents.yaml
# The existing-document check ignores canceled documents (state 4) since Billing
# 2.7.2, like createAllBillingDocumentsForPeriod: before, a canceled document kept
# its period occupied and the draft could not be created again after a cancellation.
- rtId: 68332a6f8c1ba1f712e75667
  rtCreationDateTime: 2025-05-25T14:34:23.5480000Z
  rtChangedDateTime: 2025-07-15T15:20:57.0170000Z
  ckTypeId: System.Communication/Pipeline-1
  associations:
  - roleId: System/ParentChild-1
    targetRtId: 68332a6f8c1ba1f712e75666
    targetCkTypeId: System.Communication/DataFlow-1
    attributes: []
  - roleId: System.Communication/Executes-1
    targetRtId: '670000000000000000000002'
    targetCkTypeId: System.Communication/Adapter-1
    attributes: []
  attributes:
  # AB#4633: ship DEPLOYED (2) to match createBillingItems (create chain live after install).
  - id: System.Communication/DeploymentState-1
    value: 2
  - id: System/Name-1
    value: Mesh Pipeline
  - id: System/Enabled-1
    value: true
  - id: System.Communication/PipelineDefinition-1
    value: >
      triggers:
        - type: FromHttpRequest@2
          path: /createBillingDocuments
          method: POST
          # AB#5627 phase A: a valid token of this tenant is required. Phase B adds the
          # required role once the roles are assigned in every productive tenant.
          allowAnonymous: false
          requiredRoles: []
      transformations:
        - type: GetRtEntitiesById@1
          identity: ServiceAccount  # AB#5627: run as the pipeline service account, not as the route caller
          description: Get specific customers by ID
          rtIdsPath: $.body.customerRtIds
          ckTypeId: EnergyCommunity/Customer
          targetPath: $.customers
          fieldFilters:
            - attributePath: State
              operator: Equals
              comparisonValue: 1 # Active
        - type: GetAssociationTargets@1
          identity: ServiceAccount  # AB#5627: run as the pipeline service account, not as the route caller
          description: get existing documents
          associationRoleId: EnergyCommunity/AssignedBilling
          graphDirection: Inbound
          originCkTypeId: EnergyCommunity/Customer
          targetCkTypeId: EnergyCommunity/BillingDocument
          originRtIdPath: $.customers.Items[*].RtId
          targetPath: $.billingDocuments
          fieldFilters:
            - attributePath: timeRange.from
              operator: Equals
              comparisonValuePath: $.body.timeRange.from
            - attributePath: timeRange.to
              operator: Equals
              comparisonValuePath: $.body.timeRange.to
            # A canceled document does not occupy its period: without this filter it is
            # joined as "existing", the If below skips the customer, no document is
            # created and the draft dialog fails after every cancellation (Billing 2.7.2).
            # Same filter as createAllBillingDocumentsForPeriod.
            - attributePath: billingDocumentState
              operator: NotEquals
              comparisonValue: 4
        - type: Join@1
          description: Join customers and billings
          path: $.customers.Items[*]
          keyPath: $.RtId
          joinPath: $.billingDocuments[*]
          joinKeyPath: $.OriginRtId
          itemPath: $.billingDocument
        - type: Project@1
          fields:
            - path: "$.billingDocuments"
        - type: ForEach@1
          description: iterate customers
          iterationPath: $.customers.Items
          mergePath: $.updates
          targetPath: $.updates
          #targetValueWriteMode: Merge
          transformations:
            - type: If@1
              description: if no billing document
              path: $.key.billingDocument[0].Items[0].RtId
              operator: Equals
              value: null
              valueType: String
              transformations:
                - type: CreateUpdateInfo@1
                  targetPath: $.updates._items
                  updateKind: INSERT
                  ckTypeId: EnergyCommunity/BillingDocument
                  rtIdPath: $.rtId
                  generateRtId: true
                  attributeUpdates:
                    - attributeName: CustomerNumber
                      attributeValueType: String
                      valuePath: $.key.Attributes.CustomerNumber
                    - attributeName: TaxProcedureCreditNote
                      attributeValueType: Enum
                      valuePath: $.key.Attributes.TaxProcedureCreditNote
                    - attributeName: Contact
                      attributeValueType: Record
                      valuePath: $.key.Attributes.Contact
                    - attributeName: BankAccount
                      attributeValueType: Record
                      valuePath: $.key.Attributes.BankAccount
                    - attributeName: TimeRange.From
                      attributeValueType: DateTime
                      valuePath: $.full.body.timeRange.from
                    - attributeName: TimeRange.To
                      attributeValueType: DateTime
                      valuePath: $.full.body.timeRange.to
                    - attributeName: BillingType
                      attributeValueType: Enum
                      value: "Debit"
                    - attributeName: GrossTotal
                      attributeValueType: Double
                      value: 0.0
                    - attributeName: BillingDocumentState
                      attributeValueType: Enum
                      value: "Draft"
                    - attributeName: DocumentDate
                      attributeValueType: DateTime
                      valuePath: $.full.body.documentDate
                - type: CreateAssociationUpdate@1
                  targetPath: $.updates._assocUpdateItems
                  targetValueKind: Array
                  targetValueWriteMode: Append
                  updateKind: CREATE
                  originRtIdPath: $.updates._items.RtEntity.RtId
                  originCkTypeIdPath: $.updates._items.RtEntity.CkTypeId
                  targetRtIdPath: $.key.RtId
                  targetCkTypeIdPath: $.key.CkTypeId.SemanticVersionedFullName
                  associationRoleId: EnergyCommunity/AssignedBilling
        - type: Flatten@1
          path: $.updates[*]._items
          targetPath: $.result.items
          targetValueKind: Simple
          targetValueWriteMode: Overwrite
        - type: Flatten@1
          path: $.updates[*]._assocUpdateItems[*]
          targetPath: $.result.assocUpdateItems
          targetValueKind: Simple
          targetValueWriteMode: Overwrite
        - type: Project@1
          fields:
            - path: "$.customers"
            - path: "$.updates"
            - path: "$.method"
            - path: "$.path"
            - path: "$.body"
        - type: ApplyChanges@2
          identity: ServiceAccount  # AB#5627: run as the pipeline service account, not as the route caller
          entityUpdatesPath: $.result.items # Path to the array of update info objects
          associationUpdatesPath: $.result.assocUpdateItems # Path to the array of association update info objects
        - type: Project@1
          fields:
            - path: "$.result.assocUpdateItems"

        # AB#5627: the adapter answers the HTTP call with the final data context verbatim -
        # request headers, principal, body and every intermediate result. Reduce it to
        # status, message and result.items, which the EC app reads to create the billing items (missing fields are skipped).
        - type: SetPrimitiveValue@1
          targetPath: $.status
          value: ok
          valueType: String
        - type: SetPrimitiveValue@1
          targetPath: $.message
          value: "Billing documents created."
          valueType: String
        - type: Project@1
          description: Shape the HTTP response body
          clear: true
          fields:
            - path: $.status
              inclusion: true
            - path: $.message
              inclusion: true
            - path: $.result.items
              inclusion: true
  - id: System.Communication/StatusMessage-1
- rtId: 68332a6f8c1ba1f712e75666
  rtCreationDateTime: 2025-05-25T14:34:23.4640000Z
  rtChangedDateTime: 2025-07-06T18:48:57.1490000Z
  ckTypeId: System.Communication/DataFlow-1
  associations: []
  attributes:
  - id: System/Name-1
    value: energy-create-billing-documents
  - id: System/Description-1
