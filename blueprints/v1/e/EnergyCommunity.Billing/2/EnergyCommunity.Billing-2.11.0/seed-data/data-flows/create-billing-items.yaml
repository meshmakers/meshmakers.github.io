$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
- EnergyCommunity-[4.8,5.0)
- Basic.Energy-[1.9,2.0)
# 3.31 floor, not 3.26: the send pipelines below read BankAccountIban, BankAccountHolder
# and EmailFooterImage off EnergyCommunityConfiguration. On 3.26 those attributes simply do
# not exist, and the resolver cannot tell an attribute the model never declared from one an
# operator left blank - it substitutes nothing and warns, so offene-abrechnung asks a member
# to pay into an empty account. Refusing the install is the only place that difference is
# still visible.
- System.Communication-[3.31,5.0)
- System.Notification-[2.0,3.0)
- System.UI-[2.4,3.0)

# One DataFlow with its pipeline — the seed carries the pipeline definition inline.
# Part of the EnergyCommunity.Billing blueprint — see blueprint.yaml for the full file list.
entities:

# Source: _calculation/energy-create-billing-items.yaml
# Single-document variant of the stream-data settlement (see the all-variant
# above for the mechanism). Selects the documents by explicit rtId list from the
# request body instead of by period; each document supplies its own period
# (Values[5]/[6]) for BilledTimeRange, but the settlement window comes from the
# request: callers MUST send { billingDocumentRtIds, timeRange: { from, to } }.
# Until Billing 2.7.2 the app sent the rtIds only, both window filters resolved
# to null and were dropped by the stream-data layer, and every line item was
# billed the metering point's whole archive history. A request missing
# timeRange.from or timeRange.to now reads and writes nothing and answers
# status=error. Only documents whose own period equals the request's are settled;
# a request that names no document or matches no draft answers status=error.
- rtId: 6832328b4851994a4fbd5c3e
  rtCreationDateTime: 2025-05-24T20:56:43.0870000Z
  rtChangedDateTime: 2026-07-27T00:00:00.0000000Z
  ckTypeId: System.Communication/Pipeline-1
  associations:
  - roleId: System/ParentChild-1
    targetRtId: 6832328b4851994a4fbd5c3d
    targetCkTypeId: System.Communication/DataFlow-1
    attributes: []
  - roleId: System.Communication/Executes-1
    targetRtId: '670000000000000000000002'
    targetCkTypeId: System.Communication/Adapter-1
    attributes: []
  # AB#4633: Uses association → EnergyCommunityConfiguration (see createAllBillingItemsForPeriod).
  - roleId: System.Communication/Uses-1
    targetRtId: 69775cca547399077ac963a1
    targetCkTypeId: System.Communication/EnergyCommunityConfiguration-1
    attributes: []
  attributes:
  - id: System.Communication/DeploymentState-1
    value: 2
  - id: System/Name-1
    value: Mesh Pipeline
  - id: System.Communication/StatusMessage-1
  - id: System/Enabled-1
    value: true
  - id: System.Communication/PipelineDefinition-1
    value: |-
      triggers:
        - type: FromHttpRequest@2
          path: /createBillingItems
          method: POST
          # AB#5627 phase A: a valid token of this tenant is required. Phase B adds the
          # required role once the roles are assigned in every productive tenant.
          allowAnonymous: false
          requiredRoles: []
      transformations:
        # Load pricing/tax configuration
        - type: GetPipelineConfigByWellKnownName@1
          wellKnownName: "EnergyCommunityConfiguration"
          targetPath: $.config
        - type: SetPrimitiveValue@1
          targetPath: $.Configuration.taxRate
          valuePath: $.config.taxRate
          valueType: Double
        - type: SetPrimitiveValue@1
          targetPath: $.Configuration.farmerTaxRate
          valuePath: $.config.farmerTaxRate
          valueType: Double
        - type: SetPrimitiveValue@1
          targetPath: $.Configuration.consumerPrice
          valuePath: $.config.consumerPrice
          valueType: Double
        - type: SetPrimitiveValue@1
          targetPath: $.Configuration.producerPrice
          valuePath: $.config.producerPrice
          valueType: Double
        - type: Project@1
          fields:
            - path: $.config

        # Both bounds of the billing period must be present before anything is read (AB#5625).
        # A field filter whose comparison value resolves to null is dropped by the stream-data
        # layer instead of failing: without timeRange.to the settlement bills everything after
        # `from`, and without the period at all the settlement covers the whole archive.
        # There is no node that ends a pipeline early and If@1 has no AND, so two nested If@1
        # wrap the rest of the pipeline; a request without both bounds reads and writes nothing
        # and answers status=error (HTTP 200, like manualMeteringEntry). The app always sends
        # both (shared/billing-settlement.ts, createBillingItemsRequest).
        - type: SetPrimitiveValue@1
          targetPath: $.status
          value: error
          valueType: String
        - type: SetPrimitiveValue@1
          targetPath: $.message
          value: "timeRange.from and timeRange.to are required; nothing was billed."
          valueType: String
        - type: If@1
          description: request carries timeRange.from
          path: $.body.timeRange.from
          operator: NotEquals
          value: null
          valueType: String
          transformations:
          - type: If@1
            description: request carries timeRange.to
            path: $.body.timeRange.to
            operator: NotEquals
            value: null
            valueType: String
            transformations:
            # No draft matched (an empty billingDocumentRtIds, whose `rtId In` filter would be
            # dropped and select every draft of the period; wrong ids; not a draft any more; a
            # period that is not the documents' own): stop here with status=error. On an
            # empty document set the joins below would fail the run with HTTP 500, and the
            # metering-point query's customer filter would be dropped.
            - type: SetPrimitiveValue@1
              targetPath: $.message
              value: "No draft billing document matches billingDocumentRtIds and timeRange; nothing was billed."
              valueType: String
            - type: If@1
              description: request names at least one billing document
              path: $.body.billingDocumentRtIds[0]
              operator: NotEquals
              value: null
              valueType: String
              transformations:
              # Draft billing documents selected by explicit rtId list.
              # Values: [0]=doc rtId, [1]=doc ckTypeId, [2]=customer rtId,
              #         [3]=customer taxId, [4]=state, [5]=from, [6]=to, [7]=taxProcedure
              - type: GetQueryById@1
                identity: ServiceAccount  # AB#5627: run as the pipeline service account, not as the route caller
                description: get customer/billingdocuments
                queryRtId: "683177dcb90d979b8ae558a1"
                targetPath: $.documents
                fieldFilters:
                  - attributePath: billingDocumentState
                    operator: Equals
                    comparisonValue: 0
                  - attributePath: rtId
                    operator: In
                    comparisonValuePath: $.body.billingDocumentRtIds
                  # The settlement window is the request's, the billed range the document's
                  # (Values[5]/[6]). Only a document whose own period IS the request's period is
                  # settled, as in createAllBillingItemsForPeriod - otherwise a Q3 draft could
                  # carry a year's quantity under a Q3 billed range.
                  - attributePath: timeRange.from
                    operator: Equals
                    comparisonValuePath: $.body.timeRange.from
                  - attributePath: timeRange.to
                    operator: Equals
                    comparisonValuePath: $.body.timeRange.to

              - type: If@1
                description: at least one draft billing document matches
                path: $.documents.Rows[0].Values[0]
                operator: NotEquals
                value: null
                valueType: String
                transformations:
                - type: GetQueryById@1
                  identity: ServiceAccount  # AB#5627: run as the pipeline service account, not as the route caller
                  description: get metering points
                  queryRtId: "693996d37a64d9a8f73b3832"
                  targetPath: $.meteringPoints
                  fieldFilters:
                    - attributePath: parent.basicEnergyOperatingFacility->customer.energyCommunityCustomer->rtId
                      operator: In
                      comparisonValuePath: $.documents.Rows[*].Values[2]

                - type: GetAssociationTargets@1
                  identity: ServiceAccount  # AB#5627: run as the pipeline service account, not as the route caller
                  description: get measurement anchors per metering point
                  associationRoleId: System/ParentChild
                  graphDirection: Inbound
                  originCkTypeId: Basic.Energy/MeteringPoint
                  targetCkTypeId: Basic.Energy/EnergyMeasurement
                  originRtIdPath: $.meteringPoints.Rows[*].RtId
                  targetPath: $.anchors

                - type: Join@1
                  description: attach the anchor group to each metering point
                  path: $.meteringPoints.Rows[*]
                  keyPath: $.RtId
                  joinPath: $.anchors[*]
                  joinKeyPath: $.OriginRtId
                  itemPath: $.anchorGroup

                - type: Join@1
                  description: attach the metering points to their billing document (by customer)
                  path: $.documents.Rows[*]
                  keyPath: $.Values[2]
                  joinPath: $.meteringPoints.Rows[*]
                  joinKeyPath: $.Values[1]
                  itemPath: $.meteringPoints

                # Project@1 REMOVES the listed paths (FieldConfiguration.Inclusion defaults to
                # false). $.body must NOT be removed here: the settlement query below reads the
                # billing period from $.full.full.body.timeRange, and a field filter whose
                # comparison value resolves to null is silently dropped by the stream-data layer
                # (CrateDbStreamDataRepository.BuildFieldFilterDtos: "a missing value means the
                # filter is skipped, which widens the result rather than narrowing it"). With the
                # bounds gone every line item is billed the metering point's ENTIRE archive history
                # instead of the requested period. It happened twice: when an earlier Project@1
                # removed $.body (119.26 kWh instead of 55.67 on the octogrid rehearsal), and when
                # the app called this endpoint with { billingDocumentRtIds } only - no timeRange
                # at all, so eegroider credited a producer a year's generation for Q3 (Billing
                # 2.7.2). Callers MUST send { billingDocumentRtIds, timeRange: { from, to } } (ISO);
                # a request without both bounds reads and bills nothing. The document's own
                # timeRange (Values[5]/[6]) is not usable here: RT-query DateTime columns
                # serialize with the server culture, which CrateDB cannot cast.
                - type: Project@1
                  fields:
                    - path: $.meteringPoints
                    - path: $.anchors
                    - path: $.path
                    - path: $.method

                - type: ForEach@1
                  description: iterate billing documents
                  maxDegreeOfParallelism: 1
                  iterationPath: $.documents.Rows
                  mergePath: $._updateItems
                  targetPath: $._updateItems
                  transformations:
                    - type: ForEach@1
                      description: iterate metering points of the document
                      maxDegreeOfParallelism: 1
                      iterationPath: $.key.meteringPoints
                      mergePath: $.updates
                      targetPath: $.updates
                      transformations:
                        # Which OBIS register carries the billed energy depends on the role of the
                        # metering point (AB#5239). The mapping is not a choice made here: the 1.x
                        # ingest node AggregateConsumptionRecordNode (octo-adapter-eda) fixed it in
                        # code, and the EnergyQuantity entities it produced are what the 1.x
                        # settlement invoiced -- a consumer was billed "1-1:2.9.0 G.03", a producer
                        # "1-1:2.9.0 G.01T" MINUS the excess "1-1:2.9.0 P.01T". Replaying that logic
                        # over octogrid's raw DATEN_CRMSG reproduces 440/440 consumer and 365/365
                        # producer legacy day values.
                        # Without this filter the settlement summed EVERY register the metering point
                        # carries -- five on an octogrid consumer -- which overstated the billed
                        # quantity by a factor of 18 to 44 and multiplied intervalCount* by the
                        # number of registers. A role that names no register selects nothing and
                        # produces no line item, which is the safe direction to fail in.
                        - type: SetPrimitiveValue@1
                          description: no register billed unless the role below names one
                          targetPath: $.key.data.obisBilled
                          value: ""
                          valueType: String
                        - type: Switch@1
                          description: select the billed OBIS register for this role
                          path: $.key.CkTypeId
                          valueType: String
                          cases:
                            - value: "EnergyCommunity/Consumer"
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.key.data.obisBilled
                                  value: "1-1:2.9.0 G.03"
                                  valueType: String
                            - value: "EnergyCommunity/Producer"
                              transformations:
                                - type: SetPrimitiveValue@1
                                  targetPath: $.key.data.obisBilled
                                  value: "1-1:2.9.0 G.01T"
                                  valueType: String

                        - type: GetQueryById@1
                          identity: ServiceAccount  # AB#5627: run as the pipeline service account, not as the route caller
                          description: stream-data settlement of the billed register (sum + count per quality)
                          queryRtId: "ec000000000000000000e001"
                          targetPath: $.key.sd
                          fieldFilters:
                            - attributePath: rtId
                              operator: In
                              comparisonValuePath: $.key.anchorGroup[0].Items[*].RtId
                            - attributePath: obisCode
                              operator: Equals
                              comparisonValuePath: $.key.data.obisBilled
                            - attributePath: window_start
                              operator: GreaterEqualThan
                              comparisonValuePath: $.full.full.body.timeRange.from
                            - attributePath: window_end
                              operator: LessEqualThan
                              comparisonValuePath: $.full.full.body.timeRange.to

                        - type: SetPrimitiveValue@1
                          targetPath: $.key.data.sum
                          value: 0
                          valueType: Double
                        - type: SetPrimitiveValue@1
                          targetPath: $.key.data.deducted
                          value: 0
                          valueType: Double
                        - type: SetPrimitiveValue@1
                          targetPath: $.key.data.billedQuantity
                          value: 0
                          valueType: Double
                        - type: SetPrimitiveValue@1
                          targetPath: $.key.data.cntTotal
                          value: 0
                          valueType: Int
                        - type: SetPrimitiveValue@1
                          targetPath: $.key.data.cntL1
                          value: 0
                          valueType: Int
                        - type: SetPrimitiveValue@1
                          targetPath: $.key.data.cntL2
                          value: 0
                          valueType: Int
                        - type: SetPrimitiveValue@1
                          targetPath: $.key.data.cntL3
                          value: 0
                          valueType: Int
                        - type: SetPrimitiveValue@1
                          targetPath: $.key.data.cntUnknown
                          value: 0
                          valueType: Int

                        # A metering point without an EnergyMeasurement anchor must not be billed.
                        # Its anchor list is empty, so the `rtId In` filter above carries no values
                        # and is dropped by the stream-data layer exactly like a filter with a null
                        # comparison value -- the settlement then aggregates EVERY anchor in the
                        # archive and bills one member the whole community's energy (observed on
                        # octogrid: 72.29 kWh on a metering point that has no measurements at all,
                        # which is the community-wide G.03 total).
                        - type: If@1
                          description: metering point has at least one measurement anchor
                          path: $.key.anchorGroup[0].Items[0].RtId
                          operator: NotEquals
                          value: null
                          valueType: String
                          transformations:
                          - type: If@1
                            description: settlement rows present for this metering point (count > 0)
                            path: $.key.sd.Rows[0].Values[3]
                            operator: GreaterThan
                            value: 0
                            valueType: Int
                            transformations:
                              - type: SumAggregation@1
                                description: sum L1/L2 quantity
                                targetPath: $.key.data.sum
                                aggregations:
                                  - path: $.key.sd.Rows[*]
                                    filterPath: $.Values[0]
                                    comparisonValue: 1
                                    aggregationPath: $.Values[2]
                                    value: 1
                                  - path: $.key.sd.Rows[*]
                                    filterPath: $.Values[0]
                                    comparisonValue: 2
                                    aggregationPath: $.Values[2]
                                    value: 1
                              # A producer is credited what the community actually took from it:
                              # G.01T minus the excess P.01T that stayed unallocated. Both registers
                              # are reported for exactly the same intervals (145328 of them on
                              # octogrid, none unpaired), so subtracting the period sums is equivalent
                              # to subtracting per interval and needs no join.
                              - type: If@1
                                description: producers are billed the difference of two registers
                                path: $.key.CkTypeId
                                operator: Equals
                                value: EnergyCommunity/Producer
                                valueType: String
                                transformations:
                                  - type: GetQueryById@1
                                    identity: ServiceAccount  # AB#5627: run as the pipeline service account, not as the route caller
                                    description: excess register deducted from the producer quantity
                                    queryRtId: "ec000000000000000000e001"
                                    targetPath: $.key.sdDeducted
                                    fieldFilters:
                                      - attributePath: rtId
                                        operator: In
                                        comparisonValuePath: $.key.anchorGroup[0].Items[*].RtId
                                      - attributePath: obisCode
                                        operator: Equals
                                        comparisonValue: "1-1:2.9.0 P.01T"
                                      - attributePath: window_start
                                        operator: GreaterEqualThan
                                        comparisonValuePath: $.full.full.body.timeRange.from
                                      - attributePath: window_end
                                        operator: LessEqualThan
                                        comparisonValuePath: $.full.full.body.timeRange.to
                                  - type: SumAggregation@1
                                    description: sum L1/L2 of the deducted register
                                    targetPath: $.key.data.deducted
                                    aggregations:
                                      - path: $.key.sdDeducted.Rows[*]
                                        filterPath: $.Values[0]
                                        comparisonValue: 1
                                        aggregationPath: $.Values[2]
                                        value: 1
                                      - path: $.key.sdDeducted.Rows[*]
                                        filterPath: $.Values[0]
                                        comparisonValue: 2
                                        aggregationPath: $.Values[2]
                                        value: 1
                              # Consumers leave `deducted` at 0, so this is a no-op for them.
                              - type: Math@1
                                description: billed quantity = billed register - deducted register
                                path: $.key.data
                                itemPath: $.sum
                                operation: Subtract
                                valuePath: $.key.data.deducted
                                itemTargetPath: $.billedQuantity
                              - type: SumAggregation@1
                                description: interval count total
                                targetPath: $.key.data.cntTotal
                                aggregations:
                                  - path: $.key.sd.Rows[*]
                                    aggregationPath: $.Values[3]
                                    value: 1
                              - type: SumAggregation@1
                                description: interval count L1
                                targetPath: $.key.data.cntL1
                                aggregations:
                                  - path: $.key.sd.Rows[*]
                                    filterPath: $.Values[0]
                                    comparisonValue: 1
                                    aggregationPath: $.Values[3]
                                    value: 1
                              - type: SumAggregation@1
                                description: interval count L2
                                targetPath: $.key.data.cntL2
                                aggregations:
                                  - path: $.key.sd.Rows[*]
                                    filterPath: $.Values[0]
                                    comparisonValue: 2
                                    aggregationPath: $.Values[3]
                                    value: 1
                              - type: SumAggregation@1
                                description: interval count L3
                                targetPath: $.key.data.cntL3
                                aggregations:
                                  - path: $.key.sd.Rows[*]
                                    filterPath: $.Values[0]
                                    comparisonValue: 3
                                    aggregationPath: $.Values[3]
                                    value: 1
                              - type: SumAggregation@1
                                description: interval count Unknown
                                targetPath: $.key.data.cntUnknown
                                aggregations:
                                  - path: $.key.sd.Rows[*]
                                    filterPath: $.Values[0]
                                    comparisonValue: 0
                                    aggregationPath: $.Values[3]
                                    value: 1

                              - type: Switch@1
                                description: Define tax rate
                                path: $.key.CkTypeId
                                valueType: String
                                cases:
                                  - value: "EnergyCommunity/Consumer"
                                    transformations:
                                      - type: SetPrimitiveValue@1
                                        targetPath: $.key.data.taxRate
                                        valuePath: $.full.full.Configuration.taxRate
                                        valueType: Double
                                  - value: "EnergyCommunity/Producer"
                                    transformations:
                                      - type: SetPrimitiveValue@1
                                        targetPath: $.key.data.taxRate
                                        value: 0
                                        valueType: Double
                              - type: If@1
                                description: Reduce tax rate for farmers (FarmerTaxProcedure)
                                path: $.full.key.Values[7]
                                operator: Equals
                                value: 3
                                valueType: Enum
                                transformations:
                                  - type: If@1
                                    description: Ensure producer
                                    path: $.key.CkTypeId
                                    operator: Equals
                                    value: EnergyCommunity/Producer
                                    valueType: String
                                    transformations:
                                      - type: SetPrimitiveValue@1
                                        valuePath: $.full.full.Configuration.farmerTaxRate
                                        valueType: Double
                                        targetPath: $.key.data.taxRate

                              - type: Switch@1
                                description: Define unit price
                                path: $.key.CkTypeId
                                valueType: String
                                cases:
                                  - value: "EnergyCommunity/Consumer"
                                    transformations:
                                      - type: SetPrimitiveValue@1
                                        targetPath: $.key.data.unitPrice
                                        valuePath: $.full.full.Configuration.consumerPrice
                                        valueType: Double
                                  - value: "EnergyCommunity/Producer"
                                    transformations:
                                      - type: SetPrimitiveValue@1
                                        targetPath: $.key.data.unitPrice
                                        valuePath: $.full.full.Configuration.producerPrice
                                        valueType: Double
                              - type: DataMapping@1
                                description: Define billingType
                                path: $.key.CkTypeId
                                targetPath: $.key.data.billingType
                                sourceValueType: String
                                targetValueType: String
                                mappings:
                                  - sourceValue: EnergyCommunity/Consumer
                                    targetValue: "Debit"
                                    description: "consumer"
                                  - sourceValue: EnergyCommunity/Producer
                                    targetValue: "Credit"
                                    description: "producer"

                              - type: Math@1
                                description: calc net amount (unit price * quantity)
                                path: $.key.data
                                itemPath: $.billedQuantity
                                operation: Multiply
                                valuePath: $.key.data.unitPrice
                                itemTargetPath: $.netAmount
                              - type: Math@1
                                description: calc tax factor (tax rate / 100)
                                path: $.key.data
                                itemPath: $.taxRate
                                operation: Divide
                                value: 100
                                itemTargetPath: $.taxFactor
                              - type: Math@1
                                description: calc tax amount (tax factor * netAmount)
                                path: $.key.data
                                itemPath: $.netAmount
                                operation: Multiply
                                valuePath: $.key.data.taxFactor
                                itemTargetPath: $.taxAmount
                              - type: Math@1
                                description: calc gross amount (netAmount + taxAmount)
                                path: $.key.data
                                itemPath: $.netAmount
                                operation: Add
                                valuePath: $.key.data.taxAmount
                                itemTargetPath: $.grossAmount

                              - type: CreateUpdateInfo@1
                                description: create billing document line item
                                targetPath: $.updates._items
                                updateKind: INSERT
                                ckTypeId: EnergyCommunity/BillingDocumentLineItem
                                rtIdPath: $.rtId
                                generateRtId: true
                                attributeUpdates:
                                  - attributeName: GrossAmount
                                    attributeValueType: Double
                                    valuePath: $.key.data.grossAmount
                                  - attributeName: UnitPrice
                                    attributeValueType: Double
                                    valuePath: $.key.data.unitPrice
                                  - attributeName: BillingType
                                    attributeValueType: Enum
                                    valuePath: $.key.data.billingType
                                  - attributeName: TaxRate
                                    attributeValueType: Double
                                    valuePath: $.key.data.taxRate
                                  - attributeName: TaxAmount
                                    attributeValueType: Double
                                    valuePath: $.key.data.taxAmount
                                  - attributeName: NetAmount
                                    attributeValueType: Double
                                    valuePath: $.key.data.netAmount
                                  - attributeName: Quantity
                                    attributeValueType: Double
                                    valuePath: $.key.data.billedQuantity
                                  - attributeName: BilledTimeRange.From
                                    attributeValueType: DateTime
                                    valuePath: $.full.key.Values[5]
                                  - attributeName: BilledTimeRange.To
                                    attributeValueType: DateTime
                                    valuePath: $.full.key.Values[6]
                                  - attributeName: IntervalCount
                                    attributeValueType: Integer
                                    valuePath: $.key.data.cntTotal
                                  - attributeName: IntervalCountL1
                                    attributeValueType: Integer
                                    valuePath: $.key.data.cntL1
                                  - attributeName: IntervalCountL2
                                    attributeValueType: Integer
                                    valuePath: $.key.data.cntL2
                                  - attributeName: IntervalCountL3
                                    attributeValueType: Integer
                                    valuePath: $.key.data.cntL3
                                  - attributeName: IntervalCountUnknown
                                    attributeValueType: Integer
                                    valuePath: $.key.data.cntUnknown
                              - type: CreateAssociationUpdate@1
                                description: Assign line item to its billing document (parent)
                                targetPath: $.updates._assocUpdateItems
                                targetValueKind: Array
                                targetValueWriteMode: Append
                                updateKind: CREATE
                                originRtIdPath: $.updates._items.RtId
                                originCkTypeIdPath: $.updates._items.CkTypeId
                                targetRtIdPath: $.full.key.Values[0]
                                targetCkTypeIdPath: $.full.key.CkTypeId
                                associationRoleId: System/ParentChild
                              - type: CreateAssociationUpdate@1
                                description: Assign the billed metering point
                                targetPath: $.updates._assocUpdateItems
                                targetValueKind: Array
                                targetValueWriteMode: Append
                                updateKind: CREATE
                                originRtIdPath: $.updates._items.RtId
                                originCkTypeIdPath: $.updates._items.CkTypeId
                                targetRtIdPath: $.key.RtId
                                targetCkTypeIdPath: $.key.CkTypeId
                                associationRoleId: EnergyCommunity/BilledMeteringPoint

                    - type: Flatten@1
                      path: $.updates[*]._items
                      targetPath: $._updateItems._items
                      targetValueKind: Simple
                      targetValueWriteMode: Overwrite
                    - type: Flatten@1
                      path: $.updates[*]._assocUpdateItems[*]
                      targetPath: $._updateItems._assocUpdateItems
                      targetValueKind: Simple
                      targetValueWriteMode: Overwrite
                    - type: Project@1
                      fields:
                        - path: $.updates

                    - type: SumAggregation@1
                      description: billing sum (debit positive, credit negative)
                      targetPath: $.key._billing.sum
                      aggregations:
                        - path: $._updateItems._items[*]
                          filterPath: $.RtEntity.Attributes.BillingType
                          comparisonValue: 0
                          aggregationPath: $.RtEntity.Attributes.GrossAmount
                          value: 1
                        - path: $._updateItems._items[*]
                          filterPath: $.RtEntity.Attributes.BillingType
                          comparisonValue: 1
                          aggregationPath: $.RtEntity.Attributes.GrossAmount
                          value: -1

                    - type: SetPrimitiveValue@1
                      value: "Debit"
                      targetPath: $.key._billing.billingType
                    - type: If@1
