$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
- EnergyCommunity-[5.0,6.0)
- Basic.Energy-[2.0,3.0)
# 3.31 floor, not 3.26: the send pipelines below read BankAccountIban, BankAccountHolder
# and EmailFooterImage off EnergyCommunityConfiguration. On 3.26 those attributes simply do
# not exist, and the resolver cannot tell an attribute the model never declared from one an
# operator left blank - it substitutes nothing and warns, so offene-abrechnung asks a member
# to pay into an empty account. Refusing the install is the only place that difference is
# still visible.
- System.Communication-[3.31,5.0)
- System.Notification-[2.0,3.0)
- System.UI-[2.4,3.0)

# Generic ad-hoc member messaging (AB#4292): sends a notification template to an
# explicit list of recipients.
# Part of the EnergyCommunity.Billing blueprint — see blueprint.yaml for the full file list.
entities:

# ─── Ad-hoc member messaging (AB#4292) ───────────────────────────────────
# Generic send pipeline: sends a notification template to an explicit list of
# recipient email addresses. The frontend (energy-community app) resolves the
# audience (manual addresses / a single customer / all active members) and posts
# { notificationTemplateRtWellKnownName, toAddresses[], customerRtIds[]? } to /sendMessage
# and gets { status: ok|partial|error, message, sent, failed[{recipient, customerRtId, reason}] }.
- rtId: ec000000000000000000d001
  ckTypeId: System.Communication/DataFlow-1
  associations: []
  attributes:
  - id: System/Name-1
    value: energy-send-message
  - id: System/Description-1
    value: Sends a notification template to an explicit list of recipient email addresses (ad-hoc member messaging).
- rtId: ec000000000000000000d002
  ckTypeId: System.Communication/Pipeline-1
  associations:
  - roleId: System/ParentChild-1
    targetRtId: ec000000000000000000d001
    targetCkTypeId: System.Communication/DataFlow-1
    attributes: []
  - roleId: System.Communication/Executes-1
    targetRtId: '670000000000000000000002'
    targetCkTypeId: System.Communication/Adapter-1
    attributes: []
  # AB#4554: Uses → EnergyCommunityConfiguration so the BCC address resolves
  # config-driven (notificationEmailContact) via GetPipelineConfigByWellKnownName@1.
  - roleId: System.Communication/Uses-1
    targetRtId: 69775cca547399077ac963a1
    targetCkTypeId: System.Communication/EnergyCommunityConfiguration-1
    attributes: []
  attributes:
  - id: System.Communication/DeploymentState-1
    value: 0
  - id: System/Name-1
    value: Mesh Pipeline
  - id: System/Enabled-1
    value: true
  - id: System.Communication/PipelineDefinition-1
    value: |
      triggers:
        - type: FromHttpRequest@2
          path: /sendMessage
          method: POST
          # AB#5627 phase A: a valid token of this tenant is required. Phase B adds the
          # required role once the roles are assigned in every productive tenant.
          allowAnonymous: false
          requiredRoles: []
      transformations:
        # AB#4554: load config so the BCC address resolves config-driven.
        - type: GetPipelineConfigByWellKnownName@1
          wellKnownName: "EnergyCommunityConfiguration"
          targetPath: $.config
        # AB#2569: the community bank details are read from the runtime entity, not from
        # $.config above. GetPipelineConfigByWellKnownName@1 hands the pipeline a DTO the
        # communication controller serialises through the CK model compiled into its own
        # binary, so an attribute added to the tenant model is silently dropped until the
        # service itself ships that CK version. Verified against a tenant with System.Communication
        # 3.31.0 imported: the typed config had no BankAccount* keys at all, while this lookup
        # returned both with their values.
        - type: GetRtEntitiesByType@1
          identity: ServiceAccount  # AB#5627: run as the pipeline service account, not as the route caller
          description: read the community configuration as a runtime entity
          ckTypeId: System.Communication/EnergyCommunityConfiguration
          targetPath: $.communityConfig
          take: 1
        - type: GetNotificationTemplate@1
          notificationTemplateNamePath: $.body.notificationTemplateRtWellKnownName
          targetPath: $.emailBody
          subjectTargetPath: $.emailSubject
          # AB#2570: the editor lets an author declare PLAIN or HTML, and until this path
          # existed that choice reached nobody - every body was run through Markdig.
          renderingTypeTargetPath: $.emailRenderingType
        # Checks once what would fail every recipient alike, so such a refusal sends nothing and is not
        # reported as N failed recipients. customerRtIds is optional and has the index of toAddresses.
        - type: ExecuteCSharp@1
          description: "plan the send: check template and BCC, pair recipients with customers"
          targetPath: $.plan
          returnType: RecordArray
          timeoutMs: 10000
          usings:
            - System.Collections.Generic
          arguments:
            - name: toAddresses
              dataType: StringArray
              valuePath: $.body.toAddresses
            - name: customerRtIds
              dataType: StringArray
              valuePath: $.body.customerRtIds
            - name: subject
              dataType: String
              valuePath: $.emailSubject
            - name: body
              dataType: String
              valuePath: $.emailBody
            - name: bcc
              dataType: String
              valuePath: $.config.notificationEmailContact
          code: |
            bool IsValidBcc(string bccAddresses)
            {
                if (string.IsNullOrWhiteSpace(bccAddresses)) return true;
                try
                {
                    new System.Net.Mail.MailAddressCollection().Add(bccAddresses);
                    return true;
                }
                catch (FormatException)
                {
                    return false;
                }
            }
            var addresses = toAddresses ?? new string[0];
            var customers = customerRtIds ?? new string[0];
            var recipients = new List<object>();
            string refusal = null;
            if (addresses.Length == 0) refusal = "The request names no recipient; nothing was sent.";
            else if (string.IsNullOrWhiteSpace(subject)) refusal = "The template has no subject; nothing was sent.";
            else if (string.IsNullOrWhiteSpace(body)) refusal = "The template has no body; nothing was sent.";
            else if (!IsValidBcc(bcc)) refusal = "The BCC address of the community configuration (notification e-mail contact) is not a valid e-mail address; nothing was sent.";
            else
            {
                for (var position = 0; position < addresses.Length; position++)
                {
                    var customerRtId = position < customers.Length && !string.IsNullOrWhiteSpace(customers[position])
                        ? customers[position]
                        : null;
                    recipients.Add(new Dictionary<string, object> { ["address"] = addresses[position], ["customerRtId"] = customerRtId });
                }
            }
            return new object[] { new Dictionary<string, object> { ["refusal"] = refusal, ["recipients"] = recipients } };

        # continueOnError + errorsPath: a failed recipient is recorded in $.sendErrors ({index, errorType,
        # message}, index into $.plan[0].recipients) and the remaining recipients still get their mail.
        - type: ForEach@1
          description: iterate recipient addresses and send emails sequentially
          iterationPath: $.plan[0].recipients
          mergePath: $.results
          targetPath: $.results
          maxDegreeOfParallelism: 1
          continueOnError: true
          errorsPath: $.sendErrors
          transformations:
            # AB#2569: resolve the recipient address to a customer, so the customer.* placeholders
            # mean the same thing here as in the billing dispatch. Without this a bulk mail would
            # render "Liebe / lieber ," - the token would be removed rather than filled.
            # An address matching no customer yields no items, and the resolver below then has no
            # customer source at all: it refuses the send rather than blanking the tokens. That is
            # deliberate - a manually typed address is the one case where nothing else would notice.
            - type: GetRtEntitiesByType@1
              identity: ServiceAccount  # AB#5627: run as the pipeline service account, not as the route caller
              description: find the customer behind this recipient address
              ckTypeId: EnergyCommunity/Customer
              targetPath: $.customer
              take: 1
              fieldFilters:
                - attributePath: Contact.Email
                  operator: Equals
                  comparisonValuePath: $.key.address
            # AB#2569: one resolver for every send path. Replaced two PlaceholderReplace@1 rule
            # blocks generated per pipeline plus hand-written converter nodes - a fourth send path
            # meant a fourth copy, and a token wired here but not there produced different mail
            # from one template. A token whose source this path does not supply fails the node
            # rather than rendering blank. A refusal one recipient causes (a typed address matching no
            # customer) fails only that recipient and is listed in the answer; a refusal the template
            # causes fails every recipient alike, so the answer is status error with nobody served.
            - type: ResolveNotificationPlaceholders@1
              subjectPath: $.full.emailSubject
              subjectTargetPath: $.renderedSubject
              bodyPath: $.full.emailBody
              bodyTargetPath: $.renderedBody
              communityConfigPath: $.full.communityConfig.Items[0]
              renderingTypePath: $.full.emailRenderingType
              customerPath: $.customer.Items[0]
              # Must equal the contentId on the SendEMail@2 attachment below. They are two halves of
              # one reference and nothing checks them: rename one and the body keeps an <img> pointing
              # at a cid nobody attached, which the node cannot report because it only strips a
              # reference whose own attachment went missing.
              logoContentId: community-footer
            - type: SendEMail@2
              # AB#4554: literal-only serverConfiguration → tenant-neutral name.
              serverConfiguration: billing-smtp
              subjectPath: $.renderedSubject
              path: $.renderedBody
              bodyFormatPath: $.full.emailRenderingType
              toPath: $.key.address
              # BCC resolves config-driven from notificationEmailContact.
              bccPath: $.full.config.notificationEmailContact
              attachments:
                # AB#2570: the community's footer image, addressable as cid:community-footer.
                # Optional - a community without one still gets its message.
                - binaryIdPath: $.full.communityConfig.Items[0].Attributes.EmailFooterImage.BinaryId
                  fileNamePath: $.full.communityConfig.Items[0].Attributes.EmailFooterImage.Filename
                  contentTypePath: $.full.communityConfig.Items[0].Attributes.EmailFooterImage.ContentType
                  fileName: footer.png
                  contentType: image/png
                  contentId: community-footer
                  optional: true

        - type: ExecuteCSharp@1
          description: per-recipient result of the send
          targetPath: $.response
          returnType: RecordArray
          timeoutMs: 10000
          usings:
            - System.Collections.Generic
            - System.Linq
          arguments:
            - name: plan
              dataType: RecordArray
              valuePath: $.plan
            - name: errors
              dataType: RecordArray
              valuePath: $.sendErrors
            - name: bcc
              dataType: String
              valuePath: $.config.notificationEmailContact
          # failed = the mail certainly did not reach the recipient, so the app may resend; unknown = it may
          # have, so it is never resent. errorType names only the wrapper SendEMail@2 throws for every error, and
          # SmtpClient mails the accepted addresses before it throws for a refused To or BCC, with one message for
          # both. So a send-node error is failed only when every address was refused, or without a BCC when the
          # server answered with an error; an error raised before the send node is failed; anything else unknown.
          code: |
            System.Text.Json.JsonElement Property(System.Text.Json.JsonElement element, string name)
            {
                if (element.ValueKind != System.Text.Json.JsonValueKind.Object) return default;
                foreach (var property in element.EnumerateObject())
                {
                    if (string.Equals(property.Name, name, StringComparison.OrdinalIgnoreCase)) return property.Value;
                }
                return default;
            }
            string Text(System.Text.Json.JsonElement element) =>
                element.ValueKind == System.Text.Json.JsonValueKind.String ? element.GetString() : null;
            string ShortReason(string message)
            {
                var firstLine = (message ?? "").Split('\n')[0].Trim();
                var withoutNodePath = System.Text.RegularExpressions.Regex.Replace(firstLine, @"^\[.*?\]:\s*", "");
                return withoutNodePath.Length > 300 ? withoutNodePath.Substring(0, 297) + "..." : withoutNodePath;
            }
            bool CertainlyNotDelivered(string message, bool hasBcc)
            {
                if (string.IsNullOrWhiteSpace(message)) return false;
                var raisedBySendNode = message.Contains("Cannot send e-mail:");
                if (!raisedBySendNode) return true;
                var everyAddressRefused = message.Contains("Unable to send to all recipients.");
                var serverAnsweredWithError = message.Contains("The server response was:");
                return everyAddressRefused || (!hasBcc && serverAnsweredWithError);
            }
            Dictionary<string, object> Answer(string status, string message, int sent, List<object> failed, List<object> unknown) =>
                new Dictionary<string, object>
                {
                    ["status"] = status, ["message"] = message, ["sent"] = sent, ["failed"] = failed, ["unknown"] = unknown
                };

            var planRecord = (plan ?? new object[0]).OfType<System.Text.Json.JsonElement>().FirstOrDefault();
            var refusal = Text(Property(planRecord, "refusal"));
            if (refusal != null)
            {
                return new object[] { Answer("error", refusal, 0, new List<object>(), new List<object>()) };
            }
            var plannedRecipients = Property(planRecord, "recipients");
            var planIsReadable = plannedRecipients.ValueKind == System.Text.Json.JsonValueKind.Array
                && plannedRecipients.GetArrayLength() > 0;
            if (!planIsReadable)
            {
                var unreadablePlan = "The send plan could not be read; the outcome of the recipients is not known.";
                return new object[] { Answer("error", unreadablePlan, 0, new List<object>(), new List<object>()) };
            }
            var recipients = plannedRecipients.EnumerateArray().ToArray();
            var hasBcc = !string.IsNullOrWhiteSpace(bcc);
            var errorByIndex = new SortedDictionary<int, string>();
            foreach (var error in (errors ?? new object[0]).OfType<System.Text.Json.JsonElement>())
            {
                var index = Property(error, "index");
                if (index.ValueKind == System.Text.Json.JsonValueKind.Number && index.TryGetInt32(out var recipientIndex)
                    && recipientIndex >= 0 && recipientIndex < recipients.Length && !errorByIndex.ContainsKey(recipientIndex))
                {
                    errorByIndex[recipientIndex] = Text(Property(error, "message"));
                }
            }
            object Entry(KeyValuePair<int, string> error) => new Dictionary<string, object>
            {
                ["recipient"] = Text(Property(recipients[error.Key], "address")),
                ["customerRtId"] = Text(Property(recipients[error.Key], "customerRtId")),
                ["reason"] = ShortReason(error.Value)
            };
            var failed = errorByIndex.Where(error => CertainlyNotDelivered(error.Value, hasBcc)).Select(Entry).ToList();
            var unknown = errorByIndex.Where(error => !CertainlyNotDelivered(error.Value, hasBcc)).Select(Entry).ToList();
            var sent = recipients.Length - failed.Count - unknown.Count;
            var status = sent == recipients.Length ? "ok" : sent == 0 ? "error" : "partial";
            var summary = $"Message sent to {sent} of {recipients.Length} recipients.";
            return new object[] { Answer(status, summary, sent, failed, unknown) };

        # The adapter answers the HTTP call with the final data context verbatim - request headers,
        # principal, body and every intermediate result. Lift the answer to the top level and drop the rest.
        - type: SetPrimitiveValue@1
          targetPath: $.status
          valuePath: $.response[0].status
          valueType: String
        - type: SetPrimitiveValue@1
          targetPath: $.message
          valuePath: $.response[0].message
          valueType: String
        - type: SetPrimitiveValue@1
          targetPath: $.sent
          valuePath: $.response[0].sent
          valueType: Int
        - type: SelectByPath@1
          description: Lift the failed and unknown recipients to the response
          selectPath:
            - path: $.response[0].failed
              targetPath: $.failed
            - path: $.response[0].unknown
              targetPath: $.unknown
        - type: Project@1
          description: Shape the HTTP response body
          clear: true
          fields:
            - path: $.status
              inclusion: true
            - path: $.message
              inclusion: true
            - path: $.sent
              inclusion: true
            - path: $.failed
              inclusion: true
            - path: $.unknown
              inclusion: true
  - id: System.Communication/StatusMessage-1
