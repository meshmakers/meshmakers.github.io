              - id: System.StreamData/CkArchiveColumn.Indexed
                value: true
          - ckRecordId: System.StreamData/CkArchiveColumn
            attributes:
              - id: System.StreamData/CkArchiveColumn.Path
                value: ChargingPower
              - id: System.StreamData/CkArchiveColumn.Required
                value: false
              - id: System.StreamData/CkArchiveColumn.Indexed
                value: false
          # Computed (AB#4189/AB#7925): charging power in kW, >= 0. Integral(ChargePower) = Batterie geladen kWh.
          - ckRecordId: System.StreamData/CkArchiveColumn
            attributes:
              - id: System.StreamData/CkArchiveColumn.Path
                value: ''
              - id: System.StreamData/CkArchiveColumn.Required
                value: false
              - id: System.StreamData/CkArchiveColumn.Name
                value: ChargePower
              - id: System.StreamData/CkArchiveColumn.Formula
                value: 'if(chargingpower > 0, chargingpower, 0)'
              - id: System.StreamData/CkArchiveColumn.ResultType
                value: 3
              - id: System.StreamData/CkArchiveColumn.Indexed
                value: false
          # Ingested (AB#7925): positive discharging power in kW. Live Loxone sites write
          # ChargingPower >= 0 and DischargingPower >= 0 as two attributes (rt-pipelines-loxone.yaml,
          # em-battery / em-battery-discharge); the simulator writes a signed ChargingPower instead.
          - ckRecordId: System.StreamData/CkArchiveColumn
            attributes:
              - id: System.StreamData/CkArchiveColumn.Path
                value: DischargingPower
              - id: System.StreamData/CkArchiveColumn.Required
                value: false
              - id: System.StreamData/CkArchiveColumn.Indexed
                value: false
          # Computed (AB#4189/AB#7925): discharging power in kW, >= 0, for both conventions — the
          # negative part of a signed ChargingPower (simulator) or the positive DischargingPower
          # (live Loxone). Integral(DischargePower) = Batterie entladen kWh.
          # coalesce() makes a NULL operand count 0 (a Loxone row that carries only one of the two
          # power attributes), AB#8060. On an already activated archive the formula is changed with
          # UpdateComputedColumnFormula (backfill), AB#7943.
          - ckRecordId: System.StreamData/CkArchiveColumn
            attributes:
              - id: System.StreamData/CkArchiveColumn.Path
                value: ''
              - id: System.StreamData/CkArchiveColumn.Required
                value: false
              - id: System.StreamData/CkArchiveColumn.Name
                value: DischargePower
              - id: System.StreamData/CkArchiveColumn.Formula
                value: 'if(coalesce(chargingpower, 0) < 0, -chargingpower, if(coalesce(dischargingpower, 0) > 0, dischargingpower, 0))'
              - id: System.StreamData/CkArchiveColumn.ResultType
                value: 3
              - id: System.StreamData/CkArchiveColumn.Indexed
                value: false

