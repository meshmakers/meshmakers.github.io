  # ============================================================
  # Energy metering (AB#3442)
  # ============================================================
  # TargetCkTypeId matches EXACTLY (no derived types), so each concrete Meter
  # subtype gets its own archive: Meter (generic sub-meters), GridConnection,
  # ChargingStation, Appliance. Keeps per-shape queries simple, too.
  #
  # Generic sub-meter consumption (one row per Meter update)
  - rtId: 6a0e000000000000000a0006
    ckTypeId: System.StreamData/RawArchive
    rtWellKnownName: MeterArchive
    attributes:
      - id: System.StreamData/Archive.TargetCkTypeId
        value: EnergyIQ/Meter
      - id: System.StreamData/Archive.Status
