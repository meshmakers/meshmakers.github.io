            attributes:
              - id: System.StreamData/CkArchiveColumn.Path
                value: ActivePower
              - id: System.StreamData/CkArchiveColumn.Required
                value: false
              - id: System.StreamData/CkArchiveColumn.Indexed
                value: true

  # Grid coupling point, signed ActivePower (+ import / − export).
  # ImportPower / ExportPower split the sign into two non-negative computed columns so the
  # Energiebilanz board integrates them (AggregationType Integral). Never split the sign with a
  # field filter: a filter drops rows and the step integral then carries the last positive value
  # across an export period (AB#7919). Formulas use the physical (lower-case) column names.
  - rtId: 6a0e000000000000000a0007
    ckTypeId: System.StreamData/RawArchive
    rtWellKnownName: GridConnectionArchive
    attributes:
      - id: System.StreamData/Archive.TargetCkTypeId
        value: EnergyIQ/GridConnection
      - id: System.StreamData/Archive.Status
        value: 0
      - id: System.StreamData/Archive.Columns
        value:
          - ckRecordId: System.StreamData/CkArchiveColumn
            attributes:
              - id: System.StreamData/CkArchiveColumn.Path
                value: ActivePower
              - id: System.StreamData/CkArchiveColumn.Required
                value: false
              - id: System.StreamData/CkArchiveColumn.Indexed
                value: true
          # Computed (AB#4189/AB#7925): grid import in kW, >= 0. Integral(ImportPower) = Netzbezug kWh.
          - ckRecordId: System.StreamData/CkArchiveColumn
            attributes:
              - id: System.StreamData/CkArchiveColumn.Path
                value: ''
              - id: System.StreamData/CkArchiveColumn.Required
                value: false
              - id: System.StreamData/CkArchiveColumn.Name
                value: ImportPower
              - id: System.StreamData/CkArchiveColumn.Formula
                value: 'if(activepower > 0, activepower, 0)'
              - id: System.StreamData/CkArchiveColumn.ResultType
                value: 3
              - id: System.StreamData/CkArchiveColumn.Indexed
                value: false
          # Computed (AB#4189/AB#7925): grid feed-in in kW, >= 0. Integral(ExportPower) = Netzeinspeisung kWh.
          - ckRecordId: System.StreamData/CkArchiveColumn
            attributes:
              - id: System.StreamData/CkArchiveColumn.Path
                value: ''
              - id: System.StreamData/CkArchiveColumn.Required
                value: false
              - id: System.StreamData/CkArchiveColumn.Name
                value: ExportPower
              - id: System.StreamData/CkArchiveColumn.Formula
                value: 'if(activepower < 0, -activepower, 0)'
              - id: System.StreamData/CkArchiveColumn.ResultType
                value: 3
              - id: System.StreamData/CkArchiveColumn.Indexed
                value: false

