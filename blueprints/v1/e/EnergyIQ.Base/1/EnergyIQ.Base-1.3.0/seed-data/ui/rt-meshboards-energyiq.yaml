          {"timeFilter": {"enabled": true, "selection": {"type": "relative", "relativeValue": 24, "relativeUnit": "hours"}}, "entitySelectors": [{"id": "standort", "label": "Standort", "ckTypeId": "EnergyIQ/Site", "attributeMappings": [{"attributePath": "name", "variableName": "standortName"}], "showInToolbar": true, "defaultRtId": "6789a00000000000000000a1"}, {"id": "leuchten", "label": "Leuchten", "ckTypeId": "EnergyIQ/Site", "attributeMappings": [], "showInToolbar": false, "followsSelectorId": "standort", "childScope": {"path": [{"roleId": "System/ParentChild", "direction": "in", "targetCkTypeId": "EnergyIQ/Building"}, {"roleId": "System/ParentChild", "direction": "in", "targetCkTypeId": "EnergyIQ/BuildingStorey"}, {"roleId": "System/ParentChild", "direction": "in", "targetCkTypeId": "EnergyIQ/Space"}, {"roleId": "EnergyIQ/SpaceElements", "direction": "in", "targetCkTypeId": "EnergyIQ/Luminaire"}]}}, {"id": "raffstores", "label": "Raffstores", "ckTypeId": "EnergyIQ/Site", "attributeMappings": [], "showInToolbar": false, "followsSelectorId": "standort", "childScope": {"path": [{"roleId": "System/ParentChild", "direction": "in", "targetCkTypeId": "EnergyIQ/Building"}, {"roleId": "System/ParentChild", "direction": "in", "targetCkTypeId": "EnergyIQ/BuildingStorey"}, {"roleId": "System/ParentChild", "direction": "in", "targetCkTypeId": "EnergyIQ/Space"}, {"roleId": "EnergyIQ/SpaceElements", "direction": "in", "targetCkTypeId": "EnergyIQ/ShadingDevice"}]}}], "autoRefreshSeconds": 300}
