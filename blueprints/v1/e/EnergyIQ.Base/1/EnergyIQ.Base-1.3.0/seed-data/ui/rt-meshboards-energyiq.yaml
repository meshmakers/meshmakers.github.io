  #   direkt aus PV  = max(0, $PV - $Export - $Charge)  PV archive TotalCurrentPower minus ExportPower and ChargePower
  #   Verbrauch      = sum of the three stacks          (= Import - Export + PV + Discharge - Charge unless clamped)
