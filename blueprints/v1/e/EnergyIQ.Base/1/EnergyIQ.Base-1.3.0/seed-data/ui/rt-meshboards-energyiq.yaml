  # Tagesprofil (AB#7944): how the site's consumption is covered, stacked per time bucket of the board
  # window (pick one day in the time filter). Energy balance per bucket (average kW):
  #   aus Netz       = $Import                          ImportPower    (grid archive,    selector netz)
