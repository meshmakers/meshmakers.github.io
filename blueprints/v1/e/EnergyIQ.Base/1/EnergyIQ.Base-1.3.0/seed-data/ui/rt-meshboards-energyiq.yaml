  # ============================================================
  # Dashboard: Beschattung & Beleuchtung (AB#4327)
  #
  # Current status (tables) + history. The comparison question ("wo brennt am
  # laengsten Licht") is answered by bar charts over GroupingAggregationSdQuerys
  # on the status archives (a0012/a0013, GROUP BY the Name column). Honest
  # limitation: archive rows are event-based (a row per state change + one per
  # initial snapshot), so AVG is sample-weighted, not time-weighted - the
  # Einschaltquote ranks rooms but is not an exact duty cycle. The line charts
  # are per-room via the two entity selectors (static RtIds pins do NOT fan out
  # per entity - selector childScope is the only per-entity mechanism).
  # Site selection (AB#7693): leader `standort` (EnergyIQ/Site); followers `leuchten` /
  # `raffstores` (Site -> Building -> Storey -> Space -SpaceElements-> Luminaire/ShadingDevice)
  # scope both tables and the four bar charts. The room pickers stay independent (see file header).
  # ============================================================
  - rtId: 6a4d5000000000000000b100
    ckTypeId: System.UI/Dashboard
    attributes:
      - id: System/Name
        value: Beschattung & Beleuchtung
      - id: System/Description
        value: |-
          Aktueller Licht- und Beschattungsstatus, Einschaltquote/Schaltvorgänge je Leuchte des gewählten Standorts und Aktivität je Stunde (Heatmaps).
