  # Autarkie / Eigenverbrauchsquote gauges (AB#7943): formula gauges (AB#7950) over the board variables the
  # kWh tiles publish. Consumption = Import - Export + PV + Discharge - Charge (energy balance of the site).
  #   Autarkie       = 1 - Import / Consumption
  #   Eigenverbrauch = (PV - Export) / PV
  # Shown in % without decimals, clamped to 0-100; a denominator <= 0 gives 1/0 = Infinity, which the gauge shows
  # as '-' (never 0 and never NaN). No second set of kWh queries.
  - rtId: 6a4aaf1922664f2b26c67ed3
    ckTypeId: System.UI/DashboardWidget
    associations:
      - roleId: System/ParentChild
        targetRtId: 6a4aaf1922664f2b26c67ecc
        targetCkTypeId: System.UI/Dashboard
    attributes:
      - id: System/Name
        value: Autarkie
      - id: System.UI/DashboardWidget.Type
        value: gauge
      - id: System.UI/DashboardWidget.Col
        value: 1
      - id: System.UI/DashboardWidget.Row
        value: 7
      - id: System.UI/DashboardWidget.ColSpan
        value: 6
      - id: System.UI/DashboardWidget.RowSpan
        value: 6
      - id: System.UI/DashboardWidget.DataSourceType
        value: static
      - id: System.UI/DashboardWidget.DataSourceCkTypeId
        value: ''
      - id: System.UI/DashboardWidget.DataSourceRtId
        value: ''
      - id: System.UI/DashboardWidget.Config
        value: |-
          {"gaugeType": "arc", "valueAttribute": "", "valueMode": "formula", "formula": "if(($gridImportKwh - $gridExportKwh + $pvEnergyKwh + $batteryDischargeKwh - $batteryChargeKwh) > 0, round(max(0, min(100, (1 - $gridImportKwh / ($gridImportKwh - $gridExportKwh + $pvEnergyKwh + $batteryDischargeKwh - $batteryChargeKwh)) * 100))), 1 / 0)", "min": 0, "max": 100, "suffix": " %", "showLabel": true}

  - rtId: 6a4aaf1922664f2b26c67ed4
    ckTypeId: System.UI/DashboardWidget
    associations:
