  # ============================================================
  # Dashboard: Heizung & Kühlung
  # Site selection (AB#7693): leader `standort` (EnergyIQ/Site); followers `waermepumpe`,
  # `speicher`, `pumpe` (Site -> Building -> Storey -> Space -> HeatPump/ThermalEnergyStorage/Pump).
  # Heat-pump meter (AB#7888): follower `wpzaehler` walks on from the heat pump to its meter through
  # EnergyIQ 2.14.0 `EquipmentMeters` inbound (MeteredBy): Site -> Building -> Storey -> Space
  # -> HeatPump -> Meter = 5 hops, the platform maximum (MAX_SCOPE_HOPS). The five meter widgets
  # (queries ...e206-...e20a, no RtIds pin) bind it. Only meters linked to a heat pump are found, so
  # the other Technikraum meters stay out; a site without a heat pump (Fusch) resolves empty and the
  # widgets show the empty state. Adding a site: link its heat-pump meter with EquipmentMeters.
  # Bilanzierung note: the Loxone meters tick event-based (not uniformly sampled),
  # so kWh-in-window is NOT SUM×dt (that trick needs the 10-s simulator sampling).
  # Instead: Ø-Leistung = AVG of the samples, and the window balance is shown as
  # counter start (MIN ImportedEnergy) / end (MAX) KPIs + the cumulative chart.
  # ============================================================
  - rtId: 6a4b4000000000000000e100
    ckTypeId: System.UI/Dashboard
    attributes:
      - id: System/Name
        value: Heizung & Kühlung
      - id: System/Description
        value: |-
          Wärmepumpe, Warmwasser und Heizkreis des gewählten Standorts: aktuelle Anlagenwerte, Temperatur-Verläufe (Heizkreis, Sole, Warmwasser) und WP-Strombilanz über den gewählten Zeitraum. Die fünf Kacheln „Wärmepumpe – …“ zeigen den Stromzähler der Wärmepumpe des gewählten Standorts; ein Standort ohne Wärmepumpe zeigt dort keine Daten.
