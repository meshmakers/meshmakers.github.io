  # `aussensensor` (Site -> ExternalSpace -SpaceSensors-> TemperatureSensor, outdoor chart).
  # The room picker `raum` stays independent (see file header).
  # ============================================================
  - rtId: 6a4a9f277e487162fbe3860a
    ckTypeId: System.UI/Dashboard
    attributes:
      - id: System/Name
        value: Raumtemperaturen
      - id: System/Description
        value: |-
          Raumtemperatur-Übersicht des gewählten Standorts: Verlauf aus dem TemperatureSensorArchive (Raum wählbar) + Außentemperatur-Verlauf + aktuelle Werte der Raumsensoren des Standorts. Hinweis: Der Raum-Verlauf folgt nicht dem Standort; der Raum wird separat gewählt.
          ---MESHBOARD_VARIABLES---
          {"timeFilter": {"enabled": true, "selection": {"type": "relative", "relativeValue": 24, "relativeUnit": "hours"}}, "entitySelectors": [{"id": "standort", "label": "Standort", "ckTypeId": "EnergyIQ/Site", "attributeMappings": [{"attributePath": "name", "variableName": "standortName"}], "showInToolbar": true, "defaultRtId": "6789a00000000000000000a1"}, {"id": "raum", "label": "Raum", "ckTypeId": "EnergyIQ/Space", "attributeMappings": [{"attributePath": "name", "variableName": "raumName"}], "showInToolbar": true, "defaultRtId": "6789a00000000000000011d1", "childScope": {"targetCkTypeId": "EnergyIQ/TemperatureSensor", "roleId": "EnergyIQ/SpaceSensors", "direction": "in"}}, {"id": "raumsensoren", "label": "Raumsensoren", "ckTypeId": "EnergyIQ/Site", "attributeMappings": [], "showInToolbar": false, "followsSelectorId": "standort", "childScope": {"path": [{"roleId": "System/ParentChild", "direction": "in", "targetCkTypeId": "EnergyIQ/Building"}, {"roleId": "System/ParentChild", "direction": "in", "targetCkTypeId": "EnergyIQ/BuildingStorey"}, {"roleId": "System/ParentChild", "direction": "in", "targetCkTypeId": "EnergyIQ/Space"}, {"roleId": "EnergyIQ/SpaceSensors", "direction": "in", "targetCkTypeId": "EnergyIQ/TemperatureSensor"}]}}, {"id": "aussensensor", "label": "Außensensor", "ckTypeId": "EnergyIQ/Site", "attributeMappings": [], "showInToolbar": false, "followsSelectorId": "standort", "childScope": {"path": [{"roleId": "System/ParentChild", "direction": "in", "targetCkTypeId": "EnergyIQ/ExternalSpace"}, {"roleId": "EnergyIQ/SpaceSensors", "direction": "in", "targetCkTypeId": "EnergyIQ/TemperatureSensor"}]}}], "autoRefreshSeconds": 300}
      - id: System.UI/Dashboard.Columns
        value: 12
      - id: System.UI/Dashboard.RowHeight
        value: 50
      - id: System.UI/Dashboard.Gap
        value: 8

  - rtId: 6a4a9f397e487162fbe3860b
    ckTypeId: System.UI/DashboardWidget
    associations:
      - roleId: System/ParentChild
        targetRtId: 6a4a9f277e487162fbe3860a
        targetCkTypeId: System.UI/Dashboard
    attributes:
      - id: System/Name
        value: Raumtemperatur – Verlauf
      - id: System.UI/DashboardWidget.Type
        value: lineChart
      - id: System.UI/DashboardWidget.Col
        value: 1
      - id: System.UI/DashboardWidget.Row
        value: 1
      - id: System.UI/DashboardWidget.ColSpan
        value: 8
      - id: System.UI/DashboardWidget.RowSpan
        value: 7
      - id: System.UI/DashboardWidget.DataSourceType
        value: systemQuery
      - id: System.UI/DashboardWidget.DataSourceCkTypeId
        value: ''
      - id: System.UI/DashboardWidget.DataSourceRtId
        value: 6a4a9ca67e487162fbe38608
      - id: System.UI/DashboardWidget.Config
