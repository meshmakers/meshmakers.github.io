$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
# MeshBoards for the energyiq demo tenant: "Raumtemperaturen", "Energie" and
# "Energiebilanz" (cumulated kWh KPIs).
#
# Each board is a System.UI/Dashboard + its DashboardWidgets (parent association),
# backed by persistent queries (System/SimpleSdQuery for archive time series,
# System/SimpleRtQuery for live values) and 5-minute RollupArchives (AVG/MIN/MAX)
# on the raw archives. The rollups are REQUIRED for the resolution-aware line
# charts: raw archives declare no grain (Period=null), so without a rollup the
# series resolver returns UNKNOWN_BASE_GRAIN with points=0 and the widget
# degrades to a single bucket.
#
# Line charts get their per-entity series through the boards' entity selectors
# (MESHBOARD_VARIABLES blob in the dashboard description): the resolution-aware
# fan-out queries one series per resolved source rtId and labels it with the
# entity's name. Hidden selectors (showInToolbar: false) act as fixed scopes.
# The childScope target type must match the archive's target type EXACTLY —
# polymorphic scopes (e.g. EnergyIQ/Meter) would fan out rtIds that have no rows
# in the queried archive and produce ghost legend entries (gap-filled null bins).
#
# Site selection on "Energie" and "Energiebilanz" (AB#7692): one visible leader selector
# `standort` ("Standort") lists the electrical DistributionSystems (picker filter
# systemType = ELECTRICAL; one per site: Firmianstraße, Fusch) and defaults to Firmianstraße.
# Hidden followers (`followsSelectorId: standort`) turn the picked system into the source rtIds
# of one target type each, and every widget binds the matching follower (`entitySelectorId`):
#   netz      DS -SystemMembers-> GridConnection                     (grid line chart, KPI Netzbezug)
#   pv        DS -SystemMembers-> PhotovoltaicSystem                 (PV line chart, 3 PV KPIs)
#   wallboxen DS -SystemMembers-> ChargingStation                    (Wallboxen line chart)
#   geraete   DS -SystemMembers-> Appliance                          (Geräte line chart)
#   batterie  DS -SystemMembers-> PhotovoltaicSystem -SystemMembers-> BatteryStorage (path, 2 hops)
#   zaehler   DS -SystemMembers-> Meter (incl. GridConnection/ChargingStation/Appliance; runtime
#             table "Aktuelle Leistungen", rtId IN filter on the server)
# A site without e.g. a battery resolves an EMPTY scope: the widget shows its no-data state and
# sends no query (never the whole archive). Adding a site: give it an electrical DistributionSystem
# (DistributionSystemTypeValue 3) whose SystemMembers are its GridConnection, PhotovoltaicSystem
# (battery as member of the PV system), ChargingStations, Appliances and Meters — no board change.
# Only the leader's defaultRtId names a site. Background: docs/meshboard-site-selector-fit.md.
#
# Site selection on "Raumtemperaturen", "Heizung & Kühlung" and "Beschattung & Beleuchtung"
# (AB#7693): the same visible "Standort" selector, but on EnergyIQ/Site (default Firmianstraße
# 6789a00000000000000000a1). Rooms hang off the spatial tree, which the electrical DistributionSystem
# does not reach at every site, so these boards walk Site -> Building -> BuildingStorey -> Space
# (every site models storeys; a room directly under a Building is not found). Followers:
#   raumsensoren  ... Space -SpaceSensors-> TemperatureSensor      (table Aktuelle Raumtemperaturen)
#   aussensensor  Site -> ExternalSpace -SpaceSensors-> TemperatureSensor (outdoor chart)
#   waermepumpe   ... Space -ParentChild-> HeatPump                (HP table + 4 HP charts)
#   speicher      ... Space -ParentChild-> ThermalEnergyStorage    (storage table + chart)
#   pumpe         ... Space -ParentChild-> Pump                    (pump table)
#   wpzaehler     ... Space -ParentChild-> HeatPump -EquipmentMeters (in, MeteredBy)-> Meter
#                 (5 hops = the maximum; the five heat-pump meter widgets, AB#7888)
#   leuchten      ... Space -SpaceElements-> Luminaire             (light table + 3 bar charts)
#   raffstores    ... Space -SpaceElements-> ShadingDevice         (shading table + bar chart)
# Beschattung & Beleuchtung has no room pickers: the two former per-room line charts are site-wide
# heatmaps (switches / blind movements per day x hour) on the `leuchten` / `raffstores` followers.
# The `raum` picker on Raumtemperaturen stays visible and independent until the dependent picker
# (AB#7893) is used there (AB#7926).
#
# "Energiefluss live" (AB#7941): the first widget of Energie is a process widget (diagram rtId 6a4b79410000000000000d01,
# seed-data/ui/rt-process-diagrams-energyiq.yaml) with five runtime-query bindings, one per selector follower
# (netz, pv, batterie, wallboxen, geraete); wallboxes and devices are summed per site. Docs: Part 6 of
# docs/meshboard-site-selector-fit.md.
#
# Imported as Status=Created; om_importrt.ps1 activates the rollups after import
# (provisions the CrateDB tables). Backfill of pre-existing history is optional:
#   octo-cli -c BackfillRollup -id <rollupRtId>
dependencies:
  - System-[2.0,3.0)
  - System.StreamData-[1.2,2.0)
  - System.UI-[2.1,3.0)
  - EnergyIQ-[2.0,3.0)
entities:

