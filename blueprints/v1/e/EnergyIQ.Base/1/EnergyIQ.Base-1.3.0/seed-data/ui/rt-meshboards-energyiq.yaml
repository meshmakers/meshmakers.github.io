  - rtId: 6a4d5000000000000000b112
    ckTypeId: System/GroupingAggregationSdQuery
    attributes:
      - id: System/Name
        value: Licht-Einschaltquote je Leuchte
      - id: System/Description
        value: >-
          Time-weighted average (LOCF interval weighting, AB#4336) of the 0/100 DimmingLevel rows per luminaire Name over the board window - the real duty cycle. Replaces the sample-weighted AVG approximation from AB#4327; a light that is on for 3 hours no longer weighs the same as one that toggles twice in a minute. Answers 'wo brennt am laengsten Licht'.
      - id: System/Query.CkTypeId
        value: EnergyIQ/Luminaire
      - id: System/Query.NavigationFilterMode
        value: 0
      - id: System/StreamDataQuery.ArchiveRtId
        value: '6a0e000000000000000a0012'
      - id: System/Query.GroupByColumns
        value:
          - Name
      - id: System/AggregationQueryColumns
        value:
          - ckRecordId: System/AggregationQueryColumn
            attributes:
              - id: System/AttributePath
                value: DimmingLevel
              - id: System/AggregationType
                # 5 = TimeWeightedAverage (AB#4336) - real duty cycle via LOCF over the
                # event-based status rows; 3 (Average) was sample-weighted and wrong for duration.
                value: 5

