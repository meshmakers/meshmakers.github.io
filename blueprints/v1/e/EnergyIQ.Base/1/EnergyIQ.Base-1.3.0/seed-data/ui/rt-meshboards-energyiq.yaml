  # ============================================================
  # Dashboard: Energiebilanz (energy in kWh over the board window)
  #
  # Every kWh tile is the step integral (AggregationType 7 = Integral, AB#7918/AB#7919) of a
  # power column in kW over the board window [from, to): result column <column>_integral in
  # kW x h = kWh, so the KPIs use valueMultiplier 1. The integral weights each row by how long
  # it held (last observation carried forward), so 5-s grid rows, on-change PV/battery rows and
  # 10-s simulator rows all give the right energy. An empty window yields null and the KPI shows
  # its empty state "–", never 0.
  #
  #   PV-Erzeugung      = Integral(TotalCurrentPower)   PV archive      selector pv
  #   Einspeisung       = Integral(ExportPower)         grid archive    selector netz
  #   Netzbezug         = Integral(ImportPower)         grid archive    selector netz
  #   Batterie geladen  = Integral(ChargePower)         battery archive selector batterie
  #   Batterie entladen = Integral(DischargePower)      battery archive selector batterie
  #   Eigenverbrauch    = max(0, PV-Erzeugung - Einspeisung)   formula KPI (AB#7950)
  #
  # ImportPower/ExportPower/ChargePower/DischargePower are computed archive columns (AB#4189,
  # rt-archives-energyiq.yaml) — the sign split is never a field filter (a filter drops rows
  # and breaks the step integral). The PV, Einspeisung, Netzbezug and battery KPIs publish their
  # value as board variables (pvEnergyKwh, gridExportKwh, gridImportKwh, batteryChargeKwh,
  # batteryDischargeKwh) for the Eigenverbrauch formula and the Autarkie / Eigenverbrauchsquote gauges (AB#7943).
  # The PV columns SelfConsumption/GridFeedIn are simulator-only and not read by this board.
  # Formulas, clamp and the measured cross-check: docs/meshboard-site-selector-fit.md,
  # section "Energiebilanz kWh".
  # ============================================================
  - rtId: 6a4aaf1922664f2b26c67ecc
    ckTypeId: System.UI/Dashboard
    attributes:
      - id: System/Name
        value: Energiebilanz
      - id: System/Description
        value: |-
          Kumulierte Energiebilanz des gewählten Standorts über den gewählten Zeitraum: PV-Erzeugung, Eigenverbrauch, Einspeisung, Netzbezug sowie geladene/entladene Batterie-Energie. Werte in kWh = zeitgewichtetes Integral der Leistung über den Zeitraum (jeder Messwert zählt so lange, bis der nächste kommt); Eigenverbrauch = PV-Erzeugung − Einspeisung. Zwei Tachos zeigen Autarkie (1 − Netzbezug / Verbrauch) und Eigenverbrauchsquote ((PV − Einspeisung) / PV) in %; Verbrauch = Netzbezug − Einspeisung + PV + Batterie entladen − Batterie geladen. Ohne Daten im Zeitraum zeigt eine Kachel „–“.
          ---MESHBOARD_VARIABLES---
