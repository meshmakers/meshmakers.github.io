                value: timestamp
              - id: System/SortOrder
                value: 1

  - rtId: 6a4a9ca67e487162fbe38608
    ckTypeId: System/SimpleSdQuery
    attributes:
      - id: System/Name
        value: Raumtemperaturen (Archiv)
      - id: System/Description
        value: >-
          Raw time series of all EnergyIQ/TemperatureSensor entities from the TemperatureSensorArchive. Used by the Raumtemperaturen MeshBoard line chart.
      - id: System/Query.CkTypeId
        value: EnergyIQ/TemperatureSensor
      - id: System/Query.NavigationFilterMode
        value: 0
      - id: System/StreamDataQuery.ArchiveRtId
        value: 6a0e000000000000000a0001
      - id: System/StreamDataQuery.Columns
        value:
          - CurrentValue
      - id: System/Query.Sorting
        value:
          - ckRecordId: System/SortOrderItem
            attributes:
