          {"chartType": "line", "categoryField": "timestamp", "seriesGroupField": "name", "valueField": "CurrentValue", "showLegend": true, "legendPosition": "bottom", "showMarkers": false, "showDataBadge": true, "queryName": "Außentemperatur (Archiv)", "queryRtId": "6a4a9ca67e487162fbe38618", "queryFamily": "streamData", "resolutionAware": true, "requiredAggregation": "AVG", "entitySelectorId": "aussensensor"}

