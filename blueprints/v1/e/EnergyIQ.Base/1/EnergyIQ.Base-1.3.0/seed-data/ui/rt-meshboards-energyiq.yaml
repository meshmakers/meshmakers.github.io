  # 5-minute AVG/MIN/MAX rollup on CurrentValue (function: 0=AVG, 1=MIN, 2=MAX). Columns below
  # mirrors the RollupColumnGenerator derivation and MUST be kept in sync with Aggregations[].
  - rtId: 6a4a9fe67e487162fbe3860f
    ckTypeId: System.StreamData/RollupArchive
    rtWellKnownName: TemperatureSensorRollup5m
    attributes:
      - id: System.StreamData/Archive.TargetCkTypeId
        value: EnergyIQ/TemperatureSensor
      - id: System.StreamData/Archive.Status
        value: 0
      # Columns is MANDATORY on Archive: persist the RollupColumnGenerator output
      # ({sourcepath}_{fn}; AVG expands to _avg_sum + _avg_count) here — ActivateArchive
      # derives columns only in-memory and never writes them back, so a seeded rollup
      # without this block breaks the archives GraphQL (non-null columns) for the whole
      # list page (prod-1 energyiq incident 2026-08-09).
      - id: System.StreamData/Archive.Columns
        value:
          - ckRecordId: System.StreamData/CkArchiveColumn
            attributes:
              - id: System.StreamData/CkArchiveColumn.Path
                value: currentvalue_avg_sum
              - id: System.StreamData/CkArchiveColumn.Required
                value: false
              - id: System.StreamData/CkArchiveColumn.Indexed
                value: true
          - ckRecordId: System.StreamData/CkArchiveColumn
            attributes:
              - id: System.StreamData/CkArchiveColumn.Path
                value: currentvalue_avg_count
              - id: System.StreamData/CkArchiveColumn.Required
                value: false
              - id: System.StreamData/CkArchiveColumn.Indexed
                value: true
          - ckRecordId: System.StreamData/CkArchiveColumn
            attributes:
              - id: System.StreamData/CkArchiveColumn.Path
                value: currentvalue_min
              - id: System.StreamData/CkArchiveColumn.Required
                value: false
              - id: System.StreamData/CkArchiveColumn.Indexed
                value: true
          - ckRecordId: System.StreamData/CkArchiveColumn
            attributes:
              - id: System.StreamData/CkArchiveColumn.Path
                value: currentvalue_max
              - id: System.StreamData/CkArchiveColumn.Required
                value: false
              - id: System.StreamData/CkArchiveColumn.Indexed
                value: true
      - id: System.StreamData/RollupArchive.SourceArchiveRtId
        value: '6a0e000000000000000a0001'
      - id: System.StreamData/RollupArchive.BucketSizeMs
        value: 300000
      - id: System.StreamData/RollupArchive.WatermarkLagMs
        value: 120000
      - id: System.StreamData/RollupArchive.Aggregations
        value:
          - ckRecordId: System.StreamData/CkRollupAggregation
            attributes:
              - id: System.StreamData/CkRollupAggregation.SourcePath
                value: CurrentValue
              - id: System.StreamData/CkRollupAggregation.Function
                value: 0
          - ckRecordId: System.StreamData/CkRollupAggregation
            attributes:
              - id: System.StreamData/CkRollupAggregation.SourcePath
                value: CurrentValue
              - id: System.StreamData/CkRollupAggregation.Function
                value: 1
          - ckRecordId: System.StreamData/CkRollupAggregation
            attributes:
              - id: System.StreamData/CkRollupAggregation.SourcePath
                value: CurrentValue
              - id: System.StreamData/CkRollupAggregation.Function
                value: 2

  # ============================================================
  # Dashboard: Energie
  # ============================================================
  - rtId: 6a4aa4fa22664f2b26c67e7c
    ckTypeId: System.UI/Dashboard
    attributes:
      - id: System/Name
        value: Energie
      - id: System/Description
        value: |-
          Energieübersicht des gewählten Standorts. Energiefluss live (oben): aktuelle Leistung von Netz (+ Bezug, − Einspeisung), PV, Batterie (Laden/Entladen, Ladezustand), Wallboxen und Geräten (Summe je Standort) in kW; ein Knoten, den der Standort nicht hat (z. B. Batterie in Fusch), zeigt –. Darunter: Netzbezug, PV-Produktion, Wallboxen, Geräte und Batteriespeicher aus den Stream-Data-Archiven + aktuelle Leistungen der Zähler des Standorts. Tagesprofil: womit der Verbrauch je Zeitabschnitt gedeckt wird (direkt aus PV, aus Batterie, aus Netz, gestapelt) mit der PV-Erzeugung als Linie – für einen Tag den Zeitraum oben auf diesen Tag setzen. Heatmap "Netzbezug – Stunde × Tag": mittlere Netzleistung je Stunde der letzten 30 Tage (eigenes Zeitfenster, unabhängig vom Zeitraum oben).
          ---MESHBOARD_VARIABLES---
          {"timeFilter": {"enabled": true, "selection": {"type": "relative", "relativeValue": 24, "relativeUnit": "hours"}}, "autoRefreshSeconds": 300, "entitySelectors": [{"id": "standort", "label": "Standort", "ckTypeId": "EnergyIQ/DistributionSystem", "attributeMappings": [{"attributePath": "name", "variableName": "standortName"}], "showInToolbar": true, "defaultRtId": "6789a00000000000006000d3", "filters": [{"attributePath": "systemType", "operator": "EQUALS", "comparisonValue": "ELECTRICAL"}]}, {"id": "netz", "label": "Netzanschluss", "ckTypeId": "EnergyIQ/DistributionSystem", "attributeMappings": [], "showInToolbar": false, "followsSelectorId": "standort", "childScope": {"targetCkTypeId": "EnergyIQ/GridConnection", "roleId": "EnergyIQ/SystemMembers", "direction": "out"}}, {"id": "pv", "label": "PV-Anlage", "ckTypeId": "EnergyIQ/DistributionSystem", "attributeMappings": [], "showInToolbar": false, "followsSelectorId": "standort", "childScope": {"targetCkTypeId": "EnergyIQ/PhotovoltaicSystem", "roleId": "EnergyIQ/SystemMembers", "direction": "out"}}, {"id": "wallboxen", "label": "Wallboxen", "ckTypeId": "EnergyIQ/DistributionSystem", "attributeMappings": [], "showInToolbar": false, "followsSelectorId": "standort", "childScope": {"targetCkTypeId": "EnergyIQ/ChargingStation", "roleId": "EnergyIQ/SystemMembers", "direction": "out"}}, {"id": "geraete", "label": "Geräte", "ckTypeId": "EnergyIQ/DistributionSystem", "attributeMappings": [], "showInToolbar": false, "followsSelectorId": "standort", "childScope": {"targetCkTypeId": "EnergyIQ/Appliance", "roleId": "EnergyIQ/SystemMembers", "direction": "out"}}, {"id": "batterie", "label": "Batterie", "ckTypeId": "EnergyIQ/DistributionSystem", "attributeMappings": [], "showInToolbar": false, "followsSelectorId": "standort", "childScope": {"path": [{"roleId": "EnergyIQ/SystemMembers", "direction": "out", "targetCkTypeId": "EnergyIQ/PhotovoltaicSystem"}, {"roleId": "EnergyIQ/SystemMembers", "direction": "out", "targetCkTypeId": "EnergyIQ/BatteryStorage"}]}}, {"id": "zaehler", "label": "Zähler", "ckTypeId": "EnergyIQ/DistributionSystem", "attributeMappings": [], "showInToolbar": false, "followsSelectorId": "standort", "childScope": {"targetCkTypeId": "EnergyIQ/Meter", "roleId": "EnergyIQ/SystemMembers", "direction": "out"}}]}
      - id: System.UI/Dashboard.Columns
