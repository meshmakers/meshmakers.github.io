          targetValueKind: Array
          targetValueWriteMode: Append
          updateKindPath: $.cu1.modOp
          ckTypeIdPath: $.cu1.ckTypeId
          rtIdPath: $.cu1.rtId
          rtWellKnownNamePath: $.cu1.wkn
