$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
- Basic-[2.0.2,3.0)
- Basic.Energy-[1.3,2.0)
- EnergyCommunity-[4.1,5.0)
- System.Communication-[3.22,4.0)

# create-demo-community — DataFlow and pipeline that seed a complete demo community
# (customers, facilities, metering points, participation periods, prices). One very
# large inline pipeline definition; it cannot be cut further at entity granularity.
# Part of the EnergyCommunity.Simulation blueprint — see blueprint.yaml for the full file list.
entities:

# ─── Demo-community generator (AB#4579, extended AB#4703) ────────────────
#
#   …b05  DataFlow  create-demo-community
#   …b04  Pipeline  create-demo-community
#
# CREATES a PRESENTABLE, self-contained demo energy community so demo/test
# tenants need no hand-seeded data and no EDA:
#   - 14 EnergyCommunity/Customer (obviously fictional contacts; CustomerNumber
#     is auto-assigned via the Base-seeded AutoIncrement)
#   - 14 Basic.Energy/OperatingFacility (the original "EC Demo Community"
#     shared facility + 13 member facilities; each facility is wired to
#     exactly ONE customer via EnergyCommunity/AssociatedFacilities — the
#     model's inbound multiplicity on that role is One, so the 4 original
#     metering points belong to the community-operator customer 01)
#   - 14 EnergyCommunity/Consumer (0801..0814) + 3 EnergyCommunity/Producer
#     (0901..0903) metering points (ParentChild to their facility; varied
#     PartitionFactor 50..100 so distribution logic is visible in the UI)
#   - 31 Basic.Energy/EnergyMeasurement anchors (consumers 2 OBIS codes,
#     producers 1; wkn <meteringPointRtId>_<obisCode>, ParentChild to the
#     metering point)
#   - 17 EnergyCommunity/ParticipationPeriod (one per metering point, wkn
#     <meteringPointRtId>_participation, EnergyCommunity/ParticipationPeriod
#     association to the metering point; From 2025-08-04, far-future To —
#     the Basic/TimeRange record has no optional end)
#   - 2 EnergyCommunity/EnergyPrice (consumption / feed-in, EUR; the type
#     carries only Price + Currency — no validity range in the model)
# The value simulator (b02/b03) then fills archive history for the anchors —
# a Producer's anchors get the PV curve because the metering point is an
# EnergyCommunity/Producer (exact-type match).
#
# IDEMPOTENT: every entity is upserted via GetOrCreateRtEntitiesByType@1 keyed on
# a stable natural key (facility Name, metering-point MeteringPointNumber,
# customer/anchor/period/price RtWellKnownName) so re-running never duplicates;
# associations are only emitted on first create (modOp == Insert == 0).
# ALL demo data is OBVIOUSLY fictional (Muster/Beispiel/Test names,
# example.com mails, all-zero IBANs) — the blueprint is published to a
# public-ish catalog.
#
# DISABLED-BY-DEFAULT CONTRACT: System/Enabled = false and only a
# FromExecutePipelineCommand@1 trigger — a fresh install never creates data on
# its own. Re-apply the blueprint (InstallBlueprint -f) after a run to restore.

- rtId: ec0000000000000000000b05
  ckTypeId: System.Communication/DataFlow-1
  associations: []
  attributes:
  - id: System/Name-1
    value: create-demo-community
  - id: System/Description-1
    value: >-
      Creates a presentable, self-contained Energy Community demo dataset
      (customers with fictional contacts, facilities, consumer/producer
      metering points, participation periods, energy prices) and
      Basic.Energy/EnergyMeasurement measurement anchors so the value
      simulator can fill archive history. Simulation-only — NOT for
      productive tenants.

- rtId: ec0000000000000000000b04
  ckTypeId: System.Communication/Pipeline-1
  associations:
  - roleId: System/ParentChild-1
    targetRtId: ec0000000000000000000b05
    targetCkTypeId: System.Communication/DataFlow-1
    attributes: []
  - roleId: System.Communication/Executes-1
    targetRtId: '670000000000000000000002'
    targetCkTypeId: System.Communication/Adapter-1
    attributes: []
  attributes:
  - id: System/Name-1
    value: create-demo-community
  - id: System/Description-1
    value: >-
      Generates a fixed, presentable demo energy community for EC v2 demo/test
      tenants: 14 Customers (fictional contacts), 14 OperatingFacilities,
      14 EnergyCommunity/Consumer + 3 EnergyCommunity/Producer metering points
      (varied PartitionFactor), 31 EnergyMeasurement anchors, 17
      ParticipationPeriods and 2 EnergyPrices. Idempotent (GetOrCreate upsert
      by natural key). Disabled by default; trigger via ExecutePipelineCommand
      only. Run the value simulator (energy-simulator-range) afterwards to
      fill archive history.
  - id: System/Enabled-1
    value: false
  - id: System.Communication/DeploymentState-1
    value: 0
  - id: System.Communication/StatusMessage-1
  - id: System.Communication/PipelineDefinition-1
    value: |
      triggers:
        - type: FromExecutePipelineCommand@1
      transformations:
        # ===== Init the shared update collections (AB#4703) =====
        # Pre-seeding both as empty arrays keeps the later Flatten@1 Append
        # writes flat (Append onto a missing path would nest the flattened
        # array as a single element).
        - type: WriteJson@1
          description: Init entity-update collection
          targetPath: $.updates.items
          jsonString: "[]"
        - type: WriteJson@1
          description: Init association-update collection
          targetPath: $.updates.assocs
          jsonString: "[]"
        # ===== 0. Build the shared mandatory records (Address / Amount / TimeRange) =====
        - type: SetPrimitiveValue@1
          description: Address.CkRecordId
          targetPath: $.rec.address.CkRecordId
          value: Basic/Address
          valueType: String
        - type: SetPrimitiveValue@1
          targetPath: $.rec.address.Attributes.Street
          value: Demo Community Str. 1
          valueType: String
        - type: SetPrimitiveValue@1
          targetPath: $.rec.address.Attributes.Zipcode
          value: 1010
          valueType: Int
        - type: SetPrimitiveValue@1
          targetPath: $.rec.address.Attributes.CityTown
          value: Vienna
          valueType: String
        - type: SetPrimitiveValue@1
          targetPath: $.rec.address.Attributes.NationalCode
          value: AT
          valueType: String
        - type: SetPrimitiveValue@1
          description: Amount.CkRecordId
          targetPath: $.rec.amount.CkRecordId
          value: Basic/Amount
          valueType: String
        - type: SetPrimitiveValue@1
          targetPath: $.rec.amount.Attributes.Value
          value: 0.0
          valueType: Double
        - type: SetPrimitiveValue@1
          targetPath: $.rec.amount.Attributes.Unit
          value: 1
          valueType: Int
        - type: SetPrimitiveValue@1
          description: TimeRange.CkRecordId
          targetPath: $.rec.timeRange.CkRecordId
          value: Basic/TimeRange
          valueType: String
        - type: SetPrimitiveValue@1
          targetPath: $.rec.timeRange.Attributes.From
          value: 2025-01-01T00:00:00Z
          valueType: DateTime
        - type: SetPrimitiveValue@1
          targetPath: $.rec.timeRange.Attributes.To
          value: 2025-01-01T00:15:00Z
          valueType: DateTime
        # ===== 1. Operating facility (idempotent GetOrCreate by Name) =====
        - type: GetOrCreateRtEntitiesByType@1
          description: Get or create the demo operating facility
          ckTypeId: Basic.Energy/OperatingFacility
          rtIdTargetPath: $.facility.rtId
          ckTypeIdTargetPath: $.facility.ckTypeId
          modOperationPath: $.facility.modOp
          fieldFilters:
            - attributePath: Name
              operator: Equals
              comparisonValue: EC Demo Community
        - type: CreateUpdateInfo@1
          description: Upsert the demo operating facility
          targetPath: $.updates.items
          targetValueKind: Array
          targetValueWriteMode: Append
          updateKindPath: $.facility.modOp
          ckTypeIdPath: $.facility.ckTypeId
          rtIdPath: $.facility.rtId
          attributeUpdates:
            - attributeName: Name
              attributeValueType: String
              value: EC Demo Community
            - attributeName: State
              attributeValueType: Enum
              value: 1
            - attributeName: FacilityType
              attributeValueType: Enum
              value: 1
            - attributeName: Address
              attributeValueType: Record
              valuePath: $.rec.address
        # ===== Metering point Demo Consumer 1 (EnergyCommunity/Consumer) =====
        - type: GetOrCreateRtEntitiesByType@1
          description: Get or create Demo Consumer 1 by MeteringPointNumber
          ckTypeId: EnergyCommunity/Consumer
          rtIdTargetPath: $.c1.rtId
          ckTypeIdTargetPath: $.c1.ckTypeId
          modOperationPath: $.c1.modOp
          fieldFilters:
            - attributePath: MeteringPointNumber
              operator: Equals
              comparisonValue: AT0000000000000000000000000000801
        - type: CreateUpdateInfo@1
          description: Upsert Demo Consumer 1
          targetPath: $.updates.items
          targetValueKind: Array
          targetValueWriteMode: Append
          updateKindPath: $.c1.modOp
          ckTypeIdPath: $.c1.ckTypeId
          rtIdPath: $.c1.rtId
          attributeUpdates:
            - attributeName: Name
              attributeValueType: String
              value: Demo Consumer 1
            - attributeName: MeteringPointNumber
              attributeValueType: String
              value: AT0000000000000000000000000000801
            - attributeName: State
              attributeValueType: Enum
              value: 1
            - attributeName: CarrierType
              attributeValueType: Enum
              value: 1
            - attributeName: PartitionFactor
              attributeValueType: Int
              value: 80
        - type: If@1
          description: Link Demo Consumer 1 to the facility only on first create
          path: $.c1.modOp
          operator: Equals
          value: 0
          valueType: Int
          transformations:
            - type: CreateAssociationUpdate@1
              targetPath: $.updates.assocs
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: CREATE
              originRtIdPath: $.c1.rtId
              originCkTypeIdPath: $.c1.ckTypeId
              targetRtIdPath: $.facility.rtId
              targetCkTypeIdPath: $.facility.ckTypeId
              associationRoleId: System/ParentChild
        # ===== Metering point Demo Consumer 2 (EnergyCommunity/Consumer) =====
        - type: GetOrCreateRtEntitiesByType@1
