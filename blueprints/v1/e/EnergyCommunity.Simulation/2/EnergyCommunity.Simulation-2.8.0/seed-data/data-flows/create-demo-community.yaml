        # ===== Community-operator customer (AB#4703) =====
        # EnergyCommunity/AssociatedFacilities has inbound multiplicity One
        # (every facility belongs to exactly ONE customer), so the shared
        # "EC Demo Community" facility (with the 4 original metering points)
        # is owned by the community-operator customer 01.
        - type: SetPrimitiveValue@1
          description: Well-known name of the community-operator customer
          targetPath: $.cu1.wkn
          value: demo-customer-01
          valueType: String
        - type: WriteJson@1
          description: Contact record of the community-operator customer (obviously fictional)
          targetPath: $.cu1.contact
          jsonString: |
            { "CkRecordId": "Basic/Contact", "Attributes": { "LegalEntityType": 1, "CompanyName": "Energiegemeinschaft Musterstadt eGen", "Email": "office.ec-musterstadt@example.com", "TaxIdentificationNumber": "ATU00000001", "Address": { "CkRecordId": "Basic/Address", "Attributes": { "Street": "Am Energiepark 1", "Zipcode": 4020, "CityTown": "Musterstadt", "NationalCode": "AT" } } } }
        - type: GetOrCreateRtEntitiesByType@1
          description: Get or create the community-operator customer by well-known name
          ckTypeId: EnergyCommunity/Customer
          rtIdTargetPath: $.cu1.rtId
          ckTypeIdTargetPath: $.cu1.ckTypeId
          modOperationPath: $.cu1.modOp
          fieldFilters:
            - attributePath: RtWellKnownName
              operator: Equals
              comparisonValuePath: $.cu1.wkn
        - type: CreateUpdateInfo@1
          description: Upsert the community-operator customer (CustomerNumber set explicitly — the AutoIncrement is only consumed by the app's create flow, an import leaves the mandatory attribute null and breaks the customer list, AB#4703)
          targetPath: $.updates.items
          targetValueKind: Array
          targetValueWriteMode: Append
          updateKindPath: $.cu1.modOp
          ckTypeIdPath: $.cu1.ckTypeId
          rtIdPath: $.cu1.rtId
          rtWellKnownNamePath: $.cu1.wkn
          attributeUpdates:
            - attributeName: Contact
              attributeValueType: Record
              valuePath: $.cu1.contact
            - attributeName: CustomerNumber
              attributeValueType: String
              value: '10001'
            - attributeName: BillingCycle
              attributeValueType: Enum
              value: 3
            - attributeName: State
              attributeValueType: Enum
              value: 1
            - attributeName: TaxProcedureCreditNote
              attributeValueType: Enum
              value: 2
        - type: If@1
          description: Link the shared facility to customer 01 only on first create
          path: $.cu1.modOp
          operator: Equals
          value: 0
          valueType: Int
          transformations:
            - type: CreateAssociationUpdate@1
              targetPath: $.updates.assocs
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: CREATE
              originRtIdPath: $.cu1.rtId
              originCkTypeIdPath: $.cu1.ckTypeId
              targetRtIdPath: $.facility.rtId
              targetCkTypeIdPath: $.facility.ckTypeId
              associationRoleId: EnergyCommunity/AssociatedFacilities
        # ===== Members with their own customer and facility =====
        # One package per member of $.members.consumers / $.members.producers
        # (written by the preset blocks at the top): facility, customer, metering
