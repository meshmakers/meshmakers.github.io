              ckTypeId: EnergyCommunity/ParticipationPeriod
              rtIdTargetPath: $.key.pp.rtId
              ckTypeIdTargetPath: $.key.pp.ckTypeId
              modOperationPath: $.key.pp.modOp
              fieldFilters:
                - attributePath: RtWellKnownName
                  operator: Equals
                  comparisonValuePath: $.key.pp.wkn
            - type: CreateUpdateInfo@1
              description: Upsert the participation period
              targetPath: $.key.u.items
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKindPath: $.key.pp.modOp
              ckTypeIdPath: $.key.pp.ckTypeId
              rtIdPath: $.key.pp.rtId
              rtWellKnownNamePath: $.key.pp.wkn
              attributeUpdates:
                - attributeName: TimeRange.From
                  attributeValueType: DateTime
                  valuePath: $.full.participationFrom
                - attributeName: TimeRange.To
                  attributeValueType: DateTime
                  value: "2099-12-31T23:59:59Z"
            - type: If@1
              description: Link the participation period to its metering point only on first create
              path: $.key.pp.modOp
              operator: Equals
              value: 0
              valueType: Int
              transformations:
                - type: CreateAssociationUpdate@1
                  targetPath: $.key.u.assocs
                  targetValueKind: Array
                  targetValueWriteMode: Append
                  updateKind: CREATE
                  originRtIdPath: $.key.pp.rtId
                  originCkTypeIdPath: $.key.pp.ckTypeId
                  targetRtIdPath: $.key.mp.rtId
                  targetCkTypeIdPath: $.key.mp.ckTypeId
                  associationRoleId: EnergyCommunity/ParticipationPeriod
        # ===== Collect the per-member updates into the shared collections =====
        - type: Flatten@1
          description: Collect consumer-member entity updates
          path: $.consumerUpdates[*].items[*]
          targetPath: $.updates.items
          targetValueWriteMode: Append
        - type: Flatten@1
          description: Collect consumer-member association updates
          path: $.consumerUpdates[*].assocs[*]
          targetPath: $.updates.assocs
          targetValueWriteMode: Append
        - type: Flatten@1
          description: Collect producer-member entity updates
          path: $.producerUpdates[*].items[*]
          targetPath: $.updates.items
          targetValueWriteMode: Append
        - type: Flatten@1
          description: Collect producer-member association updates
          path: $.producerUpdates[*].assocs[*]
          targetPath: $.updates.assocs
          targetValueWriteMode: Append
        # ===== Demo energy prices (AB#4703) =====
        # EnergyCommunity/EnergyPrice carries only Price + Currency (no name,
        # no validity range, no price-type attribute in the 4.x model), so the
        # consumption/feed-in roles are encoded in the well-known names.
        - type: SetPrimitiveValue@1
          description: Well-known name of the consumption price
          targetPath: $.ep1.wkn
          value: demo-energy-price-consumption
          valueType: String
        - type: GetOrCreateRtEntitiesByType@1
          description: Get or create the consumption price by well-known name
          ckTypeId: EnergyCommunity/EnergyPrice
          rtIdTargetPath: $.ep1.rtId
          ckTypeIdTargetPath: $.ep1.ckTypeId
          modOperationPath: $.ep1.modOp
          fieldFilters:
            - attributePath: RtWellKnownName
              operator: Equals
              comparisonValuePath: $.ep1.wkn
        - type: CreateUpdateInfo@1
          description: Upsert the consumption price (EUR per kWh)
          targetPath: $.updates.items
          targetValueKind: Array
          targetValueWriteMode: Append
          updateKindPath: $.ep1.modOp
          ckTypeIdPath: $.ep1.ckTypeId
          rtIdPath: $.ep1.rtId
          rtWellKnownNamePath: $.ep1.wkn
          attributeUpdates:
            - attributeName: Price
              attributeValueType: Double
              value: 0.18
            - attributeName: Currency
              attributeValueType: String
              value: EUR
        - type: SetPrimitiveValue@1
          description: Well-known name of the feed-in price
          targetPath: $.ep2.wkn
          value: demo-energy-price-feed-in
          valueType: String
        - type: GetOrCreateRtEntitiesByType@1
          description: Get or create the feed-in price by well-known name
          ckTypeId: EnergyCommunity/EnergyPrice
          rtIdTargetPath: $.ep2.rtId
          ckTypeIdTargetPath: $.ep2.ckTypeId
          modOperationPath: $.ep2.modOp
          fieldFilters:
            - attributePath: RtWellKnownName
              operator: Equals
              comparisonValuePath: $.ep2.wkn
        - type: CreateUpdateInfo@1
          description: Upsert the feed-in price (EUR per kWh)
          targetPath: $.updates.items
          targetValueKind: Array
          targetValueWriteMode: Append
          updateKindPath: $.ep2.modOp
          ckTypeIdPath: $.ep2.ckTypeId
          rtIdPath: $.ep2.rtId
          rtWellKnownNamePath: $.ep2.wkn
          attributeUpdates:
            - attributeName: Price
              attributeValueType: Double
              value: 0.10
            - attributeName: Currency
              attributeValueType: String
              value: EUR
        # ===== Persist all entities + associations in one transaction =====
        - type: ApplyChanges@2
          entityUpdatesPath: $.updates.items
          associationUpdatesPath: $.updates.assocs

