$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
- Basic-[2.4,3.0)
- Basic.Energy-[1.9,2.0)
- EnergyCommunity-[4.9,5.0)
- System.Communication-[3.22,4.0)

# create-demo-community — DataFlow and pipeline that seed a complete demo community
# (customers, facilities, metering points, participation periods, prices). One very
# large inline pipeline definition; it cannot be cut further at entity granularity.
# Part of the EnergyCommunity.Simulation blueprint — see blueprint.yaml for the full file list.
entities:

# ─── Demo-community generator (AB#4579, extended AB#4703, presets AB#5632) ─
#
#   …b05  DataFlow  create-demo-community
#   …b04  Pipeline  create-demo-community
#
# CREATES a self-contained demo energy community from one of six PRESETS so
# demo/test tenants need no hand-seeded data and no EDA. Input of the
# ExecutePipelineCommand, every key optional (defaults shown):
#   { "preset": "legacy", "seed": 1, "communityCode": "0000",
#     "effectiveFrom": "2024-01-01T00:00:00Z",
#     "participationFrom": "2024-01-01T00:00:00Z", "newRevision": false }
# Defaults come from If@1 null checks + SetPrimitiveValue@1; an unknown preset
# or a communityCode that is not 1-4 digits fails the run (ExecuteCSharp@1
# throws) before anything is written.
#
# Presets: legacy (14 + 3, the historic members), pv-dorf (32 + 12),
# gewerbepark (12 + 4), landwirtschaft (25 + 6), stadtblock (60 + 1),
# wasserkraft-tal (27 + 3, hydro values from M3, AB#5638). The member lists of
# all presets except legacy are GENERATED by simulation-tools/presets.py
# write-pipeline into the marked block of the pipeline mirror
# (pipelines/Simulation/create-demo-community.yaml) and injected here with
# sync-pipelines.py - never edit the generated JSON in place.
#
# Every preset creates:
#   - the community-operator customer demo-customer-01, the shared
#     "EC Demo Community" facility and 2 EnergyCommunity/EnergyPrice;
#   - per member: EnergyCommunity/Customer, Basic.Energy/OperatingFacility
#     (EnergyCommunity/AssociatedFacilities), EnergyCommunity/Consumer or
#     EnergyCommunity/Producer (ParentChild to the facility; EnergyConsumption +
#     LoadProfile resp. EnergyProductionCapacity + ProductionType;
#     MeteringDataSource = Simulated), ONE raw Basic.Energy/EnergyMeasurement
#     anchor (consumer 1-1:1.9.0 G.01, producer 1-1:2.9.0 G.01; no
#     1-1:1.9.0 P.01 any more) and an EnergyCommunity/ParticipationPeriod
#     (From = participationFrom, far-future To);
#   - legacy only: the 3 consumers + 1 producer on the shared facility.
# Metering point numbers: legacy keeps AT…0801-0814 / AT…0901-0903; generated
# members get AT00999900000 + communityCode + 16-digit suffix (role + running
# number).
# SimulationSettings: one revision is created when the tenant has none, or
# when newRevision is true (existing revisions are first set
# SupersededByReset). Never seeded, so InstallBlueprint -f keeps it.
#
# IDEMPOTENT: every entity is upserted via GetOrCreateRtEntitiesByType@1 keyed on
# a stable natural key (facility Name, metering-point MeteringPointNumber,
# customer/anchor/period/price RtWellKnownName) so re-running never duplicates;
# associations are only emitted on first create (modOp == Insert == 0). A
# re-run does rewrite the attributes, which is how an existing legacy tenant
# gets MeteringDataSource and the sizes.
# ALL demo data is OBVIOUSLY fictional (Muster/Beispiel/Test names,
# example.com mails, all-zero IBANs) — the blueprint is published to a
# public-ish catalog.
#
# DISABLED-BY-DEFAULT CONTRACT: System/Enabled = false and only a
# FromExecutePipelineCommand@1 trigger — a fresh install never creates data on
# its own. Enabled is tenant-owned (AB#5309): a re-apply does NOT reset it;
# set Enabled = false again after a run.

- rtId: ec0000000000000000000b05
  ckTypeId: System.Communication/DataFlow-1
  associations: []
  attributes:
  - id: System/Name-1
    value: create-demo-community
  - id: System/Description-1
    value: >-
      Creates a self-contained Energy Community demo dataset from a preset
      (legacy, pv-dorf, gewerbepark, landwirtschaft, stadtblock,
      wasserkraft-tal): customers with fictional contacts, facilities,
      consumer/producer metering points marked Simulated, raw
      Basic.Energy/EnergyMeasurement anchors, participation periods, energy
      prices and the SimulationSettings revision. Simulation-only — NOT for
      productive tenants.

- rtId: ec0000000000000000000b04
  ckTypeId: System.Communication/Pipeline-1
  associations:
  - roleId: System/ParentChild-1
    targetRtId: ec0000000000000000000b05
    targetCkTypeId: System.Communication/DataFlow-1
    attributes: []
  - roleId: System.Communication/Executes-1
    targetRtId: '670000000000000000000002'
    targetCkTypeId: System.Communication/Adapter-1
    attributes: []
  attributes:
  - id: System/Name-1
    value: create-demo-community
  - id: System/Description-1
    value: >-
      Generates a demo energy community for EC v2 demo/test tenants from the
      ExecutePipelineCommand input { preset, seed, communityCode,
      effectiveFrom, participationFrom, newRevision } (all optional; default
      preset legacy = the historic 14 + 3 metering points). Creates customers,
      facilities, metering points with size and MeteringDataSource =
      Simulated, raw anchors, participation periods, energy prices and - when
      none exists or newRevision is true - a SimulationSettings revision.
      Idempotent (GetOrCreate upsert by natural key). Disabled by default;
      trigger via ExecutePipelineCommand only. Run community-simulator-range
      afterwards to fill archive history.
  - id: System/Enabled-1
    value: false
  - id: System.Communication/DeploymentState-1
    value: 0
  - id: System.Communication/StatusMessage-1
  - id: System.Communication/PipelineDefinition-1
    value: |
      triggers:
        - type: FromExecutePipelineCommand@1
      transformations:
        # ===== Input contract (AB#5632) =====
        # ExecutePipelineCommand input, every key optional:
        #   { "preset": "legacy", "seed": 1, "communityCode": "0000",
        #     "effectiveFrom": "2024-01-01T00:00:00Z",
        #     "participationFrom": "2024-01-01T00:00:00Z", "newRevision": false }
        # A missing (or JSON null) key gets its default from an If@1 null check
        # (If@1 reads an absent path as null) followed by SetPrimitiveValue@1. The
        # values stay at their input paths; normalised forms go to $.cfg.
        - type: If@1
          description: Default preset legacy
          path: $.preset
          operator: Equals
          value: null
          valueType: String
          transformations:
            - type: SetPrimitiveValue@1
              targetPath: $.preset
              value: legacy
              valueType: String
        - type: ExecuteCSharp@1
          description: Normalise the preset name (trimmed, lower case)
          targetPath: $.cfg.preset
          returnType: String
          arguments:
            - name: preset
              valuePath: $.preset
              dataType: String
          code: |
            return preset.Trim().ToLowerInvariant();
        - type: If@1
          description: Default seed 1
          path: $.seed
          operator: Equals
          value: null
          valueType: Int
          transformations:
            - type: SetPrimitiveValue@1
              targetPath: $.seed
              value: 1
              valueType: Int
        - type: If@1
          description: Default community code 0000
          path: $.communityCode
          operator: Equals
          value: null
          valueType: String
          transformations:
            - type: SetPrimitiveValue@1
              targetPath: $.communityCode
              value: "0000"
              valueType: String
        - type: ExecuteCSharp@1
          description: Validate the community code (1-4 digits, left-padded to 4) - it is part of every generated metering point number
          targetPath: $.cfg.communityCode
          returnType: String
          arguments:
            - name: communityCode
              valuePath: $.communityCode
              dataType: String
          code: |
            var code = (communityCode ?? "").Trim();
            if (!System.Text.RegularExpressions.Regex.IsMatch(code, "^[0-9]{1,4}$"))
            {
                throw new System.ArgumentException("communityCode '" + communityCode + "' must be 1 to 4 digits (it becomes part of the 33-character metering point number).");
            }
            return code.PadLeft(4, '0');
        - type: If@1
          description: Default effectiveFrom 2024-01-01
          path: $.effectiveFrom
          operator: Equals
          value: null
          valueType: DateTime
          transformations:
            - type: SetPrimitiveValue@1
              targetPath: $.effectiveFrom
              value: 2024-01-01T00:00:00Z
              valueType: DateTime
        - type: If@1
          description: Default participationFrom 2024-01-01
          path: $.participationFrom
          operator: Equals
          value: null
          valueType: DateTime
          transformations:
            - type: SetPrimitiveValue@1
              targetPath: $.participationFrom
              value: 2024-01-01T00:00:00Z
              valueType: DateTime
        - type: If@1
          description: Default newRevision false
          path: $.newRevision
          operator: Equals
          value: null
          valueType: Boolean
          transformations:
            - type: SetPrimitiveValue@1
              targetPath: $.newRevision
              value: false
              valueType: Boolean
        # ===== Preset selection (AB#5632, SIM-05) =====
        # Exactly one If@1 below matches $.cfg.preset and writes the SimulationPreset
        # enum value ($.cfg.presetEnum), the MemberSpread of the first settings
        # revision ($.cfg.memberSpread) and the member lists ($.members.consumers /
        # $.members.producers) the two ForEach@1 loops further down iterate. An
        # unknown preset matches none and fails the run before anything is written.
        #
        # legacy (hand-maintained, NOT generated): the historic 14 + 3 members of
        # AB#4579/AB#4703 with their numbers, names, facilities and PartitionFactors.
        # Only the 11 + 2 members with their own customer are listed here; the 3 + 1
        # metering points on the shared "EC Demo Community" facility are created by
        # the legacy-only block below. Sizes reproduce @1 (500 kWh/day H0 = 182500
        # kWh/a; 50 "kWp" at 2789 kWh/kWp = 132.8 kWp at 1050 kWh/kWp).
        - type: If@1
          description: Preset legacy (enum 0) - the historic demo community
          path: $.cfg.preset
          operator: Equals
          value: legacy
          valueType: String
          transformations:
            - type: SetPrimitiveValue@1
              description: SimulationPreset enum value
              targetPath: $.cfg.presetEnum
              value: 0
              valueType: Int
            - type: SetPrimitiveValue@1
              description: MemberSpread of the first settings revision
              targetPath: $.cfg.memberSpread
