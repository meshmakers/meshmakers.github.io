        # ===== Simulation settings revision (AB#5632, SIM-08) =====
        # EnergyCommunity/SimulationSettings is never seeded (InstallBlueprint -f
        # must keep the revisions). A revision is created when the tenant has none,
        # or when newRevision is true - then every existing revision is first marked
        # SupersededByReset so SimulateEnergyMeasurements@2 ignores it. Otherwise
        # the existing revisions are left untouched.
        - type: GetRtEntitiesByType@1
          description: Load the existing simulation settings revisions
          ckTypeId: EnergyCommunity/SimulationSettings
          targetPath: $.existingSettings
          take: 1000
        - type: SetPrimitiveValue@1
          description: Create a revision? (decided below)
          targetPath: $.calc.createRevision
          value: false
          valueType: Boolean
        - type: If@1
          description: No revision yet - create the first one
          path: $.existingSettings.Items[0].RtId
          operator: Equals
          value: null
          valueType: String
          transformations:
            - type: SetPrimitiveValue@1
              targetPath: $.calc.createRevision
              value: true
              valueType: Boolean
        - type: If@1
          description: newRevision - supersede every existing revision and create a new one
          path: $.newRevision
          operator: Equals
          value: true
          valueType: Boolean
          transformations:
            - type: SetPrimitiveValue@1
              targetPath: $.calc.createRevision
              value: true
              valueType: Boolean
            - type: If@1
              description: Only when there are revisions to supersede
              path: $.existingSettings.Items[0].RtId
              operator: NotEquals
              value: null
              valueType: String
              transformations:
                - type: ForEach@1
                  description: Mark every existing revision SupersededByReset
                  iterationPath: $.existingSettings.Items
                  mergePath: $.key.u
                  targetPath: $.supersedeUpdates
                  maxDegreeOfParallelism: 1
                  transformations:
                    - type: CreateUpdateInfo@1
                      description: SupersededByReset = true
                      targetPath: $.key.u.items
                      targetValueKind: Array
                      targetValueWriteMode: Append
                      updateKind: Update
                      ckTypeId: EnergyCommunity/SimulationSettings
                      rtIdPath: $.key.RtId
                      attributeUpdates:
                        - attributeName: SupersededByReset
                          attributeValueType: Boolean
                          value: true
                - type: Flatten@1
                  description: Collect the supersede updates
                  path: $.supersedeUpdates[*].items[*]
                  targetPath: $.updates.items
                  targetValueWriteMode: Append
        - type: If@1
          description: Create the settings revision
          path: $.calc.createRevision
          operator: Equals
          value: true
          valueType: Boolean
          transformations:
            - type: FormatString@1
              description: Revision comment
              format: "create-demo-community: preset {$.cfg.preset}, seed {$.seed}, community code {$.cfg.communityCode}"
              targetPath: $.cfg.comment
            - type: CreateUpdateInfo@1
              description: Insert the settings revision (defaults of the simulation spelled out)
              targetPath: $.updates.items
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: Insert
              ckTypeId: EnergyCommunity/SimulationSettings
              attributeUpdates:
                - attributeName: Preset
                  attributeValueType: Enum
                  valuePath: $.cfg.presetEnum
                - attributeName: EffectiveFrom
                  attributeValueType: DateTime
                  valuePath: $.effectiveFrom
                - attributeName: Seed
                  attributeValueType: Int
                  valuePath: $.seed
                - attributeName: ConsumptionFactor
                  attributeValueType: Double
                  value: 1.0
                - attributeName: PvCapacityFactor
                  attributeValueType: Double
                  value: 1.0
                - attributeName: PvSpecificYield
                  attributeValueType: Double
                  value: 1050.0
                - attributeName: MemberSpread
                  attributeValueType: Double
                  valuePath: $.cfg.memberSpread
                - attributeName: MemberScale
                  attributeValueType: Double
                  value: 1.0
                - attributeName: Noise
                  attributeValueType: Enum
                  value: 0
                - attributeName: Weather
                  attributeValueType: Enum
                  value: 0
                - attributeName: BackfillDays
                  attributeValueType: Int
                  value: 730
                - attributeName: DailyRun
                  attributeValueType: Boolean
                  value: true
                - attributeName: NearRealTime
                  attributeValueType: Boolean
                  value: false
                - attributeName: SupersededByReset
                  attributeValueType: Boolean
                  value: false
                - attributeName: Comment
                  attributeValueType: String
                  valuePath: $.cfg.comment
        - type: If@1
          description: Revisions exist and newRevision is false - keep them
          path: $.calc.createRevision
          operator: Equals
          value: false
          valueType: Boolean
          transformations:
            - type: Logger@1
              message: "create-demo-community: SimulationSettings revisions exist and stay unchanged (pass newRevision: true to supersede them)"
