$schema: https://schemas.meshmakers.cloud/blueprint-meta.schema.json
blueprintId: Samples.Photovoltaics-2.0.1
description: |
  End-to-end photovoltaic demo: master data for a small PV plant (inverter,
  battery storage, two module strings, two energy meters) plus the two-adapter
  DataFlow that feeds it.

    Edge Pipeline  - polls the inverter over Modbus, scales the raw registers
                     and buffers a minute of readings onto the event hub.
    Mesh Pipeline  - turns each reading into entity updates, archives them and
                     applies the latest value to the entities.

  Prerequisites on the tenant: Communication enabled (supplies the Mesh Adapter
  this blueprint targets) and Stream Data enabled. The three raw archives the
  Mesh Pipeline writes to (modules, battery storage, energy meters) are seeded
  here, but a blueprint does not activate archives: run ActivateArchive for
  5fc8fda18b2fc75f925e21d1, 5fc8fda18b2fc75f925e21d2 and
  5fc8fda18b2fc75f925e21d3 before deploying the DataFlow.

  The Edge deployment site and the Modbus adapter ARE seeded here: an edge adapter runs
  next to the hardware and is not provided by the platform. Its pipeline
  service account is provisioned automatically after the apply (AB#5111).
  Point the ReadModbusRegister server address at your own device before
  deploying - the seeded 192.168.14.31 is the address of the original demo
  installation.

  Deploy the DataFlow after installing.

  Demo and training tenants only.
ckModelDependencies:
  # Floors pinned to published versions, in dependency order: the engine
  # installs each floor EXACTLY and resolves no transitive CK dependencies.
  - Basic-[2.4.0,3.0)
  - Industry.Basic-[2.5.0,3.0)
  - Industry.Energy-[3.5.0,4.0)
  # Satisfiability floor only - service-managed, see Samples.PipelineBasics.
  - System.Communication-[4.5,5.0)
seedDataPaths:
  - seed-data/master-data/pv-plant.yaml
  - seed-data/adapters/modbus-edge.yaml
  - seed-data/archives/pv-archives.yaml
