$schema: https://schemas.meshmakers.cloud/blueprint-meta.schema.json
blueprintId: Samples.EnergyEnvironment-2.0.0
description: |
  The largest of the sample blueprints - a complete energy-management demo for
  one industrial site, from assets to dashboard:

    master-data/assets.yaml        PV system, inverter, storage, meters and
                                   consumers, plus carbon emissions/budget,
                                   certificates of origin, compliance records,
                                   environmental goals, KPIs, costs, forecasts
                                   and a demand-response event
    master-data/load-profile.yaml  quarter-hour load profile as
                                   Basic.Energy/EnergyMeasurement entities
    notifications/alerts.yaml      stateful events surfaced as dashboard alerts
    queries/*.yaml                 the three saved queries the widgets bind to
    ui/dashboard.yaml              the Meshboard dashboard and its 14 widgets

  Data-only - no pipelines, no adapter, nothing to deploy. Install and open the
  "energy-environment" dashboard.

  Demo and training tenants only.

  2.0.0 moves to Basic.Energy 2.x (DataQuality without Unknown/Manual, AB#7623);
  floors raised to the range-retaining CK generation; no seed data change.
  Tenants still on Basic.Energy 1.x install 1.1.0.
ckModelDependencies:
  # Floors pinned to published versions, in dependency order: the engine
  # installs each floor EXACTLY and resolves no transitive CK dependencies.
  # 2.0.0 floors are the range-retaining generation (Basic 2.5.0 and its
  # dependents): the older floors (Basic 2.4.0 ...) pin System-2.5.0 exactly and
  # cannot be installed on a tenant that already runs a newer System.
  - Basic-[2.5.0,3.0)
  - Basic.Energy-[2.0.0,3.0)
  - Industry.Basic-[2.6.0,3.0)
  - Industry.Energy-[3.6.0,4.0)
  - Environment-[3.6.0,4.0)
  # Satisfiability floors only - service-managed, see Samples.PipelineBasics.
  - System-[2.2.0,3.0)
  - System.Notification-[2.1.0,3.0)
  - System.UI-[2.4.0,3.0)
seedDataPaths:
  - seed-data/master-data/assets.yaml
  - seed-data/master-data/load-profile.yaml
  - seed-data/notifications/alerts.yaml
  - seed-data/queries/anlagen.yaml
  - seed-data/queries/lastgang.yaml
  - seed-data/queries/forecast.yaml
  - seed-data/ui/dashboard.yaml
