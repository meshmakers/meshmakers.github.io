$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
- System-[2.2,3.0)
- System.Communication-[3.28,4.0)
- System.Identity-[2.12,3.0)
- System.StreamData-[1.7,2.0)
- Basic-[2.0.3,3.0)
- Basic.Energy-[1.4,2.0)
- SmartMeterInsights-[1.0.0,2.0)

# The smart-meter-insights Application workload (chart smart-meter-insights),
# deployed by the Communication Operator on the app-host (management) tenant.
# One deployment serves every consulting-firm child tenant — the app reads the
# tenant from its /:tenantId route (energy-community AB#3683 topology).
#
# Pool (670…001), Mesh Adapter (670…002) and the apps Helm repository (670…005)
# are referenced, never seeded: all three belong to the service-managed
# System.Communication blueprint and return on every EnableCommunication.
#
# The chart source is the SHARED APPS repository 670…005, NOT the dev repo
# 670…003 (AB#5252). 670…003 is seeded only by System.Communication.MainLatest,
# which `requires: octo.environment: [dev, test]` — on a staging or production
# tenant that entity does not exist, so the association dangled and
# DeployWorkload failed with "no Helm repository is linked". 670…005 is the
# AB#4706 contract: ONE stable rtId whose URL is environment-correct on both
# channels (helm-chart-build on dev/test, meshmakers.github.io/apps on
# staging/production) — which is exactly where this repo's CI publishes the
# chart (main -> dev channel, r* tag -> apps). Same fix as
# EnergyCommunity.App and MeshmakersAccounting.
#
# Hostname / Values / ChartVersion / IngressEnabled are isRuntimeState since
# System.Communication 3.28 (AB#4706): the seed values apply on FRESH installs
# only, and a blueprint re-apply never overwrites what an operator changed in
# Studio. ChartVersion '' = newest chart in the repository.
#
# ─── Hostname is deliberately the PORTABLE default, not the customer domain ──
# {{domain.DEFAULT}} is the only domain key that exists on EVERY cluster. The
# customer-facing host on prod-1 is energy-insights.meshmakers.cloud, i.e.
# {{domain.MESHMAKERS}} — but that key is configured only on prod-1, prod-2 and
# staging-1, NOT on test-2 (default only) and not locally. Seeding it would make
# DeployWorkload fail there with WorkloadTemplateUnknownPlaceholder, and because
# Hostname is isRuntimeState the seed value is exactly what a FRESH install gets.
# The vanity host is therefore an environment-specific decision, set per install
# on the live entity (AB#5252); verify the available keys first with
#   GET {communication}/{tenant}/v1/communication/workload-variables
#
# Since 1.3.2 that is no longer a hand edit anybody has to remember: it is an
# explicit, idempotent step of scripts/om_install_apphost.ps1, which merges the
# per-install settings into this entity via the typed Application mutation:
#   pwsh scripts/om_install_apphost.ps1 -Cluster prod-1 -Context prod-1_smi-host \
#        -Hostname 'energy-insights.{{domain.MESHMAKERS}}' -ShareTenant mm-beratung
# The same step sets the shareTenant override below. NOTE the Values collection
# is a RECORD collection and is replaced as a whole on update — the script reads
# the live list and merges, never sends a partial one.
#
# ─── shareTenant is NOT seeded ───────────────────────────────────────────────
# The nginx /smi/ proxy of the app forwards the anonymous share API to ONE fixed
# firm tenant's Mesh Adapter. Which tenant that is exists only per installation
# (prod-1: mm-beratung; local: demo-beratung), so it cannot be seeded — but it
# must not be forgotten either: unset, the proxy targets the app host, which
# deliberately runs no Mesh Adapter, and every /v/:token share view answers 502.
# Hence the scripted step above rather than a README sentence.
#
# ─── publicUri and Hostname MUST be changed TOGETHER ─────────────────────────
# The operator derives publicUri from Hostname, but only in its lowest values
# layer (WorkloadContextValuesBuilder); this explicit ValueOverride is a later
# -f layer and WINS. Changing Hostname alone therefore moves nothing — the
# ingress host rule and the TLS SAN both come from publicUri. The override is
# kept rather than dropped because the chart's deployment.yaml hard-fails on an
# empty publicUri (checkMandatoryValue).
# Part of the SmartMeterInsights.Base blueprint — see blueprint.yaml for the full file list.
entities:

- rtId: '510000000000000000000200'
  ckTypeId: System.Communication/Application-1
  associations:
  - roleId: System.Communication/Manages-1
    targetRtId: '670000000000000000000001'
    targetCkTypeId: System.Communication/Pool-1
    attributes: []
  - roleId: System.Communication/HelmRepository-1
    targetRtId: '670000000000000000000005'
    targetCkTypeId: System.Communication/HelmRepositoryConfiguration-1
    attributes: []
  attributes:
  - id: System/Name-1
    value: smart-meter-insights
  - id: System/Description-1
    value: 'Smart Meter Insights web app (shared app-host deployment).'
  - id: System.Communication/DeploymentState-1
    value: 0
  - id: System.Communication/StatusMessage-1
  - id: System.Communication/LastDeploymentError-1
  - id: System.Communication/LastDeploymentErrorTimestamp-1
  - id: System.Communication/ChartName-1
    value: smart-meter-insights
  - id: System.Communication/ChartVersion-1
    value: ''
  - id: System.Communication/ValuesYaml-1
    value: ''
  - id: System.Communication/ReceivesClusterSecrets-1
    value: false
  - id: System.Communication/IngressEnabled-1
    value: true
  - id: System.Communication/Hostname-1
    value: 'energy-insights.{{domain.DEFAULT}}'
  - id: System.Communication/Values-1
    value:
    - ckRecordId: System.Communication/ValueOverride-1
      attributes:
      - id: System.Communication/Path-1
        value: publicUri
      - id: System.Communication/Value-1
        value: 'https://energy-insights.{{domain.DEFAULT}}'
      - id: System.Communication/IsSecret-1
        value: false
    - ckRecordId: System.Communication/ValueOverride-1
      attributes:
      - id: System.Communication/Path-1
        value: authUri
      - id: System.Communication/Value-1
        value: '{{service.AUTHORITY}}'
      - id: System.Communication/IsSecret-1
        value: false
    - ckRecordId: System.Communication/ValueOverride-1
      attributes:
      - id: System.Communication/Path-1
        value: assetRepoUri
      - id: System.Communication/Value-1
        value: '{{service.ASSETREPOSITORY}}'
      - id: System.Communication/IsSecret-1
        value: false
    - ckRecordId: System.Communication/ValueOverride-1
      attributes:
      - id: System.Communication/Path-1
        value: meshAdapterUri
      - id: System.Communication/Value-1
        value: 'https://adapter.{{domain.DEFAULT}}'
      - id: System.Communication/IsSecret-1
        value: false
    - ckRecordId: System.Communication/ValueOverride-1
      attributes:
      - id: System.Communication/Path-1
        value: rootTenantId
      - id: System.Communication/Value-1
        value: '{{context.tenantId}}'
      - id: System.Communication/IsSecret-1
        value: false
    - ckRecordId: System.Communication/ValueOverride-1
      attributes:
      - id: System.Communication/Path-1
        value: clientId
      - id: System.Communication/Value-1
        value: smart-meter-insights-app
      - id: System.Communication/IsSecret-1
        value: false
