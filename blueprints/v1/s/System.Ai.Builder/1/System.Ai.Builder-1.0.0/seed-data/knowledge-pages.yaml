  # pipeline-node-categories (version 1)
  - rtId: '68b00646e135a2151db49f63'
    ckTypeId: System.Ai/KnowledgePage
    rtWellKnownName: pipeline-node-categories
    attributes:
      - id: System/RtBlueprintLocked
        value: false
      - id: System.Ai/Title
        value: "Pipeline node categories: which node for which job"
      - id: System.Ai/PageKind
        value: 4  # Skill
      - id: System.Ai/PageSummary
        value: "Overview of the pipeline nodes by category - triggers, control flow, extract, transform, load, buffering and domain-specific nodes - to pick the right node before reading its reference page."
      - id: System.Ai/VerificationStatus
        value: 2  # Verified (shipped and reviewed with the product)
      - id: System.Ai/Sections
        value:
          - ckRecordId: System.Ai/WikiSection
            attributes:
              - id: System.Ai/Heading
                value: "Node Categories"
              - id: System.Ai/SectionContent
                value: |-
                  This is an operational overview of the **most-used** nodes. The full property tables for every node live in [nodes-sdk-control-flow] (SDK nodes, available on all adapters) and [nodes-mesh-query] (Mesh Adapter nodes). Read those before writing YAML for any node not summarized here.

                  ### Triggers

                  | Node | Purpose |
                  |------|---------|
                  | `FromPolling@1` | Poll at interval (e.g., `00:05:00`) |
                  | `FromHttpRequest@1` | HTTP endpoint (method + path) |
                  | `FromWatchRtEntity@1` | Entity change stream (Insert/Update/Delete) |
                  | `FromPipelineDataEvent@1` | Receive data from another pipeline in the same DataFlow |
                  | `FromExecutePipelineCommand@1` | Manual execution command (SDK node — all adapters); pipeline must be in a DataFlow |
                  | `FromPipelineTriggerEvent@1` | Scheduled execution via PipelineTrigger entity (5-field cron) |
                  | `FromSendNotification@1`, `FromEmail@1`, `FromMicrosoftGraph@1` | Notification message / IMAP email / Teams channel poll |

                  ### Control Flow (SDK)

                  | Node | Purpose |
                  |------|---------|
                  | `ForEach@1` | Iterate array with child context (`$.full`/`$.key`/merge) |
                  | `For@1` | Execute N times — deep-clones parent context; `count` (static) or `countPath` (dynamic, wins); `maxDegreeOfParallelism` |
                  | `If@1` | Conditional (Equal, Contains, GreaterThan, RegexMatch, etc.) |
                  | `Switch@1` | Multi-branch by value (supports array case values) |
                  | `SelectByPath@1` | Select and transform multiple paths |
                  | `Group@1` | Structural no-op container — runs children inline on the same context; editor-grouping only, NO runtime effect (to group data use `GroupBy@1`) |

                  ### Extract (Data In)

                  | Node | Purpose |
                  |------|---------|
                  | `SetPrimitiveValue@1` / `SetArrayOfPrimitiveValues@1` / `WriteJson@1` | Inject static/dynamic value, value array, or raw JSON (SDK) |
                  | `GetRtEntitiesByType@1` / `GetRtEntitiesById@1` / `GetRtEntitiesByWellKnownName@1` | Query entities by CK type (or, with `ckInterfaceId`, by CK interface: all implementing types, `take` required) / by ID / by well-known name (enriches with IDs) |
                  | `GetOrCreateRtEntitiesByType@1` | Find by field filters or generate a new ID |
                  | `GetAssociationTargets@1` | Traverse associations |
                  | `GetQueryById@1` | Execute a saved query (simple/aggregation/grouping queries; cache disabled — always fresh) |
                  | `GetPipelineConfigByWellKnownName@1` (SDK) / `GetPipelineConfigByCkTypeId@1` (Mesh) | Load global config by name / by CK type |
                  | `GetNotificationTemplate@1` | Load notification template (subject + body) |
                  | `BackfillFromRtEntity@1` | Backfill missing attributes from MongoDB using a CkArchive's column spec (replaces removed `EnrichWithMongoData@1`); sits before `SaveStreamDataInArchive@1` |

                  ### Transform

                  Common: `CreateUpdateInfo@1` (build entity Insert/Update/Delete; `recordArrayItemUpdates` = atomic update of single RecordArray records without a read — use it instead of read-modify-write of a RecordArray whenever executions can run in parallel on one entity, that pattern loses concurrent changes), `CreateAssociationUpdate@1` (build association Create/Delete), `CreateFileSystemUpdate@1`, `DataMapping@1` (value mapping; a wildcard path such as `$.Rows[*].Values[5]` maps a whole array in place, no `ForEach@1`/script), `Concat@1`, `FormatString@1`, `TransformString@1`, `Flatten@1`, `Project@1`, `Join@1`, `GroupBy@1` (SDK — all adapters; group array items by a key into `[{ key, items }]`, one entry per distinct key — to process a batch one entity at a time: `GroupBy@1` → `ForEach@1` over the groups; not the editor-only `Group@1`), `Math@1`, `SumAggregation@1`, `FilterLatestUpdateInfo@1`, `Distinct@1` (SDK — all adapters), `PlaceholderReplace@1`, `Base64Encode@1`/`Base64Decode@1`, `Hash@1`, `ConvertDataType@1`, `Map@1`, `LinearScaler@1`, `MinMax@1`, `Logger@1`/`PrintDebug@1`, `ExecuteCSharp@1`, `MakeHttpRequest@1`, `CheckDuplicate@1`, `ComputeFileHash@1`, `QueryResultToMarkdownTable@1`.

                  Specialized (see `node-reference-mesh.md`): `AnthropicAiQuery@1` (Claude AI; MCP-aware — MCP tools need `mcpServiceAccountConfigName` (plus `mcpDelegateToCaller: true` / `identity: Caller` to run as the caller); an MCP URL without either identity setting is skipped with a warning, with an MCP URL, delegation without `mcpServiceAccountConfigName` fails the node; `jsonSchema` for guaranteed JSON, `promptTemplateName` for prompts from an `AiPromptTemplate`, `usageOutputPath` for tokens + cost estimate, `cacheSource` to cache a large source), `McpToolCall@1` (deterministic call of an allowlisted MCP tool as a service account — the write step after an AI step; `executionIdArgument` passes the pipeline execution id into a tool argument, e.g. `runRef`), `PdfOcrExtraction@1`, `StatisticalAnomalyDetection@1`, `MachineLearningAnomalyDetection@1`, `ImportFromCsv@1`, `ConvertToCsv@1` (array → real CSV: quoting, per-column format, BOM, base64), `RenderDelimitedText@1` (fixed layouts, no quoting), `ImportFromExcel@1`, `ReplyToTeamsChannel@1`.

                  DataPointMapping family (Mesh): `ApplyDataPointMappings@1` (evaluate mappings with mXparser expressions), `BuildMappingTargets@1` (resolve mappings to acquisition targets), `GenerateDataPointMappings@1` (deterministic rule-based generator — non-AI alternative to `AnthropicAiQuery@1`), `ValidateDataPointCoverage@1` (coverage report), `MapToRecordArray@1`, `UpdateRecordArrayItem@1` (one record per call), `UpdateRecordArrayItem@2` (several records of one array in one pass — with `GroupBy@1`: one read and one write per entity; both `@1` and `@2` are read-modify-write and unsafe against parallel executions on one entity — see `CreateUpdateInfo@1` `recordArrayItemUpdates`).

                  Simulation: `Simulation@1` is an **Extract** node (not Transform) — Bogus/Math/Energy generators; `SimulateEnergyMeasurements@1` (Mesh) generates 15-min EnergyMeasurement slots from BDEW/PV profiles.

                  ### Load (Data Out)

                  | Node | Purpose |
                  |------|---------|
                  | `ApplyChanges@1` | Apply entity updates to MongoDB |
                  | `ApplyChanges@2` | Apply entity + association updates (preferred) |
                  | `SaveStreamDataInArchive@1` | Write entity data to a named CrateDB **CkArchive** (replaces removed `SaveInTimeSeries@1`); requires `archiveRtId` pointing at an **Activated** archive |
                  | `SaveTimeRangeStreamDataInArchive@1` | Write pre-aggregated time-range points to an Activated `TimeRangeArchive` (requires `archiveRtId`) |
                  | `UpdateRtEntityIfNewer@1` | Timestamp dedup: keep only strictly-newer candidates for the RT write, emit all for the archive write |
                  | `SetPipelineExecutionResult@1` (SDK) | **REQUIRED to persist pipeline OutputData.** Without it the execution result is never stored — `GetLatestPipelineExecution` shows empty OutputData. See "Persisting OutputData" below |
                  | `ToPipelineDataEvent@1` (SDK) | Send data to another pipeline in the same DataFlow (`targetPipelineRtId`); optional await-result mode for synchronous request/response |
                  | `ToWebhook@1` (SDK) | HTTP POST to external endpoint |
                  | `ToDiscord@1` | Post message/embed/attachment to a Discord channel via a `DiscordConfiguration` entity |
                  | `DeployPipeline@1` | Deploy another pipeline in the same DataFlow via the Communication Controller REST API |
                  | `SendEMail@1`, `GenerateAndStoreReport@1`, `SftpUpload@1` | Email / report generation / SFTP upload |
                  | `GrafanaProvisionTenant@1` / `GrafanaDeprovisionTenant@1` | Provision / deprovision a tenant Grafana org |

                  ### Buffering (SDK)

                  `BufferData@1` (buffer with time-based flush) and `BufferRetrievalNode@1` (retrieve buffered data).

                  ### Domain-Specific

                  SAP nodes (SapLogin, GetProductionOrderList, GetProductionOrderDetails), Zenon nodes (variable/AML read-write **plus** the six archive/Editor nodes `ReadZenonArchiveInfo@1`, `ReadZenonArchiveData@1`, `ListZenonProjects@1`, `GetZenonDynamicProperties@1`, `GetZenonDynamicProperty@1`, `SetZenonDynamicProperty@1`), Microsoft Teams nodes, and Grafana nodes are documented in [nodes-mesh-query]. EDA energy nodes ship in an **external adapter not present in this monorepo** — see that file's external-adapter note.
              - id: System.Ai/SortOrder
                value: 0
