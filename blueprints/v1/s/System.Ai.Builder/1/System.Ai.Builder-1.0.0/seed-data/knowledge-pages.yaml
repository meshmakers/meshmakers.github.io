  # nodes-sdk-values-strings (version 1)
  - rtId: '68b0f04e007877ebd7f3472a'
    ckTypeId: System.Ai/KnowledgePage
    rtWellKnownName: nodes-sdk-values-strings
    attributes:
      - id: System/RtBlueprintLocked
        value: false
      - id: System.Ai/Title
        value: "SDK nodes: setting values, strings, hashing, projection and joins"
      - id: System.Ai/PageKind
        value: 4  # Skill
      - id: System.Ai/PageSummary
        value: "Reference of the SDK nodes that set primitive values and JSON, read pipeline configuration, group and de-duplicate, and transform strings and structures: Concat, FormatString, TransformString, Hash, Base64, ConvertDataType, Flatten, Project, Map, Join."
      - id: System.Ai/VerificationStatus
        value: 2  # Verified (shipped and reviewed with the product)
      - id: System.Ai/Sections
        value:
          - ckRecordId: System.Ai/WikiSection
            attributes:
              - id: System.Ai/Heading
                value: "Extract Nodes"
              - id: System.Ai/SectionContent
                value: |-
                  ### SetPrimitiveValue@1

                  Inject a primitive value (static or dynamic) into the data context.

                  | Property | Type | Default | Description |
                  |----------|------|---------|-------------|
                  | `targetPath` | string | required | Where to set value |
                  | `value` | object | optional | Static value |
                  | `valuePath` | string | optional | JSONPath to dynamic value (takes precedence) |
                  | `valueType` | enum | optional | Target type: String, Int, Int64, Double, Boolean, DateTime, TimeSpan, Binary, StringArray, IntArray |
                  | `documentMode` | enum | Extend | Extend/Replace |
                  | `targetValueKind` | enum | Simple | Simple/Array |
                  | `targetValueWriteMode` | enum | Overwrite | Overwrite/Append/Prepend/Merge |

                  ```yaml
                  - type: SetPrimitiveValue@1
                    value: 42
                    valueType: Int
                    targetPath: $.count

                  - type: SetPrimitiveValue@1
                    valuePath: $.source.Name
                    targetPath: $.target.Name
                    valueType: String
                  ```

                  ### SetArrayOfPrimitiveValues@1

                  Inject an array of primitive values.

                  | Property | Type | Default | Description |
                  |----------|------|---------|-------------|
                  | `targetPath` | string | required | Where to set array |
                  | `values` | array | required | Array of values |
                  | `documentMode` | enum | Extend | Extend/Replace |
                  | `targetValueKind` | enum | Simple | Simple/Array |
                  | `targetValueWriteMode` | enum | Overwrite | Overwrite/Append/Prepend/Merge |

                  ```yaml
                  - type: SetArrayOfPrimitiveValues@1
                    values: ["a@example.com", "b@example.com"]
                    targetPath: $.recipients
                  ```

                  ### WriteJson@1

                  Inject raw JSON from a string.

                  | Property | Type | Default | Description |
                  |----------|------|---------|-------------|
                  | `targetPath` | string | required | Where to set JSON |
                  | `jsonString` | string | required | JSON string to parse and inject |
                  | `documentMode` | enum | Extend | Extend/Replace |
                  | `targetValueKind` | enum | Simple | Simple/Array |
                  | `targetValueWriteMode` | enum | Overwrite | Overwrite/Append/Prepend/Merge |

                  ```yaml
                  - type: WriteJson@1
                    jsonString: '{"key": "value", "count": 5}'
                    targetPath: $.config
                  ```

                  ### GetPipelineConfigByWellKnownName@1

                  Load a pipeline configuration (raw JSON) from the GlobalConfiguration by well-known name. SDK node — available on **all** adapters (not Mesh-specific). The config must be reachable via the pipeline's `Uses` association; otherwise the node throws.

                  | Property | Type | Default | Description |
                  |----------|------|---------|-------------|
                  | `wellKnownName` | string | optional | Static well-known name |
