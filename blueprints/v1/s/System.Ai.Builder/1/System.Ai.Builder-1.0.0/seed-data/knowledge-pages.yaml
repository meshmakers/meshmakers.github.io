      - id: System.Ai/PageSummary
        value: "Reference of the SDK nodes for date and time handling, math, linear scaling, sum aggregation, logging and debug output, ExecuteCSharp scripts, and the Simulation node that generates test data."
      - id: System.Ai/VerificationStatus
        value: 2  # Verified (shipped and reviewed with the product)
      - id: System.Ai/Sections
        value:
          - ckRecordId: System.Ai/WikiSection
            attributes:
              - id: System.Ai/Heading
                value: "DateTime@1"
              - id: System.Ai/SectionContent
                value: |-
                  Date/time operations on one value. Source: `octo-communication-sdk/src/Sdk.Pipeline/EtlDataPipeline/Nodes/Transforms/DateTimeNode.cs`.

                  | Property | Type | Default | Description |
                  |----------|------|---------|-------------|
                  | `operation` | enum | required | See the table below |
                  | `path` | string | required (except `Now`) | Source date/time value path |
                  | `targetPath` | string | required | Where to store the result |
                  | `value` | any | optional | Static operand: a number for `Add*`, a .NET format string for `Format`, an IANA zone id for `ConvertToTimeZone` / `ConvertFromTimeZone` |
                  | `valuePath` | string | optional | Dynamic operand path; takes precedence over `value`. `DaysBetween` and `CombineDateTime` require it (the second date/time) |

                  | Operation | Result |
                  |-----------|--------|
                  | `Now` | Current UTC instant |
                  | `StartOfDay`, `ExtractDate` | The value truncated to 00:00 (same Kind) |
                  | `StartOfMonth` | First day of the value's month at 00:00, **same Kind as the source**, no zone conversion (`2026-12-31T23:59` → `2026-12-01T00:00`) |
                  | `AddDays`, `AddHours`, `AddMinutes`, `AddSeconds` | The value plus a (negative allowed) number |
                  | `DaysBetween` | Whole days between `path` and `valuePath` (date part only) |
                  | `Format` | String, .NET format string in `value`, invariant culture |
                  | `CombineDateTime` | Date of `path`, time of `valuePath` (UTC) |
                  | `ExtractTime` | String `HH:mm:ss` |
                  | `ConvertToTimeZone` | UTC instant → **wall-clock** time of the zone (Kind Unspecified, so it serializes without `Z`). A source without Kind is read as UTC |
                  | `ConvertFromTimeZone` | **Wall-clock** time of the zone → UTC instant (Kind Utc, serializes with `Z`); the inverse of `ConvertToTimeZone` |
                  | `FromUnixTimeMilliseconds` | UTC value from Unix milliseconds read at `path` (number or quoted number) |

                  `ConvertFromTimeZone` reads the clock fields **as written in the value** as local time: a trailing `Z`, a UTC offset such as `+05:00` and no marker at all are all ignored (`2026-07-15T00:00:00+05:00` and `2026-07-15T00:00:00Z` both mean 00:00 local), so the result never depends on the machine's time zone. Fractional seconds are kept. Only ISO 8601 date-times are valid, as in every `DateTime@1` operation: `12:00:00` or `07/15/2026` fail the node instead of being completed. Daylight saving time:

                  | Local time | Result |
                  |------------|--------|
                  | Exists once | Its UTC instant (`Europe/Vienna`: `2026-07-15T00:00` → `2026-07-14T22:00Z`, `2026-01-15T00:00` → `2026-01-14T23:00Z`) |
                  | Does not exist (spring gap, `2026-03-29T02:30` in Vienna) | **The node fails**, the error names value and zone |
                  | Ambiguous (autumn repeat, `2026-10-25T02:30` in Vienna) | The **earlier** instant (summer-time offset): `2026-10-25T00:30Z` |

                  An unknown or empty zone id fails the node. Round trip: `ConvertToTimeZone` followed by `ConvertFromTimeZone` returns the original instant, except for the second pass of the repeated autumn hour (its wall-clock reading equals the first pass and maps to the first).

                  ```yaml
                  # Vienna midnight of the first day of the current month, as a UTC bound for GetStreamData@1
                  - type: DateTime@1
                    operation: ConvertToTimeZone
                    path: $.now
                    value: Europe/Vienna
                    targetPath: $.localNow
                  - type: DateTime@1
                    operation: StartOfMonth
                    path: $.localNow
                    targetPath: $.localMonthStart
                  - type: DateTime@1
                    operation: ConvertFromTimeZone
                    path: $.localMonthStart
                    value: Europe/Vienna          # or valuePath: $.zoneId
                    targetPath: $.from
                  ```

                  Additive history: `ConvertToTimeZone` (11) and `FromUnixTimeMilliseconds` (12) came with AB#5095, `ConvertFromTimeZone` (13) and `StartOfMonth` (14) with AB#6854; all stay in `DateTime@1`, existing pipelines are unaffected.
              - id: System.Ai/SortOrder
                value: 0
          - ckRecordId: System.Ai/WikiSection
            attributes:
              - id: System.Ai/Heading
                value: "Math@1"
              - id: System.Ai/SectionContent
                value: |-
                  Mathematical operations on numeric values.

                  | Property | Type | Default | Description |
                  |----------|------|---------|-------------|
                  | `path` | string | required | Source objects path |
                  | `itemPath` | string | required | Relative path to numeric value |
                  | `itemTargetPath` | string | `$.Result` | Where to store result |
                  | `operation` | enum | required | Add, Subtract, Multiply, Divide, Modulo, Round |
                  | `value` | double | optional | Static operand |
                  | `valuePath` | string | optional | Dynamic operand path |
                  | `decimalPlaces` | int | 0 | For Round operation |
                  | `targetPath` | string | optional | Write configuration |

                  ```yaml
                  # Multiply price by quantity
                  - type: Math@1
                    path: $.key.data
                    itemPath: $.unitPrice
                    operation: Multiply
                    valuePath: $.key.data.quantity
                    itemTargetPath: $.totalPrice

                  # Round to 2 decimal places
                  - type: Math@1
                    path: $.key.data
                    itemPath: $.totalPrice
                    operation: Round
                    decimalPlaces: 2
                    itemTargetPath: $.totalPrice
                  ```
              - id: System.Ai/SortOrder
                value: 1
          - ckRecordId: System.Ai/WikiSection
            attributes:
              - id: System.Ai/Heading
                value: "LinearScaler@1"
              - id: System.Ai/SectionContent
                value: |-
                  Linear scaling of numeric values.

                  | Property | Type | Default | Description |
                  |----------|------|---------|-------------|
                  | `path` | string | required | Source numeric value path |
                  | `targetPath` | string | required | Where to store scaled value |
                  | `scaleInputMin` | double | -1000000 | Input range minimum |
                  | `scaleInputMax` | double | 1000000 | Input range maximum |
                  | `scaleOutputMin` | double | -1000000 | Output range minimum |
                  | `scaleOutputMax` | double | 1000000 | Output range maximum |

                  Formula: `output = outputMin + (value - inputMin) * ((outputMax - outputMin) / (inputMax - inputMin))`

                  ```yaml
                  - type: LinearScaler@1
                    path: $.rawSensor
                    targetPath: $.scaledValue
                    scaleInputMin: 0
                    scaleInputMax: 4095
                    scaleOutputMin: 0
                    scaleOutputMax: 100
                  ```
              - id: System.Ai/SortOrder
                value: 2
          - ckRecordId: System.Ai/WikiSection
            attributes:
              - id: System.Ai/Heading
                value: "SumAggregation@1"
              - id: System.Ai/SectionContent
                value: |-
                  Weighted sum aggregation with optional filtering.

                  | Property | Type | Default | Description |
                  |----------|------|---------|-------------|
                  | `targetPath` | string | required | Where to store sum |
                  | `aggregations` | array | required | Array of aggregation items |

                  Each aggregation item:
                  | Property | Type | Description |
                  |----------|------|-------------|
                  | `path` | string | Source objects path |
                  | `aggregationPath` | string | Path to numeric values |
                  | `value` | double | Multiplier/weight (use -1 for subtraction) |
                  | `filterPath` | string | Optional filter field path |
                  | `comparisonValue` | string | Optional filter value (string comparison) |

                  ```yaml
                  - type: SumAggregation@1
                    targetPath: $.total
                    aggregations:
                      - path: $.debits[*]
                        aggregationPath: $.Amount
                        value: 1
                      - path: $.credits[*]
                        aggregationPath: $.Amount
                        value: -1
                  ```
              - id: System.Ai/SortOrder
                value: 3
          - ckRecordId: System.Ai/WikiSection
