              - id: System.Ai/SourceAnchor
                value: "octo-claude-skills:skills/pipeline-expert/references/node-reference-mesh.md@ed34837086a08876780c01db5540a7cdb9389298#Extract Nodes > GetRtEntitiesByType@1"
