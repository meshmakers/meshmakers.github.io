      - id: System/RtBlueprintLocked
        value: false
      - id: System.Ai/VersionNumber
        value: 1
      - id: System.Ai/Title
        value: "SDK nodes: ForEach, For, If, Switch, Group and pipeline chaining"
      - id: System.Ai/PageKind
        value: 4  # Skill
      - id: System.Ai/PageSummary
        value: "Reference of the SDK control-flow nodes (ForEach, For, If, Switch, SelectByPath, Group), the polling and pipeline-data-event triggers, the load nodes ToPipelineDataEvent, ToWebhook and SetPipelineExecutionResult, and buffering."
      - id: System.Ai/VerificationStatus
        value: 2  # Verified (shipped and reviewed with the product)
      - id: System.Ai/Sections
        value:
          - ckRecordId: System.Ai/WikiSection
            attributes:
              - id: System.Ai/Heading
                value: "Control Flow"
              - id: System.Ai/SectionContent
                value: |-
                  ### ForEach@1

                  Iterate over array elements, execute child transformations per item.

                  | Property | Type | Default | Description |
                  |----------|------|---------|-------------|
                  | `iterationPath` | string | required | JSONPath to array to iterate |
                  | `keyPath` | string | `$.key` | Where current item is stored |
                  | `fullDocumentPath` | string | `$.full` | Where full original document is preserved |
                  | `mergePath` | string | `$.key` | Path to collect iteration result from |
                  | `targetPath` | string | `$` | Where to write collected results |
                  | `maxDegreeOfParallelism` | int | 0 | 0=CPU count, -1=unlimited, >0=explicit limit |
                  | `path` | string | `$` | Source path |
                  | `targetValueWriteMode` | enum | Overwrite | Overwrite/Append/Prepend/Merge |
                  | `targetValueKind` | enum | Simple | Simple/Array |
                  | `documentMode` | enum | Extend | Extend/Replace |
                  | `transformations` | array | required | Child nodes to execute per item |

                  ```yaml
                  - type: ForEach@1
                    iterationPath: $.Items
                    targetPath: $.Results
                    fullDocumentPath: $.full
                    keyPath: $.key
                    mergePath: $.key
                    maxDegreeOfParallelism: 4
                    transformations:
                      - type: SetPrimitiveValue@1
                        valuePath: $.key.Name
                        targetPath: $.key.processed
                  ```

                  ### For@1

                  Execute child nodes a specified number of times. Produces an array of outputs, one per iteration.

                  > **Context model:** For@1 **deep-clones the parent context** for each iteration. Unlike ForEach@1, it does NOT create `$.full`/`$.key` child paths. Inside For@1 child nodes, access data directly (e.g., `$.body.count`, NOT `$.full.body.count`).

                  | Property | Type | Default | Description |
                  |----------|------|---------|-------------|
                  | `count` | uint | optional | Static number of iterations. Used when `countPath` is not set |
                  | `countPath` | string | optional | JSONPath to dynamically resolve iteration count from data context. Takes precedence over `count` |
                  | `indexTargetPath` | string | optional | Path to store current 0-based index in each iteration's context |
                  | `path` | string | `$` | Source path |
                  | `targetPath` | string | `$` | Where to write results |
                  | `maxDegreeOfParallelism` | int | 0 | Parallelism control (0=CPU count, -1=unlimited, >0=explicit) |
                  | `transformations` | array | required | Child nodes per iteration |

                  > Either `count` or `countPath` should be provided. When both are set, `countPath` takes precedence. `countPath` must resolve to a non-negative integer; null or negative values cause a runtime error.

                  ```yaml
                  # Static count: run 4 times
                  - type: For@1
                    count: 4
                    targetPath: $.customers
                    transformations:
                      - type: Simulation@1
                        simulations:
                          - targetPath: $.customer.firstName
                            simulatorKey: Person.FirstName
                          - targetPath: $.customer.lastName
                            simulatorKey: Person.LastName

                  # Dynamic count: read iteration count from HTTP request body
                  - type: For@1
                    countPath: $.body.count
                    indexTargetPath: $.index
                    targetPath: $.results
                    transformations:
                      - type: FormatString@1
                        format: "Item-{$.index}"
                        targetPath: $.name
                  ```

                  ### If@1

                  Conditional execution — run child nodes only when condition is true.

                  | Property | Type | Default | Description |
                  |----------|------|---------|-------------|
                  | `path` | string | required | Path to value to compare |
                  | `operator` | enum | Equal | Equal, NotEqual, Contains, LessThan, LessEqualsThan, GreaterThan, GreaterEqualsThan, StartsWith, EndsWith, RegexMatch |
                  | `value` | object | optional | Static comparison value |
                  | `valuePath` | string | optional | Dynamic comparison value path |
                  | `valueType` | enum | optional | Type for comparison (String, Int, Double, Boolean, DateTime) |
                  | `transformations` | array | required | Child nodes to execute if true |

                  ```yaml
                  - type: If@1
                    path: $.key.Status
                    operator: Contains
                    value: REL
                    valueType: String
                    transformations:
                      - type: PrintDebug@1
                  ```

                  ### Switch@1

                  Multi-branch conditional — match value against cases.

                  | Property | Type | Default | Description |
                  |----------|------|---------|-------------|
                  | `path` | string | required | Path to value to switch on |
                  | `cases` | array | required | Array of case objects |
                  | `default` | array | optional | Transformations if no case matches |
                  | `valueType` | enum | String | Type for comparison |

                  Each case has `value` (single or array of values) and `transformations`.

                  ```yaml
                  - type: Switch@1
                    path: $.key.Type
                    valueType: Int
                    cases:
                      - value: 1
                        transformations:
                          - type: SetPrimitiveValue@1
                            value: "TypeA"
                            targetPath: $.key.label
                      - value: [2, 3]
                        transformations:
                          - type: SetPrimitiveValue@1
                            value: "TypeBC"
                            targetPath: $.key.label
                    default:
                      - type: SetPrimitiveValue@1
                        value: "Unknown"
                        targetPath: $.key.label
                  ```

                  ### SelectByPath@1

                  Select and transform multiple paths with independent configurations.

                  | Property | Type | Default | Description |
                  |----------|------|---------|-------------|
                  | `selectPath` | array | required | Array of path property configurations |

                  Each entry: `path`, `targetPath`, `targetValueWriteMode`, `targetValueKind`, `documentMode`, `transformations`.

                  ```yaml
                  - type: SelectByPath@1
                    selectPath:
                      - path: $.source1
                        targetPath: $.output1
                        targetValueWriteMode: Overwrite
                      - path: $.source2
                        targetPath: $.output2
                  ```

                  ### Group@1

                  A purely structural, no-op container for grouping nodes in the graphical editor (like a named region). It has **NO effect on the pipeline data or execution** — running nodes inside a Group is identical to listing them inline (children run in order on the same data context, no re-clone, no reallocation; enclosing ForEach `$.full` aliases stay visible). Nestable. The schema emits an `x-nodeKind: group` extension so the editor can collapse it.

                  | Property | Type | Default | Description |
                  |----------|------|---------|-------------|
                  | `transformations` | array | required | Grouped child nodes, executed in order on the same context |
                  | `name` | string | optional | Display label shown in the editor |

                  ```yaml
                  - type: Group@1
                    name: "Compute totals"
                    transformations:
                      - type: Math@1
                        # ...
                      - type: SumAggregation@1
                        # ...
                  ```

