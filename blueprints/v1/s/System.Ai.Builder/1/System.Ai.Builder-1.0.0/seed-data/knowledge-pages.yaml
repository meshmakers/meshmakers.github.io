  # nodes-mesh-entity-updates (version 1)
  - rtId: '68b0691357e93946678c17f8'
    ckTypeId: System.Ai/KnowledgePage
    rtWellKnownName: nodes-mesh-entity-updates
    attributes:
      - id: System/RtBlueprintLocked
        value: false
      - id: System.Ai/Title
        value: "Mesh Adapter nodes: building entity, association and record-array updates"
      - id: System.Ai/PageKind
        value: 4  # Skill
      - id: System.Ai/PageSummary
        value: "Reference of CreateUpdateInfo@1, CreateAssociationUpdate@1, FilterLatestUpdateInfo@1 and UpdateRecordArrayItem@1/@2 - the transform nodes that build the updates ApplyChanges writes."
      - id: System.Ai/VerificationStatus
        value: 2  # Verified (shipped and reviewed with the product)
      - id: System.Ai/Sections
        value:
          - ckRecordId: System.Ai/WikiSection
            attributes:
              - id: System.Ai/Heading
                value: "CreateUpdateInfo@1"
              - id: System.Ai/SectionContent
                value: |-
                  Create `EntityUpdateInfo` objects for database operations (Insert/Update/Delete).

