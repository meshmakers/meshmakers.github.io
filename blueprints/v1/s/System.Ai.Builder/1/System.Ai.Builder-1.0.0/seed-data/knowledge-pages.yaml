  - rtId: '68b0f05327f2feba95d6ff70'
    ckTypeId: System.Ai/KnowledgePageVersion
    rtWellKnownName: nodes-mesh-files-formats@1
    attributes:
      - id: System/RtBlueprintLocked
        value: false
      - id: System.Ai/VersionNumber
        value: 1
      - id: System.Ai/Title
        value: "Mesh Adapter nodes: files, CSV, Excel, ZIP and PDF"
      - id: System.Ai/PageKind
        value: 4  # Skill
      - id: System.Ai/PageSummary
        value: "Reference of the Mesh Adapter nodes that write and read the platform file system, compute file hashes, build ZIP archives, import and render CSV and delimited text, import Excel and extract PDF text with OCR."
      - id: System.Ai/VerificationStatus
        value: 2  # Verified (shipped and reviewed with the product)
      - id: System.Ai/Sections
        value:
          - ckRecordId: System.Ai/WikiSection
            attributes:
              - id: System.Ai/Heading
                value: "CreateFileSystemUpdate@1"
              - id: System.Ai/SectionContent
                value: |-
                  Create file system items with binary content. The file is created as `System.Files/FileSystemItem` under the `System.Files/FolderRoot` with the given well-known name. While a tenant is not migrated yet (file entities still `System.Reporting`), the root is looked up in `System.Reporting/FolderRoot` as fallback and the item is created as `System.Reporting/FileSystemItem`; pipeline configuration is identical. The result written to `targetPath` carries the `ckTypeId` actually used.

                  | Property | Type | Default | Description |
                  |----------|------|---------|-------------|
                  | `rtIdPath` | string | optional | JSONPath to RtId |
                  | `generateRtId` | bool | false | Auto-generate RtId |
                  | `fileName` | string | optional | Static file name |
                  | `fileNamePath` | string | optional | JSONPath to file name |
                  | `generateFileName` | bool | false | Auto-generate from content type |
                  | `contentType` | string | optional | MIME content type |
                  | `contentTypePath` | string | optional | JSONPath to content type |
                  | `contentLength` | long | optional | Static content length |
                  | `contentLengthPath` | string | optional | JSONPath to length |
                  | `rootFolderWellKnownName` | string | required | Well-known name of the folder root (`System.Files/FolderRoot`, fallback `System.Reporting/FolderRoot`) |
                  | `path` | string | `$` | Source path for base64 content (inherited) |
                  | `targetPath` | string | required | Where to write result |
              - id: System.Ai/SortOrder
                value: 0
          - ckRecordId: System.Ai/WikiSection
            attributes:
              - id: System.Ai/Heading
                value: "GetFileSystemContent@1"
              - id: System.Ai/SectionContent
                value: |-
                  Read the bytes of a stored file back into the pipeline (read counterpart of `CreateFileSystemUpdate@1`). Looks the item up as `System.Files/FileSystemItem` first and falls back to `System.Reporting/FileSystemItem` while the tenant is not migrated yet.

                  | Property | Type | Default | Description |
                  |----------|------|---------|-------------|
                  | `rtIdPath` | string | required | JSONPath to the RtId of the file item |
                  | `targetPath` | string | required | Where to write the base64 content |
                  | `fileNameTargetPath` / `contentTypeTargetPath` / `contentLengthTargetPath` | string | optional | Where to write file name, content type, byte length |
              - id: System.Ai/SortOrder
                value: 1
          - ckRecordId: System.Ai/WikiSection
            attributes:
              - id: System.Ai/Heading
                value: "CreateZipArchive@1 (persist mode)"
              - id: System.Ai/SectionContent
                value: "With `persistAsFileSystemItem: true` the ZIP is stored as a file item and its RtId (string) is written to `targetPath`. Props: `rootFolderWellKnownName` (required, folder root: `System.Files/FolderRoot`, fallback `System.Reporting/FolderRoot`), `fileName`/`fileNamePath`, `contentType` (default `application/zip`), `generateRtId` (default true). Type resolution is identical to `CreateFileSystemUpdate@1`."
              - id: System.Ai/SortOrder
                value: 2
          - ckRecordId: System.Ai/WikiSection
            attributes:
              - id: System.Ai/Heading
                value: "ComputeFileHash@1"
              - id: System.Ai/SectionContent
                value: |-
                  Compute a SHA-256 hash of base64-encoded file data.

                  | Property | Type | Default | Description |
                  |----------|------|---------|-------------|
                  | `path` | string | `$` | Source path for base64 file data |
                  | `targetPath` | string | required | Where to write the hex hash string |

                  ```yaml
                  - type: ComputeFileHash@1
                    path: $.fileData
                    targetPath: $.fileHash
                  ```
              - id: System.Ai/SortOrder
                value: 3
          - ckRecordId: System.Ai/WikiSection
            attributes:
              - id: System.Ai/Heading
                value: "ImportFromCsv@1"
              - id: System.Ai/SectionContent
                value: |-
                  Parse a CSV file and produce an array of typed objects. The file is sourced from `$.files[]` (populated by `FromHttpRequest@1` for multipart uploads).

                  | Property | Type | Default | Description |
                  |----------|------|---------|-------------|
                  | `fileIndex` | int | 0 | Index in `$.files[]` array |
                  | `delimiter` | string | `;` | Column delimiter character |
                  | `encoding` | string | `utf-8` | File encoding |
                  | `hasHeaderRow` | bool | true | Whether first data row is a header |
                  | `skipRows` | int | 0 | Number of rows to skip before header/data |
                  | `columnMappings` | array | required | Column-to-property mappings |
                  | `targetPath` | string | required | Where to write the parsed array |

                  Each `columnMapping`:
                  | Property | Type | Description |
                  |----------|------|-------------|
                  | `sourceColumn` | string | Source column name (matches header) |
                  | `sourceIndex` | int | Source column index (zero-based, alternative to name) |
                  | `targetProperty` | string | Output JSON property name |
                  | `dataType` | enum | `String`, `Int`, `Double`, `Boolean`, `DateTime` |
                  | `dateFormat` | string | Date format for DateTime parsing (e.g., `dd.MM.yyyy`) |
                  | `numberCulture` | string | Culture for number parsing (e.g., `de-AT`) |

                  ```yaml
                  - type: ImportFromCsv@1
                    fileIndex: 0
                    delimiter: ";"
                    hasHeaderRow: true
                    targetPath: $.rows
                    columnMappings:
                      - sourceColumn: OrderNumber
                        targetProperty: OrderNumber
                        dataType: String
                      - sourceColumn: Quantity
                        targetProperty: Quantity
                        dataType: Double
                        numberCulture: de-AT
                      - sourceColumn: Date
                        targetProperty: Date
                        dataType: DateTime
                        dateFormat: "dd.MM.yyyy"
                  ```
              - id: System.Ai/SortOrder
                value: 4
          - ckRecordId: System.Ai/WikiSection
            attributes:
              - id: System.Ai/Heading
                value: "ConvertToCsv@1"
              - id: System.Ai/SectionContent
                value: |-
                  Turn an array of records into ONE CSV document (text or base64). Generic: header row, RFC 4180 quoting, per-column number/date format, optional UTF-8 BOM and base64 output for nodes that store or attach a file. Mesh adapter. Sibling of `RenderDelimitedText@1` (fixed layouts, **no** quoting) — pick this one when you need real CSV.

                  | Property | Type | Default | Description |
                  |----------|------|---------|-------------|
                  | `path` | string | required | JSONPath of the source **array**; each element must be an object |
                  | `targetPath` | string | required | Receives the document (text, or base64 with `outputAsBase64`) |
                  | `delimiter` | string | `;` | Exactly one character; never a line break or `"` |
                  | `lineEnding` | enum | `CrLf` | `CrLf` or `Lf` (never taken from the OS) |
                  | `includeHeader` | bool | true | Header row first |
                  | `quoting` | enum | `Minimal` | `Minimal` (only values that need it), `Text` (strings, dates and header; numbers and booleans bare), `All` (every non-empty cell) |
                  | `trailingDelimiter` | bool | false | Every row, header included, ends with the delimiter |
                  | `trailingNewLine` | bool | true | Line end after the last row |
                  | `byteOrderMark` | bool | false | UTF-8 BOM in front (Excel needs it) |
                  | `outputAsBase64` | bool | false | Base64 of the UTF-8 bytes (BOM included) instead of text — the content `CreateFileSystemUpdate@1` stores as a file-system item; `SendEMail@2` then attaches the stored item by its BinaryId (it cannot attach base64 directly) |
                  | `contentLengthTargetPath` | string | — | Optional path for the byte length (a long) of the UTF-8 document |
                  | `culture` | string | invariant | Culture of all numbers and dates, e.g. `de-AT` (decimal comma, German day/month names); `""` = invariant; unknown culture fails the node |
                  | `columns` | array | all scalar properties | Output columns in order; an explicit empty list is an error |

                  Each `columns` entry:
                  | Property | Type | Description |
                  |----------|------|-------------|
                  | `header` | string | Header text; defaults to the last name of `valuePath` |
                  | `valuePath` | string | Relative, single-valued JSONPath (wildcard, filter, recursive descent are refused). Mutually exclusive with `value` |
                  | `value` | string | Constant text in every row (no `format`/`decimals`/`factor`/`timeZone`/`culture` on a constant) |
                  | `dataType` | enum | `Auto` (default), `String`, `Number`, `Boolean`, `DateTime` |
                  | `format` | string | .NET format string for Number / DateTime / Auto (`0.###`, `0.000`, `dd.MM.yyyy HH:mm`); an error on String and Boolean |
                  | `decimals` | int | 0–28, round half away from zero, before formatting |
                  | `factor` | decimal | Multiplied before rounding (unit conversion, e.g. `4`) |
                  | `timeZone` | string | IANA id, DateTime only; a value without an offset is read as **UTC** |
                  | `culture` | string | Overrides the node's culture for this column |
                  | `required` | bool | An empty cell fails the node |

                  Rules worth knowing:
                  - The column property is **`dataType`, not `type`** — `type` inside a pipeline definition is taken by the serializer and never reaches the column.
                  - A number without `format`/`decimals`/`factor` and without a culture keeps its raw JSON token (`0.50` stays `0.50`). `0.###` writes `14` and `0.546`; `0.000` writes `14.000`.
                  - A string source value is always **read** invariant (`"1234.5"` is 1234.5), whatever the output culture is.
                  - With a decimal comma use a delimiter other than `,`.
                  - An empty array writes a header-only document with explicit `columns`, an empty string without; the write is never skipped. A source that is not an array, or a record that is not an object, fails.

                  ```yaml
                  # Grid-operator layout: BOM, LF, quoted text, trailing ';', Vienna time, up to 3 decimals, kW = 4 x kWh
                  - type: ConvertToCsv@1
                    path: $.rows
                    targetPath: $.csv
                    contentLengthTargetPath: $.csvLength
                    lineEnding: Lf
                    quoting: Text
                    trailingDelimiter: true
                    byteOrderMark: true
                    outputAsBase64: true
                    columns:
                      - { header: Datum, valuePath: $.from, dataType: DateTime, format: "dd.MM.yyyy HH:mm", timeZone: Europe/Vienna }
                      - { header: kWh, valuePath: $.kwh, decimals: 3, format: "0.###" }
                      - { header: kW, valuePath: $.kwh, factor: 4, decimals: 3, format: "0.###" }
                      - { header: Status, value: VALID }
                  ```
              - id: System.Ai/SortOrder
                value: 5
          - ckRecordId: System.Ai/WikiSection
            attributes:
              - id: System.Ai/Heading
                value: "RenderDelimitedText@1"
              - id: System.Ai/SectionContent
                value: |-
                  Render an array of records into ONE delimited-text document for **fixed layouts** (reserved fields, no escaping convention). Mesh adapter. Use `ConvertToCsv@1` for real CSV with quoting.

                  | Property | Type | Default | Description |
                  |----------|------|---------|-------------|
                  | `path` | string | required | JSONPath of the source array; each element must be an object |
                  | `targetPath` | string | required | Receives the document as one string |
                  | `delimiter` | string | `\|` | Exactly one character |
                  | `lineEnding` | enum | `Lf` | `Lf` or `CrLf` |
                  | `trailingNewLine` | bool | true | Line end after the last row |
                  | `onDelimiterInValue` | enum | `Fail` | `Fail`, `Replace` or `Strip` for a value containing the delimiter, CR or LF |
                  | `replacement` | string | `""` | Substitute for `Replace` |
                  | `columns` | array | required | Entries with `value` (constant), `valuePath` (relative) or neither (empty reserved field), `required` |

                  **No quoting by design**; numbers keep their raw JSON token, booleans are `True`/`False`; an empty input array writes an empty string.
              - id: System.Ai/SortOrder
                value: 6
          - ckRecordId: System.Ai/WikiSection
            attributes:
              - id: System.Ai/Heading
                value: "ImportFromExcel@1"
              - id: System.Ai/SectionContent
                value: "Import hierarchical data from Excel files (TreePath or TreeColumn import)."
              - id: System.Ai/SortOrder
                value: 7
          - ckRecordId: System.Ai/WikiSection
            attributes:
              - id: System.Ai/Heading
                value: "PdfOcrExtraction@1"
              - id: System.Ai/SectionContent
                value: |-
                  Extract text and data from PDFs using OCR.

                  | Property | Type | Default | Description |
                  |----------|------|---------|-------------|
                  | `pageNumbers` | int[] | optional | Specific pages to process |
                  | `language` | string | `en` | OCR language (en, de, fr, es, it, pt, nl, ru, zh, ja, ko, ar) |
                  | `extractTables` | bool | false | Extract table data |
                  | `tablesOutputPath` | string | optional | Where to store tables |
                  | `extractBarcodes` | bool | false | Extract barcodes |
                  | `barcodesOutputPath` | string | optional | Where to store barcodes |
                  | `includeConfidence` | bool | false | Include OCR confidence score |
                  | `confidenceOutputPath` | string | optional | Where to store confidence |
                  | `continueOnError` | bool | false | Continue if extraction fails |
                  | `path` | string | `$` | Source path for base64 PDF (inherited) |
                  | `targetPath` | string | required | Where to write extracted text |
              - id: System.Ai/SortOrder
                value: 8
