    attributes:
      - id: System/RtBlueprintLocked
        value: false
      - id: System.Ai/Title
        value: "Mesh Adapter nodes: MCP tool calls and data point mappings"
      - id: System.Ai/PageKind
        value: 4  # Skill
      - id: System.Ai/PageSummary
        value: "Reference of McpToolCall@1, which calls a tool of the OctoMesh MCP server from a pipeline, and of the data point mapping nodes ApplyDataPointMappings, BuildMappingTargets, GenerateDataPointMappings and ValidateDataPointCoverage."
      - id: System.Ai/VerificationStatus
        value: 2  # Verified (shipped and reviewed with the product)
      - id: System.Ai/Sections
        value:
          - ckRecordId: System.Ai/WikiSection
            attributes:
              - id: System.Ai/Heading
                value: "McpToolCall@1"
              - id: System.Ai/SectionContent
                value: |-
                  Calls **one allowlisted tool** on the tenant's OctoMesh MCP service, deterministically — no model decides — as a configured **service account**. Use it for the write after an AI step: `AnthropicAiQuery@1` reads (optionally with MCP tools) and returns schema-valid JSON, then `McpToolCall@1` writes it through e.g. `knowledge_upsert_page`, so the tool's content guard and versioning apply.

                  | Property | Type | Default | Description |
                  |----------|------|---------|-------------|
                  | `allowedTools` | string[] | **required** | Exact MCP tool names this node may call. There is no "call any tool" mode |
                  | `toolName` | string | one of | The tool to call. Exactly one of `toolName` / `toolNamePath` |
                  | `toolNamePath` | string | one of | JSONPath to a string naming the tool (e.g. chosen earlier). Still checked against `allowedTools` |
                  | `argumentsPath` | string | optional | JSONPath to a JSON **object** sent as the tool arguments. Unset = `{}` |
                  | `executionIdArgument` | string | optional | Name of a top-level tool argument that receives the **id of the current pipeline execution** (GUID string), e.g. `runRef` for `knowledge_upsert_page`, so the page version references the exact run. Replaces an argument of the same name from `argumentsPath`. An empty name or one with leading/trailing spaces is a configuration error |
                  | `aiConfigurationName` | string | optional | `AiConfiguration` whose `mcpServerUrl` is used (recommended; needs a `Uses` association) |
                  | `mcpServerUrl` | string | optional | Fallback URL, e.g. `https://localhost:5017` locally. The tenant is appended: `{url}/{tenantId}/mcp` |
                  | `mcpServiceAccountConfigName` | string | **required** | `ServiceAccountConfiguration` the call runs as (e.g. `knowledge-curator`) |
                  | `targetPath` | string | `$` | Where the tool result is written: `structuredContent` if the tool sends it; else a **single** text content that starts with `{` or `[` parsed as JSON; else the text (several texts joined by newlines). A text like `42` or `true` stays a string |
                  | `timeoutSeconds` | int | 90 | Timeout of the MCP calls |
                  | `continueOnError` | bool | false | Continue when the **call** fails. Never applies to configuration errors or allowlist violations |

                  ```yaml
                  - type: AnthropicAiQuery@1
                    description: Generate the page as JSON (read-only tools)
                    apiKeyConfigurationName: AiConfig
                    promptTemplateName: knowledge-ingest
                    path: $.sourceText
                    responseFormat: json
                    jsonSchema: '{"type":"object","properties":{"slug":{"type":"string"},"title":{"type":"string"},"sections":{"type":"array","items":{"type":"object","properties":{"heading":{"type":"string"},"sectionContent":{"type":"string"},"sortOrder":{"type":"integer"}},"required":["heading","sectionContent","sortOrder"]}}},"required":["slug","title","sections"]}'
                    targetPath: $.page
                  - type: McpToolCall@1
                    description: Write the page as knowledge-curator
                    allowedTools: [knowledge_upsert_page]
                    toolName: knowledge_upsert_page
                    argumentsPath: $.page               # passed unchanged: keys must match the tool's parameters (slug, title, sections)
                    aiConfigurationName: AiConfig       # supplies McpServerUrl (Uses association)
                    mcpServiceAccountConfigName: knowledge-curator
                    executionIdArgument: runRef         # the page version records this execution's id
                    targetPath: $.write
                  ```

                  Behaviour:
                  - **Execution id:** `executionIdArgument` writes the id of the execution that runs the node. Every pipeline start has its own id, so in a pipeline started by `ToPipelineDataEvent@1` (e.g. a dedicated write pipeline) it is the called pipeline's id, not the caller's. Without an execution id the argument is sent unchanged and a warning is logged.
                  - **Before any network call** the node checks the configuration, the tool name against `allowedTools` (exact, case-sensitive), that the arguments are an object and that a URL resolves. A tool outside the list fails with *"MCP tool 'x' is not in this node's allowedTools [...]. The tool was not called."*
                  - **Fail-closed identity:** without a token for `mcpServiceAccountConfigName` the tool is never called — MCP is never called unauthenticated. The missing token counts as a call failure: with `continueOnError: false` the node fails; with `continueOnError: true` the pipeline continues **without the write**, so later nodes run although nothing was written. Credentials stay in the `ServiceAccountConfiguration` — never put a token or secret into the pipeline YAML. What the account may write is decided by its roles and the MCP service, not by the pipeline.
                  - **Errors:** a protocol error fails with *"MCP error {code} on tool 'x': {message}"* (e.g. `-32602` for unknown tool or invalid parameters); a tool that returns an error result fails with *"MCP tool 'x' returned an error: {text}"* (e.g. a content-guard refusal). Error messages never contain the token.
              - id: System.Ai/SortOrder
                value: 0
          - ckRecordId: System.Ai/WikiSection
            attributes:
              - id: System.Ai/Heading
                value: "ApplyDataPointMappings@1"
              - id: System.Ai/SectionContent
                value: |-
                  Evaluate `System.Communication/DataPointMapping` entities for a source entity, apply their mXparser expressions, and produce `EntityUpdateInfo` for the mapped target entities. Used for live data acquisition (e.g. Loxone control → target attribute).

                  Output: **one `EntityUpdateInfo` per target entity**, not one per mapping — mappings of the same source value onto the same target (e.g. `IsOn` and `DimmingLevel` of one luminaire on Loxone state `activeMoodsNum`) are merged into one update, and all items of one invocation share one `RtChangedDateTime`. A downstream `SaveStreamDataInArchive@1` therefore writes one row per entity and state change. Older adapter versions emitted one update per mapping (duplicate archive rows a few ms apart).

                  | Property | Type | Default | Description |
                  |----------|------|---------|-------------|
                  | `sourceRtIdPath` | string | optional | JSONPath to the source entity's RtId |
                  | `sourceCkTypeIdPath` | string | optional | JSONPath to the source entity's CkTypeId |
                  | `sourceValuePath` | string | optional | JSONPath to the polled source value — the default mapping input and the `value` variable in expressions |
                  | `sourceStateNamePath` | string | optional | JSONPath to the incoming state name. When set, only mappings whose `SourceAttributePath` equals it are applied (multi-state sources like Loxone controls). If unset, all mappings for the source are applied |
                  | `targetPath` | string | required | Where to write the produced update items |
              - id: System.Ai/SortOrder
                value: 1
          - ckRecordId: System.Ai/WikiSection
            attributes:
              - id: System.Ai/Heading
                value: "BuildMappingTargets@1"
              - id: System.Ai/SectionContent
                value: |-
                  Resolve all active DataPointMappings into `MappingTarget` records (external identifiers) so an external adapter can acquire data. Generic for Loxone/MQTT/OPC-UA/Modbus. Each target is a plain identifier, or a `identifier|stateName|stateId` triple for sub-state sources.

                  | Property | Type | Default | Description |
                  |----------|------|---------|-------------|
                  | `sourceCkTypeId` | string | required | CkTypeId of the source entities mappings map from (e.g. `Loxone/Control`) |
                  | `sourceIdentifierAttribute` | string | required | Attribute on the source holding the external id (e.g. `LoxoneUuid`) |
                  | `statesAttribute` | string | optional | RecordArray attribute holding sub-states; enables triple output |
                  | `stateKeyAttribute` | string | optional | State-name attribute within each state record (required when `statesAttribute` is set) |
                  | `stateValueAttribute` | string | optional | State-id/UUID attribute within each state record (required when `statesAttribute` is set) |
                  | `defaultAttributePath` | string | `currentValue` | Attribute path that maps to the main value; produces a plain identifier |
                  | `targetPath` | string | required | Where to write the target list |
              - id: System.Ai/SortOrder
                value: 2
          - ckRecordId: System.Ai/WikiSection
            attributes:
              - id: System.Ai/Heading
                value: "GenerateDataPointMappings@1"
              - id: System.Ai/SectionContent
                value: |-
                  Deterministic, rule-based DataPointMapping suggestion generator — the **non-AI alternative to `AnthropicAiQuery@1`** for mapping generation (the output shape is identical, so the downstream GetOrCreate + CreateUpdateInfo + CreateAssociationUpdate pipeline consumes either). Matches source containers to targets by name/normalized/regex/manual strategy, walks the hierarchy to reach controls, and evaluates control rules per (rule, state) pair.

                  Key config: `sourceContainerCkTypeId`, `sourceControlCkTypeId` (required); optional `sourceCategoryCkTypeId`, `hierarchyAssociationRoleId` (default `System/ParentChild`); `targetCkTypeId` (required); `statesAttribute` (default `States`), `stateNameAttribute` (default `Name`), `defaultSourceAttributePath` (default `CurrentValue`); `containerMatchingStrategies` (ordered, first match wins: `ExactName`/`NormalizedName`/`Regex`/`Manual`); `controlMappingRules` (each `{id, when{controlType,stateName,categoryType,categoryNameRegex,controlNameRegex}, map{targetAttribute,expression,childTargetCkTypeId,childTargetAssociationRoleId}}`); optional `statisticsTargetPath`; `targetPath` (required). Read the config source for the full strategy/rule shapes before authoring rules.
              - id: System.Ai/SortOrder
                value: 3
          - ckRecordId: System.Ai/WikiSection
            attributes:
              - id: System.Ai/Heading
                value: "ValidateDataPointCoverage@1"
              - id: System.Ai/SectionContent
                value: |-
                  Traverse a tree hierarchy and, for every node, evaluate which target attribute paths are covered by inbound `MapsTo` DataPointMappings against per-CK-type `CoverageRule` profiles. Emits a JSON report (per-node `status`: ok/warning/error/info) suitable for persisting via `SetPipelineExecutionResult@1` so the Studio can colour-code the tree.

                  Key config: `rootRtId` or `rootRtIdPath`, `rootCkTypeId` (required); `childRoleId` (default `System/ParentChild`), `childCkTypeId` (default `Basic/TreeNode`), `maxDepth` (default 16); `mappingRoleId` (default `System.Communication/MapsTo`), `mappingCkTypeId` (default `System.Communication/DataPointMapping`), `includeDisabledMappings` (default false); `rules` (list of `CoverageRule {ckTypeId, requiredAttributes[], recommendedAttributes[], requiredAssociations[{associationRoleId, targetCkTypeId}]}`); `targetPath` (required).
              - id: System.Ai/SortOrder
                value: 4
